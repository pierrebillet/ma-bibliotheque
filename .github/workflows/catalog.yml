name: Mettre à jour le catalogue

on:
  push:
    branches:
      - main
    paths:
      - "livres/**"
      - "couvertures/**"
      - "scripts/**"
      - "index.html"
  pull_request:
    paths:
      - "livres/**"
      - "couvertures/**"
      - "scripts/**"
      - "tests/**"
      - "catalog.json"
      - "index.html"
      - "sitemap.xml"
  workflow_dispatch:

# Moindre privilège : lecture seule par défaut, le job `catalogue` (le seul qui
# committe et déclenche Pages) élève ses permissions localement.
permissions:
  contents: read

concurrency:
  group: catalogue-${{ github.ref }}
  # Sur une pull request, un nouveau push rend les runs précédents obsolètes :
  # on les annule. Jamais d'annulation sur main (le run committe le catalogue).
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Vérification sans commit pour les pull requests : donne un retour CI aux
  # contributions (agents inclus) avant merge. Échoue notamment si un
  # identifiant de livre est hors convention (le script sort en erreur).
  verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer la branche de la pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # fetch-depth: 0 est porteur : l'ordre du catalogue dérive des dates
          # d'ajout git (git log --diff-filter=A). Un clone shallow tronquerait
          # ces dates et réordonnerait silencieusement toute la page d'accueil.
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Tests unitaires du générateur
        run: python -m unittest discover -s tests -v

      - name: Vérifier la génération du catalogue, du bloc demo et du sitemap
        run: |
          cp index.html /tmp/index-verification.html
          python scripts/build_catalog.py \
            --output /tmp/catalog-verification.json \
            --sync-demo-catalog --index /tmp/index-verification.html \
            --sitemap /tmp/sitemap-verification.xml \
            --base-url "https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Vérifier que les fichiers générés n'ont pas été édités à la main
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # catalog.json, sitemap.xml et le bloc #demo-catalog appartiennent au
          # bot : ils sont régénérés automatiquement après chaque merge sur
          # main. Une pull request ne doit pas les modifier (le reste
          # d'index.html reste librement modifiable). origin/$BASE_REF est déjà
          # présent grâce au checkout fetch-depth: 0.
          statut=0

          for fichier in catalog.json sitemap.xml; do
            if ! git diff --quiet "origin/$BASE_REF"...HEAD -- "$fichier"; then
              echo "::error file=${fichier}::Cette pull request modifie ${fichier}. Ne pas l'éditer à la main : il est régénéré automatiquement après le merge sur main."
              statut=1
            else
              echo "${fichier} n'est pas modifié par cette pull request."
            fi
          done

          extract_demo_block() {
            git show "$1:index.html" | python3 -c '
          import re, sys
          match = re.search(r"<script\b[^>]*\bid=\"demo-catalog\"[^>]*>(.*?)</script>", sys.stdin.read(), re.DOTALL)
          sys.stdout.write(match.group(1) if match else "")
          '
          }
          if ! diff <(extract_demo_block "origin/$BASE_REF") <(extract_demo_block HEAD) > /dev/null; then
            echo "::error file=index.html::Cette pull request modifie le bloc #demo-catalog. Ne pas l'éditer à la main : il est resynchronisé automatiquement après le merge sur main."
            statut=1
          else
            echo "Le bloc #demo-catalog n'est pas modifié par cette pull request."
          fi

          exit "$statut"

  catalogue:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write

    steps:
      - name: Récupérer la version la plus récente de main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          # fetch-depth: 0 est porteur : l'ordre du catalogue dérive des dates
          # d'ajout git (git log --diff-filter=A). Un clone shallow tronquerait
          # ces dates et réordonnerait silencieusement toute la page d'accueil.
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Générer catalog.json, le bloc demo-catalog et sitemap.xml
        run: |
          python scripts/build_catalog.py --sync-demo-catalog \
            --sitemap sitemap.xml \
            --base-url "https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Détecter une modification du catalogue
        id: catalogue-diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- catalog.json index.html sitemap.xml)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Committer le catalogue
        if: steps.catalogue-diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog.json index.html sitemap.xml
          git commit -m "chore: met à jour le catalogue (catalog.json, bloc demo, sitemap) [skip ci]"
          for tentative in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push refusé (tentative ${tentative}/3) : rebase sur origin/main puis nouvel essai."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::Impossible de pousser le commit du catalogue après 3 tentatives."
          exit 1

      # Un commit poussé avec GITHUB_TOKEN ne déclenche pas automatiquement
      # le build GitHub Pages. Cette requête lance explicitement le build de
      # la source configurée en mode « Deploy from a branch ».
      - name: Demander la reconstruction GitHub Pages
        if: steps.catalogue-diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
