name: Mettre à jour le catalogue

on:
  push:
    branches:
      - main
    paths:
      - "livres/**"
      - "couvertures/**"
      - "scripts/**"
      - "index.html"
  pull_request:
    paths:
      - "livres/**"
      - "couvertures/**"
      - "scripts/**"
      - "catalog.json"
      - "index.html"
      - "sitemap.xml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: catalogue-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Vérification sans commit pour les pull requests : donne un retour CI aux
  # contributions (agents inclus) avant merge. Échoue notamment si un
  # identifiant de livre est hors convention (le script sort en erreur).
  verification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Récupérer la branche de la pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vérifier la génération du catalogue, du bloc demo et du sitemap
        run: |
          cp index.html /tmp/index-verification.html
          python scripts/build_catalog.py \
            --output /tmp/catalog-verification.json \
            --sync-demo-catalog --index /tmp/index-verification.html \
            --sitemap /tmp/sitemap-verification.xml \
            --base-url "https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Vérifier que catalog.json n'a pas été édité à la main
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # catalog.json appartient au bot : il est régénéré automatiquement
          # après le merge sur main. Une pull request ne doit pas le modifier.
          git fetch origin "$BASE_REF"
          if ! git diff --quiet "origin/$BASE_REF"...HEAD -- catalog.json; then
            echo "::error file=catalog.json::Cette pull request modifie catalog.json. Ne pas l'éditer à la main : il est régénéré automatiquement après le merge sur main."
            exit 1
          fi
          echo "catalog.json n'est pas modifié par cette pull request."

      - name: Vérifier que sitemap.xml n'a pas été édité à la main
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # sitemap.xml appartient au bot : il est régénéré automatiquement
          # après le merge sur main. Une pull request ne doit pas le modifier.
          git fetch origin "$BASE_REF"
          if ! git diff --quiet "origin/$BASE_REF"...HEAD -- sitemap.xml; then
            echo "::error file=sitemap.xml::Cette pull request modifie sitemap.xml. Ne pas l'éditer à la main : il est régénéré automatiquement après le merge sur main."
            exit 1
          fi
          echo "sitemap.xml n'est pas modifié par cette pull request."

      - name: Vérifier que le bloc demo-catalog n'a pas été édité à la main
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Le bloc #demo-catalog appartient au bot : il est resynchronisé
          # automatiquement après le merge sur main. Le reste d'index.html
          # reste librement modifiable.
          git fetch origin "$BASE_REF"
          extract_demo_block() {
            git show "$1:index.html" | python3 -c '
          import re, sys
          match = re.search(r"<script\b[^>]*\bid=\"demo-catalog\"[^>]*>(.*?)</script>", sys.stdin.read(), re.DOTALL)
          sys.stdout.write(match.group(1) if match else "")
          '
          }
          if ! diff <(extract_demo_block "origin/$BASE_REF") <(extract_demo_block HEAD) > /dev/null; then
            echo "::error file=index.html::Cette pull request modifie le bloc #demo-catalog. Ne pas l'éditer à la main : il est resynchronisé automatiquement après le merge sur main."
            exit 1
          fi
          echo "Le bloc #demo-catalog n'est pas modifié par cette pull request."

  catalogue:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer la version la plus récente de main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Générer catalog.json, le bloc demo-catalog et sitemap.xml
        run: |
          python scripts/build_catalog.py --sync-demo-catalog \
            --sitemap sitemap.xml \
            --base-url "https://${GITHUB_REPOSITORY%%/*}.github.io/${GITHUB_REPOSITORY#*/}/"

      - name: Détecter une modification du catalogue
        id: catalogue-diff
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- catalog.json index.html sitemap.xml)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Committer le catalogue
        if: steps.catalogue-diff.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- catalog.json index.html sitemap.xml
          git commit -m "chore: met à jour le catalogue (catalog.json, bloc demo, sitemap) [skip ci]"
          for tentative in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push refusé (tentative ${tentative}/3) : rebase sur origin/main puis nouvel essai."
            git pull --rebase origin main
            sleep 5
          done
          echo "::error::Impossible de pousser le commit du catalogue après 3 tentatives."
          exit 1

      # Un commit poussé avec GITHUB_TOKEN ne déclenche pas automatiquement
      # le build GitHub Pages. Cette requête lance explicitement le build de
      # la source configurée en mode « Deploy from a branch ».
      - name: Demander la reconstruction GitHub Pages
        if: steps.catalogue-diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          curl --fail-with-body --location --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
