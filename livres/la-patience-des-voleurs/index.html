     "text": "On y descendait par un escalier de bois raide comme une échelle, qui s’enfonçait dans la glace depuis la chaufferie. Il faisait chaud en haut, près des chaudières, où deux garçons en maillot enfournaient du charbon du Midi à la pelle ; il faisait froid en bas. La citerne était une salle ronde creusée à quatre toises sous la rue, grande comme une chapelle, aux parois de glace bleue polies par l’eau, et au milieu il y avait un grand réservoir de cuivre où arrivaient, par des tuyaux gainés de feutre, l’eau chaude des chaudières et l’eau froide de la glace fondue. Des lanternes pendaient à des crochets vissés dans les murs. Tout brillait. On se serait cru à l’intérieur d’une pierre précieuse.",
     "mentions": []
    },
    {
     "id": "c4-b62",
     "text": "— Et ça, dit Pétronille en montrant un trou rond dans le sol, à l’autre bout de la salle, c’est par là que je rends l’eau.",
     "mentions": []
    },
    {
     "id": "c4-b63",
     "text": "Isaure s’approcha. Le trou était large comme une roue de charrette, bordé d’une margelle de planches, et il descendait tout droit dans le noir. On entendait, très loin en dessous, un grondement sourd, régulier, comme celui d’une foule dans une grande salle.",
     "mentions": []
    },
    {
     "id": "c4-b64",
     "text": "— Un moulin, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b65",
     "text": "— Les Étuves boivent dans un moulin depuis vingt-six ans, dit Pétronille avec fierté. C’est pour ça qu’on les a bâties là. Toute l’eau des bassins, toute l’eau de la glace qu’on fond, ça descend là-dedans et ça va rejoindre la grande eau, sous la Coulée, qui file à la mer par-dessous. Personne ne sait jusqu’où ça descend. Un jour, un de mes chauffeurs a laissé tomber une pelle. On ne l’a jamais entendue arriver.",
     "mentions": []
    },
    {
     "id": "c4-b66",
     "text": "La lance était posée contre le mur, et Isaure mit un moment à comprendre que c’était cela : un long tube de cuivre, de la longueur d’une gaffe, emmanché de bois pour qu’on puisse le tenir, et terminé par un bec étroit comme celui d’une théière. Un tuyau de cuir le reliait au réservoir, avec, entre les deux, une pompe à bras. Pétronille prit la lance comme on prend une lance, justement, cala le manche sous son bras, fit signe à Constant, qui se mit à pomper, et dirigea le bec contre le mur de glace.",
     "mentions": []
    },
    {
     "id": "c4-b67",
     "text": "Il en sortit un jet d’eau fumante, fin comme une aiguille, qui frappa la glace avec un sifflement. La glace se mit à fondre sous le jet comme du beurre sous une lame chaude. En quelques instants, il y avait un trou, puis le trou devint une cavité, et l’eau de la fonte ruisselait vers le moulin, et la vapeur montait, et Pétronille avançait la lance d’un pouce, puis d’un autre, en la faisant tourner doucement pour élargir le trou. Au bout d’un quart d’heure, elle arrêta. Constant lâcha la pompe, hors d’haleine. Dans le mur de glace, il y avait un trou rond, lisse, profond d’un pied, large comme une tête d’homme.",
     "mentions": []
    },
    {
     "id": "c4-b68",
     "text": "— Un pied en un quart d’heure, dit Pétronille. Pour un tunnel où un homme passe à quatre pattes en tirant un cercueil, il faut compter une toise en deux nuits. Peut-être trois. Ça dépend de la glace. La vieille glace, la bleue, elle est plus dure. Elle a été serrée plus longtemps.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "— Et le bruit ? demanda Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b70",
     "text": "— Quel bruit ? La pompe ? Les chaudières font dix fois plus de bruit, et elles marchent jour et nuit. L’eau ? Elle va au moulin, comme toute l’eau des Étuves. La vapeur ? Il y a de la vapeur partout ici, ma fille. C’est même le seul endroit de Demeure où personne ne remarquera de la vapeur.",
     "mentions": []
    },
    {
     "id": "c4-b71",
     "text": "— Et le charbon ?",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "Pétronille ouvrit la bouche, la referma et regarda Constant.",
     "mentions": []
    },
    {
     "id": "c4-b73",
     "text": "— Elle pense à tout, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b74",
     "text": "— C’est pour ça qu’on l’a prise, dit Constant.",
     "mentions": []
    },
    {
     "id": "c4-b75",
     "text": "Ils remontèrent dans le bureau aux serviettes, et Constant dessina le plan au charbon de bois sur la table, parce qu’on pouvait l’effacer d’un revers de manche. Les Étuves, la citerne, le moulin. Au-delà, un rectangle qu’il hachura : la glacière basse de la Régence, à laquelle on ne toucherait pas. Entre les deux, un petit ovale : Clémence. De la citerne à l’ovale, une ligne droite, et Isaure prit le charbon et corrigea la ligne, parce qu’elle n’était pas droite, et parce qu’elle ne devait pas l’être : il faudrait contourner une ancienne poche d’eau regelée qu’on voyait sur le plan des creusements, et monter en pente douce, un pied par toise, pour que l’eau s’écoule d’elle-même vers la citerne. Constant la regarda faire sans rien dire, et quand elle eut fini, il effaça sa propre ligne avec le pouce.",
     "mentions": []
    },
    {
     "id": "c4-b76",
     "text": "— Six toises et demie, dit Isaure. Une toise en deux nuits dans le meilleur cas, trois dans le pire. Il faut commencer le 1er mars au plus tard. On arrive à elle entre le 13 et le 18. Elle affleure le 19 dans leur mur. On a un jour de marge. Peut-être.",
     "mentions": []
    },
    {
     "id": "c4-b77",
     "text": "— On la sort la nuit du 18, dit Constant. Rendue à l’aube du 19. Pour la Régence, le Remis n’arrivera jamais : il aura été mal calculé. Ce sont des choses qui arrivent.",
     "mentions": []
    },
    {
     "id": "c4-b78",
     "text": "— Pas au Bureau, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b79",
     "text": "— Pas avec vous, reconnut-il.",
     "mentions": []
    },
    {
     "id": "c4-b80",
     "text": "— Et la Couronne, après ? demanda Pétronille. On la met où, pour la vendre ?",
     "mentions": []
    },
    {
     "id": "c4-b81",
     "text": "— Un acheteur du Midi arrive avec les premiers bateaux du printemps, dit Constant sans lever les yeux du plan. J’ai écrit de la Tour, il y a un an. On a correspondu. C’est un homme qui aime les belles choses et qui ne pose pas de questions. Il la prendra au Port-Fixe et elle partira vers le soleil.",
     "mentions": []
    },
    {
     "id": "c4-b82",
     "text": "Isaure le regarda. Il était penché sur son plan au charbon, calme, précis, un vieil homme en manches de chemise qui calculait le poids d’un cercueil et la largeur d’un tunnel, et il n’y avait rien dans sa voix qui sonnât faux ; et pourtant elle eut, l’espace d’un instant, la sensation qu’on a sur la glace quand un pont de neige, sous le pied, cède d’un demi-pouce et tient.",
     "mentions": []
    },
    {
     "id": "c4-b83",
     "text": "Le 28 février, Maître Bastide l’appela dans son cabinet. Il tenait à la main une lettre à en-tête, cachetée d’un sceau de cire grise où l’on voyait, sous une couronne vide, les mots « En attendant ».",
     "mentions": []
    },
    {
     "id": "c4-b84",
     "text": "— La Régence nous demande un relevé d’affleurement, dit-il. Un Remis doit percer dans la glacière basse du palais vers le 19 mars. Numéro 58 de l’an 571. Le majordome veut savoir exactement où et quand, pour ne pas avoir de mort dans son vin le soir du bal. Demande ordinaire. Nous en faisons quarante par an.",
     "mentions": []
    },
    {
     "id": "c4-b85",
     "text": "Il posa la lettre sur son bureau et la regarda comme on regarde un relevé mal fait.",
     "mentions": []
    },
    {
     "id": "c4-b86",
     "text": "— Ce qui ne l’est pas, c’est le post-scriptum. De la main de l’Intendante de la Sûreté. Elle demande que le relevé soit confié à la Jalonneuse Sorbier. « Dont la précision est connue. »",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "La glacière basse",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "Le palais de la Régence se préparait au bal. Dans le grand vestibule, des tapissiers montés sur des échelles accrochaient des guirlandes de sapin d’importation, qui coûtaient plus cher au pied que le bois de charpente ; des valets déroulaient des tapis ; une femme en tablier noir comptait des verres à voix haute et recommençait chaque fois qu’on lui parlait. Partout, sur les tentures, sur les cartons des invitations empilés dans un coin, sur les menus que deux copistes calligraphiaient à une table, revenait la même formule en lettres d’or. Isaure lut en passant, sur un menu encore frais : « Sorbet de camarine au miel des Parois, en attendant la Couronne ».",
     "mentions": []
    },
    {
     "id": "c5-b02",
     "text": "Elle avait apporté ses instruments dans un sac de toile : la chaîne courte, le niveau à bulle, la boussole de poche, une douzaine de fiches de fer pour planter dans la glace, le carnet, les crayons, et la petite lunette que sa mère lui avait laissée. Le majordome, un homme poudré à qui l’on aurait donné un âge s’il n’avait pas été si soigneusement coiffé, la reçut avec la politesse qu’on réserve aux fournisseurs, lui demanda si elle avait bien essuyé ses bottes, et s’interrompit au milieu de sa phrase.",
     "mentions": []
    },
    {
     "id": "c5-b03",
     "text": "L’Intendante descendait le grand escalier.",
     "mentions": []
    },
    {
     "id": "c5-b04",
     "text": "— Je m’en occupe, monsieur Aubépin, dit-elle. Merci. Allez voir vos verres.",
     "mentions": []
    },
    {
     "id": "c5-b05",
     "text": "Elle avait toujours son manteau gris et ses gants à la main. Elle salua Isaure d’une inclinaison de tête, lui prit son sac des mains avant qu’elle ait pu protester — « Vous porterez les instruments délicats, je porte le reste » — et l’emmena vers une petite porte, derrière l’escalier, qui ouvrait sur un autre escalier, étroit, de pierre d’abord, puis de bois, puis de glace.",
     "mentions": []
    },
    {
     "id": "c5-b06",
     "text": "Il y avait trois glacières sous la Régence, l’une sous l’autre, comme les étages d’une maison renversée. La première, la glacière haute, servait aux blocs qu’on taillait pour la table et qu’on revendait aux maisons voisines. La deuxième gardait les vins, sur des râteliers de bois où chaque bouteille avait son étiquette et son âge. La troisième était la glacière basse. On y descendait par une échelle, et une vieille femme en fourrures, qui tenait une lanterne, attendait en bas comme elle devait attendre depuis vingt-six ans.",
     "mentions": []
    },
    {
     "id": "c5-b07",
     "text": "— La mère Gonthier, dit l’Intendante. Elle garde les glacières depuis le premier jour. Elle ne dira rien à personne de ce que nous allons voir. Elle ne dit jamais rien.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "La vieille femme fit une petite révérence et leva sa lanterne.",
     "mentions": []
    },
    {
     "id": "c5-b09",
     "text": "La glacière basse était une salle longue, à peine plus haute qu’un homme, creusée au ciseau dans la glace vieille, et tout y était bleu. Les murs étaient bleus, le plafond était bleu, et la lumière de la lanterne, en s’y enfonçant, devenait bleue elle aussi, d’un bleu qui semblait venir de très loin derrière les murs, comme la lumière d’une autre salle, plus grande, qu’on ne voyait pas. On y avait entreposé pour le bal des tonnelets de beurre, des jambons, des gibiers pendus par les pattes, et, le long d’un mur, trois grands blocs de glace pure qu’un sculpteur viendrait tailler la veille en forme de cygnes. Il faisait froid à fendre les pierres.",
     "mentions": []
    },
    {
     "id": "c5-b10",
     "text": "— Le mur aval, dit l’Intendante. C’est bien celui-là ?",
     "mentions": []
    },
    {
     "id": "c5-b11",
     "text": "Isaure prit la lanterne des mains de la mère Gonthier et s’approcha du mur qui regardait vers le Front.",
     "mentions": []
    },
    {
     "id": "c5-b12",
     "text": "Au début, elle ne vit rien que du bleu, un bleu épais, strié de fines bulles alignées comme des perles sur un fil, qui marquaient les années. Puis ses yeux s’habituèrent. Et elle la vit : à deux pieds derrière la surface du mur, à un pied au-dessus du sol, légèrement inclinée, une forme longue et sombre. Un cercueil. Il était pris dans la glace comme une mouche dans l’ambre, et parfaitement net ; on distinguait les planches, les ferrures des coins, la ligne du couvercle, et, à la tête, un petit rectangle plus clair qui devait être la plaque. La lumière de la lanterne tremblait sur le bois noirci. On aurait dit qu’il bougeait. Il ne bougeait pas, bien sûr ; ou plutôt il bougeait d’un pouce par semaine, comme tout le reste, et c’était pire.",
     "mentions": []
    },
    {
     "id": "c5-b13",
     "text": "— Elle est là depuis l’automne, dit la mère Gonthier, et c’étaient les premiers mots qu’elle prononçait. Au début, on ne voyait qu’une ombre. Maintenant, on la voit bien. Je lui dis bonjour le matin.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "Isaure posa la lanterne à terre. Elle ne tremblait pas ; c’était une chose qu’elle avait remarquée chez elle depuis l’enfance, que ses mains ne tremblaient pas quand il y avait du travail. Elle planta ses fiches dans la glace du mur, trois au-dessus du cercueil, trois à côté, les mesura à la chaîne depuis les angles de la salle, prit l’aplomb, prit le niveau, releva à la boussole l’orientation de la forme sombre, la mesura à travers la glace en visant de deux points, comme on mesure un bateau depuis le rivage. Elle nota tout dans le carnet. L’Intendante la regardait faire sans rien dire, les mains derrière le dos, et Isaure sentait ce regard sur sa nuque comme un courant d’air.",
     "mentions": []
    },
    {
     "id": "c5-b15",
     "text": "— Quand ? demanda enfin l’Intendante.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— Le 19. Entre l’aube et midi. Là.",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "Elle montra du crayon un point du mur, à un pied au-dessus du sol. C’était la vérité. Elle l’avait calculé dans la nuit du 23 au 24 février, elle venait de le vérifier, et elle n’aurait pas su dire autre chose.",
     "mentions": []
    },
    {
     "id": "c5-b18",
     "text": "— Merci, dit l’Intendante. Monsieur Aubépin sera content. Il pourra donner son bal sans morts dans ses sorbets.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "Elle reprit la lanterne, et au lieu de la lever vers l’échelle, elle la leva vers le cercueil, et le regarda un long moment.",
     "mentions": []
    },
    {
     "id": "c5-b20",
     "text": "— Clémence Mérel, dit-elle. Née Aubrac. Vingt-neuf ans. Jalonneuse de première classe. Décédée le 2 mars 571, de consomption. Remise le 4.",
     "mentions": []
    },
    {
     "id": "c5-b21",
     "text": "Isaure ne dit rien.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "— Vous avez signé le cahier des consultations le 23 février à vingt-deux heures quarante, reprit l’Intendante sans se retourner. M. Grivel a un cousin dans mes services ; il lit beaucoup, M. Grivel, et il parle encore plus. Je suis allée lire la ligne moi-même. Et j’ai relu le dossier de mon ancien maître, que la Sûreté conserve depuis quarante ans aux archives sous l’étiquette « fantaisies », à côté des serpents de mer et des monnaies du Midi qui changent de poids la nuit. L’inspecteur Vauclair avait demandé, en 571, l’ouverture de trois cercueils. Ce n’est pas une fantaisie. C’est un calcul. Il avait raison il y a quarante et un ans, et personne ne l’a écouté. Je l’écoute aujourd’hui. Il ne le saura jamais, parce qu’il ne m’adresse plus la parole.",
     "mentions": []
    },
    {
     "id": "c5-b23",
     "text": "Elle se retourna. Dans la lumière bleue, son visage avait l’air sculpté dans la même glace que les murs.",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "— Le voleur sort ; sa femme affleure chez nous le mois même ; la Jalonneuse qu’il a choisie consulte sa ligne le lendemain. Je ne crois pas aux coïncidences, mademoiselle Sorbier. Je crois aux calculs, comme vous. Le 19, quand ce cercueil sortira du mur, je serai là, avec un greffier, deux gardes et un représentant du Prieur, et je l’ouvrirai.",
     "mentions": []
    },
    {
     "id": "c5-b25",
     "text": "— Nul n’ouvre un Remis.",
     "mentions": []
    },
    {
     "id": "c5-b26",
     "text": "— Toutes les règles de cette ville ont un dernier article qu’on n’imprime pas, dit l’Intendante. Il s’appelle le Régent. Il a déjà signé.",
     "mentions": []
    },
    {
     "id": "c5-b27",
     "text": "Elle posa la lanterne sur un tonnelet de beurre, entre elles deux, et remit enfin ses gants, lentement, doigt par doigt.",
     "mentions": []
    },
    {
     "id": "c5-b28",
     "text": "— Je vais vous dire une chose, et vous la répéterez à M. Mérel si vous voulez, parce que je n’ai rien à lui cacher. Je ne veux pas de cette Couronne. Je ne l’ai jamais voulue. Je veux qu’elle ne revienne pas. Une couronne qui revient, dans une ville qui a vécu quarante et un ans sans elle, ce n’est pas un bijou, c’est une guerre : les Frimas qui ont des cousins, la Compagnie qui a des créances, le Conseil qui a des ambitions, et au milieu des gens comme vous et comme la mère Gonthier, qui voudraient seulement que les pilotis tiennent et que le pain soit cuit. Je l’ouvrirai, ce cercueil, et ce que j’y trouverai n’en ressortira jamais. Et la morte aura ce qu’elle voudra. Une Rendue. Des chants. M. Mérel aura même son droit de visage, s’il le demande. Il l’aura ici, dans ma cave.",
     "mentions": []
    },
    {
     "id": "c5-b29",
     "text": "Elle reprit le sac de toile.",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "— Je vous raccompagne. Vous avez fait un travail parfait, et M. Aubépin vous doit trois écus.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "Ils se retrouvèrent le soir dans le bureau aux serviettes. Isaure raconta tout, dans l’ordre, avec les chiffres. Pétronille jura, ce qui ne changeait rien. Tobie ne dit rien et devint très pâle. Constant écouta jusqu’au bout, les yeux fermés, les mains croisées sur le ventre, et on aurait pu croire qu’il dormait.",
     "mentions": []
    },
    {
     "id": "c5-b32",
     "text": "— Elle sait où, dit-il enfin sans ouvrir les yeux. Elle sait quoi. Elle sait quand la glace la rendra. Elle ne sait pas quand nous viendrons.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "— Elle sait qu’il y a un nous, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "— Elle l’a toujours su. C’est pour ça qu’elle m’a fait sortir. Rien n’a changé, mademoiselle Sorbier, sauf une chose : maintenant, nous savons qu’elle sait. C’est un avantage. On commence cette nuit.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "Ils commencèrent cette nuit-là.",
     "mentions": []
    },
    {
     "id": "c5-b36",
     "text": "Ce fut, pendant des jours, toujours la même chose, et Isaure n’oublia jamais rien de ces nuits-là. Les Étuves fermaient à dix heures. Pétronille renvoyait ses garçons de bains, gardait ses deux chauffeurs, qui étaient ses neveux et qui ne savaient pas parler de ce qu’ils ne comprenaient pas, et poussait les chaudières au rouge. À onze heures, ils descendaient dans la citerne. Pétronille tenait la lance, puis Constant, puis Pétronille ; Tobie pompait, puis Constant, puis Tobie ; et Isaure, entre deux tours de pompe, mesurait. À chaque demi-pied gagné, elle tendait dans le tunnel un cordeau de lin blanc depuis un clou planté au seuil, vérifiait l’aplomb avec un fil à plomb, la pente avec le niveau, la direction avec la boussole, et corrigeait d’un pouce vers la droite, d’un demi-pouce vers le haut. Personne ne discutait ses corrections. À cinq heures, avant l’arrivée des premiers baigneurs, on arrêtait tout, on rangeait la lance, on masquait l’entrée du tunnel derrière une pile de sacs de sel à bain, et chacun rentrait dormir deux heures.",
     "mentions": []
    },
    {
     "id": "c5-b37",
     "text": "Le tunnel avançait dans le bleu. Au début, il n’était qu’un trou dans le mur de la citerne ; au bout de trois nuits, c’était un boyau rond, large comme un tonneau, où l’on entrait à quatre pattes sur une planche, et où la lanterne qu’on poussait devant soi allumait une lumière qui ne ressemblait à aucune autre, une lumière d’avant la lumière. La glace, à cette profondeur, avait trois siècles. Isaure le calcula une nuit, pour s’occuper les mains, pendant que Tobie pompait. Trois siècles : cette glace-là était tombée en neige sur les hauteurs quand les Frimas n’étaient encore que des pêcheurs, et qu’il n’y avait à Demeure ni Margrave, ni Couronne, ni personne pour les attendre.",
     "mentions": []
    },
    {
     "id": "c5-b38",
     "text": "Tobie, en pompant, chantait. Il ne s’en rendait pas compte. Le chant de veille avait le rythme exact de la pompe, ou la pompe avait pris le rythme du chant, et au bout de la deuxième nuit tout le monde le fredonnait, même Pétronille, qui chantait comme on casse du bois.",
     "mentions": []
    },
    {
     "id": "c5-b39",
     "text": "La troisième nuit, à une toise et demie du seuil, la lance heurta quelque chose.",
     "mentions": []
    },
    {
     "id": "c5-b40",
     "text": "Ce fut un bruit mat, différent du sifflement de l’eau sur la glace. Pétronille arrêta la pompe d’un geste. Constant avança la lanterne. Au fond du tunnel, dans la vapeur qui se dissipait, il y avait du bois : un coin de planche noirci, arrondi par le temps, qui sortait de la glace comme une racine sort d’un talus.",
     "mentions": []
    },
    {
     "id": "c5-b41",
     "text": "— Ce n’est pas elle, dit Isaure tout de suite. Elle est à cinq toises d’ici. Ce n’est pas possible.",
     "mentions": []
    },
    {
     "id": "c5-b42",
     "text": "— Ce n’est pas elle, dit Constant.",
     "mentions": []
    },
    {
     "id": "c5-b43",
     "text": "Ils dégagèrent le bois à la main, avec des chiffons trempés d’eau chaude, pouce par pouce, sans la lance, parce que Tobie l’avait demandé et que personne n’avait eu envie de lui dire non. Il leur fallut deux heures. C’était un cercueil, un tout petit cercueil, long comme un bras, de bois de mélèze ciré qui avait tenu, sans plaque et sans ferrures. Une ficelle de chanvre, noircie et durcie comme du fil de fer, en faisait le tour, et on y avait noué une clochette de bronze grosse comme un dé à coudre.",
     "mentions": []
    },
    {
     "id": "c5-b44",
     "text": "Personne ne dit rien pendant un long moment.",
     "mentions": []
    },
    {
     "id": "c5-b45",
     "text": "— Il n’est pas au Registre, dit enfin Isaure, d’une voix qu’elle ne reconnut pas. Il n’y a rien sur le plan des creusements, rien au Registre, rien au Calendrier. Il est trop vieux. Le Registre commence en 380. Il est plus vieux que le Registre.",
     "mentions": []
    },
    {
     "id": "c5-b46",
     "text": "— C’est un Profond, dit Tobie. Un de ceux qu’on remettait avant. Quand il n’y avait pas de Champ, on les remettait dans une crevasse, là-haut, avec une clochette, pour que la glace sache qu’on les attendait.",
     "mentions": []
    },
    {
     "id": "c5-b47",
     "text": "Il ôta son capuchon. Ses oreilles étaient rouges et ses mains tremblaient. Il s’agenouilla dans l’eau de fonte, au fond du tunnel, devant le petit cercueil, et il se mit à chanter. Il chanta à voix très basse d’abord, puis plus fort, et le tunnel lui renvoyait sa voix, et la citerne derrière lui la renvoyait encore, et Isaure eut l’impression que toute la glace autour d’eux, toute la glace de deux cents ans où dormaient on ne savait combien d’autres Profonds, écoutait. Pétronille avait posé sa main mutilée sur son cœur. Constant s’était assis, les genoux dans les bras, et regardait la clochette.",
     "mentions": []
    },
    {
     "id": "c5-b48",
     "text": "Quand Tobie eut fini, il se tourna vers Isaure.",
     "mentions": []
    },
    {
     "id": "c5-b49",
     "text": "— On ne peut pas le prendre. Il n’est pas à nous. Il n’est pas à son heure. Mais on ne peut pas le laisser seul non plus. Il faut que quelqu’un sache où il est, pour l’attendre quand il sortira.",
     "mentions": []
    },
    {
     "id": "c5-b50",
     "text": "Isaure ouvrit son carnet. À la lumière de la lanterne, elle mesura la position du petit cercueil à la chaîne et au cordeau, releva sa profondeur et son orientation, estima son chemin et la vitesse de la glace à cet endroit. Elle écrivit : « Profond, sans nom, sans date. Enfant. Affleurera vers 619, dans la Veine, vers la trente-troisième ogive. » Elle arracha la page, la plia, et la donna à Tobie, qui la glissa dans sa manche comme une relique.",
     "mentions": []
    },
    {
     "id": "c5-b51",
     "text": "— Il faudra le contourner, dit-elle ensuite, à Constant, à Pétronille, à elle-même. Par la droite. Une demi-toise de détour. Une nuit de perdue.",
     "mentions": []
    },
    {
     "id": "c5-b52",
     "text": "— Une nuit, dit Constant.",
     "mentions": []
    },
    {
     "id": "c5-b53",
     "text": "Il regardait toujours la clochette.",
     "mentions": []
    },
    {
     "id": "c5-b54",
     "text": "Firmin Vauclair l’attendait le lendemain, à midi, au pied de l’Escalier des Jalonneurs, assis sur une borne de pierre, sa pipe à la main. Il ne fit pas semblant de la rencontrer par hasard. Il se leva, ce qui lui prit du temps, et lui proposa de marcher un peu, et ils marchèrent le long de la Paroi Nord, sur le chemin de planches qui bordait la ville du côté immobile, là où la roche et la glace se frottaient l’une contre l’autre en grinçant.",
     "mentions": []
    },
    {
     "id": "c5-b55",
     "text": "— Hermine est allée aux archives, dit-il. On me l’a dit. Elle a sorti mon dossier. Le dossier « fantaisies ».",
     "mentions": []
    },
    {
     "id": "c5-b56",
     "text": "— Elle m’en a parlé.",
     "mentions": []
    },
    {
     "id": "c5-b57",
     "text": "— Ah. Elle vous a dit que j’avais raison, j’imagine. Elle est très juste, Hermine. Elle dit toujours aux gens qu’ils ont raison, après avoir fait exactement ce qu’elle voulait.",
     "mentions": []
    },
    {
     "id": "c5-b58",
     "text": "Il marcha un moment en silence. Il boitait un peu, du genou gauche, et il s’appuyait sur la paroi de la main droite, comme sur l’épaule d’un vieil ami.",
     "mentions": []
    },
    {
     "id": "c5-b59",
     "text": "— Le 5 mars 571, reprit-il, j’avais vingt-cinq ans et une idée. Constant Mérel était Remonteur, il connaissait les toits de l’Hôtel de Frimas pour les avoir refaits l’année d’avant, et on avait vu un homme sur ces toits la nuit du vol. Sa femme était morte le matin suivant. Je suis allé à sa veillée, le 3. Je n’avais rien à y faire. J’y suis allé. Il y avait trente personnes, des Jalonneurs, des Remonteurs, une grande fille qui pleurait plus fort que tout le monde…",
     "mentions": []
    },
    {
     "id": "c5-b60",
     "text": "— La Pétro.",
     "mentions": []
    },
    {
     "id": "c5-b61",
     "text": "— La Pétro. Et lui, assis à côté du cercueil, la main posée dessus. Il ne pleurait pas. Il avait l’air… soulagé. Pas heureux, soulagé. Comme un homme qui a mis quelque chose à l’abri. Le lendemain, on l’a remise, et j’ai passé la nuit sur le Registre, et le surlendemain j’ai demandé l’ouverture des cercueils, et vous savez la suite. J’ai écrit mon rapport. On l’a rangé aux fantaisies. En 580, j’ai écrit un second rapport, avec un calcul d’affleurement que j’avais fait moi-même, très mal, avec l’aide d’un livre ; on l’a rangé avec le premier. Et puis j’ai attendu.",
     "mentions": []
    },
    {
     "id": "c5-b62",
     "text": "— Quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c5-b63",
     "text": "— Il n’y a pas que les voleurs qui savent attendre, mademoiselle Sorbier.",
     "mentions": []
    },
    {
     "id": "c5-b64",
     "text": "Ils étaient arrivés au bout du chemin de planches, là où il rejoignait la Rue Longue. Firmin s’arrêta, bourra sa pipe, ne l’alluma pas.",
     "mentions": []
    },
    {
     "id": "c5-b65",
     "text": "— J’ai été garde au palais des Frimas à vingt ans, dit-il. Avant d’être inspecteur. J’ai monté la garde devant la Chambre de Givre. J’ai vu la petite Margravine grandir. La Couronne est à elle. Je voudrais la lui rendre avant de mourir. C’est tout ce que je veux. Hermine veut l’enterrer. Et Constant…",
     "mentions": []
    },
    {
     "id": "c5-b66",
     "text": "Il la regarda de côté.",
     "mentions": []
    },
    {
     "id": "c5-b67",
     "text": "— Il vous a dit qu’il allait la vendre, n’est-ce pas ?",
     "mentions": []
    },
    {
     "id": "c5-b68",
     "text": "Isaure ne répondit pas. Il n’insista pas.",
     "mentions": []
    },
    {
     "id": "c5-b69",
     "text": "— Il m’a dit la même chose en 571, dans mon bureau, le jour où il s’est rendu. « Je l’aurais vendue, inspecteur. » Je me suis toujours demandé à qui. Une couronne, ça ne se vend pas comme un hareng. Tous ceux qui auraient pu l’acheter étaient des ennemis de Demeure, et Constant, je crois bien, n’a jamais eu d’ennemis. Mais laissons ça. Ce n’est pas ce qui m’empêche de dormir.",
     "mentions": []
    },
    {
     "id": "c5-b70",
     "text": "— Qu’est-ce qui vous empêche de dormir ?",
     "mentions": []
    },
    {
     "id": "c5-b71",
     "text": "Il alluma enfin sa pipe et souffla longtemps la fumée avant de répondre.",
     "mentions": []
    },
    {
     "id": "c5-b72",
     "text": "— Lui, je le comprends. Il l’aimait ; il aurait fait n’importe quoi. Mais elle ? Une Jalonneuse. Une femme qui savait, mieux que personne, ce que c’est que quarante ans de glace. Elle a accepté de dormir quarante ans avec une couronne volée sur la poitrine, sous une ville qui la cherchait. Pourquoi ? Voilà ce que je voudrais savoir, mademoiselle Sorbier, avant de mourir. Pas où est la Couronne. Pourquoi elle.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "Quarante et un ans",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Le 5 mars, la fente mesurait un pied et un demi-pouce, et la maison n’avait plus que douze jours. Isaure s’en aperçut en écrivant le chiffre : c’était la première fois qu’elle mesurait la fente en pieds. Elle trouva la chose absurde, et pourtant elle resta un moment accroupie dans la neige, la réglette à la main, comme devant une lettre qu’on n’a pas envie d’ouvrir.",
     "mentions": []
    },
    {
     "id": "c6-b02",
     "text": "Le tunnel, lui, avait deux toises et un pied, plus la demi-toise du détour. Le petit cercueil à la clochette restait sur sa droite, dans la paroi, et chaque fois qu’on passait devant en rampant, on ralentissait sans se le dire. Tobie lui chantait un couplet à chaque relève. Pétronille, qui ne chantait pas, lui disait bonjour.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "Ce soir-là, quand on eut rangé la lance et masqué le tunnel derrière les sacs de sel, Isaure ne rentra pas chez elle. Elle attendit Constant dans le vestibule des Étuves, où la femme aux serviettes était partie, et quand il sortit de la chaufferie en toussant — il toussait depuis deux nuits, une petite toux sèche qu’il couvrait de la main comme on couvre une bougie —, elle lui dit :",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "— L’inspecteur Vauclair voudrait savoir pourquoi elle a accepté.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "Constant s’arrêta. Il remit son chapeau, lentement.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "— Il vous a dit ça ?",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "— Il m’a dit : lui, je le comprends. Mais elle ?",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "— Ce vieux Firmin, dit Constant, et il y avait dans sa voix quelque chose qui ressemblait à de la tendresse. Toujours les bonnes questions. Toujours quarante ans trop tard. Venez. Il me faut de l’air.",
     "mentions": []
    },
    {
     "id": "c6-b09",
     "text": "Ils descendirent la Rue Longue jusqu’au Carré d’Attente. Il neigeait, une neige fine et sèche qui ne tombait pas mais flottait, et les lanternes, au bord du Carré, faisaient autour d’elles des ronds de lumière où les flocons tournaient comme des insectes. Le Carré était vide. Constant traversa la neige jusqu’au milieu, en laissant sa ligne de pas droite, et Isaure le suivit dans ses traces, et quand il s’arrêta, elle s’arrêta. Il resta un moment à regarder les façades autour d’eux, les fenêtres éclairées, un rideau qui bougeait.",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "— Elle corrigeait mes chiffres, dit-il. C’est comme ça que ça a commencé. En 563, j’avais dix-neuf ans, j’étais Remonteur, on montait à la Ligne les poutres d’un palais neuf, et une Jalonneuse de vingt et un ans est venue vérifier nos mesures. Elle a sorti sa chaîne, elle a mesuré une poutre que j’avais mesurée, elle a dit : vous vous êtes trompé de trois pouces. J’ai dit que non. Elle a remesuré devant moi. Je m’étais trompé de trois pouces. Elle a ri. J’ai su tout de suite que je passerais ma vie à essayer de ne plus me tromper de trois pouces devant elle.",
     "mentions": []
    },
    {
     "id": "c6-b11",
     "text": "— Le palais neuf…",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "— L’Hôtel de Frimas. Oui. Tout commence toujours au même endroit, à Demeure ; c’est la ville qui bouge, pas les histoires.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "Il sourit dans le noir, et elle entendit le sourire plus qu’elle ne le vit.",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "— Nous nous sommes mariés en 566. Elle était la meilleure Jalonneuse de sa génération. Vous vous servez de ses tables. Tout le monde s’en sert. À vingt-six ans, elle en savait plus sur la glace que le Premier Jalonneur de l’époque, et le Premier Jalonneur le savait, et il l’aimait quand même, ce qui n’est pas donné à tout le monde. Et puis, en 567, le vieux Margrave l’a fait venir au palais. Eudes, le quatrième. Il avait une fille unique, de treize ans, et une idée ancienne : que les Margraves doivent savoir lire la glace, puisqu’ils règnent dessus. Il a demandé à Clémence d’être sa tutrice. Deux après-midi par semaine, dans la bibliothèque des Frimas, avec des Tables de Pas et une boîte de craies.",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "— Mahaut.",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— La petite, dit Constant, et il n’ajouta rien pendant un moment.",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "La neige tombait sur son chapeau et ne fondait pas.",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "— Elle est tombée malade à l’automne 570. Clémence. La toux. Au début, on s’est dit que c’était l’hiver. En novembre, le vieux Margrave est mort, et on a fixé le sacre de la petite au Vêlage suivant, le 5 mars. En décembre, Clémence ne pouvait plus monter l’Escalier des Jalonneurs. En janvier, elle ne pouvait plus se lever. Le médecin est venu, il a regardé ses mains, il a regardé les miennes, et il m’a dit de lui faire faire ce qu’elle aimait. Alors je lui apportais les Tables en cachette, et elle calculait.",
     "mentions": []
    },
    {
     "id": "c6-b19",
     "text": "— Et la Couronne ?",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "— Attendez. Tout arrive. C’est la glace qui me l’a appris.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "Il toussa, se détourna pour tousser, revint.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "— Le Conseil, en ce temps-là, c’était la Compagnie des Glaces. Aujourd’hui encore, un peu ; en ce temps-là, entièrement. Aristide Varnier présidait le Conseil et la Compagnie, et il avait préparé pour le sacre deux papiers, qu’on devait faire signer à la petite le jour même, la Couronne sur la tête, parce qu’un Margrave ne scelle rien sans la Couronne, c’est la coutume, le sceau des Frimas ne vaut que porté par une tête couronnée. Le premier papier était un contrat de mariage : la petite épousait Gaspard Varnier, le fils, trente-quatre ans, un homme qui comptait tout, et juste. Le second papier s’appelait le Grand Bail. Il donnait à la Compagnie tous les lots de la Ligne pendant soixante ans.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "Isaure mit un moment à comprendre. Puis elle comprit, et elle eut froid, d’un froid qui ne venait pas de la neige.",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "— Toute la ville, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "— Toute la ville, dit Constant. Pas la ville d’aujourd’hui : celle de demain. Chaque maison bâtie pendant soixante ans, chaque lot tiré à la Ligne, chaque famille qui voulait faire remonter ses poutres, aurait dû louer à la Compagnie. En soixante ans, la glace fait descendre toute une ville. Au bout de soixante ans, Demeure aurait appartenu tout entière à Varnier et à ses héritiers, du Front à la Ligne, sans qu’on ait eu besoin de la voler. On l’aurait signée, voilà tout, un matin de Vêlage, avec une plume et une couronne.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "— Et la Margravine ?",
     "mentions": []
    },
    {
     "id": "c6-b27",
     "text": "— La petite avait dix-sept ans. Elle a compris ce qu’on lui faisait signer, parce que Clémence lui avait appris à lire la glace, et qu’à Demeure celui qui sait lire la glace sait lire un bail. Elle est venue voir Clémence, un soir de février, en cachette, par la porte de la cour. Elle a pleuré au pied du lit pendant une heure. Clémence l’a laissée pleurer, et puis elle a dit : « On va lui prendre sa couronne. »",
     "mentions": []
    },
    {
     "id": "c6-b28",
     "text": "Il se tut. Autour d’eux, la neige continuait de flotter, et une fenêtre, sur la façade nord du Carré, s’éteignit.",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "— Sans couronne, pas de sacre. Sans sacre, pas de sceau. Sans sceau, ni mariage ni Bail. C’était simple. Clémence aimait les choses simples. Elle a tout calculé, dans son lit : l’heure où la garde changeait, l’heure où le Tombant se lèverait cette nuit-là, parce qu’il se lève toujours avant un Vêlage et qu’il couvre tous les bruits des toits, le poids de la Couronne, le chemin. Moi, je connaissais les toits de l’Hôtel. Je les avais refaits l’année d’avant.",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "— Et la porte de la Chambre de Givre ? Il y avait trois clefs. Tout le monde le sait. Le Margrave, le Trésorier, l’héritière. Le Margrave était mort.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "— Une porte s’est ouverte, dit Constant. Ne me demandez pas qui l’a ouverte. C’est la seule chose que je ne vous dirai pas.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "Isaure ne demanda pas. Elle regardait les lanternes, à la lisière du Carré, et elle pensait à une petite femme en toque de fourrure qui balayait son perron à grands coups secs.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "— La nuit du 1er mars, reprit Constant, le Tombant s’est levé à onze heures, comme elle l’avait dit. À deux heures, j’étais sur les toits. À trois heures, j’étais dans la Chambre de Givre. À quatre heures, j’étais rentré, trempé de neige, avec un sac de toile sous mon manteau, et Clémence était assise dans son lit, les yeux ouverts, et elle m’attendait. Elle ne s’était pas assise depuis trois semaines. Je lui ai mis la Couronne dans les mains. Elle l’a regardée à la lampe, longtemps. Elle a dit qu’elle était plus légère qu’elle ne l’aurait cru. Et puis elle a ri. Elle riait comme au premier jour, quand je m’étais trompé de trois pouces.",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "Il s’arrêta de parler, et Isaure ne l’interrompit pas. Elle attendit, comme on attend sous une maison, entre deux pilotis, avec une lanterne.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "— Elle est morte au matin, dit-il. À sept heures. La Couronne dans les mains. Je crois qu’elle avait attendu ça pour partir.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "Le silence, au milieu du Carré, était si grand qu’on entendait la neige toucher la neige.",
     "mentions": []
    },
    {
     "id": "c6-b37",
     "text": "— Avant de mourir, reprit-il, elle m’a dit trois choses. Elle m’a dit : on ne la jette pas. On ne jette pas ce qui n’est pas à nous. Elle m’a dit : mets-la avec moi. Et elle m’a dit : la glace la rendra quand il faudra. J’ai fait ce qu’elle a dit. La nuit de la veillée, quand tout le monde a été parti, j’ai ouvert le cercueil, je l’ai mise avec elle, j’ai refermé. Le lendemain, les Affleureurs l’ont montée au Champ des Remis, et j’ai marché derrière, et j’ai regardé la neige la recouvrir. Le surlendemain, Firmin a demandé qu’on l’ouvre. Et le jour d’après, je suis allé m’asseoir dans son bureau.",
     "mentions": []
    },
    {
     "id": "c6-b38",
     "text": "— Vous avez donné quarante et un ans pour qu’on ne l’ouvre pas.",
     "mentions": []
    },
    {
     "id": "c6-b39",
     "text": "— Je n’ai rien donné du tout, dit-il. J’ai attendu. Ce n’est pas la même chose. On ne donne que ce qu’on perd. Moi, je savais où elle était.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "— Et Firmin ? Il a raison, alors. Elle a accepté parce que…",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "— Parce que c’était Clémence, dit Constant. Parce que la petite pleurait au pied de son lit et qu’elle allait mourir de toute façon, et qu’elle trouvait que c’était un beau dernier calcul à faire. Parce qu’elle ne supportait pas les choses mal mesurées, et qu’une ville vendue pour soixante ans le matin d’un Vêlage, c’était une chose mal mesurée. Vous voyez bien, mademoiselle Sorbier. Vous auriez fait pareil.",
     "mentions": []
    },
    {
     "id": "c6-b42",
     "text": "Isaure ne répondit pas, parce qu’elle n’en savait rien, et qu’elle avait peur que ce fût vrai.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "— Et maintenant ? demanda-t-elle enfin. Maintenant, vous allez la vendre à votre homme du Midi.",
     "mentions": []
    },
    {
     "id": "c6-b44",
     "text": "— Maintenant, dit Constant, je vais la chercher.",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "Il lui prit le bras pour retraverser la neige, et elle sentit à travers le manteau combien ce bras était maigre ; il s’appuyait sur elle plus qu’il ne l’aurait voulu. Ils revinrent dans leurs propres traces. Au bord du Carré, sous la lanterne, il s’arrêta devant la plaque de cuivre verdie, « Lot réservé au palais de la Margravine — en attendant la Couronne », et il posa sa main gantée dessus, un instant, comme on pose la main sur l’épaule d’un vieil ami qu’on n’a pas reconnu tout de suite.",
     "mentions": []
    },
    {
     "id": "c6-b46",
     "text": "Le lendemain, Pétronille vint les chercher dans la citerne avant l’heure, les joues rouges et le souffle court, et ce n’était pas à cause de la vapeur.",
     "mentions": []
    },
    {
     "id": "c6-b47",
     "text": "— Il y a trois laquais de la Régence dans le grand bassin, dit-elle. Et un cocher. Et le sous-majordome, qui a la langue plus longue que la Rue Longue. Ils parlent tous de la même chose. Il paraît que le Régent a signé une dispense. Il paraît qu’on a loué quatre Fendeurs de la Compagnie pour le matin du Vêlage, avec des scies à glace et des ciseaux, pour descendre dans la glacière basse. Il paraît qu’il y a un Remis dans le mur, qu’on doit sortir avant son heure, pendant que la ville sera au Front, et que le Prieur n’en sait rien. Le cocher dit que c’est un Margrave. Le sous-majordome dit que c’est un trésor. Un laquais dit que c’est sa grand-mère et tout le monde a ri.",
     "mentions": []
    },
    {
     "id": "c6-b48",
     "text": "— Le matin du Vêlage, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c6-b49",
     "text": "— Le 17, dit Constant. Pas le 19. Le 17 à l’aube.",
     "mentions": []
    },
    {
     "id": "c6-b50",
     "text": "Personne ne dit rien. Au fond du tunnel, derrière eux, une goutte tomba du plafond de glace dans la flaque, puis une autre.",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Firmin Vauclair habitait deux pièces au deuxième étage d’une maison de la trente-neuvième ogive, rue des Vitriers, au-dessus d’un marchand de couleurs, et Isaure dut monter l’escalier en retenant son souffle, parce que la cage sentait la térébenthine. Il lui ouvrit en pantoufles, ne manifesta aucune surprise et la fit entrer dans une pièce où il n’y avait de place pour rien. Il y avait des papiers partout : sur la table, sur les chaises, sur le lit, en piles contre les murs ; des cartes de la Coulée punaisées les unes sur les autres comme des écailles ; des calculs à la craie sur une ardoise, dont Isaure vit du premier coup d’œil qu’ils étaient faux ; un chat gris qui dormait sur un registre. Au milieu de la table, sous la lampe, il y avait un dossier de carton épais, gonflé comme une miche, fermé par une sangle. L’étiquette disait : « Givre ».",
     "mentions": []
    },
    {
     "id": "c6-b52",
     "text": "— La dispense, dit Isaure. C’est vrai ?",
     "mentions": []
    },
    {
     "id": "c6-b53",
     "text": "Il déplaça le chat pour s’asseoir.",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "— Signée le 5 au soir, dit-il. « Dispense de devancement pour raison d’État. Extraction du Remis numéro 58 de l’an 571 par les soins de la Sûreté, en présence d’un greffier, à l’aube du 17 mars. » Le 17, le Prieur et tous les Affleureurs de la ville seront au Front pour la Rendue du Dernier Rang, et toute la ville avec eux. Personne ne verra rien. Hermine aime les choses qu’on ne voit pas.",
     "mentions": []
    },
    {
     "id": "c6-b55",
     "text": "— Pourquoi le 17 ? Elle m’avait dit le 19. Elle m’avait dit qu’elle attendrait la glace.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "Firmin la regarda par-dessus ses lunettes, qu’il venait de mettre, et elle eut l’impression désagréable qu’il avait compris beaucoup de choses et qu’il avait la délicatesse de ne pas les dire.",
     "mentions": []
    },
    {
     "id": "c6-b57",
     "text": "— La Sûreté compte les tombereaux, dit-il. C’est moi qui leur ai appris. Il y a une borne au coin de la rue des Tonneliers, un homme dessus, qui note tout ce qui entre à la Régence et autour. Les Étuves de la Veine ont reçu en huit jours trois tombereaux de charbon de plus que d’habitude. Hermine sait compter jusqu’à trois.",
     "mentions": []
    },
    {
     "id": "c6-b58",
     "text": "Isaure sentit ses joues brûler. Elle pensa à Pétronille qui disait « Elle pense à tout », et à la question qu’elle avait posée elle-même, le premier jour, dans la citerne : « Et le charbon ? » Elle y avait pensé. Personne n’y avait répondu.",
     "mentions": []
    },
    {
     "id": "c6-b59",
     "text": "— Je ne vous demande pas ce que vous faites avec ce charbon, dit Firmin. Je ne suis plus rien. Je n’ai le droit de rien demander à personne.",
     "mentions": []
    },
    {
     "id": "c6-b60",
     "text": "Il ouvrit le dossier Givre, en tira une fiche, la regarda, la remit.",
     "mentions": []
    },
    {
     "id": "c6-b61",
     "text": "— Vous avez dix nuits, dit-il. Neuf, si vous voulez dormir la dernière.",
     "mentions": []
    },
    {
     "id": "c6-b62",
     "text": "Elle rentra chez elle par la Rue Longue, en comptant. C’était ce qu’elle faisait quand elle avait peur : elle comptait. Trois toises et demie de glace entre le fond du tunnel et Clémence, dans la glace la plus vieille et la plus dure. Une toise en deux nuits dans le meilleur cas, trois dans le pire. Sept nuits, peut-être. Dix, peut-être. Et au bout, pour sortir un cercueil de la glace sous les pieds d’un palais, la seule nuit de l’année où ce palais serait plein de monde du grenier à la cave — la nuit du bal, la nuit de sa propre maison. Elle arriva au Dernier Rang sans s’en apercevoir. La fente, derrière la maison, craquait dans le noir.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-7",
   "number": 7,
   "title": "En attendant la Couronne",
   "blocks": [
    {
     "id": "c7-b01",
     "text": "Le sergent qui vint la chercher au Bureau, le 8 mars à midi, avait une moustache de phoque et un visage large et rouge, et Isaure le reconnut : c’était celui qui avait laissé filer le voleur de la Rue Longue derrière une Rendue. Il la reconnut aussi, ou fit semblant, et lui tendit un billet cacheté de gris.",
     "mentions": []
    },
    {
     "id": "c7-b02",
     "text": "— Sergent Morvan, de la Sûreté, dit-il. L’Intendante vous prie de passer. Maintenant, si ça ne vous dérange pas. Et même si ça vous dérange, à vrai dire.",
     "mentions": []
    },
    {
     "id": "c7-b03",
     "text": "Maître Bastide la regarda remettre son manteau et ne dit rien. Il la regardait beaucoup, depuis une semaine. Elle avait des cernes jusqu’aux joues, elle s’endormait sur ses tables à trois heures de l’après-midi et se réveillait en sursaut en disant un chiffre, et une fois elle avait mis du sable à glace dans son thé au lieu de sucre. Il n’avait jamais rien demandé. Au moment où elle passait la porte, il leva les yeux de son registre.",
     "mentions": []
    },
    {
     "id": "c7-b04",
     "text": "— Sorbier.",
     "mentions": []
    },
    {
     "id": "c7-b05",
     "text": "— Maître ?",
     "mentions": []
    },
    {
     "id": "c7-b06",
     "text": "— Rien, dit-il. Couvrez-vous.",
     "mentions": []
    },
    {
     "id": "c7-b07",
     "text": "Les bureaux de la Sûreté occupaient l’aile est de la Régence, celle qui donnait sur les Étuves, et Isaure pensa en y entrant qu’elle était exactement au-dessus du tunnel. Le cabinet de l’Intendante était une pièce nue, blanchie à la chaux, meublée d’une table, de deux chaises et d’un poêle de faïence ; au mur, une grande carte de Demeure piquée d’épingles à tête de couleur, et au-dessus de la porte, peinte en lettres noires sur une planche, la formule qu’on retrouvait partout : « En attendant la Couronne ». Sur la table, il y avait une théière, deux tasses, et rien d’autre.",
     "mentions": []
    },
    {
     "id": "c7-b08",
     "text": "— Asseyez-vous, dit Hermine Laroque. C’est de la camarine. Je la fais venir des Parois ; elle ne pousse que dans les fentes de la roche, à l’abri du vent. On dit qu’elle éclaircit les idées.",
     "mentions": []
    },
    {
     "id": "c7-b09",
     "text": "Elle servit le thé elle-même. Ses mains étaient longues, précises, sans bagues.",
     "mentions": []
    },
    {
     "id": "c7-b10",
     "text": "— Je ne vais pas vous faire perdre de temps, mademoiselle Sorbier ; vous n’en avez pas. Il y a un tunnel sous les Étuves de la Veine. Il part de la citerne de Mme Gaudin et il va vers ma glacière basse. Je le sais parce que Mme Gaudin a reçu trois tombereaux de charbon de trop, parce que ses chaudières fument la nuit et que ses bains ferment à dix heures, parce que ses deux chauffeurs dorment le jour dans une taverne de la rue des Tonneliers, et parce que votre lampe, au Bureau, ne s’allume plus le soir. Je pourrais faire descendre six gardes dans cette citerne ce soir. Je ne le fais pas. Savez-vous pourquoi ?",
     "mentions": []
    },
    {
     "id": "c7-b11",
     "text": "— Parce que vous n’êtes pas sûre.",
     "mentions": []
    },
    {
     "id": "c7-b12",
     "text": "— Parce que je voudrais que ce soit vous qui me le disiez.",
     "mentions": []
    },
    {
     "id": "c7-b13",
     "text": "Elle but une gorgée de thé et reposa la tasse sans bruit.",
     "mentions": []
    },
    {
     "id": "c7-b14",
     "text": "— J’ai lu le dossier de Firmin Vauclair, dit-elle. Tout le dossier. Quarante ans de fiches. Je sais pourquoi la Couronne a disparu en 571 : pas pour être vendue, pour ne pas être posée sur une tête. Le Grand Bail, le fils Varnier. Vos voleurs ont sauvé cette ville, mademoiselle Sorbier. Je le leur accorde volontiers. Ils l’ont sauvée en la laissant sans couronne, et elle a vécu quarante et un ans sans couronne, et elle s’en est bien trouvée. Les lots de la Ligne sont tirés au sort chaque printemps, parce que la Régence n’a pas le droit de les louer pour plus d’un an. Personne ne possède la Demeure de demain. C’est le seul endroit au monde où c’est vrai.",
     "mentions": []
    },
    {
     "id": "c7-b15",
     "text": "Elle se leva, alla jusqu’à la carte et posa le doigt, sans regarder, sur une épingle grise au bas de la ville.",
     "mentions": []
    },
    {
     "id": "c7-b16",
     "text": "— Si la Couronne revient, tout ce qu’ils ont sauvé se défait. Les Varnier ont des petits-enfants. La Compagnie a gardé ses créances. Les Frimas ont des cousins à Solanne, dans le Midi, qui n’attendent qu’une chose, c’est qu’on leur dise que la Couronne est retrouvée et que Mahaut n’a pas d’enfant. Et Mahaut a cinquante-huit ans. Vous voulez savoir ce que je crains, mademoiselle Sorbier ? Je crains une ville qui se remet à espérer. Une ville qui espère se bat. Une ville qui attend ne se bat pas. Vous trouvez notre formule ridicule — « en attendant la Couronne ». Moi aussi. Je l’ai trouvée ridicule toute ma vie. Mais depuis quarante et un ans, à cause d’elle, personne ne s’est battu pour rien dans cette ville.",
     "mentions": []
    },
    {
     "id": "c7-b17",
     "text": "Isaure regardait sa tasse. Elle avait envie de dire quelque chose d’intelligent et elle n’avait rien à dire. Ce que disait l’Intendante était juste. C’était cela le pire.",
     "mentions": []
    },
    {
     "id": "c7-b18",
     "text": "— Voici ce que je vous propose, reprit Hermine Laroque en revenant s’asseoir. Le matin du 17, à l’aube, je veux que vous soyez dans ma glacière basse, avec vos instruments. Personne ne connaît cette glace mieux que vous. Vous guiderez mes Fendeurs pour que le cercueil sorte sans être abîmé. Je l’ouvrirai, je prendrai ce qu’il y a dedans, et la morte aura sa Rendue le jour même, avec des chants, par le Prieur lui-même si l’on veut. En échange, la Régence fait remonter votre maison. On rend leurs soixante écus aux Remonteurs, on vous tire un lot sur les Bords, à la Ligne, là où la glace est si lente qu’on y meurt de vieillesse avant sa maison — c’est ce qu’il vous a promis, je crois ? —, on paie la remontée, on paie les pilotis neufs. Et Maître Bastide vous donne la première classe qu’il n’ose pas vous donner parce que vous avez vingt-sept ans.",
     "mentions": []
    },
    {
     "id": "c7-b19",
     "text": "Isaure ne demanda pas comment elle savait. Elle pensa au vide sous sa maison, entre les pilotis, là où l’on range le bois et les luges, et elle eut froid.",
     "mentions": []
    },
    {
     "id": "c7-b20",
     "text": "— Et les autres ?",
     "mentions": []
    },
    {
     "id": "c7-b21",
     "text": "— Je ne leur veux aucun mal. Le vieux Mérel a fait quarante et un ans ; je ne le renverrai pas à la Tour pour un trou dans la glace. Mme Gaudin gardera ses bains. Le petit Affleureur retournera à ses veilles, et je ne dirai rien à son Prieur. Personne n’a besoin de savoir qu’il y a eu un tunnel. Personne n’a besoin de savoir qu’il y a eu une couronne. Il y aura eu une morte qui a affleuré deux jours trop tôt, voilà tout.",
     "mentions": []
    },
    {
     "id": "c7-b22",
     "text": "— Et si je refuse ?",
     "mentions": []
    },
    {
     "id": "c7-b23",
     "text": "L’Intendante eut ce sourire très bref qui ne touchait pas ses yeux.",
     "mentions": []
    },
    {
     "id": "c7-b24",
     "text": "— Alors je fais descendre mes gardes ce soir. Je les arrête tous les trois pour tentative de devancement et recel, et vous avec, pour complicité. La morte sortira le 17 dans ma cave de toute façon, parce que j’ai une dispense et quatre Fendeurs. Vous n’aurez rien sauvé du tout, et vous aurez tout perdu, y compris votre place au Bureau, et votre maison partira quand même le 17, avec vos poutres, qui ne sont plus les vôtres. Je vous le dis sans plaisir. Je ne menace jamais personne ; je décris.",
     "mentions": []
    },
    {
     "id": "c7-b25",
     "text": "Il y eut un silence. Dans le poêle de faïence, une bûche s’effondra.",
     "mentions": []
    },
    {
     "id": "c7-b26",
     "text": "— Je voudrais une nuit, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b27",
     "text": "— Vous l’avez. Demain à midi, le sergent Morvan passera au Bureau.",
     "mentions": []
    },
    {
     "id": "c7-b28",
     "text": "Isaure ne retourna pas au Bureau cet après-midi-là. Elle ne descendit pas non plus dans la citerne, le soir ; elle envoya un gamin porter à Pétronille un mot qui disait seulement « Pas ce soir. Demain », et elle rentra chez elle.",
     "mentions": []
    },
    {
     "id": "c7-b29",
     "text": "La maison avait neuf jours. Elle le savait sans avoir besoin de mesurer, et elle mesura quand même, dans le crépuscule, agenouillée derrière la maison, la réglette plongée dans la fente jusqu’à la marque des quinze pouces, puis elle rentra, alluma le poêle, et resta debout au milieu de la pièce principale sans savoir quoi faire.",
     "mentions": []
    },
    {
     "id": "c7-b30",
     "text": "C’était une pièce ordinaire. Elle l’avait toujours trouvée trop sombre. Il y avait la table de sa mère, avec la brûlure en forme de lune là où elle posait son fer à marquer ; les deux fauteuils, dont un boitait ; l’horloge qui retardait de quatre minutes, et sa mère disait que c’était exprès, pour avoir le temps ; les caisses à moitié faites. Et au-dessus, la maîtresse poutre avec ses trois encoches et le fer à cheval renversé de maître Ancel. Isaure leva la lampe. Elle chercha, sur le bois, une trace de ce garçon de dix-huit ans qui l’avait peut-être portée jusqu’à la Ligne avec un chien qui s’appelait Brume. Il n’y en avait pas. Les poutres ne gardent que ce qu’on y taille.",
     "mentions": []
    },
    {
     "id": "c7-b31",
     "text": "Elle s’assit à la table de sa mère et, parce qu’elle ne savait rien faire d’autre, elle mit les choses en colonnes.",
     "mentions": []
    },
    {
     "id": "c7-b32",
     "text": "D’un côté : une maison remontée à la Ligne, sur les Bords, où elle pourrait vivre soixante ans ; une première classe ; Constant, Pétronille et Tobie à l’abri ; la paix de la Régence, qui était une paix véritable ; et une morte qui aurait sa Rendue, avec des chants, deux jours trop tôt.",
     "mentions": []
    },
    {
     "id": "c7-b33",
     "text": "De l’autre : une nuit de bal, un tunnel sous un palais, une Intendante qui savait compter jusqu’à trois, un vieil homme qui toussait, un novice qui avait peur, une ancienne Fendeuse qui avait deux doigts de moins et pas un sou de trop ; et, au bout, pour elle, une part de la vente d’une couronne à un acheteur du Midi dont elle n’était pas sûre qu’il existât.",
     "mentions": []
    },
    {
     "id": "c7-b34",
     "text": "Il n’y avait rien à calculer. Les colonnes ne s’équilibraient pas ; la première était pleine et la seconde était vide. Et pourtant elle resta à la table jusqu’à quatre heures du matin, les mains à plat sur le bois, et à quatre heures du matin elle se leva, prit la lampe, sortit derrière la maison et regarda la fente, qui craquait dans le noir. Elle pensait à une chose que l’Intendante avait dite et qu’elle-même n’avait pas relevée sur le moment, parce qu’elle était trop occupée à trouver l’Intendante juste. L’Intendante avait dit : « Je l’ouvrirai, je prendrai ce qu’il y a dedans. » Elle avait dit « ce cercueil », « la morte », « ce qu’il y a dedans ». Elle n’avait pas dit une seule fois le nom de Clémence.",
     "mentions": []
    },
    {
     "id": "c7-b35",
     "text": "Isaure prit sa décision à cet instant-là, et elle ne se la formula pas, de peur de l’entendre.",
     "mentions": []
    },
    {
     "id": "c7-b36",
     "text": "Le sergent Morvan la trouva le lendemain à midi sur la terrasse du Bureau, près de la Grande Lunette, où elle faisait semblant de relever les jalons du profil de la Tour. Il la conduisit à l’aile est de la Régence. L’Intendante l’attendait debout, près de la carte.",
     "mentions": []
    },
    {
     "id": "c7-b37",
     "text": "— Alors ?",
     "mentions": []
    },
    {
     "id": "c7-b38",
     "text": "— Il y a un tunnel, dit Isaure. Il part de la citerne des Étuves. Il fait une toise et demie.",
     "mentions": []
    },
    {
     "id": "c7-b39",
     "text": "Elle entendit sa propre voix comme on entend celle d’une autre, de loin, dans une salle voisine. C’était une voix très calme.",
     "mentions": []
    },
    {
     "id": "c7-b40",
     "text": "— La glace qu’il traverse est de la glace de trois siècles, continua-t-elle. De la glace de pression, qui est descendue très profond avant de remonter. Elle est dure comme du verre et elle ne fond presque pas. La lance de Mme Gaudin y avance d’un pied par nuit, pas davantage. Il leur reste plus de quatre toises. À ce rythme, ils arriveront à la morte vers le 25. Vous l’aurez sortie depuis huit jours.",
     "mentions": []
    },
    {
     "id": "c7-b41",
     "text": "L’Intendante la regarda longtemps, de ce regard qui mesurait à l’aplomb et à la hauteur, et Isaure soutint ce regard sans ciller, parce qu’elle savait qu’on ne cille pas quand on dit la vérité et qu’elle avait passé la moitié de la nuit à s’en persuader.",
     "mentions": []
    },
    {
     "id": "c7-b42",
     "text": "— Pourquoi ne pas les avoir arrêtés, alors ? demanda l’Intendante. Pourquoi ne pas leur avoir dit qu’ils perdaient leur temps ?",
     "mentions": []
    },
    {
     "id": "c7-b43",
     "text": "— Parce que je veux ma maison, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b44",
     "text": "Et c’était vrai, cela aussi ; et c’est peut-être pour cela que ce fut cru.",
     "mentions": []
    },
    {
     "id": "c7-b45",
     "text": "— Si vous descendez maintenant dans la citerne, reprit-elle, vous aurez trois vieilles personnes et un trou dans la glace. Rien d’autre. Ils diront qu’ils cherchaient de l’eau pour les bains. Laissez-les creuser. Le 17, vous aurez la morte et ce qu’il y a dedans. Le 25, ils déboucheront dans une cave vide. Et vous les prendrez quand vous voudrez, ou pas du tout.",
     "mentions": []
    },
    {
     "id": "c7-b46",
     "text": "L’Intendante réfléchit. Elle réfléchissait comme elle servait le thé : sans un geste de trop.",
     "mentions": []
    },
    {
     "id": "c7-b47",
     "text": "— Vous serez dans ma glacière le 17 à l’aube, dit-elle enfin. Avec vos instruments. Et chaque jour, d’ici là, à midi, vous donnerez au sergent Morvan un billet avec la longueur de leur tunnel.",
     "mentions": []
    },
    {
     "id": "c7-b48",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c7-b49",
     "text": "— Vous n’avez jamais arrondi un chiffre de votre vie, mademoiselle Sorbier, dit l’Intendante. Tout le monde me l’a dit, au Bureau et ailleurs. C’est pour cela que je vous crois.",
     "mentions": []
    },
    {
     "id": "c7-b50",
     "text": "Isaure sortit de la Régence à une heure de l’après-midi. Elle traversa la Rue Longue, fit quelques pas le long de la façade des Étuves, s’arrêta, et vomit dans la neige, proprement, contre un pilotis, sans que personne la remarque. Puis elle se redressa, s’essuya la bouche avec une poignée de neige, et entra aux Étuves.",
     "mentions": []
    },
    {
     "id": "c7-b51",
     "text": "Ils étaient tous les trois dans le bureau aux serviettes, et ils savaient déjà. Pétronille avait des yeux dans tout le quartier ; un de ses garçons de bains avait vu la Jalonneuse à l’écharpe entrer à la Régence avec le sergent Morvan, la veille et le jour même. Tobie était assis dans un coin, blanc comme un linge. Pétronille était debout, les bras croisés, et elle ne l’invita pas à s’asseoir. Constant était à la table, devant le plan au charbon, et il toussait.",
     "mentions": []
    },
    {
     "id": "c7-b52",
     "text": "— Je lui ai dit pour le tunnel, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b53",
     "text": "— Nom d’un sérac, dit Pétronille, et pour une fois cela ajoutait quelque chose.",
     "mentions": []
    },
    {
     "id": "c7-b54",
     "text": "— Qu’est-ce que vous lui avez dit exactement ? demanda Constant.",
     "mentions": []
    },
    {
     "id": "c7-b55",
     "text": "Elle le leur dit. Tout. La glace de trois siècles, dure comme du verre, la lance qui avançait d’un pied par nuit, les quatre toises qui restaient, le 25. Le billet quotidien au sergent Morvan. Elle le dit sans s’interrompre, comme on récite un relevé, et quand elle eut fini, il y eut un silence si complet qu’on entendit, à travers les cloisons, quelqu’un plonger dans le grand bassin.",
     "mentions": []
    },
    {
     "id": "c7-b56",
     "text": "— Un pied par nuit, répéta Constant.",
     "mentions": []
    },
    {
     "id": "c7-b57",
     "text": "— Un pied par nuit.",
     "mentions": []
    },
    {
     "id": "c7-b58",
     "text": "— Dans de la glace de trois siècles.",
     "mentions": []
    },
    {
     "id": "c7-b59",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c7-b60",
     "text": "— Elle vous a crue.",
     "mentions": []
    },
    {
     "id": "c7-b61",
     "text": "— Elle a dit que je n’avais jamais arrondi un chiffre de ma vie.",
     "mentions": []
    },
    {
     "id": "c7-b62",
     "text": "Constant Mérel se mit à rire. Ce fut un rire très doux, qui le fit tousser, et il toussa longtemps, la main sur la bouche, et quand il eut fini de tousser, il riait encore.",
     "mentions": []
    },
    {
     "id": "c7-b63",
     "text": "— Vous avez menti sur la glace, dit-il.",
     "mentions": []
    },
    {
     "id": "c7-b64",
     "text": "— Une fois.",
     "mentions": []
    },
    {
     "id": "c7-b65",
     "text": "— Et c’était parfait.",
     "mentions": []
    },
    {
     "id": "c7-b66",
     "text": "Pétronille décroisa les bras. Elle regarda Isaure, puis Constant, puis de nouveau Isaure, et quelque chose se défit dans son visage. Elle tira une chaise et poussa Isaure dessus, pas très doucement, et lui mit dans les mains un verre d’une eau-de-vie de baies qui sentait la résine et le feu. Tobie, dans son coin, avait les larmes aux yeux sans savoir pourquoi, et il le cachait mal.",
     "mentions": []
    },
    {
     "id": "c7-b67",
     "text": "— Elle ne vous demandera pas de vérifier, dit Constant. Elle ne sait pas mesurer la glace ; elle sait mesurer les gens. Et vous êtes la personne la plus mesurable de Demeure. Elle a raison de vous croire. Elle a eu raison pendant vingt-sept ans.",
     "mentions": []
    },
    {
     "id": "c7-b68",
     "text": "— Ne dites pas ça.",
     "mentions": []
    },
    {
     "id": "c7-b69",
     "text": "— Pardon.",
     "mentions": []
    },
    {
     "id": "c7-b70",
     "text": "Il se tut un moment, regarda le plan, effaça du pouce un trait qui n’en avait pas besoin.",
     "mentions": []
    },
    {
     "id": "c7-b71",
     "text": "— Clémence aussi, dit-il, a menti une fois sur la glace. Une seule fois dans sa vie. Vous l’avez vue, sa ligne au Registre : « entre 608 et 615, entre la vingtième et la trentième ogive ». Sept ans et dix ogives. La meilleure Jalonneuse de sa génération, qui savait à la semaine près. Elle ne voulait pas qu’on la trouve avant l’heure. C’est le seul chiffre faux qu’elle ait jamais écrit.",
     "mentions": []
    },
    {
     "id": "c7-b72",
     "text": "Isaure vida son verre d’un coup. Elle toussa, parce que l’eau-de-vie de Pétronille était faite pour des Fendeurs, et elle se leva.",
     "mentions": []
    },
    {
     "id": "c7-b73",
     "text": "— Il reste trois toises et deux pieds, dit-elle. On a huit nuits. On commence ce soir.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-8",
   "number": 8,
   "title": "Le moulin",
   "blocks": [
    {
     "id": "c8-b01",
     "text": "Le Tombant se leva dans la nuit du 10 au 11 mars, comme il se lève chaque année quelques jours avant le Vêlage, et il souffla trois nuits. C’est un vent qui ne vient pas de la mer, comme les autres, mais d’en haut : il naît sur les grandes neiges, au-delà du Champ des Remis, là où personne ne va, et il descend la Coulée en suivant la pente, de plus en plus lourd et de plus en plus froid, comme de l’eau qui dévale un escalier. Il arrache les volets. Il éteint les lanternes et fait tourner leurs cages vides au bout des perches. Il fait chanter les cheminées. Les gens de Demeure disaient qu’il descendait tous les ans vérifier que la ville était toujours là, et qu’il fallait lui laisser un bol de soupe sur le rebord d’une fenêtre ; ils le disaient en riant, et ils le faisaient.",
     "mentions": []
    },
    {
     "id": "c8-b02",
     "text": "Dans la Rue Longue, les tapissiers de la Régence avaient commencé d’accrocher les guirlandes du Vêlage. Le Tombant les décrocha la première nuit. Ils les raccrochèrent le lendemain, et le Tombant les décrocha de nouveau ; au matin du 12, on trouvait des branches de sapin d’importation jusque sur les toits du Dernier Rang, et Isaure en ramassa une devant sa porte, en sortant mesurer la fente, et la rentra dans la maison, parce qu’elle sentait bon.",
     "mentions": []
    },
    {
     "id": "c8-b03",
     "text": "Sous la terre, on n’entendait pas le Tombant. On entendait seulement les chaudières, que Pétronille poussait si fort qu’elles se mettaient à cogner, et le sifflement de deux lances au lieu d’une : Constant en avait fabriqué une seconde, le 10, avec un bout de conduite de cuivre et la pompe à bras d’une vieille voiture à incendie que le quartier remisait sous un hangar et que personne ne penserait à chercher avant le prochain incendie. On travaillait maintenant par deux équipes. Pétronille et Tobie à une lance, Constant et Isaure à l’autre, et on se relayait à la pompe toutes les demi-heures, et on dormait par morceaux, assis contre la paroi de la citerne, la tête sur les genoux.",
     "mentions": []
    },
    {
     "id": "c8-b04",
     "text": "Chaque jour à midi, sur la terrasse du Bureau, Isaure remettait au sergent Morvan un billet plié en quatre. Le 10 : « Une toise, huit pouces. » Le 11 : « Une toise, neuf pouces. » Le 12 : « Une toise, dix pouces. » Le sergent prenait le billet, le glissait dans son gant sans le lire, soulevait son casque et repartait. Le 10 au soir, le tunnel avait quatre toises. Le 11, il en avait quatre et demie. Le 12, il en avait cinq et demie. Isaure avait acheté chez le papetier de la rue des Vitriers un second carnet, à couverture noire, pour y écrire les chiffres qu’elle donnait au sergent, parce qu’elle avait peur, à force de fatigue, de les confondre avec les autres. Elle n’avait jamais eu de carnet noir. Les chiffres vrais restaient dans le rouge.",
     "mentions": []
    },
    {
     "id": "c8-b05",
     "text": "Le 12 au matin, Maître Bastide s’arrêta derrière elle, au Bureau, pendant qu’elle recopiait au propre les relevés du profil de la Tour. Il resta là un long moment. Elle ne se retourna pas.",
     "mentions": []
    },
    {
     "id": "c8-b06",
     "text": "— Vous avez deux carnets, Sorbier.",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "— Oui, Maître.",
     "mentions": []
    },
    {
     "id": "c8-b08",
     "text": "— Lequel est le bon ?",
     "mentions": []
    },
    {
     "id": "c8-b09",
     "text": "— Le rouge.",
     "mentions": []
    },
    {
     "id": "c8-b10",
     "text": "— Bien, dit Maître Bastide, et il s’en alla.",
     "mentions": []
    },
    {
     "id": "c8-b11",
     "text": "Constant toussait. Il toussait depuis le 5, et depuis le Tombant il toussait davantage, d’une toux qui ne venait plus de la gorge mais de plus bas, et qui le pliait en deux sur la pompe. Pétronille lui avait dit trois fois d’aller se coucher. Il avait répondu la première fois qu’il se coucherait quand il serait mort, la deuxième fois qu’il avait dormi quarante et un ans, et la troisième fois il n’avait pas répondu, et il avait continué à monter, avec du bois de charpente récupéré sur un chantier de la Corporation, ce qu’il appelait la sortie : une planche longue et basse, munie de patins de fer, où l’on coucherait le cercueil pour le tirer à travers le tunnel ; un palan de Remonteur, avec ses poulies et ses cordages, qu’il scella lui-même dans la paroi de la citerne ; une chèvre de trois perches liées au sommet, qu’on pourrait dresser au-dessus du moulin ou de l’escalier. Il travaillait lentement, avec des gestes qui avaient cinquante ans et qui n’avaient rien oublié. Isaure le regardait faire des nœuds. Ils étaient parfaits.",
     "mentions": []
    },
    {
     "id": "c8-b12",
     "text": "Dans la nuit du 12 au 13, à trois heures du matin, Pétronille arrêta sa lance, et dit à voix basse :",
     "mentions": []
    },
    {
     "id": "c8-b13",
     "text": "— Venez voir.",
     "mentions": []
    },
    {
     "id": "c8-b14",
     "text": "Ils rampèrent l’un derrière l’autre jusqu’au fond du tunnel, dans la vapeur qui se dissipait, Constant le premier, Isaure derrière lui avec la lanterne, Tobie derrière elle. Au fond, la paroi de glace était lisse et bleue, d’un bleu presque noir, et Isaure leva la lanterne. La lumière entra dans la glace. Et au-delà, à une toise, peut-être un peu moins, dans le bleu épais strié de bulles, il y avait une ombre. Longue. Inclinée. Avec, à un bout, un petit rectangle plus clair.",
     "mentions": []
    },
    {
     "id": "c8-b15",
     "text": "C’était la même ombre que celle qu’Isaure avait vue dans le mur de la glacière basse, mais vue de l’autre côté, de derrière, comme on voit quelqu’un de dos. Personne ne parla. Constant resta immobile un long moment, à quatre pattes sur la planche, dans l’eau de fonte qui lui trempait les genoux. Puis il ôta son gant droit et posa la main à plat sur la glace, les doigts écartés.",
     "mentions": []
    },
    {
     "id": "c8-b16",
     "text": "— Bonsoir, dit-il.",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "C’est tout ce qu’il dit. Il garda la main sur la glace jusqu’à ce qu’elle devienne blanche, et Isaure dut la lui prendre et la lui remettre dans le gant, comme à un enfant, et il se laissa faire.",
     "mentions": []
    },
    {
     "id": "c8-b18",
     "text": "— Une toise, dit-elle, d’une voix qu’elle voulut ordinaire. Moins. Cinq pieds, peut-être. Trois nuits. On l’aura le 15. On aura une nuit d’avance.",
     "mentions": []
    },
    {
     "id": "c8-b19",
     "text": "Ils n’eurent pas de nuit d’avance. Quand ils revinrent dans la citerne, l’eau leur arrivait aux chevilles.",
     "mentions": []
    },
    {
     "id": "c8-b20",
     "text": "— Le moulin, dit Pétronille.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "Elle avait couru jusqu’au trou, au bout de la salle, et elle se penchait sur la margelle de planches, et Isaure, en la rejoignant, n’entendit rien. C’était cela qui était terrible : elle n’entendit rien. Le grondement sourd qui montait depuis vingt-six ans de ce trou, jour et nuit, comme celui d’une foule dans une grande salle, s’était tu. À sa place, il y avait un clapotis. L’eau des deux lances, l’eau de la fonte, l’eau chaude qui débordait du réservoir descendaient dans le moulin et remontaient aussitôt, noires, avec des bouts de glace qui tournaient à la surface.",
     "mentions": []
    },
    {
     "id": "c8-b22",
     "text": "— Il est bouché, dit Pétronille. Nom d’un sérac de nom d’un sérac. Il n’a jamais été bouché. En vingt-six ans.",
     "mentions": []
    },
    {
     "id": "c8-b23",
     "text": "— C’est le Tombant, dit Isaure. Il fait si froid depuis trois nuits que la gorge du moulin a gelé. Quelque part en dessous, l’eau qui descend a trouvé de la glace neuve, et la glace neuve a pris tout ce qui passait. Un bouchon.",
     "mentions": []
    },
    {
     "id": "c8-b24",
     "text": "— Et si on arrête les lances ?",
     "mentions": []
    },
    {
     "id": "c8-b25",
     "text": "— L’eau cessera de monter. Mais elle ne descendra pas. Demain matin, vos garçons de bains trouveront la citerne pleine, et l’eau sera montée jusqu’aux chaudières, et à midi toute la Rue Longue saura que les Étuves ont un problème de moulin, et à une heure la Sûreté le saura aussi. Et si on laisse l’eau dans le tunnel, elle gèlera d’ici demain soir. Il faudra le recreuser.",
     "mentions": []
    },
    {
     "id": "c8-b26",
     "text": "Personne ne répondit. L’eau montait. Elle était à mi-mollet.",
     "mentions": []
    },
    {
     "id": "c8-b27",
     "text": "— Il faut descendre, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c8-b28",
     "text": "Elle le dit avant d’y avoir réfléchi, et une fois qu’elle l’eut dit, elle y réfléchit, et elle vit que c’était juste. Il fallait quelqu’un qui connaisse la glace et qui ne pèse pas lourd. Tobie était trop grand pour le moulin. Pétronille était trop lourde pour la corde. Constant était Constant.",
     "mentions": []
    },
    {
     "id": "c8-b29",
     "text": "— Non, dit Constant.",
     "mentions": []
    },
    {
     "id": "c8-b30",
     "text": "— Il n’y a que moi.",
     "mentions": []
    },
    {
     "id": "c8-b31",
     "text": "— Non, redit-il, et puis il la regarda, et il vit qu’il n’y avait qu’elle, et il se tut, et il alla chercher la chèvre.",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "Il la dressa au-dessus du moulin en quelques minutes, trois perches liées au sommet, une poulie, la corde passée dedans et ramenée au palan scellé dans la paroi. Il fit à Isaure, autour de la taille et des cuisses, un baudrier de corde, avec un nœud qu’il serra en posant le pied contre sa hanche, comme on serre la sangle d’un cheval. Elle prit une barre de fer à pointe, un pied-de-biche, les crampons, une lanterne sourde qu’elle accrocha à sa ceinture. Pétronille et Tobie prirent la corde derrière le palan.",
     "mentions": []
    },
    {
     "id": "c8-b33",
     "text": "— Deux coups sur la corde, on descend, dit Constant. Trois coups, on arrête. Quatre, on remonte. Si vous ne pouvez plus tirer sur la corde, on remonte quand même.",
     "mentions": []
    },
    {
     "id": "c8-b34",
     "text": "— Et si la corde casse ?",
     "mentions": []
    },
    {
     "id": "c8-b35",
     "text": "— Elle ne cassera pas. C’est moi qui l’ai tressée.",
     "mentions": []
    },
    {
     "id": "c8-b36",
     "text": "Elle enjamba la margelle et se laissa aller dans le trou.",
     "mentions": []
    },
    {
     "id": "c8-b37",
