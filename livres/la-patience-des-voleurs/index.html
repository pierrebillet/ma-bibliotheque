   "visualDescription": "Vue verticale vertigineuse à l’intérieur d’un puits rond creusé par l’eau dans la glace, qui tourne comme une coquille d’escargot. Isaure, baudrier de corde, crampons, barre de fer à la main, lanterne sourde à la ceinture, descend au bout d’une corde tendue. Les parois défilent : bleu clair en haut, bleu nuit, puis noir en bas ; strates de bulles, une fine bande grise de cendre, et, à hauteur de son visage, une feuille de bouleau encore verte prise dans la glace. De l’eau ruisselle. En bas, l’obscurité totale et une brume. Peur, émerveillement.",
   "blocks": [
    {
     "id": "c8-b01",
     "text": "Le Tombant se leva dans la nuit du 10 au 11 mars, comme il se lève chaque année quelques jours avant le Vêlage, et il souffla trois nuits. C’est un vent qui ne vient pas de la mer, comme les autres, mais d’en haut : il naît sur les grandes neiges, au-delà du Champ des Remis, là où personne ne va, et il descend la Coulée en suivant la pente, de plus en plus lourd et de plus en plus froid, comme de l’eau qui dévale un escalier. Il arrache les volets. Il éteint les lanternes et fait tourner leurs cages vides au bout des perches. Il fait chanter les cheminées. Les gens de Demeure disaient qu’il descendait tous les ans vérifier que la ville était toujours là, et qu’il fallait lui laisser un bol de soupe sur le rebord d’une fenêtre ; ils le disaient en riant, et ils le faisaient.",
     "mentions": [
      "le-tombant",
      "la-coulee",
      "velage"
     ]
    },
    {
     "id": "c8-b02",
     "text": "Dans la Rue Longue, les tapissiers de la Régence avaient commencé d’accrocher les guirlandes du Vêlage. Le Tombant les décrocha la première nuit. Ils les raccrochèrent le lendemain, et le Tombant les décrocha de nouveau ; au matin du 12, on trouvait des branches de sapin d’importation jusque sur les toits du Dernier Rang, et Isaure en ramassa une devant sa porte, en sortant mesurer la fente, et la rentra dans la maison, parce qu’elle sentait bon.",
     "mentions": [
      "la-regence",
      "maison-sorbier"
     ]
    },
    {
     "id": "c8-b03",
     "text": "Sous la glace, on n’entendait pas le Tombant. On entendait seulement les chaudières, que Pétronille poussait si fort qu’elles se mettaient à cogner, et le sifflement de deux lances au lieu d’une : Constant en avait fabriqué une seconde, le 10, avec un bout de conduite de cuivre et la pompe à bras d’une vieille voiture à incendie que le quartier remisait sous un hangar et que personne ne penserait à chercher avant le prochain incendie. On travaillait maintenant en deux équipes. Pétronille et Tobie à une lance, Constant et Isaure à l’autre, et on se relayait à la pompe toutes les demi-heures, et on dormait par morceaux, assis contre la paroi de la citerne, la tête sur les genoux.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal",
      "les-etuves"
     ]
    },
    {
     "id": "c8-b04",
     "text": "Chaque jour à midi, sur la terrasse du Bureau, Isaure remettait au sergent Morvan un billet plié en quatre. Le 10 : « Une toise, quatre pieds. » Le 11 : « Une toise, cinq pieds. » Le 12 : « Deux toises. » Le sergent prenait le billet, le glissait dans son gant sans le lire, soulevait son casque et repartait. Le 10 au soir, le tunnel avait quatre toises. Le 11, il en avait quatre et demie. Le 12, il en avait cinq et demie. Isaure avait acheté chez le papetier de la rue des Vitriers un second carnet, à couverture noire, pour y écrire les chiffres qu’elle donnait au sergent, parce qu’elle avait peur, à force de fatigue, de les confondre avec les autres. Elle n’avait jamais eu de carnet noir. Les chiffres vrais restaient dans le rouge.",
     "mentions": [
      "sergent-morvan",
      "la-garde",
      "jalons"
     ]
    },
    {
     "id": "c8-b05",
     "text": "Le 12 au matin, Maître Bastide s’arrêta derrière elle, au Bureau, pendant qu’elle recopiait au propre les relevés du profil de la Tour. Il resta là un long moment. Elle ne se retourna pas.",
     "mentions": [
      "onesime-bastide",
      "bureau-des-jalons"
     ]
    },
    {
     "id": "c8-b06",
     "text": "— Vous avez deux carnets, Sorbier.",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "— Oui, Maître.",
     "mentions": []
    },
    {
     "id": "c8-b08",
     "text": "— Lequel est le bon ?",
     "mentions": []
    },
    {
     "id": "c8-b09",
     "text": "— Le rouge.",
     "mentions": []
    },
    {
     "id": "c8-b10",
     "text": "— Bien, dit Maître Bastide, et il s’en alla.",
     "mentions": []
    },
    {
     "id": "c8-b11",
     "text": "Constant toussait. Il toussait depuis le début du mois, et depuis le Tombant il toussait davantage, d’une toux qui ne venait plus de la gorge mais de plus bas, et qui le pliait en deux sur la pompe. Pétronille lui avait dit trois fois d’aller se coucher. Il avait répondu la première fois qu’il se coucherait quand il serait mort, la deuxième fois qu’il avait dormi quarante et un ans, et la troisième fois il n’avait pas répondu. Il avait continué d’assembler, avec du bois de charpente récupéré sur un chantier de la Corporation, ce qu’il appelait la sortie : une planche longue et basse, munie de patins de fer, où l’on coucherait le cercueil pour le tirer à travers le tunnel ; un palan de Remonteur, avec ses poulies et ses cordages, qu’il scella lui-même dans la paroi de la citerne ; une chèvre de trois perches liées au sommet, qu’on pourrait dresser au-dessus de l’escalier. Il travaillait lentement, avec des gestes qui avaient cinquante ans et qui n’avaient rien oublié. Isaure le regardait faire des nœuds. Ils étaient parfaits.",
     "mentions": [
      "constant-merel",
      "remontee",
      "moulins"
     ]
    },
    {
     "id": "c8-b12",
     "text": "Dans la nuit du 12 au 13, à trois heures du matin, Pétronille arrêta sa lance, et dit à voix basse :",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c8-b13",
     "text": "— Venez voir.",
     "mentions": []
    },
    {
     "id": "c8-b14",
     "text": "Ils rampèrent l’un derrière l’autre jusqu’au fond du tunnel, dans la vapeur qui se dissipait, Constant le premier, Isaure derrière lui avec la lanterne, Tobie derrière elle. Au fond, la paroi de glace était lisse et bleue, d’un bleu presque noir, et Isaure leva la lanterne. La lumière entra dans la glace. Et au-delà, à une toise, peut-être un peu moins, dans le bleu épais strié de bulles, il y avait une ombre. Longue. Inclinée. Avec, à un bout, un petit rectangle plus clair.",
     "mentions": [
      "clemence-merel"
     ]
    },
    {
     "id": "c8-b15",
     "text": "C’était la même ombre que celle qu’Isaure avait vue dans le mur de la glacière basse, mais vue de l’autre côté, de derrière, comme on voit quelqu’un de dos. Personne ne parla. Constant resta immobile un long moment, à quatre pattes sur la planche, dans l’eau de fonte qui lui trempait les genoux. Puis il ôta son gant droit et posa la main à plat sur la glace, les doigts écartés.",
     "mentions": [
      "constant-merel",
      "glaciere-basse"
     ]
    },
    {
     "id": "c8-b16",
     "text": "— Bonsoir, dit-il.",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "C’est tout ce qu’il dit. Il garda la main sur la glace jusqu’à ce qu’elle devienne blanche, et Isaure dut la lui prendre et la lui remettre dans le gant, comme à un enfant, et il se laissa faire.",
     "mentions": []
    },
    {
     "id": "c8-b18",
     "text": "— Une toise, dit-elle, d’une voix qu’elle voulut ordinaire. Moins. Cinq pieds, peut-être. Trois nuits. On l’aura le 15. On aura une nuit d’avance.",
     "mentions": []
    },
    {
     "id": "c8-b19",
     "text": "Ils n’eurent pas de nuit d’avance. Quand ils revinrent dans la citerne, l’eau leur arrivait aux chevilles.",
     "mentions": []
    },
    {
     "id": "c8-b20",
     "text": "— Le moulin, dit Pétronille.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "Elle avait couru jusqu’au trou, au bout de la salle, et elle se penchait sur la margelle de planches, et Isaure, en la rejoignant, n’entendit rien. C’était cela qui était terrible : elle n’entendit rien. Le grondement sourd qui montait depuis vingt-six ans de ce trou, jour et nuit, comme celui d’une foule dans une grande salle, s’était tu. À sa place, il y avait un clapotis. L’eau des deux lances, l’eau de la fonte, l’eau chaude qui débordait du réservoir descendaient dans le moulin et remontaient aussitôt, noires, avec des bouts de glace qui tournaient à la surface.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c8-b22",
     "text": "— Il est bouché, dit Pétronille. Nom d’un sérac de nom d’un sérac. Il n’a jamais été bouché. En vingt-six ans.",
     "mentions": []
    },
    {
     "id": "c8-b23",
     "text": "— C’est le Tombant, dit Isaure. Il fait si froid depuis trois nuits que la gorge du moulin a gelé. Quelque part en dessous, l’eau qui descend a trouvé de la glace neuve, et la glace neuve a pris tout ce qui passait. Un bouchon.",
     "mentions": [
      "le-tombant",
      "moulins"
     ]
    },
    {
     "id": "c8-b24",
     "text": "— Et si on arrête les lances ?",
     "mentions": []
    },
    {
     "id": "c8-b25",
     "text": "— L’eau cessera de monter. Mais elle ne descendra pas. Demain matin, vos garçons de bains trouveront la citerne pleine, et l’eau sera montée jusqu’aux chaudières, et à midi toute la Rue Longue saura que les Étuves ont un problème de moulin, et à une heure la Sûreté le saura aussi. Et si on laisse l’eau dans le tunnel, elle gèlera d’ici demain soir. Il faudra le recreuser.",
     "mentions": [
      "les-etuves",
      "la-garde"
     ]
    },
    {
     "id": "c8-b26",
     "text": "Personne ne répondit. L’eau montait. Elle était à mi-mollet.",
     "mentions": []
    },
    {
     "id": "c8-b27",
     "text": "— Il faut descendre, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c8-b28",
     "text": "Elle le dit avant d’y avoir réfléchi, et une fois qu’elle l’eut dit, elle y réfléchit, et elle vit que c’était juste. Il fallait quelqu’un qui connaisse la glace et qui ne pèse pas lourd. Tobie était trop grand pour le moulin. Pétronille était trop lourde pour la corde. Constant était Constant.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel"
     ]
    },
    {
     "id": "c8-b29",
     "text": "— Non, dit Constant.",
     "mentions": []
    },
    {
     "id": "c8-b30",
     "text": "— Il n’y a que moi.",
     "mentions": []
    },
    {
     "id": "c8-b31",
     "text": "— Non, redit-il. Puis il la regarda — il n’y avait qu’elle, et ils le savaient tous les deux —, et il se tut, et il alla chercher la chèvre.",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "Il la dressa au-dessus du moulin en quelques minutes, trois perches liées au sommet, une poulie, la corde passée dedans et ramenée au palan scellé dans la paroi. Il fit à Isaure, autour de la taille et des cuisses, un baudrier de corde, avec un nœud qu’il serra en posant le pied contre sa hanche, comme on serre la sangle d’un cheval. Elle prit une barre de fer à pointe, un pied-de-biche, les crampons, une lanterne sourde qu’elle accrocha à sa ceinture. Pétronille et Tobie prirent la corde derrière le palan.",
     "mentions": [
      "remontee",
      "constant-merel"
     ]
    },
    {
     "id": "c8-b33",
     "text": "— Deux coups sur la corde, on descend, dit Constant. Trois coups, on arrête. Quatre, on remonte. Si vous ne pouvez plus tirer sur la corde, on remonte quand même.",
     "mentions": []
    },
    {
     "id": "c8-b34",
     "text": "— Et si la corde casse ?",
     "mentions": []
    },
    {
     "id": "c8-b35",
     "text": "— Elle ne cassera pas. C’est moi qui l’ai tressée.",
     "mentions": []
    },
    {
     "id": "c8-b36",
     "text": "Elle enjamba la margelle et se laissa aller dans le trou.",
     "mentions": []
    },
    {
     "id": "c8-b37",
     "text": "Le moulin était une gorge ronde, lisse, creusée par l’eau, qui descendait en tournant sur elle-même comme la coquille d’un escargot. Les premières toises étaient bleues, du bleu de la citerne. Puis la lumière de la lanterne s’enfonçait moins loin dans les parois, et le bleu devenait plus sombre, puis presque noir, et la glace changeait. Isaure voyait passer, à hauteur de ses yeux, à mesure qu’on la descendait, les années de la Coulée, couche après couche, comme les pages d’un livre qu’on feuillette à l’envers. Des bandes de bulles fines. Une bande grise, d’un doigt d’épaisseur, qui devait être l’hiver des cendres, en 187, quand un volcan du Midi avait assombri tout un été et que la neige était tombée sale. Plus bas, prise dans la glace comme dans du verre, une feuille de bouleau, verte encore, qui avait dû tomber d’un arbre quatre ou cinq siècles plus tôt, du temps où il poussait encore des arbres sur les Parois. Isaure passa à un pouce de la feuille. Elle faillit tendre la main.",
     "mentions": [
      "moulins",
      "la-coulee"
     ]
    },
    {
     "id": "c8-b38",
     "text": "Elle ne sut pas combien de temps elle descendit. Elle compta les coups de palan, d’abord, puis elle perdit le compte. L’eau lui coulait sur les épaules, glacée, et elle s’en aperçut à peine. Au bout de ce qui lui sembla très long — cinq toises, peut-être, elle le calcula plus tard d’après la corde —, ses crampons touchèrent quelque chose de dur sous l’eau, et elle tira trois coups.",
     "mentions": []
    },
    {
     "id": "c8-b39",
     "text": "C’était le bouchon. Le moulin, à cet endroit, faisait un coude, et dans le coude il y avait un amas de glace grise et spongieuse, de la neige fondue qui avait regelé, épaisse d’un pied, qui fermait la gorge comme une bonde ferme un évier. L’eau s’accumulait au-dessus, jusqu’à ses genoux. Isaure planta la barre de fer dans le bouchon. Elle rencontra quelque chose de dur. Elle dégagea l’obstacle à la main, en jurant, parce que l’eau était si froide qu’elle ne sentait plus ses doigts, et elle trouva, en travers du coude, pris dans la glace grise, un manche de bois. Au bout du manche, rongée de rouille, il y avait une pelle.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c8-b40",
     "text": "Isaure éclata de rire, seule, à onze toises sous les Étuves, dans le noir, avec de l’eau glacée jusqu’aux genoux. Elle riait encore quand elle leva la barre de fer et l’abattit de toutes ses forces à côté de la pelle de Pétronille.",
     "mentions": [
      "petronille-gaudin",
      "les-etuves"
     ]
    },
    {
     "id": "c8-b41",
     "text": "Le bouchon céda d’un coup.",
     "mentions": []
    },
    {
     "id": "c8-b42",
     "text": "Elle entendit le craquement, puis un bruit de succion énorme, et l’eau accumulée au-dessus d’elle, toute l’eau de la citerne, l’eau des deux lances et du réservoir, s’engouffra dans la gorge et lui tomba dessus. Elle fut arrachée de la paroi comme une feuille. La lanterne se détacha de sa ceinture, tomba, tourna une fois dans le noir en éclairant la glace, et disparut ; elle ne l’entendit jamais arriver. Elle ne voyait plus rien. Elle pendait au bout de la corde dans un torrent glacé qui la poussait vers le bas, qui la cognait contre les parois, qui lui entrait dans la bouche et dans le nez, et en dessous d’elle, très loin, le grondement était revenu, énorme, et il l’appelait.",
     "mentions": []
    },
    {
     "id": "c8-b43",
     "text": "Elle compta, comme chaque fois qu’elle avait peur. Elle compta les secondes, puis les coups de corde, et au bout de onze secondes, ou de onze ans, la corde se tendit à lui couper la taille, et elle monta d’un pied. Puis d’un autre. Le torrent la lâcha, la reprit, la lâcha. Elle se cognait aux parois et ne sentait plus rien. Elle comptait les pieds. Elle monta pendant deux cent quarante-trois secondes, et à la deux cent quarante-quatrième des mains l’attrapèrent par les épaules, par le baudrier, par les cheveux, et la tirèrent sur les planches de la margelle, et elle resta là, sur le dos, à cracher de l’eau et à regarder le plafond de glace bleue de la citerne où pendaient les lanternes, et à trouver que c’était la plus belle chose qu’elle eût jamais vue.",
     "mentions": [
      "les-etuves"
     ]
    },
    {
     "id": "c8-b44",
     "text": "Dans le trou, derrière elle, le moulin grondait de nouveau, comme une foule qui recommence à parler après un silence.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c8-b45",
     "text": "— La pelle, dit-elle quand elle put parler. Pétronille. Votre pelle. Elle n’est jamais arrivée.",
     "mentions": []
    },
    {
     "id": "c8-b46",
     "text": "Pétronille la regarda, ouvrit la bouche, la referma, et se mit à rire, un rire énorme qui fit trembler le réservoir de cuivre, et Tobie se mit à rire aussi, à genoux dans l’eau qui baissait, en pleurant. Isaure tourna la tête pour chercher Constant.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel"
     ]
    },
    {
     "id": "c8-b47",
     "text": "Il était assis par terre, contre le palan, les deux mains encore serrées sur la corde. Il ne riait pas. Il avait les lèvres bleues. Il lâcha la corde, très lentement, doigt par doigt, comme l’Intendante mettait ses gants, et il toussa, et quand il retira sa main de sa bouche, il y avait du rouge dedans.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c8-b48",
     "text": "Ils le montèrent à eux trois dans la chambre de Pétronille, derrière la lingerie, une petite pièce chaude qui sentait le savon, et Pétronille envoya un de ses neveux réveiller la mère Soubise, qui avait été apothicaire à la Rue Longue pendant quarante ans et qui ne posait jamais de questions à personne après minuit. La mère Soubise l’écouta respirer, lui regarda les ongles, lui fit boire une décoction amère et dit qu’il avait le poumon pris, qu’il avait soixante-huit ans, qu’il avait passé quarante et un ans dans une tour humide et trois semaines dans une cave de glace, et que la suite ne dépendait plus d’elle. Puis elle s’en alla. Pétronille resta un moment debout près du lit, les bras croisés, puis elle alla s’asseoir dans le couloir, sur une pile de serviettes, et Isaure l’entendit pleurer comme on casse du bois.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c8-b49",
     "text": "Isaure resta. On lui avait donné des vêtements secs, une robe de Pétronille où elle aurait tenu deux fois et qu’elle avait serrée à la taille avec la ceinture de son baudrier. Elle était assise sur une chaise près du lit. Elle ne dormait pas. Elle regardait Constant respirer, et elle comptait les respirations sans le vouloir. Vers six heures, dans la lumière grise qui venait du couloir, il ouvrit les yeux, et elle vit qu’il la reconnaissait.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c8-b50",
     "text": "— Vous êtes vivante, dit-il.",
     "mentions": []
    },
    {
     "id": "c8-b51",
     "text": "— Vous aussi.",
     "mentions": []
    },
    {
     "id": "c8-b52",
     "text": "— Pour l’instant. La mère Soubise a l’air de penser que c’est une question de glace. Elle a peut-être raison.",
     "mentions": []
    },
    {
     "id": "c8-b53",
     "text": "Il resta un moment silencieux, à regarder le plafond.",
     "mentions": []
    },
    {
     "id": "c8-b54",
     "text": "— Mademoiselle Sorbier. Il faut que je vous dise quelque chose, et il faut que je vous le dise maintenant, parce que je ne sais pas combien de temps j’ai, et que je ne veux pas mourir en vous ayant menti.",
     "mentions": []
    },
    {
     "id": "c8-b55",
     "text": "Elle ne répondit pas.",
     "mentions": []
    },
    {
     "id": "c8-b56",
     "text": "— Il n’y a pas d’acheteur, dit Constant. Il n’y a pas d’homme du Midi. Je n’ai écrit à personne. Il n’y a pas de part. Je vous ai choisie parce que vous étiez honnête, et parce que votre maison partait. Il me fallait quelqu’un d’honnête qui ait besoin de quelque chose.",
     "mentions": []
    },
    {
     "id": "c8-b57",
     "text": "Isaure ne bougea pas. Elle avait su, peut-être. Un pont de neige qui cède d’un demi-pouce et qui tient. Elle avait su, et elle n’avait pas voulu mesurer.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c8-b58",
     "text": "— La Couronne n’est pas à nous, dit-il. Elle n’a jamais été à nous. Clémence l’a dit en mourant : on ne jette pas ce qui n’est pas à nous. La glace la rendra quand il faudra. Je ne vous ai pas tout répété, l’autre soir, au Carré. Elle a dit autre chose. Elle a dit : dans quarante ans, les Varnier seront vieux ou morts, et leur Bail ne voudra plus rien dire. Dans quarante ans, la petite aura l’âge de choisir, et plus personne ne pourra choisir à sa place. Alors on la lui rendra. Elle la portera, elle la vendra, elle la jettera dans le Bras, ce qu’elle voudra. C’est à elle. En 571, on n’avait pas le droit de choisir pour elle. On avait seulement le droit de lui garder le choix.",
     "mentions": [
      "clemence-merel",
      "mahaut-de-frimas",
      "compagnie-des-glaces"
     ]
    },
    {
     "id": "c8-b59",
     "text": "— Mahaut.",
     "mentions": []
    },
    {
     "id": "c8-b60",
     "text": "— La petite. Elle a cinquante-huit ans. Je la lui apporte. C’est tout. C’est tout ce que je fais depuis quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c8-b61",
     "text": "Isaure regarda ses mains. Elles ne tremblaient pas. C’était une chose qu’elle avait remarquée chez elle depuis l’enfance.",
     "mentions": []
    },
    {
     "id": "c8-b62",
     "text": "— J’ai menti sur la glace, dit-elle. Pour vous. J’ai menti à l’Intendante, et j’ai menti au Bureau, et j’ai deux carnets. J’ai refusé la remontée de ma maison. Ma maison part dans quatre jours. Pour une part qui n’existe pas.",
     "mentions": [
      "maison-sorbier",
      "serment-du-pas"
     ]
    },
    {
     "id": "c8-b63",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c8-b64",
     "text": "— Vous auriez pu me le dire.",
     "mentions": []
    },
    {
     "id": "c8-b65",
     "text": "— Je vous le dis.",
     "mentions": []
    },
    {
     "id": "c8-b66",
     "text": "— Avant.",
     "mentions": []
    },
    {
     "id": "c8-b67",
     "text": "— Vous n’auriez pas dit oui pour une morte.",
     "mentions": []
    },
    {
     "id": "c8-b68",
     "text": "— Vous n’en savez rien.",
     "mentions": []
    },
    {
     "id": "c8-b69",
     "text": "— Non, dit Constant. Je n’en savais rien. Je n’avais pas le droit de le risquer. Je vous ai menti comme vous avez menti à l’Intendante, mademoiselle Sorbier. Pour la même raison, et aussi mal. Parce que c’était le seul chiffre qui marchait.",
     "mentions": []
    },
    {
     "id": "c8-b70",
     "text": "Elle se leva. La robe de Pétronille traînait par terre. Elle retira la ceinture de corde, la posa sur la chaise, releva la robe à deux mains, et sortit de la chambre sans se retourner. Dans le couloir, Pétronille s’était endormie sur ses serviettes, la bouche ouverte. Dans la chaufferie, les neveux dormaient contre les chaudières éteintes. Dans le vestibule, la femme aux serviettes n’était pas encore arrivée.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c8-b71",
     "text": "Dehors, le Tombant soufflait encore, mais il faiblissait ; c’était sa dernière nuit, et il le savait. Isaure descendit la Rue Longue dans le petit jour, avec sa robe trop grande qui claquait autour de ses jambes, pieds nus dans ses bottes trempées, sans écharpe, parce qu’elle l’avait oubliée sur la margelle du moulin. Des gamins qui ramassaient les guirlandes arrachées la regardèrent passer. Elle ne les vit pas. Elle passa devant le Carré d’Attente sans tourner la tête. Elle descendit jusqu’à la quarante-neuvième ogive, et devant le perron à double escalier de l’Hôtel de Frimas, elle s’arrêta. Elle ne savait pas pourquoi elle était venue, et elle le savait très bien : elle voulait voir la personne pour qui on lui avait menti.",
     "mentions": [
      "carre-d-attente",
      "hotel-de-frimas",
      "le-tombant"
     ]
    },
    {
     "id": "c8-b72",
     "text": "Elle monta les marches et frappa.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-9",
   "number": 9,
   "title": "La Margravine en attente",
   "image": "images/chapter-09.webp",
   "alt": "Dans une bibliothèque froide aux rayonnages blanchis, une petite femme âgée en robe de chambre de velours et toque de fourrure se tient près d’un tableau noir couvert de calculs à la craie pâlie ; une jeune femme la regarde, près d’un poêle.",
   "visualDescription": "Intérieur d’un vieux palais, matin gris. Bibliothèque aux rayonnages jusqu’au plafond, livres reliés au dos blanchi, givre sur les vitres. Un poêle de fonte, une table couverte de cartes à jouer étalées en réussite, un vieux domestique endormi sur un tabouret contre les livres. Mahaut, petite, visage fin et vif, toque de fourrure, robe de chambre de velours râpé, touche du bout du doigt un grand tableau noir sur chevalet couvert de calculs à la craie presque effacés (aucun caractère lisible). Isaure, dans un manteau mouillé, la regarde. Émotion contenue, poussière et lumière.",
   "blocks": [
    {
     "id": "c9-b01",
     "text": "La porte de l’Hôtel de Frimas s’ouvrit au troisième coup, et ce fut la Margravine elle-même qui parut, en robe de chambre de velours râpé et en toque de fourrure, une bougie à la main. Elle regarda Isaure de haut en bas : les cheveux collés, la robe de Fendeuse retenue à deux mains, les bottes qui faisaient des flaques sur le perron.",
     "mentions": [
      "hotel-de-frimas",
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b02",
     "text": "— La Jalonneuse du Vêlage, dit-elle. Vous avez l’air de sortir d’un moulin.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c9-b03",
     "text": "— J’en sors.",
     "mentions": []
    },
    {
     "id": "c9-b04",
     "text": "— Alors entrez. On ne laisse pas sur son perron quelqu’un qui sort d’un moulin ; c’est dans la Règle, je crois, ou ça devrait y être.",
     "mentions": []
    },
    {
     "id": "c9-b05",
     "text": "Le vestibule de l’Hôtel de Frimas était plus froid que la rue. Il y avait du givre à l’intérieur des fenêtres, des housses grises sur les meubles, et un grand escalier de pierre qui montait dans le noir, gardé par des Margraves peints dont on ne voyait, à la lueur de la bougie, que les mains et les couronnes. La Margravine traversa tout cela sans le regarder, d’un petit pas vif, et ouvrit une porte au fond d’un couloir.",
     "mentions": [
      "hotel-de-frimas",
      "couronne-de-givre"
     ]
    },
    {
     "id": "c9-b06",
     "text": "— Je ne chauffe plus qu’une pièce, dit-elle. On s’habitue. Asseyez-vous près du poêle. Anselme est sourd et il dort, il ne vous gênera pas ; moi non plus, j’espère.",
     "mentions": []
    },
    {
     "id": "c9-b07",
     "text": "C’était une bibliothèque. Les rayonnages montaient jusqu’au plafond, pleins de livres reliés de cuir dont le dos avait blanchi, et il y avait un poêle de fonte, une table couverte de cartes à jouer étalées en réussite, un fauteuil, une chaise, un vieux domestique endormi sur un tabouret dans un coin, la tête contre les livres. Et contre le mur du fond, sur un chevalet de bois, un grand tableau noir.",
     "mentions": [
      "hotel-de-frimas"
     ]
    },
    {
     "id": "c9-b08",
     "text": "Isaure le regarda, et elle oublia qu’elle avait froid.",
     "mentions": []
    },
    {
     "id": "c9-b09",
     "text": "Le tableau était couvert d’un calcul à la craie, pâli jusqu’au gris, presque effacé par endroits, mais lisible pour qui savait lire ce genre de chose : un chemin de Remis. Tout y était, dans l’ordre où Isaure l’avait fait elle-même trois semaines plus tôt, en une nuit, sur la grande table du Bureau : la place au Champ des Remis, la profondeur, les vitesses corrigées par la profondeur, le passage à la Ligne, la déviation du Roc. En haut, souligné deux fois, l’énoncé : « Où va un Remis ? — Exemple : rang 12, place 31, deux toises et trois pieds. » En bas, encadré : « vers 620, rue des Orfèvres ». C’était le chiffre qu’Isaure avait trouvé de tête, dans le bureau aux serviettes, sans la cave. L’écriture était ronde, rapide, un peu penchée. Au coin, en bas à droite, minuscule, il y avait un sablier.",
     "mentions": [
      "clemence-merel",
      "champ-des-remis",
      "registre-des-remis"
     ]
    },
    {
     "id": "c9-b10",
     "text": "— C’est la dernière leçon, dit la Margravine derrière elle. Décembre 570. Après, elle n’a plus pu venir. Je ne l’ai jamais effacé. Anselme a voulu, une fois, en faisant la poussière ; je lui ai jeté un encrier. Il ne s’en souvient pas, mais il n’a jamais recommencé. Vous connaissiez Clémence Mérel ? Vous êtes trop jeune.",
     "mentions": [
      "mahaut-de-frimas",
      "clemence-merel"
     ]
    },
    {
     "id": "c9-b11",
     "text": "— Rang 12, place 31, dit Isaure. Une place achetée d’avance, à l’automne. C’est là qu’on l’a remise.",
     "mentions": []
    },
    {
     "id": "c9-b12",
     "text": "La Margravine ne répondit pas tout de suite.",
     "mentions": [
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b13",
     "text": "— Je ne savais pas, dit-elle enfin. Je n’ai pas pu aller à sa remise. C’était le 4 mars. Le 4 mars 571, j’étais enfermée dans cette maison avec le Conseil, qui me demandait où était la Couronne, et le fils Varnier, qui me demandait si je savais qu’on ne pourrait pas se marier, et un médecin, qui me demandait si je dormais. On ne m’a pas dit où on l’avait remise. Je n’ai pas demandé. Je ne voulais pas qu’on se demande pourquoi je demandais.",
     "mentions": [
      "compagnie-des-glaces",
      "couronne-de-givre"
     ]
    },
    {
     "id": "c9-b14",
     "text": "Elle s’assit dans le fauteuil, devant sa réussite, et fit signe à Isaure de prendre la chaise.",
     "mentions": []
    },
    {
     "id": "c9-b15",
     "text": "— Elle m’a fait faire ce calcul à la main, trois après-midi de suite, reprit-elle. Je trouvais l’exemple bizarre. Elle disait que c’était une place comme une autre. Je l’ai fait. J’ai trouvé 620. J’ai trouvé la rue des Orfèvres. Elle a dit : très bien, tu sauras où aller. J’ai cru que c’était une façon de parler.",
     "mentions": []
    },
    {
     "id": "c9-b16",
     "text": "Elle regarda le tableau, de loin, comme on regarde une fenêtre éclairée dans une maison où l’on a vécu.",
     "mentions": []
    },
    {
     "id": "c9-b17",
     "text": "— Pourquoi êtes-vous venue, mademoiselle Sorbier ? Vous n’êtes pas tombée dans un moulin pour me parler de géométrie.",
     "mentions": []
    },
    {
     "id": "c9-b18",
     "text": "Isaure le lui dit.",
     "mentions": []
    },
    {
     "id": "c9-b19",
     "text": "Elle le dit comme elle aurait remis un relevé : dans l’ordre, avec les chiffres, sans rien ajouter. La Couronne dans le cercueil. Le cercueil sous la Régence. La glacière basse, le 19, la dispense, le 17. Le tunnel. La nuit du 16. Constant, qui toussait du sang dans la chambre de Pétronille Gaudin. Et ce qu’il lui avait dit à l’aube, avant qu’elle parte : que la Couronne n’avait jamais été à eux, que Clémence la lui avait gardée pour qu’elle choisisse, et qu’il la lui apportait. Elle dit tout, sauf son propre mensonge à l’Intendante, parce qu’elle ne voyait pas en quoi cela regardait une Margravine.",
     "mentions": [
      "couronne-de-givre",
      "clemence-merel",
      "glaciere-basse",
      "constant-merel",
      "devancer-la-glace"
     ]
    },
    {
     "id": "c9-b20",
     "text": "Quand elle eut fini, la Margravine resta immobile un long moment. Puis elle baissa les yeux sur sa réussite, prit une carte, la regarda, la reposa exactement où elle était.",
     "mentions": [
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b21",
     "text": "— Elle l’a gardée avec elle, dit-elle.",
     "mentions": []
    },
    {
     "id": "c9-b22",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c9-b23",
     "text": "— Quarante et un ans. Sous la ville. Pendant que je balayais mon perron.",
     "mentions": []
    },
    {
     "id": "c9-b24",
     "text": "Elle leva les yeux, et Isaure vit qu’elle souriait, et que c’était pire que si elle avait pleuré.",
     "mentions": []
    },
    {
     "id": "c9-b25",
     "text": "— C’est moi qui ai ouvert la porte, dit Mahaut de Frimas.",
     "mentions": []
    },
    {
     "id": "c9-b26",
     "text": "Dans son coin, le vieil Anselme ronfla doucement contre les livres.",
     "mentions": []
    },
    {
     "id": "c9-b27",
     "text": "— J’avais la clef de l’héritière, reprit-elle. La nuit du 1er mars, à trois heures, je suis montée à la Chambre de Givre en chemise, avec ma clef et une bougie. Le Tombant hurlait. On n’entendait que lui. J’ai ouvert, j’ai soufflé la bougie, je me suis assise sur le coffre, dans le noir, et j’ai attendu. Au bout d’un moment, on a gratté à la lucarne. Je suis montée sur le coffre, je l’ai ouverte, et il est descendu du toit sans aucun bruit, comme un chat, avec de la neige plein les cheveux. Il a pris la Couronne sur son coussin. Il l’a enveloppée dans un linge. Et puis il s’est retourné vers moi, et il m’a fait une révérence, une vraie, comme un maître à danser, dans le noir, avec la Couronne sous le bras. Et il est reparti par la lucarne. Il n’a pas dit un mot. Moi non plus. J’avais dix-sept ans. J’ai refermé la porte à clef, je suis redescendue me coucher, et j’ai dormi comme une pierre pour la première fois depuis que mon père était mort.",
     "mentions": [
      "vol-de-571",
      "constant-merel"
     ]
    },
    {
     "id": "c9-b28",
     "text": "— Et après ?",
     "mentions": []
    },
    {
     "id": "c9-b29",
     "text": "— Après, Clémence est morte. Et le 6, il est allé à la Garde et il a dit que c’était lui, et qu’il l’avait jetée dans le Sillage. J’ai attendu qu’il dise mon nom. Il ne l’a pas dit. Au procès, il ne l’a pas dit. À la Tour, il ne l’a pas dit. Quarante et un ans. J’attendais tous les matins qu’on vienne me chercher, et puis, au bout de dix ans, j’ai compris que personne ne viendrait, et je me suis mise à attendre autre chose, sans savoir quoi. On m’appelle la Margravine en attente. On croit que c’est parce que j’attends ma couronne.",
     "mentions": [
      "la-tour",
      "la-garde",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c9-b30",
     "text": "Elle eut un petit rire sec.",
     "mentions": []
    },
    {
     "id": "c9-b31",
     "text": "— Je suis la seule souveraine au monde qui attende son sacre depuis quarante et un ans. Même les morts arrivent en avance. Vous venez de me le prouver.",
     "mentions": []
    },
    {
     "id": "c9-b32",
     "text": "— Vous ne l’avez jamais revu ?",
     "mentions": []
    },
    {
     "id": "c9-b33",
     "text": "— Je n’avais pas le droit. Si j’étais allée le voir à la Tour, on se serait demandé pourquoi. Tout le monde, à Demeure, se serait demandé pourquoi. Alors je lui ai envoyé des oranges.",
     "mentions": []
    },
    {
     "id": "c9-b34",
     "text": "— Des oranges.",
     "mentions": []
    },
    {
     "id": "c9-b35",
     "text": "— Chaque hiver, au premier bateau du Midi. Une caisse d’oranges, livrée à la Tour, sans nom, pour le prisonnier Mérel. Pendant quarante ans. C’est tout ce que j’ai trouvé. C’est ridicule. Je n’ai jamais su s’il savait d’où elles venaient.",
     "mentions": [
      "la-tour",
      "constant-merel"
     ]
    },
    {
     "id": "c9-b36",
     "text": "Isaure pensa à un vieil homme en manteau trop grand qui achetait des oranges du Midi à prix d’or le premier matin de sa liberté, et qui en pelait une, lentement, assis sur une banquette de l’étuve sèche, en regardant le plafond.",
     "mentions": []
    },
    {
     "id": "c9-b37",
     "text": "— Il sait, dit-elle.",
     "mentions": []
    },
    {
     "id": "c9-b38",
     "text": "La Margravine détourna la tête vers le tableau noir, et elles restèrent un moment sans rien dire, dans la bibliothèque froide, avec le poêle qui ronflait et le vieux domestique qui dormait.",
     "mentions": [
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b39",
     "text": "— Qu’est-ce que vous voulez, madame ? demanda enfin Isaure. Je suis venue vous le demander. C’est pour ça que je suis venue. Voulez-vous cette couronne ?",
     "mentions": []
    },
    {
     "id": "c9-b40",
     "text": "— À dix-sept ans, dit la Margravine, je savais exactement ce que je voulais : ne pas la porter. C’était facile. À cinquante-huit ans, je ne sais plus rien. Je ne sais même pas si nous avons eu raison. La Régence n’a pas été pire que je ne l’aurais été ; elle a même été meilleure, par certains côtés, parce qu’elle avait peur de tout et qu’une ville où le gouvernement a peur de tout n’est pas un si mauvais endroit pour vivre. Je ne sais pas si je veux cette couronne, mademoiselle Sorbier. Je ne sais pas si quelqu’un devrait la vouloir.",
     "mentions": [
      "la-regence"
     ]
    },
    {
     "id": "c9-b41",
     "text": "Elle se leva, alla jusqu’au tableau noir, et posa le bout du doigt sous le sablier, sans l’effacer.",
     "mentions": []
    },
    {
     "id": "c9-b42",
     "text": "— Mais si Clémence l’a gardée pour moi pendant tout ce temps, dit-elle, alors je ne peux pas laisser l’Intendante Laroque ouvrir ce cercueil dans une cave, qui est une femme très bien et qui la mettrait dans un tiroir. Elle m’a volé ce choix pour me le rendre. Je ne le ferai pas en cachette. Je le ferai devant eux.",
     "mentions": [
      "hermine-laroque",
      "clemence-merel"
     ]
    },
    {
     "id": "c9-b43",
     "text": "— Devant qui ?",
     "mentions": []
    },
    {
     "id": "c9-b44",
     "text": "— Devant la ville. Si vous l’amenez au Front, j’y serai.",
     "mentions": [
      "le-front"
     ]
    },
    {
     "id": "c9-b45",
     "text": "Elle se retourna.",
     "mentions": []
    },
    {
     "id": "c9-b46",
     "text": "— Et vous, mademoiselle Sorbier ? Qu’est-ce que vous y gagnez ?",
     "mentions": []
    },
    {
     "id": "c9-b47",
     "text": "— Rien, dit Isaure. On m’a menti.",
     "mentions": []
    },
    {
     "id": "c9-b48",
     "text": "— Alors nous sommes deux, dit la Margravine. C’est une bonne compagnie. Clémence disait que les meilleurs calculs sont ceux qui ne rapportent rien, parce qu’on est sûr de les avoir faits pour eux-mêmes.",
     "mentions": []
    },
    {
     "id": "c9-b49",
     "text": "À midi, sur la terrasse du Bureau, elle remit au sergent Morvan un billet plié en quatre : « Deux toises, un pied. » Elle l’avait écrit devant lui, sur le parapet, dans le carnet noir d’abord, puis sur le billet, et sa main n’avait pas tremblé. Elle revint aux Étuves au début de l’après-midi, avec ses propres vêtements, qu’elle était passée chercher chez elle, et une écharpe de laine grise de sa mère, faute de l’autre. Pétronille était dans son bureau aux serviettes, les yeux rouges, assise devant le plan au charbon qu’elle regardait sans le voir. Tobie était là aussi. Il se leva quand Isaure entra, et il lui tendit quelque chose, sans un mot : son écharpe rouge et blanche, lavée, séchée près des chaudières, pliée en quatre.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal"
     ]
    },
    {
     "id": "c9-b50",
     "text": "— Elle était sur la margelle, dit-il. Je l’ai rincée. L’eau du moulin, ça sent.",
     "mentions": []
    },
    {
     "id": "c9-b51",
     "text": "Isaure la prit, et la noua, et quelque chose lui serra la gorge, qu’elle mit sur le compte de l’eau du moulin.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c9-b52",
     "text": "— Il dort, dit Pétronille sans qu’on lui ait rien demandé. La mère Soubise est repassée. Elle dit qu’il a passé la nuit, et que c’est déjà ça, et qu’il ne faut pas lui demander de passer la suivante. Il a de la fièvre. Il parle à Clémence. Il lui dit des mesures.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c9-b53",
     "text": "Elle se tut, puis elle reprit, plus bas, ce qui chez elle était encore assez haut :",
     "mentions": []
    },
    {
     "id": "c9-b54",
     "text": "— Je savais. Pour l’acheteur. Il me l’a dit la première année, à la Tour, au parloir, avec un garde qui dormait à côté. Pas d’acheteur. La petite. Tout. Je ne t’ai rien dit parce que c’était à lui de te le dire, et parce que tu es une honnête fille, et qu’on ménage les honnêtes filles jusqu’au dernier moment, parce qu’après on n’en trouve plus. Clémence et moi, on a tété le même lait, figure-toi. Sa mère était ma nourrice. Je ne suis pas ici pour une couronne. Je suis ici pour ma sœur de lait, qui va sortir de la glace dans trois jours, et à qui je veux dire au revoir comme il faut.",
     "mentions": [
      "petronille-gaudin",
      "clemence-merel"
     ]
    },
    {
     "id": "c9-b55",
     "text": "— Alors on ne vend pas un Remis, dit Tobie, et il eut l’air si soulagé qu’il dut s’asseoir.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c9-b56",
     "text": "Isaure s’assit aussi. Elle regarda le plan au charbon sur la table : les Étuves, la citerne, le moulin, le tunnel, le petit ovale. Il restait cinq pieds de glace. Il restait trois nuits avant celle du bal. Constant ne pouvait plus pomper. Elle pensa à tout ce qu’elle avait perdu depuis vingt jours : la part que Constant lui avait promise et qui n’existait pas ; et ce qu’elle perdrait le jour où l’on saurait ce qu’il y avait dans son carnet noir : la remontée de sa maison, que l’Intendante lui avait offerte, son nom au Bureau, le Serment du Pas, qu’elle avait déjà trahi. Elle pensa à ce qu’il lui restait : une écharpe rincée, une maison de quatre jours, une Fendeuse qui pleurait comme on casse du bois, un novice qui chantait pour des inconnus, un vieil homme qui parlait à une morte, et, sous la ville, dans la glace de trois siècles, une Jalonneuse de vingt-neuf ans qui avait écrit une fois un chiffre faux pour qu’on ne la trouve pas avant l’heure — et qui avait laissé sur un tableau noir, pour une petite fille, le calcul de son propre chemin.",
     "mentions": [
      "maison-sorbier",
      "serment-du-pas",
      "clemence-merel"
     ]
    },
    {
     "id": "c9-b57",
     "text": "Il n’y avait rien à calculer, là non plus. Mais Isaure pensait à Jeanne Carle, fileuse, remise en 560, qu’aucun des siens n’était plus là pour attendre, et que des inconnus avaient attendue quand même, à genoux dans le vide sous la maison d’un chaudronnier, en chantant. Nul n’affleure seul. Ce n’était pas seulement une règle d’Affleureurs. C’était la seule chose à peu près juste qu’elle eût apprise sur la glace, en onze ans de jalons.",
     "mentions": [
      "affleurement",
      "affleureurs"
     ]
    },
    {
     "id": "c9-b58",
     "text": "Elle prit le charbon de bois sur la table.",
     "mentions": []
    },
    {
     "id": "c9-b59",
     "text": "— Cinq pieds, dit-elle. Trois nuits, à trois. Pétronille à la lance. Tobie et moi à la pompe, en alternance. On s’arrête à six pouces d’elle, pas plus près, et on laisse une peau de glace jusqu’à la dernière nuit. La nuit du 16, on la dégage, on la couche sur la sortie, on la tire avec le palan. Il faut trois heures. Le bal commence à neuf heures. Les sorbets sont servis à minuit ; après minuit, plus personne ne descend dans les glacières. Les Fendeurs de l’Intendante arrivent à six heures. On la sort de la glace entre minuit et trois heures. À trois heures, on est dans la Rue Longue.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal",
      "glaciere-basse",
      "fendeurs"
     ]
    },
    {
     "id": "c9-b60",
     "text": "— Et après ? demanda Pétronille, qui la regardait maintenant avec une attention nouvelle.",
     "mentions": []
    },
    {
     "id": "c9-b61",
     "text": "— Après, la Rendue. Tobie la porte. Il y a toutes les Rendues du Vêlage qui descendent vers le Front à l’aube, de partout dans la ville, avec tous les Remis de la semaine ; une de plus ne se remarquera pas. On arrive au Front avant le jour. Le Prieur sera à la Glissoire pour la Rendue du Dernier Rang. Constant demande son droit de visage. La Margravine sera là.",
     "mentions": [
      "rendue",
      "le-front",
      "la-glissoire",
      "droit-de-visage",
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b62",
     "text": "— La Margravine ? dirent ensemble Pétronille et Tobie.",
     "mentions": []
    },
    {
     "id": "c9-b63",
     "text": "— Elle a dit qu’elle y serait.",
     "mentions": []
    },
    {
     "id": "c9-b64",
     "text": "Tobie avala sa salive. Sa pomme d’Adam monta et descendit.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c9-b65",
     "text": "— Il y a une chose, dit-il. Une Rendue, pour que ce soit une Rendue, il faut une sonnaille de la confrérie. La Règle, article neuf : la Rendue est à la sonnaille. Je n’ai pas de sonnaille. Si je la mène sans sonnaille, ce n’est pas une Rendue, c’est un garçon qui traîne une caisse avec une clochette. La Garde aura le droit de nous arrêter.",
     "mentions": [
      "affleureurs",
      "rendue",
      "la-garde"
     ]
    },
    {
     "id": "c9-b66",
     "text": "— Où sont les sonnailles ?",
     "mentions": []
    },
    {
     "id": "c9-b67",
     "text": "— Au magasin de la Maison des Porteurs. Sous clef. C’est moi qui ai la clef ; c’est le travail des novices, de les astiquer.",
     "mentions": []
    },
    {
     "id": "c9-b68",
     "text": "Il n’ajouta rien. Isaure le regarda. Il était très pâle, et ses oreilles étaient très rouges.",
     "mentions": []
    },
    {
     "id": "c9-b69",
     "text": "— Je la prendrai, dit-il. Celle de frère Hilaire, qui est mort cet hiver. Elle est accordée pour la Rendue. Si on me chasse de la confrérie, eh bien, on me chassera. Je chanterai quand même.",
     "mentions": [
      "tobie-arnal",
      "affleureurs"
     ]
    },
    {
     "id": "c9-b70",
     "text": "— Et quand on sortira des Étuves ? demanda Pétronille. Entre la porte de derrière et le moment où le petit aura sonné, il y a dix pas de rue. Dix pas où ce n’est pas encore une Rendue. Si la Garde est là…",
     "mentions": []
    },
    {
     "id": "c9-b71",
     "text": "— Il faudrait quelqu’un que la Garde écoute, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c9-b72",
     "text": "On frappa à la porte du bureau aux serviettes.",
     "mentions": []
    },
    {
     "id": "c9-b73",
     "text": "C’était Firmin Vauclair. Il avait sa pèlerine qui avait été noire, sa pipe éteinte à la main, et de la neige sur les épaules, et il avait l’air d’un homme qui a monté cent sept marches de trop. Il regarda le plan au charbon sur la table, puis Isaure, puis Pétronille, qui avait pris sans y penser la lance de cuivre posée contre le mur et la tenait comme une gaffe.",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c9-b74",
     "text": "— Posez ça, Pétronille, dit-il avec douceur. Vous me l’avez déjà fait, en 571, à la veillée, avec un tisonnier. Je ne viens arrêter personne. J’ai appris qu’on avait réveillé la mère Soubise cette nuit à quatre heures pour venir ici. Je voulais le voir.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c9-b75",
     "text": "Pétronille posa la lance. Elle le conduisit elle-même à la chambre derrière la lingerie, et Isaure les suivit, et Tobie suivit Isaure, et ils restèrent tous les trois dans l’embrasure, sans oser entrer, pendant que le vieil inspecteur s’approchait du lit.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal"
     ]
    },
    {
     "id": "c9-b76",
     "text": "Constant avait les yeux ouverts. La fièvre lui rougissait les joues et lui brûlait les yeux, mais il reconnut son visiteur, et il sourit.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c9-b77",
     "text": "— Bonsoir, Firmin. Tu as grossi.",
     "mentions": []
    },
    {
     "id": "c9-b78",
     "text": "— Tu as maigri. Ça compense.",
     "mentions": []
    },
    {
     "id": "c9-b79",
     "text": "Firmin tira la chaise, s’assit, posa sa pipe sur ses genoux.",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c9-b80",
     "text": "— Qu’est-ce que tu vas en faire, Constant ? Pour une fois dans ta vie, dis-moi la vérité. Je suis vieux, je n’ai plus le temps d’attendre la suivante.",
     "mentions": []
    },
    {
     "id": "c9-b81",
     "text": "— La rendre à la petite, dit Constant.",
     "mentions": []
    },
    {
     "id": "c9-b82",
     "text": "Firmin ne bougea pas. Il resta longtemps assis, les mains sur sa pipe, à regarder le vieil homme dans le lit, et Isaure, depuis la porte, vit passer sur son grand visage lourd quelque chose qu’elle n’y avait jamais vu, et qui ressemblait à de la fatigue, et à du soulagement, et à de la colère, et qui n’était rien de tout cela.",
     "mentions": [
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c9-b83",
     "text": "— Quarante et un ans, dit enfin Firmin, que je veux la même chose que toi.",
     "mentions": []
    },
    {
     "id": "c9-b84",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c9-b85",
     "text": "— Tu aurais pu me le dire.",
     "mentions": []
    },
    {
     "id": "c9-b86",
     "text": "— Tu m’aurais arrêté quand même.",
     "mentions": []
    },
    {
     "id": "c9-b87",
     "text": "— Oui, dit Firmin. Bien sûr. C’était mon métier.",
     "mentions": []
    },
    {
     "id": "c9-b88",
     "text": "Il se leva, en prenant son temps, et se tourna vers la porte, vers Isaure.",
     "mentions": []
    },
    {
     "id": "c9-b89",
     "text": "— Il vous manque quelqu’un que la Garde écoute, mademoiselle Sorbier, dit-il. J’ai vu votre plan en entrant ; je lis des plans depuis cinquante ans. J’ai formé la moitié des sergents de cette ville. Le sergent Morvan a été mon planton pendant six ans ; il m’apportait mon café, et il le renversait. J’ai gardé ma plaque d’inspecteur ; on ne me l’a jamais redemandée, parce que tout le monde avait oublié que je l’avais. Je me tiendrai à la porte des Étuves, la nuit du 16. Pendant dix pas, ce sera la Garde qui escortera votre morte.",
     "mentions": [
      "la-garde",
      "les-etuves"
     ]
    },
    {
     "id": "c9-b90",
     "text": "— Pourquoi ? demanda Isaure.",
     "mentions": []
    },
    {
     "id": "c9-b91",
     "text": "— Parce que j’ai attendu aussi, dit Firmin Vauclair. Et parce que je voudrais savoir, avant de mourir, si j’avais raison. Et parce que j’étais garde à la porte de la Chambre de Givre à vingt ans, et qu’un garde, voyez-vous, ça finit toujours par escorter quelque chose.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c9-b92",
     "text": "Dans le lit, Constant Mérel avait refermé les yeux. Il souriait.",

      "constant-merel"
     ]

    {

     "text": "— C’est vous, le « quand », maintenant, mademoiselle Sorbier, dit-il sans les rouvrir.",
     "mentions": []

     "text": "— Le 16, dit Isaure. À minuit.",
     "mentions": []
    }
   ]

   "visualDescription": "Intérieur d’un boyau rond creusé dans une glace bleu profond, lumineux, ruisselant, plein de vapeur. Au premier plan, Pétronille, immense, tablier de cuir, manches roulées, tient une longue lance de cuivre emmanchée de bois d’où jaillit un fin jet d’eau chaude ; un jeune homme blond en habit gris actionne une pompe à bras. Au fond du tunnel, dans la vapeur, le flanc d’un cercueil de bois noirci émerge de la glace comme un navire échoué ; Constant, enveloppé de couvertures, à genoux dans l’eau, y pose sa main nue à plat. Isaure tient une lanterne. Tension, recueillement, lumière d’avant la lumière.",
   "blocks": [

     "text": "Le 16 mars, à quatre heures de l’après-midi, Isaure monta à la Corporation des Remonteurs, rue des Charpentiers, avec soixante écus dans un mouchoir. Elle ne les avait pas dépensés. Depuis janvier, elle n’avait rien trouvé qui valût soixante écus.",

     "text": "— Justement.",
     "mentions": []

    },
    {
     "id": "c10-b08",
     "text": "— Alors on ne tirera pas la Dernière Poutre, dit-il. Ça fera la première fois depuis mon grand-père. Les gars seront déçus ; ils avaient prévu de boire après.",
     "mentions": []

     "id": "c10-b09",
     "text": "— Ils boiront quand même.",
     "mentions": []
    },
    {
     "id": "c10-b10",
     "text": "— Ils boiront quand même, reconnut-il, et il souleva son bonnet.",
     "mentions": []
    },
    {
     "id": "c10-b11",
     "text": "Elle redescendit chez elle à la tombée du jour. La ville s’allumait pour le Vêlage. On avait accroché aux perches des lanterniers des lanternes de papier de toutes les couleurs, rouges, jaunes, vertes, qui se balançaient dans les derniers souffles du vent et faisaient sur la neige des taches d’arc-en-ciel ; dans chaque rue, à chaque croisement, on avait dressé des tréteaux où l’on vendait du vin chaud à la camarine et des galettes de seigle au miel ; on entendait des vielles et des tambours, et des rires, et des gens qui chantaient des chansons de Vêlage, qui parlent toutes de maisons qui s’en vont et d’amoureux qui restent. Les enfants couraient partout avec des couronnes de papier doré sur la tête. C’était l’usage depuis 571 : le soir du Vêlage, on couronnait les enfants, puisqu’on ne couronnait plus personne. Sur tous les murs, au-dessus des tréteaux, il y avait les affiches du bal de la Régence, avec la date en grosses lettres : « Vêlage de l’an 612, le dix-sept mars à l’aube ». C’était son chiffre.",

      "demeure",
      "la-regence",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c10-b12",
     "text": "Au Dernier Rang, il n’y avait personne. Il n’y avait plus que des pilotis, des carrés de pilotis dans la neige, et au bout, au bord de tout, sa maison. Isaure entra, n’enleva pas son manteau, et alluma toutes les lampes. Il y en avait neuf, avec celle de l’escalier et la petite lampe à huile de la chambre de sa mère, qu’elle n’avait pas rallumée depuis janvier. Elle les remplit, moucha les mèches, les alluma une à une, et quand elle eut fini, chaque fenêtre de la maison était éclairée, même la lucarne du grenier. Puis elle sortit, et elle ne ferma pas la porte à clef.",
     "mentions": [
      "maison-sorbier"
     ]
    },
    {
     "id": "c10-b13",
     "text": "De la Rue Longue, en remontant, elle se retourna une fois. Dans le noir, au bout de la ville, sa maison brillait toute seule, comme un bateau à l’ancre.",
     "mentions": []
    },
    {
     "id": "c10-b14",
     "text": "Aux Étuves de la Veine, la nuit du Vêlage, on ne fermait pas. C’était l’usage, plus vieux encore que les couronnes de papier : on allait au bain le soir, pour se présenter propre à la Rendue du matin, et on y restait tard, et on y buvait, et on y chantait, et les chaudières ne s’arrêtaient pas avant l’aube. Quand Isaure y arriva, à dix heures, il y avait tant de monde dans le grand bassin qu’on ne voyait plus l’eau. La vapeur était si épaisse qu’on n’y voyait pas à trois pas. Quelqu’un jouait de la vielle, quelque part, très mal.",
     "mentions": [
      "les-etuves",
      "rendue"
     ]
    },
    {
     "id": "c10-b15",
     "text": "Firmin Vauclair était assis sur un tabouret, dans la ruelle de derrière, près de la porte de la chaufferie, avec sa pèlerine, sa pipe et un bol de vin chaud qu’il ne buvait pas. Il avait épinglé sur sa poitrine, par-dessus la pèlerine, une plaque de cuivre ovale qu’Isaure n’avait jamais vue et qui brillait comme si on l’avait astiquée toute la journée.",
     "mentions": [
      "firmin-vauclair",
      "la-garde"
     ]
    },
    {
     "id": "c10-b16",
     "text": "— Tout est calme, dit-il. Deux gardes de la Sûreté à l’angle de la Rue Longue, qui regardent danser les filles. Un à la porte principale, qui dort. Hermine est au bal. Je l’ai vue entrer à neuf heures, en gris. Elle ne danse jamais. Elle regarde les autres danser et elle compte.",
     "mentions": [
      "hermine-laroque",
      "la-garde"
     ]
    },
    {
     "id": "c10-b17",
     "text": "— Et Tobie ?",
     "mentions": []
    },
    {
     "id": "c10-b18",
     "text": "— Là.",
     "mentions": []
    },
    {
     "id": "c10-b19",
     "text": "Tobie arrivait par la ruelle, tirant derrière lui une luge basse de bois noir, la luge de veille des Affleureurs, et portant sous le bras un paquet enveloppé dans une couverture. Il avait mis son habit gris et rabattu son capuchon, et quand il fut près d’eux, Isaure vit qu’il tremblait de la tête aux pieds.",
     "mentions": [
      "tobie-arnal",
      "affleureurs"
     ]
    },
    {
     "id": "c10-b20",
     "text": "— Je l’ai, dit-il. La sonnaille de frère Hilaire. Personne ne m’a vu. J’ai laissé la clef sur la porte. Je ne pouvais pas la remettre dans ma poche ; j’avais l’impression qu’elle me brûlait.",
     "mentions": []

    {
     "id": "c10-b21",
     "text": "— Qu’est-ce qu’il y a dans la couverture ?",
     "mentions": []
    },
    {
     "id": "c10-b22",
     "text": "Il écarta un pan. Dans la laine, luisant d’un éclat sourd, il y avait une cloche de bronze grosse comme deux poings, avec un battant de fer, et sur la panse, gravée, une sonnaille plus petite : la marque de la confrérie.",
     "mentions": []
    },
    {
     "id": "c10-b23",
     "text": "— Elle est accordée pour la Rendue, dit Tobie. Il faut la tenir par la courroie, jamais par la cloche, sinon elle ne sonne pas juste.",
     "mentions": [
      "rendue"
     ]
    },
    {
     "id": "c10-b24",
     "text": "À onze heures, ils descendirent Constant dans la citerne.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c10-b25",
     "text": "Il avait voulu descendre seul. Il avait réussi à s’asseoir dans le lit, à mettre ses bottes, à se lever, et il était tombé ; Pétronille l’avait ramassé comme on ramasse un enfant, et elle l’avait porté dans ses bras, enveloppé dans deux couvertures, jusqu’au bas de l’escalier raide, et elle l’avait assis contre le palan, sur une pile de sacs de sel. Il avait la fièvre ; il avait les yeux trop brillants et les pommettes rouges, et il respirait vite, par petits coups, comme quelqu’un qui a couru. Mais il était là.",

      "petronille-gaudin"
