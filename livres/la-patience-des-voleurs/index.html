    {
     "id": "c3-b23",
     "text": "Pendant un moment il n’y eut que le bruit de l’eau, quelque part derrière la cloison. Puis Constant Mérel se mit à rire. Ce fut d’abord un petit rire dans la gorge, puis un grand rire silencieux qui le plia en deux sur sa banquette, et il riait encore quand les larmes se mirent à couler sur ses joues rouges, et il ne les essuya pas.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c3-b24",
     "text": "— La Régence, dit-il enfin. Leur palais. Ils ont bâti leur palais sur elle. Je les ai regardés faire, vous savez, depuis ma fenêtre, en 586. J’avais fait le calcul, moi aussi, à la main, sur le mur, avec un clou. Pas aussi bien que vous. Mais assez bien pour voir où ils posaient leurs fondations. J’ai ri pendant une semaine. Les gardes ont cru que je devenais fou. Ils ont fait venir un médecin.",
     "mentions": [
      "la-regence",
      "la-tour"
     ]
    },
    {
     "id": "c3-b25",
     "text": "— Elle a calculé son propre chemin, dit Isaure. La colonne de l’affleurement, au Registre. C’est son écriture.",
     "mentions": []
    },
    {
     "id": "c3-b26",
     "text": "Il cessa de rire.",
     "mentions": []
    },
    {
     "id": "c3-b27",
     "text": "— La dernière semaine, dit-il. Dans son lit. Elle ne pouvait plus se lever. Je lui apportais les Tables du Bureau, en cachette, sous mon manteau, et elle faisait des calculs pendant que je lui tenais la lampe. Elle disait que ça l’empêchait de penser à autre chose. Un soir, je lui ai apporté le Registre lui-même ; elle a rempli la colonne de l’affleurement sur la première ligne blanche, et rien d’autre. Le greffier a écrit le reste, après. Elle a dit : entre la vingtième et la trentième ogive, entre 608 et 615. Elle a dit : tu seras vieux. J’ai dit : je serai là.",
     "mentions": [
      "clemence-merel"
     ]
    },
    {
     "id": "c3-b28",
     "text": "Isaure s’assit sur la banquette du bas. Elle avait trop chaud dans son manteau, mais elle ne l’enleva pas.",
     "mentions": []
    },
    {
     "id": "c3-b29",
     "text": "— La Couronne est avec elle.",
     "mentions": []
    },
    {
     "id": "c3-b30",
     "text": "— La Couronne est avec elle.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c3-b31",
     "text": "— Et vous vous êtes rendu pour qu’on n’ouvre pas son cercueil.",
     "mentions": [
      "vol-de-571"
     ]
    },
    {
     "id": "c3-b32",
     "text": "Il la regarda avec une espèce d’admiration triste.",
     "mentions": []
    },
    {
     "id": "c3-b33",
     "text": "— Le 5 mars, un jeune inspecteur de la Garde, très têtu, très doué, a demandé au Prieur des Affleureurs l’ouverture des trois cercueils remis depuis la nuit du vol. Il avait compris, ou presque. Le Prieur a refusé : nul ne devance la glace. Le jeune inspecteur a dit qu’il reviendrait avec un ordre du Conseil. Le Conseil n’avait rien d’autre à faire que ça, cette semaine-là : trouver la Couronne. J’ai compté. Deux jours, peut-être trois. Alors je suis allé à la Garde le 6 au matin, et j’ai dit : c’est moi, je l’ai jetée dans le Sillage. On ne demande pas l’ouverture d’un cercueil quand on a un coupable qui avoue.",
     "mentions": [
      "firmin-vauclair",
      "devancer-la-glace",
      "affleureurs"
     ]
    },
    {
     "id": "c3-b34",
     "text": "— Quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c3-b35",
     "text": "— Quarante et un ans, dit-il. Mais la glace n’est pas pressée. C’est ce qu’elle a de mieux.",
     "mentions": []
    },
    {
     "id": "c3-b36",
     "text": "— Pourquoi l’avez-vous volée ?",
     "mentions": []
    },
    {
     "id": "c3-b37",
     "text": "Constant Mérel reprit son orange, en détacha un quartier et le lui tendit. Elle ne le prit pas.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c3-b38",
     "text": "— Ça, dit-il, c’est une autre question de glace. Plus longue. J’y répondrai quand vous m’aurez dit oui.",
     "mentions": []
    },
    {
     "id": "c3-b39",
     "text": "— Je n’ai pas dit oui.",
     "mentions": []
    },
    {
     "id": "c3-b40",
     "text": "— Vous êtes venue.",
     "mentions": []
    },
    {
     "id": "c3-b41",
     "text": "Pétronille passa la tête par la porte de l’étuve, rouge de vapeur.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c3-b42",
     "text": "— Si c’est de ce que je crois que vous voulez parler, dit-elle à voix basse, ce qui, chez elle, était encore une voix qui portait jusqu’au grand bassin, pas ici. J’ai la moitié de la Sûreté dans mes bassins le soir, et l’autre moitié le matin. Ils ne savent pas nager, mais ils savent écouter.",
     "mentions": [
      "petronille-gaudin",
      "la-garde"
     ]
    },
    {
     "id": "c3-b43",
     "text": "Ils se retrouvèrent au Carré d’Attente à l’heure où les lanterniers passaient. Constant avait choisi l’endroit. Il avait traversé la neige jusqu’au centre du Carré, en laissant derrière lui une ligne de pas bien droite, et il attendait là, debout, au milieu de rien, les mains dans les poches de son manteau trop grand. Isaure le rejoignit. Autour d’eux, à cinquante pas dans toutes les directions, il y avait la neige, puis les façades des maisons, avec leurs fenêtres qui s’allumaient une à une.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c3-b44",
     "text": "— C’est le seul endroit de Demeure où personne ne peut écouter derrière une porte, dit-il. Il n’y a pas de porte. On voit venir les gens de loin, et ils laissent des traces. Clémence et moi, nous venions ici, à l’automne 570, quand le lot venait d’être piqueté. Il était tout neuf, à la Ligne. Il y avait les piquets des Jalonneurs aux quatre coins ; c’était elle qui les avait plantés. Elle disait que c’était la plus belle place de la ville parce qu’on pouvait encore tout y imaginer.",
     "mentions": [
      "carre-d-attente",
      "clemence-merel"
     ]
    },
    {
     "id": "c3-b45",
     "text": "— Vous avez un plan.",
     "mentions": []
    },
    {
     "id": "c3-b46",
     "text": "— J’ai quarante et un ans de plans. J’ai eu le temps d’en faire, d’en défaire et d’en refaire. Celui-ci est le bon, parce qu’il est simple. La Pétro a, sous ses bains, une citerne creusée dans la glace, à six toises, où elle fait fondre la glace pour ses bassins. Entre sa citerne et la glacière basse de la Régence, il y a — combien ?",
     "mentions": [
      "petronille-gaudin",
      "les-etuves",
      "glaciere-basse"
     ]
    },
    {
     "id": "c3-b47",
     "text": "Isaure réfléchit. Elle avait le plan des creusements dans la tête ; elle l’avait regardé toute la nuit.",
     "mentions": []
    },
    {
     "id": "c3-b48",
     "text": "— Huit toises, à peu près, dit-elle. Mais le cercueil n’est pas encore dans la glacière. Il est dans la glace, derrière le mur, à deux pieds peut-être, du côté de chez vous. Entre la citerne et lui, il y a moins : six toises et demie. Il faudrait que je mesure.",
     "mentions": []
    },
    {
     "id": "c3-b49",
     "text": "— Six toises de glace, dit Constant. Avec de l’eau chaude, la Pétro en fait fondre une toise en deux nuits, peut-être moins. On ne touche pas à la glacière. On ne touche pas à la Régence. On passe par-dessous et par le côté, on va chercher Clémence dans le mur, avant qu’elle y arrive, et on la ramène par le tunnel. Personne ne voit rien. Personne ne sait rien. La Régence descend l’escalier de sa glacière le 19 mars pour accueillir un Remis, et le Remis n’est pas au rendez-vous.",
     "mentions": [
      "clemence-merel"
     ]
    },
    {
     "id": "c3-b50",
     "text": "— C’est devancer la glace.",
     "mentions": []
    },
    {
     "id": "c3-b51",
     "text": "— C’est aller au-devant d’elle, dit-il. Quand on aime quelqu’un, on va au-devant.",
     "mentions": [
      "devancer-la-glace"
     ]
    },
    {
     "id": "c3-b52",
     "text": "— Et après ?",
     "mentions": []
    },
    {
     "id": "c3-b53",
     "text": "— Après, il faut sortir un cercueil des Étuves et lui faire traverser la ville jusqu’au Front sans que personne l’arrête. Et il y a, à Demeure, une seule façon de faire traverser la ville à un cercueil sans que personne l’arrête.",
     "mentions": [
      "le-front",
      "rendue"
     ]
    },
    {
     "id": "c3-b54",
     "text": "— Avec des Affleureurs.",
     "mentions": [
      "affleureurs"
     ]
    },
    {
     "id": "c3-b55",
     "text": "— Avec des Affleureurs, dit-il. Clémence aura sa Rendue. Au Front, à la Glissoire, avec le chant et les sonnailles, comme tout le monde. Et moi, j’aurai ce qu’on m’a pris. Et vous, votre part.",
     "mentions": [
      "la-glissoire",
      "rendue"
     ]
    },
    {
     "id": "c3-b56",
     "text": "— Et la Couronne ?",
     "mentions": []
    },
    {
     "id": "c3-b57",
     "text": "— On la vendra, dit-il simplement. Il y a toujours quelqu’un pour acheter une couronne. C’est même à ça qu’on la reconnaît.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c3-b58",
     "text": "Il neigeait un peu. Des flocons tombaient dans la lumière des lanternes, au bord du Carré, et semblaient hésiter avant d’entrer dans la nuit du milieu. Isaure pensa à sa maison, qui avait vingt et un jours, et aux soixante écus des Remonteurs, et au volet bleu sous le vert. Elle pensa à une femme de vingt-neuf ans qui calculait dans son lit le jour où quelqu’un viendrait l’accueillir, et qui avait signé d’un sablier. Elle pensa, surtout, sans pouvoir s’en empêcher, qu’un tunnel de six toises dans de la vieille glace bleue, à cinq toises sous une ville qui descend d’un pas par jour, visant un cercueil qui monte d’un pouce par semaine, c’était le plus beau problème de glace qu’on lui poserait jamais.",
     "mentions": [
      "maison-sorbier",
      "clemence-merel"
     ]
    },
    {
     "id": "c3-b59",
     "text": "Elle s’entendit dire :",
     "mentions": []
    },
    {
     "id": "c3-b60",
     "text": "— Je connais un Affleureur.",
     "mentions": []
    },
    {
     "id": "c3-b61",
     "text": "Constant Mérel ne sourit pas. Il ôta son chapeau, lentement, et le garda contre sa poitrine, comme on fait dans la rue quand passe un Remis.",
     "mentions": [
      "rendue"
     ]
    },
    {
     "id": "c3-b62",
     "text": "Elle rentra chez elle tard. Au Dernier Rang, il n’y avait plus une lumière ; la mer, en bas, faisait un bruit de draps qu’on secoue. Quelqu’un était assis sur son seuil. D’abord elle crut que c’était encore Constant, qui l’aurait devancée par un autre chemin ; puis elle reconnut la pèlerine qui avait été noire et l’odeur de goudron de la pipe, et elle s’arrêta à trois pas.",
     "mentions": [
      "maison-sorbier"
     ]
    },
    {
     "id": "c3-b63",
     "text": "— Cinquante-huit, an 571, dit Firmin Vauclair sans se lever. Vous signez toujours tout, mademoiselle Sorbier ?",
     "mentions": [
      "firmin-vauclair",
      "registre-des-remis"
     ]
    },
    {
     "id": "c3-b64",
     "text": "Elle ne répondit pas. Il frappa sa pipe contre la pierre du seuil pour la vider, avec précaution, comme on frappe à une porte.",
     "mentions": []
    },
    {
     "id": "c3-b65",
     "text": "— Le concierge du Bureau m’est redevable d’un vieux service, dit-il. Il lit le cahier des consultations pour moi depuis vingt ans. En vingt ans, personne n’avait ouvert cette page. Moi, je l’ai ouverte le 5 mars 571.",
     "mentions": []
    },
    {
     "id": "c3-b66",
     "text": "Il se leva, avec une lenteur de montagne, s’épousseta et lui laissa la place.",
     "mentions": []
    },
    {
     "id": "c3-b67",
     "text": "— Bonne nuit, mademoiselle Sorbier. Vous devriez apprendre à ne pas signer.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-4",
   "number": 4,
   "title": "Nul n’arrête un Remis",
   "image": "images/chapter-04.webp",
   "alt": "Dans une rue de glace sablée, une procession de quatre silhouettes encapuchonnées de gris tire une luge basse portant un cercueil noirci ; un sergent à moustache, descendu de son cheval gris, tient son casque contre sa poitrine, et tous les passants sont tête nue.",
   "visualDescription": "Rue commerçante d’une ville de bois sur la glace, en plein jour gris. Au centre, une petite procession traverse la rue : quatre porteurs en habit de laine grise à capuchon tirent une luge basse de bois noir où repose un cercueil sombre ; l’un tient une cloche de bronze par une courroie ; derrière, une famille en noir. À gauche, un sergent massif à moustache de phoque, descendu d’un grand cheval gris ferré à crampons, tient son casque contre sa poitrine. Marchands, porteurs d’eau, enfants, dames en fourrure : tous figés, tête nue. Un chien de trait attelé attend. Dignité, humour discret.",
   "blocks": [
    {
     "id": "c4-b01",
     "text": "La fente mesurait onze pouces et cinq huitièmes. Isaure le nota, écrivit « vingt jours » dans la marge, raya « vingt » et récrivit « vingt », parce que sa main avait tremblé sur le v, puis elle partit chercher l’Affleureur.",
     "mentions": [
      "maison-sorbier",
      "le-front"
     ]
    },
    {
     "id": "c4-b02",
     "text": "Elle savait où le trouver, parce que le Calendrier des Affleurements était affiché chaque semaine à la porte du Bureau et qu’elle l’avait lu en passant : une veille rue des Tanneurs, trente-huitième ogive, sous la maison d’un chaudronnier. Elle y arriva à l’heure où les boutiques ouvraient. Devant la maison, sur le trottoir de planches, on avait posé deux lanternes de fer noir, à même la neige, et entre les deux lanternes une sonnaille de bronze, retournée, pour qu’on sache. Les passants, en arrivant à sa hauteur, ralentissaient, ôtaient leur chapeau, faisaient trois pas en silence et le remettaient. Le chaudronnier lui-même, sur le pas de sa porte, avait l’air d’un homme qui héberge un évêque.",
     "mentions": [
      "affleurement",
      "affleureurs"
     ]
    },
    {
     "id": "c4-b03",
     "text": "— Ils sont dessous, dit-il à voix basse. Depuis mardi. Vous êtes de la famille ?",
     "mentions": []
    },
    {
     "id": "c4-b04",
     "text": "— Du Bureau.",
     "mentions": []
    },
    {
     "id": "c4-b05",
     "text": "— Ah. Alors vous savez quand.",
     "mentions": []
    },
    {
     "id": "c4-b06",
     "text": "— Ce soir ou demain matin.",
     "mentions": []
    },
    {
     "id": "c4-b07",
     "text": "Le chaudronnier hocha la tête avec respect, comme si elle venait de prédire une éclipse, et lui ouvrit la trappe du vide.",
     "mentions": [
      "jalons"
     ]
    },
    {
     "id": "c4-b08",
     "text": "Sous les maisons de Demeure, entre le plancher et la glace, il y a un vide d’une toise que les caleurs appellent le vide et que les enfants appellent la cave, bien que ce n’en soit pas une. On y range le bois, les luges, les pots de graisse ; on y descend deux fois l’an pour recaler les pilotis ; et, une fois tous les cinquante ans en moyenne, on y accueille un mort. Isaure descendit l’échelle. Il faisait noir et froid ; ça sentait le bois humide et le suif, et au fond, entre deux pilotis, il y avait une lueur.",
     "mentions": [
      "affleurement"
     ]
    },
    {
     "id": "c4-b09",
     "text": "Trois Affleureurs étaient agenouillés autour d’un rectangle de glace plus sombre que le reste. Deux étaient vieux, le visage enfoncé dans leur capuchon de laine grise. Le troisième était un grand garçon maigre, blond, aux oreilles rouges de froid, qui portait à la ceinture la cordelière blanche des novices, et c’était lui qui chantait. Il chantait à voix basse, presque sans ouvrir la bouche, et le chant montait entre les pilotis et le plancher comme de la fumée dans une cheminée : un chant sans mots, ou dont les mots étaient si vieux qu’on ne les comprenait plus, et qui ne demandait rien.",
     "mentions": [
      "tobie-arnal",
      "affleureurs"
     ]
    },
    {
     "id": "c4-b10",
     "text": "Dans la glace, sous la lueur des lanternes, on voyait le couvercle. Il affleurait à peine, un rectangle de bois noirci à un doigt sous la surface, net comme un navire qu’on regarde du haut d’un quai par eau très claire, avec sa plaque de cuivre verdie où l’on devinait un nom. Isaure s’agenouilla à côté des Affleureurs. Elle ne dit rien. On ne parle pas pendant une veille, sauf pour chanter.",
     "mentions": [
      "affleurement"
     ]
    },
    {
     "id": "c4-b11",
     "text": "Elle connaissait ce chant. Elle l’avait entendu en janvier, au Champ des Remis, quand on avait descendu sa mère dans la neige, et elle avait entendu Maître Bastide, qui n’avait jamais pleuré de sa vie devant personne, se moucher trois fois pendant le deuxième couplet. C’était ce garçon qui avait chanté. Elle avait oublié son visage. Elle n’avait pas oublié sa voix.",
     "mentions": [
      "onesime-bastide",
      "champ-des-remis"
     ]
    },
    {
     "id": "c4-b12",
     "text": "Quand le chant fut fini, l’un des vieux Affleureurs releva la tête, regarda Isaure, regarda son écharpe, et dit :",
     "mentions": [
      "affleureurs"
     ]
    },
    {
     "id": "c4-b13",
     "text": "— Jalonneuse. Ce soir ou demain ?",
     "mentions": []
    },
    {
     "id": "c4-b14",
     "text": "— Demain, à l’aube. Un peu avant.",
     "mentions": []
    },
    {
     "id": "c4-b15",
     "text": "— Bien. Tobie, tu prendras la dernière veille.",
     "mentions": []
    },
    {
     "id": "c4-b16",
     "text": "Le garçon hocha la tête, et Isaure vit sa pomme d’Adam monter et descendre.",
     "mentions": []
    },
    {
     "id": "c4-b17",
     "text": "— Qui est-ce ? demanda-t-elle à voix basse, en montrant la plaque.",
     "mentions": []
    },
    {
     "id": "c4-b18",
     "text": "— Jeanne Carle, dit Tobie. Fileuse. Soixante et onze ans. Remise en 560. Il n’y a plus personne de sa famille. On a cherché. Le chaudronnier ne la connaît pas, les voisins non plus. Il n’y aura que nous.",
     "mentions": []
    },
    {
     "id": "c4-b19",
     "text": "— Vous chantez pour une inconnue.",
     "mentions": []
    },
    {
     "id": "c4-b20",
     "text": "Il la regarda avec étonnement, comme si elle avait dit une bêtise, puis avec gentillesse, comme si elle ne pouvait pas savoir.",
     "mentions": []
    },
    {
     "id": "c4-b21",
     "text": "— La Règle dit : nul n’affleure seul, répondit-il. On ne sait jamais qui on attend. On attend quand même. C’est tout ce qu’on fait, et c’est beaucoup.",
     "mentions": [
      "affleureurs",
      "affleurement"
     ]
    },
    {
     "id": "c4-b22",
     "text": "Elle l’attendit dehors jusqu’à la relève de midi. Il sortit du vide en se frottant les genoux, cligna des yeux dans la lumière, la vit, et devint aussi rouge que ses oreilles.",
     "mentions": []
    },
    {
     "id": "c4-b23",
     "text": "— Vous êtes la fille de Marthe Sorbier, dit-il. La Jalonneuse. En janvier.",
     "mentions": []
    },
    {
     "id": "c4-b24",
     "text": "— Vous avez chanté.",
     "mentions": []
    },
    {
     "id": "c4-b25",
     "text": "— Je chante toujours, dit-il, et il ajouta aussitôt, comme pour s’excuser : je ne sais pas faire grand-chose d’autre. Le Prieur dit que j’ai la voix et pas la patience. Il dit que la patience viendra. Il dit ça depuis deux ans.",
     "mentions": []
    },
    {
     "id": "c4-b26",
     "text": "— Tobie, dit Isaure, j’ai besoin de vous parler. Pas ici.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c4-b27",
     "text": "Ils remontèrent la Rue Longue ensemble, lui avec ses grandes jambes et son capuchon rabattu, elle avec son écharpe, et Isaure cherchait encore comment commencer quand la chose arriva.",
     "mentions": []
    },
    {
     "id": "c4-b28",
     "text": "Il y eut un cri, plus haut dans la rue, et un homme déboula entre les passants : jeune, maigre, un bonnet enfoncé jusqu’aux yeux, à la main une bourse de cuir qui n’était visiblement pas à lui. Derrière lui, à vingt pas, venait un cheval de la Garde, un grand hongre gris ferré à crampons, et sur le cheval un sergent qui criait « Arrêtez-le ! » à des gens qui s’écartaient au lieu de l’arrêter. Le voleur zigzaguait, glissait, se rattrapait, gagnait du terrain. Le cheval, sur la glace sablée, ne pouvait pas galoper ; il trottait avec des précautions de vieille dame, et le sergent jurait.",
     "mentions": [
      "la-garde"
     ]
    },
    {
     "id": "c4-b29",
     "text": "Et puis, d’une rue transversale, sortit une Rendue.",
     "mentions": [
      "rendue"
     ]
    },
    {
     "id": "c4-b30",
     "text": "C’était une petite procession, comme il en passait plusieurs par jour dans la ville : quatre Affleureurs en capuchon tirant une luge basse, un cercueil noirci sur la luge, une sonnaille qui tintait à chaque pas, et derrière, trois ou quatre personnes en noir, une famille, qui marchaient les mains jointes. Elle entra dans la Rue Longue à l’instant exact où le voleur la dépassait. Le voleur passa. Le cheval, lui, s’arrêta net, parce que son cavalier avait tiré sur les rênes à se démettre les épaules. Le sergent sauta à terre, ôta son casque, le mit contre sa poitrine et ne bougea plus.",
     "mentions": [
      "rendue",
      "affleureurs"
     ]
    },
    {
     "id": "c4-b31",
     "text": "Toute la Rue Longue s’était figée. Les marchands derrière leurs étals, les porteurs d’eau, les gamins, deux dames en fourrure, un chien de trait avec sa charrette : tout le monde s’était arrêté, tête nue, et regardait passer le cercueil. La procession traversa la rue au pas, sans hâte, dans le seul bruit de la sonnaille et des patins de la luge sur le sable. Il lui fallut une bonne minute pour passer. Quand la famille en noir eut disparu dans la rue d’en face, la Rue Longue se remit en mouvement, comme un tableau qu’on aurait décroché et raccroché. Le voleur, bien entendu, avait disparu depuis longtemps.",
     "mentions": [
      "rendue"
     ]
    },
    {
     "id": "c4-b32",
     "text": "Le sergent remit son casque. Il avait un visage large et rouge, une moustache de phoque, et il regarda la rue vide devant lui avec une résignation d’une grande dignité.",
     "mentions": []
    },
    {
     "id": "c4-b33",
     "text": "— Nul n’arrête un Remis, dit-il à son cheval, et il remonta en selle.",
     "mentions": []
    },
    {
     "id": "c4-b34",
     "text": "— C’est la plus vieille loi de Demeure, dit Tobie, qui avait lui aussi ôté son capuchon et qui le remettait avec une espèce de fierté. Plus vieille que les Margraves. Plus vieille que la Couronne. Du moment où un Remis est sur la luge jusqu’au moment où il glisse dans le Bras, personne n’a le droit de l’arrêter, de le toucher, de le fouiller, de le retarder d’un seul pas. Personne. La Garde se découvre. Le Régent s’agenouille. Une fois, en 580, le Régent Bertin a attendu une heure et demie au croisement de la Rue Longue et de la rue des Calfats parce qu’il y avait eu un naufrage et que les Remis passaient les uns après les autres. Il a attendu à genoux dans la neige. Il a eu une pneumonie. On en parle encore.",
     "mentions": [
      "rendue",
      "couronne-de-givre",
      "la-regence"
     ]
    },
    {
     "id": "c4-b35",
     "text": "— Et si un voleur se cachait sous le cercueil ?",
     "mentions": []
    },
    {
     "id": "c4-b36",
     "text": "Tobie la regarda, horrifié, comme si elle avait proposé de danser sur un Remis.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c4-b37",
     "text": "— Personne ne ferait ça, dit-il.",
     "mentions": []
    },
    {
     "id": "c4-b38",
     "text": "— Non, dit Isaure. Bien sûr.",
     "mentions": []
    },
    {
     "id": "c4-b39",
     "text": "Elle l’emmena aux Étuves.",
     "mentions": [
      "les-etuves"
     ]
    },
    {
     "id": "c4-b40",
     "text": "Pétronille les reçut dans son bureau, une pièce aux murs de planches sans fenêtre, derrière la lingerie, où il y avait une table, quatre chaises dépareillées, des piles de serviettes à hauteur d’homme et un poêle qu’on n’allumait jamais parce que la chaleur des bains traversait les cloisons. Constant y était déjà, en chemise, les manches roulées, et il se leva quand le garçon entra, et lui serra la main comme à un homme.",
     "mentions": [
      "petronille-gaudin",
      "les-etuves",
      "constant-merel"
     ]
    },
    {
     "id": "c4-b41",
     "text": "Ils le lui dirent. Isaure commença, parce qu’elle savait exposer un calcul ; Constant continua, parce qu’il savait raconter ; Pétronille intervint deux fois pour dire « nom d’un sérac » à des endroits où cela n’ajoutait rien, sinon qu’elle était là. Tobie écouta sans rien dire. À mesure qu’on parlait, il pâlissait, et quand Constant arriva au tunnel, il était de la couleur des serviettes.",
     "mentions": [
      "clemence-merel",
      "glaciere-basse"
     ]
    },
    {
     "id": "c4-b42",
     "text": "— C’est devancer la glace, dit-il.",
     "mentions": [
      "devancer-la-glace"
     ]
    },
    {
     "id": "c4-b43",
     "text": "— Oui, dit Constant.",
     "mentions": []
    },
    {
     "id": "c4-b44",
     "text": "— C’est… la Règle dit… Nul ne devance la glace. Nul n’ouvre un Remis. Nul n’arrête un Remis. Ce sont les trois premiers articles. Il y en a cent douze, mais ce sont les trois premiers. On les apprend avant de savoir chanter. Vous me demandez de… Je ne peux pas. Je suis novice. Je n’ai même pas encore ma sonnaille.",
     "mentions": [
      "affleureurs",
      "devancer-la-glace"
     ]
    },
    {
     "id": "c4-b45",
     "text": "— Je ne vous demande pas de devancer la glace, dit Constant avec douceur. D’autres l’ont fait avant nous. Quand la Régence a creusé sa glacière basse, en 586, puis quand elle l’a creusée plus profond en 601, elle a changé le chemin de ma femme. Sans cette cave, Clémence aurait affleuré dans une rue, en plein soleil, à la bonne hauteur, et pas avant des années. Les gens de la Régence ont avancé son affleurement pour avoir du vin frais. Personne ne leur a parlé de la Règle.",
     "mentions": [
      "glaciere-basse",
      "la-regence"
     ]
    },
    {
     "id": "c4-b46",
     "text": "Isaure fit le calcul de tête pendant qu’il parlait : huit ans plus tard, rue des Orfèvres, à un an près. Elle ne dit rien.",
     "mentions": []
    },
    {
     "id": "c4-b47",
     "text": "— Et quand elle affleurera, dans leur cave, continua Constant, qui l’accueillera ? Pas vous. Pas vos frères. La Régence ouvrira son cercueil, parce que la Régence sait ce qu’il y a dedans, ou le devinera. Elle l’ouvrira dans une cave, à la lanterne, avec des gardes et un greffier. Et puis elle mettra la Couronne quelque part où personne ne la verra. Et ma femme n’aura pas de Rendue.",
     "mentions": [
      "rendue",
      "hermine-laroque"
     ]
    },
    {
     "id": "c4-b48",
     "text": "— Vous ne pouvez pas savoir ça.",
     "mentions": []
    },
    {
     "id": "c4-b49",
     "text": "— L’Intendante de la Sûreté m’a fait sortir de prison pour que je la mène à la Couronne, dit Constant. Elle ne l’a pas fait pour que ma femme ait des funérailles.",
     "mentions": [
      "hermine-laroque",
      "la-garde"
     ]
    },
    {
     "id": "c4-b50",
     "text": "Tobie regarda Isaure, qui hocha la tête.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c4-b51",
     "text": "— La Règle, dit Constant, prévoit le droit de visage. Vous le savez mieux que moi.",
     "mentions": [
      "droit-de-visage"
     ]
    },
    {
     "id": "c4-b52",
     "text": "— Le plus proche parent vivant, récita Tobie à voix basse, peut demander à voir le visage du Remis. Une fois. À la Glissoire, avant la Rendue, devant un Prieur. On ouvre, il regarde, on referme. Personne d’autre ne touche.",
     "mentions": [
      "droit-de-visage",
      "la-glissoire"
     ]
    },
    {
     "id": "c4-b53",
     "text": "— Je suis son mari. Je suis son seul parent vivant. Je demande mon droit, c’est tout. Je ne demande pas autre chose. Je demande qu’on l’amène à la Glissoire au lieu de la laisser dans une cave. Je demande à la voir. Ça fait quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c4-b54",
     "text": "Le garçon baissa la tête. Personne ne parla. Au-delà des cloisons, on entendait l’eau couler et, très loin, quelqu’un qui chantait faux une chanson de marins.",
     "mentions": []
    },
    {
     "id": "c4-b55",
     "text": "— À une condition, dit enfin Tobie, sans relever la tête. Personne n’ouvre le cercueil avant la Glissoire. Personne. Pas dans le tunnel, pas ici, pas en chemin. On la sort, on la porte, on chante, on l’amène au Front, et là, devant un Prieur, vous avez votre droit. Et c’est moi qui la porte.",
     "mentions": [
      "la-glissoire",
      "le-front"
     ]
    },
    {
     "id": "c4-b56",
     "text": "— C’est tout ce que je demande aussi, dit Constant.",
     "mentions": []
    },
    {
     "id": "c4-b57",
     "text": "— Et la Couronne ? demanda Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b58",
     "text": "Constant eut un geste vague, un geste de Remonteur qui écarte un copeau.",
     "mentions": [
      "constant-merel",
      "remontee"
     ]
    },
    {
     "id": "c4-b59",
     "text": "— La Couronne sortira à la Glissoire, avec le visage. Personne ne regarde dans un cercueil qu’on ouvre, mademoiselle Sorbier. Tout le monde regarde le visage.",
     "mentions": [
      "couronne-de-givre",
      "droit-de-visage"
     ]
    },
    {
     "id": "c4-b60",
     "text": "Pétronille les emmena dans la citerne.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c4-b61",
     "text": "On y descendait par un escalier de bois raide comme une échelle, qui s’enfonçait dans la glace depuis la chaufferie. Il faisait chaud en haut, près des chaudières, où deux garçons en maillot enfournaient du charbon du Midi à la pelle ; il faisait froid en bas. La citerne était une salle ronde creusée à six toises sous la rue, grande comme une chapelle, aux parois de glace bleue polies par l’eau, et au milieu il y avait un grand réservoir de cuivre où arrivaient, par des tuyaux gainés de feutre, l’eau chaude des chaudières et l’eau froide de la glace fondue. Des lanternes pendaient à des crochets vissés dans les murs. Tout brillait. On se serait cru à l’intérieur d’une pierre précieuse.",
     "mentions": [
      "les-etuves"
     ]
    },
    {
     "id": "c4-b62",
     "text": "— Et ça, dit Pétronille en montrant un trou rond dans le sol, à l’autre bout de la salle, c’est par là que je rends l’eau.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c4-b63",
     "text": "Isaure s’approcha. Le trou était large comme une roue de charrette, bordé d’une margelle de planches, et il descendait tout droit dans le noir. On entendait, très loin en dessous, un grondement sourd, régulier, comme celui d’une foule dans une grande salle.",
     "mentions": []
    },
    {
     "id": "c4-b64",
     "text": "— Un moulin, dit Isaure.",
     "mentions": [
      "moulins"
     ]
    },
    {
     "id": "c4-b65",
     "text": "— Les Étuves se vident dans un moulin depuis vingt-six ans, dit Pétronille avec fierté. C’est pour ça qu’on les a bâties là. Toute l’eau des bassins, toute l’eau de la glace qu’on fond, ça descend là-dedans et ça va rejoindre la grande eau, sous la Coulée, qui file à la mer par-dessous. Personne ne sait jusqu’où ça descend. Un jour, un de mes chauffeurs a laissé tomber une pelle. On ne l’a jamais entendue arriver.",
     "mentions": [
      "moulins",
      "la-coulee"
     ]
    },
    {
     "id": "c4-b66",
     "text": "Contre le mur était posé un long tube de cuivre qu’Isaure prit d’abord pour un tuyau de poêle : c’était la lance, de la longueur d’une gaffe, emmanchée de bois pour qu’on puisse la tenir, et terminée par un bec étroit comme celui d’une théière. Un tuyau de cuir la reliait au réservoir, avec, entre les deux, une pompe à bras. Pétronille prit la lance comme on prend une lance, justement, cala le manche sous son bras, fit signe à Constant, qui se mit à pomper, et dirigea le bec contre le mur de glace.",
     "mentions": [
      "les-etuves",
      "petronille-gaudin"
     ]
    },
    {
     "id": "c4-b67",
     "text": "Il en sortit un jet d’eau fumante, fin comme une aiguille, qui frappa la glace avec un sifflement. La glace se mit à fondre sous le jet. En quelques instants elle se creusa, puis s’évida, et l’eau de la fonte ruisselait vers le moulin, et la vapeur montait, et Pétronille avançait la lance d’un pouce, puis d’un autre, en la faisant tourner doucement pour élargir la cavité. Au bout d’un quart d’heure, elle arrêta. Constant lâcha la pompe, hors d’haleine. Dans le mur de glace, il y avait une niche ronde, lisse, profonde d’un pied, large comme une tête d’homme.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel"
     ]
    },
    {
     "id": "c4-b68",
     "text": "— Un pied en un quart d’heure, dit Pétronille. Pour un tunnel où un homme passe à quatre pattes en tirant un cercueil, il faut compter une toise en deux nuits. Peut-être trois. Ça dépend de la glace. La vieille glace, la bleue, elle est plus dure. Elle a été serrée plus longtemps.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "— Et le bruit ? demanda Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b70",
     "text": "— Quel bruit ? La pompe ? Les chaudières font dix fois plus de bruit, et elles marchent jour et nuit. L’eau ? Elle va au moulin, comme toute l’eau des Étuves. La vapeur ? Il y a de la vapeur partout ici, ma fille. On en remarquerait plutôt l’absence.",
     "mentions": [
      "les-etuves"
     ]
    },
    {
     "id": "c4-b71",
     "text": "— Et le charbon ?",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "Pétronille ouvrit la bouche, la referma et regarda Constant.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel"
     ]
    },
    {
     "id": "c4-b73",
     "text": "— Elle pense à tout, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b74",
     "text": "— C’est pour ça qu’on l’a prise, dit Constant.",
     "mentions": []
    },
    {
     "id": "c4-b75",
     "text": "Ils remontèrent dans le bureau aux serviettes, et Constant dessina le plan au charbon de bois sur la table, parce qu’on pouvait l’effacer d’un revers de manche. Les Étuves, la citerne, le moulin. Au-delà, un rectangle qu’il hachura : la glacière basse de la Régence, à laquelle on ne toucherait pas. Entre les deux, un petit ovale : Clémence. De la citerne à l’ovale, une ligne droite, et Isaure prit le charbon et corrigea la ligne, parce qu’elle n’était pas droite, et parce qu’elle ne devait pas l’être : il faudrait contourner une ancienne poche d’eau regelée qu’on voyait sur le plan des creusements, et monter en pente douce, un pied par toise, pour que l’eau s’écoule d’elle-même vers la citerne. Constant la regarda faire sans rien dire, et quand elle eut fini, il effaça sa propre ligne avec le pouce.",
     "mentions": [
      "glaciere-basse",
      "clemence-merel"
     ]
    },
    {
     "id": "c4-b76",
     "text": "— Six toises et demie, dit Isaure. Une toise en deux nuits dans le meilleur cas, deux et demie dans le pire. Il faut commencer le 1er mars au plus tard. On arrive à elle entre le 14 et le 18. Elle affleure le 19 dans leur mur. On a un jour de marge. Peut-être.",
     "mentions": []
    },
    {
     "id": "c4-b77",
     "text": "— On la sort la nuit du 18, dit Constant. Rendue à l’aube du 19. Pour la Régence, le Remis n’arrivera jamais : il aura été mal calculé. Ce sont des choses qui arrivent.",
     "mentions": [
      "rendue"
     ]
    },
    {
     "id": "c4-b78",
     "text": "— Pas au Bureau, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c4-b79",
     "text": "— Pas avec vous, reconnut-il.",
     "mentions": []
    },
    {
     "id": "c4-b80",
     "text": "— Et la Couronne, après ? demanda Pétronille. On la met où, pour la vendre ?",
     "mentions": []
    },
    {
     "id": "c4-b81",
     "text": "— Un acheteur du Midi arrive avec les premiers bateaux du printemps, dit Constant sans lever les yeux du plan. J’ai écrit de la Tour, il y a un an. On a correspondu. C’est un homme qui aime les belles choses et qui ne pose pas de questions. Il la prendra au Port-Fixe et elle partira vers le soleil.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c4-b82",
     "text": "Isaure le regarda. Il était penché sur son plan au charbon, calme, précis, un vieil homme en manches de chemise qui calculait le poids d’un cercueil et la largeur d’un tunnel, et il n’y avait rien dans sa voix qui sonnât faux ; et pourtant elle eut, l’espace d’un instant, la sensation qu’on a sur la glace quand un pont de neige, sous le pied, cède d’un demi-pouce et tient.",
     "mentions": []
    },
    {
     "id": "c4-b83",
     "text": "Le 28 février, Maître Bastide l’appela dans son cabinet. Il tenait à la main une lettre à en-tête, cachetée d’un sceau de cire grise où l’on voyait, sous une couronne vide, les mots « En attendant ».",
     "mentions": [
      "onesime-bastide",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c4-b84",
     "text": "— La Régence nous demande un relevé d’affleurement, dit-il. Un Remis doit percer dans la glacière basse du palais vers le 19 mars. Numéro cinquante-huit de l’an 571. Le majordome veut savoir exactement où et quand, pour ne pas avoir de mort dans son vin le soir du bal. Demande ordinaire. Nous en faisons quarante par an.",
     "mentions": [
      "glaciere-basse",
      "registre-des-remis"
     ]
    },
    {
     "id": "c4-b85",
     "text": "Il posa la lettre sur son bureau et la regarda comme on regarde un relevé mal fait.",
     "mentions": []
    },
    {
     "id": "c4-b86",
     "text": "— Ce qui ne l’est pas, c’est le post-scriptum. De la main de l’Intendante de la Sûreté. Elle demande que le relevé soit confié à la Jalonneuse Sorbier. « Dont la précision est connue. » Et qu’il ne soit pas affiché au Calendrier des Affleurements. « Pour ne pas troubler les préparatifs du bal. »",
     "mentions": [
      "hermine-laroque"
     ]
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "La glacière basse",
   "image": "images/chapter-05.webp",
   "alt": "Dans une longue cave basse taillée dans la glace bleue, une jeune femme lève une lanterne vers un mur où l’on devine, pris dans la glace, un cercueil sombre ; derrière elle, une grande femme en manteau gris observe.",
   "visualDescription": "Intérieur souterrain : une salle longue et basse creusée au ciseau dans une glace d’un bleu profond, lumineuse de l’intérieur. Jambons et gibiers pendus, tonnelets de beurre, grands blocs de glace pure le long d’un mur. Isaure lève une lanterne vers le mur du fond : à deux pieds dans la glace, net comme une mouche dans l’ambre, un cercueil de bois noirci, légèrement incliné, ferrures aux coins, une petite plaque claire. Derrière elle, Hermine, grande, mince, manteau gris sans ornement, chignon serré, gants à la main. Une vieille femme en fourrures tient une seconde lanterne. Froid, silence, révélation.",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "Le palais de la Régence se préparait au bal. Dans le grand vestibule, des tapissiers montés sur des échelles accrochaient des guirlandes de sapin d’importation, qui coûtaient plus cher au pied que le bois de charpente ; des valets déroulaient des tapis ; une femme en tablier noir comptait des verres à voix haute et recommençait chaque fois qu’on lui parlait. Partout, sur les tentures, sur les cartons des invitations empilés dans un coin, sur les menus que deux copistes calligraphiaient à une table, revenait la même formule en lettres d’or. Isaure lut en passant, sur un menu encore frais : « Sorbet de camarine au miel des Parois, en attendant la Couronne ».",
     "mentions": [
      "la-regence",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c5-b02",
     "text": "Elle avait apporté ses instruments dans un sac de toile : la chaîne courte, le niveau à bulle, la boussole de poche, une douzaine de fiches de fer pour planter dans la glace, le carnet, les crayons, et la petite lunette que sa mère lui avait laissée. Le majordome, un homme poudré à qui l’on aurait donné un âge s’il n’avait pas été si soigneusement coiffé, la reçut avec la politesse qu’on réserve aux fournisseurs, lui demanda si elle avait bien essuyé ses bottes, et s’interrompit au milieu de sa phrase.",
     "mentions": [
      "jalons"
     ]
    },
    {
     "id": "c5-b03",
     "text": "L’Intendante descendait le grand escalier.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c5-b04",
     "text": "— Je m’en occupe, monsieur Aubépin, dit-elle. Merci. Allez voir vos verres.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c5-b05",
     "text": "Elle avait toujours son manteau gris et ses gants à la main. Elle salua Isaure d’une inclinaison de tête, lui prit son sac des mains avant qu’elle ait pu protester — « Vous porterez les instruments délicats, je porte le reste » — et l’emmena vers une petite porte, derrière l’escalier, qui ouvrait sur un autre escalier, étroit, de pierre d’abord, puis de bois, puis de glace.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c5-b06",
     "text": "Il y avait trois glacières sous la Régence, les unes sous les autres, comme les étages d’une maison renversée. La première, la glacière haute, servait aux blocs qu’on taillait pour la table et qu’on revendait aux maisons voisines. La deuxième gardait les vins, sur des râteliers de bois où chaque bouteille avait son étiquette et son âge. La troisième était la glacière basse. On y descendait par une échelle, et une vieille femme en fourrures, qui tenait une lanterne, attendait en bas comme elle devait attendre depuis vingt-six ans.",
     "mentions": [
      "glaciere-basse",
      "la-regence"
     ]
    },
    {
     "id": "c5-b07",
     "text": "— La mère Gonthier, dit l’Intendante. Elle garde les glacières depuis le premier jour. Elle ne dira rien à personne de ce que nous allons voir. Elle ne dit jamais rien.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "La vieille femme fit une petite révérence et leva sa lanterne.",
     "mentions": []
    },
    {
     "id": "c5-b09",
     "text": "La glacière basse était une salle longue, à peine plus haute qu’un homme, creusée au ciseau dans la glace vieille, et tout y était bleu. Les murs étaient bleus, le plafond était bleu, et la lumière de la lanterne, en s’y enfonçant, devenait bleue elle aussi, d’un bleu qui semblait venir de très loin derrière les murs, comme la lumière d’une autre salle, plus grande, qu’on ne voyait pas. On y avait entreposé pour le bal des tonnelets de beurre, des jambons, des gibiers pendus par les pattes, et, le long d’un mur, trois grands blocs de glace pure qu’un sculpteur viendrait tailler la veille en forme de cygnes. Il faisait froid à fendre les pierres.",
     "mentions": [
      "glaciere-basse"
     ]
    },
    {
     "id": "c5-b10",
     "text": "— Le mur aval, dit l’Intendante. C’est bien celui-là ?",
     "mentions": []
    },
    {
     "id": "c5-b11",
     "text": "Isaure prit la lanterne des mains de la mère Gonthier et s’approcha du mur qui regardait vers le Front.",
     "mentions": [
      "le-front"
     ]
    },
    {
     "id": "c5-b12",
     "text": "Au début, elle ne vit rien que du bleu, un bleu épais, strié de fines bulles alignées comme des perles sur un fil, qui marquaient les années. Puis ses yeux s’habituèrent. Et elle la vit : à deux pieds derrière la surface du mur, à un pied au-dessus du sol, légèrement inclinée, une forme longue et sombre. Un cercueil. Il était pris dans la glace, parfaitement net ; on distinguait les planches, les ferrures des coins, la ligne du couvercle, et, à la tête, un petit rectangle plus clair qui devait être la plaque. La lumière de la lanterne tremblait sur le bois noirci. On aurait dit qu’il bougeait. Il ne bougeait pas, bien sûr ; ou plutôt il venait vers eux d’un pouce et demi par jour, et c’était pire.",
     "mentions": [
      "clemence-merel",
      "glaciere-basse"
     ]
    },
    {
     "id": "c5-b13",
     "text": "— Elle est là depuis l’automne, dit la mère Gonthier, et c’étaient les premiers mots qu’elle prononçait. Au début, on ne voyait qu’une ombre. Maintenant, on la voit bien. Je lui dis bonjour le matin.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "Isaure posa la lanterne à terre. Ses mains ne tremblaient pas ; c’était une chose qu’elle avait remarquée chez elle depuis l’enfance, que ses mains ne tremblaient pas quand il y avait du travail. Elle planta ses fiches dans la glace du mur, trois au-dessus du cercueil, trois à côté, les mesura à la chaîne depuis les angles de la salle, prit l’aplomb, prit le niveau, releva à la boussole l’orientation de la forme sombre, la mesura à travers la glace en visant de deux points, comme on mesure un bateau depuis le rivage. Elle nota tout dans le carnet. L’Intendante la regardait faire, les mains derrière le dos, les mains derrière le dos, et Isaure sentait ce regard sur sa nuque comme un courant d’air.",
     "mentions": [
      "jalons"
     ]
    },
    {
     "id": "c5-b15",
     "text": "— Quand ? demanda enfin l’Intendante.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— Le 19. Entre l’aube et midi. Là.",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "Elle montra du crayon un point du mur, à un pied au-dessus du sol. C’était la vérité. Elle l’avait calculé dans la nuit du 23 au 24 février, elle venait de le vérifier, et elle n’aurait pas su dire autre chose.",
     "mentions": []
    },
    {
     "id": "c5-b18",
     "text": "— Merci, dit l’Intendante. Monsieur Aubépin sera content. Il pourra donner son bal sans morts dans ses sorbets.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "Elle reprit la lanterne, et au lieu de la lever vers l’échelle, elle la leva vers le cercueil, et le regarda un long moment.",
     "mentions": []
    },
    {
     "id": "c5-b20",
     "text": "— Numéro cinquante-huit de l’an 571, dit-elle. Née Aubrac. Vingt-neuf ans. Jalonneuse de première classe. Décédée le 2 mars 571, de consomption. Remise le 4.",
     "mentions": [
      "clemence-merel",
      "registre-des-remis"
     ]
    },
    {
     "id": "c5-b21",
     "text": "Isaure ne dit rien.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "— Vous avez signé le cahier des consultations le 23 février à vingt-deux heures quarante, reprit l’Intendante sans se retourner. Monsieur Grivel a un cousin dans mes services ; il lit beaucoup, monsieur Grivel, et il parle encore plus. Je suis allée lire la ligne moi-même. Et j’ai relu le dossier de mon ancien maître, que la Sûreté conserve depuis quarante ans aux archives sous l’étiquette « fantaisies », à côté des serpents de mer et des monnaies du Midi qui changent de poids la nuit. L’inspecteur Vauclair avait demandé, en 571, l’ouverture de trois cercueils. Ce n’est pas une fantaisie. C’est un calcul. Il avait raison en 571, et personne ne l’a écouté. Je l’écoute aujourd’hui. Il ne le saura jamais, parce qu’il ne m’adresse plus la parole.",
     "mentions": [
      "firmin-vauclair",
      "la-garde"
     ]
    },
    {
     "id": "c5-b23",
     "text": "Elle se retourna. Dans la lumière bleue, son visage avait l’air sculpté dans la même glace que les murs.",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "— Le voleur sort ; sa femme affleure chez nous le mois même ; la Jalonneuse qu’il a choisie consulte sa ligne le lendemain. Trois hasards le même mois, mademoiselle Sorbier, je n’y crois pas. Je crois aux calculs, comme vous. Le 19, quand ce cercueil sortira du mur, je serai là, avec un greffier, deux gardes et un représentant du Prieur, et je l’ouvrirai.",
     "mentions": [
      "constant-merel",
      "isaure-sorbier"
     ]
    },
    {
     "id": "c5-b25",
     "text": "— Nul n’ouvre un Remis.",
     "mentions": []
    },
    {
     "id": "c5-b26",
     "text": "— Toutes les règles de cette ville ont un dernier article qu’on n’imprime pas, dit l’Intendante. Il s’appelle le Régent. Il a déjà signé.",
     "mentions": [
      "affleureurs",
      "la-regence"
     ]
    },
    {
     "id": "c5-b27",
     "text": "Elle posa la lanterne sur un tonnelet de beurre, entre elles deux, et remit enfin ses gants, lentement, doigt par doigt.",
     "mentions": []
    },
    {
     "id": "c5-b28",
     "text": "— Je vais vous dire une chose, et vous la répéterez à monsieur Mérel si vous voulez, parce que je n’ai rien à lui cacher. Je ne veux pas de cette couronne. Je ne l’ai jamais voulue. Je veux qu’elle ne revienne pas. Une couronne qui revient, dans une ville qui a appris à vivre sans elle, ce n’est pas un bijou, c’est une guerre : les Frimas qui ont des cousins, la Compagnie qui a des créances, le Conseil qui a des ambitions, et au milieu des gens comme vous et comme la mère Gonthier, qui voudraient seulement que les pilotis tiennent et que le pain soit cuit. Je l’ouvrirai, ce cercueil, et ce que j’y trouverai n’en ressortira jamais. Et la morte aura ce qu’elle voudra. Une Rendue. Des chants. Monsieur Mérel aura même son droit de visage, s’il le demande. Il l’aura ici, dans ma cave.",
     "mentions": [
      "couronne-de-givre",
      "mahaut-de-frimas",
      "compagnie-des-glaces"
     ]
    },
    {
     "id": "c5-b29",
     "text": "Elle reprit le sac de toile.",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "— Je vous raccompagne. Vous avez fait un travail parfait, et monsieur Aubépin vous doit trois écus.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "Ils se retrouvèrent le soir dans le bureau aux serviettes. Isaure raconta tout, dans l’ordre, avec les chiffres. Pétronille jura, ce qui ne changeait rien. Tobie ne dit rien et devint très pâle. Constant écouta jusqu’au bout, les yeux fermés, les mains croisées sur le ventre, et on aurait pu croire qu’il dormait.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal",
      "constant-merel"
     ]
    },
    {
     "id": "c5-b32",
     "text": "— Elle sait où, dit-il enfin sans ouvrir les yeux. Elle sait quoi. Elle sait quand la glace la rendra. Elle ne sait pas quand nous viendrons.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "— Elle sait qu’il y a un « nous », dit Isaure.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "— Elle l’a toujours su. C’est pour ça qu’elle m’a fait sortir. Rien n’a changé, mademoiselle Sorbier, sauf une chose : maintenant, nous savons qu’elle sait. C’est un avantage. On commence cette nuit.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "Ils commencèrent cette nuit-là.",
     "mentions": []
    },
    {
     "id": "c5-b36",
     "text": "Ce fut, pendant des jours, toujours la même chose, et Isaure n’oublia jamais rien de ces nuits-là. Les Étuves fermaient à dix heures. Pétronille renvoyait ses garçons de bains, gardait ses deux chauffeurs, qui étaient ses neveux et qui ne savaient pas parler de ce qu’ils ne comprenaient pas, et poussait les chaudières au rouge. À onze heures, ils descendaient dans la citerne. Pétronille tenait la lance, puis Constant, puis Pétronille ; Tobie pompait, puis Constant, puis Tobie ; et Isaure, entre deux tours de pompe, mesurait. À chaque demi-pied gagné, elle tendait dans le tunnel un cordeau de lin blanc depuis un clou planté au seuil, vérifiait l’aplomb avec un fil à plomb, la pente avec le niveau, la direction avec la boussole, et corrigeait d’un pouce vers la droite, d’un demi-pouce vers le haut. Personne ne discutait ses corrections. À cinq heures, avant l’arrivée des premiers baigneurs, on arrêtait tout, on rangeait la lance, on masquait l’entrée du tunnel derrière une pile de sacs de sel à bain, et chacun rentrait dormir deux heures.",
     "mentions": [
      "les-etuves",
      "jalons"
     ]
    },
    {
     "id": "c5-b37",
     "text": "Le tunnel avançait dans le bleu. Au début, il n’était qu’un trou dans le mur de la citerne ; au bout de trois nuits, c’était un boyau rond de trois pieds de large, où l’on entrait à quatre pattes sur une planche, et où la lanterne qu’on poussait devant soi allumait une lumière qui ne ressemblait à aucune autre, une lumière d’avant la lumière. La glace, à cette profondeur, avait trois siècles. Isaure le calcula une nuit, pour s’occuper les mains, pendant que Tobie pompait. Trois siècles : cette glace-là était tombée en neige sur les hauteurs quand les Frimas n’étaient encore que des pêcheurs, et qu’il n’y avait à Demeure ni Margrave, ni Couronne, ni personne pour les attendre.",
     "mentions": [
      "demeure",
      "champ-des-remis"
     ]
    },
    {
     "id": "c5-b38",
     "text": "Tobie, en pompant, chantait. Il ne s’en rendait pas compte. Le chant de veille avait le rythme exact de la pompe, ou la pompe avait pris le rythme du chant, et au bout de la deuxième nuit tout le monde le fredonnait, même Pétronille, qui chantait comme on casse du bois.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c5-b39",
     "text": "La troisième nuit, à une toise et demie du seuil, la lance heurta quelque chose.",
     "mentions": []
    },
    {
     "id": "c5-b40",
     "text": "Ce fut un bruit mat, différent du sifflement de l’eau sur la glace. Pétronille arrêta la pompe d’un geste. Constant avança la lanterne. Au fond du tunnel, dans la vapeur qui se dissipait, il y avait du bois : un coin de planche noirci, arrondi par le temps, qui sortait de la glace comme une racine sort d’un talus.",
     "mentions": [
      "affleurement"
     ]
    },
    {
     "id": "c5-b41",
     "text": "— Ce n’est pas elle, dit Isaure tout de suite. Elle est à cinq toises d’ici. Ce n’est pas possible.",
     "mentions": []
    },
    {
     "id": "c5-b42",
     "text": "— Ce n’est pas elle, dit Constant.",
     "mentions": []
    },
    {
     "id": "c5-b43",
     "text": "Ils dégagèrent le bois à la main, avec des chiffons trempés d’eau chaude, pouce par pouce, sans la lance, parce que Tobie l’avait demandé et que personne n’avait eu envie de lui dire non. Il leur fallut deux heures. C’était un cercueil, un tout petit cercueil, long comme un bras, de bois de mélèze ciré qui avait tenu, sans plaque et sans ferrures. Une ficelle de chanvre, noircie et durcie comme du fil de fer, en faisait le tour, et on y avait noué une clochette de bronze grosse comme un dé à coudre.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c5-b44",
     "text": "Personne ne dit rien pendant un long moment.",
     "mentions": []
    },
    {
     "id": "c5-b45",
     "text": "— Il n’est pas au Registre, dit enfin Isaure. Il n’y a rien sur le plan des creusements, rien au Registre, rien au Calendrier. Il est trop vieux. Le Registre commence en 380. Il est plus vieux que le Registre.",
     "mentions": [
      "registre-des-remis"
     ]
    },
    {
     "id": "c5-b46",
     "text": "— C’est un Profond, dit Tobie. Un de ceux qu’on remettait avant. Quand il n’y avait pas de Champ, on les remettait dans une crevasse, là-haut, avec une clochette, pour que la glace sache qu’on les attendait.",
     "mentions": [
      "profonds",
      "affleureurs",
      "champ-des-remis"
     ]
    },
    {
     "id": "c5-b47",
     "text": "Il ôta son capuchon. Ses oreilles étaient rouges et ses mains tremblaient. Il s’agenouilla dans l’eau de fonte, au fond du tunnel, devant le petit cercueil, et il se mit à chanter. Il chanta à voix très basse d’abord, puis plus fort, et le tunnel lui renvoyait sa voix, et la citerne derrière lui la renvoyait encore, et Isaure eut l’impression que toute la glace autour d’eux, toute la glace de trois siècles où dormaient on ne savait combien d’autres Profonds, écoutait. Pétronille avait posé sa main mutilée sur son cœur. Constant s’était assis, les genoux dans les bras, et regardait la clochette.",
     "mentions": [
      "tobie-arnal",
      "rendue"
     ]
    },
    {
     "id": "c5-b48",
     "text": "Quand Tobie eut fini, il se tourna vers Isaure.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c5-b49",
     "text": "— On ne peut pas le prendre. Il n’est pas à nous. Il n’est pas à son heure. Mais on ne peut pas le laisser seul non plus. Il faut que quelqu’un sache où il est, pour l’attendre quand il sortira.",
     "mentions": []
    },
    {
     "id": "c5-b50",
     "text": "Isaure ouvrit son carnet. À la lumière de la lanterne, elle mesura la position du petit cercueil à la chaîne et au cordeau, releva sa profondeur et son orientation, estima son chemin et la vitesse de la glace à cet endroit. Elle écrivit : « Profond, sans nom, sans date. Enfant. Affleurera vers 621, dans la Veine, vers la trente-cinquième ogive. » Elle arracha la page, la plia, et la donna à Tobie, qui la glissa dans sa manche comme une relique.",
     "mentions": [
      "profonds",
      "affleurement",
      "ogives"
     ]
    },
    {
     "id": "c5-b51",
     "text": "— Il faudra le contourner, dit-elle ensuite, à Constant, à Pétronille, à elle-même. Par la droite. Une demi-toise de détour. Une nuit de perdue.",
     "mentions": []
    },
    {
     "id": "c5-b52",
     "text": "— Une nuit, dit Constant.",
     "mentions": []
    },
    {
     "id": "c5-b53",
     "text": "Il regardait toujours la clochette.",
     "mentions": []
    },
    {
     "id": "c5-b54",
     "text": "Firmin Vauclair l’attendait le lendemain, à midi, au pied de l’Escalier des Jalonneurs, assis sur une borne de pierre, sa pipe à la main. Il ne fit pas semblant de la rencontrer par hasard. Il se leva, ce qui lui prit du temps, et lui proposa de marcher un peu, et ils marchèrent le long de la Paroi Nord, sur le chemin de planches qui bordait la ville du côté immobile, là où la roche et la glace se frottaient l’une contre l’autre en grinçant.",
     "mentions": [
      "firmin-vauclair",
      "bureau-des-jalons"
     ]
    },
    {
     "id": "c5-b55",
     "text": "— Hermine est allée aux archives, dit-il. On me l’a dit. Elle a sorti mon dossier. Le dossier « fantaisies ».",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c5-b56",
     "text": "— Elle m’en a parlé.",
     "mentions": []
    },
    {
     "id": "c5-b57",
     "text": "— Ah. Elle vous a dit que j’avais raison, j’imagine. Elle est très juste, Hermine. Elle dit toujours aux gens qu’ils ont raison, après avoir fait exactement ce qu’elle voulait.",
     "mentions": []
    },
    {
     "id": "c5-b58",
     "text": "Il marcha un moment en silence. Il boitait un peu, du genou gauche, et il s’appuyait sur la paroi de la main droite, comme sur l’épaule d’un vieil ami.",
     "mentions": []
    },
    {
     "id": "c5-b59",
     "text": "— Le 5 mars 571, reprit-il, j’avais vingt-cinq ans et une idée. Constant Mérel était Remonteur, il connaissait les toits de l’Hôtel de Frimas pour les avoir refaits l’année d’avant, et on avait vu un homme sur ces toits la nuit du vol. Sa femme était morte le matin suivant. Je suis allé à sa veillée, le 3. Je n’avais rien à y faire. J’y suis allé. Il y avait trente personnes, des Jalonneurs, des Remonteurs, une grande fille qui pleurait plus fort que tout le monde…",
     "mentions": [
      "vol-de-571",
      "hotel-de-frimas",
      "remontee",
      "clemence-merel"
     ]
    },
    {
     "id": "c5-b60",
     "text": "— La Pétro.",
     "mentions": []
    },
    {
     "id": "c5-b61",
     "text": "— La Pétro. Et lui, assis à côté du cercueil, la main posée dessus. Il ne pleurait pas. Il avait l’air… soulagé. Pas heureux, soulagé. Comme un homme qui a mis quelque chose à l’abri. Le lendemain, on l’a remise, et j’ai passé la nuit sur le Registre, et le surlendemain j’ai demandé l’ouverture des cercueils. Varnier n’a pas osé : déterrer les morts de la ville pour un bijou, à trois jours d’un sacre, c’était l’émeute. J’ai écrit mon rapport. On l’a rangé aux fantaisies. En 580, j’ai écrit un second rapport, avec un calcul d’affleurement que j’avais fait moi-même, très mal, avec l’aide d’un livre ; on l’a rangé avec le premier. Et puis j’ai attendu.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel",
      "registre-des-remis"
     ]
    },
    {
     "id": "c5-b62",
     "text": "— Quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c5-b63",
     "text": "— Il n’y a pas que les voleurs qui savent attendre, mademoiselle Sorbier.",
     "mentions": []
    },
    {
     "id": "c5-b64",
     "text": "Ils étaient arrivés au bout du chemin de planches, là où il rejoignait la Rue Longue. Firmin s’arrêta, bourra sa pipe, ne l’alluma pas.",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c5-b65",
     "text": "— J’ai été garde au palais des Frimas à vingt ans, dit-il. Avant d’être inspecteur. J’ai monté la garde devant la Chambre de Givre. J’ai vu la petite Margravine grandir. La Couronne est à elle. Je voudrais la lui rendre avant de mourir. C’est tout ce que je veux. Hermine veut l’enterrer. Et Constant…",
     "mentions": [
      "mahaut-de-frimas",
      "couronne-de-givre"
     ]
    },
    {
     "id": "c5-b66",
     "text": "Il la regarda de côté.",
     "mentions": []
    },
    {
     "id": "c5-b67",
     "text": "— Il vous a dit qu’il allait la vendre, n’est-ce pas ?",
     "mentions": []
    },
    {
     "id": "c5-b68",
     "text": "Isaure ne répondit pas. Il n’insista pas.",
     "mentions": []
    },
    {
     "id": "c5-b69",
     "text": "— Il m’a dit la même chose en 571, dans mon bureau, le jour où il s’est rendu. « Je l’aurais vendue, inspecteur. » Je me suis toujours demandé à qui. Une couronne, ça ne se vend pas comme un hareng. Mais laissons ça. Ce n’est pas ce qui m’empêche de dormir.",
     "mentions": []
    },
    {
     "id": "c5-b70",
     "text": "— Qu’est-ce qui vous empêche de dormir ?",
     "mentions": []
    },
    {
     "id": "c5-b71",
     "text": "Il alluma enfin sa pipe et souffla longtemps la fumée avant de répondre.",
     "mentions": []
    },
    {
     "id": "c5-b72",
     "text": "— Lui, je le comprends. Il l’aimait ; il aurait fait n’importe quoi. Mais elle ? Une Jalonneuse. Une femme qui savait, mieux que personne, ce que c’est que quarante ans de glace. Elle a accepté de dormir quarante ans avec une couronne volée sur la poitrine, sous une ville qui la cherchait. Pourquoi ? Voilà ce que je voudrais savoir, mademoiselle Sorbier, avant de mourir. Pas où est la Couronne. Pourquoi elle.",

     ]
    }
