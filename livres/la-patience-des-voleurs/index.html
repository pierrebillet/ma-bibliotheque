  {
   "id": "chapitre-6",
   "number": 6,
   "title": "Quarante et un ans",
   "image": "images/chapter-06.webp",
   "alt": "La nuit, au milieu d’une place de neige vierge entourée de vieilles façades aux fenêtres éclairées, un vieil homme et une jeune femme se tiennent debout sous une neige fine qui tourne dans la lumière des lanternes.",
   "visualDescription": "Nuit d’hiver. Plan large en plongée sur une grande place carrée couverte de neige intacte, bordée de façades de bois de quarante ans, serrées, aux fenêtres jaunes. Une ligne de pas droite mène au centre, où se tiennent Constant (chapeau noir, manteau trop grand) et Isaure (écharpe rayée). Aux coins, des lanternes sur perches ; neige fine qui flotte dans leurs ronds de lumière. Un poteau au coin porte une plaque de cuivre verdie (sans inscription lisible). Mélancolie, confidence, immensité du vide.",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Le 5 mars, la fente mesurait un pied et un demi-pouce, et la maison n’avait plus que douze jours. Isaure s’en aperçut en écrivant le chiffre : c’était la première fois qu’elle mesurait la fente en pieds. Elle trouva la chose absurde, et pourtant elle resta un moment accroupie dans la neige, la réglette à la main, comme devant une lettre qu’on n’a pas envie d’ouvrir.",
     "mentions": [
      "maison-sorbier",
      "le-front"
     ]
    },
    {
     "id": "c6-b02",
     "text": "Le tunnel, lui, avait deux toises et un pied, plus la demi-toise du détour. Le petit cercueil à la clochette restait sur sa droite, dans la paroi, et chaque fois qu’on passait devant en rampant, on ralentissait sans se le dire. Tobie lui chantait un couplet à chaque relève. Pétronille, qui chantait trop mal pour cela, lui disait bonjour.",
     "mentions": [
      "profonds",
      "tobie-arnal",
      "petronille-gaudin"
     ]
    },
    {
     "id": "c6-b03",
     "text": "Ce matin-là, avant le jour, quand on eut rangé la lance et masqué le tunnel derrière les sacs de sel, Isaure ne rentra pas chez elle. Elle attendit Constant dans le vestibule des Étuves, où la femme aux serviettes était partie, et quand il sortit de la chaufferie en toussant — il toussait depuis deux nuits, une petite toux sèche qu’il couvrait de la main comme on couvre une bougie —, elle lui dit :",
     "mentions": [
      "constant-merel",
      "les-etuves"
     ]
    },
    {
     "id": "c6-b04",
     "text": "— L’inspecteur Vauclair voudrait savoir pourquoi elle a accepté.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "Constant s’arrêta. Il remit son chapeau, lentement.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c6-b06",
     "text": "— Il vous a dit ça ?",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "— Il m’a dit : lui, je le comprends. Mais elle ?",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "— Ce vieux Firmin, dit Constant, et il y avait dans sa voix quelque chose qui ressemblait à de la tendresse. Toujours les bonnes questions. Toujours quarante ans trop tard. Venez. Il me faut de l’air.",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c6-b09",
     "text": "Ils descendirent la Rue Longue jusqu’au Carré d’Attente. Il neigeait, une neige fine et sèche qui ne tombait pas mais flottait, et les lanternes, au bord du Carré, faisaient autour d’elles des ronds de lumière où les flocons tournaient comme des insectes. Le Carré était vide. Constant traversa la neige jusqu’au milieu, en laissant sa ligne de pas droite, et Isaure le suivit dans ses traces, et quand il s’arrêta, elle s’arrêta. Il resta un moment à regarder les façades autour d’eux, les fenêtres éclairées, un rideau qui bougeait.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c6-b10",
     "text": "— Elle corrigeait mes chiffres, dit-il. C’est comme ça que ça a commencé. En 563, j’avais dix-neuf ans, j’étais Remonteur, on montait à la Ligne les poutres d’un palais neuf, et une Jalonneuse de vingt et un ans est venue vérifier nos mesures. Elle a sorti sa chaîne, elle a mesuré une poutre que j’avais mesurée, elle a dit : vous vous êtes trompé de trois pouces. J’ai dit que non. Elle a remesuré devant moi. Je m’étais trompé de trois pouces. Elle a ri. J’ai su tout de suite que je passerais ma vie à essayer de ne plus me tromper de trois pouces devant elle.",
     "mentions": [
      "clemence-merel",
      "remontee",
      "la-ligne"
     ]
    },
    {
     "id": "c6-b11",
     "text": "— Le palais neuf…",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "— L’Hôtel de Frimas. Oui. Tout commence toujours au même endroit, à Demeure ; c’est la ville qui bouge, pas les histoires.",
     "mentions": [
      "hotel-de-frimas"
     ]
    },
    {
     "id": "c6-b13",
     "text": "Il sourit dans le noir, et elle entendit le sourire plus qu’elle ne le vit.",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "— Nous nous sommes mariés en 566. Elle était la meilleure Jalonneuse de sa génération. Vous vous servez de ses tables. Tout le monde s’en sert. À vingt-six ans, elle en savait plus sur la glace que le Premier Jalonneur de l’époque, et le Premier Jalonneur le savait, et il l’aimait quand même, ce qui n’est pas donné à tout le monde. Et puis, en 567, le vieux Margrave l’a fait venir au palais. Eudes, le quatrième. Il avait une fille unique, de treize ans, et une idée ancienne : que les Margraves doivent savoir lire la glace, puisqu’ils règnent dessus. Il a demandé à Clémence d’être sa préceptrice. Deux après-midi par semaine, dans la bibliothèque des Frimas, avec des Tables de Pas et une boîte de craies.",
     "mentions": [
      "clemence-merel",
      "mahaut-de-frimas",
      "hotel-de-frimas"
     ]
    },
    {
     "id": "c6-b15",
     "text": "— Mahaut.",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— La petite, dit Constant, et il n’ajouta rien pendant un moment.",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "La neige tombait sur son chapeau et ne fondait pas.",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "— Elle est tombée malade à l’automne 570. Clémence. La toux. Au début, on s’est dit que c’était l’hiver. En novembre, le vieux Margrave est mort, et on a fixé le sacre de la petite au Vêlage suivant, le 5 mars. En décembre, Clémence ne pouvait plus monter l’Escalier des Jalonneurs. En janvier, elle ne pouvait plus se lever. Le médecin est venu, il a regardé ses mains, il a regardé les miennes, et il m’a dit de lui faire faire ce qu’elle aimait. Alors je lui apportais les Tables en cachette, et elle calculait.",
     "mentions": [
      "mahaut-de-frimas",
      "velage"
     ]
    },
    {
     "id": "c6-b19",
     "text": "— Et la Couronne ?",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "— Attendez. Tout arrive. C’est la glace qui me l’a appris.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "Il toussa, se détourna pour tousser, revint.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "— Le Conseil, en ce temps-là, c’était la Compagnie des Glaces. Aujourd’hui encore, un peu ; en ce temps-là, entièrement. Aristide Varnier présidait le Conseil et la Compagnie, et il avait préparé pour le sacre deux papiers, qu’on devait faire signer à la petite le jour même, la Couronne sur la tête, parce qu’un Margrave ne scelle rien sans la Couronne : c’est la coutume. Le premier papier était un contrat de mariage : la petite épousait Gaspard Varnier, le fils, trente-quatre ans, un homme qui comptait tout, et juste. Le second papier s’appelait le Grand Bail. Il donnait à la Compagnie tous les lots de la Ligne pendant soixante ans.",
     "mentions": [
      "compagnie-des-glaces",
      "couronne-de-givre",
      "la-ligne"
     ]
    },
    {
     "id": "c6-b23",
     "text": "Isaure mit un moment à comprendre. Puis elle comprit, et elle eut froid.",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "— Toute la ville, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "— Toute la ville, dit Constant. Pas la ville d’aujourd’hui : celle de demain. Pendant soixante ans, chaque famille qui bâtissait à la Ligne ou faisait remonter ses poutres aurait dû louer son lot à la Compagnie. C’est plus qu’il n’en faut à la glace pour faire descendre toute une ville : au bout du compte, Demeure aurait appartenu tout entière à Varnier et à ses héritiers, du Front à la Ligne, sans qu’on ait eu besoin de la voler. On l’aurait signée, voilà tout, un matin de Vêlage, avec une plume et une couronne.",
     "mentions": [
      "demeure",
      "remontee"
     ]
    },
    {
     "id": "c6-b26",
     "text": "— Et la Margravine ?",
     "mentions": []
    },
    {
     "id": "c6-b27",
     "text": "— La petite avait dix-sept ans. Elle a compris ce qu’on lui faisait signer, parce que Clémence lui avait appris à lire la glace, et qu’à Demeure celui qui sait lire la glace sait lire un bail. Elle est venue voir Clémence, un soir de février, en cachette, par la porte de la cour. Elle a pleuré au pied du lit pendant une heure. Clémence l’a laissée pleurer, et puis elle a dit : « On va lui prendre sa couronne. »",
     "mentions": [
      "mahaut-de-frimas",
      "clemence-merel"
     ]
    },
    {
     "id": "c6-b28",
     "text": "Il se tut. Autour d’eux, la neige continuait de flotter, et une fenêtre, sur la façade nord du Carré, s’éteignit.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c6-b29",
     "text": "— Sans couronne, pas de sacre. Sans sacre, pas de sceau. Sans sceau, ni mariage ni Bail. C’était simple. Clémence aimait les choses simples. Elle a tout calculé, dans son lit : l’heure où la garde changeait, l’heure où le Tombant se lèverait cette nuit-là, parce qu’il se lève toujours avant un Vêlage et qu’il couvre tous les bruits des toits, le poids de la Couronne, le chemin. Moi, je connaissais les toits de l’Hôtel. Je les avais refaits l’année d’avant.",
     "mentions": [
      "le-tombant",
      "vol-de-571"
     ]
    },
    {
     "id": "c6-b30",
     "text": "— Et la porte de la Chambre de Givre ? Il y avait trois clefs. Tout le monde le sait. Le Margrave, le Trésorier, l’héritière. Le Margrave était mort.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "— Une porte s’est ouverte, dit Constant. Ne me demandez pas qui l’a ouverte. C’est la seule chose que je ne vous dirai pas.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "Isaure ne demanda pas. Elle regardait les lanternes, à la lisière du Carré, et elle pensait à une petite femme en toque de fourrure qui balayait son perron à grands coups secs.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c6-b33",
     "text": "— La nuit du 1er mars, reprit Constant, le Tombant s’est levé à onze heures, comme elle l’avait dit. À deux heures, j’étais sur les toits. À trois heures, j’étais dans la Chambre de Givre. À quatre heures, j’étais rentré, trempé de neige, avec un sac de toile sous mon manteau, et Clémence était assise dans son lit, les yeux ouverts, et elle m’attendait. Elle ne s’était pas assise depuis trois semaines. Je lui ai mis la Couronne dans les mains. Elle l’a regardée à la lampe, longtemps. Elle a dit qu’elle était plus légère qu’elle ne l’aurait cru. Et puis elle a ri. Elle riait comme au premier jour, quand je m’étais trompé de trois pouces.",
     "mentions": [
      "couronne-de-givre",
      "clemence-merel"
     ]
    },
    {
     "id": "c6-b34",
     "text": "Il s’arrêta de parler, et Isaure ne l’interrompit pas. Elle attendit, comme on attend sous une maison, entre deux pilotis, avec une lanterne.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "— Elle est morte au matin, dit-il. À sept heures. La Couronne dans les mains. Je crois qu’elle avait attendu ça pour partir.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "Le silence, au milieu du Carré, était si grand qu’on entendait la neige toucher la neige.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c6-b37",
     "text": "— Avant de mourir, reprit-il, elle m’a dit trois choses. Elle m’a dit : on ne la jette pas. On ne jette pas ce qui n’est pas à nous. Elle m’a dit : mets-la avec moi. Et elle m’a dit : la glace la rendra quand il faudra. J’ai fait ce qu’elle a dit. La nuit de la veillée, quand tout le monde a été parti, j’ai ouvert le cercueil, je l’ai mise avec elle, j’ai refermé. Le lendemain, les Affleureurs l’ont montée au Champ des Remis, et j’ai marché derrière, et j’ai regardé la neige la recouvrir. Le surlendemain, Firmin a demandé qu’on l’ouvre. Et le jour d’après, je suis allé m’asseoir dans son bureau.",
     "mentions": [
      "champ-des-remis",
      "affleureurs",
      "firmin-vauclair",
      "clemence-merel"
     ]
    },
    {
     "id": "c6-b38",
     "text": "— Vous avez donné quarante et un ans pour qu’on ne l’ouvre pas.",
     "mentions": []
    },
    {
     "id": "c6-b39",
     "text": "— Je n’ai rien donné du tout, dit-il. J’ai attendu. Ce n’est pas la même chose. On ne donne que ce qu’on perd. Moi, je savais où elle était.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "— Et Firmin ? Il voulait savoir pourquoi elle a accepté.",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "— Parce que c’était Clémence, dit Constant. Parce que la petite pleurait au pied de son lit et qu’elle-même allait mourir de toute façon, et qu’elle trouvait que c’était un beau dernier calcul à faire. Parce qu’elle ne supportait pas les choses mal mesurées, et qu’une ville vendue pour soixante ans le matin d’un Vêlage, c’était une chose mal mesurée. Vous voyez bien, mademoiselle Sorbier. Vous auriez fait pareil.",
     "mentions": [
      "clemence-merel",
      "isaure-sorbier"
     ]
    },
    {
     "id": "c6-b42",
     "text": "Isaure ne répondit pas, parce qu’elle n’en savait rien, et qu’elle avait peur que ce fût vrai.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "— Et maintenant ? demanda-t-elle enfin. Maintenant, vous allez la vendre à votre homme du Midi.",
     "mentions": []
    },
    {
     "id": "c6-b44",
     "text": "— Maintenant, dit Constant, je vais la chercher.",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "Il lui prit le bras pour retraverser la neige, et elle sentit à travers le manteau combien ce bras était maigre ; il s’appuyait sur elle plus qu’il ne l’aurait voulu. Ils revinrent dans leurs propres traces. Au bord du Carré, sous la lanterne, il s’arrêta devant la plaque de cuivre verdie, « Lot réservé au palais de la Margravine — en attendant la Couronne », et il posa sa main gantée dessus, un instant, comme on salue un vieil ami qu’on n’a pas reconnu tout de suite.",
     "mentions": [
      "carre-d-attente",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c6-b46",
     "text": "Le lendemain, Pétronille vint les chercher dans la citerne avant l’heure, les joues rouges et le souffle court, et ce n’était pas à cause de la vapeur.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c6-b47",
     "text": "— Il y a trois laquais de la Régence dans le grand bassin, dit-elle. Et un cocher. Et le sous-majordome, qui a la langue plus longue que la Rue Longue. Ils parlent tous de la même chose. Il paraît que le Régent a signé une dispense. Il paraît qu’on a loué quatre Fendeurs de la Compagnie pour le matin du Vêlage, avec des scies à glace et des ciseaux, pour descendre dans la glacière basse. Il paraît qu’il y a un Remis dans le mur, qu’on doit sortir avant son heure, pendant que la ville sera au Front, et que le Prieur n’en sait rien. Le cocher dit que c’est un Margrave. Le sous-majordome dit que c’est un trésor. Un laquais dit que c’est sa grand-mère et tout le monde a ri.",
     "mentions": [
      "petronille-gaudin",
      "la-regence",
      "fendeurs",
      "glaciere-basse",
      "devancer-la-glace"
     ]
    },
    {
     "id": "c6-b48",
     "text": "— Le matin du Vêlage, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c6-b49",
     "text": "— Le 17, dit Constant. Pas le 19. Le 17 à l’aube.",
     "mentions": [
      "velage"
     ]
    },
    {
     "id": "c6-b50",
     "text": "Personne ne dit rien. Au fond du tunnel, derrière eux, une goutte tomba du plafond de glace dans la flaque, puis une autre.",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Firmin Vauclair habitait deux pièces au deuxième étage d’une maison de la trente-neuvième ogive, rue des Vitriers, au-dessus d’un marchand de couleurs, et Isaure dut monter l’escalier en retenant son souffle, parce que la cage sentait la térébenthine. Il lui ouvrit en pantoufles, ne manifesta aucune surprise et la fit entrer dans une pièce où il n’y avait de place pour rien. Il y avait des papiers partout : sur la table, sur les chaises, sur le lit, en piles contre les murs ; des cartes de la Coulée punaisées les unes sur les autres comme des écailles ; des calculs à la craie sur une ardoise, dont Isaure vit du premier coup d’œil qu’ils étaient faux ; un chat gris qui dormait sur un registre. Au milieu de la table, sous la lampe, il y avait un dossier de carton épais, gonflé comme une miche, fermé par une sangle. L’étiquette disait : « Givre ».",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c6-b52",
     "text": "— La dispense, dit Isaure. C’est vrai ?",
     "mentions": []
    },
    {
     "id": "c6-b53",
     "text": "Il déplaça le chat pour s’asseoir.",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "— Signée le 5 au soir, dit-il. « Dispense de devancement pour raison d’État. Extraction du Remis numéro 58 de l’an 571 par les soins de la Sûreté, en présence d’un greffier, à l’aube du 17 mars. » Le 17, le Prieur et tous les Affleureurs de la ville seront au Front pour la Rendue du Dernier Rang, et toute la ville avec eux. Personne ne verra rien. Hermine aime les choses qu’on ne voit pas.",
     "mentions": [
      "hermine-laroque",
      "la-garde",
      "rendue",
      "affleureurs"
     ]
    },
    {
     "id": "c6-b55",
     "text": "— Pourquoi le 17 ? Elle m’avait dit le 19. Elle m’avait dit qu’elle attendrait la glace.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "Firmin la regarda par-dessus ses lunettes, qu’il venait de mettre, et elle eut l’impression désagréable qu’il avait compris beaucoup de choses et qu’il avait la délicatesse de ne pas les dire.",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c6-b57",
     "text": "— La Sûreté compte les tombereaux, dit-il. C’est moi qui le leur ai appris. Il y a une borne au coin de la rue des Tonneliers, un homme dessus, qui note tout ce qui entre à la Régence et autour. Les Étuves de la Veine ont reçu en huit jours trois tombereaux de charbon de plus que d’habitude. Hermine sait compter jusqu’à trois.",
     "mentions": [
      "les-etuves",
      "la-garde"
     ]
    },
    {
     "id": "c6-b58",
     "text": "Isaure sentit ses joues brûler. « Et le charbon ? » avait-elle demandé, le premier jour, dans la citerne. Personne n’y avait répondu.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c6-b59",
     "text": "— Je ne vous demande pas ce que vous faites avec ce charbon, dit Firmin. Je ne suis plus rien. Je n’ai le droit de rien demander à personne.",
     "mentions": []
    },
    {
     "id": "c6-b60",
     "text": "Il ouvrit le dossier « Givre », en tira une fiche, la regarda, la remit.",
     "mentions": []
    },

     "text": "— Vous avez dix nuits, dit-il. Neuf, si vous voulez dormir la dernière.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-7",
   "number": 7,
   "title": "En attendant la Couronne",
   "image": "images/chapter-07.webp",
   "alt": "Dans un bureau blanchi à la chaux, chauffé par un poêle de faïence, une grande femme en gris sert du thé à une jeune femme assise ; au mur, une grande carte de la ville piquée d’épingles colorées.",
   "visualDescription": "Intérieur de jour, lumière froide d’une fenêtre haute. Pièce nue blanchie à la chaux : une table, deux chaises, un poêle de faïence blanc. Au mur, une grande carte dessinée de la ville en long ruban sur son glacier, piquée d’épingles à tête de couleur (aucun texte lisible). Hermine, debout, grande, en gris, verse du thé d’une théière dans une tasse, les gants posés parallèles sur la table. Isaure assise, raide, écharpe rayée, mains sur les genoux. Tension feutrée, politesse glaciale.",
   "blocks": [
    {
     "id": "c7-b01",
     "text": "Le sergent qui vint la chercher au Bureau, le 8 mars à midi, avait une moustache de phoque et un visage large et rouge, et Isaure le reconnut : c’était celui qui avait laissé filer le voleur de la Rue Longue derrière une Rendue. Il la reconnut aussi, ou fit semblant, et lui tendit un billet cacheté de gris.",
     "mentions": [
      "la-garde",
      "rendue"
     ]
    },
    {
     "id": "c7-b02",
     "text": "— Sergent Morvan, de la Sûreté, dit-il. L’Intendante vous prie de passer. Maintenant, si ça ne vous dérange pas. Et même si ça vous dérange, à vrai dire.",
     "mentions": [
      "sergent-morvan",
      "hermine-laroque",
      "la-garde"
     ]
    },
    {
     "id": "c7-b03",
     "text": "Maître Bastide la regarda remettre son manteau et ne dit rien. Il la regardait beaucoup, depuis une semaine. Elle avait des cernes jusqu’aux joues, elle s’endormait sur ses tables à trois heures de l’après-midi et se réveillait en sursaut en disant un chiffre, et une fois elle avait mis du sable à glace dans son thé au lieu de sucre. Il n’avait jamais rien demandé. Au moment où elle passait la porte, il leva les yeux de son registre.",
     "mentions": [
      "onesime-bastide"
     ]
    },
    {
     "id": "c7-b04",
     "text": "— Sorbier.",
     "mentions": []
    },
    {
     "id": "c7-b05",
     "text": "— Maître ?",
     "mentions": []
    },
    {
     "id": "c7-b06",
     "text": "— Rien, dit-il. Couvrez-vous.",
     "mentions": []
    },
    {
     "id": "c7-b07",
     "text": "Les bureaux de la Sûreté occupaient l’aile est de la Régence, celle qui donnait sur les Étuves, et Isaure pensa en y entrant qu’elle était exactement au-dessus du tunnel. Le cabinet de l’Intendante était une pièce nue, blanchie à la chaux, meublée d’une table, de deux chaises et d’un poêle de faïence ; au mur, une grande carte de Demeure piquée d’épingles à tête de couleur, et au-dessus de la porte, peinte en lettres noires sur une planche, la formule qu’on retrouvait partout : « En attendant la Couronne ». Sur la table, il y avait une théière, deux tasses, et rien d’autre.",
     "mentions": [
      "la-regence",
      "la-garde",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c7-b08",
     "text": "— Asseyez-vous, dit Hermine Laroque. C’est de la camarine. Je la fais venir des Parois ; elle ne pousse que dans les fentes de la roche, à l’abri du vent. On dit qu’elle éclaircit les idées.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c7-b09",
     "text": "Elle servit le thé elle-même. Ses mains étaient longues, précises, sans bagues.",
     "mentions": []
    },
    {
     "id": "c7-b10",
     "text": "— Je ne vais pas vous faire perdre de temps, mademoiselle Sorbier ; vous n’en avez pas. Il y a un tunnel sous les Étuves de la Veine. Il part de la citerne de madame Gaudin et il va vers ma glacière basse. Je le sais parce que madame Gaudin a reçu trois tombereaux de charbon de trop, parce que ses chaudières fument la nuit et que ses bains ferment à dix heures, parce que ses deux chauffeurs dorment le jour dans une taverne de la rue des Tonneliers, et parce que votre lampe, au Bureau, ne s’allume plus le soir. Je pourrais faire descendre six gardes dans cette citerne ce soir. Je ne le fais pas. Savez-vous pourquoi ?",
     "mentions": [
      "les-etuves",
      "petronille-gaudin",
      "glaciere-basse"
     ]
    },
    {
     "id": "c7-b11",
     "text": "— Parce que vous n’êtes pas sûre.",
     "mentions": []
    },
    {
     "id": "c7-b12",
     "text": "— Parce que la moitié de ma Sûreté se baigne chez madame Gaudin, et que si j’envoie six gardes dans sa citerne, toute la ville saura demain qu’il y a quelque chose dans ma cave. Et parce que je voudrais que ce soit vous qui me le disiez.",
     "mentions": []
    },
    {
     "id": "c7-b13",
     "text": "Elle but une gorgée de thé et reposa la tasse sans bruit.",
     "mentions": []
    },
    {
     "id": "c7-b14",
     "text": "— J’ai lu le dossier de Firmin Vauclair, dit-elle. Tout le dossier. Quarante ans de fiches. Je sais pourquoi la Couronne a disparu en 571 : pas pour être vendue, pour ne pas être posée sur une tête. Le Grand Bail, le fils Varnier. Vos voleurs ont sauvé cette ville, mademoiselle Sorbier. Je le leur accorde volontiers. Ils l’ont sauvée en la laissant sans couronne, et elle s’en est bien trouvée. Les lots de la Ligne sont tirés au sort chaque printemps, parce que la Régence n’a pas le droit de les louer pour plus d’un an. Personne ne possède la Demeure de demain.",
     "mentions": [
      "firmin-vauclair",
      "vol-de-571",
      "compagnie-des-glaces",
      "la-ligne"
     ]
    },
    {
     "id": "c7-b15",
     "text": "Elle se leva, alla jusqu’à la carte et posa le doigt, sans regarder, sur une épingle grise au bas de la ville.",
     "mentions": []
    },
    {
     "id": "c7-b16",
     "text": "— Si la Couronne revient, tout ce qu’ils ont sauvé se défait. Les Varnier ont des petits-enfants. La Compagnie a gardé ses créances. Les Frimas ont des cousins à Solanne, dans le Midi, qui n’attendent qu’une chose, c’est qu’on leur dise que la Couronne est retrouvée et que Mahaut n’a pas d’enfant. Et Mahaut a cinquante-huit ans. Vous voulez savoir ce que je crains, mademoiselle Sorbier ? Je crains une ville qui se remet à espérer. Une ville qui espère se bat. Une ville qui attend ne se bat pas. Vous trouvez notre formule ridicule — « en attendant la Couronne ». Moi aussi. Je l’ai trouvée ridicule toute ma vie. Mais depuis quarante et un ans, à cause d’elle, personne, dans cette ville, ne s’est battu pour quoi que ce soit.",
     "mentions": [
      "mahaut-de-frimas",
      "en-attendant-la-couronne",
      "couronne-de-givre"
     ]
    },
    {
     "id": "c7-b17",
     "text": "Isaure regardait sa tasse. Elle avait envie de dire quelque chose d’intelligent et elle n’avait rien à dire. Ce que disait l’Intendante était juste. C’était cela, le pire.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c7-b18",
     "text": "— Voici ce que je vous propose, reprit Hermine Laroque en revenant s’asseoir. Le 17, à quatre heures du matin, je veux que vous soyez dans ma glacière basse, avec vos instruments. Personne ne connaît cette glace mieux que vous. Vous guiderez mes Fendeurs pour que le cercueil sorte sans être abîmé. Je l’ouvrirai, je prendrai ce qu’il y a dedans, et la morte aura sa Rendue le jour même, avec des chants, par le Prieur lui-même si l’on veut. En échange, la Régence fait remonter votre maison. On rend leurs soixante écus aux Remonteurs, on vous tire un lot sur les Bords, à la Ligne, là où la glace est si lente qu’on y meurt de vieillesse avant sa maison — c’est ce qu’il vous a promis, je crois ? —, on paie la remontée, on paie les pilotis neufs. Et Maître Bastide vous donne la première classe qu’il n’ose pas vous donner parce que vous avez vingt-sept ans.",
     "mentions": [
      "glaciere-basse",
      "fendeurs",
      "maison-sorbier",
      "remontee",
      "onesime-bastide"
     ]
    },
    {
     "id": "c7-b19",
     "text": "Isaure ne demanda pas comment elle savait. Elle pensa au vide sous sa maison, entre les pilotis, là où l’on range le bois et les luges, et elle eut froid.",
     "mentions": []
    },
    {
     "id": "c7-b20",
     "text": "— Et les autres ?",
     "mentions": []
    },
    {
     "id": "c7-b21",
     "text": "— Je ne leur veux aucun mal. Le vieux Mérel a assez payé ; je ne le renverrai pas à la Tour pour un trou dans la glace. Madame Gaudin gardera ses bains. Le petit Affleureur retournera à ses veilles, et je ne dirai rien à son Prieur. Personne n’a besoin de savoir qu’il y a eu un tunnel. Personne n’a besoin de savoir qu’il y a eu une couronne. Il y aura eu une morte qui aura affleuré deux jours trop tôt, voilà tout.",
     "mentions": [
      "constant-merel",
      "petronille-gaudin",
      "tobie-arnal"
     ]
    },
    {
     "id": "c7-b22",
     "text": "— Et si je refuse ?",
     "mentions": []
    },
    {
     "id": "c7-b23",
     "text": "L’Intendante eut ce sourire très bref, des lèvres seulement.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c7-b24",
     "text": "— Alors je fais descendre mes gardes ce soir. Je les arrête tous les trois pour tentative de devancement et recel, et vous avec, pour complicité. La morte sortira le 17 dans ma cave de toute façon, parce que j’ai une dispense et quatre Fendeurs. Vous n’aurez rien sauvé du tout, et vous aurez tout perdu, y compris votre place au Bureau, et votre maison partira quand même le 17, avec vos poutres, qui ne sont plus les vôtres. Je vous le dis sans plaisir. Je ne menace jamais personne ; je décris.",
     "mentions": [
      "la-tour",
      "devancer-la-glace"
     ]
    },
    {
     "id": "c7-b25",
     "text": "Il y eut un silence. Dans le poêle de faïence, une bûche s’effondra.",
     "mentions": []
    },
    {
     "id": "c7-b26",
     "text": "— Je voudrais une nuit, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b27",
     "text": "— Vous l’avez. Demain à midi, le sergent Morvan passera au Bureau.",
     "mentions": []
    },
    {
     "id": "c7-b28",
     "text": "Isaure ne retourna pas au Bureau cet après-midi-là. Elle ne descendit pas non plus dans la citerne, le soir ; elle envoya un gamin porter à Pétronille un mot qui disait seulement « Pas ce soir. Demain », et elle rentra chez elle.",
     "mentions": [
      "petronille-gaudin",
      "bureau-des-jalons"
     ]
    },
    {
     "id": "c7-b29",
     "text": "La maison avait neuf jours. Elle le savait sans avoir besoin de mesurer, et elle mesura quand même, dans le crépuscule, agenouillée derrière la maison, la réglette plongée dans la fente jusqu’à la marque des quinze pouces, puis elle rentra, alluma le poêle, et resta debout au milieu de la pièce principale sans savoir quoi faire.",
     "mentions": [
      "maison-sorbier"
     ]
    },
    {
     "id": "c7-b30",
     "text": "C’était une pièce ordinaire. Elle l’avait toujours trouvée trop sombre. Il y avait la table de sa mère, avec la brûlure en forme de lune là où elle posait son fer à marquer ; les deux fauteuils, dont un boitait ; l’horloge qui retardait de quatre minutes, et sa mère disait que c’était exprès, pour avoir le temps ; les caisses à moitié faites. Et au-dessus, la maîtresse poutre avec ses trois encoches et le fer à cheval renversé de maître Ancel. Isaure leva la lampe. Elle chercha, sur le bois, une trace de ce garçon de dix-huit ans qui l’avait peut-être portée jusqu’à la Ligne avec un chien qui s’appelait Brume. Il n’y en avait pas. Les poutres ne gardent que ce qu’on y taille.",
     "mentions": [
      "remontee",
      "jalons"
     ]
    },
    {
     "id": "c7-b31",
     "text": "Elle s’assit à la table de sa mère et, parce qu’elle ne savait rien faire d’autre, elle mit les choses en colonnes.",
     "mentions": []
    },
    {
     "id": "c7-b32",
     "text": "D’un côté : une maison remontée à la Ligne, sur les Bords, où elle pourrait vivre soixante ans ; une première classe ; Constant, Pétronille et Tobie à l’abri ; la paix de la Régence, qui était une paix véritable ; et une morte qui aurait sa Rendue, avec des chants, deux jours trop tôt.",
     "mentions": [
      "la-ligne"
     ]
    },
    {
     "id": "c7-b33",
     "text": "De l’autre : une nuit de bal, un tunnel sous un palais, une Intendante qui savait compter jusqu’à trois, un vieil homme qui toussait, un novice qui avait peur, une ancienne Fendeuse qui avait deux doigts de moins et pas un sou de trop ; et, au bout, pour elle, une part de la vente d’une couronne à un acheteur du Midi dont elle n’était pas sûre qu’il existât.",
     "mentions": [
      "couronne-de-givre"
     ]
    },
    {
     "id": "c7-b34",
     "text": "Il n’y avait rien à calculer. Les colonnes ne s’équilibraient pas ; la première était pleine et la seconde était vide. Et pourtant elle resta à la table jusqu’à quatre heures du matin, les mains à plat sur le bois, et à quatre heures du matin elle se leva, prit la lampe, sortit derrière la maison et regarda la fente, qui craquait dans le noir. Elle pensait à une chose que l’Intendante avait dite et qu’elle-même n’avait pas relevée sur le moment, parce qu’elle était trop occupée à trouver l’Intendante juste. L’Intendante avait dit : « Je l’ouvrirai, je prendrai ce qu’il y a dedans. » Elle avait dit « ce cercueil », « la morte », « ce qu’il y a dedans ». Elle n’avait pas dit une seule fois le nom de Clémence.",
     "mentions": [
      "clemence-merel"
     ]
    },
    {
     "id": "c7-b35",
     "text": "Isaure prit sa décision à cet instant-là, et elle ne se la formula pas, de peur de l’entendre.",
     "mentions": []
    },
    {
     "id": "c7-b36",
     "text": "Le sergent Morvan la trouva le lendemain à midi sur la terrasse du Bureau, près de la Grande Lunette, où elle faisait semblant de relever les jalons du profil de la Tour. Il la conduisit à l’aile est de la Régence. L’Intendante l’attendait debout, près de la carte.",
     "mentions": [
      "bureau-des-jalons",
      "la-garde"
     ]
    },
    {
     "id": "c7-b37",
     "text": "— Alors ?",
     "mentions": []
    },
    {
     "id": "c7-b38",
     "text": "— Il y a un tunnel, dit Isaure. Il part de la citerne des Étuves. Il fait une toise et demie.",
     "mentions": []
    },
    {
     "id": "c7-b39",
     "text": "Sa propre voix lui parvint de loin, comme d’une salle voisine. C’était une voix très calme.",
     "mentions": []
    },
    {
     "id": "c7-b40",
     "text": "— La glace qu’il traverse est de la glace de trois siècles, continua-t-elle. De la glace de pression, qui est descendue très profond avant de remonter. Elle est dure comme du verre et elle ne fond presque pas. La lance de madame Gaudin y avance d’un pied par nuit, pas davantage. Il leur reste cinq toises. À ce rythme, ils arriveront à la morte le 8 avril. Vous l’aurez sortie depuis trois semaines.",
     "mentions": [
      "les-etuves",
      "petronille-gaudin"
     ]
    },
    {
     "id": "c7-b41",
     "text": "L’Intendante la considéra longtemps, de cet œil qui mesurait à l’aplomb et à la hauteur, et Isaure le soutint sans ciller, parce qu’elle savait qu’on ne cille pas quand on dit la vérité et qu’elle avait passé la moitié de la nuit à s’en persuader.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c7-b42",
     "text": "— Pourquoi ne pas les avoir arrêtés, alors ? demanda l’Intendante. Pourquoi ne pas leur avoir dit qu’ils perdaient leur temps ?",
     "mentions": []
    },
    {
     "id": "c7-b43",
     "text": "— Parce que je veux ma maison, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b44",
     "text": "Et c’était vrai, cela aussi ; et c’est peut-être pour cela qu’elle fut crue.",
     "mentions": []
    },
    {
     "id": "c7-b45",
     "text": "— Si vous descendez maintenant dans la citerne, reprit-elle, vous aurez deux vieilles personnes, un novice et un trou dans la glace. Rien d’autre. Ils diront qu’ils cherchaient de l’eau pour les bains. Laissez-les creuser. Le 17, vous aurez le cercueil et ce qu’il y a dedans. Le 8 avril, ils déboucheront dans une cave vide. Et vous les prendrez quand vous voudrez, ou pas du tout.",
     "mentions": []
    },
    {
     "id": "c7-b46",
     "text": "L’Intendante réfléchit. Elle réfléchissait comme elle servait le thé : sans un geste de trop.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c7-b47",
     "text": "— Je ne mettrai personne dans ma glacière d’ici là, dit-elle enfin : les cuisines du bal sont au-dessus, et les cuisiniers parlent. Vous y serez le 17 à quatre heures, avec vos instruments. Et chaque jour, d’ici là, à midi, vous donnerez au sergent Morvan un billet avec la longueur de leur tunnel.",
     "mentions": []
    },
    {
     "id": "c7-b48",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c7-b49",
     "text": "— Vous n’avez jamais arrondi un chiffre de votre vie, mademoiselle Sorbier, dit l’Intendante. Tout le monde me l’a dit, au Bureau et ailleurs. C’est pour cela que je vous crois.",
     "mentions": [
      "serment-du-pas"
     ]
    },
    {
     "id": "c7-b50",
     "text": "Isaure sortit de la Régence à une heure de l’après-midi. Elle traversa la Rue Longue, fit quelques pas le long de la façade des Étuves, s’arrêta, et vomit dans la neige, proprement, contre un pilotis, sans que personne la remarque. Puis elle se redressa, s’essuya la bouche avec une poignée de neige, et entra aux Étuves.",
     "mentions": [
      "les-etuves"
     ]
    },
    {
     "id": "c7-b51",
     "text": "Ils étaient tous les trois dans le bureau aux serviettes, et ils savaient déjà. Pétronille avait des yeux dans tout le quartier ; un de ses garçons de bains avait vu la Jalonneuse à l’écharpe entrer à la Régence avec le sergent Morvan, la veille et le jour même. Tobie était assis dans un coin, blanc comme un linge. Pétronille était debout, les bras croisés, et elle ne l’invita pas à s’asseoir. Constant était à la table, devant le plan au charbon, et il toussait.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal",
      "constant-merel"
     ]
    },
    {
     "id": "c7-b52",
     "text": "— Je lui ai dit pour le tunnel, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c7-b53",
     "text": "— Nom d’un sérac, dit Pétronille, et pour une fois cela ajoutait quelque chose.",
     "mentions": []
    },
    {
     "id": "c7-b54",
     "text": "— Qu’est-ce que vous lui avez dit exactement ? demanda Constant.",
     "mentions": []
    },
    {
     "id": "c7-b55",
     "text": "Elle le leur dit. Tout. La glace de trois siècles, dure comme du verre, la lance qui avançait d’un pied par nuit, les cinq toises qui restaient, le 8 avril. Le billet quotidien au sergent Morvan. Elle le dit sans s’interrompre, comme on récite un relevé, et quand elle eut fini, il y eut un tel silence qu’on entendit, à travers les cloisons, quelqu’un plonger dans le grand bassin.",
     "mentions": [
      "la-garde"
     ]
    },
    {
     "id": "c7-b56",
     "text": "— Un pied par nuit, répéta Constant.",
     "mentions": []
    },
    {
     "id": "c7-b57",
     "text": "— Un pied par nuit.",
     "mentions": []
    },
    {
     "id": "c7-b58",
     "text": "— Dans de la glace de trois siècles.",
     "mentions": []
    },
    {
     "id": "c7-b59",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c7-b60",
     "text": "— Elle vous a crue.",
     "mentions": []
    },
    {
     "id": "c7-b61",
     "text": "— Elle a dit que je n’avais jamais arrondi un chiffre de ma vie.",
     "mentions": []
    },
    {
     "id": "c7-b62",
     "text": "Constant Mérel rit tout bas, d’un rire qui le fit tousser, et il toussa longtemps, la main sur la bouche, et quand il eut fini de tousser, il riait encore.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c7-b63",
     "text": "— Vous avez menti sur la glace, dit-il.",
     "mentions": []
    },
    {
     "id": "c7-b64",
     "text": "— Une fois.",
     "mentions": []
    },
    {
     "id": "c7-b65",
     "text": "— Et c’était parfait.",
     "mentions": []
    },
    {
     "id": "c7-b66",
     "text": "Pétronille décroisa les bras. Elle regarda Isaure, puis Constant, puis de nouveau Isaure, et quelque chose se défit dans son visage. Elle tira une chaise et poussa Isaure dessus, pas très doucement, et lui mit dans les mains un verre d’une eau-de-vie de baies qui sentait la résine et le feu. Tobie, dans son coin, avait les larmes aux yeux, et il le cachait mal.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal"
     ]
    },
    {
     "id": "c7-b67",
     "text": "— Elle ne vous demandera pas de vérifier, dit Constant. Elle ne sait pas mesurer la glace ; elle sait mesurer les gens. Et vous êtes la personne la plus mesurable de Demeure. Elle a raison de vous croire. Elle a eu raison pendant vingt-sept ans.",
     "mentions": []
    },
    {
     "id": "c7-b68",
     "text": "— Ne dites pas ça.",
     "mentions": []
    },
    {
     "id": "c7-b69",
     "text": "— Pardon.",
     "mentions": []
    },
    {
     "id": "c7-b70",

     "id": "c7-b71",
     "text": "— Clémence aussi, dit-il, a menti une fois sur la glace. Une seule fois dans sa vie. Vous l’avez vue, sa ligne au Registre : « entre 608 et 615, entre la vingtième et la trentième ogive ». Sept ans et dix ogives. La meilleure Jalonneuse de sa génération, qui savait à la semaine près. Elle ne voulait pas qu’on la trouve avant l’heure. C’est le seul chiffre faux qu’elle ait jamais écrit.",

    },
    {
     "id": "c7-b72",
     "text": "Isaure vida son verre d’un coup. Elle toussa, parce que l’eau-de-vie de Pétronille était faite pour des Fendeurs, et elle se leva.",

      "fendeurs"

  {
