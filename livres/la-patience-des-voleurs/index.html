  "synopsis": "Demeure, an 612 de la Coulée. La ville est bâtie sur un glacier qui descend vers le Bras d’un pas par jour : chaque maison naît à la Ligne et tombe du Front une cinquantaine d’années plus tard ; les morts, remis à la glace au-dessus de la ville, affleurent quarante ou soixante ans après dans ses rues et sont rendus à la mer. Isaure Sorbier, vingt-sept ans, Jalonneuse, a calculé la date du Vêlage de l’année : c’est celle où sa maison, au Dernier Rang, partira ; elle n’a pas de quoi la faire remonter. Le jour où Constant Mérel, qui vola la Couronne de Givre en 571, sort de la Tour, il vient s’asseoir sur son seuil : il l’a reconnue à ses jalons depuis sa cellule, et il lui demande où et quand affleurera le Remis cinquante-huit de l’an 571. Surveillée par l’Intendante Hermine Laroque, qui a fait libérer Mérel comme appât, et par le vieil inspecteur Firmin Vauclair, qui l’avait arrêté, Isaure ouvre le Registre : le Remis est Clémence Mérel, Jalonneuse, remise à la glace deux jours après le vol. La couronne est dans son cercueil, qui affleurera dans trois semaines dans la glacière basse du palais de la Régence. Avec Pétronille Gaudin, ancienne Fendeuse qui tient les Étuves voisines, et Tobie Arnal, novice des Affleureurs, Constant et Isaure creusent à l’eau chaude un tunnel vers la morte. Hermine comprend, obtient du Régent le droit de devancer la glace au matin du Vêlage et offre à Isaure la remontée de sa maison contre la trahison ; Isaure lui ment sur la glace, pour la première fois de sa vie, et gagne deux jours. Dans le moulin qui avale l’eau du tunnel, Constant s’effondre et avoue qu’il n’y a pas d’acheteur : la couronne est promise à la Margravine Mahaut, qu’on devait couronner et marier de force en 571 et qui, à dix-sept ans, leur avait ouvert la porte ; Clémence, mourante, avait voulu que la décision lui revienne quand elle serait libre de la prendre. Isaure, qui n’y gagnera rien, reprend le casse en main ; Firmin, qui veut au fond la même chose que le voleur, les rejoint. La nuit du Vêlage, pendant le bal de la Régence, ils tirent le cercueil de la glace ; découverts, ils le sortent en procession d’Affleureurs — nul n’arrête un Remis. À l’aube, au Front, devant la ville entière, Constant exerce son droit de visage : Clémence a vingt-neuf ans et porte la couronne. Mahaut avoue la porte ouverte, laisse la couronne à celle qui l’a portée et renonce : Demeure n’attendra plus. Isaure donne sa maison à la morte ; la dalle vêle à la minute calculée et emporte vers le large la maison éclairée, la morte et la couronne. Un mois plus tard, les décrets commencent par « Désormais » ; Isaure, suspendue du Bureau pour avoir menti sur la glace, bâtit avec les poutres des Frimas une maison de neuf ans dans le Carré d’Attente.",

     "id": "c1-b01",
     "text": "La maison d’Isaure Sorbier avait encore vingt-trois jours à vivre, et Isaure le savait au pas près, puisque c’était elle qui avait fait le calcul.",
     "mentions": []
    },
    {
     "id": "c1-b02",
     "text": "Elle s’agenouilla dans la neige, derrière la maison, à l’endroit où la glace s’était ouverte au début de l’hiver. Ce n’avait d’abord été qu’un trait, un cheveu noir sur le blanc, qu’elle avait failli prendre pour la rayure d’un patin. À présent la fente courait d’un bord à l’autre du Dernier Rang, derrière les pilotis nus des maisons démontées et derrière la sienne, qui tenait encore debout, et l’on pouvait y glisser la main à plat. Isaure y glissa la réglette de buis. Elle souffla sur ses doigts, lut, souffla encore et relut, parce qu’on relit toujours : onze pouces et un quart. Un quart de pouce depuis la veille. La glace tenait son calendrier.",
     "mentions": []
    },
    {
     "id": "c1-b03",
     "text": "Tout ce qui se trouvait en aval de la fente partirait d’un seul morceau : la maison, le jardin de galets que sa mère ratissait l’été, trente pas de neige tassée, puis le bord. Au-delà du bord, le Front tombait à pic dans le Bras, trente toises plus bas ; ce matin la mer y était noire, lisse, semée de petits glaçons immobiles. Isaure nota le chiffre dans son carnet, sous celui de la veille. Vingt-trois jours. Le dix-sept mars, à l’aube, la dalle du Dernier Rang se détacherait de la Coulée, et le Vêlage de l’an 612 emporterait ce qui se trouverait encore dessus.",
     "mentions": []
    },
    {
     "id": "c1-b04",
     "text": "Chaque année, à Demeure, quelqu’un faisait ce calcul ; cette année, c’était elle. Le Premier Jalonneur lui avait confié le Front en octobre, avec un petit sourire qu’elle n’avait compris qu’en ouvrant les tables : le Front de 612, c’était le rang des maisons bâties à la Ligne cinquante ans plus tôt, l’année où son grand-père avait monté la sienne avec des poutres qui avaient déjà descendu deux fois la ville. Elle avait mesuré, recoupé, reporté, et le chiffre était sorti tout seul, sans émotion particulière, comme sortent les chiffres. Elle l’avait porté elle-même au crieur. Le seize au soir, toute la ville danserait sur la date de la mort de sa maison.",
     "mentions": []
    },
    {
     "id": "c1-b05",

     "mentions": []
    },
    {
     "id": "c1-b06",
     "text": "Sa mère était morte en janvier, justement, d’une toux qui ne voulait pas finir. On l’avait remise à la glace au Champ des Remis, là-haut, au-dessus de la Ligne, où la neige de l’hiver l’avait déjà recouverte d’une toise. Le soir de la remise, parce qu’elle ne savait pas quoi faire de ses mains, Isaure avait sorti les tables du tiroir et calculé l’affleurement : quarante-six ans, à peu près, rue des Cordiers, à peu près devant la boutique du grainetier — qui ne serait plus là, et elle-même aurait soixante-treize ans. Elle avait refait le calcul trois fois, puis elle avait rangé les tables et elle s’était assise dans le noir.",
     "mentions": []
    },
    {
     "id": "c1-b07",
     "text": "Elle noua son écharpe, rouge et blanche à larges bandes, tricotée par sa mère aux couleurs des jalons pour qu’on la voie de loin sur la glace, et partit travailler.",
     "mentions": []
    },
    {
     "id": "c1-b08",
     "text": "Isaure remontait chaque matin vingt-huit ans de ville. De sa maison au Bureau des Jalons, qui était accroché à la Paroi Nord au droit de la vingt-deuxième ogive, il y avait une lieue et demie de rues, et chacune de ces rues était plus jeune que la précédente. Il suffisait de regarder le sol. Sous le sable qu’on jetait chaque matin pour les chevaux et les chiens de trait, la glace des rues montrait des bandes alternées, sombres et claires, chacune large d’une dizaine de maisons, qui traversaient la ville d’une paroi à l’autre : les ogives. Chaque paire de bandes était une année de descente. Les enfants de Demeure apprenaient à les compter avant de savoir lire, et l’on donnait son adresse ainsi — rue des Calfats, cinquantième ogive — parce que c’était la seule façon de dire à la fois où l’on habitait et combien de temps il restait.",
     "mentions": []
    },
    {

     "mentions": []

    {
     "id": "c1-b10",
     "text": "À cette heure, la ville se levait. Des lanterniers éteignaient les réverbères au bout de leurs perches. Un caleur, couché sous une maison de la quarante-septième ogive, glissait des coins de chêne sous un pilotis qui s’était enfoncé pendant la nuit, et la maison au-dessus de lui se remettait d’aplomb en grinçant comme un navire. Il sortait des cheminées une fumée d’huile de phoque et de charbon du Midi, et des boulangeries une odeur de seigle. Au croisement de la rue des Tonneliers, deux Fendeurs attendaient le traîneau des carrières, leurs scies en bandoulière, et comparaient leurs mains. Un gamin passa en courant sur des patins, un pain sous le bras. Rien ne semblait bouger, et tout descendait. Demeure faisait un pas par jour ; c’était le chiffre qu’on apprenait à l’école, et c’était faux, parce que la ville allait plus vite en bas qu’en haut et plus vite au milieu que sur les bords, mais c’était un bon chiffre pour les enfants et pour les proverbes.",
     "mentions": []

    {
     "id": "c1-b11",
     "text": "À la quarante-neuvième ogive, elle passa devant l’Hôtel de Frimas. C’était encore, de loin, le plus beau palais de la ville : trois étages de pierre de taille sur une plate-forme de chêne noir, des fenêtres hautes, un perron à double escalier, des blasons que le givre avait rongés au point qu’on ne distinguait plus sur la pierre qu’une forme ronde, qui pouvait être une couronne ou un fromage. L’an prochain, il serait au Dernier Rang. Sur le perron, une petite femme en toque de fourrure balayait ses marches elle-même, à grands coups secs, comme on chasse des poules. Isaure la salua. La Margravine lui rendit son salut avec son balai, et personne dans la rue ne trouva la chose étrange ; il y avait longtemps que plus personne ne trouvait rien d’étrange à Mahaut de Frimas.",

    {
     "id": "c1-b14",
     "text": "Elle se dressait sur le Roc, une bosse de granit noir qui perçait la Coulée au quart de sa largeur, le seul morceau de roche de toute la ville. La glace arrivait sur le Roc, se fendait contre lui, le contournait par les deux côtés et se refermait derrière dans un désordre de crevasses et de séracs qu’on appelait le Sillage. En amont, on ne bâtissait rien sur une bande de trois cents pas qu’on appelait l’Allée, parce que tout ce qu’on y aurait bâti serait allé s’écraser contre la Tour. La prison de Demeure était ainsi le seul endroit de la ville qui ne descendait pas. Les condamnés y regardaient passer les rues. On disait qu’un homme qui faisait vingt ans à la Tour voyait passer sous sa fenêtre des maisons qui n’existaient pas encore le jour de son entrée ; on le disait pour faire peur aux enfants, et c’était vrai.",
     "mentions": []
    },
    {
     "id": "c1-b15",
     "text": "L’Escalier des Jalonneurs comptait deux cent quatorze marches taillées dans la Paroi Nord. Isaure les monta sans les compter, parce qu’elle savait combien il y en avait. Le Bureau était au sommet, trois bâtiments de pierre scellés à la roche avec des crampons de fer, et une terrasse d’où la Grande Lunette regardait la ville glisser. C’était, avec la Tour et le Port-Fixe, l’un des trois endroits de Demeure qui ne bougeaient pas ; les Jalonneurs aimaient dire que c’était pour cela qu’on leur faisait confiance.",
     "mentions": []
    },
    {
     "id": "c1-b16",
     "text": "Dans la grande salle, il faisait chaud et il y avait trop de monde. Le poêle ronflait. Les Jalonneurs de première classe avaient abandonné leurs tables et leurs registres pour faire cercle autour de Grivel, qui avait un cousin à la Garde et donc des nouvelles.",
     "mentions": []
    },
    {
     "id": "c1-b17",
     "text": "— À midi, disait Grivel. À la cloche de midi. Grâce de Vêlage. Le Régent a signé hier soir.",
     "mentions": []
    },
    {
     "id": "c1-b18",
     "text": "— Qui ? demanda Isaure en ôtant ses gants.",
     "mentions": []
    },
    {
     "id": "c1-b19",
     "text": "— Mérel, dit quelqu’un, et tout le monde se tourna vers elle comme si elle arrivait d’une autre ville. Constant Mérel. Le voleur de la Couronne. Ils le libèrent.",
     "mentions": []
    },
    {
     "id": "c1-b20",
     "text": "Isaure connaissait l’histoire, comme tout le monde : la nuit du 1er au 2 mars 571, trois nuits avant le sacre, un homme était passé par les toits de l’Hôtel de Frimas, était entré dans la Chambre de Givre et en était ressorti avec la Couronne. On l’avait arrêté quelques jours plus tard. Il avait avoué le vol et juré qu’il avait jeté la Couronne dans une crevasse du Sillage, la nuit même, pour qu’on ne la lui prenne pas. On ne l’avait jamais retrouvée. Il n’y avait pas eu de sacre. Le Conseil avait nommé un Régent, « en attendant la Couronne », et quarante et un ans plus tard la ville était toujours gouvernée en attendant.",
     "mentions": []
    },
    {
     "id": "c1-b21",
     "text": "— Il va aller droit au Sillage, dit Grivel. Chercher sa crevasse. Ils le lâchent pour ça, si vous voulez mon avis. Pour le suivre.",
     "mentions": []
    },
    {
     "id": "c1-b22",
     "text": "— Il n’y a rien dans le Sillage, dit Isaure. Il y a eu quarante et un ans de glace dessus. Tout ce qui est tombé dans le Sillage en 571 est aujourd’hui sous la quarante-deuxième ogive, à trente toises de fond, et dans quelques années ce sera au fond du Bras.",
     "mentions": []
    },
    {
     "id": "c1-b23",
     "text": "— On dit qu’il sait où elle ressortira.",
     "mentions": []
    },
    {
     "id": "c1-b24",
     "text": "— La glace ne rend pas les couronnes, dit Isaure. Elle rend des morts.",
     "mentions": []
    },
    {
     "id": "c1-b25",
     "text": "Il y eut un silence, parce que tout le monde savait que sa mère avait été remise en janvier, et Grivel toussa. Le Premier Jalonneur choisit ce moment pour sortir de son cabinet. Maître Bastide avait soixante-dix ans, un dos droit comme un jalon neuf et une barbe blanche coupée au carré ; il posa sur les Jalonneurs le regard qu’il posait sur un relevé mal fait, et les Jalonneurs retournèrent à leurs tables.",
     "mentions": []
    },
    {
     "id": "c1-b26",
     "text": "— Sorbier. Le profil de la Tour a trois semaines de retard. Prenez douze jalons et la chaîne. Et mettez des crampons, le Sillage a bougé.",
     "mentions": []
    },
    {
     "id": "c1-b27",
     "text": "— Il bouge toujours, Maître.",
     "mentions": []
    },
    {
     "id": "c1-b28",
     "text": "— C’est pour cela qu’on le mesure.",
     "mentions": []
    },
    {
     "id": "c1-b29",
     "text": "Le profil de la Tour était une ligne de jalons plantée en travers de la Coulée juste en aval du Roc, là où la glace se refermait. Isaure y travaillait depuis l’âge de seize ans, deux fois par mois, à l’aube de préférence parce que la glace est plus dure et l’air plus net, et elle aimait ce travail plus qu’elle ne l’aurait avoué : planter un jalon d’aplomb, le viser depuis la Grande Lunette, revenir quinze jours plus tard et mesurer de combien il avait avancé, et dans quelle direction, et de combien il s’était penché. La ville entière tenait dans ces chiffres. On pouvait en déduire l’âge de chaque maison et la date de sa chute, la vitesse de chaque rue, le chemin de chaque mort remis à la glace. Il n’y avait que ce que la ville pensait qui n’y était pas.",
     "mentions": []
    },
    {
     "id": "c1-b30",
     "text": "Il était presque midi quand elle planta le septième. Le Sillage, à cet endroit, était un chaos de blocs bleus hauts comme des maisons, de crevasses recouvertes de ponts de neige qu’on ne voyait pas et qu’elle connaissait une à une, et de silence. La ville, pourtant toute proche, semblait loin. Isaure enfonça le jalon à la masse, vérifia l’aplomb au fil, donna un dernier coup, vérifia encore. Sur la tête du jalon, elle brûla sa marque au fer qu’elle chauffait dans un petit réchaud de cuivre : ses initiales et une étoile à cinq branches. Chaque Jalonneur avait la sienne. Celle de sa mère avait été une lune.",
     "mentions": []
    },
    {
     "id": "c1-b31",
     "text": "La cloche de midi sonna à la Tour, et presque aussitôt la porte s’ouvrit.",
     "mentions": []
    },
    {
     "id": "c1-b32",
     "text": "Elle ne regardait pas vraiment. Elle vit seulement, du coin de l’œil, deux gardes sur le palier du Roc, un homme entre eux, un paquet sous le bras, puis les gardes qui rentraient et la porte qui se refermait avec un bruit mat, et l’homme tout seul en haut de l’escalier de pierre. Il ne descendit pas tout de suite. Il resta là un long moment, une main sur la rampe, à regarder la ville comme on regarde la mer depuis le pont d’un bateau. Puis il descendit les marches une à une, sans se presser, et au lieu de prendre le chemin de planches qui menait à la Rue Longue, il prit droit vers le Sillage.",
     "mentions": []
    },
    {
     "id": "c1-b33",
     "text": "— Pas par là ! cria Isaure. Il y a des ponts de neige !",
     "mentions": []
    },
    {
     "id": "c1-b34",
     "text": "L’homme leva la main pour montrer qu’il avait entendu, et continua. Il marchait d’un pas étrange, lent et sûr, en posant les pieds là où Isaure les aurait posés elle-même, contournant un pont de neige qu’elle était la seule, croyait-elle, à connaître, enjambant une fente qu’on ne voyait pas. Il arriva jusqu’à la ligne des jalons et s’arrêta devant le septième, celui qu’elle venait de planter. Il était vieux, maigre, rasé de près, vêtu d’un manteau trop grand qui avait dû être à la mode dans une autre vie ; il avait les yeux très clairs et plissés, comme ceux des gens qui ont longtemps regardé de la neige au soleil.",
     "mentions": []
    },
    {
     "id": "c1-b35",
     "text": "— N’y touchez pas, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c1-b36",
     "text": "— Je n’y toucherais pas pour tout l’or de la Coulée, dit l’homme. Il est droit.",
     "mentions": []
    },
    {
     "id": "c1-b37",
     "text": "— Il est d’aplomb.",
     "mentions": []
    },
    {
     "id": "c1-b38",
     "text": "— C’est ce que je dis.",
     "mentions": []
    },
    {
     "id": "c1-b39",
     "text": "Il regarda la marque brûlée sur la tête du jalon, puis Isaure, puis l’écharpe d’Isaure, et il se mit à sourire d’un sourire si content qu’elle faillit se retourner pour voir ce qu’il y avait derrière elle.",
     "mentions": []
    },
    {
     "id": "c1-b40",
     "text": "— C’est donc vous, dit-il. L’écharpe.",
     "mentions": []
    },
    {
     "id": "c1-b41",
     "text": "— Pardon ?",
     "mentions": []
    },
    {
     "id": "c1-b42",
     "text": "Mais il avait déjà soulevé son chapeau, et il repartait à travers le Sillage de son pas lent et sûr, vers la ville. Quand il eut rejoint la Rue Longue, une bande de gamins qui traînaient là se mit à le suivre à distance, en se poussant du coude, et l’un d’eux cria : « C’est lui ! C’est le voleur ! », et l’homme se retourna, fit aux gamins une révérence de maître à danser, et disparut entre deux maisons.",
     "mentions": []
    },
    {
     "id": "c1-b43",
     "text": "Isaure resta un moment les bras ballants, la masse à la main. Puis elle planta les cinq jalons suivants, mesura la chaîne deux fois et redescendit au Bureau reporter ses chiffres, et si sa main trembla un peu en écrivant la date, ce fut à cause du froid.",
     "mentions": []
    },
    {
     "id": "c1-b44",
     "text": "Elle redescendit la ville à la tombée du jour, avec la ville. C’était l’heure où Demeure était la plus belle, quand les lanterniers rallumaient ce qu’ils avaient éteint le matin et que la neige bleuissait entre les maisons. Les rues se remettaient à sourire à mesure qu’elle descendait. Au Carré d’Attente, les enfants étaient rentrés ; il n’y avait plus que la plaque et la neige. Devant l’Hôtel de Frimas, une seule fenêtre était éclairée, tout en haut. Plus bas encore, les maisons s’espaçaient, et puis il n’y avait plus de maisons du tout, seulement des pilotis et des tas de bois, et au bout, seule au bord de tout, la sienne.",
     "mentions": []
    },
    {
     "id": "c1-b45",
     "text": "Un papier était cloué sur sa porte. Elle le décrocha et le lut à la lumière de la dernière lanterne, qui n’était pas allumée, puis à la lumière de la lune, qui l’était.",
     "mentions": []
    },
    {
     "id": "c1-b46",
     "text": "« Corporation des Remonteurs. Maison Sorbier, rue des Calfats, cinquantième ogive, lot 7 du Dernier Rang. Démontage le seize mars à l’aube, poutres acquises par la Corporation le douze janvier. Le propriétaire est prié de libérer les lieux la veille au soir et de tenir le seuil à disposition pour la Rendue. En attendant la Couronne, le Maître de la Corporation. »",
     "mentions": []
    },
    {
     "id": "c1-b47",
     "text": "Elle plia le papier en quatre et s’assit sur le seuil. C’était une dalle de granit gris, usée au milieu par cinquante ans de bottes, la seule pierre de la maison, et la seule chose qu’on ne démonterait pas : le matin du Vêlage, c’était le seuil que chaque famille du Dernier Rang poussait elle-même dans la mer, du haut de la Glissoire, pendant que les Affleureurs chantaient. Sa mère aurait su quoi faire. Sa mère savait toujours quoi faire, et quand elle ne savait pas, elle faisait une soupe.",
     "mentions": []
    },
    {
     "id": "c1-b48",
     "text": "Derrière elle, la fente craqua, un bruit sec de branche, puis un long gémissement qui se perdit sous la neige. Le Front parlait toujours davantage à l’approche du Vêlage. On finissait par ne plus l’entendre.",
     "mentions": []
    },
    {
     "id": "c1-b49",
     "text": "— Vous rentrez tard, pour quelqu’un qui a si peu de temps.",
     "mentions": []
    },
    {
     "id": "c1-b50",
     "text": "Isaure sursauta si fort qu’elle se cogna la tête contre la porte. Sur le tas de chevrons de la maison voisine, celle des Guérin, partis en décembre, un homme était assis, les jambes croisées, un cornet de papier sur les genoux. Il mangeait un hareng fumé avec les doigts, délicatement, comme on mange une pâtisserie dans un salon. C’était l’homme de midi.",
     "mentions": []
    },
    {
     "id": "c1-b51",
     "text": "— Vous êtes chez les Guérin, dit-elle, parce que c’était la seule chose qui lui venait.",
     "mentions": []
    },
    {
     "id": "c1-b52",
     "text": "— Les Guérin sont à la trente et unième ogive, dans une maison neuve qui sent la résine, dit l’homme. Ce que vous voyez là, c’est du bois qui attend les Remonteurs. Je lui tiens compagnie. J’ai de l’entraînement.",
     "mentions": []
    },
    {
     "id": "c1-b53",
     "text": "— Qu’est-ce que vous voulez ?",
     "mentions": []
    },
    {
     "id": "c1-b54",
     "text": "Il plia soigneusement son cornet de papier, s’essuya les doigts dans la neige et se leva. Debout, il était plus grand qu’elle ne l’avait cru, et plus vieux.",
     "mentions": []
    },
    {
     "id": "c1-b55",
     "text": "— Je m’appelle Constant Mérel, dit-il. Vous le savez déjà, les gamins de la Rue Longue le crient depuis midi. Vous, vous êtes Isaure Sorbier, Jalonneuse de seconde classe, vous signez d’une étoile et vous plantez vos jalons à l’aube, deux fois par mois, sur le profil de la Tour, depuis onze ans. Onze ans et deux mois. Je vous ai regardée faire depuis ma fenêtre. Vous êtes la seule à planter droit.",
     "mentions": []
    },
    {
     "id": "c1-b56",
     "text": "— D’aplomb.",
     "mentions": []
    },
    {
     "id": "c1-b57",
     "text": "— D’aplomb, dit-il en s’inclinant, comme on concède un point au jeu. J’ai une question de glace à vous poser, mademoiselle Sorbier.",
     "mentions": []
    },
    {
     "id": "c1-b58",
     "text": "Il regarda la maison, la fente, le bord du Front où la nuit tombait sur la mer, puis de nouveau Isaure, et elle vit qu’il ne souriait plus.",
     "mentions": []
    },
    {
     "id": "c1-b59",
     "text": "— Elle vaut une couronne.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-2",
   "number": 2,
   "title": "Cinquante-huit, an 571",
   "blocks": [
    {
     "id": "c2-b01",
     "text": "Elle le fit entrer parce qu’il faisait froid, parce qu’il était vieux et parce que sa mère, à sa place, l’aurait fait entrer ; et comme sa mère, à sa place, aurait fait une soupe, elle fit une soupe. C’était la première fois qu’elle cuisinait pour quelqu’un depuis janvier. Elle ne sut pas bien doser le sel.",
     "mentions": []
    },
    {
     "id": "c2-b02",
     "text": "Constant Mérel mangea tout. Il avait posé son chapeau sur ses genoux et son paquet à ses pieds, et il regardait autour de lui avec une attention qui n’était pas de la politesse : les caisses à moitié faites, les étagères vides, le poêle de fonte, les tables de Jalonneuse de sa mère empilées sur la commode, et surtout le plafond. Il regardait les poutres du plafond comme d’autres regardent les tableaux dans un salon.",
     "mentions": []
    },
    {
     "id": "c2-b03",
     "text": "— Celle-ci a fait trois descentes, dit-il en montrant la maîtresse poutre, au-dessus du poêle. Vous voyez les trois encoches, près du mur ? Une par descente. Et la marque, là, en forme de fer à cheval renversé : c’est celle de maître Ancel, de la Corporation. J’ai été son apprenti. En 562, nous avons monté toutes les poutres de ce rang-ci jusqu’à la Ligne, avec deux traîneaux et un chien qui s’appelait Brume. J’avais dix-huit ans. J’ai peut-être porté celle-ci.",
     "mentions": []
    },
    {
     "id": "c2-b04",
     "text": "— Vous étiez Remonteur.",
     "mentions": []
    },
    {
     "id": "c2-b05",
     "text": "— Avant d’être autre chose.",
     "mentions": []
    },
    {
     "id": "c2-b06",
     "text": "Il reposa sa cuillère dans l’assiette, bien droite, et s’essuya la bouche.",
     "mentions": []
    },
    {
     "id": "c2-b07",
     "text": "— Ma fenêtre, à la Tour, donnait vers l’amont, dit-il. On croit qu’un prisonnier regarde le passé. Moi je regardais arriver l’avenir, à un pas par jour. Je voyais les nouvelles maisons naître à la Ligne, au printemps, toutes petites, et puis grandir à mesure qu’elles approchaient, et puis passer sous ma fenêtre, et puis je ne les voyais plus. J’ai vu passer la vôtre en 578. Elle avait un volet bleu.",
     "mentions": []
    },
    {
     "id": "c2-b08",
     "text": "— Il est gris.",
     "mentions": []
    },
    {
     "id": "c2-b09",
     "text": "— Il était bleu.",
     "mentions": []
    },
    {
     "id": "c2-b10",
     "text": "Isaure ne répondit pas. Il y avait dans ce vieil homme assis sous ses poutres quelque chose d’insupportable, et elle mit un moment à comprendre quoi : il connaissait sa maison depuis plus longtemps qu’elle.",
     "mentions": []
    },
    {
     "id": "c2-b11",
     "text": "— Les Jalonneurs, j’ai mis des années à les remarquer, reprit-il. Des petits points qui plantaient des bâtons. Et puis j’ai compris ce qu’ils faisaient, et j’ai commencé à les attendre. On attend beaucoup de choses, à la Tour. Il y en avait un qui plantait de travers, un grand, toujours pressé.",
     "mentions": []
    },
    {
     "id": "c2-b12",
     "text": "— Grivel.",
     "mentions": []
    },
    {
     "id": "c2-b13",
     "text": "— Et puis il y a eu vous. Une petite écharpe rouge et blanche, deux fois par mois, avant le lever du soleil. Vos lignes étaient droites comme un fil tendu. Je me suis mis à les vérifier, depuis ma fenêtre, avec un fil tendu justement, et un clou planté dans l’appui. Elles étaient droites. J’ai pensé : celle-là, elle ne triche pas, même quand personne ne regarde. C’est rare. J’en ai connu une autre, autrefois.",
     "mentions": []
    },
    {
     "id": "c2-b14",
     "text": "— Qu’est-ce que vous voulez, monsieur Mérel ?",
     "mentions": []
    },
    {
     "id": "c2-b15",
     "text": "Il sourit, comme si elle venait enfin de dire quelque chose d’intéressant.",
     "mentions": []
    },
    {
     "id": "c2-b16",
     "text": "— Si je vous donnais un numéro du Registre des Remis, pourriez-vous me dire où et quand ce Remis affleurera ? Pas à l’ogive près. Au pas près. Et au jour près.",
     "mentions": []
    },
    {
     "id": "c2-b17",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b18",
     "text": "— Le feriez-vous ?",
     "mentions": []
    },
    {
     "id": "c2-b19",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c2-b20",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c2-b21",
     "text": "— Parce que vous êtes Constant Mérel.",
     "mentions": []
    },
    {
     "id": "c2-b22",
     "text": "Il rit, pour de bon cette fois, un rire bref et silencieux qui lui secoua les épaules, et il dut s’essuyer les yeux.",
     "mentions": []
    },
    {
     "id": "c2-b23",
     "text": "— C’est une excellente raison, dit-il. C’est même la meilleure que j’aie entendue depuis longtemps. Je vous ferais une part, vous savez. Une part honnête. De quoi faire remonter dix maisons comme celle-ci. De quoi en bâtir une au bord de la Ligne, sur les Bords, là où la glace est si lente qu’on y meurt de vieillesse avant sa maison.",
     "mentions": []
    },
    {
     "id": "c2-b24",
     "text": "— Je ne vole pas.",
     "mentions": []
    },
    {
     "id": "c2-b25",
     "text": "— Personne ne vous demande de voler. Je vous demande un calcul. Les calculs ne sont pas des vols, mademoiselle Sorbier ; ce serait même plutôt le contraire.",
     "mentions": []
    },
    {
     "id": "c2-b26",
     "text": "Il se leva, remit son chapeau, reprit son paquet. À la porte, il tira de sa poche un papier plié en quatre et le posa sur le coin de la table, à côté des tables de Jalonneuse de sa mère, sans insister, comme on laisse une carte de visite.",
     "mentions": []
    },
    {
     "id": "c2-b27",
     "text": "— Je loge aux Étuves de la Veine, chez une amie, dit-il. Si vous changez d’avis, demandez la Pétro. Vous avez vingt-trois jours. Moi, un peu plus. Pas beaucoup.",
     "mentions": []
    },
    {
     "id": "c2-b28",
     "text": "Quand il fut parti, elle attendit un long moment avant de déplier le papier. Il n’y avait dessus que deux nombres, d’une écriture penchée et fine, une écriture d’autrefois : « 58 — 571 ».",
     "mentions": []
    },
    {
     "id": "c2-b29",
     "text": "Elle le remit dans sa poche. Puis elle prit un couteau sur l’évier, sortit dans la nuit, fit le tour de la maison jusqu’au volet gris qui battait, et gratta la peinture avec la pointe, à la lueur de la lune. Sous le gris, il y avait du vert. Sous le vert, il y avait du bleu.",
     "mentions": []
    },
    {
     "id": "c2-b30",
     "text": "Le lendemain, au Bureau, on ne parlait que de Mérel. On l’avait vu le matin à la Rue Longue, qui achetait des oranges du Midi à prix d’or ; on l’avait vu au Sillage, qui ne cherchait rien ; on l’avait vu entrer aux Étuves de la Veine avec une serviette sur l’épaule, comme un bourgeois. Grivel, qui n’avait vu que son cousin, affirmait qu’il était suivi par trois hommes de la Sûreté déguisés en marchands de marrons. Isaure travaillait à ses tables du profil de la Tour et ne disait rien. Elle sentait le papier dans sa poche comme on sent une pierre dans une chaussure.",
     "mentions": []
    },
    {
     "id": "c2-b31",
     "text": "Vers onze heures, le silence se fit dans la grande salle, d’un coup, comme lorsqu’un chat entre dans une cuisine. Une femme venait d’entrer. Elle était grande, mince, vêtue d’un manteau gris sans aucun ornement, les cheveux tirés en un chignon si serré qu’on avait mal pour elle, et elle portait à la main des gants qu’elle ne mettait pas. Tout le monde à Demeure connaissait son visage, parce que tout le monde à Demeure avait appris à le reconnaître de loin. C’était l’Intendante de la Sûreté de la Régence.",
     "mentions": []
    },
    {
     "id": "c2-b32",
     "text": "Elle échangea trois mots avec Maître Bastide, qui la fit entrer dans son cabinet, puis ressortit sur le seuil et appela, d’une voix qu’on n’entendit que parce que personne ne respirait :",
     "mentions": []
    },
    {
     "id": "c2-b33",
     "text": "— Mademoiselle Sorbier, s’il vous plaît.",
     "mentions": []
    },
    {
     "id": "c2-b34",
     "text": "Le cabinet du Premier Jalonneur était petit, surchauffé, tapissé de cartes de la Coulée qui remontaient à trois siècles, et Maître Bastide eut la délicatesse de n’y pas rester. Hermine Laroque s’assit dans son fauteuil comme si c’était le sien, invita Isaure à s’asseoir en face et posa ses gants sur le bureau, parallèles, à un doigt l’un de l’autre.",
     "mentions": []
    },
    {
     "id": "c2-b35",
     "text": "— Constant Mérel a passé une heure chez vous hier soir, dit-elle. De sept heures douze à huit heures dix. Il a mangé une soupe. Je ne vous le reproche pas : on ne peut pas empêcher un homme de s’asseoir sur un tas de bois. Je voudrais seulement savoir ce qu’il vous a demandé.",
     "mentions": []
    },
    {
     "id": "c2-b36",
     "text": "— Une soupe.",
     "mentions": []
    },
    {
     "id": "c2-b37",
     "text": "L’Intendante eut un sourire très bref, qui ne toucha pas ses yeux, mais qui n’était pas désagréable.",
     "mentions": []
    },
    {
     "id": "c2-b38",
     "text": "— Je vais être franche avec vous, mademoiselle Sorbier, parce que je crois que vous êtes quelqu’un avec qui la franchise fait gagner du temps. Mérel n’a pas été libéré par hasard. La grâce de Vêlage, c’est moi qui l’ai demandée au Régent. Voilà quarante et un ans que cet homme se tait ; nous avons pensé qu’en le laissant marcher, il finirait par nous montrer ce qu’il ne voulait pas dire. Il a marché. Il est allé tout droit vers vous.",
     "mentions": []
    },
    {
     "id": "c2-b39",
     "text": "— Il est allé tout droit vers le Sillage.",
     "mentions": []
    },
    {
     "id": "c2-b40",
     "text": "— Pour vous parler. Et le soir, chez vous. Vous êtes la seule personne à qui il ait adressé la parole depuis sa sortie, à part une marchande d’oranges et la patronne des Étuves, qui est une vieille amie à lui et à qui nous ne demanderons rien, parce qu’elle ne nous dirait rien. Vous, je vous le demande.",
     "mentions": []
    },
    {
     "id": "c2-b41",
     "text": "Isaure réfléchit. Elle réfléchissait toujours avant de répondre, ce qui lui avait valu à l’école une réputation de lenteur et au Bureau une réputation d’exactitude.",
     "mentions": []
    },
    {
     "id": "c2-b42",
     "text": "— Il a juré en 571 qu’il avait jeté la Couronne dans une crevasse du Sillage, dit-elle. Vous pensez qu’il savait où elle ressortirait.",
     "mentions": []
    },
    {
     "id": "c2-b43",
     "text": "— C’est l’idée.",
     "mentions": []
    },
    {
     "id": "c2-b44",
     "text": "— Alors vous avez tort, ou il a menti. Ce qui tombe dans le Sillage ne ressort pas. La glace, derrière le Roc, plonge ; c’est pour cela qu’elle se referme si mal. Tout ce qui est tombé dans le Sillage en 571 a suivi le fond, et aujourd’hui c’est au pied du Front, sous l’eau, ou déjà dans le Bras. Si Mérel a dit vrai, madame, la Couronne est au fond de la mer, et il n’a rien à chercher. S’il a quelque chose à chercher, c’est qu’il a menti.",
     "mentions": []
    },
    {
     "id": "c2-b45",
     "text": "Hermine Laroque la regarda un long moment, et Isaure eut le sentiment désagréable d’être mesurée, comme on mesure un jalon, à l’aplomb et à la hauteur.",
     "mentions": []
    },
    {
     "id": "c2-b46",
     "text": "— C’est aussi notre conclusion, dit enfin l’Intendante. Vous voyez ? Vous nous êtes précieuse. Que vous a-t-il demandé ?",
     "mentions": []
    },
    {
     "id": "c2-b47",
     "text": "— J’ai prêté le Serment du Pas, madame. Je dis où va la glace. Je ne dis pas où vont les gens.",
     "mentions": []
    },
    {
     "id": "c2-b48",
     "text": "— C’est joliment dit.",
     "mentions": []
    },
    {
     "id": "c2-b49",
     "text": "— C’est le Serment.",
     "mentions": []
    },
    {
     "id": "c2-b50",
     "text": "L’Intendante reprit ses gants, les regarda comme si elle vérifiait qu’ils étaient toujours deux, et se leva.",
     "mentions": []
    },
    {
     "id": "c2-b51",
     "text": "— Votre maison part le dix-sept, dit-elle. Je le sais parce que c’est vous qui l’avez annoncé : c’est votre date qu’on a imprimée sur les affiches du bal. Il paraît que vous n’avez jamais arrondi un chiffre de votre vie. La Régence sait être reconnaissante, mademoiselle Sorbier, envers ceux qui l’aident ; et elle sait se souvenir des autres. Nous nous reverrons. Demeure est longue, mais elle n’est pas large.",
     "mentions": []
    },
    {
     "id": "c2-b52",
     "text": "Elle sortit sans bruit. Dans la grande salle, trente Jalonneurs baissèrent la tête sur leurs registres avec un ensemble parfait. Isaure retourna à sa table et découvrit qu’elle avait serré le papier plié dans sa poche si fort qu’il était trempé.",
     "mentions": []
    },
    {
     "id": "c2-b53",
     "text": "Elle quitta le Bureau à la nuit tombée. L’Escalier des Jalonneurs était désert, éclairé de loin en loin par des lanternes de verre épais scellées dans le roc, et au milieu, sur la cent septième marche — elle le savait parce que c’était celle du milieu, et qu’elle s’y arrêtait toujours pour souffler quand elle montait le matin —, un homme était assis. Il était gros, vieux, enveloppé dans une pèlerine de laine qui avait été noire, et il fumait une pipe courte qui sentait le goudron. Il avait l’air de quelqu’un qui a monté cent sept marches et qui n’a pas l’intention d’en monter une de plus.",
     "mentions": []
    },
    {
     "id": "c2-b54",
     "text": "— Mademoiselle Sorbier, dit-il. Ne vous inquiétez pas, je ne me lève pas. Ce serait trop long et vous seriez partie avant la fin. Firmin Vauclair, inspecteur de la Garde, retiré. C’est moi qui ai arrêté Constant Mérel le 6 mars 571. On vous l’a peut-être dit.",
     "mentions": []
    },
    {
     "id": "c2-b55",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c2-b56",
     "text": "— Personne ne s’en souvient, dit-il sans amertume. Ils se souviennent de lui. C’est normal : c’est lui qui a fait quelque chose. Moi, je l’ai seulement attrapé.",
     "mentions": []
    },
    {
     "id": "c2-b57",
     "text": "Il tira sur sa pipe, qui s’était éteinte, et la regarda d’un air de reproche.",
     "mentions": []
    },
    {
     "id": "c2-b58",
     "text": "— Il vous a demandé quelque chose, dit-il. Ne me dites pas quoi, je ne vous le demande pas ; je ne suis plus rien, je n’ai le droit de rien demander à personne. Il ne vous demandera rien d’illégal, j’imagine. Il ne demande jamais rien d’illégal. Il demande des nombres. En 571, il demandait des mesures de toits.",
     "mentions": []
    },
    {
     "id": "c2-b59",
     "text": "— Et l’Intendante ?",
     "mentions": []
    },
    {
     "id": "c2-b60",
     "text": "— Ah. Elle est passée. Oui. Elle a été mon élève, figurez-vous. La meilleure. Elle m’a appris beaucoup de choses, dont la retraite.",
     "mentions": []
    },
    {
     "id": "c2-b61",
     "text": "Il ralluma sa pipe, patiemment, en protégeant l’allumette de sa grosse main.",
     "mentions": []
    },
    {
     "id": "c2-b62",
     "text": "— Méfiez-vous d’elle davantage que de lui, dit-il. Lui, au moins, je sais ce qu’il veut.",
     "mentions": []
    },
    {
     "id": "c2-b63",
     "text": "— Et que veut-il ?",
     "mentions": []
    },
    {
     "id": "c2-b64",
     "text": "Firmin Vauclair souffla un nuage de fumée qui monta droit dans l’air immobile, au-dessus de la ville qui descendait.",
     "mentions": []
    },
    {
     "id": "c2-b65",
     "text": "— La même chose que moi depuis quarante et un ans, dit-il. Être là quand elle ressortira.",
     "mentions": []
    },
    {
     "id": "c2-b66",
     "text": "Il ne précisa pas qui était « elle », et Isaure ne le lui demanda pas. Elle le laissa sur sa marche et descendit les cent sept autres. Ce n’est qu’en bas, sur les planches du chemin qui rejoignait la ville, qu’elle s’aperçut qu’au lieu de prendre à droite, vers la Rue Longue et vers chez elle, elle s’était arrêtée et regardait en arrière, vers les fenêtres du Bureau, qui étaient toutes éteintes.",
     "mentions": []
    },
    {
     "id": "c2-b67",
     "text": "Elle remonta. Deux cent quatorze marches. Elle avait la clef ; tous les Jalonneurs avaient la clef, parce que la glace ne s’arrête pas la nuit et que les calculs non plus. Dans la grande salle vide, le poêle était encore tiède. Elle alluma une lampe, prit dans l’armoire du fond le Registre des Remis de l’an 571, un gros volume relié de toile bise dont le dos portait l’année en chiffres dorés, et avant de l’ouvrir, parce que c’était la règle et qu’elle avait toujours suivi la règle, elle inscrivit dans le cahier des consultations la date, l’heure, le numéro de l’année et le numéro du Remis, et elle signa : Isaure Sorbier, avec une petite étoile.",
     "mentions": []
    },
    {
     "id": "c2-b68",
     "text": "Le Registre des Remis était, de tous les livres du Bureau, celui qu’on ouvrait avec le plus de précaution. Chaque mort de Demeure y avait sa ligne : son nom, son âge, son métier, le jour de sa remise, sa place exacte au Champ des Remis — rang, numéro, profondeur — et, dans une colonne laissée en blanc jusqu’à ce que les Jalonneurs aient assez de relevés pour la remplir, l’endroit et l’année approximatifs de son affleurement. Les Affleureurs s’en servaient pour préparer leurs veilles. Les familles venaient le consulter pour savoir où et quand elles retrouveraient leurs morts, ou plutôt quand leurs petits-enfants les retrouveraient. Isaure avait inscrit elle-même, en janvier, la ligne de sa mère dans le Registre de 612.",
     "mentions": []
    },
    {
     "id": "c2-b69",
     "text": "Elle tourna les pages. L’hiver 571 avait été dur, et en deux mois le Registre avait déjà passé la cinquantaine. Numéro 55, un pêcheur. Numéro 56, un enfant de trois ans. Numéro 57, une veuve de la Rue Longue. Numéro 58.",
     "mentions": []
    },
    {
     "id": "c2-b70",
     "text": "« Clémence Mérel, née Aubrac. Vingt-neuf ans. Jalonneuse de première classe au Bureau des Jalons. Décédée le 2 mars 571, de consomption. Remise à la glace le 4 mars 571 au Champ des Remis, rang 12, place 31, à deux toises et trois pieds. Affleurement estimé : entre 608 et 615, dans la Veine, entre la vingtième et la trentième ogive. »",
     "mentions": []
    },
    {
     "id": "c2-b71",
     "text": "Isaure relut la ligne, parce qu’on relit toujours. Puis elle la relut encore, et elle compta sur ses doigts, ce qu’elle ne faisait jamais.",
     "mentions": []
    },
    {
     "id": "c2-b72",
     "text": "Le vol de la Couronne avait eu lieu dans la nuit du 1er au 2 mars 571. Clémence Mérel, Jalonneuse, était morte le 2 au matin, et on l’avait remise à la glace le 4. Et le 6, son mari s’était rendu.",
     "mentions": []
    },
    {
     "id": "c2-b73",
     "text": "Elle resta longtemps assise devant la page, dans la grande salle où le poêle achevait de refroidir. Au-dehors, sous les fenêtres, Demeure descendait vers la mer avec toutes ses lanternes, et quelque part sous elle, à deux toises et trois pieds de la surface quarante et un ans plus tôt, beaucoup plus bas aujourd’hui, une femme de vingt-neuf ans descendait avec elle. Isaure savait maintenant où était la Couronne de Givre. Elle ne savait pas encore où, ni quel jour, la glace la rendrait.",
     "mentions": []
    },
    {
     "id": "c2-b74",
     "text": "Mais ça, c’était son métier.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-3",
   "number": 3,
   "title": "Un pas par jour",
   "blocks": [
    {
     "id": "c3-b01",
     "text": "Elle déroula sur la grande table les Tables de Pas de quarante et une années, de 571 à 611, et les lesta aux quatre coins avec ce qu’elle trouva : l’encrier, deux pierres de moraine qui servaient de presse-papiers, le Registre des Remis, sa propre tasse. La lampe éclairait un cercle de papier jauni ; au-delà, la grande salle était noire, et au-delà encore, derrière les fenêtres, la ville descendait.",
     "mentions": []
    },
    {
     "id": "c3-b02",
     "text": "Un mort remis à la glace ne va pas où va la ville. C’était la première chose qu’on apprenait aux apprentis Jalonneurs, et la dernière qu’ils comprenaient vraiment. Au Champ des Remis, au-dessus de la Ligne, il neige plus qu’il ne fond ; chaque hiver ajoute une couche au-dessus des morts, qui s’enfoncent sans bouger, comme des pierres au fond d’un lac qui monte. Ils descendent avec la Coulée, mais en profondeur, et la glace profonde est plus lente que celle de la surface, freinée par le lit de roche sur lequel elle frotte. Puis, passé la Ligne, tout s’inverse : la ville fond plus qu’il ne neige, la surface s’abaisse d’année en année, et les morts, sans avoir bougé d’un pouce vers le haut, se retrouvent de plus en plus près du jour. Un jour, ils y sont. Les Jalonneurs appelaient cela le chemin d’un Remis, et le calcul d’un chemin prenait d’ordinaire une semaine à deux Jalonneurs de première classe.",
     "mentions": []
    },
    {
     "id": "c3-b03",
     "text": "Isaure avait une nuit.",
     "mentions": []
    },
    {
     "id": "c3-b04",
     "text": "Elle commença par le commencement : rang 12, place 31, deux toises et trois pieds. Elle chercha dans les Tables de 571 le relevé du Champ des Remis, trouva la vitesse de la glace à cet endroit et à cet hiver-là, la corrigea pour la profondeur, reporta le point sur un calque. Puis elle ouvrit la Table de 572, et recommença. Et 573. Et 574. Chaque année était une ligne de chiffres serrés, relevés par des Jalonneurs dont elle connaissait les marques brûlées sans avoir connu les visages — un triangle, un cœur, une croix de Malte, une ancre. À partir de 591, la lune de sa mère apparut dans les colonnes. Isaure s’arrêta, le doigt sur le petit croissant tracé à l’encre, et reprit.",
     "mentions": []
    },
    {
     "id": "c3-b05",
     "text": "Pour corriger ses vitesses selon la profondeur, elle se servait, comme tout le monde au Bureau, de la table qu’on appelait la Mérel. C’était une grille de coefficients imprimée au dos de toutes les Tables de Pas depuis quarante ans ; on disait « passe-moi la Mérel » comme on dit « passe-moi le sel », et Isaure s’en servait depuis onze ans sans s’être jamais demandé d’où venait ce nom. Cette nuit-là, elle retourna la page et lut, en petits caractères, sous la grille : « Coefficients de profondeur établis par C. Mérel, Jalonneuse de première classe, 568. » Elle regarda longtemps ces quelques mots. Puis elle se remit au travail avec la table de la morte pour calculer le chemin de la morte.",
     "mentions": []
    },
    {
     "id": "c3-b06",
     "text": "Le chemin descendait lentement. Quinze ans pour passer le Champ des Remis et la Chute, où la glace se brise sur une marche de roche avant de se ressouder en bas et de fabriquer, à chaque saison, une nouvelle ogive. En 586, le point passait sous la Ligne, à quatorze toises de profondeur. Isaure alla chercher dans l’armoire le plan du lotissement de 586 — les lots tirés cette année-là à la Ligne pour les maisons nouvelles — et posa le calque dessus.",
     "mentions": []
    },
    {
     "id": "c3-b07",
     "text": "Le point tombait au milieu du lot 3 de la Veine. Le lot 3 de la Veine, en 586, avait été attribué au Conseil pour la construction du nouveau palais de la Régence.",
     "mentions": []
    },
    {
     "id": "c3-b08",
     "text": "Isaure reposa son crayon. Elle vérifia ses vitesses de 580 à 586, refit deux corrections de la Mérel, reporta de nouveau. Le point ne bougea pas. En 586, le Régent de l’époque avait posé la première pierre de son palais à l’aplomb exact d’une Jalonneuse morte, qui passait quatorze toises plus bas avec la Couronne des Frimas ; et depuis vingt-six ans le palais et la morte descendaient ensemble, l’un au-dessus de l’autre, comme deux passagers du même bateau qui ne se sont jamais parlé.",
     "mentions": []
    },
    {
     "id": "c3-b09",
     "text": "Elle continua, parce qu’il restait à savoir quand. Passé la Ligne, la surface s’abaissait ; il fallait les relevés d’ablation de la Veine, rue par rue, année par année. Il fallait aussi tenir compte du Roc : à la dix-huitième ogive, la glace se séparait autour de lui, et même à deux cents pas au sud, où passait le chemin, elle en gardait une petite déviation, que Clémence Mérel avait mesurée en 569 — Isaure trouva ses relevés, signés d’une petite marque qu’elle n’avait jamais vue : un sablier. Il fallait surtout le registre des creusements. Toute glacière creusée dans la Coulée devait être déclarée au Bureau, parce qu’une cave de cinq toises change les dates d’affleurement de tous les morts qui passent dessous. Isaure trouva la déclaration : « Régence. Glacière basse, creusée en 586, approfondie en 601. Fond à cinq toises et deux pieds sous le niveau de la rue. »",
     "mentions": []
    },
    {
     "id": "c3-b10",
     "text": "À quatre heures du matin, elle avait un chiffre. À cinq heures, elle l’avait vérifié par une autre méthode, celle des vieux Jalonneurs, qui passe par les ogives au lieu des vitesses. À six heures, elle l’avait vérifié une troisième fois, parce que les deux premiers étaient identiques et qu’elle se méfiait des résultats trop contents d’eux-mêmes.",
     "mentions": []
    },
    {
     "id": "c3-b11",
     "text": "Le cercueil de Clémence Mérel percerait le mur aval de la glacière basse de la Régence, celui qui regardait vers le Front, à un pied au-dessus du sol, entre le 18 et le 20 mars 612 — le 19, selon toute probabilité. Deux jours après le Vêlage.",
     "mentions": []
    },
    {
     "id": "c3-b12",
     "text": "Isaure éclata de rire. Seule dans la grande salle froide, devant quarante et une années de chiffres, elle rit comme elle n’avait pas ri depuis janvier, un rire qu’elle n’arrivait pas à arrêter et qui lui faisait mal aux côtes, et quand elle l’eut enfin arrêté, elle s’aperçut qu’elle avait les joues mouillées.",
     "mentions": []
    },
    {
     "id": "c3-b13",
     "text": "Avant de ranger, elle rouvrit le Registre des Remis à la page de 571, pour recopier la ligne. Elle regarda de nouveau la colonne de l’affleurement estimé, « entre 608 et 615, dans la Veine, entre la vingtième et la trentième ogive », et cette fois elle vit l’écriture. Elle n’était pas celle du greffier, qui avait rempli le reste de la ligne. C’était une écriture ronde, rapide, un peu tremblée, la même que celle des relevés du Roc en 569. Et après la dernière ogive, minuscule, presque effacée : un sablier.",
     "mentions": []
    },
    {
     "id": "c3-b14",
     "text": "Les Étuves de la Veine avaient été bâties en 586, l’année du palais, sur le lot voisin ; on disait à Demeure qu’elles étaient nées le même jour que la Régence et qu’elles descendraient à la mer avec elle, comme deux sœurs dont l’une a fait un beau mariage. C’était un grand bâtiment de brique et de bois, sans fenêtres au rez-de-chaussée, avec une porte basse et une cheminée de navire qui crachait nuit et jour une fumée blanche. On y entrait par un vestibule où une femme en tablier vendait des serviettes, des savons à la résine et des branches de bouleau séchées ; puis on passait un rideau de laine, et l’on entrait dans l’été.",
     "mentions": []
    },
    {
     "id": "c3-b15",
     "text": "Isaure n’y était pas venue depuis l’enfance. Elle avait oublié la chaleur, qui vous saisissait à la gorge, et le bruit : l’eau qui coulait partout dans des rigoles de cuivre, les voix qui résonnaient sous les voûtes, les rires, les claquements de branches mouillées sur des dos nus. Dans le grand bassin, sous la verrière embuée, il y avait des dockers du Port-Fixe et des clercs de la Régence, deux officiers de la Garde qui avaient laissé leurs sabres au vestiaire, un vieux pêcheur qui dormait debout, trois matrones qui se disputaient la recette d’un pâté, et tout ce monde se ressemblait, parce qu’aux Étuves on ne porte que de la vapeur. C’était la seule chose, à Demeure, qui fût égale pour tous.",
     "mentions": []
    },
    {
     "id": "c3-b16",
     "text": "— C’est toi, l’écharpe !",
     "mentions": []
    },
    {
     "id": "c3-b17",
     "text": "La femme qui venait de crier cela à travers la vapeur était immense. Elle portait un tablier de cuir sur une robe de toile, des sabots de bois, les manches roulées sur des bras de Fendeuse, et il lui manquait deux doigts à la main gauche, l’annulaire et l’auriculaire, gelés un hiver et coupés au couteau, avait-elle coutume de dire, par elle-même, pour ne pas faire attendre le chirurgien. Elle avait des cheveux gris coupés court et une voix qui passait à travers les murs.",
     "mentions": []
    },
    {
     "id": "c3-b18",
     "text": "— Pétronille Gaudin, dit-elle en broyant la main d’Isaure dans la sienne. On m’appelle la Pétro, tout le monde, même le Régent, quand il vient. Il vient. Tu cherches le vieux. Il est à l’étuve sèche, il cuit. Quarante et un ans qu’il a froid, il dit qu’il a de la réserve à faire. Viens.",
     "mentions": []
    },
    {
     "id": "c3-b19",
     "text": "L’étuve sèche était une petite pièce de bois brûlant où il faisait si chaud que l’air tremblait. Constant Mérel y était assis sur la plus haute banquette, enveloppé dans un drap comme un sénateur des vieux livres, maigre et rouge, et il pelait une orange. Il leva les yeux quand Isaure entra, tout habillée, avec son manteau, son écharpe et ses bottes, et il ne dit rien. Il vit peut-être quelque chose sur son visage. Il posa l’orange à côté de lui.",
     "mentions": []
    },
    {
     "id": "c3-b20",
     "text": "— Votre femme, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c3-b21",
     "text": "Il ne bougea pas.",
     "mentions": []
    },
    {
     "id": "c3-b22",
     "text": "— Elle affleurera dans le mur aval de la glacière basse de la Régence, un pied au-dessus du sol. Le 19 mars, à un jour près. Deux jours après le Vêlage.",
     "mentions": []
    },
    {
     "id": "c3-b23",
     "text": "Pendant un moment il n’y eut que le bruit de l’eau, quelque part derrière la cloison. Puis Constant Mérel se mit à rire. Ce fut d’abord un petit rire dans la gorge, puis un grand rire silencieux qui le plia en deux sur sa banquette, et il riait encore quand les larmes se mirent à couler sur ses joues rouges, et il ne les essuya pas.",
     "mentions": []
    },
    {
     "id": "c3-b24",
     "text": "— La Régence, dit-il enfin. Leur palais. Ils ont bâti leur palais sur elle. Je les ai regardés faire, vous savez, depuis ma fenêtre, en 586. J’avais fait le calcul, moi aussi, à la main, sur le mur, avec un clou. Pas aussi bien que vous. Mais assez bien pour voir où ils posaient leurs fondations. J’ai ri pendant une semaine. Les gardes ont cru que je devenais fou. Ils ont fait venir un médecin.",
     "mentions": []
    },
    {
     "id": "c3-b25",
     "text": "— Elle a calculé son propre chemin, dit Isaure. La colonne de l’affleurement, au Registre. C’est son écriture.",
     "mentions": []
    },
    {
     "id": "c3-b26",
     "text": "Il cessa de rire.",
     "mentions": []
    },
    {
     "id": "c3-b27",
     "text": "— La dernière semaine, dit-il. Dans son lit. Elle ne pouvait plus se lever. Je lui apportais les Tables du Bureau, en cachette, sous mon manteau, et elle faisait des calculs pendant que je lui tenais la lampe. Elle disait que ça l’empêchait de penser à autre chose. Elle a dit : entre la vingtième et la trentième ogive, entre 608 et 615. Elle a dit : tu seras vieux. J’ai dit : je serai là.",
     "mentions": []
    },
    {
     "id": "c3-b28",
     "text": "Isaure s’assit sur la banquette du bas. Elle avait trop chaud dans son manteau, mais elle ne l’enleva pas.",
     "mentions": []
    },
    {
     "id": "c3-b29",
     "text": "— La Couronne est avec elle.",
     "mentions": []
    },
    {
     "id": "c3-b30",
     "text": "— La Couronne est avec elle.",
     "mentions": []
    },
    {
     "id": "c3-b31",
     "text": "— Et vous vous êtes rendu pour qu’on n’ouvre pas son cercueil.",
     "mentions": []
    },
    {
     "id": "c3-b32",
     "text": "Il la regarda avec une espèce d’admiration triste.",
     "mentions": []
    },
    {
     "id": "c3-b33",
     "text": "— Le 5 mars, un jeune inspecteur de la Garde, très têtu, très doué, a demandé au Prieur des Affleureurs l’ouverture des trois cercueils remis depuis la nuit du vol. Il avait compris, ou presque. Le Prieur a refusé : nul ne devance la glace. Le jeune inspecteur a dit qu’il reviendrait avec un ordre du Conseil. Le Conseil n’avait rien d’autre à faire que ça, cette semaine-là : trouver la Couronne. J’ai compté. Deux jours, peut-être trois. Alors je suis allé à la Garde le 6 au matin, et j’ai dit : c’est moi, je l’ai jetée dans le Sillage. On ne demande pas l’ouverture d’un cercueil quand on a un coupable qui avoue.",
     "mentions": []
    },
    {
     "id": "c3-b34",
     "text": "— Quarante et un ans.",
     "mentions": []
    },
    {
     "id": "c3-b35",
     "text": "— Quarante et un ans, dit-il. Mais la glace n’est pas pressée. C’est ce qu’elle a de mieux.",
     "mentions": []
    },
    {
     "id": "c3-b36",
     "text": "— Pourquoi l’avez-vous volée ?",
     "mentions": []
    },
    {
     "id": "c3-b37",
     "text": "Constant Mérel reprit son orange, en détacha un quartier et le lui tendit. Elle ne le prit pas.",
     "mentions": []
    },
    {
     "id": "c3-b38",
     "text": "— Ça, dit-il, c’est une autre question de glace. Plus longue. Je vous la dirai quand vous m’aurez dit oui.",
     "mentions": []
    },
    {
     "id": "c3-b39",
     "text": "— Je n’ai pas dit oui.",
     "mentions": []
    },
    {
     "id": "c3-b40",
     "text": "— Vous êtes venue.",
     "mentions": []
    },
    {
     "id": "c3-b41",
     "text": "Pétronille passa la tête par la porte de l’étuve, rouge de vapeur.",
     "mentions": []
    },
    {
     "id": "c3-b42",
     "text": "— Si vous devez parler de ce que je crois que vous allez parler, dit-elle à voix basse, ce qui, chez elle, était encore une voix que la moitié des bains pouvait entendre, pas ici. J’ai la moitié de la Sûreté dans mes bassins le soir, et l’autre moitié le matin. Ils ne savent pas nager, mais ils savent écouter.",
     "mentions": []
    },
    {
     "id": "c3-b43",
     "text": "Ils se retrouvèrent au Carré d’Attente à l’heure où les lanterniers passaient. Constant avait choisi l’endroit. Il avait traversé la neige jusqu’au centre du Carré, en laissant derrière lui une ligne de pas bien droite, et il attendait là, debout, au milieu de rien, les mains dans les poches de son manteau trop grand. Isaure le rejoignit. Autour d’eux, à cinquante pas dans toutes les directions, il y avait la neige, puis les façades des maisons de quarante et un ans, avec leurs fenêtres qui s’allumaient une à une.",
     "mentions": []
    },
    {
     "id": "c3-b44",
     "text": "— C’est le seul endroit de Demeure où personne ne peut écouter derrière une porte, dit-il. Il n’y a pas de porte. On voit venir les gens de loin, et ils laissent des traces. Clémence et moi, nous venions ici, au printemps 571, quand le lot venait d’être tiré. Il était tout neuf, à la Ligne. Il y avait encore les piquets des Jalonneurs aux quatre coins. Elle disait que c’était la plus belle place de la ville parce qu’on pouvait encore tout y imaginer.",
     "mentions": []
    },
    {
     "id": "c3-b45",
     "text": "— Vous avez un plan.",
     "mentions": []
    },
    {
     "id": "c3-b46",
     "text": "— J’ai quarante et un ans de plans. J’ai eu le temps d’en faire, d’en défaire et d’en refaire. Celui-ci est le bon, parce qu’il est simple. La Pétro a, sous ses bains, une citerne creusée dans la glace, à quatre toises, où elle fait fondre l’eau de ses bassins. Entre sa citerne et la glacière basse de la Régence, il y a — combien ?",
     "mentions": []
    },
    {
     "id": "c3-b47",
     "text": "Isaure réfléchit. Elle avait le plan des creusements dans la tête ; elle l’avait regardé toute la nuit.",
     "mentions": []
    },
    {
     "id": "c3-b48",
     "text": "— Huit toises, à peu près, dit-elle. Mais le cercueil n’est pas encore dans la glacière. Il est dans la glace, derrière le mur, à deux pieds peut-être, du côté de chez vous. Entre la citerne et lui, il y a moins : six toises et demie. Il faudrait que je mesure.",
     "mentions": []
    },
    {
     "id": "c3-b49",
     "text": "— Six toises de glace, dit Constant. Avec de l’eau chaude, la Pétro en fait fondre une toise en deux nuits, peut-être moins. On ne touche pas à la glacière. On ne touche pas à la Régence. On passe par-dessous et par le côté, on va chercher Clémence dans le mur, avant qu’elle y arrive, et on la ramène par le tunnel. Personne ne voit rien. Personne ne sait rien. La Régence descend l’escalier de sa glacière le 19 mars pour accueillir un Remis, et le Remis n’est pas au rendez-vous.",
     "mentions": []
    },
    {
     "id": "c3-b50",
     "text": "— C’est devancer la glace.",
     "mentions": []
    },
    {
     "id": "c3-b51",
     "text": "— C’est aller au-devant d’elle, dit-il. Quand on aime quelqu’un, on va au-devant.",
     "mentions": []
    },
    {
     "id": "c3-b52",
     "text": "— Et après ?",
     "mentions": []
    },
    {
     "id": "c3-b53",
     "text": "— Après, il faut sortir un cercueil des Étuves et lui faire traverser la ville jusqu’au Front sans que personne l’arrête. Et il y a, à Demeure, une seule façon de faire traverser la ville à un cercueil sans que personne l’arrête.",
     "mentions": []
    },
    {
     "id": "c3-b54",
     "text": "— Avec des Affleureurs.",
     "mentions": []
    },
    {
     "id": "c3-b55",
     "text": "— Avec des Affleureurs, dit-il. Clémence aura sa Rendue. Au Front, à la Glissoire, avec le chant et les sonnailles, comme tout le monde. Et moi, j’aurai ce qu’on m’a pris. Et vous, votre part.",
     "mentions": []
    },
    {
     "id": "c3-b56",
     "text": "— Et la Couronne ?",
     "mentions": []
    },
    {
     "id": "c3-b57",
     "text": "— On la vendra, dit-il simplement. Il y a toujours quelqu’un pour acheter une couronne. C’est même à ça qu’on la reconnaît.",
     "mentions": []
    },
    {
     "id": "c3-b58",
     "text": "Il neigeait un peu. Des flocons tombaient dans la lumière des lanternes, au bord du Carré, et semblaient hésiter avant d’entrer dans la nuit du milieu. Isaure pensa à sa maison, qui avait vingt et un jours, et aux soixante écus des Remonteurs, et au volet bleu sous le vert. Elle pensa à une femme de vingt-neuf ans qui calculait dans son lit le jour où quelqu’un viendrait l’accueillir, et qui avait signé d’un sablier. Elle pensa, surtout, sans pouvoir s’en empêcher, qu’un tunnel de six toises dans de la vieille glace bleue, à quatre toises sous une ville qui descend d’un pas par jour, visant un cercueil qui monte d’un pouce par semaine, c’était le plus beau problème de glace qu’on lui poserait jamais.",
     "mentions": []
    },
    {
     "id": "c3-b59",
     "text": "Elle s’entendit dire :",
     "mentions": []
    },
    {
     "id": "c3-b60",
     "text": "— Je connais un Affleureur.",
     "mentions": []
    },
    {
     "id": "c3-b61",
     "text": "Constant Mérel ne sourit pas. Il ôta son chapeau, lentement, et le garda contre sa poitrine, comme on fait dans la rue quand passe un Remis.",
     "mentions": []
    },
    {
     "id": "c3-b62",
     "text": "Elle rentra chez elle tard. Au Dernier Rang, il n’y avait plus une lumière ; la mer, en bas, faisait un bruit de draps qu’on secoue. Quelqu’un était assis sur son seuil. D’abord elle crut que c’était encore Constant, qui l’aurait devancée par un autre chemin ; puis elle reconnut la pèlerine qui avait été noire et l’odeur de goudron de la pipe, et elle s’arrêta à trois pas.",
     "mentions": []
    },
    {
     "id": "c3-b63",
     "text": "— Cinquante-huit, an 571, dit Firmin Vauclair sans se lever. Vous signez toujours tout, mademoiselle Sorbier ?",
     "mentions": []
    },
    {
     "id": "c3-b64",
     "text": "Elle ne répondit pas. Il frappa sa pipe contre la pierre du seuil pour la vider, avec précaution, comme on frappe à une porte.",
     "mentions": []
    },
    {
     "id": "c3-b65",
     "text": "— Le concierge du Bureau me doit une vieille faveur, dit-il. Il lit le cahier des consultations pour moi depuis vingt ans. En vingt ans, personne n’avait ouvert cette page. Moi, je l’ai ouverte le 5 mars 571.",
     "mentions": []
    },
    {
     "id": "c3-b66",
     "text": "Il se leva, avec une lenteur de montagne, s’épousseta et lui laissa la place.",
     "mentions": []
    },
    {
     "id": "c3-b67",
     "text": "— Bonne nuit, mademoiselle Sorbier. Vous devriez apprendre à ne pas signer.",
     "mentions": []
    }
   ]
  },

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
