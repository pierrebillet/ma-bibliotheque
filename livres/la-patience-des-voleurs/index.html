    },
    {
     "id": "c10-b26",
     "text": "— Je veux être le premier à la toucher, dit-il. Vous me l’avez promis.",
     "mentions": []
    },
    {
     "id": "c10-b27",
     "text": "— Personne ne vous l’a promis, dit Pétronille.",
     "mentions": []
    },
    {
     "id": "c10-b28",
     "text": "— Alors promettez-le-moi maintenant.",
     "mentions": []
    },
    {
     "id": "c10-b29",
     "text": "À minuit, au-dessus d’eux, dans la Régence, on servait les sorbets. Ils ne pouvaient pas l’entendre, sous cinq toises de glace ; mais Isaure regarda sa montre, qui avait été celle de sa mère et qui retardait de quatre minutes, exprès, et elle dit :",
     "mentions": [
      "la-regence"
     ]
    },
    {
     "id": "c10-b30",
     "text": "— C’est l’heure.",
     "mentions": []
    },
    {
     "id": "c10-b31",
     "text": "Pétronille prit la lance.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c10-b32",
     "text": "Il restait six pouces. Six pouces de glace entre le fond du tunnel et le bois, une peau de glace bleue à travers laquelle on voyait maintenant, à la lueur des lanternes, non plus une ombre, mais les planches elles-mêmes, les ferrures des coins, la ligne noire d’un joint. Pétronille fit fondre la peau comme on retire un pansement, lentement, en tournant la lance, en arrêtant la pompe toutes les dix secondes pour regarder. Tobie pompait en chantant tout bas. Isaure tenait la lanterne et mesurait. L’eau coulait autour de leurs genoux vers la citerne, et de la citerne vers le moulin, qui grondait sous leurs pieds.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal",
      "moulins"
     ]
    },
    {
     "id": "c10-b33",
     "text": "À minuit quarante, la lance toucha le bois.",
     "mentions": []
    },
    {
     "id": "c10-b34",
     "text": "Ce fut un petit bruit, presque rien, un bruit d’eau sur une planche. Pétronille arrêta la pompe. Personne ne bougea. Puis Isaure se retourna vers l’entrée du tunnel, et elle appela :",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c10-b35",
     "text": "— Constant.",
     "mentions": []
    },
    {
     "id": "c10-b36",
     "text": "Il vint. Il vint à quatre pattes, sur la planche de la sortie, dans l’eau, tout le long du tunnel, avec ses deux couvertures qui traînaient derrière lui, et il lui fallut longtemps, et personne ne l’aida parce qu’il avait dit qu’il voulait être le premier et que ce n’était pas une chose qu’on fait à moitié. Quand il arriva au fond, Pétronille s’écarta pour lui laisser la place. Il ôta son gant. Il posa la main à plat sur le bois mouillé, noirci, glacé, qui sortait de la glace comme le flanc d’un navire échoué, et il laissa sa main là.",
     "mentions": [
      "constant-merel",
      "clemence-merel"
     ]
    },
    {
     "id": "c10-b37",
     "text": "— Bonsoir, dit-il.",
     "mentions": []
    },
    {
     "id": "c10-b38",
     "text": "Puis, plus bas, si bas qu’Isaure ne fut jamais sûre de l’avoir entendu :",
     "mentions": []
    },
    {
     "id": "c10-b39",
     "text": "— J’ai un peu tardé.",
     "mentions": []
    },
    {
     "id": "c10-b40",
     "text": "Ils mirent deux heures à dégager le cercueil. C’était un travail de patience et de précision, et Isaure s’aperçut qu’elle n’avait jamais rien fait qui lui ressemblât davantage. Il fallait faire fondre la glace autour du bois sans jamais toucher le bois avec la lance, parce que le bois, gorgé de glace depuis tant d’années, aurait éclaté au premier jet comme une faïence qu’on ébouillante ; il fallait laisser dessous un lit de glace pour le soutenir, puis faire fondre ce lit pouce par pouce en glissant à mesure la planche de la sortie sous le cercueil ; il fallait surveiller l’eau, qui ruisselait de partout. Pétronille maniait la lance comme une brodeuse. Constant, assis dans l’eau contre la paroi, donnait des indications d’une voix de plus en plus faible — « Un pouce à gauche. Laissez le coin. Là. Là. » — et c’étaient des indications de Remonteur, parfaites, qui savaient où un bois porte et où il cède.",
     "mentions": [
      "petronille-gaudin",
      "remontee"
     ]
    },
    {
     "id": "c10-b41",
     "text": "À deux heures et demie, le cercueil de Clémence Mérel reposait sur la planche de la sortie, libre, entièrement hors de la glace, dans une niche ruisselante où la lumière des lanternes faisait danser l’eau au plafond. Il était plus petit qu’Isaure ne l’avait cru. Le couvercle était intact. À la tête, il y avait la plaque de cuivre, verdie, où l’on lisait, gravé à la main : « C. M. — 571 — 58 », et en dessous, gravé plus maladroitement, par une main qui n’avait pas l’habitude du cuivre, un petit sablier.",
     "mentions": [
      "clemence-merel",
      "registre-des-remis"
     ]
    },
    {
     "id": "c10-b42",
     "text": "— C’est moi qui l’ai gravé, dit Constant. La nuit de la veillée. Avec un clou.",
     "mentions": []
    },
    {
     "id": "c10-b43",
     "text": "Ce fut à ce moment-là que la glace se mit à pleurer.",
     "mentions": []
    },
    {
     "id": "c10-b44",
     "text": "Isaure le vit avant de l’entendre. Dans la paroi du fond de la niche, du côté de la glacière basse, là où il ne restait plus, entre eux et le mur de la Régence, qu’un pied et demi de glace, une goutte perla. Puis une autre. Puis un filet d’eau se mit à couler, le long de la paroi, depuis un point qu’elle ne voyait pas. Elle leva la lanterne. La glace, de ce côté-là, était devenue grise et spongieuse, comme le bouchon du moulin ; la chaleur de deux heures de lance, de quinze nuits de lance, l’avait traversée tout entière. Et au-delà, dans la glace grise, il y avait une lumière. Pas la leur. Une lumière jaune, mouvante, qui venait de l’autre côté.",
     "mentions": [
      "glaciere-basse"
     ]
    },
    {
     "id": "c10-b45",
     "text": "Quelqu’un était dans la glacière basse.",
     "mentions": [
      "glaciere-basse"
     ]
    },
    {
     "id": "c10-b46",
     "text": "— Les lanternes, dit Isaure tout bas. Masquez les lanternes.",
     "mentions": []
    },
    {
     "id": "c10-b47",
     "text": "Trop tard. De l’autre côté, une voix d’enfant cria quelque chose qu’ils ne comprirent pas, puis cria encore, et ils comprirent : « Le mur ! Le mur pleure ! » Et il y eut un bruit de pas qui s’enfuyaient, un seau renversé, une échelle qu’on escaladait, et plus rien.",
     "mentions": [
      "glaciere-basse"
     ]
    },
    {
     "id": "c10-b48",
     "text": "— Un marmiton, dit Pétronille. Ils ont dû redemander des sorbets. Nom d’un sérac. Quelqu’un à la Régence a redemandé des sorbets.",
     "mentions": []
    },
    {
     "id": "c10-b49",
     "text": "— La sortie, dit Isaure. Maintenant.",
     "mentions": []
    },
    {
     "id": "c10-b50",
     "text": "Ils tirèrent. Constant avait scellé le palan dans la paroi de la citerne à l’entrée du tunnel, et la corde courait tout le long du boyau jusqu’à la planche. Pétronille et Tobie halaient, Isaure guidait la planche à la main dans le tunnel, à reculons, pour qu’elle ne heurte pas les parois, et Constant, qui s’était traîné jusqu’à l’entrée, comptait les tours de palan d’une voix qui n’était plus qu’un souffle. Le cercueil glissait sur ses patins de fer avec un chuintement doux. Un pied. Un autre. Isaure passait devant le petit Profond à la clochette et, pour la première fois, elle ne ralentit pas.",
     "mentions": [
      "constant-merel",
      "remontee",
      "profonds"
     ]
    },
    {
     "id": "c10-b51",
     "text": "Derrière eux, au fond du tunnel, il y eut un craquement, puis un bruit de chute, puis des voix d’hommes, et une lumière très vive. Isaure se retourna. La paroi grise avait cédé. À la place, il y avait un trou, gros comme une tête, par où entrait un courant d’air froid qui sentait le vin et le beurre, et dans le trou, derrière une lanterne qu’on levait, il y avait un visage.",
     "mentions": []
    },
    {
     "id": "c10-b52",
     "text": "C’était celui de l’Intendante Laroque. Elle était en robe de bal, une robe grise d’une soie si simple qu’elle devait coûter une maison, avec une cape jetée dessus à la hâte, et elle regardait à travers le trou dans la glace, le long du tunnel, la lanterne d’Isaure, le cercueil sur sa planche, et Isaure derrière le cercueil. Pendant un instant, ni l’une ni l’autre ne dit rien.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c10-b53",
     "text": "— Un pied par nuit, dit enfin l’Intendante.",
     "mentions": []
    },
    {
     "id": "c10-b54",
     "text": "— Je vous ai menti, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c10-b55",
     "text": "— Je le vois. Je viens de le mesurer.",
     "mentions": []
    },
    {
     "id": "c10-b56",
     "text": "Elle regarda encore, un instant, le tunnel tout entier, lisse, bleu, régulier, montant d’un pied par toise, comme Isaure l’avait voulu.",
     "mentions": []
    },
    {
     "id": "c10-b57",
     "text": "— C’est un très beau tunnel, dit-elle.",
     "mentions": []
    },
    {
     "id": "c10-b58",
     "text": "Puis elle se retourna vers quelqu’un derrière elle et dit, sans hausser la voix :",
     "mentions": []
    },
    {
     "id": "c10-b59",
     "text": "— Élargissez ce trou. Sergent, envoyez six hommes garder toutes les portes des Étuves. Toutes. Personne ne sort.",
     "mentions": [
      "la-garde",
      "les-etuves"
     ]
    },
    {
     "id": "c10-b60",
     "text": "Les coups de hache commencèrent aussitôt contre la glace grise. Isaure tira la planche de toutes ses forces. Le cercueil arriva dans la citerne. Constant tendit la main et la posa dessus, et ils virent qu’il ne pourrait pas se relever.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c10-b61",
     "text": "— Laissez-moi, dit-il. Emportez-la.",
     "mentions": []
    },
    {
     "id": "c10-b62",
     "text": "— Non, dit Pétronille, et elle le prit sous un bras comme un sac de farine et le hissa sur le cercueil, en travers, les jambes pendantes. Tu la tiens. Moi, je vous tiens tous les deux.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c10-b63",
     "text": "Elle se baissa, glissa ses épaules sous l’arrière de la planche comme une Fendeuse glisse ses épaules sous un bloc de glace de deux cents livres, cala ses mains, et se releva. Tobie prit l’avant. Et ils montèrent l’escalier raide de la citerne, l’une portant, l’autre tirant, avec le cercueil entre eux et le vieil homme couché dessus comme un gisant, pendant qu’Isaure, derrière, poussait et tenait la lanterne, et que, dans le tunnel, les haches cognaient.",
     "mentions": [
      "fendeurs"
     ]
    },
    {
     "id": "c10-b64",
     "text": "On ne pouvait sortir de la chaufferie que par les bains.",
     "mentions": []
    },
    {
     "id": "c10-b65",
     "text": "Ils débouchèrent dans le grand bassin au milieu d’une chanson. Cent personnes, peut-être, nues ou à peu près, dans une vapeur si épaisse qu’on voyait les lanternes comme des lunes à travers la brume, chantaient à pleine voix « La maison du bord de l’eau », qui est la plus vieille chanson de Vêlage et la plus bête. Au premier rang, dans l’eau jusqu’à la poitrine, deux officiers de la Garde en congé battaient la mesure avec leurs bocks. Pétronille entra dans la vapeur, le cercueil sur les épaules et le voleur de la Couronne couché dessus, suivie d’un novice des Affleureurs et d’une Jalonneuse à l’écharpe rouge et blanche, et la chanson s’arrêta.",
     "mentions": [
      "les-etuves",
      "la-garde"
     ]
    },
    {
     "id": "c10-b66",
     "text": "Elle ne s’arrêta pas d’un coup. Elle s’effilocha. D’abord ceux du bord, qui avaient vu ; puis ceux qui avaient vu ceux du bord ; puis tout le monde. En quelques secondes il n’y eut plus, sous la verrière embuée, que le bruit de l’eau dans les rigoles de cuivre et celui des sabots de Pétronille sur les dalles.",
     "mentions": [
      "petronille-gaudin"
     ]
    },
    {
     "id": "c10-b67",
     "text": "Alors Tobie dégagea la sonnaille de sa couverture, la prit par la courroie, jamais par la cloche, et la fit sonner.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c10-b68",
     "text": "Elle sonna juste. Ce fut un son grave, rond, qui remplit la salle, rebondit sous la verrière et revint, et Isaure le sentit dans ses dents. Et Tobie, en plein milieu des Étuves de la Veine, entouré de cent baigneurs nus et de deux officiers de la Garde, se mit à chanter le chant de Rendue.",
     "mentions": [
      "tobie-arnal",
      "rendue"
     ]
    },
    {
     "id": "c10-b69",
     "text": "Ils se levèrent tous. Ceux qui étaient dans l’eau se levèrent dans l’eau, ceux qui étaient sur les bancs se levèrent sur les bancs. Ils n’avaient pas de chapeaux à ôter ; ils se tinrent droits, les mains le long du corps, et un vieil homme au bord du bassin, qui avait une serviette sur l’épaule, la prit et la posa sur son cœur. Les deux officiers de la Garde avaient posé leurs bocks. Pétronille traversa la salle au pas, sans hâte, et personne ne s’écarta, parce que personne n’en eut besoin : on lui faisait place depuis longtemps.",
     "mentions": [
      "rendue",
      "la-garde"
     ]
    },
    {
     "id": "c10-b70",
     "text": "La porte de derrière donnait sur la ruelle. Firmin l’avait ouverte. La luge de veille attendait sur la neige, et derrière la luge, à l’angle de la Rue Longue, il y avait six gardes de la Sûreté qui arrivaient au pas de course, sabre au côté, avec à leur tête un sergent à moustache de phoque.",
     "mentions": [
      "firmin-vauclair",
      "la-garde"
     ]
    },
    {
     "id": "c10-b71",
     "text": "Pétronille et Tobie posèrent le cercueil sur la luge. Constant glissa à côté, dans la neige, et Isaure le releva et l’assit à la tête du cercueil, contre la plaque, les jambes dans les couvertures. Tobie noua les cordes de traction autour de sa taille. Les gardes n’étaient plus qu’à dix pas.",
     "mentions": [
      "petronille-gaudin",
      "constant-merel"
     ]
    },
    {
     "id": "c10-b72",
     "text": "Firmin Vauclair s’avança au milieu de la ruelle, entre la luge et les gardes. Il ne se pressa pas. Il avait sa pipe éteinte dans une main, et de l’autre il redressa la plaque épinglée sur sa pèlerine, pour qu’on la vît bien.",
     "mentions": [
      "firmin-vauclair",
      "la-garde"
     ]
    },
    {
     "id": "c10-b73",
     "text": "— Sergent Morvan, dit-il.",
     "mentions": [
      "sergent-morvan"
     ]
    },
    {
     "id": "c10-b74",
     "text": "Le sergent s’arrêta si net que les deux gardes qui le suivaient lui rentrèrent dans le dos.",
     "mentions": [
      "la-garde"
     ]
    },
    {
     "id": "c10-b75",
     "text": "— Inspecteur ?",
     "mentions": []
    },
    {
     "id": "c10-b76",
     "text": "— Tu vas ôter ton casque, Morvan, et tu vas le mettre contre ta poitrine, comme je te l’ai appris. Et tes hommes aussi. Et vous allez regarder passer ce Remis.",
     "mentions": []
    },
    {
     "id": "c10-b77",
     "text": "— Inspecteur, l’Intendante a dit…",
     "mentions": []
    },
    {
     "id": "c10-b78",
     "text": "— L’Intendante a dit de garder les portes. Tu les gardes. Personne n’a dit d’arrêter une Rendue. Personne ne peut le dire. Tu le sais aussi bien que moi, c’est moi qui te l’ai appris, et avant moi ton père, qui était sergent aussi et qui renversait le café aussi.",
     "mentions": [
      "hermine-laroque",
      "rendue"
     ]
    },
    {
     "id": "c10-b79",
     "text": "Le sergent Morvan regarda le vieil inspecteur. Il regarda le cercueil sur la luge, et le vieil homme assis à la tête du cercueil, et le novice aux oreilles rouges qui tenait la sonnaille par la courroie. Il regarda la Rue Longue, derrière lui, où les gens du Vêlage, avec leurs couronnes de papier et leurs bols de vin chaud, s’étaient arrêtés de danser et regardaient.",
     "mentions": [
      "sergent-morvan",
      "velage"
     ]
    },
    {
     "id": "c10-b80",
     "text": "Tobie fit sonner la sonnaille, et chanta.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c10-b81",
     "text": "Et le long de la Rue Longue, d’un bout à l’autre de ce qu’on pouvait en voir, les gens ôtèrent leurs chapeaux. Ils ôtèrent leurs bonnets de laine, leurs toques de fourrure, et les enfants ôtèrent leurs couronnes de papier doré, et tout le monde se tut, et on n’entendit plus que la sonnaille et le chant, et, très loin, du côté du Front, la mer.",
     "mentions": [
      "rendue",
      "le-front"
     ]
    },
    {
     "id": "c10-b82",
     "text": "Le sergent Morvan ôta son casque et le mit contre sa poitrine.",
     "mentions": [
      "sergent-morvan"
     ]
    },
    {
     "id": "c10-b83",
     "text": "— Nul n’arrête un Remis, dit-il à ses hommes, qui ôtèrent les leurs.",
     "mentions": []
    },
    {
     "id": "c10-b84",
     "text": "La luge se mit en mouvement. Tobie tirait devant, la sonnaille à la main ; Pétronille tirait à côté de lui, une corde sur l’épaule ; Isaure marchait à côté du cercueil, une main sur le bois ; Firmin fermait la marche, sa plaque sur la poitrine. Ils passèrent entre les gardes tête nue et entrèrent dans la Rue Longue. La foule s’ouvrit devant eux.",
     "mentions": [
      "petronille-gaudin",
      "tobie-arnal"
     ]
    },
    {
     "id": "c10-b85",
     "text": "Ils avaient fait vingt pas quand la porte principale de la Régence s’ouvrit, de l’autre côté de la rue, et que l’Intendante Laroque en sortit, dans sa robe grise et sa cape, avec quatre gardes derrière elle. Elle traversa la rue. La foule, qui s’était refermée derrière la luge, s’ouvrit pour elle aussi, à regret. Elle s’arrêta à trois pas de Firmin.",
     "mentions": [
      "hermine-laroque",
      "la-regence"
     ]
    },
    {
     "id": "c10-b86",
     "text": "— Ce cercueil contient un bien de l’État, dit-elle, assez bas pour que seuls Morvan et ceux de la luge l’entendent. Sergent, arrêtez cette luge.",
     "mentions": []
    },
    {
     "id": "c10-b87",
     "text": "Morvan ne bougea pas. Il tenait son casque contre sa poitrine et regardait droit devant lui, comme un homme qui attend que passe une averse.",
     "mentions": [
      "sergent-morvan"
     ]
    },
    {
     "id": "c10-b88",
     "text": "— Ce cercueil contient une femme, Hermine, dit Firmin. Le reste, on le verra à la Glissoire. C’est la loi. C’est même la seule loi que tout le monde respecte, dans cette ville. Tu devrais le savoir : c’est la première chose que je t’ai apprise.",
     "mentions": [
      "la-glissoire",
      "clemence-merel"
     ]
    },
    {
     "id": "c10-b89",
     "text": "L’Intendante regarda son ancien maître. Elle regarda la foule tête nue qui attendait, tout le long de la Rue Longue, dans les lanternes de papier. Elle regarda Constant, assis contre la plaque, les yeux fermés, une main sur le couvercle. Elle regarda Isaure. Et Isaure vit quelque chose bouger dans ce visage de glace sculptée — pas grand-chose, un pli au coin de la bouche, qui ressemblait à de la fatigue ou à de l’admiration, et qui était peut-être les deux.",
     "mentions": [
      "constant-merel",
      "hermine-laroque"
     ]
    },
    {
     "id": "c10-b90",
     "text": "— À la Glissoire, alors, dit l’Intendante Laroque.",
     "mentions": []
    },
    {
     "id": "c10-b91",
     "text": "Elle recula d’un pas. Puis elle ajouta, pour Isaure seule :",
     "mentions": []
    },
    {
     "id": "c10-b92",
     "text": "— Le Prieur y sera, mademoiselle Sorbier. Moi aussi. Le droit de visage n’a jamais protégé une couronne.",
     "mentions": [
      "droit-de-visage",
      "couronne-de-givre"
     ]
    }
   ]
  },
  {
   "id": "chapitre-11",
   "number": 11,
   "title": "La Glissoire",
   "image": "images/chapter-11.webp",
   "alt": "La nuit, une procession traverse une place pleine de monde éclairée de lanternes de papier colorées : un novice encapuchonné tire une luge portant un cercueil et fait sonner une cloche, un vieil homme est assis à la tête du cercueil, une jeune femme marche à côté.",
   "visualDescription": "Nuit de fête, plan large. Une grande place carrée se remplit d’une foule silencieuse et tête nue ; lanternes de papier rouges, jaunes et vertes sur des perches, enfants avec des couronnes de papier doré à la main. Au centre, une luge basse de bois noir porte un cercueil ; Tobie, grand, blond, en habit gris à capuchon, la tire et tient une cloche de bronze par sa courroie ; une grande femme en tablier tire à côté de lui. Constant est assis à la tête du cercueil, enveloppé de couvertures, une main sur la plaque. Isaure marche à côté, une main sur le bois. Derrière, d’autres luges et lanternes. Recueillement, émotion collective.",
   "blocks": [
    {
     "id": "c11-b01",
     "text": "Ils descendirent la Rue Longue au pas des Rendues, qui est le pas de la glace quand elle se presse, dans le même ordre. Tobie chantait, maintenant. Constant, assis à la tête du cercueil, enveloppé dans ses couvertures, une main sur la plaque de cuivre, avait fermé les yeux. Et derrière Firmin, à vingt pas, parce qu’on n’approche pas une Rendue de plus près quand on n’en est pas, marchait l’Intendante de la Sûreté dans sa cape grise, avec ses quatre gardes tête nue.",
     "mentions": [
      "rendue",
      "tobie-arnal",
      "petronille-gaudin",
      "constant-merel",
      "firmin-vauclair",
      "hermine-laroque"
     ]
    },
    {
     "id": "c11-b02",
     "text": "Il était trois heures du matin, et la ville dansait encore. À chaque croisement, sous les lanternes de papier, il y avait des tréteaux, des vielles, des gens qui riaient ; et à chaque croisement, quand la sonnaille arrivait, les vielles s’arrêtaient, les rires s’arrêtaient, et les gens ôtaient leurs chapeaux et regardaient passer la luge. Puis, quand la luge était passée, ils ne reprenaient pas leur danse. Ils suivaient la luge. Isaure ne sut jamais comment la nouvelle avait couru devant eux, plus vite qu’eux, de rue en rue, jusqu’au bas de la ville ; elle l’entendit seulement courir, en murmures, dans la foule qui grossissait derrière : « La femme du voleur. » « La Jalonneuse. » « Celle de 571. » Et, plus bas, comme une chose qu’on n’ose pas dire : « La Couronne. »",
     "mentions": [
      "demeure",
      "couronne-de-givre",
      "vol-de-571"
     ]
    },
    {
     "id": "c11-b03",
     "text": "À la trentième ogive, une autre Rendue sortit d’une rue transversale, avec sa luge, son cercueil et ses Affleureurs, et prit la Rue Longue derrière eux. À la trente-troisième, une autre encore. C’était la Grande Rendue du Vêlage : le matin du Vêlage, tous les Remis qui avaient affleuré dans la ville pendant la semaine descendaient ensemble vers le Front, de partout à la fois, pour être rendus avec le Dernier Rang. Isaure l’avait vue chaque année de sa vie, depuis la fenêtre de sa maison. Elle ne l’avait jamais vue de l’intérieur. Il y eut bientôt, derrière eux, dans la Rue Longue, une file de luges et de lanternes qui descendait la ville comme une rivière, et le chant de dix Affleureurs, et dix sonnailles qui ne sonnaient pas ensemble et qui, peu à peu, se mirent à sonner ensemble.",
     "mentions": [
      "rendue",
      "affleureurs",
      "ogives",
      "le-front"
     ]
    },
    {
     "id": "c11-b04",
     "text": "À la quarante et unième ogive, Constant ouvrit les yeux.",
     "mentions": [
      "constant-merel",
      "ogives"
     ]
    },
    {
     "id": "c11-b05",
     "text": "— Par le Carré, dit-il.",
     "mentions": []
    },
    {
     "id": "c11-b06",
     "text": "Tobie tourna sans demander pourquoi. La luge quitta la Rue Longue et entra dans la neige vierge du Carré d’Attente, et la neige était si profonde que les patins s’y enfoncèrent, et Pétronille dut tirer à deux mains. Ils traversèrent le Carré en diagonale, jusqu’au milieu, et au milieu Constant fit signe d’arrêter. Il regarda autour de lui. Isaure regarda aussi. Derrière eux, la foule qui les suivait était entrée dans le Carré. Elle entrait encore. Elle entrait de partout, par la Rue Longue et par les rues de traverse, avec ses lanternes de papier et ses couronnes dorées, et elle se répandait sur la neige, et elle remplissait le Carré d’Attente comme l’eau remplit une écluse. Pour la première fois depuis quarante et un ans, il n’y avait plus, sur le lot réservé au palais de la Margravine, un seul pas de neige vide.",
     "mentions": [
      "carre-d-attente",
      "constant-merel"
     ]
    },
    {
     "id": "c11-b07",
     "text": "— Voilà, dit Constant.",
     "mentions": []
    },
    {
     "id": "c11-b08",
     "text": "Il referma les yeux, et Tobie fit sonner la sonnaille, et ils repartirent.",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c11-b09",
     "text": "À la quarante-neuvième ogive, la porte de l’Hôtel de Frimas était ouverte. Il n’y avait pas de lumière à l’intérieur. Sur le perron, en haut du double escalier, une petite femme en toque de fourrure et en manteau noir attendait, les mains croisées sur un balai qu’elle tenait comme une crosse. Quand la luge passa devant le perron, elle descendit les marches, posa son balai contre la rampe, et prit place derrière la luge, à côté d’Isaure, sans un mot. La foule s’écarta pour elle. On l’avait reconnue. Isaure l’entendit, derrière, qui la reconnaissait, en un murmure qui courait d’un bout à l’autre de la Rue Longue : « La Margravine. La Margravine en attente. »",
     "mentions": [
      "hotel-de-frimas",
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c11-b10",
     "text": "Mahaut de Frimas marcha jusqu’au Front, les yeux sur le cercueil, sans regarder personne.",
     "mentions": [
      "mahaut-de-frimas",
      "le-front"
     ]
    },
    {
     "id": "c11-b11",
     "text": "Le Front, le matin du Vêlage, était noir de monde. Il y avait là toute la ville, ou ce qu’il en restait après la nuit de fête, massée derrière la fente du Dernier Rang, sur la glace sûre, dans l’odeur de la mer et du vin chaud. Il y avait les familles du Dernier Rang, chacune avec son seuil posé sur une luge, prêt pour la Glissoire. Il y avait les Remonteurs de la Corporation, avec leurs cordages et leur grande planche, qui ne savaient plus très bien pourquoi ils étaient venus. Il y avait les Jalonneurs du Bureau, en manteau noir, avec la Grande Lunette démontée sur un traîneau pour viser le Front à l’aube, et Maître Bastide au milieu d’eux, droit comme un jalon neuf. Il y avait, sur le quai de roche de la Paroi Sud, au sommet de la Glissoire — un grand toboggan de mélèze qui descendait en pente douce jusqu’à la mer, trente toises plus bas —, le Prieur des Affleureurs, un vieillard en habit gris, sa grande sonnaille à la ceinture, entouré de ses frères.",
     "mentions": [
      "le-front",
      "remontee",
      "bureau-des-jalons",
      "onesime-bastide",
      "la-glissoire",
      "affleureurs"
     ]
    },
    {
     "id": "c11-b12",
     "text": "Et au-delà de la fente, seule sur la dalle blanche, au bord de tout, il y avait la maison d’Isaure, avec ses neuf fenêtres allumées.",
     "mentions": [
      "maison-sorbier"
     ]
    },
    {
     "id": "c11-b13",
     "text": "La foule la regardait. Isaure entendit une femme demander à sa voisine qui avait eu l’idée d’allumer une maison qui allait partir, et la voisine répondre qu’on n’avait pas vu ça depuis sa grand-mère, et qu’à l’époque on en avait parlé pendant dix ans.",
     "mentions": []
    },
    {
     "id": "c11-b14",
     "text": "La luge s’arrêta au pied de la Glissoire. Tobie cessa de sonner. Le Prieur descendit trois marches du quai de roche, et regarda le cercueil, et le vieil homme assis dessus, et la sonnaille dans la main du novice. C’est sur la sonnaille que son regard s’arrêta.",
     "mentions": [
      "la-glissoire",
      "affleureurs"
     ]
    },
    {
     "id": "c11-b15",
     "text": "— C’est la sonnaille de frère Hilaire, dit-il.",
     "mentions": []
    },
    {
     "id": "c11-b16",
     "text": "— Oui, mon père, dit Tobie.",
     "mentions": []
    },
    {
     "id": "c11-b17",
     "text": "— Qui te l’a donnée ?",
     "mentions": []
    },
    {
     "id": "c11-b18",
     "text": "— Personne, mon père. Je l’ai prise.",
     "mentions": []
    },
    {
     "id": "c11-b19",
     "text": "Le Prieur ne dit rien. Tobie avala sa salive, et Isaure vit ses oreilles devenir écarlates, et elle l’entendit dire, très vite et très distinctement, une leçon apprise dans la nuit :",
     "mentions": [
      "tobie-arnal"
     ]
    },
    {
     "id": "c11-b20",
     "text": "— Remis cinquante-huit de l’an 571. Clémence Mérel, Jalonneuse. Elle devait affleurer le 19 dans la glacière basse de la Régence. On l’a devancée. C’est moi qui l’ai devancée, avec d’autres, mais c’est moi qui l’ai portée. La Régence voulait l’ouvrir dans sa cave. Je n’ai pas voulu qu’elle affleure seule.",
     "mentions": [
      "clemence-merel",
      "glaciere-basse",
      "devancer-la-glace",
      "la-regence"
     ]
    },
    {
     "id": "c11-b21",
     "text": "Le Prieur regarda le novice. Puis il regarda l’Intendante, qui était arrivée derrière la foule et qui se tenait à dix pas, droite et grise.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c11-b22",
     "text": "— Nous parlerons de la sonnaille de frère Hilaire plus tard, dit-il enfin. Pour l’instant, tiens-la par la courroie ; tu la tiens par la cloche. Qui demande le droit de visage ?",
     "mentions": [
      "droit-de-visage"
     ]
    },
    {
     "id": "c11-b23",
     "text": "Constant Mérel se leva.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c11-b24",
     "text": "Isaure ne sut jamais comment il y arriva. Il repoussa ses couvertures, posa les deux mains sur le couvercle du cercueil, et il se leva, et il resta debout, pâle, maigre, sans chapeau, dans le vent froid qui venait de la mer, et sa voix, quand il parla, était celle qu’il avait eue le premier soir sur le tas de chevrons des Guérin, courtoise et tranquille.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c11-b25",
     "text": "— Moi, dit-il. Constant Mérel. Son mari.",
     "mentions": []
    },
    {
     "id": "c11-b26",
     "text": "— Madame l’Intendante, dit le Prieur sans se retourner, vous avez quelque chose à dire ?",
     "mentions": []
    },
    {
     "id": "c11-b27",
     "text": "— Je m’oppose à…",
     "mentions": []
    },
    {
     "id": "c11-b28",
     "text": "— Vous vous opposerez après le visage, madame. Avant le visage, personne ne s’oppose à rien. C’est dans la Règle. Article douze.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c11-b29",
     "text": "L’Intendante se tut.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c11-b30",
     "text": "— Ouvrez, dit le Prieur.",
     "mentions": []
    },
    {
     "id": "c11-b31",
     "text": "Tobie posa la sonnaille dans la neige, par la courroie. Il prit le levier que Pétronille lui tendait. Il glissa la lame sous le couvercle, à la tête, là où Constant avait gravé le sablier, et il pesa. Les vieux clous sortirent du bois sans un bruit, comme s’ils n’attendaient que ça. Tobie souleva le couvercle. Pétronille l’aida à le poser sur le côté. Et Constant se pencha, et Isaure leva la lanterne.",
     "mentions": [
      "tobie-arnal",
      "petronille-gaudin"
     ]
    },
    {
     "id": "c11-b32",
     "text": "Clémence Mérel avait vingt-neuf ans.",
     "mentions": [
      "clemence-merel"
     ]
    },
    {
     "id": "c11-b33",
     "text": "Elle ne ressemblait pas à une morte. Elle ressemblait à quelqu’un qui dort dans le froid et qui va avoir froid en se réveillant. Elle était pâle comme la glace d’où elle sortait, et un peu de givre lui blanchissait les cils. Ses cheveux étaient noirs, tressés, posés sur l’épaule. Ses mains étaient croisées sur sa poitrine, autour d’un petit fer à marquer de Jalonneuse dont la tête était un sablier. Et sur son front, posée parfaitement droite, il y avait la Couronne de Givre.",
     "mentions": [
      "clemence-merel",
      "couronne-de-givre"
     ]
    },
    {
     "id": "c11-b34",
     "text": "C’était un simple bandeau d’or blanc, haut de deux doigts, sans autre ornement que sept pierres claires, si claires qu’on aurait dit de la glace qui ne fondait pas. La lanterne d’Isaure y alluma sept petites flammes. Autour d’elle, dans la foule immense, elle entendit le silence se faire, puis un murmure qui roula jusqu’au bout de la foule, puis de nouveau le silence, un silence si complet qu’on entendit, en bas, la mer battre contre le pied du Front.",
     "mentions": [
      "le-front"
     ]
    },
    {
     "id": "c11-b35",
     "text": "Constant Mérel regardait sa femme. Il avait soixante-huit ans ; elle en avait vingt-neuf. La glace n’avait rien pris et rien donné. Il la regarda longtemps, sans toucher à rien, les deux mains sur le bord du cercueil, et quand il parla, ce fut si doucement que seuls l’entendirent Isaure, Pétronille, Tobie et le Prieur.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c11-b36",
     "text": "— Tu vois, dit-il. J’étais là.",
     "mentions": []
    },
    {
     "id": "c11-b37",
     "text": "Puis il sourit, du sourire qu’il avait eu dans l’étuve sèche en apprenant où affleurerait sa femme, et il ajouta, pour Isaure :",
     "mentions": [
      "affleurement"
     ]
    },
    {
     "id": "c11-b38",
     "text": "— Elle voulait savoir si la Couronne lui allait. Je l’ai posée droite. Elle aurait détesté la savoir de travers.",
     "mentions": []
    },
    {
     "id": "c11-b39",
     "text": "D’aplomb, pensa Isaure. Elle ne le reprit pas.",
     "mentions": []
    },
    {
     "id": "c11-b40",
     "text": "L’Intendante s’avança.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c11-b41",
     "text": "Elle s’avança jusqu’à trois pas du cercueil, et personne ne l’arrêta, parce que le visage avait été vu et que la Règle, désormais, ne défendait plus rien. Ses quatre gardes restèrent en arrière. Elle regarda la morte, et la Couronne sur son front, et Isaure vit qu’elle regardait d’abord la morte.",
     "mentions": [
      "hermine-laroque",
      "droit-de-visage"
     ]
    },
    {
     "id": "c11-b42",
     "text": "— Cette couronne, dit-elle, d’une voix qui portait jusqu’aux derniers rangs sans jamais s’élever, est un bien de la Régence, volé en 571. Au nom de la Régence et en attendant qu’on en dispose…",
     "mentions": [
      "la-regence",
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c11-b43",
     "text": "— On en dispose, dit Mahaut de Frimas.",
     "mentions": []
    },
    {
     "id": "c11-b44",
     "text": "Elle était sortie de la foule. Elle était petite, dans son manteau noir, avec sa toque de fourrure, et elle vint se placer de l’autre côté du cercueil, en face de l’Intendante, et elle regarda longtemps, elle aussi, le visage de celle qui avait été sa préceptrice. Puis elle se tourna vers la foule.",
     "mentions": [
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c11-b45",
     "text": "— Je suis Mahaut de Frimas, dit-elle, et sa voix, qu’Isaure n’avait jamais entendue qu’un peu sèche et moqueuse, avait quelque chose de très clair, qui venait de loin, d’une bibliothèque où l’on apprenait autrefois aux Margraves à lire la glace. On m’appelle la Margravine en attente. En 571, j’avais dix-sept ans, et c’est moi qui ai ouvert à cet homme la lucarne de la Chambre de Givre. Il a fait quarante et un ans de prison pour une fenêtre que j’ai ouverte, et il n’a jamais dit mon nom. Je le dis.",
     "mentions": [
      "vol-de-571",
      "constant-merel"
     ]
    },
    {
     "id": "c11-b46",
     "text": "Il y eut dans la foule un bruit qu’Isaure n’oublia jamais, un bruit de milliers de gens qui respirent en même temps. Derrière elle, Firmin Vauclair ferma les yeux, et elle l’entendit murmurer, pour lui seul : « La clef de l’héritière. »",
     "mentions": [
      "firmin-vauclair"
     ]
    },
    {
     "id": "c11-b47",
     "text": "— Cette couronne est à moi, reprit Mahaut. C’est la dernière chose au monde qui soit à moi ; on m’a pris tout le reste en attendant. Clémence Mérel l’a gardée pour moi, sous vos pieds, pour que je puisse un jour choisir moi-même, au lieu de signer de force un matin de Vêlage. Je choisis. Je la laisse à celle qui l’a portée. Il n’y aura plus de Margrave à Demeure : ni moi, ni les cousins de Solanne, ni personne. Que la ville se débrouille. La glace l’a donnée à un pêcheur, il y a trois cents ans ; je la rends à la mer.",
     "mentions": [
      "clemence-merel",
      "couronne-de-givre",
      "demeure"
     ]
    },
    {
     "id": "c11-b48",
     "text": "Elle se tut. Personne ne bougea.",
     "mentions": []
    },
    {
     "id": "c11-b49",
     "text": "L’Intendante Laroque regarda longuement la Margravine, de l’autre côté du cercueil. Isaure la vit calculer, et elle vit l’instant exact où le calcul tomba juste. Puis l’Intendante se tourna vers le greffier qui la suivait depuis la Régence, un petit homme à lunettes qui tenait une écritoire contre sa poitrine comme un bouclier.",
     "mentions": [
      "hermine-laroque",
      "compagnie-des-glaces"
     ]
    },
    {
     "id": "c11-b50",
     "text": "— Consignez, dit-elle. La Margravine renonce, pour elle et ses héritiers. La Régence en prend acte.",
     "mentions": []
    },
    {
     "id": "c11-b51",
     "text": "Puis elle recula de trois pas, et elle ne dit plus rien.",
     "mentions": []
    },
    {
     "id": "c11-b52",
     "text": "— Il faut la rendre, dit le Prieur. Le jour se lève.",
     "mentions": []
    },
    {
     "id": "c11-b53",
     "text": "C’était vrai. Au-dessus de la Paroi Sud, le ciel avait pâli, d’un gris très doux qui tournait au rose, et la mer, en bas, sortait de la nuit. Le Prieur fit signe à ses frères, qui s’approchèrent du cercueil pour le porter jusqu’à la Glissoire.",
     "mentions": [
      "la-glissoire"
     ]
    },
    {
     "id": "c11-b54",
     "text": "— Pas par la Glissoire, dit Isaure.",
     "mentions": []
    },
    {
     "id": "c11-b55",
     "text": "Tout le monde se tourna vers elle. Elle sentit sur elle le regard de Maître Bastide, et celui de l’Intendante, et celui de la ville entière, et elle regarda sa maison.",
     "mentions": [
      "hermine-laroque",
      "onesime-bastide"
     ]
    },
    {
     "id": "c11-b56",
     "text": "— Ma maison part à six heures quarante et une, dit-elle. C’est moi qui l’ai calculé ; c’est ma date qui est sur les affiches. J’ai racheté mes poutres hier à la Corporation. Elle est à moi, maintenant, jusqu’au bout. Elle est allumée. Je voudrais que Clémence Mérel parte dedans.",
     "mentions": [
      "maison-sorbier",
      "remontee",
      "velage"
     ]
    },
    {
     "id": "c11-b57",
     "text": "Le Prieur la regarda, puis la maison, puis le novice, puis la sonnaille de frère Hilaire posée dans la neige.",
     "mentions": []
    },
    {
     "id": "c11-b58",
     "text": "— La Règle dit : rendre à la mer, répondit-il. Elle ne dit pas par où.",
     "mentions": [
      "rendue",
      "affleureurs"
     ]
    },
    {
     "id": "c11-b59",
     "text": "Maître Ancel, de la Corporation, qui se tenait avec ses hommes au bord de la fente, ôta son bonnet. Puis il fit signe aux Remonteurs, qui prirent la grande planche qu’ils avaient apportée pour tirer la Dernière Poutre, et qui la jetèrent en travers de la fente, comme ils le faisaient chaque année, et qui la calèrent. La fente, à l’aube du 17 mars, mesurait un pied et onze pouces ; Isaure le vit du premier coup d’œil, et elle ne le nota pas.",
     "mentions": [
      "remontee",
      "le-front"
     ]
    },
    {
     "id": "c11-b60",
     "text": "— Les gars voulaient tirer une poutre, dit maître Ancel. Ils porteront une morte. C’est un meilleur usage.",
     "mentions": []
    },
    {
     "id": "c11-b61",
     "text": "On referma le couvercle. On ne le recloua pas. Tobie et Pétronille prirent la tête du cercueil, deux Remonteurs le pied, Firmin le milieu, et ils passèrent la planche l’un derrière l’autre, au-dessus de la fente noire où l’on entendait la mer, et ils marchèrent sur la dalle jusqu’à la maison. Isaure passa derrière eux, en soutenant Constant. Il ne pesait presque rien.",
     "mentions": [
      "tobie-arnal",
      "petronille-gaudin",
      "firmin-vauclair"
     ]
    },
    {
     "id": "c11-b62",
     "text": "Ils entrèrent. La pièce principale était chaude ; le poêle, qu’Isaure avait chargé la veille, ronflait encore. Les neuf lampes brûlaient. Ils posèrent le cercueil sur la table de sa mère, sous la maîtresse poutre aux trois encoches et au fer à cheval renversé, et Isaure pensa que cette poutre allait maintenant faire sa dernière descente, avec Clémence dessous, et elle ne sut pas si c’était triste. Les porteurs ressortirent sans bruit. Firmin, sur le seuil, se retourna, regarda un moment le vieil homme qui s’était assis à côté de la table, dans le fauteuil qui boitait, et il porta deux doigts à son front, comme un garde qu’on relève.",
     "mentions": [
      "maison-sorbier",
      "remontee",
      "la-ligne"
     ]
    },
    {
     "id": "c11-b63",
     "text": "Isaure resta.",
     "mentions": []
    },
    {
     "id": "c11-b64",
     "text": "Constant avait posé la main sur le couvercle. Il ne disait rien. L’horloge, sur le mur, qui retardait de quatre minutes, faisait son bruit d’horloge. Isaure regarda la montre de sa mère, qui retardait des quatre mêmes minutes, et elle fit le calcul sans y penser.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c11-b65",
     "text": "— Constant. Il reste six minutes.",
     "mentions": []
    },
    {
     "id": "c11-b66",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c11-b67",
     "text": "Il ne bougea pas. Pendant un instant, un instant très long, Isaure eut peur. Elle eut peur qu’il reste. Elle sut qu’il en avait envie, et elle sut qu’elle ne pourrait pas le porter jusqu’à la planche s’il ne voulait pas venir, et elle pensa à tout ce qu’elle pourrait lui dire, et elle ne trouva rien qui ne fût pas un chiffre.",
     "mentions": []
    },
    {
     "id": "c11-b68",
     "text": "— Constant, dit-elle. Les oranges. Pendant quarante ans, une caisse chaque hiver. Vous ne croyez pas qu’il faudrait aller la remercier ?",
     "mentions": []
    },
    {
     "id": "c11-b69",
     "text": "Il leva la tête. Il la regarda comme il l’avait regardée le premier soir, dans la lumière de la lune, sur le tas de bois des Guérin : comme quelqu’un qu’il avait mis onze ans à trouver.",
     "mentions": []
    },
    {
     "id": "c11-b70",
     "text": "Puis il ôta son chapeau — il l’avait remis en entrant, par politesse, comme on garde son chapeau dans une maison qu’on ne connaît pas — et le posa sur le couvercle du cercueil, près de la plaque.",
     "mentions": [
      "constant-merel"
     ]
    },
    {
     "id": "c11-b71",
     "text": "— Elle disait qu’il était affreux, dit-il. Elle avait raison. Il y a quarante et un ans qu’elle a raison.",
     "mentions": []
    },
    {
     "id": "c11-b72",
     "text": "Et il se leva, et il sortit avec elle.",
     "mentions": []
    },
    {
     "id": "c11-b73",
     "text": "Ils repassèrent la planche à six heures trente-huit. Les Remonteurs la retirèrent derrière eux. Isaure se retourna. Au-delà de la fente, la maison brillait toute seule dans le petit jour, avec ses neuf fenêtres, son volet gris qui battait, et sur le toit un peu de neige que le Tombant n’avait pas emportée.",
     "mentions": [
      "maison-sorbier",
      "le-tombant"
     ]
    },
    {
     "id": "c11-b74",
     "text": "Elle sortit la montre de sa mère. Elle n’en avait pas vraiment besoin ; elle savait. Elle compta quand même, parce qu’on compte toujours. Elle regarda la trotteuse faire le tour du cadran, et encore, et encore. Autour d’elle, la ville entière retenait son souffle. Et quand l’aiguille marqua six heures trente-sept — six heures quarante et une à l’heure vraie —, Isaure Sorbier, Jalonneuse du Front pour l’année 612, leva la main et cria, comme on le criait depuis six cents ans au bord de la Coulée :",
     "mentions": [
      "isaure-sorbier",
      "la-coulee",
      "velage"
     ]
    },
    {
     "id": "c11-b75",
     "text": "— Vêlage !",
     "mentions": []
    },
    {
     "id": "c11-b76",
     "text": "La fente rugit.",
     "mentions": []
    },
    {
     "id": "c11-b77",
     "text": "Ce fut d’abord un bruit, venu de dessous, un grondement énorme qui monta de la glace par les pieds et vous remplit la poitrine. Puis la dalle bougea. Elle bougea à peine, d’abord, un tremblement, un pouce ; les lampes de la maison vacillèrent dans les fenêtres. Puis elle s’inclina vers la mer, lentement, si lentement qu’on eut le temps de voir la neige glisser du toit, et la maison s’inclina avec elle, droite sur ses pilotis, comme un homme qui salue. Et puis elle partit.",
     "mentions": [
      "le-front",
      "velage"
     ]
    },
    {
     "id": "c11-b78",
     "text": "Elle tomba. Trente toises. La dalle entière, la maison dessus, les trente pas de neige et le jardin de galets, tout descendit d’un bloc le long du Front, dans un fracas qui fit trembler la Paroi Sud, et entra dans la mer. Il y eut une explosion d’écume blanche, plus haute que le Front, qui retomba en pluie sur la foule ; une vague énorme partit vers le large, souleva les navires du Midi à l’ancre dans le Bras, les fit danser comme des bouchons, et alla se briser contre les rochers de la Paroi Nord. Puis il n’y eut plus rien que de l’écume, qui tournait.",
     "mentions": [
      "le-front"
     ]
    },
    {
     "id": "c11-b79",
     "text": "Personne ne parlait. Isaure regardait l’écume.",
     "mentions": []
    },
    {
     "id": "c11-b80",
     "text": "Et la dalle remonta.",
     "mentions": []
    },
    {
     "id": "c11-b81",
     "text": "Elle remonta lentement, du fond de l’écume, comme un nageur qui revient à la surface, en ruisselant de tous les côtés ; elle tangua, pencha d’un côté, de l’autre, et se stabilisa. C’était une grande table de glace blanche, plus large que haute, qui flottait. Et dessus, au milieu, penchée mais debout sur ses pilotis, il y avait la maison. Toutes ses fenêtres s’étaient éteintes.",
     "mentions": [
      "maison-sorbier"
     ]
    },
    {
     "id": "c11-b82",
     "text": "Une clameur monta de la foule, et Isaure ne l’entendit pas.",
     "mentions": []
    },
    {
     "id": "c11-b83",
     "text": "— Elle ne se retournera pas, dit-elle, à personne. Elle est plus large que haute.",
     "mentions": []
    },
    {
     "id": "c11-b84",
     "text": "La marée descendait. Le courant du Bras prit la dalle et l’emmena doucement vers le large, entre les navires du Midi qui avaient cessé de danser, et dont les équipages, alignés sur les ponts, ôtaient leurs bonnets : on ne repêche pas une Rendue, pas plus au large qu’à Demeure. Le soleil se leva au-dessus de la Paroi Sud et toucha la maison, et toutes ses fenêtres s’allumèrent à la fois.",
     "mentions": [
      "le-front"
     ]
    },
    {
     "id": "c11-b85",
     "text": "Constant Mérel regardait partir sa femme pour la deuxième fois. Il se tenait debout au bord du Front, entre Isaure et Pétronille, qui le tenaient chacune par un bras, et il n’avait plus de chapeau, et le vent de la mer décoiffait ses cheveux blancs.",
     "mentions": [
      "constant-merel",
      "petronille-gaudin"
     ]
    },
    {
     "id": "c11-b86",
     "text": "— Bonne descente, dit-il.",
     "mentions": []
    },
    {
     "id": "c11-b87",
     "text": "Derrière eux, dans la foule, quelqu’un le répéta. Puis quelqu’un d’autre. Puis toute la ville, de proche en proche, jusqu’aux derniers rangs, et même les enfants qui avaient gardé leurs couronnes de papier à la main. Tobie ramassa la sonnaille de frère Hilaire, par la courroie, et la fit sonner, et toutes les sonnailles de la Grande Rendue lui répondirent, sur le Front, dans le matin.",
     "mentions": [
      "tobie-arnal",
      "rendue"
     ]
    },
    {
     "id": "c11-b88",
     "text": "La maison n’était plus qu’un point blanc sur la mer grise. Puis moins qu’un point. Isaure la regarda jusqu’au bout.",
     "mentions": [
      "maison-sorbier"
     ]
    }
   ]
  },
  {
   "id": "chapitre-12",
   "number": 12,
   "title": "Désormais",
   "image": "images/chapter-12.webp",
   "alt": "Au printemps, dans le coin d’une place de neige fondante, un vieil homme au chapeau de feutre gris plante un piquet rouge et blanc à la masse ; une jeune femme le regarde, près d’une luge chargée de vieilles poutres tirée par une chienne grise.",
   "visualDescription": "Fin d’après-midi de printemps, lumière dorée et douce, neige fondante, rigoles d’eau qui brillent sur la glace. Constant, maigre, chapeau de feutre gris neuf, enfonce à la masse un jalon à bandes rouges et blanches au coin d’un lot marqué de galets alignés. Isaure, écharpe rayée, fil à plomb à la main, le regarde en souriant. À côté, une luge de Remonteur chargée de grosses poutres noircies marquées d’encoches, tirée par une chienne grise. Au fond de la place, des enfants font des glissades autour d’un bonhomme de neige coiffé d’une couronne de papier doré. Au loin, au bout d’une longue rue, la mer. Paix, légèreté, commencement.",
   "blocks": [
    {
     "id": "c12-b01",
     "text": "À la fin d’avril, la Coulée se mit à fondre. Ce n’était pas encore la Fonte, qui vient en juin et qui change les rues en ruisseaux ; c’était la première eau, une eau timide qui suintait l’après-midi dans les ogives claires et regelait le soir en dessinant sur le sable des rues des arabesques de verre. Les caleurs passaient leurs journées sous les maisons à rattraper les pilotis. Les enfants faisaient flotter des bateaux de papier dans les rigoles. Et sur tous les murs de la Rue Longue, là où l’on avait arraché les affiches du bal, on avait collé une affiche nouvelle, imprimée en noir sur papier blanc, sans or et sans couronne vide, qui commençait par un mot qu’on n’avait jamais lu en tête d’un décret de Demeure.",
     "mentions": [
      "la-coulee",
      "ogives",
      "demeure"
     ]
    },
    {
     "id": "c12-b02",
     "text": "« Désormais, le Conseil de Demeure gouverne la ville en son nom propre. Désormais, les lots de la Ligne seront tirés au sort chaque printemps pour la durée d’une vie de maison, et ne pourront être ni vendus ni loués au-delà. Désormais, le lot dit Carré d’Attente appartient à la ville, qui en fera une place. Une charte sera écrite avant le prochain Vêlage. »",
     "mentions": [
      "la-ligne",
      "carre-d-attente",
      "velage"
     ]
    },
    {
     "id": "c12-b03",
     "text": "Isaure lut l’affiche au coin de la rue des Tonneliers, un matin, en montant au Bureau. À côté d’elle, un vieux porteur d’eau la lisait aussi, en remuant les lèvres. Quand il eut fini, il resta un moment sans rien dire, et puis il dit, à personne en particulier :",
     "mentions": [
      "bureau-des-jalons"
     ]
    },
    {
     "id": "c12-b04",
     "text": "— Désormais. C’est long, désormais.",
     "mentions": []
    },
    {
     "id": "c12-b05",
     "text": "Et il reprit ses seaux.",
     "mentions": []
    },
    {
     "id": "c12-b06",
     "text": "Au Bureau des Jalons, on lui avait rendu sa table. On ne lui avait pas rendu ses jalons. Le lendemain du Vêlage, elle était montée à neuf heures, comme tous les jours, deux cent quatorze marches, et elle était entrée dans le cabinet de Maître Bastide sans frapper, ce qu’elle n’avait jamais fait, et elle avait posé sur son bureau le carnet noir. Il l’avait ouvert. Il avait lu, page par page, les chiffres qu’elle avait donnés au sergent Morvan, « Une toise, quatre pieds », « Une toise, cinq pieds », « Deux toises ». Puis il avait ouvert le carnet rouge, qu’elle avait posé à côté, et il avait lu les autres. Cela lui avait pris un long moment. Isaure était restée debout.",
     "mentions": [
      "bureau-des-jalons",
      "onesime-bastide",
      "la-garde"
     ]
    },
    {
     "id": "c12-b07",
     "text": "— Le Serment dit : je dirai où va la glace, avait-il fini par dire, sans lever les yeux. Non où l’on voudrait qu’elle aille. Vous avez dit à l’Intendante de la Sûreté où la glace n’allait pas. C’est une faute. C’est la faute. Vous la paierez.",
     "mentions": [
      "serment-du-pas",
      "hermine-laroque"
     ]
    },
    {
     "id": "c12-b08",
     "text": "— Oui, Maître.",
     "mentions": []
    },
    {
     "id": "c12-b09",
     "text": "— Un an sans jalons. Vous tiendrez les tables. Grivel fera le profil de la Tour.",
     "mentions": []
    },
    {
     "id": "c12-b10",
     "text": "Elle n’avait rien dit. Grivel plantait de travers.",
     "mentions": [
      "la-tour",
      "jalons"
     ]
    },
    {
     "id": "c12-b11",
     "text": "Alors Maître Bastide avait refermé les deux carnets, les avait posés l’un sur l’autre, le noir sur le rouge, et il avait gardé la main dessus.",
     "mentions": [
      "onesime-bastide"
     ]
    },
    {
     "id": "c12-b12",
     "text": "— J’avais vingt-neuf ans en 571, avait-il dit. Clémence Mérel était ma collègue ; elle avait la table en face de la mienne. Quand j’ai lu sa ligne au Registre, le 5 mars, « entre 608 et 615, entre la vingtième et la trentième ogive », j’ai su tout de suite qu’elle avait menti. Clémence ne donnait pas sept ans de marge ; elle donnait sept jours. Je n’ai rien dit à personne. Ni à l’inspecteur Vauclair, qui me l’a demandé deux fois, ni au Premier Jalonneur de l’époque, ni à ma femme. Je me suis demandé pendant quarante et un ans si j’avais eu raison. Vous, au moins, vous êtes venue le dire.",
     "mentions": [
      "clemence-merel",
      "registre-des-remis",
      "firmin-vauclair"
     ]
    },
    {
     "id": "c12-b13",
     "text": "Il lui avait tendu le carnet noir.",
     "mentions": []
    },
    {
     "id": "c12-b14",
     "text": "— Gardez-le, avait-il dit. On garde ses fautes. Et quand vous aurez un moment, entre deux tables, vous m’apprendrez à calculer un chemin de Remis en une nuit. Moi, il me faut une semaine.",
     "mentions": [
      "affleurement"
     ]
    },
    {
     "id": "c12-b15",
     "text": "Isaure avait fait une seule autre chose, ce jour-là. Avec la permission de Maître Bastide, elle avait ouvert le Calendrier des Affleurements de l’an 621, qui n’avait encore que quelques pages, et elle avait ajouté une ligne, à l’encre, de sa plus belle écriture : « Profond sans nom, sans date. Enfant. Dans la Veine, vers la trente-cinquième ogive, sous les Étuves ou à côté. Prévenir les Affleureurs. » Et, parce qu’elle signait toujours tout, elle avait signé.",
     "mentions": [
      "profonds",
      "affleureurs",
      "les-etuves"
     ]
    },
    {
     "id": "c12-b16",
     "text": "L’Intendante vint la voir un après-midi, sur le Carré.",
     "mentions": [
      "hermine-laroque",
      "carre-d-attente"
     ]
    },
    {
     "id": "c12-b17",
     "text": "Isaure y passait ses fins de journée, depuis que le Conseil avait publié son décret et que le premier tirage au sort, fait entre les familles du Dernier Rang, lui avait donné dans le coin nord-ouest de la nouvelle place un lot de vingt pas sur quinze « pour la durée de sa descente ». Elle mesurait. Elle n’avait plus le droit de planter des jalons ; elle posait des galets aux angles, qu’elle alignait au cordeau, et elle recommençait le lendemain, parce que les enfants qui faisaient des glissades dans le Carré les poussaient du pied en passant.",
     "mentions": [
      "carre-d-attente",
      "mahaut-de-frimas"
     ]
    },
    {
     "id": "c12-b18",
     "text": "L’Intendante traversa la neige fondante dans ses bottes grises, en faisant attention où elle posait les pieds, et s’arrêta devant les galets.",
     "mentions": [
      "hermine-laroque"
     ]
    },
    {
     "id": "c12-b19",
     "text": "— Vingt pas sur quinze, dit-elle. C’est petit, pour un palais.",
     "mentions": []
    },
    {
     "id": "c12-b20",
     "text": "— C’est une maison.",
     "mentions": []
    },
    {
     "id": "c12-b21",
     "text": "Elles restèrent un moment côte à côte, à regarder les galets. Autour d’elles, le Carré n’était plus tout à fait vide : on y avait planté des poteaux pour des bancs, on y avait dressé, dans un coin, le premier étal d’un marchand de marrons, et au milieu, sur la neige tassée par cinquante glissades, il y avait un bonhomme de neige coiffé d’une couronne de papier doré qui avait dû servir au Vêlage.",
     "mentions": [
      "carre-d-attente"
     ]
    },
    {
     "id": "c12-b22",
     "text": "— Le Remis cinquante-huit de l’an 571, dit l’Intendante, a affleuré le 17 mars dans la glacière basse de la Régence, deux jours avant son heure, par l’effet de la chaleur des Étuves voisines, dont les chaudières sont trop proches du mur mitoyen. Il a été rendu à la mer le jour même, selon la Règle, en présence du Prieur, de son mari et de la population. La Régence a fait combler un boyau de glace qui menaçait ses fondations. C’est ce qu’on lira aux archives. Je l’ai écrit moi-même.",
     "mentions": [
      "clemence-merel",
      "glaciere-basse",
      "la-regence"
     ]
    },
    {
     "id": "c12-b23",
     "text": "— C’est presque vrai.",
     "mentions": []
    },
    {
     "id": "c12-b24",
     "text": "— C’est entièrement vrai. C’est seulement incomplet. Vous devriez connaître la différence, maintenant.",
     "mentions": []
    },
    {
     "id": "c12-b25",
     "text": "Elle tira de sous sa cape un objet plat, enveloppé dans une toile, et le lui tendit. Isaure défit la toile. C’était une plaque de cuivre verdie par quarante hivers, avec quatre trous aux coins où il restait des bouts de vis rouillées. « Lot réservé au palais de la Margravine — en attendant la Couronne ».",
     "mentions": [
      "en-attendant-la-couronne"
     ]
    },
    {
     "id": "c12-b26",
     "text": "— Le Conseil m’a chargée de faire enlever toutes les plaques, dit l’Intendante. Il y en a quatre cent douze dans la ville. On les fond pour faire des clous. Celle-ci, je me suis dit que vous la voudriez.",
     "mentions": []
    },
    {
     "id": "c12-b27",
     "text": "— Et vous ? Qu’est-ce que vous allez faire ?",
     "mentions": []
    },
    {
     "id": "c12-b28",
     "text": "— Moi ? Je reste. Il faut quelqu’un pour compter les tombereaux, désormais comme avant. La ville ne sait pas encore qu’elle aura besoin de moi. Elle le saura avant le prochain Vêlage.",
     "mentions": [
      "la-garde"
     ]
    },
    {
     "id": "c12-b29",
     "text": "Elle regarda encore un moment les galets, puis le bonhomme de neige, puis Isaure.",
     "mentions": []
    },
    {
     "id": "c12-b30",
     "text": "— Vous me devez un chiffre juste, mademoiselle Sorbier, dit-elle. Je viendrai le chercher.",
     "mentions": []
    },
    {
     "id": "c12-b31",
     "text": "Elle remit ses gants, doigt par doigt.",
     "mentions": []
    },
    {
     "id": "c12-b32",
     "text": "— Clémence Mérel, dit l’Intendante Laroque. Voilà.",
     "mentions": []
    },
    {
     "id": "c12-b33",
     "text": "Et elle s’en alla dans la neige fondante, en faisant attention où elle posait les pieds.",
     "mentions": []
    },
    {
     "id": "c12-b34",
     "text": "Aux Étuves de la Veine, dans l’étuve sèche, Constant Mérel et Firmin Vauclair jouaient au piquet.",
     "mentions": [
      "constant-merel",
      "firmin-vauclair"
     ]
    },
    {
     "id": "c12-b35",
     "text": "Ils y jouaient tous les après-midi, depuis que la mère Soubise avait déclaré, un matin de la fin mars, avec une espèce de dépit, que le poumon du vieux Mérel tiendrait encore un hiver ou deux, s’il cessait de ramper dans la glace. Ils s’asseyaient sur la plus haute banquette, enveloppés dans des draps comme deux sénateurs des vieux livres, une planche entre eux en guise de table, et ils jouaient jusqu’à ce que l’un des deux soit trop rouge pour continuer. C’était, en général, Firmin.",
     "mentions": [
      "les-etuves",
      "constant-merel",
      "firmin-vauclair"
     ]
    },
    {
     "id": "c12-b36",
     "text": "— Il triche, dit Firmin quand Isaure entra. Il a toujours triché. En 571, il trichait déjà aux cartes, dans ma cellule de garde, pendant qu’on attendait le juge.",
     "mentions": []
    },
    {
     "id": "c12-b37",
     "text": "— Je ne triche pas, dit Constant. Je compte.",
     "mentions": []
    },
    {
     "id": "c12-b38",
     "text": "— C’est la même chose, quand c’est toi.",
     "mentions": []
    },
    {
     "id": "c12-b39",
     "text": "Constant avait un chapeau neuf, posé à côté de lui sur la banquette : un chapeau de feutre gris, modeste et bien fait, qu’on lui avait apporté le lendemain du Vêlage avec une caisse d’oranges et un billet qui ne disait que cela : « Celui-ci est moins affreux. » Il avait maigri encore, et il avait des joues de vieil homme qui a été très malade, mais il avait les yeux clairs et plissés de quelqu’un qui a longtemps regardé de la neige au soleil, et il riait souvent. Il allait deux fois par semaine, en fin d’après-midi, à l’Hôtel de Frimas, rapporter la caisse vide, et il en revenait tard.",
     "mentions": [
      "mahaut-de-frimas",
      "hotel-de-frimas"
     ]
    },
    {
     "id": "c12-b40",
     "text": "— Je vous attendais, dit Firmin à Isaure, et il posa ses cartes, ce qui voulait dire qu’il perdait. J’ai quelque chose pour vous.",
     "mentions": []
    },
    {
     "id": "c12-b41",
     "text": "Il fouilla sous la banquette et en tira le dossier de carton, gonflé comme une miche, fermé par sa sangle, avec son étiquette : « Givre ».",
     "mentions": []
    },
    {
     "id": "c12-b42",
     "text": "— Quarante et un ans de fiches, dit-il. Il y a des calculs faux, vous le verrez tout de suite. Il y a des choses que j’ai crues et que je ne crois plus, et des choses que je n’ai jamais crues et qui étaient vraies. Je l’ai relu, depuis le Vêlage. J’ai ajouté quelques lignes. J’ai écrit la dernière fiche avant-hier. Je ne sais pas à qui le donner. Aux archives de la Sûreté, Hermine le rangerait aux fantaisies, et elle aurait raison. Vous êtes la seule personne à Demeure qui sache lire mes calculs, même faux. Prenez-le.",

   "text": "Fiche ouverte le 6 mars 571, à neuf heures du matin, heure à laquelle il est entré dans mon bureau.\n\nMÉREL, Constant. Né en 544. Apprenti Remonteur à quatorze ans chez maître Ancel, compagnon à vingt. Connaît les toits de la ville comme d’autres les rues ; a refait en 570 ceux de l’Hôtel de Frimas. Marié en 566 ; veuf depuis le 2 mars 571 au matin.\n\nS’est présenté de lui-même le 6 mars. A avoué le vol de la Couronne de Givre, dans la nuit du 1er au 2. A déclaré l’avoir jetée la nuit même dans une crevasse du Sillage « pour qu’on ne la lui prenne pas ». N’a jamais varié d’un mot. N’a jamais nommé personne. Condamné le 20 avril 571 à la Tour « jusqu’au retour de la Couronne ». Je me suis souvent demandé si le juge avait compris ce qu’il écrivait.\n\nObs., 571 : poli, calme, précis. Ne se défend pas. Répond à toutes les questions, sauf à celles qui comptent. M’a dit à la fin du premier interrogatoire : « Je l’aurais vendue, inspecteur. » Je ne l’ai pas cru. Je n’ai jamais su pourquoi.\n\nAjout, 590 : un seul visiteur en dix-neuf ans, chaque mois, toujours le même : Mme Gaudin. Et chaque hiver, au premier bateau du Midi, une caisse d’oranges déposée à la Tour pour lui, sans nom d’expéditeur. J’ai enquêté trois hivers de suite. Le marchand ne se souvenait jamais du client ; il se souvenait très bien du pourboire.\n\nAjout, 22 février 612 : libéré à midi par grâce de Vêlage. A regardé la ville un long moment du haut du Roc, comme on regarde la mer depuis un pont. Puis il est parti tout droit à travers le Sillage, en posant les pieds où il fallait, parler à une Jalonneuse.",

   "text": "Fiche ouverte le 5 mars 571.\n\nMÉREL, Clémence, née Aubrac en 542. Jalonneuse de première classe à vingt-cinq ans, la plus jeune du siècle. Marque : un sablier. Auteur, en 568, de la table des coefficients de profondeur que tout le Bureau appelle « la Mérel », et dont presque personne ne se rappelle que l’auteur était une femme. Mariée en 566 à Constant Mérel, Remonteur. Malade de la poitrine depuis l’automne 570. Décédée le 2 mars 571 au matin, quelques heures après le vol. Remise à la glace le 4, au Champ des Remis, rang 12, place 31, à deux toises et trois pieds.\n\nObs. : je suis allé à sa veillée le 3. Je n’avais rien à y faire. Le mari était assis près du cercueil, la main posée dessus, et il ne pleurait pas. J’ai vu beaucoup de veufs. Je n’en avais jamais vu un qui eût l’air d’avoir mis quelque chose à l’abri.\n\nLe 5, j’ai demandé l’ouverture des trois cercueils remis depuis la nuit du vol, dont le sien. Refusée. Le 6, son mari se rendait.\n\nAjout, 580 : la colonne de l’affleurement estimé, à la ligne 58 du Registre, n’est pas de la main du greffier. Je l’ai comparée aux relevés du Bureau. C’est la sienne. Elle a calculé son propre chemin, dans son lit, et elle l’a écrit : entre 608 et 615. Je ne l’ai dit à personne ; on m’aurait rangé aux fantaisies une deuxième fois. On m’y a rangé quand même.",

   "text": "Fiche ouverte en 606, le jour de ma retraite, parce qu’il fallait bien que quelqu’un la fasse.\n\nVAUCLAIR, Firmin. Né en 546, rue des Vitriers, à une ogive qui est aujourd’hui au fond du Bras. Garde au palais des Frimas à vingt ans. Inspecteur de la Garde à vingt-quatre. A arrêté Constant Mérel le 6 mars 571 ; ou plutôt, Constant Mérel est venu s’asseoir dans son bureau, ce qui n’est pas la même chose, et il le sait. On l’a appelé ensuite, pendant trente-cinq ans, l’inspecteur de la Couronne perdue, ce qui n’est pas une promotion.\n\nCélibataire. Un chat gris, qui dort sur les registres. Genou gauche mauvais depuis l’hiver 598. Fume une pipe qui sent le goudron ; tout le monde le dit, et c’est vrai.\n\nA formé la moitié des sergents de la ville et une Intendante. A appris la science des glaces tout seul, avec des livres et des erreurs, pour comprendre où l’on peut cacher une couronne dans une ville qui bouge. Ses calculs sont faux. Ses questions, d’après certains, ne le sont pas.\n\nCe dossier est à lui. Il a été tenu quarante et un ans. Il n’a jamais été classé.",

   "text": "Fiche ouverte le 12 septembre 588, jour de son entrée à la Garde.\n\nLAROQUE, Hermine. Née en 568 : elle avait trois ans l’hiver du vol. Entrée à la Garde à vingt ans ; mon élève pendant six ans ; la meilleure que j’aie eue, et de loin. Passée à la Sûreté de la Régence en 596. Intendante depuis 604. M’a appris beaucoup de choses, dont la retraite.\n\nObs. : ne hausse jamais la voix. Tient ses gants à la main et ne les met qu’au moment de partir, ce qui permet de savoir quand un entretien est fini. Boit de la camarine. Ne danse pas ; au bal, elle regarde les autres danser, et elle compte. Dit toujours aux gens qu’ils ont raison, après avoir fait exactement ce qu’elle voulait.\n\nCe qu’elle croit, pour autant que je le sache : que la Régence, faute de mieux, est ce qui est arrivé de mieux à Demeure ; que tout se calcule, surtout les gens. Elle a souvent raison. C’est ce qui la rend dangereuse.\n\nAjout, février 612 : c’est elle qui a demandé au Régent la grâce de Vêlage de Constant Mérel. Pour le suivre. Je lui aurais dit, si nous nous parlions encore, qu’on ne suit pas Constant : c’est lui qui vous mène. Elle ne m’a rien demandé. Elle a toujours été très polie.",

   "text": "Fiche ouverte le 3 mars 571.\n\nFRIMAS, Mahaut de. Née en 554. Fille unique d’Eudes IV, dernier Margrave couronné, mort en novembre 570. Devait être sacrée au Vêlage de 571, le 5 mars. La Couronne a disparu dans la nuit du 1er au 2. Il n’y a pas eu de sacre. Il n’y en a jamais eu depuis.\n\nObs., 571 : interrogée le 3 mars, en présence du Conseil. Dix-sept ans. Très pâle, très calme. A répondu à tout. Le Conseil a jugé inconvenant qu’on insiste. J’ai jugé comme le Conseil. J’avais été son garde.\n\nAjout, 590 : vit seule à l’Hôtel de Frimas, qui descend, avec un vieux domestique sourd. Pension de la Régence, modeste. Ne s’est pas mariée ; les prétendants ont disparu avec la Couronne, ce qui en dit long sur les prétendants. Balaie elle-même son perron. Joue aux cartes toute seule. On l’appelle la Margravine en attente ; elle trouve ça drôle, ou elle fait semblant.\n\nAjout, 612 : l’Hôtel partira au Vêlage de l’an prochain. Elle refuse d’en partir avant.",

   "text": "Fiche technique, 575, complétée en 612.\n\nVille bâtie sur la Coulée, entre la Paroi Nord et la Paroi Sud, de la Ligne au Front : trois lieues de long, une demi-lieue de large. Fondée il y a six cent douze ans par des pêcheurs qui, dit-on, cherchaient un endroit où rester ; ils l’ont appelée Demeure. Les chroniques ne s’accordent pas sur la question de savoir s’ils plaisantaient.\n\nLa ville descend vers la mer d’un pas par jour. Chaque maison naît à la Ligne et tombe du Front une cinquantaine d’années plus tard. On donne son adresse par la rue et par l’ogive — rue des Calfats, cinquantième ogive —, ce qui dit à la fois où l’on habite et combien de temps il reste. La Rue Longue, qui suit la glace, est la seule rue droite ; les rues de traverse, que le milieu de la Coulée devance, prennent avec l’âge la forme d’un sourire.\n\nTrois endroits seulement ne bougent pas : le Bureau des Jalons, sur la Paroi Nord ; la Tour, sur son Roc ; le Port-Fixe, sur la Paroi Sud. On se dit « bonne descente » pour se dire au revoir, et « tout affleure » pour dire qu’on finira par savoir. On dit d’un vieillard qu’il sourit comme une rue du Front ; c’est un compliment.\n\nN. B. : j’ai mis longtemps à comprendre ce que les enfants d’ici savent avant de savoir lire ; j’en étais un, pourtant. Je note ce que j’ai compris, dans l’ordre où je l’ai compris ; ce n’est pas l’ordre des livres.",

   "text": "Fiche technique, 575, complétée en 581.\n\nGlacier qui descend des grandes neiges, au-delà du Champ des Remis, jusqu’au Bras. Au-dessus de la Ligne, il neige plus qu’il ne fond : la Coulée s’épaissit. En dessous, il fond plus qu’il ne neige : elle s’amincit, et ce qu’elle a avalé plus haut remonte vers le jour.\n\nElle va plus vite au milieu, la Veine, que sur les côtés, les Bords, retenus par la roche. Plus vite en bas qu’en haut. Plus vite en surface qu’en profondeur, où elle frotte sur son lit. Un pas par jour, dit-on à l’école ; c’est une moyenne, et les Jalonneurs détestent les moyennes.\n\nSous la Coulée passe une grande eau qu’on ne voit jamais, nourrie par les moulins, qui ressort au pied du Front en bouillonnant. Personne ne sait par où elle passe. Les Jalonneurs disent qu’elle a son propre chemin, comme les morts.\n\nObs. : à quelques toises sous les rues, la glace a plusieurs siècles. On dit qu’on y trouve parfois des feuilles d’arbres qui n’existent plus.",

   "text": "Fiche technique, 575.\n\nAu-dessus de la Ligne, en amont de la Chute — la marche de roche où la Coulée se brise avant de se ressouder —, s’étend le Champ des Remis. On y porte les morts en procession, on les descend dans la neige à la place que le Registre leur donne — un rang, un numéro, une profondeur —, et les Affleureurs chantent. La neige de l’hiver suivant les recouvre. C’est la remise.\n\nLes Remis s’enfoncent sans bouger et descendent avec la glace, en profondeur, plus lents que la ville ; ils mettent une quinzaine d’années à passer la Ligne, et quarante à soixante ans à revoir le jour, quelque part dans la ville. Une place au Champ se paie ; ceux qui n’en ont pas les moyens sont rendus à la mer tout de suite, par la Glissoire, et ne reviennent pas. Avant le Champ, on remettait les morts dans les crevasses d’en haut, avec une clochette.\n\nN. B. : il y a une place, là-haut, que je connais par cœur. Je n’y suis jamais monté.",

   "text": "Fiche technique, 576, complétée en 612.\n\nLe Roc est une bosse de granit noir qui perce la Coulée au quart de sa largeur, du côté nord, à la dix-huitième ogive. La glace s’y fend, le contourne et se referme derrière lui dans un chaos de séracs et de crevasses qu’on appelle le Sillage. En amont, sur trois cents pas, on ne bâtit rien : c’est l’Allée, car tout ce qu’on y bâtirait irait s’écraser contre la Tour.\n\nLa Tour est la prison. Elle est, avec le Bureau et le Port-Fixe, l’un des trois endroits de la ville qui ne bougent pas. Les condamnés voient passer les rues. Un homme qui fait vingt ans voit passer sous sa fenêtre des maisons qui n’existaient pas le jour de son entrée.\n\nCe qui tombe dans le Sillage ne ressort pas : derrière le Roc, la glace plonge. En quarante ans, des centaines de chercheurs de trésor ont sondé ce qu’on appelle la Crevasse de Mérel. On y a perdu deux hommes, trois chiens et des quantités de cordes.\n\nAjout, 590 : cellule 14, fenêtre à l’amont. Sur le parapet du chemin de ronde, côté aval, un clou planté, et un fil tendu. Les gardes disent qu’il y montait chaque matin, et qu’on le laissait faire.",

   "text": "Fiche ouverte en 571, complétée en 612.\n\nLa Compagnie des Glaces du Bras achète la glace des Fendeurs et la vend au Midi. Elle possède les bateaux, les quais du Port-Fixe, et, en 571, le Conseil : son directeur, Aristide Varnier, le présidait.\n\nPour le sacre de mars 571, le Conseil avait préparé deux actes, que la jeune Margravine devait sceller, la Couronne sur la tête : : son contrat de mariage avec Gaspard Varnier, fils du président, trente-quatre ans ; et le Grand Bail, qui donnait à la Compagnie tous les lots de la Ligne pour soixante ans. En soixante ans, la glace fait descendre une ville entière. Demeure aurait été à eux, du Front à la Ligne, sans que personne ait rien volé.\n\nIl n’y a pas eu de sacre. Il n’y a eu ni mariage ni Bail.\n\nObs. : je n’ai trouvé ces deux actes aux archives du Conseil qu’en 601, sous une autre cote. En 571, personne ne m’en avait parlé. Si je les avais lus cette année-là, j’aurais cherché le voleur ailleurs, ou je ne l’aurais pas cherché du tout.",

   "text": "Fiche ouverte le 2 mars 571.\n\nNuit du 1er au 2 mars 571, entre deux et quatre heures, par grand vent. Un homme vu sur les toits de l’Hôtel de Frimas par un veilleur de la rue des Tonneliers. La Couronne disparaît de la Chambre de Givre ; porte intacte et fermée ; lucarne ouverte. Le sacre, prévu au Vêlage du 5 mars, est ajourné.\n\nLe 6 mars, Constant Mérel, Remonteur, se présente à la Garde et avoue. Il déclare avoir jeté la Couronne dans une crevasse du Sillage. Le 8, le Conseil proclame la Régence « en attendant la Couronne ». Le 20 avril, Mérel est condamné à la Tour jusqu’au retour de celle-ci.\n\nRecherches : quarante et un ans de sondages dans le Sillage ; deux hommes et trois chiens perdus ; rien.\n\nMes doutes, en 571 : pourquoi se rendre ? pourquoi le 6 ? pourquoi la lucarne ? pourquoi n’a-t-il jamais demandé combien de temps il ferait ? On a rangé mes doutes aux fantaisies, avec les serpents de mer. Ils y sont en bonne compagnie.",

   "text": "Affaire de la Couronne de Givre. Ouverte le 2 mars 571. Classée le 17 mars 612, à six heures quarante et une, par la mer.\n\nIl m’a fallu quarante et un ans pour poser une seule bonne question, et une matinée pour en avoir la réponse. Je voulais savoir pourquoi elle avait accepté. Clémence. Je crois que je le sais maintenant, et que ce n’est pas une réponse qu’on écrit sur une fiche. Elle a gardé une chose qui n’était pas à elle pour la rendre à quelqu’un qui n’avait pas le choix, le jour où ce quelqu’un l’aurait. Elle en avait fait faire le calcul, l’hiver d’avant, trois après-midi de suite, à une petite fille de seize ans, sans lui dire pourquoi ; puis elle l’a refait dans son lit, à la lampe, et elle a écrit un chiffre faux au Registre.\n\nJ’ai été garde à la porte de la Chambre de Givre à vingt ans. On m’avait dit que je gardais une couronne. Je me suis trompé de quarante et un ans et de trois pouces. Je gardais une porte, et la porte s’est ouverte de l’intérieur.\n\nJe donne ce dossier à Isaure Sorbier, qui sait lire mes calculs, même faux. Les fiches qui précèdent sont telles que je les ai écrites, à leurs dates ; je n’ai rien corrigé. On garde ses fautes.\n\nIl ne me reste qu’une chose à noter. Le matin du Vêlage, au bord de la fente, quand la dalle est partie, j’ai ôté mon chapeau comme tout le monde, et je l’ai gardé à la main jusqu’à ce que la maison ne soit plus qu’un point. Je n’avais pas tenu mon chapeau aussi longtemps depuis la remise de ma mère. Je note l’heure : sept heures douze. Personne ne la notera, sinon moi.\n\nF. V.",
