    {
     "id": "c1-b08",
     "text": "La salle des Attendants occupait tout le deuxième étage de la Maison : douze lits de chaque côté, des rideaux de toile écrue entre les lits, et au fond, très haut, trois fenêtres cintrées où battait le Voile. Il battait comme toujours, un blanc de lait qui montait, s’épaississait jusqu’à faire mal aux yeux, restait un moment, puis se retirait en gris, en gris de plomb, presque en noir, et remontait. Un jour de là-haut, et sa nuit. Colombe appelait cela un ciel. Jonas ne le regardait pas. Il avait appris à ne pas le regarder dès sa première longue, vingt ans plus tôt, quand un vieux courrier lui avait dit sur le quai de la gare : on ne compte pas les jours des autres, petit, ça porte malheur, et ça donne mal au cœur.",
     "mentions": []
    },
    {
     "id": "c1-b09",
     "text": "Il ouvrit son sac sur la couverture.",
     "mentions": []
    },
    {
     "id": "c1-b10",
     "text": "C’était une toupie de fer-blanc peinte en rouge et bleu, avec une tige à ressort qu’on enfonçait comme un piston. Il l’avait payée onze sous au marché couvert de Surplomb, à un marchand qui lui avait juré que c’était la dernière nouveauté de la Plaine. Colombe la prit à deux mains, la retourna, examina le poinçon sous la pointe sans savoir le lire, et regarda vers l’étagère où s’alignaient les autres.",
     "mentions": []
    },
    {
     "id": "c1-b11",
     "text": "Il y avait un cheval de bois grossier, le tout premier, aux oreilles rongées. Un soldat de plomb peint. Une souris mécanique qui ne marchait plus. Un kaléidoscope de carton. Une boîte à musique grande comme un savon. Une photographie coloriée à la main du marché aux fleurs, sous verre, où les passants étaient flous parce qu’ils avaient bougé. Une toupie de bois tourné, rouge. Tout ce qu’il avait apporté, dans l’ordre, de gauche à droite. Colombe appelait cela la frise, et personne n’avait le droit d’y toucher, pas même pour la poussière.",
     "mentions": []
    },
    {
     "id": "c1-b12",
     "text": "Elle posa la toupie de fer-blanc à droite de la toupie de bois.",
     "mentions": []
    },

     "text": "— Hier c’était du bois, dit-elle.",
     "mentions": []
    },

     "text": "— Hier, oui.",
     "mentions": []
    },
    {

     "text": "— Ta ville va vite.",
     "mentions": []
    },
    {
     "id": "c1-b16",
     "text": "Il enfonça la tige, une fois, deux fois, trois fois, et lâcha la toupie sur le carrelage. Elle se mit à chanter. Elle tint debout toute seule dans un bourdonnement de guêpe, penchée, obstinée, et traversa l’allée entre les lits sans tomber. Au lit d’en face, un vieil homme en bonnet de laine se souleva sur un coude pour la regarder passer. Colombe riait sans bruit, la bouche ouverte. Quand la toupie mourut contre le pied d’un lit, elle alla la chercher en chaussettes, malgré le carrelage, et revint la lui tendre pour qu’il recommence.",
     "mentions": []
    },
    {
     "id": "c1-b17",
     "text": "Il recommença cinq fois. La sixième, il la lui laissa, et elle apprit à enfoncer la tige avec les deux mains et tout le poids de son corps, qui n’était pas lourd. Elle avait les poignets fins, la peau des avant-bras marquée de petites taches violettes, comme si quelqu’un l’avait tenue trop fort ; personne ne l’avait tenue trop fort. C’était la langueur. Le docteur Salvat disait que les taches étaient stables, et stable était, dans la bouche de Salvat, un mot de tendresse.",
     "mentions": []
    },
    {
     "id": "c1-b18",
     "text": "À la troisième relance, elle s’assit sur le carrelage pour reprendre son souffle, et fit semblant de s’être assise exprès.",
     "mentions": []
    },
    {
     "id": "c1-b19",
     "text": "— Tu reviens plus vite qu’avant, dit-elle.",
     "mentions": []
    },

     "mentions": []
    },
    {
     "id": "c1-b21",
     "text": "— Non. Avant, entre deux fois, il y avait deux dodos. Maintenant il y a un dodo.",
     "mentions": []
    },
    {
     "id": "c1-b22",
     "text": "Il ne répondit pas. Il savait ce qu’elle voulait dire, et que c’était juste. Il descendait quand la Compagnie lui donnait une longue, c’est-à-dire à peu près tous les trois mois, et trois mois de là-haut faisaient ici, autrefois, un jour et demi. Deux dodos, si l’on voulait. Depuis que la cote de Demeure montait, il en fallait moins. Là-haut on appelait ça l’Enfoncement, ici la Hausse ; c’était la même chose vue des deux bouts, et il n’aimait pas que sa fille la mesure mieux que lui.",
     "mentions": []
    },
    {

     "mentions": []

     "mentions": []
    },
    {
     "id": "c1-b26",
     "text": "Il la regarda. Elle ne plaisantait pas ; elle ne plaisantait jamais quand elle avait une théorie. Elle était assise en tailleur sur le carrelage froid, la toupie dans le giron, et elle attendait qu’il reconnaisse qu’elle avait raison.",

    },

     "mentions": []
    },
    {
     "id": "c1-b30",
     "text": "— Je sais, dit-elle, comme on range un jouet, et elle se releva.",
     "mentions": []
    },
    {
     "id": "c1-b31",
     "text": "Elle vint s’asseoir contre lui sur le lit, lui prit la main pour la retourner et en regarder le dos, puis la paume, comme elle faisait toujours, comme on vérifie un paquet. Elle trouva la coupure qu’il s’était faite à l’Octroi en descendant, un filin mal lové, et la cicatrice plus ancienne, blanche, en travers de la base du pouce, qu’elle connaissait déjà et qu’elle salua d’un doigt.",
     "mentions": []
    },
    {
     "id": "c1-b32",

     "mentions": []
    },
    {
     "id": "c1-b33",
     "text": "Il regarda l’étagère. Le cheval, le soldat, la souris, le kaléidoscope, la boîte à musique ; il connaissait la frise par cœur, et il la parcourut quand même, objet par objet, de gauche à droite, jusqu’à la toupie neuve.",
     "mentions": []
    },
    {

     "mentions": []
    },
    {
     "id": "c1-b35",
     "text": "Au bout de la salle, la porte de la lingerie était entrebâillée d’un doigt, comme toujours. Jonas lui tournait le dos. Il le lui tournait à chaque visite ; il s’asseyait de ce côté-ci du lit depuis la première, et Colombe, qui remarquait tout, n’avait jamais demandé pourquoi.",

     "mentions": []
    },
    {
     "id": "c1-b38",
     "text": "— Quand on attend quelqu’un, on compte les battements du Fanal. Chaque fois que la cloche de la Tour sonne, un. Quand on arrive à sept cent vingt, la personne revient. Elle dit que ça marche à tous les coups.",
     "mentions": []
    },
    {
     "id": "c1-b39",

    },
    {
     "id": "c1-b41",
     "text": "— C’est trente jours. Madame Line dit que trente jours, ce n’est rien.",
     "mentions": []
    },
    {
     "id": "c1-b42",
     "text": "Il ramassa la toupie et la remit droite, et elle retomba, et il la laissa couchée.",
     "mentions": []
    },
    {
     "id": "c1-b43",
     "text": "Il avait gardé le reçu pour la fin. Il le sortit de la poche intérieure de sa veste, où il l’avait senti contre sa poitrine pendant toute la descente : un rectangle de papier fort plié en quatre, avec le cachet violet de l’Hôtel-Dieu de Surplomb. Reçu de monsieur Jonas Mérel, courrier, la somme de trois mille deux cents écus, pour une cure Hérault complète au bénéfice de l’enfant Colombe Mérel, admission à convenir. Colombe ne savait pas lire ; il lut pour elle. Il lut aussi le cachet, la date, et la signature de l’économe, qui était illisible, et il inventa le nom de l’économe.",
     "mentions": []
    },
    {
     "id": "c1-b44",
     "text": "Il avait commencé à mettre de côté le jour même où il l’avait descendue, sans savoir pour quoi, pour le jour où. Onze ans de longues rachetées aux collègues, parce qu’une longue payait triple et qu’à chaque longue il avait droit à une heure en bas ; onze ans à ne pas prendre de femme, pas de chien, pas de logement plus grand, à manger debout. Puis un matin, dans la gazette médicale qu’il achetait chaque semaine depuis qu’elle était ici, le nom du docteur Hérault et le mot guérison écrit en toutes lettres à côté du mot langueur. Il y avait près de quatre ans de cela. Le reste de la somme avait pris le reste du temps.",
     "mentions": []
    },
    {
     "id": "c1-b45",
     "text": "— Ça veut dire quoi, admission à convenir ?",

    },

     "mentions": []
    },
    {
     "id": "c1-b47",
     "text": "Colombe le regarda longtemps. Elle fredonna, sans y penser, les trois premières notes de la chanson du meunier, celle que Lucie chantait en coupant le pain, et que Colombe ne pouvait pas savoir qu’elle tenait de sa mère.",
     "mentions": []

     "text": "— Demain ?",

     "text": "— Pour toi, demain.",
     "mentions": []
    },
    {
     "id": "c1-b50",
     "text": "Elle hocha la tête, très sérieuse, plia le reçu en huit sans lui demander la permission et le glissa sous son oreiller, avec la boîte. Il la laissa faire. Il en avait une copie.",
     "mentions": []
    },
    {
     "id": "c1-b51",
     "text": "Le docteur Salvat passa au milieu de l’heure, les lunettes remontées sur le front et la blouse boutonnée de travers. Il écouta la poitrine de Colombe, lui regarda le blanc des yeux, lui fit tirer la langue, et Colombe lui fit remarquer qu’il avait mal boutonné sa blouse ; il le savait. Puis il prit Jonas à part dans l’embrasure d’une fenêtre, dos au Voile.",

    },

    },

     "text": "— Je l’ai payée.",
     "mentions": []
    },
    {
     "id": "c1-b54",
     "text": "— Bien. J’ai lu Hérault ce matin, les comptes rendus de l’Hôtel-Dieu, trois mois de leurs séries entre mon café et ma tournée. Elle y répondra. Les enfants de son âge y répondent presque tous. Il faudrait qu’elle remonte avant l’été de là-haut.",
     "mentions": []
    },

     "mentions": []
    },
    {
     "id": "c1-b56",
     "text": "— Je dis ça, je ne dis rien. Elle est stable. Mais stable ici, c’est stable à notre vitesse. Chez vous, la langueur galope. Il faut qu’elle arrive là-haut et qu’elle entre à l’Hôtel-Dieu dans la foulée, sans passer par votre cuisine.",
     "mentions": []
    },
    {
     "id": "c1-b57",
     "text": "Remonter, c’était rendre à sa fille l’heure de tout le monde. Chaque jour là-haut redeviendrait un jour pour elle, et un jour de langueur non soignée, là-haut, valait des semaines d’ici. Il faudrait être rapide. Il était rapide ; c’était son métier.",
     "mentions": []
    },
    {
     "id": "c1-b58",
     "text": "— Vous n’avez pas remarqué que les sacs du soir grossissent ? dit Salvat. Mes revues arrivent plus serrées. On dirait que la médecine se dépêche. C’est la Hausse, paraît-il. Les rentiers boivent à sa santé.",
     "mentions": []
    },
    {
     "id": "c1-b59",
     "text": "Il rabaissa ses lunettes sur son nez et s’en alla vers le vieil homme en bonnet.",
     "mentions": []
    },
    {
     "id": "c1-b60",
     "text": "Jonas regarda sa double montre. Il restait sept minutes. Depuis l’automne, il restait deux heures au lieu d’une, il le savait, il rentrait avec des retards qu’il ne contestait pas, et il payait l’amende en se disant que c’était le prix. Cette fois, il avait juré d’être exact. Il ne voulait pas d’un blâme au moment de demander la remontée de sa fille, et chaque écu comptait.",
     "mentions": []
    },
    {
     "id": "c1-b61",
     "text": "Ils avaient leur rituel pour le départ aussi. Colombe lui remonta le col, qui n’en avait pas besoin, lui tira sur les deux manches pour qu’elles soient égales, et lui dit, parce qu’il fallait le dire, qu’il avait une tache sur le revers, qu’elle ne voyait pas mais qu’il y en avait sûrement une.",
     "mentions": []
    },
    {

     "text": "— À demain, dit-elle.",
     "mentions": []
    },
    {
     "id": "c1-b63",
     "text": "— À demain.",
     "mentions": []
    },
    {
     "id": "c1-b64",
     "text": "Il descendit l’escalier de la Maison sans se retourner, parce qu’il avait remarqué, au bout de quelques visites, que s’il se retournait elle restait à la fenêtre jusqu’à ce qu’il ait passé le portail, et qu’elle attrapait froid.",
     "mentions": []
    },
    {
     "id": "c1-b65",
     "text": "Dehors, il pleuvait, comme toujours à Demeure : une bruine tiède, fine, qui ne mouillait pas vraiment et ne s’arrêtait jamais. La ville du fond ne ressemblait à aucune autre. Pierre blonde, arcades le long de toutes les rues, gouttières de cuivre, toits plats couverts de jardins, des treilles, des figuiers qui n’auraient pas passé un hiver à Surplomb et qui, ici, ne voyaient d’hiver qu’un jeudi de temps en temps, quand la bruine fraîchissait pendant une heure. Les rues montaient en pente douce depuis le quartier des Berges vers la gare des Bennes, et tout le monde y marchait sans se presser, comme on marche dans les villes riches. Au-dessus des toits, un sifflement très fin, presque au bord de l’oreille, qu’on finissait par ne plus entendre : la rumeur de Surplomb, ses voitures, ses cloches, ses marchés, qui arrivait jusqu’ici pressée comme un chant d’insecte. Sur la place de la Chambre, une femme en robe à tournure, la mode de l’automne dernier là-haut, arrivée ici avant-hier, donnait le bras à un homme qui lisait en marchant un journal tiré d’une pile de trente.",
     "mentions": []
    },
    {
     "id": "c1-b66",
     "text": "À la gare, Jonas donna son sac à peser, fit viser sa feuille de course par le préposé du Résident et, avant de monter dans la benne, tira de son gousset la double montre.",
     "mentions": []
    },
    {
     "id": "c1-b67",
     "text": "C’était l’outil du métier et le seul bijou d’un courrier : un gros oignon d’acier à deux cadrans, l’un au-dessus de l’autre. Celui du haut marquait l’heure où l’on était. Celui du bas marquait l’heure qu’il était au bord, ou plutôt l’heure qu’il devait être, puisque aucune montre ne pouvait la savoir : il avançait plus vite que l’autre selon la cote qu’on lui donnait, par une molette sur la tranche et un train de rouages que Jonas, en vingt-deux ans, n’avait jamais osé ouvrir. On le recalait à chaque palier sur la cote du Barème. En bas, le cadran du bord tournait comme une roue de moulin ; au bord, les deux aiguilles se remettaient à marcher du même pas, comme deux hommes qui se retrouvent après une dispute. Sur la paroi de la gare, sous la pendule, le Barème de la Compagnie était affiché dans son cadre de laiton, révisé au premier janvier, et la craie des révisions précédentes se voyait encore sous la peinture fraîche. Jonas nota l’heure locale sur sa feuille, vérifia la molette, referma le boîtier. Il le recalerait à l’Octroi.",
     "mentions": []
    },
    {
     "id": "c1-b68",
     "text": "La benne de la dernière section était une caisse de chêne ferrée, vitrée sur trois côtés, qui prenait douze passagers assis. Ce jour-là ils étaient quatre : Jonas ; un rentier très vieux en manteau de fourrure, accompagné d’un valet, qui remontait toucher trente ans d’intérêts et parlait déjà de redescendre la semaine suivante ; et une jeune femme en robe de servante, un balluchon sur les genoux, qui regardait par la vitre avec une telle fixité qu’on devinait qu’elle ne voyait rien. Une engagée qui avait fini son temps. Jonas en avait remonté des centaines. Il savait ce qu’elle faisait dans sa tête : elle traduisait. Ses jours de service en années de là-haut, les années en âges, les âges en visages ; son petit frère qui avait huit ans le jour de son départ et qui l’attendrait peut-être sur le quai avec une moustache. On n’arrive jamais au bon résultat. Jonas l’avait su bien avant d’être courrier. Il ne dit rien ; le serment des courriers ne parle pas de consoler.",
     "mentions": []
    },
    {
     "id": "c1-b69",
     "text": "La benne s’ébranla. Le câble, au-dessus du toit, se mit à siffler.",
     "mentions": []
    },
    {
     "id": "c1-b70",
     "text": "Aux jeunes qu’il formait, Jonas expliquait les Bennes par cette section-là, parce qu’on n’y comprend rien tant qu’on ne l’a pas prise. À la gare de Demeure, le câble passait dans ses poulies à hauteur d’homme, à la vitesse d’un cheval au trot ; à l’Octroi, deux cents mètres plus haut, le même câble au même instant se traînait au pas d’un bœuf. Il n’avait pas changé de vitesse : c’étaient les deux bouts qui n’avaient pas le même temps. Un câble qui irait d’une traite de Demeure au bord filerait en bas plus vite qu’un express lancé, et aucune poulie n’y résisterait. Alors on coupait : une section par palier, un moteur par section, une gare de transbordement à chaque cote. C’était pour cela que les courriers existaient. Les câbles ne passent pas les paliers, disait-il aux jeunes ; les hommes, si.",
     "mentions": []
    },
    {
     "id": "c1-b71",
     "text": "Par la vitre arrière, Demeure s’enfonça sous le Voile comme sous l’eau d’un lac, et on ne vit plus bientôt que la Tour du Fanal qui perçait la brume, droite, blanche, avec sa lanterne éteinte au sommet. À gauche de la voie, la Langue descendait à leur rencontre. Vue d’en bas, c’était un torrent comme un autre, écumant, sonore, qui dévalait vers les moulins. Mais à mesure que la benne montait, le torrent, derrière et au-dessous d’eux, ralentissait. Jonas ne s’en lassait pas, lui qui ne regardait jamais le Voile. L’eau se faisait plus épaisse, plus lisse, plus lente, jusqu’à ce qu’on ne sache plus si elle coulait : un ruban de verre gris, bombé, qui brillait sans bouger, où l’écume tenait en l’air comme de la laine. On ne voyait plus que de l’eau immobile à l’endroit où, cinq minutes plus tôt, on l’avait entendue rugir. Ce n’était pas l’eau qui avait changé. C’était eux.",
     "mentions": []
    },
    {
     "id": "c1-b72",
     "text": "De l’autre côté du ravin, sur le versant d’en face, on distinguait les lacets de la vieille Rampe des Premiers, un trait pâle qui allait et venait sous les ronces, presque à plat, d’un bout à l’autre de la pente, comme si ceux qui l’avaient tracée n’avaient jamais voulu arriver en bas. Plus personne n’y passait, sauf les chèvres et les contrebandiers. Le vieux rentier dormait. La servante regardait la Langue sans la voir.",
     "mentions": []
    },
    {
     "id": "c1-b73",
     "text": "À l’Octroi, il y avait la douane, et la douane avait ses rites. On descendait de la benne, on passait sous le porche où était gravée la devise des courriers, QUI DESCEND REMONTE, on présentait sa feuille, on ouvrait son sac. Les préposés portaient la veste bleue à parements jaunes et une montre à cadran unique qu’ils ne recalaient jamais puisqu’ils ne bougeaient pas. Le chef de poste, un grand Terrassien nommé Lhermite, connaissait Jonas depuis dix ans. Il lui demanda des nouvelles de Colombe, lui dit qu’il avait mauvaise mine, lui fit signer le registre des passages. Jonas recala sa montre. Derrière eux, dans la gare de tête de la dernière section, la grande poulie tournait dans son bâti de fonte, et le câble, en s’y enroulant, faisait entendre une note, une seule, haute et tenue, comme un doigt mouillé sur le bord d’un verre.",
     "mentions": []
    },

     "text": "— Il chante, dit Jonas.",

    },

     "text": "— Depuis l’automne, dit Lhermite. Les ingénieurs disent que c’est le froid.",

     "mentions": []

    {
     "id": "c1-b78",
     "text": "Jonas attendit la benne de la section suivante dans la salle des pas perdus, où l’on servait un café noir qui avait la réputation de ne jamais refroidir ; c’était une plaisanterie de l’Octroi, il refroidissait comme partout. Dans la cour, sous la neige fondue, la grande roue de la Vanne des Premiers dressait ses rayons de fer rouillé au-dessus du canal de la Langue. Personne ne l’avait tournée depuis quatre siècles, et les préposés y pendaient leurs capotes pour les faire sécher. Par les baies, on voyait le fond : Demeure n’était plus qu’une tache de lait au milieu de la cuvette, et, si l’on savait où regarder, la pointe de la Tour. Au centre, on ne voyait pas l’Ombilic ; on voyait seulement l’endroit où le regard glissait.",
     "mentions": []
    },
    {
     "id": "c1-b79",
     "text": "Mi-Pente passa, puis les Terrasses, dans le bruit des transbordements et le vertige léger, toujours le même, de passer un cran. Aux Terrasses, la nuit tomba sur les vergers un peu trop vite, comme tombent les nuits là-bas ; au dernier transbordement, Jonas se mit à la vitre et regarda la Margelle venir à lui dans le noir, la ligne de feux de Surplomb posée au bord de la cuvette comme un collier sur une table. Il recala une dernière fois. Les deux cadrans se mirent à marcher ensemble.",
     "mentions": []
    },
    {
     "id": "c1-b80",
     "text": "Il arriva à la gare de Surplomb à six heures du matin, par un froid qui coupait les lèvres, et alla, comme tout courrier au retour, pointer au bureau du contrôle.",
     "mentions": []
    },
    {
     "id": "c1-b81",
     "text": "Le contrôleur de nuit s’appelait Bastide. Il avait des moustaches jaunies par la pipe, un registre ouvert devant lui et, sur son bureau, un boulier dont il ne se servait pas. Il prit la feuille de course, la tourna vers la lampe, regarda l’heure de départ, les visas, les heures locales de chaque palier, et fit la conversion de tête, comme tous les contrôleurs, en remuant les lèvres.",
     "mentions": []
    },
    {
     "id": "c1-b82",
     "text": "— Mérel, dit-il. Trois jours.",
     "mentions": []
    },
    {
     "id": "c1-b83",
     "text": "En vingt ans de courses, Jonas n’était jamais rentré avec plus de quelques heures d’écart, jusqu’à l’automne ; depuis l’automne, il savait pourquoi il rentrait en retard. Il posa sa double montre sur le registre, cadran du bord vers le haut. Il avait recalé à chaque palier. Il avait relevé ses heures à la minute, comme on le lui avait appris, comme il l’apprenait maintenant aux jeunes. Il n’avait pris qu’une heure. Sa montre disait qu’on était le 3 mars. Le calendrier du contrôle, au mur, disait 6 mars, et la neige sur le quai disait la même chose que le calendrier.",
     "mentions": []
    },
    {
     "id": "c1-b84",
     "text": "— Ta montre ment, dit Bastide.",
     "mentions": []
    },
    {
     "id": "c1-b85",
     "text": "— Ma montre fait ce que dit le Barème.",
     "mentions": []
    },
    {
     "id": "c1-b86",
     "text": "— Alors c’est toi, parce que le Barème, lui, on le révise. Tu es resté deux heures avec ta petite, comme les autres fois. Je ne te juge pas, Mérel. Mais c’est le troisième depuis l’automne. Tu connais le règlement. Suspendu de longues jusqu’à la commission.",
     "mentions": []
    },
    {
     "id": "c1-b87",
     "text": "— Je n’ai pris qu’une heure.",
     "mentions": []
    },
    {
     "id": "c1-b88",
     "text": "— Dis-le à la commission, dit Bastide, sans méchanceté, en écrivant. Ils ont tous du retard, depuis l’hiver. Les jeunes surtout. Ça traîne en bas, ça ne sait plus convertir. La Vaudrey a doublé les amendes. Ta vieille patronne ne rigole plus, depuis qu’elle est directrice. Signe là.",
     "mentions": []
    },
    {
     "id": "c1-b89",
     "text": "Jonas signa là.",
     "mentions": []
    },
    {
     "id": "c1-b90",
     "text": "En sortant du bureau, il passa devant le grand tableau de la salle des départs, où la Compagnie affichait ses avis. Il y en avait un nouveau, plusieurs feuilles collées côte à côte, les colles encore humides, et des gens devant, en manteau, qui lisaient sans parler. Liste provisoire des résidents de Demeure non inscrits pour la remontée, établie en vue de la loi en discussion. Des noms par ordre alphabétique, avec la qualité et l’adresse. Des rentiers, surtout ; des juges ; des domestiques. Il n’avait pas l’intention de lire. Il lut. Aux M, entre un Menou, rentier, et un Mesplède, cocher, il y avait une ligne : Mérel, Adeline, engagée, Maison d’Attente.",
     "mentions": []
    },
    {
     "id": "c1-b91",
     "text": "Il ne fut pas surpris. C’est ce qui le surprit.",
     "mentions": []
    },
    {
     "id": "c1-b92",
     "text": "Il rentra chez lui à pied, par la rue des Cordiers, dans le jour qui se levait, gris, bas, lourd de neige. Il habitait deux pièces au troisième étage, au-dessus d’un marchand de cordes, dont la cuisine donnait sur le Val ; il y habitait depuis qu’il était né. Il ne se coucha pas. Il ralluma le poêle, mit de l’eau à chauffer, poussa au bout de la table, pour faire de la place, la boîte à souliers où s’entassaient les enveloppes du Comptoir qu’il n’ouvrait jamais, étala sa feuille de course et une feuille blanche, et il fit ce qu’il faisait depuis toujours quand une chose lui faisait peur : il la traduisit.",
     "mentions": []
    },
    {
     "id": "c1-b93",
     "text": "Ses heures d’en bas, palier par palier, converties au Barème en jours d’en haut. Il obtenait le retour qu’on attendait de lui. Il recommença, lentement, en vérifiant chaque ligne, en ajoutant tout ce qu’il pouvait ajouter de bonne foi, les attentes aux gares, la douane, le quart d’heure à la Chambre où le greffier avait cherché ses lunettes. Il manquait toujours trois jours. Trois jours ne se perdent pas dans une retenue.",
     "mentions": []
    },
    {
     "id": "c1-b94",
     "text": "La réponse était sur la feuille, à la ligne de Demeure : c’était la seule assez grosse pour les avaler. Il posa la question à l’envers : quelle cote faudrait-il là-bas pour que ses heures fassent le compte ? La réponse tombait en trois opérations, et elle n’était pas celle du Barème. Elle était de cent.",
     "mentions": []
    },
    {
     "id": "c1-b95",
     "text": "Il posa sa plume. Par la fenêtre, sous la neige qui commençait, au fond du Val, on voyait la tache de lait de Demeure, pâle comme une braise sous la cendre, la Tour, et au sommet de la Tour une lueur qui n’était pas là une minute plus tôt. Le Fanal battait. Une heure venait de passer en bas. Il resterait allumé jusqu’au milieu de la matinée, longtemps, trop longtemps, lui semblait-il, pour un feu d’une minute, et ne se rallumerait pas avant quatre jours. Enfant, il le voyait s’éteindre plus vite. Enfant, il le regardait tous les soirs.",
     "mentions": []
    },
    {
     "id": "c1-b96",
     "text": "Il retourna sa feuille de course. Au dos, en bas, là où les courriers notent leurs réclamations, il écrivit une ligne, de sa petite écriture droite, sans savoir pour qui :",
     "mentions": []
    },
    {
     "id": "c1-b97",
     "text": "Surplomb, 6 mars, six heures du matin. Pour elles, en bas, il est neuf heures du soir. Ici, il neige.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-2",
   "number": 2,
   "title": "La porte de la lingerie",
   "blocks": [
    {
     "id": "c2-b01",
     "text": "À Demeure, il était huit heures moins dix du soir, le 3 274ᵉ jour. Là-haut, à Surplomb, on devait être le 1ᵉʳ mars, et Jonas était encore sur la Pente.",
     "mentions": []
    },
    {
     "id": "c2-b02",
     "text": "Adeline attendit que le portail ait claqué pour sortir de la lingerie. Elle traversa la salle entre les deux rangées de lits en lissant son tablier, salua le vieux Brisson qui lui demanda si c’était encore le courrier, lui répondit que oui, c’était encore le courrier, et vint s’asseoir sur le lit de Colombe à l’endroit exact où il s’était assis. La couverture était tiède. Elle y posa la main à plat, comme on vérifie si un four est chaud, et la laissa là.",
     "mentions": []
    },
    {
     "id": "c2-b03",
     "text": "— Tu étais dans la lingerie, dit Colombe. J’ai fait le jeu.",
     "mentions": []
    },
    {
     "id": "c2-b04",
     "text": "— Quel jeu ?",
     "mentions": []
    },
    {
     "id": "c2-b05",
     "text": "— Le jeu de la lingerie. Quand papa vient, tu te caches, et moi je dis que tu es de repos. C’est moi qui l’ai inventé. Il ne se doute de rien.",
     "mentions": []
    },
    {
     "id": "c2-b06",
     "text": "Adeline ne dit rien. Elle n’avait jamais demandé à l’enfant de mentir pour elle ; elle s’était seulement arrangée, soixante et un jours durant, pour être derrière une porte chaque fois qu’un homme montait l’escalier. Les enfants voient les arrangements. Ils en font des règles.",
     "mentions": []
    },
    {
     "id": "c2-b07",
     "text": "— Pourquoi tu te caches ? dit Colombe.",
     "mentions": []
    },
    {
     "id": "c2-b08",
     "text": "— À ton avis ?",
     "mentions": []
    },
    {
     "id": "c2-b09",
     "text": "— Tu es amoureuse de lui, dit Colombe avec la gravité d’un médecin. C’est une théorie. Ça expliquerait tout.",
     "mentions": []
    },
    {
     "id": "c2-b10",
     "text": "— Ça expliquerait beaucoup de choses, dit Adeline.",
     "mentions": []
    },
    {
     "id": "c2-b11",
     "text": "Colombe hocha la tête, satisfaite qu’on reconnaisse la solidité de son raisonnement, et tendit la toupie de fer-blanc pour qu’on la lance. Adeline enfonça la tige, trois coups secs, le pouce sur le bouton, la main ouverte au-dessus pour la lâcher droite, et la toupie traversa l’allée en bourdonnant. Elle avait vu Jonas faire ce geste par l’entrebâillement, tout à l’heure. C’était le geste de son père à lui, le geste exact, avec la même manière de se mordre la lèvre en appuyant. Jonas ne pouvait pas le savoir. Il avait neuf ans quand son père était mort.",
     "mentions": []
    },
    {
     "id": "c2-b12",
     "text": "— Je lui ai appris le jeu des battements, dit Colombe.",
     "mentions": []
    },
    {
     "id": "c2-b13",
     "text": "Adeline avait les mains sur les genoux. Elle les y laissa.",
     "mentions": []
    },
    {
     "id": "c2-b14",
     "text": "— Et qu’est-ce qu’il a dit ?",
     "mentions": []
    },
    {
     "id": "c2-b15",
     "text": "— Que c’était beaucoup, sept cent vingt. Il a fait tomber la toupie.",
     "mentions": []
    },
    {
     "id": "c2-b16",
     "text": "Elle le savait. Elle avait entendu, derrière la porte : la petite voix qui récitait la règle, puis rien, puis le bruit du fer-blanc sur la couverture. C’était un jeu qu’elle apprenait à tous les enfants de la salle, parce qu’il faut bien leur donner quelque chose à faire de l’attente, et les enfants aiment les règles qui ont des nombres. Elle n’avait pas pensé, en l’apprenant à Colombe, que Colombe le lui répéterait. Ou elle y avait pensé. Elle ne savait plus très bien, à son âge, faire la différence entre ce qu’elle craignait et ce qu’elle espérait ; les deux lui serraient la gorge au même endroit.",
     "mentions": []
    },
    {
     "id": "c2-b17",
     "text": "Son fils avait quarante et un ans. Elle en avait trente-cinq et demi.",
     "mentions": []
    },
    {
     "id": "c2-b18",
     "text": "Elle ne s’y faisait pas. Ce n’était pas le chiffre ; les chiffres, en bas, tout le monde y était habitué, on en plaisantait aux lavoirs, on disait d’une telle qu’elle avait marié un homme de trois cents ans pour ses rentes et qu’elle en ferait bien trois cents de plus. C’était la nuque. Il s’était accroupi pour que Colombe lui arrache son cheveu blanc, et elle avait vu sa nuque, qui était celle d’un homme, épaisse, marquée d’un pli, rougie par le col, et elle avait pensé, avec une précision de couturière : il y a six mois, pour moi, elle tenait dans ma main.",
     "mentions": []
    },
    {
     "id": "c2-b19",
     "text": "Six mois. Pour lui, trente-deux ans.",
     "mentions": []
    },
    {
     "id": "c2-b20",
     "text": "La salle des Attendants sentait le linge chaud, l’eau de fleur d’oranger et, en dessous, ce que sentent toutes les maisons de malades, une odeur de fer et de patience. Vingt-quatre lits. Dans le premier, à gauche, le vieux Brisson attendait depuis cent vingt ans de là-haut une médecine pour ses poumons et lisait les journaux avec un intérêt de parieur. Dans le troisième, une jeune femme de Mi-Pente attendait qu’on sache recoudre le cœur. Dans le dernier, sous la lucarne, Lucien, neuf ans, attendait qu’on sache fermer le trou qu’il avait dans le sien ; il avait peur du noir, et Adeline laissait brûler pour lui, toute la nuit, une lampe à mèche basse qu’elle payait de ses gages. Les autres attendaient d’autres choses. Tout le monde attendait. Adeline faisait les lits, vidait les pots, servait la soupe, tenait les cuvettes pour Salvat et, le soir, racontait des histoires aux six enfants de la salle.",
     "mentions": []
    },
    {
     "id": "c2-b21",
     "text": "On l’appelait Madame Line. Le nom venait du premier soir.",
     "mentions": []
    },
    {
     "id": "c2-b22",
     "text": "C’était le cent vingt-quatrième jour. Elle était encore chez les Vautre, et Madame l’avait envoyée porter à la Maison d’Attente un ballot de draps usés, par charité, parce que les dames de Demeure donnaient leur vieux linge aux malades comme on donne des sous aux pauvres, en le faisant savoir. L’intendante, madame Rougier, était occupée à l’accueil avec une admission ; le registre était ouvert sur la tablette, l’encre pas sèche. Adeline posa les draps et, parce qu’on lit ce qui est ouvert, elle lut. Mérel, Colombe, six ans. Langueur blanche. Père : Jonas Mérel, courrier de la Compagnie, rue des Cordiers, Surplomb. Mère : décédée.",
     "mentions": []
    },
    {
     "id": "c2-b23",
     "text": "Elle reconnut le nom avant de reconnaître quoi que ce soit d’autre. Le nom, l’adresse, la rue, le troisième étage au-dessus du cordier, la cuisine sur le Val ; elle eut le temps de penser rue des Cordiers, il y est encore, et le temps de penser courrier, il est courrier, et le temps de penser six ans, et c’est seulement alors qu’elle entendit le pas dans l’escalier. Un pas d’homme lourd, qui posait le pied à plat, en entier, sur chaque marche, comme son père à lui, comme un charpentier sur une poutre. Elle leva les yeux. Un homme de trente ans montait avec une petite fille sur le bras, une petite fille qui dormait la bouche ouverte, et l’homme avait le front de son mari et le menton de la tante Berthe, et il ne la regarda pas, parce qu’il ne regardait que la marche suivante.",
     "mentions": []
    },
    {
     "id": "c2-b24",
     "text": "Madame Rougier revint, s’excusa, demanda à la porteuse de draps si elle cherchait de l’ouvrage, parce qu’on manquait de bras à l’étage. Et comment vous appelez-vous ? Adeline avait dit « Ade… », et puis, dans l’escalier, l’homme avait tourné vers le palier du deuxième, et elle avait dit : « Line ». Madame Rougier avait écrit Line, sans nom de famille ; les engagés n’en ont pas toujours. Le lendemain, Adeline avait rendu son tablier aux Vautre, sous les yeux ronds de Madame qui ne comprenait pas qu’on quitte une grande maison pour des malades, et elle était revenue à la Maison d’Attente avec son baluchon. Cela faisait soixante et un jours.",
     "mentions": []
    },
    {
     "id": "c2-b25",
     "text": "— Raconte les Marcheurs, dit Colombe.",
     "mentions": []
    },
    {
     "id": "c2-b26",
     "text": "— Je te l’ai racontée hier.",
     "mentions": []
    },
    {
     "id": "c2-b27",
     "text": "— Pas la fin.",
     "mentions": []
    },
    {
     "id": "c2-b28",
     "text": "— Il n’y a pas de fin. C’est ce qui est bien.",
     "mentions": []
    },
    {
     "id": "c2-b29",
     "text": "Colombe se coucha sur le côté, la toupie contre la joue, ce qui voulait dire qu’elle allait écouter, et dans les lits voisins trois enfants se tournèrent du même côté. Adeline raconta. Elle racontait toujours de la même manière, parce que les enfants veulent les mêmes mots. Avant les Premiers, avant la Charte, avant qu’il y ait Surplomb et les Bennes et même les chèvres des Terrasses, il y avait eu dans le Val un autre peuple, qui ne savait pas ce qu’était la Pente. Sept d’entre eux s’étaient mis en marche un jour, du milieu du Val vers là où serait un jour Demeure, en manteaux de peaux, avec des ballots sur le dos, et ils marchaient encore. Ils venaient vers nous. On ne les voyait pas bien, d’ordinaire, parce que l’Ombilic est noir. Mais la Nuit des Lampes, quand toute la ville allumait ses lampes au bord, on les voyait mieux, sept silhouettes un pied en l’air, parce que l’Ombilic rend la lumière qu’on lui donne, seulement il la rend en retard : ce qu’on voyait, c’étaient les lampes de la Nuit d’avant. On éclairait pour l’an prochain.",
     "mentions": []
    },
    {
     "id": "c2-b30",
     "text": "— Et quand ils arriveront ?",
     "mentions": []
    },
    {
     "id": "c2-b31",
     "text": "— Ils nous diront bonjour.",
     "mentions": []
    },
    {
     "id": "c2-b32",
     "text": "— Et après ?",
     "mentions": []
    },
    {
     "id": "c2-b33",
     "text": "— Après, c’est ce qu’on ne sait pas.",
     "mentions": []
    },
    {
     "id": "c2-b34",
     "text": "— C’est ça, la fin, dit Colombe avec satisfaction.",
     "mentions": []
    },
    {
     "id": "c2-b35",
     "text": "Elle ferma les yeux. Au dernier lit, Lucien demanda si on allait bientôt éteindre, et Adeline dit que non, qu’on n’éteignait jamais, et elle alla remonter un peu la mèche de sa lampe. Puis elle se rassit. Par les trois fenêtres du fond, le Voile blanchit, blanchit, fut blanc à faire mal, puis grisa, fonça, et remonta. Elle regarda la pendule au-dessus de la porte. Elle regardait souvent la pendule, le soir, et elle avait pris l’habitude, qu’elle ne s’avouait pas, de compter les ciels d’une grande aiguille à l’autre.",
     "mentions": []
    },
    {
     "id": "c2-b36",
     "text": "Elle en compta quatre dans l’heure, et le début d’un cinquième.",
     "mentions": []
    },
    {
     "id": "c2-b37",
     "text": "Quand elle était arrivée, il y en avait deux et demi.",
     "mentions": []
    },
    {
     "id": "c2-b38",
     "text": "Elle s’en souvenait parce que, les premiers jours, chez les Vautre, elle ne faisait que ça : compter. À la fenêtre de la souillarde, chaque battement du Voile était un jour de là-haut, et chaque jour de là-haut était un jour de Jonas, un jour où il se levait, allait à l’école de la rue des Cordiers avec son cartable qui lui battait les reins, se tenait trop droit en classe parce que sa mère était partie et qu’il ne voulait pas qu’on le plaigne, rentrait chez la tante Berthe manger la soupe. Un ciel, et elle se disait : voilà, il a fait une journée. Sept ciels, et elle se disait : voilà, il a fait sa semaine. Puis elle avait arrêté de compter les ciels, parce qu’on en devient folle, et elle s’était mise à compter les heures, à la cloche de la Chambre, au Fanal. C’était plus supportable. C’étaient des nombres qu’on pouvait porter.",
     "mentions": []
    },
    {
     "id": "c2-b39",
     "text": "Maintenant, le Voile battait presque deux fois plus vite. On appelait cela la Hausse. Les rentiers en parlaient à table comme d’un bon placement, parce qu’à chaque ciel leurs intérêts couraient un jour de plus, et Madame de Vautre, disait-on, levait son verre à l’Ombilic tous les soirs. Adeline ne savait pas ce que cela voulait dire. Elle savait seulement que, pendant qu’elle était assise sur ce lit, là-haut, les jours passaient plus nombreux qu’avant ; que son fils, s’il était remonté, avait déjà mangé une semaine de soupes ; que la toupie de fer-blanc de tout à l’heure était déjà vieille, quelque part, sur l’étal d’un marchand. Elle posa la main sur la couverture, à l’endroit où la tiédeur s’en allait.",
     "mentions": []
    },
    {
     "id": "c2-b40",
     "text": "Le docteur Salvat fit sa dernière tournée à neuf heures. Il avait reboutonné sa blouse, de travers dans l’autre sens. Il s’arrêta longuement au lit de Lucien, qui ne dormait pas et qui lui demanda si son trou avait grossi, puis revint vers Colombe, qui dormait, et il fit signe à Adeline de le suivre dans le couloir.",
     "mentions": []
    },
    {
     "id": "c2-b41",
     "text": "— Il l’a payée, dit-il.",
     "mentions": []
    },
    {
     "id": "c2-b42",
     "text": "— Je sais. J’ai entendu.",
     "mentions": []
    },
    {
     "id": "c2-b43",
     "text": "— Vous entendez tout, dans cette lingerie. Vous devriez me prêter l’entrebâillement, un jour. Il faut qu’elle remonte avant l’été de là-haut, Line. Au Barème, cela nous laisse un peu plus d’un jour. À ma pile de revues, je ne sais pas. J’ai lu ce matin un article de janvier qui répondait à un article de décembre que j’avais lu hier soir. Ou bien ils écrivent vite, là-haut, ou bien c’est nous.",
     "mentions": []
    },
    {
     "id": "c2-b44",
     "text": "— Et s’il ne revient pas à temps ?",
     "mentions": []
    },
    {
     "id": "c2-b45",
     "text": "Salvat retira ses lunettes et les essuya sur sa blouse, ce qui était sa façon de prendre le temps de choisir ses mots.",
     "mentions": []
    },
    {
     "id": "c2-b46",
     "text": "— Il reviendra. Il revient toujours, c’est même la seule chose qu’on puisse dire de lui avec certitude. Mais je vous préviens, pour qu’il n’y ait pas de malentendu : si vous pensez de nouveau à votre fondation anonyme, oubliez-la. Il l’a refusée il y a trois ans sans même demander qui la finançait. Il la refuserait encore. Il y a des hommes qu’on ne peut aider qu’en leur laissant payer.",
     "mentions": []
    },
    {
     "id": "c2-b47",
     "text": "Il remit ses lunettes et partit dans l’escalier.",
     "mentions": []
    },
    {
     "id": "c2-b48",
     "text": "Elle alla à la lingerie. C’était une pièce longue et étroite, blanche, avec des étagères jusqu’au plafond, une table à repasser, deux fers qui chauffaient sur un réchaud, et, au fond, sous la lucarne, un tabouret sur lequel personne ne s’asseyait sauf elle. Elle avait posé son châle sur le tabouret avant la visite, comme toujours, et elle l’y retrouva. Elle sortit de la poche du châle ce qu’elle en sortait toujours à cette heure-là : une clé.",
     "mentions": []
    },
    {
     "id": "c2-b49",
     "text": "C’était une clé de fer noir, longue comme un doigt, avec un anneau usé. La clé de l’appartement de la rue des Cordiers. Elle l’avait emportée en descendant, le 3 mars 450, parce qu’on emporte ses clés, parce qu’on revient. Elle savait maintenant qui habitait l’appartement ; c’était écrit dans le registre de madame Rougier. Elle ne savait pas s’il avait changé la serrure. On change les serrures, en trente-deux ans. Elle serrait la clé dans sa main, le soir, comme d’autres disent leurs prières, et cela ne servait à rien, et elle le faisait quand même.",
     "mentions": []
    },
    {
     "id": "c2-b50",
     "text": "Elle s’était engagée pour trente jours. Il fallait s’en souvenir, parce que ce n’était pas une excuse, c’était un fait. Le charpentier était mort en décembre 449, écrasé sous une ferme qu’on levait au Guet, et il avait laissé des dettes de charpentier, qui sont des dettes de bois, de clous, de compagnons à payer, et une veuve de trente-quatre ans avec un garçon de neuf ans et deux pièces sur le Val. Au printemps, l’huissier était passé deux fois. La maison de Vautre cherchait une femme de chambre pour le fond : trente jours de service, payés au jour de là-haut, cinq ans de gages d’un seul coup, versés au Comptoir au nom de l’enfant. Trente jours. Un mois de sa vie. Elle avait fait le compte sur la table de la cuisine, en colonnes, à l’encre. Elle avait pensé : il aura quatorze ans, les dettes seront payées, il aura de quoi apprendre un métier, et je le retrouverai grand. On pense ces choses-là. On pense que la grandeur d’un enfant, c’est une taille.",
     "mentions": []
    },
    {
     "id": "c2-b51",
     "text": "La veille de son départ, elle lui avait montré le Fanal, par la fenêtre de la cuisine. Chaque fois qu’il s’allume, c’est une heure pour moi. Compte-les. Quand tu en auras compté sept cent vingt, je serai là.",
     "mentions": []
    },
    {
     "id": "c2-b52",
     "text": "Elle ne s’en souvenait pas avec les mots. Elle s’en souvenait avec la main de Jonas, qui tenait le rebord de la fenêtre, et qui était petite.",
     "mentions": []
    },
    {
     "id": "c2-b53",
     "text": "La courrière qui l’avait descendue, une grande femme brune et maigre qui ne parlait pas, lui avait tendu son mouchoir sur toute la longueur de la dernière section, sans rien dire, et le lui avait laissé. Elle s’appelait Vaudrey. C’était elle qui devait la remonter.",
     "mentions": []
    },
    {
     "id": "c2-b54",
     "text": "Au vingt-neuvième jour, Madame de Vautre avait fait baptiser son dernier-né, et le soir du baptême, dans l’office où l’on rinçait les verres, elle avait demandé à Adeline, gentiment, comme on demande un service, si elle voulait bien rester un jour de plus pour aider aux relevailles. Un jour. Un jour ici, c’étaient deux mois de gages là-haut. Deux mois de gages pour Jonas, en échange d’un jour. Elle avait fait le compte dans sa tête, en essuyant un verre, et elle avait dit oui. C’était pour lui. Elle le croyait. C’était vrai.",
     "mentions": []
    },
    {
     "id": "c2-b55",
     "text": "Le trentième jour, la grande femme brune était venue la chercher à la grille, avec son sac de courrière et sa double montre, et Adeline lui avait dit : demain. Vaudrey l’avait regardée longtemps, sans rien dire, comme dans la benne. Puis elle était repartie seule.",
     "mentions": []
    },
    {
     "id": "c2-b56",
     "text": "Le trente et unième jour, Jonas avait deux mois de plus que le jour où elle aurait dû être sur le quai. Il faudrait les expliquer, ces deux mois. Elle s’était dit : demain. Le lendemain, il y en avait quatre à expliquer, et elle s’était dit : demain. Chaque jour qu’elle ne remontait pas rendait le suivant plus impossible, parce qu’il fallait expliquer un jour de plus, et que ce jour-là en valait soixante. C’était comme les intérêts au Comptoir, que l’homme d’affaires de Madame calculait chaque matin et qui grossissaient sur eux-mêmes. La honte aussi se composait. Au bout de cinquante jours, elle ne pouvait plus remonter pour un garçon ; il aurait fallu remonter pour un jeune homme de dix-sept ans qu’elle ne connaissait pas. Au bout de cent, pour un homme.",
     "mentions": []
    },
    {
     "id": "c2-b57",
     "text": "Il était venu, une fois. Elle ne l’avait su que plus tard, par le cocher de Madame, qui avait vu un grand garçon en uniforme de courrier poser des questions à la grille et repartir sans attendre la réponse. Elle avait fait le compte : il devait avoir vingt ans. Elle jouait dans le jardin avec les petits de Vautre ce jour-là, elle leur apprenait à sauter à la corde. Elle se demandait souvent ce qu’il avait vu.",
     "mentions": []
    },
    {
     "id": "c2-b58",
     "text": "Elle remit la clé dans la poche du châle.",
     "mentions": []
    },
    {
     "id": "c2-b59",
     "text": "À dix heures, la cloche de la Chambre sonna, et on monta le sac du soir. À la Maison, c’était madame Rougier qui le recevait des mains du porteur de la gare, et c’était Adeline qui le triait, parce qu’elle savait lire et qu’elle avait les mains propres. On étalait tout sur la grande table du réfectoire : les lettres pour les malades, les colis, les revues de Salvat, et les journaux, surtout les journaux, que le vieux Brisson attendait comme d’autres attendent la messe. La Gazette de Surplomb, l’Écho de la Margelle, le Moniteur des Comptoirs. Près de trois mois de chaque. De la mi-décembre au 10 mars.",
     "mentions": []
    },
    {
     "id": "c2-b60",
     "text": "Elle les rangea par dates, comme on le lui avait appris. Décembre d’abord : les illuminations de la place du Guet, un froid à fendre les pierres, un chanteur mort que toute la ville, visiblement, avait aimé. Janvier : le nouveau Barème de la Compagnie, en pleine page, et à côté une colonne signée A. Pagès, prévisionniste de l’Observatoire du Guet, qui expliquait avec beaucoup de chiffres que l’Enfoncement suivait une courbe « parfaitement régulière » et que le front, s’il se formait, ne serait pas à craindre avant l’automne. Février : l’Assemblée de la Margelle, séance après séance, sur le projet de loi « relatif aux biens des absents de longue durée », et la Gazette qui titrait LA FIN DE LA MAINMORTE ?, avec un point d’interrogation qui ne trompait personne. Mars : le 5, sur deux pages, la liste provisoire des résidents de Demeure non inscrits pour la remontée.",
     "mentions": []
    },
    {
     "id": "c2-b61",
     "text": "Elle la parcourut comme on parcourt une liste de morts, en cherchant les noms qu’on connaît. Il y avait Madame de Vautre et toute sa maison, les cuisinières, le cocher. Il y avait les juges de la Chambre, en tête, par ordre d’ancienneté. Il y avait Brisson. Aux M, entre un Menou et un Mesplède : Mérel, Adeline, engagée, Maison d’Attente.",
     "mentions": []
    },
    {
     "id": "c2-b62",
     "text": "Elle lut son nom deux fois. Il était écrit correctement. Il était imprimé à Surplomb, sur du papier qu’on vendait dans les rues, sous les yeux de tout le monde. Il suffisait qu’on soit tombé dessus.",
     "mentions": []
    },
    {
     "id": "c2-b63",
     "text": "Dans le numéro du 7, en page deux, encadré de noir comme un faire-part :",
     "mentions": []
    },
    {
     "id": "c2-b64",
     "text": "COMPAGNIE DES PALIERS — AVIS AU PUBLIC. En application du projet de loi en discussion, le service public des Bennes sera suspendu sur toute la hauteur de la Pente à compter du 1ᵉʳ mai 482. Tout résident de Demeure qui en fera la demande, lui-même ou par sa famille, avant le 10 avril, sera remonté aux frais de la Compagnie par le dernier convoi officiel, le 18 avril. Après le 1ᵉʳ mai, seuls circuleront les convois de service. La Direction : H. Vaudrey.",
     "mentions": []
    },
    {
     "id": "c2-b65",
     "text": "Adeline relut. Puis elle fit ce que tout le monde faisait, en bas, devant une date de là-haut : elle la convertit.",
     "mentions": []
    },
    {
     "id": "c2-b66",
     "text": "Le 10 avril. D’ici là, un mois. À la cote de ce soir, six heures de Demeure, à peine. Avant l’aube.",
     "mentions": []
    },
    {
     "id": "c2-b67",
     "text": "Colombe était une malade. Pour l’inscrire, il fallait la signature de son père. Son père était là-haut, suspendu à une longue qui ne reviendrait pas avant juin, et il ne savait peut-être même pas lire les journaux ; si, il savait, il les lisait tous, il avait toujours tout lu. Il fallait qu’il ait vu l’avis. Il fallait qu’il ait signé. Il y avait six heures pour cela, et elle ne pouvait rien y faire.",
     "mentions": []
    },
    {
     "id": "c2-b68",
     "text": "Et son nom à elle était sur la liste, et pour l’en retirer, il suffisait d’une demande. Il suffisait d’aller à la Résidence, demain matin, et de dire : Adeline Mérel, engagée, je remonte. Elle regarda son nom encore. Elle ne se leva pas.",
     "mentions": []
    },
    {
     "id": "c2-b69",
     "text": "Au bout de la table, le vieux Brisson attendait sa Gazette en tapotant la nappe. Elle la lui tendit, et il la déplia avec un bruit de voile.",
     "mentions": []
    },
    {
     "id": "c2-b70",
     "text": "— Les Bennes ferment, dit-il au bout d’un moment. Au premier mai.",
     "mentions": []
    },
    {
     "id": "c2-b71",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b72",
     "text": "— C’est-à-dire demain matin, pour nous. On a vu pire. Il tourna la page, se mouilla le pouce. Et ils font la Hausse, là-haut, vous avez lu ? À ce train-là, ma médecine arrivera avant mon enterrement.",
     "mentions": []
    },
    {
     "id": "c2-b73",
     "text": "Elle monta coucher les derniers enfants. Colombe dormait en travers de son lit, la toupie tombée sur le carrelage ; Adeline la ramassa et la reposa sur l’étagère, à sa place dans la frise, à droite de la toupie de bois. Elle borda l’enfant. Elle resta un moment debout entre les lits, dans la pénombre, à écouter les vingt-quatre respirations de la salle, et au fond la lampe de Lucien qui faisait un rond jaune au plafond. Dans une heure, à la Tour, le sonneur allumerait le Fanal, et là-haut, par la fenêtre d’une cuisine qu’elle connaissait, quelqu’un le verrait peut-être.",
     "mentions": []
    },
    {
     "id": "c2-b74",
     "text": "Elle savait combien de fois il s’était allumé depuis qu’elle était descendue. Elle ne l’avait jamais dit à personne. Elle le savait comme on sait son âge.",
     "mentions": []
    },
    {
     "id": "c2-b75",
     "text": "Quatre mille quatre cent quarante-neuf.",
     "mentions": []
    },
    {
     "id": "c2-b76",
     "text": "À onze heures, la cloche de la Tour sonna. Elle ne vit pas le Fanal, de la salle ; elle vit seulement le Voile, au-dessus des fenêtres, se teinter un instant d’un jaune de lampe. Elle dit le nombre suivant, à voix basse, pour elle. Puis, parce que c’était idiot, parce que les nombres ne servaient à rien, parce que Jonas était remonté depuis trois heures, c’est-à-dire depuis deux semaines, et qu’il ne reviendrait jamais plus assez tôt, elle alla chercher dans le réfectoire la Gazette du 7 et découpa l’avis au public avec les ciseaux à ongles de madame Rougier.",
     "mentions": []
    },
    {
     "id": "c2-b77",
     "text": "Elle ne savait pas encore ce qu’elle en ferait. Elle savait qu’elle ne pouvait plus attendre.",

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
