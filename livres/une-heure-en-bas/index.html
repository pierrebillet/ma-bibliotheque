     "text": "Pagès s’en alla sans reprendre les feuilles. Jonas l’entendit descendre l’escalier à tâtons, puis la porte de la rue. Il resta à la fenêtre de la cuisine. Au fond du Val, sous la pluie, la tache de lait de Demeure pâlissait dans le noir, et la Tour n’avait pas de lueur. Il pensa à la caisse de chêne de la dernière section, à ses banquettes où l’on voyageait assis, à Soler, qui était petite. Le convoi partait dans dix jours. Pour elles, en bas, dans deux heures.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-4",
   "number": 4,
   "title": "Ce que dit la Doyenne",
   "blocks": [
    {
     "id": "c4-b01",
     "text": "À Demeure, il était deux heures et demie du matin, le 3 275ᵉ jour. Là-haut, à Surplomb, on devait être le 1ᵉʳ avril, et le Fanal, pour qui le guettait d’une fenêtre, ne battait plus que tous les cinq jours.",
     "mentions": []
    },
    {
     "id": "c4-b02",
     "text": "On gratta à la porte de la lingerie, du côté de l’escalier de service : deux coups d’ongle, un silence, un troisième. Adeline ne dormait pas. Elle avait passé la nuit sur son tabouret avec l’avis de la Compagnie, et elle n’en avait rien fait, sinon le plier et le replier jusqu’à ce qu’il tienne dans la poche du châle, contre la clé. Elle ouvrit. C’était Zélie, des lavoirs du bas, une lanterne à la main, les bras rouges jusqu’aux coudes. La Chaîne ne frappait jamais aux portes de devant.",
     "mentions": []
    },
    {
     "id": "c4-b03",
     "text": "— Les Berges prennent l’eau, dit Zélie. Il faut des bras.",
     "mentions": []
    },
    {
     "id": "c4-b04",
     "text": "— Il a plu ?",
     "mentions": []
    },
    {
     "id": "c4-b05",
     "text": "— Pas plus que d’habitude. C’est le torrent. Il a grossi tout seul, et en bas, ça ne s’écoule plus.",
     "mentions": []
    },
    {
     "id": "c4-b06",
     "text": "Dans la salle, Colombe dormait en travers de son lit, le poing fermé sur sa boîte à pastilles. Adeline lui remit sous la couverture un pied qui dépassait, jeta le châle sur ses épaules et descendit derrière la lanterne.",
     "mentions": []
    },
    {
     "id": "c4-b07",
     "text": "On entendait le torrent dès la place de la Chambre, où d’ordinaire on ne l’entendait pas plus que la bruine. Sous les arcades de la rue des Moulins, les meuniers avaient levé toutes leurs vannes, et les roues tournaient quand même trop vite, à vide, en jetant de l’eau jusqu’aux voûtes. Des gens remontaient avec des matelas sur la tête. Personne ne courait ; à Demeure, on ne courait pas. Adeline, qui avait mis des jours à le désapprendre, s’aperçut qu’elle courait.",
     "mentions": []
    },
    {
     "id": "c4-b08",
     "text": "La rue des Lavoirs était la dernière des Berges, celle qui descendait jusqu’au quai des Lampes et, après le quai, jusqu’à l’Ombilic. On s’était arrêté en haut, à l’angle, sur les pavés secs, en chemises de nuit, avec des seaux dont personne ne savait que faire. Plus bas, l’eau courait dans la rue à hauteur de cheville, vers le quai, comme elle avait toujours couru. Et plus bas encore, devant les lavoirs, elle cessait de courir. Elle s’épaississait, se faisait lisse et bombée, un verre gris posé sur les pavés, où l’écume tenait en l’air comme de la laine. Adeline avait vu cela cent fois à la Cascade. Jamais dans une rue.",
     "mentions": []
    },
    {
     "id": "c4-b09",
     "text": "Il restait du monde en bas. Une femme sortait de chez elle une chaise à bout de bras, et elle la sortait si lentement qu’on voyait chaque goutte quitter les barreaux et prendre son temps pour tomber. À sa fenêtre, un vieil homme faisait un signe de la main qui n’en finissait pas. Quand il appela, sa voix remonta jusqu’à eux, grave et étirée, si grave qu’on la sentait sous les pieds plus qu’on ne l’entendait. Le boulanger de la rue avait voulu aller le chercher. Il était assis sur une borne, les deux mains serrées autour des mollets, blanc, et il ne disait plus rien.",
     "mentions": []
    },
    {
     "id": "c4-b10",
     "text": "Et sur la marche d’une porte, en contrebas de la rue comme toutes les portes des Berges, il y avait une petite fille.",
     "mentions": []
    },
    {
     "id": "c4-b11",
     "text": "Elle était assise en chemise, les bras autour des genoux, les pieds dans l’eau, et elle regardait vers le quai. Elle était plus petite que Colombe. Elle leva la main pour s’essuyer le nez, et la main mit à monter jusqu’au visage le temps qu’il faut pour plier un drap. Sur le quai des Lampes, entre les grands réverbères de fête, un homme remontait vers elle, une perche sur l’épaule et une lanterne au poing.",
     "mentions": []
    },
    {
     "id": "c4-b12",
     "text": "— C’est l’allumeur, dit Zélie. C’est sa petite. Elle l’attend.",
     "mentions": []
    },
    {
     "id": "c4-b13",
     "text": "— Il remonte depuis quand ?",
     "mentions": []
    },
    {
     "id": "c4-b14",
     "text": "— Depuis qu’on est là.",
     "mentions": []
    },
    {
     "id": "c4-b15",
     "text": "Il n’était pas plus près.",
     "mentions": []
    },
    {
     "id": "c4-b16",
     "text": "Adeline aurait aimé pouvoir dire qu’elle avait réfléchi. Elle n’ôta même pas son châle. Elle descendit la rue.",
     "mentions": []
    },
    {
     "id": "c4-b17",
     "text": "Les premiers pas ne coûtèrent rien. L’eau était tiède, les pavés glissants comme toujours aux Berges. Puis, au milieu de la rue, son cœur se mit à battre à deux endroits. Aux tempes, vite et léger, comme d’habitude ; et aux chevilles, un autre, plus lourd, qui ne suivait pas, comme deux pendules dans la même cuisine qui ne tombent jamais d’accord. Ses jambes s’emplirent. Elle n’avait pas d’autre mot : elles s’emplissaient par le bas, comme des brocs sous la pompe, et elles brûlaient, et à mesure la tête se vidait et se mettait à bourdonner. Elle vit le pavé venir à sa rencontre, et comprit après coup que c’était elle qui tombait.",
     "mentions": []
    },
    {
     "id": "c4-b18",
     "text": "Elle tomba de tout son long dans l’eau tiède, la joue sur la pierre. Le bourdonnement s’éteignit. Au bout d’un moment, les deux cœurs n’en firent plus qu’un. Elle resta là, stupide, à écouter son sang reprendre un seul pas. Puis elle leva la tête pour voir la petite, et aux tempes le cœur repartit tout seul en avant, tandis qu’aux chevilles il traînait. Elle reposa la joue. Il revint.",
     "mentions": []
    },
    {
     "id": "c4-b19",
     "text": "Elle avait fait assez de lits pour savoir qu’on ne soigne personne debout. Elle ne se releva pas.",
     "mentions": []
    },
    {
     "id": "c4-b20",
     "text": "Elle rampa. Les coudes, les genoux, le ventre dans l’eau qui lui passait sur le dos en tirant vers le quai. Elle comptait, parce qu’il fallait bien occuper sa tête, comme elle comptait le Fanal, le soir : un, et un coude ; deux, et l’autre. Au seuil, il fallut tendre le bras vers le bas pour prendre la petite par le poignet, et la main s’en alla là-bas comme dans une neige épaisse ; quand elle la ramena, elle ne la sentait plus, et pourtant elle tenait le poignet. La petite la regarda sans surprise, avec des yeux lents.",
     "mentions": []
    },
    {
     "id": "c4-b21",
     "text": "— Couche-toi, dit Adeline.",
     "mentions": []
    },
    {
     "id": "c4-b22",
     "text": "— Ça mouille.",
     "mentions": []
    },
    {
     "id": "c4-b23",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c4-b24",
     "text": "Elle la tira contre elle, à plat. La petite se laissa faire, puis lui grimpa sur le dos, les bras autour de son cou, la joue contre son oreille ; elle ne pesait rien. Adeline tourna dans l’eau, sur le ventre, en cherchant les pavés du genou, et remonta. Bientôt elle entendit au-dessus d’elle les voix de l’angle, et à trente, des mains la prirent sous les bras et la tirèrent sur la pierre sèche.",
     "mentions": []
    },
    {
     "id": "c4-b25",
     "text": "— Un quart d’heure, dit Zélie. Tu es restée un quart d’heure là-dedans.",
     "mentions": []
    },
    {
     "id": "c4-b26",
     "text": "— J’ai compté trente.",
     "mentions": []
    },
    {
     "id": "c4-b27",
     "text": "— Le Voile a eu le temps de battre, dit Zélie, et elle lui tordit la frange du châle, par métier.",
     "mentions": []
    },
    {
     "id": "c4-b28",
     "text": "Ses jambes avaient gonflé sous la jupe et brûlaient comme après une journée de lessive debout ; elles dégonflaient à mesure qu’elle restait assise par terre. Sa main droite ne lui revenait pas ; elle la regardait comme une main qu’on lui aurait rendue après l’avoir empruntée. La petite ne voulait pas descendre de son dos. Derrière elles, Zélie s’était mise à plat ventre dans l’eau, puis deux garçons des tanneries, et on les vit descendre la rue en rampant vers la femme à la chaise et la fenêtre du vieil homme, et ralentir à mesure qu’ils descendaient.",
     "mentions": []
    },
    {
     "id": "c4-b29",
     "text": "En bas, l’allumeur montait toujours. Il avait vu, peut-être ; il avait pressé le pas, peut-être ; de si loin, et à cette allure, on ne pouvait pas le dire. Il avait levé le pied droit pour passer le rebord du quai, la perche sur l’épaule, la lanterne en avant, la bouche ouverte sur un nom. Adeline le regarda poser ce pied. Il ne le posa pas. Il ralentit encore dans son geste, et puis il n’y eut plus de geste : un homme debout sur une jambe au bord de l’Ombilic. La flamme de sa lanterne cessa de trembler et devint une langue jaune, immobile. Puis elle pâlit, sans s’éteindre, comme une lampe qu’on emporte au fond d’un couloir, et il n’y avait pas de couloir.",
     "mentions": []
    },
    {
     "id": "c4-b30",
     "text": "La petite avait tourné la tête pour regarder aussi.",
     "mentions": []
    },
    {
     "id": "c4-b31",
     "text": "— Il fait le Marcheur, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b32",
     "text": "Adeline ne répondit pas.",
     "mentions": []
    },
    {
     "id": "c4-b33",
     "text": "— C’est le jeu, dit la petite, avec la patience qu’on a pour les grandes personnes. Quand on le regarde, il ne bouge pas. Il faut se retourner.",
     "mentions": []
    },
    {
     "id": "c4-b34",
     "text": "Et elle cacha son visage dans le cou d’Adeline, pour qu’il puisse avancer.",
     "mentions": []
    },
    {
     "id": "c4-b35",
     "text": "Un peu avant quatre heures, la cloche de la Chambre se mit à sonner à la volée. Zélie, remontée de la rue d’en bas avec le vieil homme sur le dos, confia la petite à la boulangère et s’essuya les bras à sa jupe.",
     "mentions": []
    },
    {
     "id": "c4-b36",
     "text": "— Le sac de l’aube, dit-elle. Ils vont lire la loi.",
     "mentions": []
    },
    {
     "id": "c4-b37",
     "text": "La grande salle de la Haute Chambre était la seule pièce de Demeure où rien ne changeait jamais : des bancs de chêne noir, des murs de pierre blonde et, au fond, sur une estrade, la longue table des juges sous les lampes de cuivre. Les juges y étaient déjà, en robes noires à rabats d’une coupe qu’on ne voyait plus que sur les gravures. Adeline les avait vus, enfant, dans son livre d’histoire ; ils n’avaient pas pris une ride depuis, et elle en avait pris quelques-unes. Au milieu, la Doyenne : une vieille femme très droite, les cheveux blancs tirés, les mains posées à plat sur la table comme sur un drap qu’on vient de repasser.",
     "mentions": []
    },
    {
     "id": "c4-b38",
     "text": "La salle était pleine. Au premier rang, les rentiers en habit sortaient d’un souper : on fêtait la Hausse chez les Menou depuis minuit, et certains avaient gardé leur verre. Derrière, le reste de la ville en bonnets de nuit, qui n’avait pas encore pris son café. Au fond, debout contre les piliers, les engagés, et les gens des Berges qui mouillaient les dalles. Madame de Vautre portait un chapeau qu’Adeline ne lui connaissait pas, un petit bateau de feutre gris avec une aile d’oiseau piquée de travers : la dernière mode de Surplomb, c’est-à-dire celle du sac d’hier soir. Adeline s’adossa à un pilier. De ses jambes, il ne restait qu’une chaleur sous la peau, comme après les orties.",
     "mentions": []
    },
    {
     "id": "c4-b39",
     "text": "Le greffier était un homme très vieux dont les lunettes tenaient par un ruban. Il avait devant lui une pile de Moniteurs qui lui venait à l’épaule, et il lisait dans l’ordre, sans rien sauter, d’une voix égale. C’était la coutume : quand le sac apportait une loi, la Chambre la faisait lire en séance publique avec tous ses débats, pour que nul, à Demeure, ne puisse dire qu’il ne savait pas.",
     "mentions": []
    },
    {
     "id": "c4-b40",
     "text": "« Séance du 14 mars. M. Laborde, rapporteur : Il ne s’agit pas de punir le fond, messieurs. Il s’agit de cesser de lui verser des rentes sur notre travail. La moitié de la Margelle est au frais depuis quatre siècles ; il est temps de la sortir du cellier. (Rires. Applaudissements à gauche.) »",
     "mentions": []
    },
    {
     "id": "c4-b41",
     "text": "Personne ne rit dans la salle. Le greffier non plus ; il lisait les rires du même ton que le reste, et tournait la page.",
     "mentions": []
    },
    {
     "id": "c4-b42",
     "text": "« M. Dufresne : On ne ferme pas la porte d’une maison où des gens dorment. (Mouvements divers.) »",
     "mentions": []
    },
    {
     "id": "c4-b43",
     "text": "Il lut ainsi tout le mois : des pétitions, des chiffres, des orateurs qui s’étaient répondu à des semaines de distance et que Demeure entendait se répondre d’une phrase à l’autre. Il lut un amendement de M. Carrière, tendant à excepter de la loi les malades de la Maison d’Attente, et la réponse du rapporteur : « L’amendement est sans objet. La loi vise les biens, non les personnes ; les malades de la Maison d’Attente ne possèdent rien. (Très bien !) » L’amendement fut retiré. Adeline pensa à la lampe de Lucien, qui n’était même pas à lui.",
     "mentions": []
    },
    {
     "id": "c4-b44",
     "text": "« Audition de madame H. Vaudrey, directrice de la Compagnie des Paliers. »",
     "mentions": []
    },
    {
     "id": "c4-b45",
     "text": "Adeline n’entendit pas la suite. Elle entendit le nom, et vit une grande femme brune assise en face d’elle dans une benne, qui ne parlait pas et lui tendait un mouchoir. Elle avait encore le mouchoir. Quand elle revint à la voix du greffier, il en était à la fin du mois.",
     "mentions": []
    },
    {
     "id": "c4-b46",
     "text": "« Séance du 28 mars. M. Dufresne : J’ai dit qu’on ne ferme pas la porte d’une maison où l’on dort. Messieurs, les Tièdes ont eu trois mois pour se réveiller. (Rires.) »",
     "mentions": []
    },
    {
     "id": "c4-b47",
     "text": "Cette fois quelqu’un rit, au fond, un seul, un mois après l’Assemblée, et se tut aussitôt.",
     "mentions": []
    },
    {
     "id": "c4-b48",
     "text": "« Séance du 1ᵉʳ avril. L’ensemble du projet est mis aux voix. La loi est adoptée. Article premier. Est réputé perpétuellement absent quiconque se trouve sous l’Octroi au jour où la Compagnie des Paliers déclare la Pente fermée. Ses biens font retour à la République. »",
     "mentions": []
    },
    {
     "id": "c4-b49",
     "text": "Perpétuellement. C’était un mot de notaire, un mot de concession au cimetière, qu’on signe pour des gens qui ne sont pas encore morts. Le 1ᵉʳ avril : Adeline fit le compte sans le vouloir, par habitude. Là-haut, on avait voté à l’heure où Zélie grattait à la porte de la lingerie. Pendant qu’elle rampait dans la rue des Lavoirs, c’était fait.",
     "mentions": []
    },
    {
     "id": "c4-b50",
     "text": "Madame de Vautre se leva. Elle avait gardé son verre du souper, une flûte de cristal à pied torsadé ; Adeline en avait rincé de pareilles dans l’office des Vautre, et elle en connaissait le poids dans une main mouillée.",
     "mentions": []
    },
    {
     "id": "c4-b51",
     "text": "— À l’Ombilic, dit Madame de Vautre. Ces messieurs ont mis trois mois à nous enterrer, et pendant qu’ils parlaient, il nous a fait gagner trois mois d’intérêts en une nuit. La Chambre cassera leur loi, et nous remonterons quand il nous plaira. Ils ont le nombre. Nous autres Demeurants, nous avons le temps.",
     "mentions": []
    },
    {
     "id": "c4-b52",
     "text": "Le premier rang se leva et but. Il y eut des bravos, des verres tendus vers l’estrade, et un vieux monsieur cria « Vive la Hausse ! » d’une voix de fausset.",
     "mentions": []
    },
    {
     "id": "c4-b53",
     "text": "— Et l’allumeur ? dit Zélie.",
     "mentions": []
    },
    {
     "id": "c4-b54",
     "text": "Elle ne l’avait pas crié. Elle l’avait dit de sa voix de lavoir, qui portait, et la salle se retourna. La Doyenne leva la main ; le premier rang se rassit.",
     "mentions": []
    },
    {
     "id": "c4-b55",
     "text": "— Approchez.",
     "mentions": []
    },
    {
     "id": "c4-b56",
     "text": "Zélie descendit l’allée en laissant sur les dalles des traces d’eau. Elle dit la rue des Lavoirs, l’eau qui ne descendait plus, le verre sur les pavés, les gens qu’on avait sortis, et l’allumeur debout sur le quai, un pied en l’air.",
     "mentions": []
    },
    {
     "id": "c4-b57",
     "text": "— C’est la Hausse, ma bonne, dit Madame de Vautre, sans méchanceté.",
     "mentions": []
    },
    {
     "id": "c4-b58",
     "text": "— Qui les a sortis ? dit la Doyenne.",
     "mentions": []
    },
    {
     "id": "c4-b59",
     "text": "— Line, de la Maison. Elle est tombée, et elle a vu que ça passait par terre.",
     "mentions": []
    },
    {
     "id": "c4-b60",
     "text": "La salle se retourna encore, vers le pilier cette fois. Adeline, qui avait fait de sa vie une affaire de portes entrebâillées, sentit tous ces visages sur elle et ne sut pas où mettre sa main engourdie.",
     "mentions": []
    },
    {
     "id": "c4-b61",
     "text": "— C’est vous ? dit la Doyenne.",
     "mentions": []
    },
    {
     "id": "c4-b62",
     "text": "— Je suis tombée, madame.",
     "mentions": []
    },
    {
     "id": "c4-b63",
     "text": "— Mes parents se couchaient, dit la Doyenne.",
     "mentions": []
    },
    {
     "id": "c4-b64",
     "text": "Elle le dit comme on donne une recette, et elle regarda la salle.",
     "mentions": []
    },
    {
     "id": "c4-b65",
     "text": "— À la dernière Nuit des Lampes, les Marcheurs sont venus tard. Vous vous en souvenez. On a mis cela sur la pluie. Ce n’était pas la pluie. L’Ombilic répond plus tard quand il prend son souffle. Mes parents l’ont vu faire. Ils en parlaient à table, quand j’étais petite, comme d’un voisin qui a mauvais caractère. Ils disaient : il soupire.",
     "mentions": []
    },
    {
     "id": "c4-b66",
     "text": "— Et l’allumeur ? dit quelqu’un.",
     "mentions": []
    },
    {
     "id": "c4-b67",
     "text": "— Il est avec les autres.",
     "mentions": []
    },
    {
     "id": "c4-b68",
     "text": "Personne ne demanda lesquels.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "— Alors nous serons riches plus longtemps, dit Madame de Vautre.",
     "mentions": []
    },
    {
     "id": "c4-b70",
     "text": "— Très longtemps, madame.",
     "mentions": []
    },
    {
     "id": "c4-b71",
     "text": "— Et la Chambre ? dit un rentier. Que fera la Chambre ?",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "— Elle siégera. Elle est descendue pour cela. La Loi ne fuit pas.",
     "mentions": []
    },
    {
     "id": "c4-b73",
     "text": "Le premier rang applaudit. La Doyenne attendit que cela passe, comme on attend la fin d’une averse dans une ville où il pleut toujours. Elle savait depuis la Nuit des Lampes, pensa Adeline, et elle n’avait rien dit ; elle avait attendu que ce soit trop tard pour servir. Adeline connaissait cela. La Doyenne lissa la table du plat des deux mains et donna la parole au Résident.",
     "mentions": []
    },
    {
     "id": "c4-b74",
     "text": "Castaing monta sur l’estrade avec une dérouleuse qui tenait devant lui, à deux mains, une bande de papier bleu. C’était un petit homme soigné, en veste bleue à parements jaunes, qui avait l’air de s’excuser d’avoir une liste.",
     "mentions": []
    },
    {
     "id": "c4-b75",
     "text": "— Dépêche de la Direction, lut-il. Le convoi officiel de remontée arrivera en gare de Demeure le 18 avril, c’est-à-dire, pour nous, vers six heures. Les partants seront au quai avant l’heure, avec un seul bagage. La liste est close.",
     "mentions": []
    },
    {
     "id": "c4-b76",
     "text": "Il lut les noms. La bande était moins longue qu’elle n’en avait l’air. Des engagées que la Chaîne connaissait, que des sœurs ou des fils avaient réclamées d’en haut ; un cocher ; deux enfants des tanneries dont les parents étaient remontés l’avant-veille, c’est-à-dire à l’automne. Pas un rentier. Pas Brisson. Pas Lucien.",
     "mentions": []
    },
    {
     "id": "c4-b77",
     "text": "— Mérel, Colombe, six ans, Maison d’Attente, à la demande de son père.",
     "mentions": []
    },
    {
     "id": "c4-b78",
     "text": "Adeline s’aperçut qu’elle tenait le pilier à deux mains, la bonne et l’autre. Il l’avait fait. Là-haut, devant un guichet de la Compagnie, il avait dû donner le nom de sa fille, et on avait écrit : six ans. Pas dix-sept.",
     "mentions": []
    },
    {
     "id": "c4-b79",
     "text": "Puis le froid lui remonta par les pieds, comme aux Berges. Elle porterait l’enfant au quai et la donnerait à des courriers qu’elle ne connaissait pas. Son nom à elle n’était pas sur la bande. La liste était close, avait dit le Résident, et Adeline chercha des yeux la pendule de la salle : pendant que le greffier lisait les rires de l’Assemblée, là-haut, le 10 avril avait passé sans bruit, comme passent toutes les dates de là-haut, et avec lui le dernier jour où elle aurait pu dire : je remonte. Elle ne l’avait pas regardé passer. Elle mit la main dans la poche du châle. L’avis, trempé aux Berges, se défit sous ses doigts comme du pain mouillé. Dessous, la clé était restée dure.",
     "mentions": []
    },
    {
     "id": "c4-b80",
     "text": "En sortant, elle vit que la Doyenne n’avait pas quitté son fauteuil. Elle regardait les bancs se vider comme on regarde une table après le départ des invités.",
     "mentions": []
    },
    {
     "id": "c4-b81",
     "text": "À la Maison, Colombe était réveillée, assise au bord de son lit, les pieds croisés au-dessus du carrelage.",
     "mentions": []
    },
    {
     "id": "c4-b82",
     "text": "— Tu es mouillée, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b83",
     "text": "— Ton père t’a inscrite. Le convoi arrive à six heures. Tu remontes.",
     "mentions": []
    },
    {
     "id": "c4-b84",
     "text": "Colombe réfléchit.",
     "mentions": []
    },
    {
     "id": "c4-b85",
     "text": "— C’est lui qui vient ?",
     "mentions": []
    },
    {
     "id": "c4-b86",
     "text": "— Ce sont d’autres courriers.",
     "mentions": []
    },
    {
     "id": "c4-b87",
     "text": "— Alors ce n’est pas la prochaine fois, dit Colombe. C’est une autre fois.",
     "mentions": []
    },
    {
     "id": "c4-b88",
     "text": "Elle emballa la frise elle-même, dans un carton à chapeau de la lingerie, puisque personne n’avait le droit d’y toucher : chaque objet dans une serviette, de gauche à droite, le cheval aux oreilles rongées au fond, la toupie de fer-blanc en dernier, sur le dessus. Elle s’arrêta pour reprendre son souffle, et fit semblant d’examiner une serviette. La boîte à pastilles ne quitta pas son poing. Pendant ce temps, Adeline remplit la lampe de Lucien jusqu’au col, et Lucien, qui ne dormait pas, la regarda faire sans rien demander.",
     "mentions": []
    },
    {
     "id": "c4-b89",
     "text": "La gare des Bennes était au bout de la ville haute, sur la roche : une halle de pierre blonde ouverte sur la voie, bordée d’arcades, où le câble passait dans ses poulies à hauteur d’homme avec son bruit de toujours. Adeline porta Colombe dans la couverture, le carton sur la hanche. Sur le quai attendaient déjà les engagées avec leurs baluchons, le cocher, les deux enfants des tanneries, et le préposé du Résident, sa lanterne au poing. Sur le mur du fond, sous la pendule, le Barème luisait dans son cadre de laiton. Adeline s’arrêta derrière le dernier pilier des arcades.",
     "mentions": []
    },
    {
     "id": "c4-b90",
     "text": "— Tu te mets derrière, dit Colombe. Comme à la lingerie.",
     "mentions": []
    },
    {
     "id": "c4-b91",
     "text": "— Je m’abrite.",
     "mentions": []
    },
    {
     "id": "c4-b92",
     "text": "— Il ne pleut pas sous les arcades.",
     "mentions": []
    },
    {
     "id": "c4-b93",
     "text": "Adeline ne répondit pas. La pendule marquait six heures moins sept. Ce fut Colombe qui entendit la première.",
     "mentions": []
    },
    {
     "id": "c4-b94",
     "text": "— Ça chante, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b95",
     "text": "Venue du haut de la voie, une note, une seule, qui montait. Elle passa au-dessus du sifflement du bord, qu’on n’écoutait plus ; elle monta au-dessus de tout ce qu’Adeline avait jamais entendu, jusqu’à lui faire mal aux dents. Le préposé leva sa lanterne vers la poulie de tête. Les engagées regardèrent en l’air. Adeline se coucha. Elle ne décida rien : son corps avait retenu la leçon des Berges, et il se mit à plat sur les dalles, l’enfant dessous, le carton contre la tête.",
     "mentions": []
    },
    {
     "id": "c4-b96",
     "text": "La note cessa. Il y eut, très loin, un claquement sec, comme un drap qu’on secoue par une fenêtre tout en haut du Val. Puis le bout du câble entra dans la gare, plus vite qu’une balle, et Adeline ne le vit pas. Elle vit la poulie de tête sauter de son bâti de fonte, et le verre de la lanterne partir en poussière dans la main du préposé. Elle entendit, le long de la voie, vers le haut, les godets de porcelaine du télégraphe éclater l’un après l’autre, de plus en plus loin, comme une rangée de pétards, et le fil, arraché de ses poteaux, fouetter la bruine au-dessus d’elle. Quand elle releva la tête, le câble était là, effiloché comme un balai de bruyère, fiché dans le mur sous la pendule, à travers le cadre du Barème.",
     "mentions": []
    },
    {
     "id": "c4-b97",
     "text": "Puis il n’y eut plus rien. Le préposé était assis par terre, sa lanterne sans verre à la main, et regardait la mèche qui brûlait toujours. Personne ne criait. Au-dessus du quai, le bruit de toujours s’était tu : ce battement de roue et de fer, ce pas lourd et régulier que Demeure entendait depuis quatre siècles comme on entend son cœur, sans l’écouter. Adeline ne l’avait jamais écouté. Elle l’entendit s’arrêter.",
     "mentions": []
    },
    {
     "id": "c4-b98",
     "text": "— Ce n’est pas encore l’heure, dit Colombe sous elle, très raisonnable. Ils ne sont pas en retard.",
     "mentions": []
    },
    {
     "id": "c4-b99",
     "text": "Adeline resta couchée sur les dalles, l’enfant contre sa poitrine, et regarda le Voile blanchir au-dessus de la voie vide. Il n’y avait plus de câble ; il n’y avait plus de fil ; de tout ce qui attachait Demeure au bord, il ne restait que le Fanal. Ils ne seraient pas en retard. Personne ne viendrait.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "Qui descend remonte",
   "blocks": [
    {
     "id": "c5-b001",
     "text": "Ici, à Surplomb, on était le 18 avril, et il faisait beau pour la première fois du printemps. Pour elles, en bas, il allait être six heures du matin : l’heure du convoi.",
     "mentions": []
    },
    {
     "id": "c5-b002",
     "text": "Jonas était au siège depuis l’ouverture, avec un pli pour les Terrasses qu’il aurait dû porter la veille. Il s’était assis sur le banc de la salle du télégraphe, derrière les guichets, et personne ne lui avait demandé de partir. Les courriers qui passaient lui faisaient un signe de tête et regardaient ailleurs. Par la porte ouverte de leur salle, on voyait l’ardoise où l’on avait écrit à la craie, le 15 : Longue, dernière section. Fabre, Roux, Mathis, Soler. À côté du dernier nom, quelqu’un avait dessiné une petite benne avec ses roues et son câble, comme on le faisait pour une première longue.",
     "mentions": []
    },
    {
     "id": "c5-b003",
     "text": "Le récepteur de l’Octroi se mit à battre un peu avant midi. La télégraphiste laissa la bande se dérouler jusqu’au bout sans y toucher, la coupa aux ciseaux et la lut debout, pour toute la salle, de la voix appliquée qu’on prend à l’école pour réciter.",
     "mentions": []
    },
    {
     "id": "c5-b004",
     "text": "« Benne de service arrêtée dans le Raide, à mi-hauteur. Câble rompu côté Demeure. Ligne de Demeure muette. Aucun signal de l’équipage. »",
     "mentions": []
    },
    {
     "id": "c5-b005",
     "text": "Sur la table voisine, le récepteur de Demeure n’avait rien donné depuis la veille, ce qui ne voulait rien dire : Demeure frappait lentement, et ses dépêches mettaient des jours à se transborder jusqu’au bord. Mais l’aiguille de la ligne, qui d’ordinaire ne cessait jamais tout à fait de trembler, était couchée contre sa butée. La télégraphiste appela Demeure, attendit, rappela, en tenant le manipulateur d’une main et son propre poignet de l’autre. L’aiguille ne se releva pas.",
     "mentions": []
    },
    {
     "id": "c5-b006",
     "text": "Jonas fit la seule chose qu’il savait faire. À mi-hauteur du Raide, la cote n’était écrite nulle part, ni sur le laiton ni dans les journaux, et aucune de celles qu’il connaissait ne servait. Pour ceux de la benne, la caisse venait peut-être seulement de s’arrêter. Fabre n’avait pas encore eu le temps de jurer. Et plus bas, au bout du câble libre, la petite attendait sur le quai avec un seul bagage, et pour elle le convoi n’était pas en retard.",
     "mentions": []
    },
    {
     "id": "c5-b007",
     "text": "Il s’aperçut qu’il avait pris la bande des mains de la télégraphiste et qu’il la lovait autour de deux doigts, serrée, comme un filin.",
     "mentions": []
    },
    {
     "id": "c5-b008",
     "text": "Hortense Vaudrey descendit peu après. Quelqu’un était monté la prévenir ; elle n’avait pas couru. Elle prit la bande que Jonas lui tendait, la déroula à plat sur le comptoir et la lut en entier du bout de sa plume, sans toucher le papier, comme elle lisait tout ce qu’elle allait signer. Puis elle regarda l’aiguille couchée.",
     "mentions": []
    },
    {
     "id": "c5-b009",
     "text": "— C’est la Pente qui décide, maintenant.",
     "mentions": []
    },
    {
     "id": "c5-b010",
     "text": "Elle tira à elle un formulaire et écrivit debout, sans s’appuyer : Service de la dernière section suspendu. Aucun convoi. Elle signa, relut sa signature et tendit la feuille à la télégraphiste pour l’Octroi. Par la porte ouverte, Jonas vit un jeune courrier prendre le chiffon de l’ardoise, regarder la petite benne, et le reposer.",
     "mentions": []
    },
    {
     "id": "c5-b011",
     "text": "— Et le pied de la Rampe, en bas ? dit le chef de salle.",
     "mentions": []
    },
    {
     "id": "c5-b012",
     "text": "— J’ai télégraphié à Castaing le 16, avec le correctif. Nul ne monte par la Rampe : on y meurt.",
     "mentions": []
    },
    {
     "id": "c5-b013",
     "text": "— Et d’en haut ? dit Jonas.",
     "mentions": []
    },
    {
     "id": "c5-b014",
     "text": "Elle le regarda pour la première fois.",
     "mentions": []
    },
    {
     "id": "c5-b015",
     "text": "— D’en haut, nul ne descend. Tu n’as pas de feuille, Mérel.",
     "mentions": []
    },
    {
     "id": "c5-b016",
     "text": "Elle remonta l’escalier du même pas qu’elle l’avait descendu. À la troisième marche, elle mit la main au mur. Jonas ne l’avait jamais vue s’appuyer à rien.",
     "mentions": []
    },
    {
     "id": "c5-b017",
     "text": "Dehors, Pagès était assis sur les marches du siège, en plein soleil, ce qui ne lui allait pas. Il était venu du Guet à pied, comme le 5, et n’avait pas osé entrer. Il avait sur les genoux la Gazette de l’avant-veille, pliée à la page où son correctif s’étalait sous son nom en capitales, et il ne la regardait pas. Il leva les yeux sur Jonas et n’eut pas besoin de demander.",
     "mentions": []
    },
    {
     "id": "c5-b018",
     "text": "— J’avais fini le 12, dit-il.",
     "mentions": []
    },
    {
     "id": "c5-b019",
     "text": "Jonas resta debout.",
     "mentions": []
    },
    {
     "id": "c5-b020",
     "text": "— Le convoi est parti le 15.",
     "mentions": []
    },
    {
     "id": "c5-b021",
     "text": "— Je sais quand il est parti. Le 12 au soir, j’avais tout. J’ai voulu la troisième décimale. Je l’ai eue le 16 au matin.",
     "mentions": []
    },
    {
     "id": "c5-b022",
     "text": "Il ôta ses lunettes et les tint par une branche au-dessus des marches, comme une chose qu’on va poser et qu’on ne pose pas.",
     "mentions": []
    },
    {
     "id": "c5-b023",
     "text": "— Elle ne changeait rien.",
     "mentions": []
    },
    {
     "id": "c5-b024",
     "text": "Un fiacre tourna devant la gare. Pagès remit ses lunettes. Même ce jour-là, il ne put garder pour lui un résultat exact.",
     "mentions": []
    },
    {
     "id": "c5-b025",
     "text": "— J’ai refait le front cette nuit. Il a une quarantaine de mètres d’épaisseur. Entre la tête et les pieds d’un homme debout, l’écart dépasse ce qu’un cœur peut rattraper. Debout, on y meurt. Couché, on n’a plus que l’épaisseur de son corps. Couché, on passe.",
     "mentions": []
    },
    {
     "id": "c5-b026",
     "text": "Jonas pensa à la caisse de chêne, à ses banquettes. On y voyageait assis.",
     "mentions": []
    },
    {
     "id": "c5-b027",
     "text": "— Jusqu’à quand ?",
     "mentions": []
    },
    {
     "id": "c5-b028",
     "text": "— Il s’amincit à mesure qu’il durcit. Fin septembre, à dix jours près.",
     "mentions": []
    },
    {
     "id": "c5-b029",
     "text": "Pagès regarda ses mains.",
     "mentions": []
    },
    {
     "id": "c5-b030",
     "text": "— Et je me suis déjà trompé.",
     "mentions": []
    },
    {
     "id": "c5-b031",
     "text": "— Par où ?",
     "mentions": []
    },
    {
     "id": "c5-b032",
     "text": "— Il n’y a que la Rampe. La Compagnie l’a murée au Raide en 320, et il n’y a rien aux archives. J’ai cherché toute la nuit, entre deux calculs.",
     "mentions": []
    },
    {
     "id": "c5-b033",
     "text": "— Il y a la Centenaire.",
     "mentions": []
    },
    {
     "id": "c5-b034",
     "text": "— C’est une légende.",
     "mentions": []
    },
    {
     "id": "c5-b035",
     "text": "— Elle touche une pension.",
     "mentions": []
    },
    {
     "id": "c5-b036",
     "text": "Le lendemain, Jonas monta à l’Asile des courriers, une longue maison basse au bout de la Margelle, tournée vers le Val, avec un banc sous chaque fenêtre. Les vieux y passaient l’après-midi à regarder le Lait comme d’autres regardent un feu, et à se disputer sur l’heure qu’il était en bas. Ursule Crozes n’était pas sur les bancs. Il la trouva dans l’atelier du fond, devant l’établi, une loupe d’horloger vissée dans l’œil, avec, ouverte sur un chiffon, une double montre qu’elle avait éventrée comme un poisson. Jonas n’avait jamais osé ouvrir la sienne.",
     "mentions": []
    },
    {
     "id": "c5-b037",
     "text": "Elle était petite, taille de courrier, les cheveux blancs coupés court, des mains d’homme. On l’appelait la Centenaire, ce qui restait au-dessous de la vérité : l’état civil lui donnait cent soixante ans, et la Compagnie lui versait sa pension depuis plus longtemps qu’aucun de ses comptables n’était en vie.",
     "mentions": []
    },
    {
     "id": "c5-b038",
     "text": "— Mérel, dit-elle sans lever l’œil. Le grand. La petite Vaudrey m’a parlé de toi.",
     "mentions": []
    },
    {
     "id": "c5-b039",
     "text": "— Il y a longtemps ?",
     "mentions": []
    },
    {
     "id": "c5-b040",
     "text": "— Pour elle ou pour moi ?",
     "mentions": []
    },
    {
     "id": "c5-b041",
     "text": "Elle souleva avec une pince un rouage pas plus gros qu’une lentille, le regarda contre la fenêtre et le reposa ailleurs.",
     "mentions": []
    },
    {
     "id": "c5-b042",
     "text": "— On dit sur les bancs que vous avez passé le Mur de 320.",
     "mentions": []
    },
    {
     "id": "c5-b043",
     "text": "— Les bancs sont pleins de gamins. Ils répètent ce que je leur racontais quand ils étaient apprentis.",
     "mentions": []
    },
    {
     "id": "c5-b044",
     "text": "— C’est vrai ?",
     "mentions": []
    },
    {
     "id": "c5-b045",
     "text": "— Il y a une porte. Les vieux de ma jeunesse l’avaient gardée quand la Compagnie a monté le Mur, pour les cas où. Ils me l’ont montrée. Ils sont morts.",
     "mentions": []
    },
    {
     "id": "c5-b046",
     "text": "Elle referma le boîtier d’un coup de pouce.",
     "mentions": []
    },
    {
     "id": "c5-b047",
     "text": "— Je suis la seule à savoir où elle est. Je ne suis pas sûre qu’elle y soit encore.",
     "mentions": []
    },
    {
     "id": "c5-b048",
     "text": "— Je descends chercher ma fille.",
     "mentions": []
    },
    {
     "id": "c5-b049",
     "text": "Ursule ôta la loupe. L’œil qui l’avait tenue resta un moment plus petit que l’autre, et elle le promena sur Jonas de bas en haut, lentement, comme on mesure une poutre.",
     "mentions": []
    },
    {
     "id": "c5-b050",
     "text": "— Tu es grand, dit-elle, comme on constate une infirmité. Le Raide te coûtera plus cher qu’à moi.",
     "mentions": []
    },
    {
     "id": "c5-b051",
     "text": "— Je paierai.",
     "mentions": []
    },
    {
     "id": "c5-b052",
     "text": "— Trois conditions. Je marche devant. Quand je dis couché, on se couche, et on demande pourquoi après. Et personne ne m’attend : si je reste en route, vous continuez.",
     "mentions": []
    },
    {
     "id": "c5-b053",
     "text": "La porte de l’atelier s’ouvrit sur Pagès, un étui de cuir serré contre la poitrine, les lunettes de travers. Il avait suivi Jonas depuis la rue des Cordiers et ne s’en cachait pas.",
     "mentions": []
    },
    {
     "id": "c5-b054",
     "text": "— Qu’est-ce que c’est que ça ? dit Ursule.",
     "mentions": []
    },
    {
     "id": "c5-b055",
     "text": "— Pagès. De l’Observatoire.",
     "mentions": []
    },
    {
     "id": "c5-b056",
     "text": "— Celui du Barème.",
     "mentions": []
    },
    {
     "id": "c5-b057",
     "text": "— Celui du Barème, dit Pagès. Je descends avec vous, madame. J’ai trois raisons, que je vous donne dans l’ordre inverse de leur noblesse, qui est aussi celui de leur solidité. Je dois un convoi à la Compagnie. Personne n’a jamais mesuré un front de l’intérieur. Et…",
     "mentions": []
    },
    {
     "id": "c5-b058",
     "text": "— Et tu veux avoir raison.",
     "mentions": []
    },
    {
     "id": "c5-b059",
     "text": "— Une fois ce printemps, dit Pagès.",
     "mentions": []
    },
    {
     "id": "c5-b060",
     "text": "Il ouvrit l’étui. Deux chronomètres de l’Observatoire dormaient côte à côte dans le velours, réglés ensemble.",
     "mentions": []
    },
    {
     "id": "c5-b061",
     "text": "— Un pour la tête, dit-il. Un pour les pieds.",
     "mentions": []
    },
    {
     "id": "c5-b062",
     "text": "Ursule le regarda longtemps, de bas en haut, lui aussi.",
     "mentions": []
    },
    {
     "id": "c5-b063",
     "text": "— Il est grand, dit-elle à Jonas. Mes conditions valent pour lui.",
     "mentions": []
    },
    {
     "id": "c5-b064",
     "text": "Ils partirent dans la nuit du 25, par le cimetière de la Margelle, où le sentier des contrebandiers commençait entre deux tombes de courriers. Sous chaque nom, on avait gravé deux âges, et ils ne tombaient jamais d’accord. Jonas portait en bandoulière deux rouleaux de chanvre goudronné que Rigal, le cordier du rez-de-chaussée, lui avait donnés la veille sans demander pour quoi faire ; il avait refusé l’argent. Chacun avait une lampe éteinte à la ceinture, et Pagès portait son étui à deux bras.",
     "mentions": []
    },
    {
     "id": "c5-b065",
     "text": "La Rampe haute passait sous les ronces, presque à plat, un lacet après l’autre, avec de loin en loin un anneau de fer rouillé scellé dans le roc, et la neige fondue tenait encore à l’ombre. Pagès voulait aller vite. Dès les premiers lacets, il avait dépassé Ursule, qui le rappela sans élever la voix.",
     "mentions": []
    },
    {
     "id": "c5-b066",
     "text": "— Ne cours pas.",
     "mentions": []
    },
    {
     "id": "c5-b067",
     "text": "— Au réveil, à l’Asile, on verra que votre lit est vide.",
     "mentions": []
    },
    {
     "id": "c5-b068",
     "text": "— Et ils prendront les Bennes jusqu’à l’Octroi, dit Ursule. Ils s’assiéront dans la salle des pas perdus, ils boiront le café qui ne refroidit pas, et ils nous attendront. Ils y seront avant nous, quoi que tu fasses. Une avance, ça fond en descendant.",
     "mentions": []
    },
    {
     "id": "c5-b069",
     "text": "Jonas fit la conversion, parce que personne n’avait jamais pu l’en empêcher. Un jour d’avance au bord, c’était huit heures aux Terrasses, deux heures et demie à Mi-Pente, trois quarts d’heure à l’Octroi. À Demeure, un seul ciel de Colombe.",
     "mentions": []
    },
    {
     "id": "c5-b070",
     "text": "— Alors pourquoi partir de nuit ? dit Pagès.",
     "mentions": []
    },
    {
     "id": "c5-b071",
     "text": "— Pour qu’on ne nous voie pas partir. Après, on a tout le temps.",
     "mentions": []
    },
    {
     "id": "c5-b072",
     "text": "Au-dessus des Terrasses, l’aube vint trop tôt, grise sur les vergers, comme elle venait toujours là-bas. Ils firent halte plus bas, sur un lacet que les Premiers avaient taillé assez large pour deux, contre une paroi où l’on devinait sous le lichen des lettres gravées ; Jonas ne prit pas le temps de les lire. Pagès s’endormit assis, les bras autour de son étui. Ursule délaça ses souliers et examina ses pieds l’un après l’autre, avec l’intérêt qu’elle avait eu pour la montre. Jonas resta debout.",
     "mentions": []
    },
    {
     "id": "c5-b073",
     "text": "— Assieds-toi, dit Ursule. Tu uses le chemin.",
     "mentions": []
    },
    {
     "id": "c5-b074",
     "text": "Il s’assit.",
     "mentions": []
    },
    {
     "id": "c5-b075",
     "text": "— Pourquoi êtes-vous venue ?",
     "mentions": []
    },
    {
     "id": "c5-b076",
     "text": "— La première fois que je suis remontée de Demeure, dit-elle en frottant un orteil, j’y avais passé une année. En haut, ma mère était morte, et mon promis avait des petits-enfants. Il m’a reconnue dans la rue. Il m’a offert un café. Il était très gentil.",
     "mentions": []
    },
    {
     "id": "c5-b077",
     "text": "Elle passa à l’autre pied.",
     "mentions": []
    },
    {
     "id": "c5-b078",
     "text": "— Après, je n’ai plus prévenu personne. J’ai vu le bord cinq fois. Chaque fois on avait changé les lampes et le nom des rues, et il n’y avait personne sur le quai. J’avais juré comme toi : qui descend remonte. Je suis toujours remontée. Le serment ne dit pas quand.",
     "mentions": []
    },
    {
     "id": "c5-b079",
     "text": "— Sur les bancs, on vous plaint.",
     "mentions": []
    },
    {
     "id": "c5-b080",
     "text": "— Les bancs se trompent. C’est léger. Personne ne m’attend nulle part. Je peux partir sans rien casser.",
     "mentions": []
    },
    {
     "id": "c5-b081",
     "text": "Elle remit un soulier et tira sur le lacet.",
     "mentions": []
    },
    {
     "id": "c5-b082",
     "text": "— Toi, on t’attend partout.",
     "mentions": []
    },
    {
     "id": "c5-b083",
     "text": "Jonas ne répondit pas.",
     "mentions": []
    },
    {
     "id": "c5-b084",
     "text": "— Ta mère est à la Maison d’Attente. C’était dans le journal. Tu y es descendu pendant onze ans.",
     "mentions": []
    },
    {
     "id": "c5-b085",
     "text": "— Je m’assois de l’autre côté du lit.",
     "mentions": []
    },
    {
     "id": "c5-b086",
     "text": "Ursule le regarda un moment. Puis elle noua son second soulier d’un nœud double, comme on noue une corde qui doit tenir.",
     "mentions": []
    },
    {
     "id": "c5-b087",
     "text": "— Tu viens toujours, dit-elle. Tu n’entres jamais.",
     "mentions": []
    },
    {
     "id": "c5-b088",
     "text": "Pagès se réveilla en sursaut, vérifia ses chronomètres avant de vérifier où il était, et ils repartirent.",
     "mentions": []
    },
    {
     "id": "c5-b089",
     "text": "D’après le cadran du bas de sa double montre, qu’il recalait à chaque palier sur un Barème qu’il savait faux, on devait être le 6 mai quand ils arrivèrent à Mi-Pente. Le bourg s’accrochait au versant autour de la gare de transbordement : des rues en escalier, des dépôts, des auberges de courriers où Jonas avait bu des cafés toute sa vie et où il ne pouvait plus entrer. Ursule les fit passer par le bas, par les ruelles des lessivés, où des hommes en robe de chambre fumaient sur les seuils en plein jour et regardaient passer les gens comme on regarde passer l’eau. D’un seuil à l’autre, ils se parlaient dans une langue où traînaient des mots que Jonas n’avait jamais lus que dans les vieux registres.",
     "mentions": []
    },
    {
     "id": "c5-b090",
     "text": "L’enseigne disait Hôtel du Relais. Tout Mi-Pente disait la Buanderie. La patronne, une femme large aux avant-bras de laveuse, regarda Ursule par-dessus son comptoir sans paraître surprise.",
     "mentions": []
    },
    {
     "id": "c5-b091",
     "text": "— Crozes. Tu me dois deux nuits.",
     "mentions": []
    },
    {
     "id": "c5-b092",
     "text": "— Il y a prescription.",
     "mentions": []
    },
    {
     "id": "c5-b093",
     "text": "— Pas ici.",
     "mentions": []
    },
    {
     "id": "c5-b094",
     "text": "Ursule alla s’asseoir à la table du fond comme chez elle.",
     "mentions": []
    },
    {
     "id": "c5-b095",
     "text": "— Des lits ? dit la patronne.",
     "mentions": []
    },
    {
     "id": "c5-b096",
     "text": "— Non, dit Jonas.",
     "mentions": []
    },
    {
     "id": "c5-b097",
     "text": "— Tant mieux. Je ne les loue qu’à l’année.",
     "mentions": []
    },
    {
     "id": "c5-b098",
     "text": "— On mange, dit Ursule. Après, il n’y a plus d’endroit où l’on mange assis.",
     "mentions": []
    },
    {
     "id": "c5-b099",
     "text": "Une nuit dans un de ces lits, c’étaient trois jours de là-haut. Jonas s’assit en face de la porte, au bord du banc, comme on s’assoit dans une gare. Derrière le comptoir, une ardoise portait une colonne de noms à la craie, chacun suivi d’une date de là-haut. Quand les journaux atteignaient une date, la patronne effaçait le nom, et quelqu’un, dans la maison, faisait sa valise.",
     "mentions": []
    },
    {
     "id": "c5-b100",
     "text": "Elle apporta une soupe aux choux et une carafe de vin des Terrasses. Le soleil entrait de biais par la fenêtre. Pendant qu’ils mangeaient, l’ombre de la carafe traversa la nappe, s’allongea jusqu’au bord de la table, pâlit, et la salle devint grise : le jour du bord passait sur Mi-Pente sans s’y arrêter, comme un express à travers une halte.",
     "mentions": []
    },
    {
     "id": "c5-b101",
     "text": "Jonas se leva.",
     "mentions": []
    },
    {
     "id": "c5-b102",
     "text": "— Le sac descend plus vite que nous, dit Ursule sans lever le nez de sa soupe. Tu veux savoir ce qu’ils ont décidé avant d’arriver à l’Octroi, ou après ?",
     "mentions": []
    },
    {
     "id": "c5-b103",
     "text": "Il se rassit.",
     "mentions": []
    },
    {
     "id": "c5-b104",
     "text": "À la table voisine, un vieil homme en redingote d’une coupe que Jonas n’avait jamais vue lisait les journaux, un crayon à la main. Il en avait une pile devant lui, une autre à ses pieds, et il faisait de temps en temps une petite croix dans la colonne des décès.",
     "mentions": []
    },
    {
     "id": "c5-b105",
     "text": "— Ses créanciers, dit la patronne en passant. Il en reste trois. Il a été notaire.",
     "mentions": []
    },
    {
     "id": "c5-b106",
     "text": "Pagès regardait la pile. Le vieil homme la poussa vers lui sans lever les yeux.",
     "mentions": []
    },
    {
     "id": "c5-b107",
     "text": "— Servez-vous. Ce sont ceux de la semaine prochaine.",
     "mentions": []
    },
    {
     "id": "c5-b108",
     "text": "Jonas regarda la date du premier numéro. Ils avaient quitté Surplomb depuis une nuit et un jour de leurs jambes, sans dormir ; pour eux, c’était la semaine prochaine. Pagès trouva l’avis entre une vente de chevaux et un sirop contre la toux, encadré de noir.",
     "mentions": []
    },
    {
     "id": "c5-b109",
     "text": "COMPAGNIE DES PALIERS — AVIS. Sont recherchés, pour descente sans feuille de course : Mérel, Jonas, courrier suspendu, grand, une cicatrice à la base du pouce ; Crozes, Ursule, pensionnée de la Compagnie, petite ; Pagès, Anatole, de l’Observatoire du Guet, myope. Toute personne qui leur aura prêté aide sera poursuivie. La Direction : H. Vaudrey.",
     "mentions": []
    },
    {
     "id": "c5-b110",
     "text": "— Myope, dit Pagès. Ils auraient pu mettre astronome.",
     "mentions": []
    },
    {
     "id": "c5-b111",
     "text": "— Ils ont mis ce qui se voit, dit Ursule, et elle continua de manger sa soupe.",
     "mentions": []
    },
    {
     "id": "c5-b112",
     "text": "Jonas avait la main à plat sur la nappe ; il ne la retira pas. Le notaire avait levé les yeux de ses décès. Il regarda la main, la cicatrice, puis la petite femme qui mangeait, puis le grand garçon à lunettes qui tenait le journal ouvert. Il tendit le bras, prit la Gazette des mains de Pagès avec politesse, en détacha la page d’un seul geste, la plia en huit et la glissa sous le pied de sa table, qui boitait.",
     "mentions": []
    },
    {
     "id": "c5-b113",
     "text": "— Ici, dit-il, on n’a pas de signalement. On a des délais.",
     "mentions": []
    },
    {
     "id": "c5-b114",
     "text": "Dans le numéro suivant, en bas d’une colonne, il y avait quelques lignes. Arrêtés hier, rue des Cordiers, le sieur Rigal, maître cordier, et son fils, pour fourniture de cordages à des fugitifs de la Pente. L’instruction suit son cours.",
     "mentions": []
    },
    {
     "id": "c5-b115",
     "text": "Jonas avait encore un des rouleaux de chanvre sur l’épaule. Il le posa sur le banc, à côté de lui, défit la boucle qui le tenait et la refit, plus serrée, sans que la corde vrille, comme on le lui avait appris, enfant, dans la boutique du rez-de-chaussée, entre les écheveaux qui sentaient le goudron.",
     "mentions": []
    },
    {
     "id": "c5-b116",
     "text": "La porte battit. Un gamin de la gare posa sur le comptoir un paquet ficelé qui sentait l’encre fraîche, et la patronne le jeta sur leur table comme on sert le pain.",
     "mentions": []
    },
    {
     "id": "c5-b117",
     "text": "— Le sac de service, dit-elle. Depuis que les Bennes sont fermées au public, il n’y a plus que lui.",
     "mentions": []
    },
    {
     "id": "c5-b118",
     "text": "Le premier numéro était du 1ᵉʳ mai. La directrice de la Compagnie des Paliers, disait-il, était descendue le matin même à l’Octroi, où elle établirait son bureau jusqu’à la fermeture. Jonas savait déjà comment elle serait : assise droite dans la salle des pas perdus, face à la porte, un registre de toile noire ouvert devant elle, lisant leur signalement en entier du bout de la plume. Pour elle, à l’Octroi, c’était encore la matinée de son arrivée.",
     "mentions": []
    },
    {
     "id": "c5-b119",
     "text": "Pagès avait ouvert le numéro suivant. En haut de la première page, sous un filet noir : Sur l’avis de l’Observatoire du Guet, le Conseil de la Compagnie des Paliers fixe au 1ᵉʳ octobre la déclaration de fermeture de la Pente.",
     "mentions": []
    },
    {
     "id": "c5-b120",
     "text": "— Sur mon avis, dit Pagès. Je l’avais laissé sur mon bureau.",
     "mentions": []
    },
    {
     "id": "c5-b121",
     "text": "Il suivit la ligne du bout de son crayon, deux fois.",
     "mentions": []
    },
    {
     "id": "c5-b122",
     "text": "— Ils ont retiré les dix jours.",
     "mentions": []
    },
    {
     "id": "c5-b123",
     "text": "Il les écrivit dans la marge, en petits caractères, à la hauteur du 1ᵉʳ octobre, et resta à les regarder.",
     "mentions": []
    },
    {
     "id": "c5-b124",
     "text": "Dehors, une autre nuit du bord était tombée. Par la fenêtre, au fond du Val, le Lait n’était plus qu’une pâleur sous les étoiles, et au milieu la pointe de la Tour s’alluma. Personne ne leva la tête dans la salle. Le notaire fit une croix. À la table des joueurs de cartes, quelqu’un dit, comme on dit qu’il pleut :",
     "mentions": []
    },
    {
     "id": "c5-b125",
     "text": "— Le Fanal a battu.",
     "mentions": []
    },
    {
     "id": "c5-b126",
     "text": "Jonas ne l’avait jamais vu de si près. De la fenêtre de la rue des Cordiers, c’était une lueur qu’on guettait pendant des jours et qui s’attardait jusqu’au milieu d’une matinée ; d’ici, c’était un feu, une flamme jaune et nette posée sur le Lait, et elle ne se pressait pas de s’éteindre. Pagès avait sorti un chronomètre du velours, par habitude.",
     "mentions": []
    },
    {
     "id": "c5-b127",
     "text": "— Neuf heures, dit-il. À Demeure.",
     "mentions": []
    },
    {
     "id": "c5-b128",
     "text": "Il referma l’étui.",
     "mentions": []
    },
    {
     "id": "c5-b129",
     "text": "— Le 1ᵉʳ octobre, pour Demeure, c’est dans dix-sept heures. Quand nous serons en bas, il en restera douze.",
     "mentions": []
    },
    {
     "id": "c5-b130",
     "text": "Ursule se leva, alla au comptoir et y posa une pièce qui n’avait plus cours nulle part depuis longtemps, sauf ici. La patronne la mordit et la mit dans son tablier.",
     "mentions": []
    },
    {
     "id": "c5-b131",
     "text": "Jonas regarda le feu jusqu’au bout. Enfant, à la fenêtre d’une cuisine, il l’avait compté depuis un, une ligne par battement dans un cahier bleu, jusqu’à ce que le compte tombe juste et que personne ne vienne. Depuis, il le convertissait : une heure pour elles, tant de jours pour lui. Il commença le calcul des jours qu’il faudrait, là-haut, pour que la Tour se rallume, et le laissa en route ; il n’y avait plus personne à la fenêtre de la cuisine. Quand le Fanal s’éteignit, il ne convertit rien. Il se remit à compter, et cette fois il commença par la fin : dix-sept.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "Les Marcheurs",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "À Demeure, il était six heures du matin, le 3 275ᵉ jour : l’heure du convoi. Là-haut, à Surplomb, on devait être le 18 avril, ou déjà le 19, et il n’y avait plus de fil pour le demander.",
     "mentions": []
    },
    {
     "id": "c6-b02",
     "text": "La pendule de la gare marchait toujours. Le câble s’était planté dans le mur à un travers de main au-dessous d’elle, à travers le cadre du Barème, et elle avançait au-dessus de lui par petits sauts, sans s’en occuper. Adeline s’était relevée. Colombe, assise par terre contre le carton à chapeau, la boîte à pastilles dans le poing, surveillait la grande aiguille ; quand elle fut droite, elle hocha la tête.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "— Maintenant, dit-elle, ils sont en retard.",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "Personne sur le quai ne la contredit. Sans le bruit des Bennes, la halle paraissait plus grande, et plus vieille. On entendait la bruine sur la voie, qu’on n’avait jamais entendue, et au-dessus, très haut, le sifflement du bord, mince et continu, comme une bouilloire oubliée dans une autre maison. Le préposé tenait toujours sa lanterne sans verre. Une des engagées s’était assise sur son baluchon ; elle défaisait son chignon pour le refaire, et le refaisait.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "Castaing arriva sans chapeau, la dérouleuse sur les talons. Il regarda la voie vide, puis le mur, puis le câble dans le mur, et, parce qu’il lisait à voix haute tout ce qu’on lui mettait dans les mains, il lut la bande de papier bleu que la dérouleuse lui tendait. La bande était tombée de l’appareil un peu avant que le fil ne parte.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "« Direction à Résident. Faire garder le pied de la vieille Rampe, derrière les tanneries. Nul ne monte par la Rampe : on y meurt. H. Vaudrey. »",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "Il envoya deux gardes aux tanneries. La dérouleuse avait roulé la bande autour de son doigt ; de l’autre main, sans s’en apercevoir, elle faisait encore le geste de tourner une manivelle. Adeline porta la main à la poche de son châle. Il n’y restait que la clé, un peu de pâte de papier, et un mouchoir qui n’était pas à elle.",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "Elle revint à la Maison avec l’enfant dans la couverture et le carton sur la hanche. Sous les arcades de la place de la Chambre, des gens en bonnet de nuit tendaient l’oreille vers la gare, la tête penchée, comme devant une horloge arrêtée dont on attend qu’elle reparte.",
     "mentions": []
    },
    {
     "id": "c6-b09",
     "text": "On rapporta les Menou vers huit heures. Ils étaient partis sitôt la nouvelle, disait-on : Monsieur Menou, son gendre et deux invités du souper, en manteaux de voyage, avec des cannes, pour monter à pied par la voie des Bennes jusqu’à l’Octroi et s’y faire porter le reste du chemin ; les valets suivaient avec les malles. Les messieurs revinrent sur le dos des valets. Les valets avaient les genoux crevés et le devant noir de la boue de la voie : ils étaient montés les rechercher à plat ventre.",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "Salvat les fit coucher sur les tables du réfectoire. Adeline coupa les bottes aux grands ciseaux de la lingerie, parce qu’on ne pouvait plus les tirer. Dessous, les jambes avaient enflé jusqu’aux genoux et noirci comme des prunes trop mûres ; on sentait leur chaleur avant de les toucher. Le gendre criait quand on les effleurait et, entre deux cris, jurait que c’était d’avoir dansé toute la nuit. Monsieur Menou était arrivé sur le dos de son cocher, qui lui tenait les poignets serrés contre sa poitrine, comme on porte un enfant endormi. Il était mort en route. Le cocher ne s’en était aperçu qu’en le posant, parce qu’un homme qu’on porte ne pèse pas plus lourd mort que vivant.",
     "mentions": []
    },
    {
     "id": "c6-b11",
     "text": "— Couché, on passe, dit le cocher à Salvat, comme on s’excuse. Eux, ils ne voulaient pas se coucher. Il y avait de la boue.",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "Après les Menou, personne ne prit plus la voie. On montait jusqu’à la gare, on regardait le câble dans le mur et la voie vide qui s’en allait dans le Voile, et l’on redescendait sans rien dire. Au premier lit de la salle, le vieux Brisson avait replié sa dernière Gazette. Il la rouvrit à la première page, en lissa le pli du plat de la main et recommença par la manchette, lentement, comme on entame la dernière miche.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "— Il faudra que je lise moins vite, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "Zélie gratta à la porte de service un peu avant dix heures : deux coups d’ongle, un silence, un troisième. Elle avait de la boue jusqu’aux coudes.",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "— La Doyenne fait allumer les lampes de fête au bord. Toutes. On les pose à plat ventre.",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "— Pour mesurer, elle dit. Elle n’a pas dit quoi.",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "La terrasse de la Maison était un toit-jardin cerné d’un parapet, avec des figuiers en caisse et une longue-vue de laiton sur trépied, qu’une veuve de rentier avait léguée aux malades pour qu’ils voient la Nuit des Lampes sans descendre, avec une rente pour la faire astiquer. Madame Rougier y fit monter les enfants de la salle, et Brisson dans son fauteuil. Lucien voulut prendre sa lampe ; personne ne lui dit qu’il faisait jour, puisqu’à Demeure il ne faisait jour que la moitié de chaque ciel. Colombe se laissa porter dans l’escalier en comptant les marches à voix haute, pour qu’on sache qu’elle surveillait. Adeline monta son tabouret de la lingerie et le posa sous la longue-vue.",
     "mentions": []
    },
    {
     "id": "c6-b19",
     "text": "D’en haut, on voyait la ville basse descendre par ses toits-jardins jusqu’aux Berges, et tout au bout la rue des Lavoirs. Adeline la reconnut mal. Le verre gris que l’eau avait fait sur les pavés, dans la nuit, devant les lavoirs, était monté jusqu’à mi-rue ; les lavoirs n’étaient plus qu’une rangée de toits posés sur une vitre. Plus bas, les grands réverbères du quai des Lampes se tenaient debout dans l’eau immobile, éteints. Au-delà, c’était le noir : pas un noir de nuit, un noir de puits, où les yeux ne trouvaient rien à quoi se tenir.",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "À l’angle d’en haut, là où l’on s’était arrêté la nuit, il y avait du monde, et au milieu du monde un fauteuil, et dans le fauteuil une petite chose noire et droite. Les juges se tenaient derrière elle en robes à rabats, sous la bruine ; Adeline ne les avait jamais vus dehors. Des gens de la Chaîne descendirent la rue à plat ventre en poussant devant eux, comme on pousse un seau sur un carrelage qu’on lave, les lampes de fête, ces lampes de cuivre à globe rond que chaque maison ne sortait qu’une nuit par an. Ils les rangèrent au bord du verre, d’un trottoir à l’autre, les allumèrent couchés, et remontèrent à reculons, sur les coudes.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "Le Voile battait vite, ce matin-là ; les yeux n’avaient pas le temps de s’y faire. Quand les lampes furent allumées, il était au plus blanc, et les flammes n’y faisaient que des points pâles. Puis il grisa, fonça, et la rue des Lavoirs devint une rangée de feux jaunes posée au bord du noir. Colombe était debout sur le tabouret, l’œil à la longue-vue, les mains d’Adeline autour de sa taille. Salvat avait ouvert sa montre, par l’habitude de prendre les pouls. Les enfants avaient le menton sur le parapet. On attendit.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "Ce fut Colombe qui le vit la première, parce qu’elle avait le tube ; mais ils le virent tous presque aussitôt, à l’œil nu. Au-delà des lampes, au bord du quai, là où il n’y avait rien, il y eut un homme. Il ne vint pas de quelque part : il fut là, pâle d’abord, puis jaune, éclairé par-devant, d’en bas, par les lampes qu’on venait d’allumer. Il avait le pied droit levé pour passer le rebord du quai, la perche sur l’épaule, la lanterne en avant, et la bouche ouverte.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "— C’est l’allumeur, dit Lucien.",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "Salvat regarda sa montre et la referma. Près du fauteuil, en bas, un homme penché écrivait sur un registre posé sur son genou. Adeline chercha la petite à l’angle de la rue, et la trouva sans longue-vue. Dans toute la foule tournée vers l’Ombilic, une seule personne lui tournait le dos : une enfant en chemise, le front contre le mur de la boulangerie.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "Le Voile reblanchit, et l’allumeur s’y noya ; il revint quand le Voile refonça, au même endroit, le même pied en l’air. On attendait les autres. Ils ne venaient pas. En bas, des gens commencèrent à remonter la rue en se retournant ; les juges parlaient entre eux. Le fauteuil ne bougea pas.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "— Et les vieux ? dit un enfant.",
     "mentions": []
    },
    {
     "id": "c6-b27",
     "text": "— Ceux-là, on les éclaire pour l’an prochain, dit Brisson, qui connaissait la phrase.",
     "mentions": []
    },
    {
     "id": "c6-b28",
     "text": "— Alors on attend un an, dit Colombe, sans lâcher le tube.",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "Ils vinrent au ciel suivant, ou à celui d’après ; Adeline avait cessé de compter. Loin au-delà du quai, bien plus loin que l’allumeur, le noir se mit à pâlir par endroits, comme un drap noir qui s’use aux plis, et il en sortit des épaules, des têtes, des ballots. Ils étaient éclairés d’en bas, d’une lumière jaune et franche qui ne pouvait pas venir d’aussi loin que les lampes de la Doyenne. C’était une lumière de réverbères, de grands réverbères tout proches. Il n’y en avait pas d’autres que ceux du quai, et ceux du quai étaient éteints.",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "— Les lampes de la dernière Nuit, dit Brisson. Elles ont mis le temps.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "En bas, près du fauteuil, l’homme au registre s’était remis à écrire.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "— Ils viennent vers nous, dit un des petits, et les autres le dirent avec lui, avec les mots d’Adeline, parce que les enfants veulent les mêmes mots.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "Colombe comptait. Elle promena le tube d’une silhouette à l’autre en remuant les lèvres, puis revint à l’allumeur, qui se tenait devant eux comme un homme qui montre le chemin.",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "— Huit, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "Puis elle ne dit plus rien, si longtemps qu’Adeline la crut transie et voulut la faire descendre. Colombe se dégagea d’un coup d’épaule.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "— Ils ne viennent pas, dit-elle. Ils courent. Regarde leurs pieds.",
     "mentions": []
    },
    {
     "id": "c6-b37",
     "text": "Elle céda le tabouret. Adeline dut se courber ; le laiton était froid et sentait le tabac de Brisson. Il lui fallut un moment pour trouver le quai, la perche, le visage de l’allumeur et sa bouche ouverte, puis, derrière lui, loin, les autres. Ils étaient penchés en avant, tous, comme des gens qui vont tomber et ne tombent pas. Sous chacun d’eux, entre le pied et le sol, il y avait un peu de noir. Pas un pied ne touchait terre. Elle revint à l’allumeur : lui avait le pied gauche posé à plat sur le quai, le poids dessus, comme un homme qui rentre chez lui.",
     "mentions": []
    },
    {
     "id": "c6-b38",
     "text": "— Quand on marche, on a toujours un pied par terre, dit Colombe dans son dos. Sinon on tombe. Eux, ils n’en ont pas.",
     "mentions": []
    },
    {
     "id": "c6-b39",
     "text": "— Ils sautent, peut-être, dit Lucien.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "— On ne saute pas avec ses affaires.",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "Adeline remonta le long des jambes jusqu’aux fardeaux. C’étaient des ballots de peaux, noués de lanières, si lourds que les épaules pliaient dessous. Celui d’une femme plus petite que les autres avait une tête. Une tête d’enfant, ronde, qui ne regardait pas la ville : elle regardait derrière, par-dessus l’épaule de sa mère, vers le noir d’où ils venaient.",
     "mentions": []
    },
    {
     "id": "c6-b42",
     "text": "Brisson demanda la longue-vue. On roula son fauteuil jusqu’au trépied. Il regarda longtemps, en tenant le laiton à deux mains, comme un journal.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "— Tous les ans, dit-il enfin, je regardais leurs figures.",
     "mentions": []
    },
    {
     "id": "c6-b44",
     "text": "Adeline regarda sans tube. D’ici, ce n’étaient plus que des taches pâles au bord du noir, et une plus proche, et l’on pouvait y voir ce qu’on voulait.",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "— Ton histoire est à l’envers, dit Colombe.",
     "mentions": []
    },
    {
     "id": "c6-b46",
     "text": "Elle s’assit sur la marche du parapet et se mit à examiner ses chaussures avec beaucoup d’intérêt. Elle avait les lèvres grises. En bas, au bord du verre, les lampes de fête brûlaient toujours ; à l’angle de la rue, l’enfant en chemise ne s’était pas retournée.",
     "mentions": []
    },
    {
     "id": "c6-b47",
     "text": "Salvat la porta lui-même jusqu’à son lit, ce qu’il ne faisait jamais, lui prit le pouls au poignet, puis à la cheville, longtemps, et fit signe à Adeline de le suivre dans l’embrasure de la fenêtre, dos au Voile.",
     "mentions": []
    },
    {
     "id": "c6-b48",
     "text": "— Vous allez me demander si elle passerait, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b49",
     "text": "— Je ne vous demande rien.",
     "mentions": []
    },
    {
     "id": "c6-b50",
     "text": "— Je réponds quand même, ça m’occupe. Non. Son sang n’arrive déjà pas jusqu’à ses joues. Même couchée sur votre dos, elle gardera un doigt de pente entre la tête et les pieds. Pour vous, ce n’est rien. Pour elle, dans le Raide, c’est assez.",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Il remonta ses lunettes sur son front.",
     "mentions": []
    },
    {
     "id": "c6-b52",
     "text": "— Et Hérault est déjà vieux. J’ai lu dans le sac de l’aube un certain Morvan qui fait mieux, avec moitié moins de fer. Au prochain sac, Morvan sera vieux aussi. C’est tout ce qu’on sait faire ici : attendre que les remèdes vieillissent assez pour devenir bons.",
     "mentions": []
    },
    {
     "id": "c6-b53",
     "text": "— Il n’y aura plus de sac.",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "— Non, dit Salvat. C’est bien ce qui m’ennuie. Je lis ce feuilleton depuis cent vingt ans, et on me coupe avant la fin. Si j’étais moins lâche, j’irais voir.",
     "mentions": []
    },
    {
     "id": "c6-b55",
     "text": "Elle ne répondit pas. Elle regardait sa blouse, boutonnée de travers depuis le matin, un bouton trop haut, comme toujours. Elle la déboutonna de haut en bas et la reboutonna juste, bouton par bouton, sans rien dire, comme elle faisait aux petits le dimanche. Salvat se laissa faire, les bras un peu écartés. Quand elle eut fini, il regarda le devant de sa blouse, puis elle, et il rabaissa ses lunettes sur son nez.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "— Elle ne passera pas, Line, dit-il encore, plus bas, et il s’en alla vers le lit de Lucien.",
     "mentions": []
    },
    {
     "id": "c6-b57",
     "text": "Elle savait attendre. À bien compter, c’était même la seule chose qu’elle eût jamais faite jusqu’au bout.",
     "mentions": []
    },
    {
     "id": "c6-b58",
     "text": "La cloche de la Tour sonnait midi quand Zélie revint à la porte de service. Elle avait sous le bras le cahier de blanchisseuse où la Chaîne tenait ses comptes, et elle ne l’ouvrit pas ; elle le savait par cœur.",
     "mentions": []
    },
    {
     "id": "c6-b59",
     "text": "— On a fait le compte, dit-elle. Les gages. Ils nous payent au Barème, et le Barème retarde. Depuis l’automne, sur dix jours qu’on sert, il y en a quatre pour rien.",
     "mentions": []
    },
    {
     "id": "c6-b60",
     "text": "— Qu’est-ce que vous allez faire ?",
     "mentions": []
    },
    {
     "id": "c6-b61",
     "text": "— Monter réclamer. Ils ont mis des gardes à la Rampe. S’ils la gardent, c’est qu’on y passe.",
     "mentions": []
    },
    {
     "id": "c6-b62",
     "text": "— Tu sais où elle commence ?",
     "mentions": []
    },
    {
     "id": "c6-b63",
     "text": "— Tout le monde sait où elle commence. Les tanneurs savent où on la prend.",
     "mentions": []
    },
    {
     "id": "c6-b64",
     "text": "Adeline regarda par l’entrebâillement de la lingerie, vers le lit où Colombe dormait assise, adossée à l’oreiller, la bouche ouverte.",
     "mentions": []
    },
    {
     "id": "c6-b65",
     "text": "— Montre-moi.",
     "mentions": []
    },
    {
     "id": "c6-b66",
     "text": "Zélie suivit son regard jusqu’au lit, et ne demanda rien.",
     "mentions": []
    },
    {
     "id": "c6-b67",
     "text": "Adeline alla remplir la lampe de Lucien, qui était encore presque pleine, moucha la mèche et la reposa sur la tablette.",
     "mentions": []
    },
    {
     "id": "c6-b68",
     "text": "— Tu la prends ? dit Lucien.",
     "mentions": []
    },
    {
     "id": "c6-b69",
     "text": "— Non. Elle est à toi.",
     "mentions": []
    },
    {
     "id": "c6-b70",
     "text": "— Il fait noir, là où tu vas ?",
     "mentions": []
    },
    {
     "id": "c6-b71",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c6-b72",
     "text": "— Alors prends-la.",
     "mentions": []
    },
    {
     "id": "c6-b73",
     "text": "— Zélie m’en donne une autre.",
     "mentions": []
    },
    {
     "id": "c6-b74",
     "text": "Colombe s’était réveillée. Elle ne demanda rien non plus ; elle descendit de son lit, prit le carton à chapeau à deux mains et alla le poser au pied du lit de Lucien.",
     "mentions": []
    },
    {
     "id": "c6-b75",
     "text": "— Tu la gardes. Tu n’as pas le droit d’y toucher.",
     "mentions": []
    },
    {
     "id": "c6-b76",
     "text": "— Alors comment je la garde ?",
     "mentions": []
    },
    {
     "id": "c6-b77",
     "text": "— Tu la regardes.",
     "mentions": []
    },
    {
     "id": "c6-b78",
     "text": "Sous l’oreiller de Colombe, il y avait le reçu de l’Hôtel-Dieu, plié en huit. Adeline le prit, sortit la clé de la poche du châle et glissa l’un et l’autre dans son corsage, contre la peau, où le fer se réchauffa tout de suite. Sur la porte de la salle, madame Rougier tenait épinglée la liste des Attendants, avec en face de chaque nom ce qu’il attendait. Adeline la décrocha, la plia et la mit avec le reçu ; là-haut, il faudrait bien que quelqu’un sache qui restait.",
     "mentions": []
    },
    {
     "id": "c6-b79",
     "text": "Puis elle assit Colombe au bord du lit, s’accroupit devant elle, dos tourné, et la fit monter. Elle noua le châle en croix sur sa poitrine et, par-dessus, pour tenir les jambes, une sangle de toile de celles qui liaient les ballots de draps.",
     "mentions": []
    },
    {
     "id": "c6-b80",
     "text": "— Je ne suis pas un paquet, dit Colombe.",
     "mentions": []
    },
    {
     "id": "c6-b81",
     "text": "— Non. Un paquet, ça se tait.",
     "mentions": []
    },
    {
     "id": "c6-b82",
     "text": "Colombe se tut, et compta les marches de l’escalier de service ; elle en sauta plusieurs, pour arriver plus vite en bas.",
     "mentions": []
    },
    {
     "id": "c6-b83",
     "text": "Elles descendirent derrière Zélie par les ruelles de l’ouest, loin de la rue des Lavoirs. Les tanneries s’adossaient au versant, au bout des Berges, là où la roche remontait d’un coup : des cours pleines de fosses, une odeur d’écorce et de chaux qui prenait à la gorge, et sous les toits des séchoirs à claire-voie où pendaient les peaux. Au fond de la dernière cour, une arche ouvrait dans le roc un chemin de terre battue qui partait vers le nord, presque à plat. Sous l’arche, les deux gardes se chauffaient les mains au-dessus d’un brasero. Zélie mit sa lanterne dans la main d’Adeline et alla vers eux avec un pot de café, en parlant fort, de sa voix de lavoir.",
     "mentions": []
    },
    {
     "id": "c6-b84",
     "text": "Un des garçons qui avaient rampé avec Zélie dans la nuit attendait Adeline dans le séchoir. Il la fit passer entre les peaux, qui pendaient en rangs serrés et lui mouillaient la joue, jusqu’à une lucarne basse au bout du grenier. Dehors, à hauteur d’appui, passait un chemin : le lacet d’au-dessus, qui revenait vers le sud au ras du toit, et où les tanneurs hissaient leurs peaux à sécher au vent de la pente depuis qu’il y avait des tanneurs. Le garçon fit la courte échelle. Adeline passa la lucarne à genoux. D’après l’état civil, elle avait soixante-sept ans, et l’enfant sur son dos en avait dix-sept ; à Surplomb, la Gazette en aurait tiré un fait divers. Elle se retrouva dans l’herbe du lacet, au-dessus de l’arche, au-dessus des gardes, et entendit Zélie rire, et l’un d’eux demander s’il y avait du sucre.",
     "mentions": []
    },
    {
     "id": "c6-b85",
     "text": "Elle ne se retourna pas avant le tournant. Là, contre le roc, elle alluma la lanterne de Zélie, et Colombe, dans son dos, tourna la tête pour regarder en bas. On voyait les toits des tanneries, la ville basse, la Tour qui entrait dans le Voile, et au bord du noir une petite ligne de feux jaunes que personne n’avait encore éteinte. Le lacet partait devant elle, sous les ronces, presque à plat, comme un chemin qui n’aurait jamais voulu arriver. Elle le prit. Elle ne courut pas.",
     "mentions": []
    }
   ]
