          "id": "c1-b01",
          "text": "La voiture roulait depuis l’aube dans un brouillard qui sentait la lagune, et Lucius dormait, la tête contre le montant de cuir, la bouche un peu ouverte, comme un enfant qu’on ramène d’une fête. Marc le regardait dormir. Il avait quarante-sept ans, une poitrine qui lui faisait mal dès que l’air devenait froid, et il tenait sur ses genoux une tablette de cire où il n’avait rien écrit depuis Aquilée. Derrière eux, à deux journées de route, le camp brûlait ses morts.",

        {
          "id": "c1-b02",
          "text": "On les brûlait par dizaines, sur des bûchers qu’on n’avait plus le bois de faire hauts. Galien, qui était venu de Rome sur l’ordre des deux empereurs, avait passé l’hiver à décrire ce qu’il ne savait pas guérir : la fièvre qui montait le neuvième jour, l’éruption noire, la toux qui arrachait la gorge, la diarrhée qui vidait un homme en trois nuits. Il notait tout d’une écriture rapide, avec une sorte de colère méthodique, et quand Marc lui avait demandé ce qu’on pouvait faire, il avait répondu : « Décrire, César. Je ne sais pas encore autre chose. »",

          "text": "C’était Lucius qui avait voulu rentrer. Il l’avait dit une nuit, dans la maison du préfet d’Aquilée, en marchant de long en large comme il faisait quand il avait bu et qu’il voulait paraître sobre : il y avait plus de morts dans le camp que devant le camp ; on ne faisait pas la guerre à des Marcomans qu’on ne voyait pas depuis un camp où l’on voyait mourir ses propres hommes ; le Sénat s’inquiétait ; Rome s’inquiétait ; et lui, Lucius, s’inquiétait. Marc avait voulu rester. Il l’avait dit une fois, calmement, puis il avait cédé, parce qu’il y a des choses dont on peut discuter longtemps et d’autres qui se décident en regardant le visage de celui qui parle. Lucius avait le visage d’un homme qui a peur. On ne discute pas avec la peur ; on la ramène chez elle.",

          "text": "La lance était plantée devant la basilique Ulpia depuis le matin, et Nikias, qui n’avait jamais vu vendre un empereur, s’était fait une place au pied d’une colonne pour ne rien perdre. Une lance fichée en terre, à Rome, voulait dire vente publique : on l’avait plantée pour les butins de guerre et pour les biens des condamnés, et voilà qu’on la plantait pour la vaisselle du Palatin. Le crieur s’éclaircissait la voix. Le premier lot était une coupe de cristal, de la taille d’un crâne d’enfant, avec un pied d’or.",

          ]
        },
        {
          "id": "c2-b02",
          "text": "Il était là pour écrire. Le bureau des lettres grecques, qui n’avait rien à faire dans une affaire de fisc, avait prêté trois tachygraphes au bureau des comptes parce que les scribes latins n’allaient pas assez vite, et Nikias était le plus rapide des trois. Il avait vingt-deux ans, une tablette de cire à quatre volets, un stylet d’os qu’il tenait comme un couteau, et les signes de la sténographie grecque dans les doigts depuis l’âge de douze ans — ces petits crochets, ces points, ces traits penchés qu’un maître d’Alexandrie lui avait fait tracer dix mille fois sur le sable avant de lui permettre la cire. On lui avait dit d’enregistrer le nom de l’acheteur, le prix, l’objet. On ne lui avait pas dit de regarder. Il regardait quand même.",

          "text": "Ils repartirent le surlendemain. Commode chevauchait en tête, le visage fermé, et il avait cessé de pleurer ; il ne pleurerait plus, pensa Nikias, ou pas de cette façon-là. L’empereur voyageait seul dans la voiture, maintenant, avec ses tablettes. Nikias, sur le chariot des archives, regarda le Taurus se refermer derrière eux, et le bourg disparaître, et il fit ce qu’il faisait quand quelque chose s’était mal placé et qu’il fallait le remettre en ordre avant de continuer : il chercha ce qui dépendait de lui. Sa mère ne dépendait pas de lui ; elle était à Alexandrie, avec ses lettres dans une boîte. L’Augusta ne dépendait plus de personne. L’empereur ne dépendait pas de lui — c’était même le contraire, il en avait fait le compte. Ce qui dépendait de lui, c’était d’être là, demain, à l’aube, avec ses tablettes, quand on l’appellerait, et le jour d’après, et jusqu’au bout, quel que fût le bout. Il n’avait rien promis. Il le décida, dans le chariot, en signes, comme il décidait tout, et il s’aperçut qu’il venait d’écrire, pour la première fois, une note pour lui-même.",

    {
      "id": "chapitre-9",
      "number": 9,
      "title": "Éleusis",
      "blocks": [
        {
          "id": "c9-b01",
          "text": "La Voie sacrée allait d’Athènes à la mer en vingt milles, et on la faisait à pied, en un jour, au mois de Boédromion, derrière la statue d’Iacchos qu’on portait sur les épaules, en criant son nom à chaque pont. Marc la fit à pied. Il avait cinquante-cinq ans, une poitrine qui n’aimait pas la poussière, et il marchait au milieu de plusieurs milliers de gens — des Athéniens, des Grecs de partout, des Romains, des esclaves, car les Mystères prenaient tout le monde pourvu qu’on parlât grec et qu’on n’eût pas tué —, sans escorte visible, en tunique de lin, avec Commode à côté de lui, qui trouvait la marche longue, et Hérode Atticus devant, qui la trouvait courte, parce qu’il était d’Athènes et qu’il la faisait depuis soixante ans.",
          "mentions": [
            "eleusis",
            "herode-atticus",
            "commode",
            "marc-aurele"
          ]
        },
        {
          "id": "c9-b02",
          "text": "Il avait fait le vœu à Carnuntum, la deuxième année, un soir où le fleuve grondait et où l’on avait compté les morts d’Opitergium : que si la guerre finissait, il irait à Éleusis se faire initier, comme Hadrien, comme Auguste, comme tant d’hommes qui avaient voulu savoir ce qu’on y montrait. Il avait écrit le vœu sur une tablette, avec la date, comme il notait tout. Puis les Costoboques étaient descendus jusqu’à Éleusis, l’année d’après, et avaient brûlé la salle des initiations, et il avait payé de sa cassette pour qu’on la rebâtît, sans l’avoir vue. Il la verrait ce soir. Il pensait, en marchant, que c’était une drôle de chose, un vœu : une dette contractée envers quelqu’un dont on ne sait pas s’il existe, et qu’on paie quand même, parce que ce qui dépend de nous, c’est de payer.",
          "mentions": [
            "eleusis",
            "carnuntum",
            "les-costoboques",
            "ce-qui-depend-de-nous"
          ]
        },
        {
          "id": "c9-b03",
          "text": "Hérode marchait devant, avec son bâton et ses cheveux blancs, et il ne s’était pas retourné une seule fois depuis Athènes. C’était lui le mystagogue : celui qui conduit l’initié, qui lui dit quand se taire et quand crier, qui répond de lui devant le hiérophante. Marc l’avait demandé, dans la lettre écrite deux ans plus tôt, après Sirmium, la seule lettre de sa vie où il eût dit à un homme, noir sur blanc, qu’il pouvait lui demander réparation. Hérode n’avait pas répondu. Il était venu au port, quand le navire de Smyrne avait accosté, avec son bâton et ses cheveux blancs, et il avait dit : « Tu m’as demandé de te conduire. Je te conduirai. Ne me parle pas de Sirmium. » Et Marc, qui avait préparé des phrases, les avait rangées.",
          "mentions": [
            "herode-atticus",
            "marc-aurele",
            "eleusis"
          ]
        },
        {
          "id": "c9-b04",
          "text": "Ils arrivèrent à la nuit. On ne racontait pas ce qui se passait à Éleusis ; c’était la seule loi du lieu, et elle avait tenu mille ans, ce qui prouvait, pensa Marc, que les hommes savent se taire quand on leur donne une bonne raison. Il jeûna, comme les autres. Il but le breuvage d’orge et de menthe, dans une coupe qu’on passait de main en main, et qui avait le goût de la soupe des soldats. Il se tint dans la foule, dans le noir, devant les portes fermées de la grande salle, avec des milliers de gens qui respiraient ensemble, et il sentit ce qu’il n’avait pas senti depuis le vallon de la Granua sous la pluie : la sensation d’être une part, et non le tout ; un homme dans une foule, à qui l’on ne demandait rien, sinon d’attendre.",
          "mentions": [
            "eleusis",
            "la-nature-universelle"
          ]
        },
        {
          "id": "c9-b05",
          "text": "Puis on l’appela. On l’appela seul, avant les autres, et il comprit pourquoi : parce qu’il avait demandé, dans la lettre, à entrer seul dans le sanctuaire, pour que l’on vît — le Sénat, l’Empire, ceux qui chuchotaient encore sur Cassius et sur Faustine — qu’il n’avait rien à cacher aux dieux et qu’il pouvait, seul, dans le noir, supporter d’être regardé par eux. Ce n’était pas une preuve. Il le savait. C’était un geste, comme la tête refusée, comme les lettres brûlées, et il avait appris que les gestes sont ce que les hommes retiennent, quand les raisons sont trop longues. Il entra. Hérode resta à la porte.",
          "mentions": [
            "eleusis",
            "marc-aurele"
          ]
        },
        {
          "id": "c9-b06",
          "text": "Il ne raconta jamais ce qu’il y vit, et il ne l’écrivit pas non plus, ni cette nuit-là ni plus tard, de sorte que même celui qui copiait ses tablettes n’en sut rien. On peut seulement dire ce qu’il en sortit. Il en sortit vers la troisième veille, avec les autres, dans le grand cri des torches, et il monta sur la colline au-dessus du sanctuaire, où l’on voyait la baie de Salamine, et il s’assit sur une pierre, seul, sans que personne osât l’approcher, et il regarda.",
          "mentions": [
            "eleusis",
            "salamine"
          ]
        },
        {
          "id": "c9-b07",
          "text": "Il regarda d’en haut. C’était un exercice qu’il faisait depuis trente ans, et qu’il avait écrit dix fois de dix façons : se placer au-dessus, en esprit, et voir les troupeaux innombrables, les cérémonies innombrables, les navigations dans la tempête et dans le calme, les hommes qui naissent, qui vivent ensemble, qui disparaissent ; voir l’époque de Vespasien, qui avait eu ses mariages, ses maladies, ses guerres, ses fêtes, ses flatteurs, ses gens qui souhaitaient la mort d’autrui et qui briguaient le consulat, et dont il ne restait rien ; puis l’époque de Trajan, les mêmes passions, et rien ; et se dire que la sienne suivrait, avec Cassius et Faustine et Commode et lui, et qu’un jour on dirait « Antonin » comme on disait « Camille », un nom sans visage. Il l’avait écrit. Il ne l’avait jamais vu. Cette nuit-là, sur la pierre, avec Salamine en bas où il y avait eu, six siècles plus tôt, la bataille, et le cri des initiés qui montait de la plaine, et la Grèce noire tout autour, il le vit.",
          "mentions": [
            "la-vue-d-en-haut",
            "les-pensees",
            "salamine"
          ]
        },
        {
          "id": "c9-b08",
          "text": "Ce n’était pas triste. C’est ce qui l’étonna. Il avait cru, toute sa vie, que la vue d’en haut était un remède amer, une chose qu’on prend pour guérir de l’orgueil et de la peur, et qu’on prend en fermant les yeux. Et voilà que c’était doux. Il vit Faustine, dans la liste des morts, un nom parmi les noms ; il vit Lucius, l’enfant de Préneste, Rusticus, Fronton, Vindex, Fronto le gouverneur, les vingt mille trois cent onze, Cassius avec son cou ouvert ; il se vit, lui, un peu plus loin sur la même ligne, à sa place, ni plus grand ni plus petit ; et ce qu’il ressentit ne fut pas le chagrin ni le vertige, mais une sorte de gratitude sans objet, comme celle de l’olive mûre qui tombe en louant la terre qui l’a portée. Il pensa : tout ce qui te convient me convient, ô Monde. Rien pour moi n’est prématuré ni tardif de ce qui vient à ton heure. Il l’avait écrit aussi. Il le pensa, cette fois, sans effort.",
          "mentions": [
            "la-vue-d-en-haut",
            "faustine",
            "les-pensees",
            "la-nature-universelle"
          ]
        },
        {
          "id": "c9-b09",
          "text": "Il redescendit à l’aube. Hérode l’attendait à la porte, où il était resté toute la nuit, debout, avec son bâton, comme un mystagogue doit rester, et quand Marc arriva à sa hauteur, le vieil homme dit, sans le regarder : « Tu as vu. — J’ai vu. — Alors nous sommes quittes. » Et ce fut tout ce qu’ils se dirent de Sirmium, jusqu’à la mort d’Hérode, l’année suivante.",
          "mentions": [
            "herode-atticus",
            "marc-aurele"
          ]
        },
        {
          "id": "c9-b10",
          "text": "Il resta à Athènes jusqu’en novembre. Il y fit ce qu’il avait décidé de faire depuis le vallon de la Granua, un soir où il avait pensé que les soldats savaient boire dans leur casque mais que personne ne leur avait appris à penser : il fonda des chaires. Quatre de philosophie — une pour chaque école, la platonicienne, la stoïcienne, l’épicurienne, la péripatéticienne, parce qu’il n’était pas question de choisir pour les autres ce qu’il avait choisi pour lui —, et des chaires de rhétorique, avec un traitement annuel payé par le fisc, dix mille drachmes, de quoi vivre sans plaire. Il demanda à Hérode de choisir les titulaires de rhétorique, parce que c’était son art et qu’il fallait bien lui rendre quelque chose. Les philosophes d’Athènes vinrent le remercier ; il y avait parmi eux un épicurien, un vieil homme maigre qui n’avait pas l’air de croire qu'un empereur stoïcien pût payer un épicurien, et qui le lui dit. « Ou bien il y a une providence, répondit Marc, et elle a voulu que tu enseignes ; ou bien il n’y a que des atomes, et alors tu as raison, et il faut bien que quelqu’un l’enseigne. Dans les deux cas, prends l’argent. » Le vieil homme rit, et Marc pensa qu’il n’avait pas ri lui-même depuis la Palestine.",
          "mentions": [
            "les-chaires-d-athenes",
            "herode-atticus",
            "providence-ou-atomes"
          ]
        },
        {
          "id": "c9-b11",
          "text": "Puis il rentra à Rome, par Brindes, et il fit ce qu’il n’avait pas fait depuis sept ans : il prit la toge, et il fit prendre la toge à ses soldats, parce qu’on ne traverse pas l’Italie en manteau de guerre quand la guerre est finie — elle ne l’était pas ; elle ne l’était jamais ; mais on le dirait ainsi, et il fallait que ce fût vrai le temps d’un hiver.",
          "mentions": [
            "rome"
          ]
        },
        {
          "id": "c9-b12",
          "text": "Le triomphe eut lieu dix jours avant les calendes de janvier, dans le froid de décembre, qui n’était rien à côté de celui de Carnuntum et qu’il trouva pourtant plus dur, parce qu’il fallait le supporter debout, en toge brodée, sur un char, devant un million de gens. On avait mis Commode sur le char avec lui. Il avait quinze ans ; on l’avait salué imperator un mois plus tôt, avec son père, et il avait la puissance tribunicienne depuis le matin. Il se tenait bien. Il regardait la foule comme un garçon regarde un cadeau dont il sait, maintenant, qu’il est à sa taille. Et Marc, à un moment, sur le Forum, quand la foule cria si fort que les chevaux s’arrêtèrent, descendit du char et marcha à pied à côté, dans la poussière, une main sur la roue, pour que le peuple vît le fils seul sur le char — un vieil homme en toge qui court à côté du char de son fils, dirent les gens, et ils le dirent avec amour, et il le savait, et il pensa que c’était encore une teinte de pourpre, celle-là, la plus fine, et qu’il n’y pouvait rien.",
          "mentions": [
            "le-triomphe-de-176",
            "commode",
            "marc-aurele",
            "rome"
          ]
        },
        {
          "id": "c9-b13",
          "text": "Le peuple cria « huit ». Il le cria sur le Forum, au passage du char, en tendant huit doigts, parce qu’il voulait huit pièces d’or par tête pour fêter le retour, et qu’il avait calculé, comme il calcule, que l’empereur ne refuserait rien ce jour-là. Marc sourit — il sourit vraiment, on le vit — et il tendit huit doigts à son tour, et il donna huit cents sesterces par tête, ce qu’aucun empereur n’avait donné, et il pensa, pendant qu’on criait, qu’il venait de vider en une phrase ce qu’il avait mis deux mois à vendre au forum de Trajan, et que c’était juste, parce que l’argent était à eux et qu’il le leur rendait.",
          "mentions": [
            "le-triomphe-de-176",
            "rome"
          ]
        },
        {
          "id": "c9-b14",
          "text": "Le soir, au Palatin, dans la chambre qui avait été celle de Faustine et qu’il avait fait rouvrir, il écrivit. Il n’écrivit pas sur le triomphe ; il n’y avait rien à en écrire qu’il n’eût écrit sur l’araignée. Il écrivit sur son fils. Il écrivit — et c’était rare, il ne nommait presque jamais les vivants sur ses tablettes — qu’il fallait, chaque fois qu’on se heurte à une faute, se demander d’abord quelle en est la cause, et que la cause était l’ignorance, et que l’ignorance se guérissait par l’enseignement, non par la colère ; que le garçon avait été élevé du mieux qu’on pouvait, avec les meilleurs maîtres, et qu’il était jeune, et simple, comme l’avait dit Faustine, ce qui n’était pas un crime ; qu’il apprendrait ; que lui-même, à quinze ans, aimait les chevaux et la rhétorique et n’était devenu ce qu’il était que grâce à Rusticus, à vingt-cinq ans, et qu’il fallait laisser dix ans au garçon et lui trouver son Rusticus. Il écrivit aussi, parce qu’il était honnête, qu’il ne pouvait pas faire les hommes tels qu’il les souhaitait, et qu’il convenait d’employer ceux qui existaient pour le service que chacun pouvait rendre. Il relut cette ligne. Il ne vit pas qu’elle parlait de son fils autrement que les autres.",
          "mentions": [
            "commode",
            "les-pensees",
            "rusticus",
            "faustine"
          ]
        },
        {
          "id": "c9-b15",
          "text": "Il souffla la lampe. Il pensa à la colline d’Éleusis, à la vue d’en haut, à la douceur qu’il y avait eue, et il essaya de la retrouver, ici, dans cette chambre, en pensant à Commode ; et il s’aperçut qu’elle ne venait pas, que la vue d’en haut s’arrêtait à la porte de cette chambre, et que ce qu’il éprouvait pour son fils n’était pas de la philosophie mais de l’espoir — l’espoir, dont il avait écrit vingt fois qu’il fallait s’en défaire, parce qu’il ne dépend pas de nous. Il le garda. Il le sut, et il le garda, comme on garde une chose dont on sait qu’elle est trop lourde pour l’escalier, et il dormit.",

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}

function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
