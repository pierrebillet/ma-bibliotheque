          "text": "Le déplacement vers l’ensemble urbain commence avant la loi. En mai 1959, le ministère de la Construction dirigé par Pierre Sudreau lance un inventaire des tissus urbains anciens. La genèse n’appartient donc pas au seul ministère des Affaires culturelles. Un service chargé de construire et de rénover commence à identifier les formes urbaines que la modernisation pourrait altérer. Cet inventaire fournit un arrière-plan administratif à la loi de 1962, même si les documents consultés ne permettent pas ici de reconstituer son corpus complet ni sa méthode détaillée. La date est sûre dans le rapport sénatorial ; le contenu précis des dossiers et leur usage opérationnel restent à documenter. Il faut donc parler d’un travail préparatoire attesté, sans lui attribuer un programme exhaustif que les sources disponibles ne décrivent pas.",

          "id": "c2-b02",
          "text": "Le discours d’André Malraux du 23 juillet 1962 donne une formulation politique à cette évolution. Le ministre ne parle pas seulement de monuments remarquables, mais de la présence du passé dans la ville. Un édifice peut perdre une part de sa signification si le quartier qui l’entoure disparaît. La valeur patrimoniale ne réside donc pas seulement dans l’exception ; elle peut tenir à la continuité d’un tissu, à la relation entre les maisons, aux rues et aux espaces qui les organisent. Le quartier devient une unité de lecture du passé. Cette idée ne transforme pas chaque construction ancienne en monument historique. Elle affirme qu’un ensemble peut justifier une protection propre, parce que la cohérence des éléments compte autant que leur singularité.",

        {
          "id": "c2-b03",
          "text": "Malraux refuse de confondre sauvegarde et immobilité. Il défend des logements modernes derrière des façades et des structures urbaines conservées. L’eau, l’assainissement, l’électricité et le gaz appartiennent à la réflexion sur le plan. Le patrimoine n’est pas séparé des infrastructures ; il doit rester habitable. La restauration peut modifier les distributions intérieures, améliorer le confort et adapter les usages, à condition de préserver le caractère du quartier. La loi va donner à cette tension entre mémoire et usage une procédure plutôt qu’une simple déclaration de principe. Cette position explique pourquoi le dispositif relève aussi de la construction et de l’urbanisme : préserver un centre ancien suppose de savoir comment ses immeubles continueront à être occupés, desservis et transformés.",

            "psmv"

        {
          "id": "c2-b04",
          "text": "La loi n° 62-903 du 4 août 1962 crée les secteurs sauvegardés. Elle vise les ensembles urbains présentant un caractère historique ou esthétique, ou dont la conservation, la restauration et la mise en valeur sont justifiées. Le texte ne protège donc pas seulement une collection de monuments. Il permet de délimiter tout ou partie d’un ensemble de bâtiments et d’appliquer à ce territoire des règles particulières. Le quartier devient patrimoine au moment où il reçoit un périmètre juridique et une procédure d’intervention. Le choix des termes est important : conservation, restauration et mise en valeur associent le maintien de l’existant, la réparation des bâtiments et leur adaptation à une vie contemporaine. La loi ne promet pas une ville sous cloche.",

        {
          "id": "c2-b05",
          "text": "La création d’un secteur repose sur une articulation entre l’État et la commune. Un arrêté conjoint des ministres compétents intervient après l’avis favorable de la ou des communes concernées ; en cas de désaccord municipal, un décret en Conseil d’État peut créer le secteur. La loi reconnaît ainsi le rôle national de la protection tout en inscrivant les collectivités dans la procédure. Le patrimoine urbain n’est plus seulement une affaire de classement d’édifice : il devient une décision territoriale, prise à l’échelle d’un quartier mais soumise à une compétence d’État. Cette procédure prévoit donc un accord local lorsque la commune accepte le périmètre, mais elle n’abandonne pas à la seule décision municipale la possibilité de reconnaître un ensemble d’intérêt national.",

        {
          "id": "c3-b01",
          "text": "Le secteur sauvegardé est d’abord un périmètre, mais il ne fonctionne pas sans son plan. Le texte de 1962 prévoit un plan permanent de sauvegarde et de mise en valeur, devenu PSMV. Ce document ne se limite pas à inventorier les bâtiments remarquables. Il détermine les opérations possibles, les conditions de transformation et, dans certains cas, les démolitions nécessaires à la restauration ou à l’habitabilité. La protection prend ainsi la forme d’un document prescriptif qui engage l’urbanisme autant que le patrimoine. Le mot permanent appartient au texte originel ; l’usage administratif a retenu PSMV. Dans les deux cas, l’idée est la même : la sauvegarde doit être décrite parcelle par parcelle et traduite en décisions opposables aux projets.",

            "secteur-sauvegarde"
          ]

          "id": "c3-b03",
          "text": "Dès que le secteur est délimité, les travaux qui modifient les immeubles sont soumis à autorisation. Ils doivent être compatibles avec le PSMV. Avant l’approbation du plan, les travaux peuvent être temporairement interdits, pour une durée maximale de deux ans. Cette mesure vise à éviter les transformations irréversibles pendant la préparation du document. Le droit de 1962 ne se contente donc pas de sanctionner après coup une démolition ou une modification ; il cherche à maintenir l’état du quartier pendant le temps administratif nécessaire à l’élaboration des règles. Les prescriptions sont attachées à l’autorisation et peuvent préciser ce que le propriétaire devra exécuter. La sauvegarde intervient ainsi avant le chantier, au moment où le projet est encore modifiable.",

          "id": "c3-b06",

          "text": "Lyon et Sarlat ne sont pas des expériences identiques. Le Vieux-Lyon est un vaste quartier de 30 hectares et plusieurs milliers de logements ; Sarlat associe un centre historique de 11 hectares à un premier îlot opérationnel d’environ 2 hectares. Les dates les placent dans la même vague, mais les échelles, les formes urbaines et les rythmes de restauration diffèrent. Ce sont deux commencements parce qu’ils montrent une même invention juridique confrontée à des territoires différents. Le premier secteur, lui, reste une question de définition et de source. La conclusion la plus solide n’est pas de choisir un vainqueur, mais de distinguer le premier arrêté, le premier chantier, le premier plan et le premier modèle devenu célèbre. Les chiffres du Vieux-Lyon et de Sarlat ne mesurent pas seulement une réussite patrimoniale ; ils rappellent que la sauvegarde s’évalue aussi par des immeubles restaurés, des logements traités et des opérations réellement conduites. Deux dates sûres peuvent donc raconter plusieurs commencements.",

    {
      "id": "chapter-5",
      "number": 5,
      "title": "Le fisc entre dans le quartier",
      "blocks": [
        {
          "id": "c5-b01",
          "text": "Le nom de Malraux recouvre deux histoires juridiques distinctes. La loi du 4 août 1962 organise la protection du patrimoine urbain et crée les secteurs sauvegardés. Le régime fiscal appelé loi Malraux apparaît plus tard et rend certaines restaurations moins difficiles à financer. Ces mécanismes sont liés par leur objet, mais ils ne sont ni contemporains ni de même nature. Le premier relève du droit de l’urbanisme et de la conservation ; le second relève de l’impôt sur le revenu et de la restauration d’immeubles. Les confondre donne l’impression que la loi de 1962 aurait directement créé les taux de réduction actuels, ce que la chronologie dément.",
          "mentions": [
            "sources-et-methode",
            "loi-4-aout-1962",
            "loi-fiscale-malraux"
          ]
        },
        {
          "id": "c5-b02",
          "text": "En 1962, l’enjeu est de changer l’échelle de la protection. La loi permet de protéger un quartier, un tissu de rues et un ensemble d’immeubles, plutôt qu’un monument isolé. Le Plan de sauvegarde et de mise en valeur devient un document d’urbanisme spécifique, capable de fixer les règles de conservation, de restauration et de transformation. L’objectif est de maintenir un centre historique avec des usages contemporains. Cette innovation répond à la menace des rénovations urbaines radicales : les centres anciens, alors jugés insalubres, pouvaient être remplacés par des constructions neuves. La loi cherche donc à préserver une structure urbaine complète, sans réduire le patrimoine à quelques façades remarquables.",
          "mentions": [
            "loi-4-aout-1962",
            "psmv"
          ]
        },
        {
          "id": "c5-b03",
          "text": "Le régime fiscal apparaît avec la loi de finances pour 1977, et non avec le texte patrimonial de 1962. Il traite le problème des opérations groupées de restauration, qui produisent des déficits fonciers importants. Une dérogation permet alors de prendre en compte certaines charges liées aux travaux dans les secteurs sauvegardés. Le quartier protégé devient le support d’une opération immobilière dont la fiscalité contribue à l’équilibre financier. Le dispositif repose alors sur la déduction de charges et l’imputation de déficits, plutôt que sur le taux de réduction d’impôt aujourd’hui associé au nom Malraux. La première finalité fiscale est donc de rendre supportables des travaux complexes, souvent beaucoup plus coûteux qu’une rénovation ordinaire.",
          "mentions": [
            "loi-fiscale-malraux",
            "psmv"
          ]
        },
        {
          "id": "c5-b04",
          "text": "La loi de finances rectificative du 22 juin 1993 réduit l’avantage relatif accordé aux opérations de restauration. La durée de location est alors ramenée de neuf à six ans et les conditions liées aux ressources du locataire et au niveau du loyer sont supprimées. Cette évolution fait craindre un ralentissement de l’investissement privé dans les centres urbains dégradés et un transfert accru du coût vers les communes. Une réforme intervient dans la loi de finances rectificative pour 1994. Le régime fiscal est ainsi révisé selon ses effets sur l’investissement et la restauration, mais aussi selon les arbitrages entre aide privée et charge publique.",
          "mentions": [
            "loi-fiscale-malraux"
          ]
        },
        {
          "id": "c5-b05",
          "text": "La réforme de 2009 modifie la présentation et le fonctionnement du dispositif. Le régime n’est plus seulement construit autour de l’imputation de déficits fonciers sur le revenu global : il devient une réduction d’impôt attachée à des dépenses de restauration. Le propriétaire doit respecter des conditions concernant la localisation, la nature complète de l’opération et la mise en location. Le nom historique demeure, mais son contenu fiscal a changé depuis 1977. Cette transformation rend l’avantage plus lisible comme réduction, tout en maintenant une sélection stricte des immeubles et des travaux. Le régime ne vise donc pas l’ensemble de l’entretien courant du parc ancien : il concerne une restauration complète inscrite dans un cadre patrimonial.",
          "mentions": [
            "loi-fiscale-malraux"
          ]
        },
        {
          "id": "c5-b06",
          "text": "À la date des sources administratives consultées, une restauration complète dans un site patrimonial remarquable couvert par un PSMV approuvé ouvre droit à une réduction de 30 % des dépenses éligibles. Le taux indiqué est de 22 % dans un site patrimonial remarquable non couvert par un PSMV approuvé. Ces taux s’inscrivent dans un régime soumis à des conditions de localisation, de travaux et de mise en location. L’administration distingue aussi les opérations situées dans un site couvert par un PVAP et celles qui exigent une déclaration d’utilité publique. Les dépenses effectivement payées, les travaux imposés ou autorisés et certaines charges liées à la restauration sont traités selon les règles du Code général des impôts.",
          "mentions": [
            "loi-fiscale-malraux",
            "spr",
            "psmv"
          ]
        },
        {
          "id": "c5-b07",
          "text": "Pour les revenus de 2005, 3 540 foyers avaient déclaré des revenus ou charges au titre de 6 160 locaux situés dans l’un des 97 secteurs sauvegardés ou dans l’une des 550 ZPPAUP alors recensés. La dépense fiscale correspondante était estimée à 50 millions d’euros pour 2008. Ces chiffres sont historiques et montrent que le régime concernait une partie du parc ancien, principalement dans des opérations lourdes de restauration. Le rapport parlementaire souligne toutefois que l’évaluation complète restait difficile : il était compliqué d’isoler l’effet propre de la fiscalité de celui des outils d’urbanisme, des subventions et de l’évolution du marché immobilier. Le succès d’un quartier ne pouvait donc pas être attribué automatiquement à la réduction fiscale.",
          "mentions": [
            "loi-fiscale-malraux",
            "sources-et-methode"
          ]
        },
        {
          "id": "c5-b08",
          "text": "Le rapport parlementaire de 2019 indique que le dispositif était ouvert à plus de 800 communes, mais que les opérations aidées se concentraient dans 30 communes, soit moins de 4 % des communes éligibles. Il estime que la contribution du Malraux à l’augmentation de l’offre locative est négligeable, tandis que son effet sur la conservation du bâti est significatif. La fiscalité soutient donc plus sûrement la préservation architecturale que la production de logements abordables. Le rapport identifie une zone d’efficacité liée à la rentabilité de l’opération et au prix du foncier. Les projets les plus rentables ne sont pas nécessairement ceux des centres les plus dégradés, ce qui limite la portée sociale du dispositif.",
          "mentions": [
            "loi-fiscale-malraux",
            "spr"
          ]
        },
        {
          "id": "c5-b09",
          "text": "Le fisc ne devient pas l’architecte du quartier. Le PSMV fixe les règles de transformation, l’Architecte des bâtiments de France intervient dans l’instruction des travaux et le dispositif fiscal rend certaines opérations moins difficiles à financer. La réduction d’impôt ne détermine ni le prix du foncier, ni la composition sociale du quartier, ni l’usage des commerces. Elle sélectionne surtout les opérations capables de réunir une exigence patrimoniale élevée et une équation financière viable. Cette sélection explique le décalage entre l’ambition nationale du régime et sa concentration réelle. Elle explique aussi pourquoi la défiscalisation peut contribuer à conserver un bâtiment sans garantir le maintien des habitants, l’accessibilité des loyers ou la diversité des activités.",
          "mentions": [

    {
      "id": "chapter-6",
      "number": 6,
      "title": "Sauver les pierres, déplacer les vies ?",
      "blocks": [
        {
          "id": "c6-b01",
          "text": "Une réussite patrimoniale se mesure à un immeuble restauré, une façade conservée ou une rue soustraite à la démolition. Une réussite sociale dépend aussi du maintien des habitants, des loyers, du relogement après travaux et des commerces de proximité. Le Vieux-Lyon et le Marais montrent que la restauration peut produire une ville plus attractive et plus visitée tout en modifiant les populations et les usages. Ces changements ne peuvent pas être attribués mécaniquement à la loi Malraux seule. Dans les deux cas, les transformations résultent d’une combinaison de protection, de modernisation du logement, d’investissement privé, de tourisme et de centralité urbaine. Les sources disponibles permettent de documenter ces évolutions, mais elles ne fournissent pas une mesure unique de la part causale de chaque facteur.",
          "mentions": [
            "sources-et-methode",
            "occupants-relogement",
            "gentrification"
          ]
        },
        {
          "id": "c6-b02",
          "text": "Le Vieux-Lyon est délimité comme secteur sauvegardé par arrêté interministériel le 12 mai 1964. Le Grand Lyon le présente comme le premier, tandis que d’autres sources donnent ce titre à Sarlat selon un autre critère ; la date lyonnaise reste le repère administratif le plus ancien dans le tableau sénatorial consulté. Le quartier était menacé par des projets de transformation urbaine et routière, et l’association Renaissance du Vieux-Lyon joue un rôle important dans la mobilisation. Choisir la restauration ne signifie pourtant pas conserver chaque élément sans modification. Le dispositif de 1962 autorise aussi des transformations et certaines démolitions : protéger un ensemble consiste déjà à arbitrer entre ce qui doit rester, ce qui peut changer et les conditions nécessaires pour continuer à habiter.",
          "mentions": [
            "vieux-lyon",
            "loi-4-aout-1962",
            "psmv"
          ]
        },
        {
          "id": "c6-b03",
          "text": "Le rapport de présentation du PSMV indique que, de 1964 à 1976, vingt immeubles sont restaurés, représentant 280 logements. Les premiers immeubles commencent à être restaurés à partir de 1968. En octobre 1974, le secteur compte 4 057 logements. Entre 1977 et 1982, dix immeubles supplémentaires sont concernés, soit 138 logements locatifs dans le quartier Saint-Jean. Le document souligne alors que la population a pu être maintenue. Il décrit des restaurations exemplaires sur le plan architectural, avec des prestations supérieures à celles habituellement proposées dans le logement social. Ces données montrent que la restauration peut associer exigence architecturale et logement locatif, mais seulement lorsque le programme et les financements le prévoient explicitement.",
          "mentions": [
            "vieux-lyon",
            "psmv",
            "occupants-relogement"
          ]
        },
        {
          "id": "c6-b04",
          "text": "L’étude sociologique de Jean-Yves Authier décrit une autre dimension des opérations lyonnaises. L’opérateur local désigné par l’acronyme SEMIRELY acquiert une cinquantaine d’immeubles et en restaure environ trente, pour un ensemble de 480 logements et 130 chambres meublées. Certains immeubles sont revendus avant travaux afin d’absorber les surcoûts de restauration. Les immeubles réhabilités de Saint-Jean attirent ensuite une population plus fortunée. Authier rapporte que les loyers y sont multipliés par cinq ou six en moyenne dans le corpus étudié. Le changement ne porte donc pas seulement sur l’aspect des façades : il transforme la valeur d’usage et la valeur locative des logements. Ce résultat local documente une trajectoire ; il ne constitue pas une mesure nationale des effets de la loi.",
          "mentions": [
            "vieux-lyon",
            "gentrification"
          ]
        },
        {
          "id": "c6-b05",
          "text": "Saint-Georges ne connaît pas la même trajectoire que Saint-Jean. L’étude d’Authier le décrit comme un quartier situé à la marge du secteur restauré, où se concentrent des habitants modestes, des personnes âgées et des familles étrangères. La restauration inégale accentue la divergence entre les secteurs : Saint-Georges conserve une forte présence de ménages modestes tandis que Saint-Jean attire des habitants plus aisés. Saint-Georges devient ensuite un lieu requalifié, touristique et nocturne, avec des restaurants, des bars et des commerces destinés aussi à des personnes venues d’autres secteurs de l’agglomération. Cette réinsertion dans l’image lyonnaise reste socialement inégale : le quartier gagne en visibilité depuis l’extérieur, mais ses usages intérieurs se fragmentent.",
          "mentions": [
            "vieux-lyon",
            "gentrification",
            "occupants-relogement"
          ]
        },
        {
          "id": "c6-b06",
          "text": "À Paris, le secteur sauvegardé du Marais est créé en 1964 et couvre 126 hectares dans les 3e et 4e arrondissements. Le site est alors très vétuste et densément peuplé. Son PSMV reçoit une première approbation en 1996, puis une révision est approuvée en 2013. Le plan encadre la restauration et la transformation d’un quartier composé d’hôtels particuliers, d’immeubles d’habitation, d’ateliers et d’activités économiques. Le périmètre protège à la fois le Paris aristocratique des XVIIe et XVIIIe siècles et des traces d’activités industrielles des XIXe et XXe siècles. La protection doit conserver ce patrimoine composite tout en permettant l’évolution du quartier.",
          "mentions": [
            "marais",
            "psmv",
            "loi-4-aout-1962"
          ]
        },
        {
          "id": "c6-b07",
          "text": "Selon l’APUR, le périmètre du PSMV passe d’environ 40 000 habitants en 1982 à 36 500 en 1999, soit une baisse de 8,8 %. Dans les 3e et 4e arrondissements, la perte entre 1962 et 1999 atteint respectivement 45,4 % et 50,3 %. La baisse commence toutefois avant la mise en œuvre complète du plan : entre 1962 et 1968, la population du Marais diminue déjà d’environ 14 %. Les deux arrondissements ne se confondent pas exactement avec le PSMV, ce qui interdit d’utiliser leurs chiffres comme une mesure directe de l’effet du plan. La modernisation des logements et les évolutions du centre de Paris doivent être prises en compte.",
          "mentions": [
            "marais",
            "sources-et-methode"
          ]
        },
        {
          "id": "c6-b08",
          "text": "Les habitants du Marais ne sont pas absents de cette histoire. Les travaux d’Isabelle Backouche, tels que les restitue une recension académique, documentent des refus de partir et des demandes de relogement dans le quartier. La loi Malraux met un coup d’arrêt aux démolitions de certains îlots, mais elle ne fait pas disparaître les expulsions ni les opérations de modernisation. L’administration doit alors gérer une tension entre des immeubles qu’il faut libérer pour engager les travaux et des habitants qui veulent conserver leur place. La sauvegarde peut ainsi désigner plusieurs choses qui ne coïncident pas toujours : conserver un bâti, maintenir une population, rendre un logement salubre ou restituer une image historique. C’est dans cet écart que le succès patrimonial devient une question sociale.",
          "mentions": [
            "marais",
            "occupants-relogement",
            "loi-4-aout-1962"
          ]
        },
        {
          "id": "c6-b09",
          "text": "Les travaux universitaires sur le Marais utilisent le terme de gentrification, mais invitent à ne pas en faire une cause unique. La protection patrimoniale donne une valeur symbolique et réglementaire à un quartier déjà central ; elle s’articule avec les investissements, le tourisme et la transformation commerciale. À Lyon comme à Paris, elle agit moins comme une cause isolée que comme un accélérateur et un révélateur de mécanismes immobiliers plus larges. La baisse démographique du Marais commence avant le plan, tandis que les transformations lyonnaises diffèrent selon les quartiers. Authier décrit ainsi Saint-Georges comme plus visible et plus attractif, mais aussi plus morcelé. La causalité doit rester située : un dispositif national produit des effets différents selon le marché local, les choix municipaux et les opérations de logement. Les exemples ne justifient ni une condamnation générale de la restauration ni un récit de réussite sans perdants.",
          "mentions": [
            "marais",
            "vieux-lyon",
            "gentrification"
          ]
        }
      ]
    },
    {
      "id": "chapter-7",
      "number": 7,
      "title": "La ville héritée",
      "blocks": [
        {
          "id": "c7-b01",
          "text": "En 2016, la loi relative à la liberté de la création, à l’architecture et au patrimoine crée les sites patrimoniaux remarquables. Les anciens secteurs sauvegardés, les ZPPAUP et les AVAP sont réunis sous ce régime. Un SPR peut être géré par un plan de sauvegarde et de mise en valeur, document d’urbanisme, ou par un plan de valorisation de l’architecture et du patrimoine, servitude d’utilité publique. Le changement requalifie les protections antérieures dans un cadre commun. Le SPR est défini comme une ville, un village, un quartier ou un paysage dont la conservation, la restauration, la réhabilitation ou la mise en valeur présente un intérêt public historique, architectural, archéologique, artistique ou paysager. Des espaces ruraux et des paysages cohérents peuvent aussi être classés lorsqu’ils contribuent à cet intérêt.",
          "mentions": [
            "spr",
            "psmv",
            "pvap",
            "loi-4-aout-1962"
          ]
        },
        {
          "id": "c7-b02",
          "text": "Le bilan du ministère de la Culture recense 1 012 sites patrimoniaux remarquables au 23 septembre 2024. Parmi eux, 110 proviennent d’anciens secteurs sauvegardés : l’héritage direct de la loi de 1962 n’explique donc qu’une partie de cette géographie, également composée des anciennes ZPPAUP et AVAP ainsi que de classements plus récents. Plus de 80 % des 1 008 communes disposant d’au moins un SPR comptent moins de 20 000 habitants. La politique née pour protéger des quartiers anciens de grandes villes concerne désormais majoritairement de petites communes. Ce changement d’échelle importe autant que la croissance du nombre : il place le patrimoine dans des territoires aux capacités d’ingénierie, aux marchés immobiliers et aux besoins de revitalisation très différents.",
          "mentions": [
            "spr",
            "sources-et-methode"
          ]
        },
        {
          "id": "c7-b03",
          "text": "Cette extension territoriale transforme la question patrimoniale. Dans une petite commune, un SPR peut concerner le centre ancien, des paysages, des alignements bâtis ou des espaces ruraux cohérents. Selon les enjeux retenus, sa gestion repose sur un PSMV ou sur un PVAP, deux instruments de portée différente. Le classement ne produit pas automatiquement une restauration. Les collectivités doivent mobiliser des moyens pour les études, l’accompagnement des travaux et les politiques qui traitent la vacance, le coût des logements ou la faiblesse des commerces. Le recensement national ne signifie pas que les sites disposent des mêmes ressources. Il ne mesure pas non plus la fréquentation touristique, le nombre de logements restaurés ou la part des habitants bénéficiant d’opérations publiques. Le classement est un cadre de gestion, pas un bilan de revitalisation.",
          "mentions": [
            "spr",
            "sources-et-methode"
          ]
        },
        {
          "id": "c7-b04",
          "text": "L’histoire administrative des secteurs sauvegardés explique pourquoi le classement d’un SPR ne garantit ni un plan immédiatement opérationnel ni des travaux rapides. Délimiter le site n’est qu’un commencement : il faut étudier les bâtiments, choisir le document de gestion, concerter la collectivité, conduire l’enquête publique puis approuver les prescriptions. Pendant ce temps, la protection doit empêcher les transformations irréversibles sans paralyser les adaptations nécessaires. La lenteur ne se réduit donc pas à une file d’attente administrative. Elle traduit la difficulté d’écrire une règle parcelle par parcelle, de la rendre intelligible aux propriétaires et de l’accorder avec le projet urbain. Entre le classement annoncé, le plan opposable et le chantier visible, plusieurs temporalités continuent de coexister.",
          "mentions": [
            "spr",
            "psmv",
            "sources-et-methode"
          ]
        },
        {
          "id": "c7-b05",
          "text": "L’extension de la protection ne résout pas davantage la question du financement. Le rapport parlementaire de 2019 montre un écart entre la géographie très large de l’éligibilité fiscale et la concentration réelle des opérations. L’outil contribue davantage à conserver le bâti qu’à accroître l’offre locative, et son efficacité dépend notamment du prix du foncier et de la capacité d’une restauration lourde à trouver son équilibre. Deux communes classées ne disposent donc pas du même déclencheur privé. L’une peut attirer rapidement des investisseurs ; l’autre doit combiner aides publiques, ingénierie locale et action sur les commerces ou la vacance. Le statut patrimonial ouvre un cadre et des possibilités : il ne distribue pas automatiquement les capitaux nécessaires à sa mise en œuvre.",
          "mentions": [
            "spr",
            "loi-fiscale-malraux"
          ]
        },
        {
          "id": "c7-b06",
          "text": "La vie quotidienne se déroule à l’intérieur de règles patrimoniales concrètes. Dans le Vieux-Lyon, le PSMV s’applique aux espaces privés et publics. Les travaux affectant l’aspect extérieur, les espaces non bâtis ou les éléments intérieurs que le plan protège doivent faire l’objet d’une autorisation. Les façades, toitures, matériaux et couleurs peuvent être encadrés. L’accord de l’architecte des Bâtiments de France intervient dans cette autorisation et peut être assorti de prescriptions. Une adaptation domestique ne relève donc plus seulement d’une décision individuelle : elle doit composer avec l’intérêt collectif reconnu par le SPR. Cette contrainte protège la cohérence du quartier, mais elle exige aussi un dialogue technique compréhensible pour l’habitant.",
          "mentions": [
            "spr",
            "psmv",
            "abf",
            "vieux-lyon"
          ]
        },
        {
          "id": "c7-b07",
          "text": "Le diagnostic consacré à l’extension du SPR du Vieux-Lyon qualifie l’outil de juridiquement fort, mais incomplet et décalé par rapport aux modes de vie, à la transition écologique et à certaines prescriptions du plan local d’urbanisme et de l’habitat (PLU-H). Le site couvre environ 31 hectares et compte 532 immeubles, dont 106 monuments historiques selon l’étude. Les enjeux contemporains ne se limitent plus à empêcher une démolition. Ils comprennent aussi le confort d’été, la performance énergétique, le stationnement et l’évolution des usages dans les bâtiments anciens. La protection doit donc être réinterrogée sans perdre sa fonction de sauvegarde : adapter le plan devient une manière de prolonger, plutôt que de renier, l’ambition de 1962.",
          "mentions": [
            "spr",
            "vieux-lyon",
            "transition-energetique"
          ]
        },
        {
          "id": "c7-b08",
          "text": "Le rapport du Sénat sur les architectes des Bâtiments de France considère l’adaptation du bâti ancien au réchauffement climatique comme un défi majeur. Il recommande d’adapter le diagnostic de performance énergétique aux constructions anciennes et de soutenir des techniques de rénovation compatibles avec leurs matériaux et leurs façades. Le rapport propose aussi de renforcer l’accompagnement des collectivités et les compétences des services patrimoniaux. L’absence de travaux peut maintenir des logements inconfortables et énergivores ; une intervention doit en même temps respecter les caractéristiques qui justifient la protection. La transition crée ainsi une obligation de dialogue technique entre patrimoine, énergie et logement. Elle oblige le système à juger les solutions selon le bâtiment réel, pas selon une opposition abstraite entre conservation et performance.",
          "mentions": [
            "abf",
            "transition-energetique",
            "spr"
          ]
        },
        {
          "id": "c7-b09",
          "text": "La ville héritée n’est ni une ville figée ni une ville automatiquement revitalisée. Depuis 2016, le régime des SPR étend la protection à plus d’un millier de sites, dont une majorité se trouve dans de petites communes. Les plans doivent rester lisibles pour les porteurs de projets et les habitants, tout en maintenant la cohérence historique, architecturale et paysagère des lieux. Le défi est de faire du patrimoine un cadre de vie plutôt qu’un décor. Le test se joue dans des actes concrets : pouvoir isoler un logement sans enfermer l’humidité, adapter une fenêtre sans banaliser une façade, maintenir un commerce et un loyer accessibles, préparer un été plus chaud. Sauver les pierres fut le premier combat. Les garder habitables, utiles et partagées est celui qui décide aujourd’hui si les centres anciens resteront des villes plutôt que des images de villes.",
          "mentions": [

          ]
        }

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function reached(x){const loc=blockLocation(x.unlockBlock);return loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
function trap(e,d){if(e.key!=="Tab")return;const f=$$("button,[href],input,[tabindex]:not([tabindex='-1'])",d).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
$("#start").onclick=()=>go("#chapter/"+(saved.chapter||book.chapters[0].id));$("#home-btn").onclick=()=>go("");$("#codex-btn").onclick=()=>go("#codex");$("#codex-nav").onclick=()=>go("#codex");$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";applyPrefs();persist()};$("#font-down").onclick=()=>{state.scale=Math.max(.85,+(state.scale-.1).toFixed(2));applyPrefs();persist()};$("#font-up").onclick=()=>{state.scale=Math.min(1.4,+(state.scale+.1).toFixed(2));applyPrefs();persist()};$("#search").oninput=e=>renderCodex(e.target.value);$("#entry-close").onclick=()=>closeDialog($("#entry-dialog"));$("#image-close").onclick=()=>closeDialog($("#image-dialog"));$$("dialog").forEach(d=>{d.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeDialog(d)}else trap(e,d)});d.addEventListener("click",e=>{if(e.target===d)closeDialog(d)})});document.addEventListener("keydown",e=>{if($("dialog[open]"))return;const i=book.chapters.findIndex(c=>c.id===state.chapter);if(e.key==="ArrowRight"&&!$("#reader").hidden&&i<book.chapters.length-1)go("#chapter/"+book.chapters[i+1].id);if(e.key==="ArrowLeft"&&!$("#reader").hidden&&i>0)go("#chapter/"+book.chapters[i-1].id)});addEventListener("hashchange",route);applyPrefs();renderHome();renderToc();syncUnlocks();updateProgress();route();
