     "text": "— Au bout de la galerie, à gauche, a grogné Lestang. Et qu’on ne vous y reprenne pas. Les pensionnaires ne quittent pas leur palier la nuit.",
     "mentions": [
      "pension-daltitude"
     ]
    },
    {
     "id": "c8-b20",
     "text": "— Oui, monsieur le recteur. Pardon, monsieur le recteur.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "La respiration a repris. Pas tout de suite. Au bout de longues minutes, pendant lesquelles je suis restée accroupie contre le poêle de faïence avec la fiole contre mon cœur. Puis elle s’est allongée, régularisée, est redevenue ce souffle de propriétaire. Je suis sortie à quatre pattes. J’ai refermé la serrure. Capucine m’attendait à l’angle de la galerie, les bras croisés, avec un air de reproche.",
     "mentions": [
      "capucine-rigal",
      "souche-desquerre"
     ]
    },
    {
     "id": "c8-b22",
     "text": "— Je ne cherchais pas les cabinets, a-t-elle précisé.",
     "mentions": []
    },
    {
     "id": "c8-b23",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c8-b24",
     "text": "— Je te le dis parce que j’ai menti à un recteur. Il faut que quelqu’un le sache.",
     "mentions": []
    },
    {
     "id": "c8-b25",
     "text": "Dans la chambre de Tobie, ma mère attendait, debout, habillée, avec la lampe baissée. Tobie sifflait. Pas fort. Ce petit bruit de coquille de noix, que je lui avais connu enfant, que j’avais entendu chez Capucine sur l’Échine, et qui revenait. Il avait les yeux ouverts. Il m’a vue entrer. Il a dit : « Tu reviens de prison ? » et j’ai dit oui, et il a eu l’air très impressionné.",
     "mentions": [
      "tobie-ferrand",
      "lechine"
     ]
    },
    {
     "id": "c8-b26",
     "text": "J’ai sorti la seringue de ma trousse. J’ai rompu la cire de la fiole.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c8-b27",
     "text": "— Une dose pour lui, ai-je dit. Maintenant. Il en a besoin, il a sauté deux jours. Il en restera trois dans la fiole. Si je les mets toutes dans le lait et que ça ne marche pas…",
     "mentions": []
    },
    {
     "id": "c8-b28",
     "text": "— Alors il n’aura plus rien, a dit ma mère.",
     "mentions": []
    },
    {
     "id": "c8-b29",
     "text": "— Alors il n’aura plus rien. Je peux en garder une. Pour demain. Pour être sûre.",
     "mentions": []
    },
    {
     "id": "c8-b30",
     "text": "Ma mère a regardé son fils. Elle a regardé la fiole. Puis elle a regardé la porte, derrière laquelle, au deuxième palier, dormaient les sept petites filles de la salle de la Pendule, et au-dessous, et au-dessus, les autres, et tous les noms qu’Agathe gardait dans un cahier.",
     "mentions": [
      "agathe-sorel",
      "la-pendule"
     ]
    },
    {
     "id": "c8-b31",
     "text": "— Mets tout, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "Je lui ai fait l’injection. Il a regardé l’aiguille avec le même intérêt que la première fois. Puis ma mère l’a enveloppé dans deux couvertures, et elle l’a pris dans ses bras, et nous sommes descendus tous les quatre par l’escalier de service, parce qu’elle refusait de le laisser seul dans cette chambre une minute de plus.",
     "mentions": []
    },
    {
     "id": "c8-b33",
     "text": "La laiterie est au rez-de-chaussée, côté nord, une salle voûtée qui sent le caillé. Agathe y était, avec un tablier par-dessus sa robe grise, et devant elle, sur le feu, un grand bidon de cuivre à anses, de ceux qu’on monte à dos de mulet. Dix litres de lait de chèvre, tiédi au doigt, avec un pot de miel fondu dedans. Elle avait trempé son coude dedans, comme on fait pour les bains des nouveau-nés.",
     "mentions": []
    },
    {
     "id": "c8-b34",
     "text": "— À la température d’une main, a-t-elle dit. Pas plus. C’est ce qu’a dit votre docteur ?",
     "mentions": []
    },
    {
     "id": "c8-b35",
     "text": "— C’est ce qu’elle a dit.",
     "mentions": []
    },
    {
     "id": "c8-b36",
     "text": "J’ai versé la fiole. Tout ce qui restait. Le trouble s’est dissous dans le blanc sans laisser de trace, comme une goutte d’encre dans la mer, et j’ai eu l’impression, en regardant le lait redevenir uniforme, de jeter à l’eau la dernière chose que je possédais. Agathe a refermé le couvercle et l’a ficelé. Puis elle a pris une lanterne et nous a menés dehors.",
     "mentions": [
      "agathe-sorel",
      "souche-desquerre"
     ]
    },
    {
     "id": "c8-b37",
     "text": "Le Puits des vendanges est derrière l’Hospice, sur une terrasse de pierre qui surplombe le vide, du côté que ne voit pas Aval. Un auvent de bois noirci, de grandes poutres. Et sous l’auvent, le treuil. Je n’avais jamais vu une machine pareille. Un tambour de chêne large comme une charrette, cerclé de fer, sur lequel s’enroulaient deux câbles en sens contraire, pour que l’un monte quand l’autre descend. Une grande roue dentée, un pignon, une manivelle double à deux hommes, un frein à sabot, un cliquet. Tout cela huilé de frais, luisant sous la lanterne. Et devant, au ras de la terrasse, un trou dans la roche, rond, noir, de trois pas de large, d’où montait un souffle tiède qui sentait le soufre, l’eau chaude et la cave.",
     "mentions": [
      "aval",
      "hospice-longue-veille",
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c8-b38",
     "text": "Il y avait quelqu’un assis sur le rebord du Puits, les jambes dans le vide, qui fumait la pipe.",
     "mentions": []
    },
    {
     "id": "c8-b39",
     "text": "— Je ne dis jamais au revoir, madame, a dit Orso. Mais je ne suis jamais parti non plus.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c8-b40",
     "text": "Il s’est levé. Il portait son manteau de drap, son chapeau, et son sac sur le dos, plus gros que d’habitude. À ses pieds, dans un des deux paniers du treuil, un grand panier d’osier renforcé de cercles de fer, il y avait déjà du pain, du fromage, une gourde, une couverture, une lanterne, trois bidons de lait frais et une longue cuillère de bois.",
     "mentions": []
    },
    {
     "id": "c8-b41",
     "text": "— J’ai passé la journée ici, a-t-il dit. J’ai graissé l’axe. J’ai changé deux brins du câble. J’ai vérifié le frein. Agathe m’a dit ce que vous vouliez faire. Elle me l’a dit ce matin, avant même de vous le dire. Elle avait deviné. Nous sommes vieux, madame, nous devinons beaucoup.",
     "mentions": [
      "agathe-sorel"
     ]
    },
    {
     "id": "c8-b42",
     "text": "— Qu’est-ce que vous faites avec ce panier ?",
     "mentions": []
    },
    {
     "id": "c8-b43",
     "text": "— Je descends.",
     "mentions": []
    },
    {
     "id": "c8-b44",
     "text": "Je n’ai pas compris tout de suite. Puis j’ai compris, et j’ai ouvert la bouche, et il a levé la main pour m’arrêter, avec ce geste qu’il avait pour retirer son chapeau, un geste d’un autre siècle.",
     "mentions": []
    },
    {
     "id": "c8-b45",
     "text": "— Une souche, c’est une bête, vous l’avez dit. Il faut la nourrir. Elle va grossir. Il faudra transvaser, remettre du lait à mesure — il y a une source glacée à côté de la chaude, il le gardera au frais —, surveiller qu’elle ne refroidisse pas trop quand la source baisse, la nuit. Qu’elle ne chauffe pas trop quand elle monte. Toute seule, en bas, pendant quinze jours, elle a une chance sur deux. Avec quelqu’un, elle en a davantage.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c8-b46",
     "text": "— Quinze jours.",
     "mentions": []
    },
    {
     "id": "c8-b47",
     "text": "— Treize ou quatorze. Une nuit d’ici. J’ai fait votre calcul.",
     "mentions": []
    },
    {
     "id": "c8-b48",
     "text": "— Vous allez passer deux semaines tout seul au fond d’un trou pendant que nous passons une nuit ici.",
     "mentions": []
    },
    {
     "id": "c8-b49",
     "text": "— J’ai passé cinq mois tout seul dans une chambre de cette maison, a-t-il dit, pendant que ma mère mourait en bas. Deux semaines, ce n’est pas grand-chose. Et je vieillirai de deux semaines, voilà tout. Ça me fera plaisir. Il y a longtemps que je n’ai pas vieilli d’un coup de quelque chose d’utile.",
     "mentions": []
    },
    {
     "id": "c8-b50",
     "text": "Il a pris le bidon des mains d’Agathe et il l’a calé dans le panier, contre la couverture, et il est monté dedans. Il a dû se tenir aux cercles. Le panier s’est balancé au-dessus du noir. Puis il a sorti de son gilet sa double montre en argent, celle que ton grand-père lui avait faite, et il me l’a tendue.",
     "mentions": [
      "agathe-sorel",
      "jules-ferrand",
      "double-montre"
     ]
    },
    {
     "id": "c8-b51",
     "text": "— Tenez. Vous n’en avez plus. Elle vous dira l’heure d’ici et celle d’Aval. Pas celle d’en bas, d’où je serai. Celle-là, je vous la sonnerai.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c8-b52",
     "text": "Il a montré la corde fine qui courait le long du câble, jusqu’à une clochette de cuivre accrochée à une poutre de l’auvent.",
     "mentions": []
    },
    {
     "id": "c8-b53",
     "text": "— À chacune de mes heures, en bas, je tirerai une fois. Vous l’entendrez tinter toutes les deux minutes, à peu près. Si elle se tait plus de dix minutes, remontez-moi. Si elle sonne sans s’arrêter, remontez-moi aussi. Sinon, laissez-moi jusqu’à la cloche du lever.",
     "mentions": []
    },
    {
     "id": "c8-b54",
     "text": "Je ne savais pas quoi dire. Je lui avais dit, la veille, qu’il était un vieux fou qui s’était fabriqué une famille avec celle des autres. Il le savait. Il a souri sous sa moustache.",
     "mentions": []
    },
    {
     "id": "c8-b55",
     "text": "— Vous aviez raison, madame, a-t-il dit. Alors je m’en occupe.",
     "mentions": []
    },
    {
     "id": "c8-b56",
     "text": "Nous avons desserré le frein, Agathe et moi. Le tambour a tourné, lentement d’abord, puis plus vite, le câble se déroulant avec un chuintement de soie, l’autre câble s’enroulant de l’autre côté, remontant du fond le second panier, chargé de pierres, qui faisait contrepoids. Orso a disparu dans le noir du Puits, son chapeau d’abord, puis sa lanterne, une petite lueur jaune qui s’est enfoncée, s’est réduite à un point, puis à rien. Il y a quinze cents mètres. Il a fallu douze minutes. Le câble s’est détendu d’un coup. Il était en bas.",
     "mentions": [
      "orso-lebreuil",
      "agathe-sorel",
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c8-b57",
     "text": "Et quelques instants plus tard, la clochette a tinté.",
     "mentions": []
    },
    {
     "id": "c8-b58",
     "text": "Une fois. Un petit son clair, sous l’auvent, dans la nuit qui battait. Puis deux minutes de silence. Puis une fois encore.",
     "mentions": []
    },
    {
     "id": "c8-b59",
     "text": "Nous avons veillé toute la nuit. Nous quatre, et Tobie. Agathe dans un fauteuil de paille qu’elle avait fait porter là, son tricot sur les genoux. Ma mère sur une caisse, contre le mur de l’auvent, Tobie dans ses bras, enroulé dans ses couvertures, qui respirait — je l’écoutais, je n’écoutais que ça, avec la clochette — un peu mieux, puis un peu moins bien, puis mieux. Capucine sur mes genoux, puis contre moi, puis endormie dans le panier à pierres, qu’on avait tiré sur la terrasse, sur une couverture. Et moi, assise sur le rebord du Puits, à la place d’Orso, la montre d’argent ouverte dans ma main.",
     "mentions": [
      "tobie-ferrand",
      "capucine-rigal"
     ]
    },
    {
     "id": "c8-b60",
     "text": "Toutes les deux minutes, une heure de sa vie tintait sous l’auvent.",
     "mentions": []
    },
    {
     "id": "c8-b61",
     "text": "Je les ai comptées. Pas comme j’avais compté les nuits de toi, dans la chambre haute, avec rage, pour ne pas les perdre. Autrement. Comme on compte les respirations de quelqu’un qu’on veille. Vingt-quatre tintements : un jour, pour lui, en bas. Il avait dû manger. Il avait dû transvaser. Quarante-huit : deux jours. La souche doublée. Soixante-douze. Quelque part vers le centième, j’ai pensé qu’il était en train de faire, dans une grotte chaude, à l’heure de la Chaudière, ce que ma mère avait fait dans une chambre froide, à l’heure de l’Hospice : attendre seul pour quelqu’un. Vers le cent-cinquantième, je me suis mise à lui parler, à voix basse, penchée au-dessus du trou, en sachant très bien qu’il ne m’entendait pas, et que s’il m’avait entendue, ma voix lui serait arrivée si grave et si lente qu’il n’en aurait rien compris. Je lui ai demandé pardon. Je crois qu’il ne l’a jamais su. Je te le dis pour que quelqu’un le sache, comme dit Capucine.",
     "mentions": [
      "chambre-haute",
      "puits-des-vendanges",
      "souche-desquerre"
     ]
    },
    {
     "id": "c8-b62",
     "text": "Ma mère, à un moment, s’est approchée et s’est assise à côté de moi, avec Tobie endormi.",
     "mentions": []
    },
    {
     "id": "c8-b63",
     "text": "— Tu as l’heure d’en bas ? a-t-elle demandé.",
     "mentions": []
    },
    {
     "id": "c8-b64",
     "text": "J’ai regardé le second cadran de la montre d’Orso. Il tournait, doucement, obstinément, à la vitesse d’une trotteuse lasse.",
     "mentions": [
      "orso-lebreuil",
      "double-montre"
     ]
    },
    {
     "id": "c8-b65",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c8-b66",
     "text": "— Quel jour c’est, chez ta fille ?",
     "mentions": []
    },
    {
     "id": "c8-b67",
     "text": "— Le vingt septembre.",
     "mentions": []
    },
    {
     "id": "c8-b68",
     "text": "— Qu’est-ce qu’elle fait, un vingt septembre ?",
     "mentions": []
    },
    {
     "id": "c8-b69",
     "text": "J’ai réfléchi. Je savais qu’elle avait quinze ans et demi. Je ne savais rien d’autre. Je ne savais pas en quelle classe tu étais, si tu avais changé de coiffure, qui étaient tes amis. Alors je lui ai raconté un vingt septembre d’il y a deux ans, quand tu avais treize ans, un vingt septembre ordinaire : le petit déjeuner debout, le cartable jeté dans l’entrée, le poste de radio démonté sur la table de la cuisine, les disputes pour la vaisselle. Ma mère a écouté comme on écoute une histoire. De temps en temps, elle posait une question. Elle voulait savoir si tu mettais du sucre dans ton lait. Je lui ai dit que tu n’en mettais pas. Elle a dit : « Moi non plus. » Et nous sommes restées là, toutes les deux, au bord d’un trou de quinze cents mètres, à imaginer ta journée.",
     "mentions": []
    },
    {
     "id": "c8-b70",
     "text": "La clochette a sonné deux cent quatre-vingt-dix-sept fois.",
     "mentions": []
    },
    {
     "id": "c8-b71",
     "text": "À la deux-cent-quatre-vingt-dix-huitième, la cloche de l’Hospice a sonné six heures. Le lever. Agathe s’est dressée dans son fauteuil. Et en même temps, la clochette de cuivre s’est mise à sonner sans s’arrêter, à toute volée, un carillon affolé, comme si quelqu’un, en bas, tirait sur la corde de toutes ses forces.",
     "mentions": [
      "agathe-sorel",
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c8-b72",
     "text": "— Il veut remonter, a dit Agathe.",
     "mentions": []
    },
    {
     "id": "c8-b73",
     "text": "Nous nous sommes mises à la manivelle. Agathe, ma mère et moi. Capucine réveillée, qui poussait avec ses deux mains sur le bras de la manivelle, la figure rouge. Le contrepoids aidait, mais pas assez. Le tambour tournait par à-coups, le cliquet claquait, cran après cran, et le câble remontait du Puits avec une lenteur de rêve. À ce rythme-là, il faudrait une heure. Je transpirais. Ma mère aussi. Elle avait posé Tobie dans le fauteuil de paille, et Tobie nous regardait, emmitouflé, avec des yeux ronds, en sifflant doucement, et il nous encourageait à mi-voix, comme on encourage des chevaux : « Allez. Allez. »",
     "mentions": [
      "tobie-ferrand",
      "capucine-rigal",
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c8-b74",
     "text": "C’est à ce moment qu’est arrivé le recteur.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c8-b75",
     "text": "Il n’avait pas couru. Il n’a jamais couru de sa vie, je pense. Il est apparu à l’angle de la terrasse, en habit noir boutonné jusqu’au menton, rasé, peigné, à six heures du matin, avec les deux hommes de peine derrière lui. Il a regardé le treuil, le câble tendu, la clochette qui s’affolait, les quatre femmes en sueur à la manivelle. Il a regardé Tobie dans son fauteuil. Il a compris. Il comprenait toujours tout. Il était seulement, comme il l’avait dit lui-même, devenu un peu lent.",
     "mentions": []
    },
    {
     "id": "c8-b76",
     "text": "— Serrez le frein, a-t-il dit aux hommes de peine.",
     "mentions": []
    },
    {
     "id": "c8-b77",
     "text": "Ils ont avancé. L’un d’eux a posé la main sur le levier du frein. Le tambour s’est arrêté net, dans un gémissement de bois. Le câble a vibré. En bas, à quelques centaines de mètres sous nous, dans le noir, il y avait un homme dans un panier, suspendu au-dessus de rien, avec trois bidons de cuivre.",
     "mentions": [
      "les-suspendus"
     ]
    },
    {
     "id": "c8-b78",
     "text": "— Il y a un homme au bout, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c8-b79",
     "text": "— Je sais, a dit Lestang. Monsieur Lebreuil a toujours eu le goût des voyages. Il restera là où il est le temps que la visiteuse arrive. Il aura tout le loisir de réfléchir. À sa cote, il ne s’ennuiera pas longtemps.",
     "mentions": [
      "anselme-lestang",
      "adrienne-coquard",
      "la-cote"
     ]
    },
    {
     "id": "c8-b80",
     "text": "Et c’est alors que ma mère s’est avancée.",
     "mentions": []
    },
    {
     "id": "c8-b81",
     "text": "Je ne l’avais jamais vue en colère. Pas à Aval, pas quand j’étais petite. Je me souvenais d’une femme douce, fatiguée, qui disait « on verra » et « ton père décidera ». Elle s’est plantée devant le recteur, qui la dépassait de deux têtes, dans sa robe grise froissée par la nuit, les cheveux défaits, les manches encore relevées d’avoir tourné la manivelle, et elle a parlé d’une voix que je ne lui connaissais pas, et que je me suis reconnue.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c8-b82",
     "text": "— Vingt-sept ans, a-t-elle dit. Vous avez gardé mon fils vingt-sept ans. Mon mari a payé dix-huit ans, et puis ma fille a payé neuf ans. Pendant ce temps-là, mon mari est mort, ma fille s’est mariée, ma petite-fille est née et a grandi, et moi, je ne l’ai pas su. Pendant ce temps-là, vous avez touché trois écus par an pour trois jours et demi de soupe. Et quand ma fille vous apporte de quoi le guérir, vous le lui prenez pour le monter à des gens qui mettent quarante ans à choisir des rideaux. Vous dites que vous vendez du temps. Vous ne vendez pas du temps, monsieur. Vous le volez. Vous volez celui des mères.",
     "mentions": []
    },
    {
     "id": "c8-b83",
     "text": "Lestang l’a écoutée jusqu’au bout. Il n’a pas bougé. Puis il a dit, doucement :",
     "mentions": []
    },
    {
     "id": "c8-b84",
     "text": "— Madame Ferrand, vous êtes une veilleuse, et je vous ai toujours estimée. Mais vous n’êtes rien, ici, sans ma signature.",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c8-b85",
     "text": "— Alors regardez derrière vous, a dit ma mère.",
     "mentions": []
    },
    {
     "id": "c8-b86",
     "text": "Il s’est retourné.",
     "mentions": []
    },
    {
     "id": "c8-b87",
     "text": "La terrasse était pleine d’enfants.",
     "mentions": []
    },
    {
     "id": "c8-b88",
     "text": "Je ne les avais pas entendus venir. Personne ne les avait entendus. Ils étaient sortis de tous les paliers, par l’escalier de service, par les galeries, en chemise de nuit, pieds nus sur la pierre gelée, avec les veilleuses derrière eux, en gris, les cheveux défaits, des bougies à la main. Agathe les avait réveillés. Je ne sais pas quand. Pendant la nuit, entre deux rangs de tricot. Ils étaient là. Soixante et un enfants, qui attendaient depuis dix ans, trente ans, quatre-vingts ans de chez nous, et qui regardaient le recteur sans rien dire, avec les yeux calmes et graves des malades qui ont le temps. La grande aux nattes rousses était au premier rang. Elle tenait par la main une petite de six ans. Elles toussaient toutes les deux.",
     "mentions": [
      "anselme-lestang",
      "agathe-sorel",
      "mathilde"
     ]
    },
    {
     "id": "c8-b89",
     "text": "Le ciel battait au-dessus d’eux, clair, sombre, clair, et à chaque clair, leurs visages apparaissaient, blancs, puis disparaissaient.",
     "mentions": [
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c8-b90",
     "text": "L’homme de peine qui tenait le frein a regardé les enfants. Puis il a regardé le recteur. C’était un homme énorme, au visage de bœuf, avec des mains comme des pelles. Il s’appelait Barnabé ; je l’ai su plus tard. Il avait été suspendu, lui aussi, quand il était enfant, pour une maladie du cœur, et il n’était jamais redescendu parce que, quand on l’avait guéri, il n’avait plus personne en bas.",
     "mentions": [
      "barnabe",
      "les-suspendus"
     ]
    },
    {
     "id": "c8-b91",
     "text": "Il a lâché le frein.",
     "mentions": []
    },
    {
     "id": "c8-b92",
     "text": "Puis il a craché dans ses mains, et il a pris la manivelle à côté de ma mère, et il a tourné.",
     "mentions": []
    },
    {
     "id": "c8-b93",
     "text": "Le deuxième homme de peine a hésité un moment. Puis il est venu aussi. Et le tambour, à deux hommes de plus, s’est mis à tourner comme il avait dû tourner du temps des vendanges, régulièrement, puissamment, avec le cliquet qui chantait cran après cran. Lestang n’a rien dit. Il est resté debout au milieu de la terrasse, parmi les enfants, dans son habit noir, et personne ne lui a rien dit non plus. Personne ne l’a touché. Personne ne l’a regardé, en fait. Tout le monde regardait le Puits.",
     "mentions": [
      "anselme-lestang",
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c8-b94",
     "text": "La lanterne est apparue d’abord. Un point jaune, tout au fond du noir, qui grossissait. Puis la lumière a gagné les parois de la cheminée, humides, luisantes. Puis le chapeau.",
     "mentions": []
    },
    {
     "id": "c8-b95",
     "text": "Orso est sorti du Puits comme on sort d’un très long voyage.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c8-b96",
     "text": "Il avait une barbe de deux semaines, grise, drue, qui lui mangeait les joues jusqu’aux yeux. Il avait maigri. Son manteau était taché de lait. Il avait les yeux rouges de quelqu’un qui a dormi peu et par morceaux, et la peau un peu blanche, un peu fripée, de celui qui a vécu deux semaines dans la vapeur. Il se tenait aux cercles du panier. À ses pieds, il y avait trois bidons de cuivre, et un quatrième, le premier, celui d’Agathe, tous ficelés, tous pleins.",
     "mentions": [
      "agathe-sorel"
     ]
    },
    {
     "id": "c8-b97",
     "text": "Il a regardé la terrasse, les enfants, le recteur, les femmes à la manivelle, Barnabé, Tobie dans son fauteuil. Il a regardé ma mère. Puis il m’a regardée, moi, et il m’a tendu le premier bidon, par-dessus le vide, à bout de bras.",
     "mentions": [
      "tobie-ferrand",
      "barnabe"
     ]
    },
    {
     "id": "c8-b98",
     "text": "— Douze jours et demi, madame, a-t-il dit. J’ai compté. Je n’avais que ça à faire.",
     "mentions": []
    },
    {
     "id": "c8-b99",
     "text": "J’ai pris le bidon. Il était tiède. J’ai défait la ficelle et j’ai soulevé le couvercle. Le lait n’était plus blanc. Il était trouble, épais, couleur de petit-lait, et il sentait le pain qui lève. Il bougeait. Je veux dire qu’il avait, à la surface, ce frémissement imperceptible des choses vivantes, cette respiration qu’on voit sur un étang au printemps.",
     "mentions": []
    },
    {
     "id": "c8-b100",
     "text": "Quatre bidons. Je n’ai pas eu besoin de faire le calcul. Je l’ai fait quand même, parce que c’est mon métier. Il y avait là de quoi faire, dès ce matin, la première injection à tous les enfants de cette terrasse, et de quoi réensemencer du lait pour la nuit suivante. Et la nuit d’après. Et toutes les nuits qu’il faudrait. Tant qu’il y aurait un Puits, des chèvres et quelqu’un en bas pour veiller la bête, il y en aurait pour tous : ceux des paliers, ceux qui monteraient demain, et après-demain, et tous les autres. Le temps pour faire, on venait de le trouver. Il était à quinze cents mètres sous nos pieds, et il était tiède.",
     "mentions": [
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c8-b101",
     "text": "Derrière moi, j’ai entendu Capucine dire, à Tobie, très sérieusement, comme on explique une chose évidente à un plus petit :",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c8-b102",
     "text": "— Tu vois. Elle avait promis.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-9",
   "number": 9,
   "title": "Le temps de tout le monde",
   "blocks": [
    {
     "id": "c9-b01",
     "text": "On a fait les injections dans le réfectoire, à la lampe, sur les grandes tables où les enfants mangeaient leur soupe aux poireaux depuis trois siècles.",
     "mentions": []
    },
    {
     "id": "c9-b02",
     "text": "Agathe avait tout organisé pendant qu’on remontait le panier, je ne sais pas comment. Les veilleuses en rang, chacune avec ses enfants. Les bidons tiédis au bain-marie. Des tasses de lait chaud pour après. Et la liste : un cahier d’écolier à couverture noire, où elle tenait depuis soixante ans de chez nous les noms des enfants de la maison, les vivants en haut de la page, les morts en bas, avec une croix. Elle appelait les vivants un par un. J’ai fait les dix premières injections moi-même, puis j’ai montré aux veilleuses. Ce n’est pas difficile. On pince la peau du bras, on pique, on pousse doucement. Les mères apprennent vite. Ce sont des gestes de mère.",
     "mentions": [
      "agathe-sorel",
      "veilleuses"
     ]
    },
    {
     "id": "c9-b03",
     "text": "Ils ne pleuraient pas. Aucun. Ils regardaient l’aiguille avec cet intérêt paisible que j’avais vu à Tobie, et puis ils buvaient leur lait chaud. Une petite de cinq ans m’a demandé si ça avait un goût. Je lui ai dit que non. Elle a eu l’air déçue.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c9-b04",
     "text": "La grande aux nattes rousses est passée parmi les dernières. Elle s’appelait Mathilde. Elle avait douze ans, et quatre-vingt-deux ans d’attente. Elle a tendu le bras sans rien dire, et quand j’ai eu fini, elle a gardé la manche relevée, et elle m’a regardée.",
     "mentions": [
      "mathilde"
     ]
    },
    {
     "id": "c9-b05",
     "text": "— Si je guéris, a-t-elle dit, je descends où ?",
     "mentions": []
    },
    {
     "id": "c9-b06",
     "text": "Je n’ai pas su répondre. Il n’y avait plus personne en bas pour elle. Pas un nom, pas une adresse, pas une tombe, sans doute, que quelqu’un fleurisse encore. C’est Orso qui a répondu, du fond du réfectoire, où il s’était assis devant un bol de café avec sa barbe de deux semaines.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c9-b07",
     "text": "— Avec moi, mademoiselle, a-t-il dit. Je connais le chemin. Et je connais le métier. Le métier d’arriver quelque part où personne ne vous attend. Ça s’apprend, je vous assure. Je vous apprendrai.",
     "mentions": []
    },
    {
     "id": "c9-b08",
     "text": "Mathilde l’a regardé longtemps. Puis elle a baissé sa manche.",
     "mentions": []
    },
    {
     "id": "c9-b09",
     "text": "— Vous avez une drôle de barbe, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c9-b10",
     "text": "— C’est la première chose que je possède qui ait exactement mon âge, a dit Orso. J’y tiens beaucoup.",
     "mentions": []
    },
    {
     "id": "c9-b11",
     "text": "Il l’a rasée dans l’après-midi, pourtant, avec le rasoir de Barnabé, dans la cour, devant un morceau de miroir accroché au puits de la laiterie. Les enfants faisaient cercle. Il se rasait comme on se rasait de son temps, en gonflant la joue avec la langue, à grands gestes, et il chantait une de ses chansons de soldats qui reviennent. Les enfants ne connaissaient pas la chanson. Ils l’ont apprise. À la fin de la journée, tout l’Hospice la chantait, faux, avec conviction.",
     "mentions": [
      "barnabe",
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c9-b12",
     "text": "Le recteur, lui, avait disparu.",
     "mentions": []
    },
    {
     "id": "c9-b13",
     "text": "Personne ne l’avait vu partir. Sa chambre était vide, son lit fait, son bureau rangé ; le grand registre des pensions n’était plus sur l’acajou. C’est Barnabé qui me l’a montré, vers le milieu de la journée, par la fente d’un volet de la galerie nord. Au-dessus de l’Hospice, la falaise se redresse, puis se casse en une suite de gradins qui montent vers la brume grise des Terrasses, et dans ces gradins il y a un escalier taillé dans la roche, qu’on appelle l’Escalier des Lents. Sur l’escalier, loin déjà, il y avait une silhouette noire, avec un gros livre sous le bras.",
     "mentions": [
      "les-terrasses",
      "les-lents",
      "pension-daltitude"
     ]
    },
    {
     "id": "c9-b14",
     "text": "— Il monte chez les Lents, a dit Barnabé. Il ne redescendra pas.",
     "mentions": []
    },
    {
     "id": "c9-b15",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c9-b16",
     "text": "— Parce qu’en bas, on va venir lui demander des comptes. Et là-haut, les comptes, ils ont le temps.",
     "mentions": []
    },
    {
     "id": "c9-b17",
     "text": "Je l’ai regardé monter. C’était l’inverse exact de la Pendule, le premier jour, sur le chemin des Granges. La cascade, à mesure que je montais, se dégelait sous mes yeux. Le recteur, à mesure qu’il montait, se figeait. Ses pas ralentissaient, non parce qu’il était las, mais parce qu’il entrait dans un temps plus lent que le mien, et que je le regardais de trop bas. Un pas. Un autre, plus long à venir. Un autre encore. Comme une montre dont le ressort s’épuise, sauf que ce n’était pas le ressort : c’était le monde autour de lui qui se faisait de plus en plus lent, et lui avec. Quand j’ai refermé le volet, il n’avait pas fini de lever le pied.",
     "mentions": [
      "les-granges",
      "la-pendule"
     ]
    },
    {
     "id": "c9-b18",
     "text": "Il a fallu faire les comptes, nous aussi.",
     "mentions": []
    },
    {
     "id": "c9-b19",
     "text": "Sept doses, sept jours. Les enfants avaient reçu la première ce matin-là. Il leur en faudrait six autres, une par jour de l’Hospice. Tobie en avait reçu quatre en comptant celle du matin. Il lui en restait trois. Capucine, qui n’en avait eu que deux, la sienne de la Baume et celle du matin, cinq. Et la souche, dans leurs poumons, ne supporterait pas le froid avant d’être tout à fait installée : c’est ce qu’avait dit Esquerre au lavoir, et Agathe, qui avait été infirmière, disait la même chose. Personne ne passerait l’Échine avant sa septième dose. Capucine ne pourrait pas descendre avant quatre jours, et ma mère ne descendrait pas sans elle : elle l’avait promis à Agathe, et Tobie l’avait promis à Capucine.",
     "mentions": [
      "agathe-sorel",
      "pauline-esquerre",
      "lechine"
     ]
    },
    {
     "id": "c9-b20",
     "text": "Quatre jours de l’Hospice. Quatre cents jours de toi. Treize mois.",
     "mentions": []
    },
    {
     "id": "c9-b21",
     "text": "J’ai fait le calcul dans la cour, pendant qu’Orso se rasait, et je l’ai refait le soir, et je l’ai refait toute la nuit.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c9-b22",
     "text": "Cette nuit-là, c’est Barnabé qui est descendu dans le Puits. Il s’était proposé avant qu’on le lui demande. Il a dit qu’il n’avait jamais aimé le monde d’en haut, ni celui d’en bas, et qu’un trou tiède avec une bête à nourrir, c’était ce qui lui ressemblait le plus. Il est monté dans le panier avec du pain et du lait frais et un bidon ensemencé, et il a disparu dans le noir, et bientôt la clochette s’est remise à tinter sous l’auvent, toutes les deux minutes, une heure de Barnabé après l’autre.",
     "mentions": [
      "barnabe",
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c9-b23",
     "text": "Je ne dormais pas. Ma mère non plus. Nous nous sommes retrouvées sur la terrasse du Puits, sans nous être donné rendez-vous, chacune avec une couverture sur les épaules. Elle s’est assise sur la caisse de la veille. Moi sur le rebord. La clochette a tinté.",
     "mentions": []
    },
    {
     "id": "c9-b24",
     "text": "— Tu vas descendre demain, a dit ma mère.",
     "mentions": []
    },
    {
     "id": "c9-b25",
     "text": "Ce n’était pas une question.",
     "mentions": []
    },
    {
     "id": "c9-b26",
     "text": "— Je ne sais pas.",
     "mentions": []
    },
    {
     "id": "c9-b27",
     "text": "— Si. Tu sais.",
     "mentions": []
    },
    {
     "id": "c9-b28",
     "text": "La clochette a tinté.",
     "mentions": []
    },
    {
     "id": "c9-b29",
     "text": "— Si je reste quatre jours, ai-je dit, je descends avec vous. Avec toi, avec Tobie, avec Capucine. On arrive ensemble à la gare du Tardif. C’est pour ça que je suis montée. Pour ramener mon frère. Pour te ramener. Si je descends demain, je descends seule, et vous arriverez treize mois après moi.",
     "mentions": [
      "tobie-ferrand",
      "capucine-rigal",
      "le-tardif"
     ]
    },
    {
     "id": "c9-b30",
     "text": "— Et si tu restes, ta fille aura treize mois de plus quand tu arriveras.",
     "mentions": []
    },
    {
     "id": "c9-b31",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c9-b32",
     "text": "— Elle aura dix-sept ans.",
     "mentions": []
    },
    {
     "id": "c9-b33",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c9-b34",
     "text": "Ma mère a remonté la couverture sur ses épaules. Le ciel battait au-dessus de la terrasse. Dans la lumière des clairs, je voyais son profil, son nez qui est le mien, les taches de rousseur.",
     "mentions": [
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c9-b35",
     "text": "— J’ai fait ce choix-là, a-t-elle dit. Tu sais. Dans l’autre sens. J’avais un enfant en haut et une enfant en bas, et j’ai choisi celui d’en haut, parce qu’il allait mourir et que toi, tu allais seulement grandir. Seulement. Je me disais : elle va seulement grandir. Je me le suis dit pendant trois mois. Tu étais la seule de nous deux qui grandissait, et je t’ai laissée faire ça toute seule.",
     "mentions": []
    },
    {
     "id": "c9-b36",
     "text": "La clochette a tinté.",
     "mentions": []
    },
    {
     "id": "c9-b37",
     "text": "— Ne fais pas ce que j’ai fait, Lou. Ton frère est guéri. Il descendra. Moi aussi. On arrivera. Ta fille, elle, n’attendra pas. Personne n’attend, en bas. On grandit. C’est tout ce qu’on fait.",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c9-b38",
     "text": "— C’est ce que je disais, avant.",
     "mentions": []
    },
    {
     "id": "c9-b39",
     "text": "— Je sais. Je l’ai lu cette nuit.",
     "mentions": []
    },
    {
     "id": "c9-b40",
     "text": "Elle a souri. Puis elle a dit, et sa voix a tremblé, pour la première fois depuis la veille :",
     "mentions": []
    },
    {
     "id": "c9-b41",
     "text": "— Et moi, je descendrai. Je te le promets. Dans quatre jours. Même si en bas tout a changé, même si je ne reconnais rien, même si je suis une étrangère avec des manies de vieille qui a trente-deux ans. Je descendrai. Je veux voir Nine avant qu’elle ait mon âge.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c9-b42",
     "text": "Je n’ai pas répondu. Je me suis levée. Je me suis assise à côté d’elle, sur la caisse, qui était trop petite pour deux, et elle a ouvert sa couverture, et j’y suis entrée, comme à sept ans les soirs d’orage. Nous sommes restées comme ça jusqu’au matin. La clochette a sonné deux cent quatre-vingt-dix fois. Je ne les ai pas comptées. C’est ma mère qui les a comptées, à voix basse, par habitude de veilleuse, et je me suis endormie avant la centième, contre son épaule, alors que j’avais sept ans de plus qu’elle.",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c9-b43",
     "text": "Au matin, j’ai fait la cinquième injection de Tobie. Puis je lui ai appris à siffler.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c9-b44",
     "text": "Il n’avait pas le souffle. Il n’avait pas encore le souffle pour grand-chose. Mais j’ai mis ses doigts dans sa bouche, l’index et le majeur, la langue repliée derrière, comme me l’avait appris l’apprenti tanneur pour une toupie, et il a soufflé de toutes ses forces, les joues rouges, et il en est sorti un petit bruit. Pas un sifflement. Un « pfuit ». Un bruit de bouilloire qui n’y croit pas.",
     "mentions": []
    },
    {
     "id": "c9-b45",
     "text": "— C’est un début, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c9-b46",
     "text": "— C’est nul, a-t-il dit.",
     "mentions": []
    },
    {
     "id": "c9-b47",
     "text": "— Tu t’entraîneras. Et en bas, je te montrerai la suite.",
     "mentions": []
    },
    {
     "id": "c9-b48",
     "text": "— En bas, a-t-il répété.",
     "mentions": []
    },
    {
     "id": "c9-b49",
     "text": "Il avait sept ans et n’avait jamais vraiment vu Aval. Il en avait des souvenirs de petit garçon malade : la cuisine, la chambre, la fenêtre. Il allait redescendre dans une ville où il n’y avait plus de rue de la Tonnellerie, où il y avait des grands magasins, des postes de radio et des tramways électriques, une ville où sa sœur était vieille, et où il aurait une nièce de dix-sept ans. Il avait l’air de trouver ça passionnant.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c9-b50",
     "text": "Capucine est venue me dire au revoir dans la galerie. Elle avait son roman d’aventures sous le bras. Elle l’avait lu trois fois, à Tobie, à la grande Mathilde, aux petites de la salle de la Pendule, qui l’appelaient maintenant la contrebandière.",
     "mentions": [
      "tobie-ferrand",
      "mathilde",
      "la-pendule"
     ]
    },
    {
     "id": "c9-b51",
     "text": "— Tu as tenu ta promesse, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c9-b52",
     "text": "— Tu m’as aidée à la tenir.",
     "mentions": []
    },
    {
     "id": "c9-b53",
     "text": "Elle a réfléchi. Puis elle a sorti de son livre une feuille pliée en quatre.",
     "mentions": []
    },
    {
     "id": "c9-b54",
     "text": "— C’est pour maman. Tu la lui donnes ? Tu lui dis que je descends dans quatre jours. Tu lui dis de ne pas faire la multiplication, parce qu’elle se trompe toujours. Tu la fais pour elle.",
     "mentions": []
    },
    {
     "id": "c9-b55",
     "text": "— Treize mois, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c9-b56",
     "text": "— C’est moins que trois cents ans, a dit Capucine.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c9-b57",
     "text": "Vers dix heures et demie de l’Hospice, j’ai ouvert un volet de la galerie, côté Aval. Celui de ma mère, au troisième palier, celui dont je voyais la lampe de ma fenêtre quand j’avais douze ans. Orso m’avait laissé sa montre d’argent. J’ai regardé le second cadran. Il marquait le premier février, onze heures du soir. J’ai attendu.",
     "mentions": [
      "aval",
      "hospice-longue-veille",
      "double-montre"
     ]
    },
    {
     "id": "c9-b58",
     "text": "Minuit est passé sur le second cadran pendant que je regardais la plaine. Le deux février. Là-bas, en bas, dans le noir, sous la montagne, il y avait une ville endormie, et dans la ville, une rue des Cadrans, et dans la rue, un atelier au rideau baissé, et quelque part — chez ton père, sans doute — une fille qui avait seize ans depuis une seconde, et qui dormait.",
     "mentions": [
      "atelier-ferrand"
     ]
    },
    {
     "id": "c9-b59",
     "text": "Tes quinze ans, je les avais dormis. Tes seize ans, je les ai regardés.",
     "mentions": []
    },
    {
     "id": "c9-b60",
     "text": "En entier. Du premier au dernier instant. Ça dure un quart d’heure, un jour d’Aval, vu de l’Hospice. Un peu moins. J’ai vu la ville dormir. J’ai vu les boulangeries s’allumer, les premières, dans le quartier de la Halle. J’ai vu le jour se lever sur la plaine, blanc d’hiver, et la fumée des tanneries. J’ai vu le train de huit heures, un trait de vapeur sur la vallée, filer comme une allumette qu’on gratte. J’ai vu le soleil monter, passer, tomber. Je me suis dit : maintenant, elle est au lycée. Maintenant, elle déjeune. Maintenant, quelqu’un lui souhaite bon anniversaire, et elle hausse les épaules parce qu’elle trouve ça embarrassant. Maintenant, elle rentre. Et puis le soleil s’est couché derrière le Crêt de la Dame, et les réverbères de l’avenue des Tilleuls se sont allumés, et puis le Palace, rouge et bleu. Et la nuit est venue, et la ville s’est éteinte quartier par quartier, et sur le second cadran, minuit est repassé.",
     "mentions": []
    },
    {
     "id": "c9-b61",
     "text": "Je n’en ai pas perdu une minute, Nine. Pas une des tiennes. Il y en avait mille quatre cent quarante, et je les ai toutes regardées passer, en quatorze minutes, par la fente d’un volet. C’est tout ce que j’ai pu te donner, ce jour-là. Ce n’est pas grand-chose. C’est plus que je ne t’avais donné l’année d’avant.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c9-b62",
     "text": "J’ai refermé le volet. Je suis allée prendre mon sac.",
     "mentions": []
    },
    {
     "id": "c9-b63",
     "text": "Je suis partie à midi, avec le coureur de l’Écluse, un garçon qui s’appelait Firmin, qui avait dix-neuf ans et qui redescendait porter son rapport. Il n’avait pas l’air de m’en vouloir de lui avoir fait faire la route des mulets dans la neige. Il avait vu les enfants, le matin, dans le réfectoire. Il portait le sac des plis de l’Hospice, où Agathe avait fait mettre soixante et une lettres d’enfants à leurs familles, et quelques autres. Moi, je portais un bidon de souche dans une couverture de laine, contre mon ventre, pour Esquerre. Des nouvelles, et des preuves, avait-elle dit. Rien de rapide ne monte. Tout ce qui est rapide peut descendre.",
     "mentions": [
      "agathe-sorel",
      "pauline-esquerre",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c9-b64",
     "text": "Dans ma poche, il y avait aussi une lettre de ma mère. Pas pour moi. Pour toi. Elle me l’a donnée sur le seuil, en me faisant jurer de ne pas l’ouvrir. C’est la première lettre qu’elle ait écrite depuis vingt-deux ans, et elle ne l’a pas écrite à moi. Je trouve ça juste.",
     "mentions": []
    },
    {
     "id": "c9-b65",
     "text": "Ma mère et Tobie étaient à la fenêtre du troisième palier. Orso sur les marches, qui ôtait son chapeau. Capucine dans la cour, avec Mathilde. Agathe à la porte, les mains dans son tablier. Personne n’a crié au revoir. Ça coûte trop cher, les voix, d’un palier à l’autre.",
     "mentions": [
      "tobie-ferrand",
      "capucine-rigal",
      "mathilde"
     ]
    },
    {
     "id": "c9-b66",
     "text": "La descente, c’est l’ascension à l’envers, et c’est pourtant tout autre chose.",
     "mentions": []
    },
    {
     "id": "c9-b67",
     "text": "Le ciel, d’abord. Au-dessus de l’Échine, il battait comme à l’aller, clair, sombre, clair, mais à mesure que nous descendions, son pouls ralentissait. C’était comme sentir s’apaiser le cœur de quelqu’un qu’on tient contre soi après une course. Les nuits s’allongeaient. Les jours revenaient à la taille de jours. La lune, qui roulait comme une pièce, s’est mise à flotter. Et les saisons, en bas, ont ralenti leur défilé : la plaine, qui passait du blanc au vert en une après-midi quand je la regardais de l’Hospice, s’est mise à verdir à peu près à la vitesse où l’on s’attend à ce que verdisse une plaine.",
     "mentions": [
      "lechine"
     ]
    },
    {
     "id": "c9-b68",
     "text": "Nous avons dormi à la Baume. J’ai touché le rocher, au fond, là où Capucine avait posé la tête. Il y a, gravés sur la paroi, les noms des passeurs, avec leurs dates, dans les deux calendriers. J’ai cherché celui d’Orso. Il y était quarante fois. J’ai gravé le mien, en dessous, avec la pointe de mon burin, et la date d’Aval seulement.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c9-b69",
     "text": "Au Pas de l’Écluse, la visiteuse Coquard était à son pupitre.",
     "mentions": [
      "adrienne-coquard",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c9-b70",
     "text": "On ne fouille pas ceux qui descendent. L’Édit ne dit rien sur ce qui descend. Mais elle m’attendait. Elle avait lu le rapport de Firmin dans ses yeux, je pense, avant qu’il ouvre la bouche. Elle ne l’a pas écouté. Elle m’a regardée. Pas mes mains, cette fois. Mon visage. C’est la seule fois que je l’ai vue lever les yeux aussi haut.",
     "mentions": [
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c9-b71",
     "text": "— C’est la souche ? a-t-elle demandé en montrant la couverture contre mon ventre.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c9-b72",
     "text": "— Oui. Il y en a là-haut, maintenant, autant qu’il en faut. Ils en font toutes les nuits, dans le Puits des vendanges.",
     "mentions": [
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c9-b73",
     "text": "— Le Puits des vendanges, a-t-elle répété.",
     "mentions": []
    },
    {
     "id": "c9-b74",
     "text": "Et elle a eu, dans son visage de notaire, quelque chose qui ressemblait à un rire. Pas un rire. Un souffle par le nez.",
     "mentions": []
    },
    {
     "id": "c9-b75",
     "text": "— Trois siècles, a-t-elle dit, que nous gardons ce mur pour que rien de rapide ne monte. Et vous êtes allée chercher du temps rapide sous l’Hospice même.",
     "mentions": [
      "hospice-longue-veille",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c9-b76",
     "text": "J’ai sorti le récépissé de ma poche. Numéro 4 417, montre double, laiton, Ferrand. Je l’ai posé sur son pupitre. Elle l’a regardé. Elle a regardé la montre à mon poignet, avec ses deux cadrans arrêtés, sans balancier.",
     "mentions": []
    },
    {
     "id": "c9-b77",
     "text": "— Je viens réclamer ma montre, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c9-b78",
     "text": "Elle a pris son tampon. Elle l’a encré. Elle a tamponné le récépissé : restitué. Puis elle me l’a rendu.",
     "mentions": []
    },
    {
     "id": "c9-b79",
     "text": "— Il y a une femme au cachot, ai-je dit. Au soupirail. Celle de la doublure.",
     "mentions": [
      "madame-morand"
     ]
    },
    {
     "id": "c9-b80",
     "text": "— Madame Morand. Son jugement est à la Saint-Martin.",
     "mentions": []
    },
    {
     "id": "c9-b81",
     "text": "— Est-ce que je peux lui parler ?",
     "mentions": []
    },
    {
     "id": "c9-b82",
     "text": "Elle a hésité. Puis elle a appelé un douanier, et elle a dit : « Menez madame au soupirail n° 3 », et elle a baissé les yeux sur son registre, et ne les a plus relevés.",
     "mentions": []
    },
    {
     "id": "c9-b83",
     "text": "Madame Morand avait vécu près de deux mois depuis que je l’avais vue. Deux mois de cachot. Pour son fils, plus d’un an et demi. Je me suis accroupie devant les barreaux et je lui ai dit ce qui s’était passé là-haut. Je lui ai dit que ce qu’elle avait cousu dans la doublure de son fils existait maintenant en quantité, au-dessus du Pas, et qu’on en faisait chaque nuit. Qu’on ne pourrait plus condamner personne pour ça bien longtemps. Qu’Esquerre saurait, et qu’Aval saurait, et que la Saint-Martin de l’Écluse aurait lieu dans un monde où l’Édit ne voudrait plus rien dire. Elle m’a écoutée sans rien dire. Puis elle m’a demandé si je redescendais à Aval. J’ai dit oui. Elle a tiré de son corsage un bout de papier, un crayon, et elle a écrit, là, contre le mur, à genoux, quelques lignes pour son fils.",
     "mentions": [
      "pauline-esquerre",
      "pas-de-lecluse",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c9-b84",
     "text": "C’est le premier pli que j’ai porté. Je l’ai mis dans ma poche, à côté de celui de ma mère pour toi, et de celui de Capucine pour sa mère.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c9-b85",
     "text": "Au-dessous du Pas, les mélèzes avaient leurs aiguilles. Au-dessous des Granges, les foins étaient hauts. Nous sommes descendus le long de la Pendule, Firmin et moi, et je l’ai regardée. À l’aller, elle se dégelait à mesure que je montais. Au retour, c’était l’inverse : à mesure que je descendais, que je rejoignais le temps d’en bas, le haut de la cascade ralentissait de nouveau au-dessus de moi, se figeait, redevenait ce ruban de verre qu’on voit de la fenêtre de ta chambre. Là-haut, dans ce verre immobile, il y avait ma mère, mon frère, Capucine, Orso, Agathe, soixante et un enfants qui guérissaient. Ils vivaient à leur vitesse. Ils avaient l’air arrêtés. Ils ne l’étaient pas. C’est moi qui les regardais de trop bas.",
     "mentions": [
      "agathe-sorel",
      "les-granges",
      "la-pendule"
     ]
    },
    {
     "id": "c9-b86",
     "text": "Aux Granges, j’ai regardé une dernière fois la montre d’argent d’Orso. Le second cadran avançait, à peine plus vite que le premier. Trois fois, peut-être. Bientôt, deux fois. Bientôt, plus du tout. Je l’ai refermée. Je l’ai mise au fond de ma poche, avec les plis, et je ne l’ai plus regardée.",
     "mentions": [
      "double-montre"
     ]
    },
    {

     "text": "J’avais cessé de compter. Le temps qui passait en bas, désormais, c’était le mien aussi.",

    }

  {
   "id": "chapitre-10",

   "title": "Un seul cadran",
   "blocks": [
    {
     "id": "c10-b01",
     "text": "Tu étais sur le quai de la gare du Tardif.",
     "mentions": [
      "le-tardif"
     ]
    },
    {
     "id": "c10-b02",
     "text": "Il était six heures du soir, un jeudi de la mi-mai, et je ne le savais pas en arrivant : je n’avais plus regardé la montre d’Orso depuis les Granges. Je l’ai su en voyant le tramway de six heures arrêté au terminus, avec sa perche levée et son conducteur qui fumait sur le marchepied. Il y avait des gens sur le quai, des ouvriers des Tanneries qui rentraient, une vieille avec un panier de cerises. Et il y avait toi, assise sur le banc sous l’horloge, avec un livre ouvert sur les genoux, que tu ne lisais pas.",
     "mentions": [
      "orso-lebreuil",
      "les-granges"
     ]
    },
    {
     "id": "c10-b03",
     "text": "Je t’ai reconnue de loin. Je ne t’ai pas reconnue de près.",
     "mentions": []
    },
    {
     "id": "c10-b04",
     "text": "Tu avais seize ans et trois mois. Je t’avais laissée à quatorze ans et demi, avec des cheveux coupés au ciseau de couture et le blouson de ton père trop grand aux épaules. Tes cheveux avaient repoussé jusqu’aux épaules, et le blouson t’allait. Tu étais plus grande que moi. Tu avais, dans le visage, quelque chose de fini que je ne t’avais jamais vu, une façon de tenir la bouche, et entre les sourcils, déjà, la trace de la petite ride verticale. Tu m’as vue. Tu t’es levée. Tu as fermé ton livre. Tu n’as pas couru.",
     "mentions": []
    },
    {
     "id": "c10-b05",
     "text": "— Tu me dois vingt mois, as-tu dit.",
     "mentions": []
    },
    {
     "id": "c10-b06",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c10-b07",
     "text": "— Vingt mois et dix-neuf jours. J’ai fait le compte.",
     "mentions": []
    },
    {
     "id": "c10-b08",
     "text": "— Je sais que tu l’as fait.",
     "mentions": []
    },
    {
     "id": "c10-b09",
     "text": "Tu étais venue tous les soirs. Je l’ai appris plus tard, par le conducteur du tramway. Tous les soirs à six heures depuis le mois de mars, parce que ma lettre de l’Hospice, arrivée en septembre, disait « dans un an, à peu près », et que tu avais fait la multiplication, et que tu t’étais trompée de deux mois exprès, pour être sûre de ne pas me manquer. Tu t’asseyais sur le banc sous l’horloge, et tu attendais le dernier tramway, et tu rentrais. Pendant deux mois. Je n’ai pas su quoi faire de ça. Je ne sais toujours pas. Je te le dis pour que tu saches que je le sais.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c10-b10",
     "text": "Tu as regardé Firmin, qui se tenait à l’écart avec son sac des plis. Tu as regardé la couverture de laine contre mon ventre. Puis tu as regardé mon poignet, où il y avait ma montre aux deux cadrans morts, arrêtés sur le cinq juillet de l’an dernier, onze heures du soir. Et tu as relevé ta manche.",
     "mentions": []
    },
    {
     "id": "c10-b11",
     "text": "Tu avais une montre, toi aussi.",
     "mentions": []
    },
    {
     "id": "c10-b12",
     "text": "Un boîtier de laiton un peu trop gros, mal poli sur un bord. Deux cadrans. Le petit à l’heure d’Aval. Le grand, sur lequel tu avais peint à l’émail, maladroitement, un petit hospice accroché à une falaise, tournait lentement, très lentement : si lentement qu’on ne voyait pas bouger l’aiguille des minutes.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c10-b13",
     "text": "— C’est l’heure de là-haut, as-tu dit. L’heure de l’Hospice. Je l’ai faite à l’atelier, avec papa. Avec les pièces du tiroir de gauche et les tables de grand-père. La capsule, je n’ai pas su, alors j’ai mis un rapport fixe. Cent. C’était dans ta lettre. Je voulais savoir quand tu dormais.",
     "mentions": [
      "atelier-ferrand"
     ]
    },
    {
     "id": "c10-b14",
     "text": "Je n’ai rien dit. Je n’aurais pas pu.",
     "mentions": []
    },
    {
     "id": "c10-b15",
     "text": "— Je regardais la fenêtre, la lampe, là-haut. Quand ma montre disait que c’était la nuit chez toi, je regardais si la lampe était allumée. Elle l’était. Je me disais que tu dormais à côté. J’ai fait ça tous les soirs pendant un mois. Et puis j’ai arrêté.",
     "mentions": []
    },
    {
     "id": "c10-b16",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c10-b17",
     "text": "— Parce qu’on ne peut pas vivre à la fenêtre, as-tu dit. Tu me l’avais dit, une fois. Pour ta mère. Je n’avais pas compris.",
     "mentions": []
    },
    {
     "id": "c10-b18",
     "text": "C’est là que je t’ai prise dans mes bras. Ou que tu m’as prise dans les tiens, je ne sais plus. Tu étais plus grande. C’est moi qui ai dû lever la tête. Tu sentais le savon à la lavande et la soudure de poste de radio. Tu as dit, contre mon épaule, sans pleurer, avec ta voix de grande personne :",
     "mentions": []
    },
    {
     "id": "c10-b19",
     "text": "— Je t’en veux encore.",
     "mentions": []
    },
    {
     "id": "c10-b20",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c10-b21",
     "text": "— Pas pour toujours. Je n’ai pas le temps.",
     "mentions": []
    },
    {
     "id": "c10-b22",
     "text": "Je t’ai donné la lettre de ma mère sur le quai. Tu l’as lue dans le tramway, en rentrant, pendant que je regardais par la vitre défiler les rues d’Aval à leur vitesse, à la vitesse exacte où défilent des rues quand on est dedans, et je m’étonnais à chaque carrefour qu’il n’y ait rien d’étrange. Tu ne m’as pas montré la lettre. Tu ne me l’as jamais montrée. Tu m’en as dit trois choses, à l’arrêt de la rue des Cadrans : qu’elle ne mettait pas de sucre dans son lait ; qu’elle arriverait dans treize mois et qu’elle aurait trente-deux ans ; et qu’elle te demandait si tu voudrais bien, en bas, lui apprendre la TSF.",
     "mentions": [
      "aval",
      "atelier-ferrand"
     ]
    },
    {
     "id": "c10-b23",
     "text": "— La TSF, as-tu répété. Je lui ai répondu que ça s’appelait la radio.",
     "mentions": []
    },
    {
     "id": "c10-b24",
     "text": "— Tu lui as répondu ?",
     "mentions": []
    },
    {
     "id": "c10-b25",
     "text": "— Dans ma tête. Je lui écrirai. Monsieur Lebreuil remonte quand ?",
     "mentions": []
    },
    {
     "id": "c10-b26",
     "text": "— Il ne remonte pas. Il descend avec eux.",
     "mentions": []
    },
    {
     "id": "c10-b27",
     "text": "— Alors je lui dirai en vrai, as-tu dit. C’est mieux.",
     "mentions": []
    },
    {
     "id": "c10-b28",
     "text": "Le reste, tu le connais, puisque tu y étais, et que tu le connais même mieux que moi. Mais je l’écris quand même, parce que ça fait partie de ce que je te dois.",
     "mentions": []
    },
    {
     "id": "c10-b29",
     "text": "J’ai porté le bidon à Esquerre le lendemain matin, au lavoir. Elle a soulevé le couvercle, elle a senti, elle a trempé le doigt, elle l’a regardé à la lumière de la fenêtre. Puis elle s’est assise sur le banc de pierre où l’on battait le linge, et elle a ri, un long moment, toute seule, avec ses mains rouges sur les genoux. Quand je lui ai raconté le Puits, elle a cessé de rire. Elle a dit : « Vingt jours en une nuit. » Et puis : « Il faudrait ça partout. » Et puis, très vite, en attrapant un crayon : « Répétez-moi la cote de la Chaudière. »",
     "mentions": [
      "pauline-esquerre",
      "puits-des-vendanges",
      "la-cote"
     ]
    },
    {
     "id": "c10-b30",
     "text": "Nous avons porté les plis, toi et moi. Soixante et une lettres d’enfants, plus quelques autres. Il y a des adresses qui n’existaient plus. Il y a des familles qui avaient déménagé, que nous avons retrouvées par les registres de la mairie, par les voisins, par les églises. Il y a des familles que nous n’avons pas retrouvées. Madame Rigal a ouvert la porte en tablier, les bras rouges jusqu’au coude, et elle a lu la lettre de Capucine sur le seuil, et elle n’a pas fait la multiplication, parce que Capucine l’avait interdite. C’est moi qui la lui ai faite : treize mois. Elle a dit : « C’est moins que trois cents ans. » Elles se ressemblent. Le fils de madame Morand avait onze ans et demi et vivait chez une tante, rue des Teinturiers. Il a lu la lettre de sa mère dans la cour de l’immeuble, debout, en remuant les lèvres. Puis il m’a demandé combien de temps il faudrait pour aller jusqu’au Pas de l’Écluse. Je lui ai dit que pour lui, une journée et demie. Pour sa mère, trois heures. Il a dit qu’il irait. Il y est allé, je crois. Tu me diras si tu le sais.",
     "mentions": [
      "capucine-rigal",
      "madame-morand",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c10-b31",
     "text": "Il y a eu les journaux. Tu les as gardés. L’affaire du Puits, en première page de L’Écho d’Aval pendant une semaine, puis en page quatre, puis plus du tout, parce qu’à Aval tout va vite, même l’indignation. Il y a eu une séance du conseil, une motion, une commission, une délégation à l’Écluse. Elle n’a rien eu à demander : l’Édit avait déjà été suspendu « pour ce qui concerne les remèdes », par la visiteuse Coquard elle-même, d’une ligne à l’encre violette dans son registre, sans attendre l’avis de personne. Ça a fait rire Esquerre et pleurer un conseiller. On a envoyé là-haut des inspecteurs, en redingote, qui sont montés avec des serviettes de cuir et qui, pour ce qu’on en sait, n’ont pas encore fini de monter. La visiteuse Coquard, elle, a renvoyé par Firmin, sans lettre, dans une boîte à chaussures, les six doubles montres Ferrand qu’elle avait saisies dans l’année. Je les ai rendues à leurs propriétaires. L’un d’eux était mort. Sa veuve a gardé la montre. Elle dit qu’elle la remonte le dimanche.",
     "mentions": [
      "adrienne-coquard",
      "les-suspendus",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c10-b32",
     "text": "Et puis il y a eu les treize mois.",
     "mentions": []
    },
    {
     "id": "c10-b33",
     "text": "Je ne sais pas comment te les raconter, justement parce que tu les as vécus avec moi. C’est la première fois de ta vie que nous avons passé treize mois à la même vitesse. Tu es allée au lycée. Je suis allée à l’atelier. Tu as commencé à venir le jeudi après-midi, puis le mardi aussi, puis tous les jours, et un matin j’ai trouvé ton poste de radio démonté sur mon établi, à côté de mes loupes. Je n’ai rien dit. Tu n’as rien dit. On a partagé l’établi. Tu m’as appris ce qu’est un condensateur. Je t’ai appris ce qu’est un échappement à ancre. Tu as dit que c’était la même chose, au fond, un truc qui laisse passer le temps par petits paquets. Je t’ai dit que ton grand-père aurait adoré cette phrase.",
     "mentions": [
      "jules-ferrand",
      "atelier-ferrand"
     ]
    },
    {
     "id": "c10-b34",
     "text": "Pour tes dix-sept ans, j’étais là.",
     "mentions": []
    },
    {
     "id": "c10-b35",
     "text": "Je veux dire que j’étais là à la vitesse ordinaire. Je ne l’avais pas été depuis deux ans. J’avais dormi tes quinze ans et regardé tes seize en quatorze minutes par la fente d’un volet, et pour tes dix-sept, je me suis levée à sept heures, j’ai fait du chocolat, tu es descendue en râlant parce qu’il n’y avait plus de pain, tu es partie au lycée, tu es rentrée, on a mangé un gâteau raté que j’avais fait, ton père est passé avec un cadeau, tu as haussé les épaules quand on a chanté. Ça dure très longtemps, un anniversaire. Je ne savais plus. Ça dure toute une journée. C’est immense, une journée entière, quand on la vit dedans.",
     "mentions": []
    },
    {
     "id": "c10-b36",
     "text": "Un soir de l’hiver, tu m’as emmenée au lycée, au dernier étage, dans la salle d’astronomie où le professeur Vasseur te laisse les clés. Il y a là une grande lunette de cuivre, qu’on pointe par une trappe du toit. Tu l’as pointée sur le Tardif. Pas sur l’Hospice. Plus haut. Sur les gradins de roche qui montent vers la brume grise des Terrasses. Tu as réglé la mise au point. Puis tu t’es écartée.",
     "mentions": [
      "le-tardif",
      "hospice-longue-veille",
      "les-terrasses"
     ]
    },
    {
     "id": "c10-b37",
     "text": "— Regarde, as-tu dit.",
     "mentions": []
    },
    {
     "id": "c10-b38",
     "text": "Sur l’Escalier des Lents, à mi-chemin des Terrasses, il y avait une silhouette noire, avec un gros livre sous le bras. Elle avait un pied levé. Je l’ai regardée longtemps. Elle n’a pas bougé. Je suis revenue la regarder une semaine plus tard, et un mois plus tard, et le pied était toujours levé, un peu plus haut peut-être, à peine. Il y est encore, Nine. Il y sera quand tu auras mon âge. Il est en train de faire un pas. Il porte dans la poche de son gilet, dans une petite boîte de carton, le balancier de ma montre, et il ne finira jamais de monter, parce qu’il n’y a pas de haut au-dessus duquel on cesse de vous devoir des comptes. On a le temps, là-haut, pour les comptes. On l’a tout entier. Il l’a voulu.",
     "mentions": [
      "nine",
      "les-lents"
     ]
    },
    {
     "id": "c10-b39",
     "text": "Ils sont arrivés un mardi de juin, à six heures du soir, par le chemin des Granges.",
     "mentions": [
      "les-granges"
     ]
    },
    {
     "id": "c10-b40",
     "text": "Nous étions sur le quai, toi et moi, sur le banc sous l’horloge. Nous y étions venues tous les soirs depuis une semaine, parce que j’avais fait la multiplication et que je m’étais trompée d’une semaine exprès, comme toi. Tu avais apporté un livre, que tu ne lisais pas. Moi, rien. J’avais une montre à un seul cadran, que je ne regardais pas.",
     "mentions": []
    },
    {
     "id": "c10-b41",
     "text": "Orso est apparu le premier, à la borne, au bout des pavés, avec Tobie sur les épaules. Rasé de frais. Son manteau de drap, son chapeau. Derrière lui, Capucine, en manteau rouge, qui tenait la main de la grande Mathilde et d’une petite de six ans que je ne connaissais pas. Et derrière eux, avec un sac de toile à l’épaule et la boîte à biscuits Mauduit sous le bras, en robe grise de veilleuse, parce qu’elle n’en avait pas d’autre, ma mère.",
     "mentions": [
      "mathilde",
      "veilleuses",

     ]

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));

+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);

$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");

wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
