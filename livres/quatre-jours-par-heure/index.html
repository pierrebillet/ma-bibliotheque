    },
    {
     "id": "c1-b27",
     "text": "— Six mois et trois semaines, madame.",
     "mentions": []
    },
    {
     "id": "c1-b28",
     "text": "Tu vois, Nine, c’est la première multiplication. Il faut que tu la comprennes pour comprendre le reste. Une semaine là-haut, c’est sept cents jours ici, presque deux ans. Mais la lettre avait mis presque sept mois d’Aval à descendre. Sept mois d’Aval, c’est deux jours de Tobie. Sa dernière semaine avait donc commencé depuis deux jours, et chaque jour que je passerais à Aval à hésiter lui en retirerait un quart d’heure. Il me restait, si les médecins avaient raison, un peu plus d’un an et quatre mois d’Aval pour arriver avant la fin. C’est beaucoup, pour une femme qui marche. C’est très peu, pour une femme qui marche vers un endroit où chacun de ses pas coûte plus cher que le précédent.",
     "mentions": [
      "nine",
      "tobie-ferrand",
      "aval"
     ]
    },
    {
     "id": "c1-b29",
     "text": "— Il y a un remède, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c1-b30",
     "text": "Orso n’a pas répondu. Il savait. Tout Aval le savait depuis deux ans.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c1-b31",
     "text": "La calcine, c’est le nom de ce qu’avait Tobie. Les poumons se remplissent de sel, lentement, comme les tuyaux d’une vieille maison, et un jour l’air ne passe plus. Pendant trois siècles, il n’y a rien eu à faire, sauf monter. Et puis, deux ans avant cette matinée, une femme d’Aval, le docteur Pauline Esquerre, a trouvé dans la terre d’un cimetière de montagne une souche qui mange le sel. On l’injecte, elle s’installe, elle dissout. Sept jours, sept injections. Les enfants d’Aval qui l’ont reçue courent aujourd’hui dans la cour de ton lycée. Tu en connais peut-être.",
     "mentions": [
      "pauline-esquerre",
      "calcine",
      "souche-desquerre"
     ]
    },
    {
     "id": "c1-b32",
     "text": "Mais la souche est interdite au-dessus du Pas de l’Écluse. Comme le reste. Rien de rapide ne monte : c’est l’Édit, gravé sur le linteau de la douane, et les douaniers le lisent large. Les postes de radio, les fusils, les bicyclettes, les ampoules, les journaux de moins de six mois, les médicaments nouveaux. Officiellement, pour préserver la paix des hauteurs. Officieusement, tu verras.",
     "mentions": [
      "pas-de-lecluse",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c1-b33",
     "text": "— Il faut que j’aille voir le docteur Esquerre, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c1-b34",
     "text": "— Oui, madame, a dit Orso. Et après, il faudra venir me voir. Je remonte après-demain.",
     "mentions": []
    },
    {
     "id": "c1-b35",
     "text": "Il a remis son chapeau et il est sorti, et la cloche a sonné derrière lui, et j’ai compris qu’il savait depuis mercredi dernier de là-haut ce que j’allais faire. Il m’avait apporté la lettre en sachant que je monterais. Je ne sais pas si je lui en ai voulu à ce moment-là. Plus tard, oui. Beaucoup. Puis plus du tout, mais ça, c’est la fin de l’histoire.",
     "mentions": []
    },
    {
     "id": "c1-b36",
     "text": "Le dispensaire d’Esquerre est au bout du quartier des Tanneurs, dans l’ancien lavoir. On y fait la queue dès l’aube. Il y avait ce matin-là une quarantaine de mères avec des enfants qui toussaient, assises sur les bancs de pierre où l’on battait le linge autrefois, et une odeur de lait tiède qui venait du fond. Je me suis mise dans la queue. J’avais mis mon manteau des dimanches, je ne sais pas pourquoi. Pour avoir l’air de quelqu’un à qui l’on ne dit pas non, je suppose.",
     "mentions": [
      "pauline-esquerre"
     ]
    },
    {
     "id": "c1-b37",
     "text": "Le docteur Esquerre m’a reçue à midi. C’est une petite femme maigre, les cheveux courts, avec des mains rouges de laveuse et des yeux de quelqu’un qui n’a pas dormi depuis deux ans, ce qui était à peu près le cas. Elle a écouté mon histoire sans m’interrompre. Quand j’ai dit « l’Hospice », elle a posé son crayon.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c1-b38",
     "text": "— Vous savez que c’est interdit.",
     "mentions": []
    },
    {
     "id": "c1-b39",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c1-b40",
     "text": "— Vous savez qu’on fouille les familles des suspendus jusqu’aux ourlets, depuis que la souche existe ? Qu’on a arrêté au Pas une mère qui avait cousu une fiole dans la doublure de son fils cadet ? Elle est au cachot de l’Écluse. Ça fait quatre mois pour nous. Pour elle, ça fait douze jours. Elle ne sait peut-être même pas encore qu’on l’a condamnée.",
     "mentions": [
      "pas-de-lecluse",
      "souche-desquerre",
      "les-suspendus"
     ]
    },
    {
     "id": "c1-b41",
     "text": "— Je ne monterai pas comme famille.",
     "mentions": []
    },
    {
     "id": "c1-b42",
     "text": "Elle m’a regardée longtemps. Puis elle s’est levée, elle est allée au fond de la salle, là où l’odeur de lait tiède était la plus forte, et elle est revenue avec une fiole pas plus longue que mon doigt, bouchée de cire, remplie d’un liquide trouble couleur de petit-lait.",
     "mentions": []
    },
    {
     "id": "c1-b43",
     "text": "— Sept doses, a-t-elle dit. Une par jour, dans le bras, sept jours de suite. Pas de gel, surtout. Le froid la tue. La chaleur aussi, au-delà de ce qu’une main supporte.",
     "mentions": []
    },
    {
     "id": "c1-b44",
     "text": "Elle ne me l’a pas donnée tout de suite. Elle la tenait entre ses doigts rouges, à hauteur de mes yeux.",
     "mentions": []
    },
    {
     "id": "c1-b45",
     "text": "— Il faut que vous compreniez une chose, a-t-elle dit. Ce n’est pas un médicament. C’est une bête. C’est vivant. Ça se nourrit. Si on la met dans du lait sucré, au tiède, elle se double en deux jours. En vingt jours, avec une fiole, j’en fais mille. Le problème, ce n’est pas la souche. Le problème, c’est les vingt jours. Il y a trois mille enfants malades dans la vallée et je n’ai que des vingt jours. Personne n’a le temps. Vous comprenez ?",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c1-b46",
     "text": "J’ai dit oui. Je n’avais pas compris. J’ai mis vingt jours à comprendre, et ils n’étaient pas de ceux qu’on croit.",
     "mentions": []
    },
    {
     "id": "c1-b47",
     "text": "Elle ne m’a rien fait payer. Quand j’ai sorti mon portefeuille, elle a eu un geste de la main, comme on chasse une mouche.",
     "mentions": []
    },
    {
     "id": "c1-b48",
     "text": "— Là-haut, a-t-elle dit, la loi dit que vos enfants n’existent pas pour moi. Alors je vous donne une chose qui n’existe pas. Rapportez-moi des nouvelles. C’est tout ce que je demande. Des nouvelles, et si vous pouvez, des preuves.",
     "mentions": []
    },
    {
     "id": "c1-b49",
     "text": "En rentrant, je suis passée à l’atelier. J’ai fermé le rideau de fer. J’ai sorti de sa boîte la double montre que je gardais pour moi, celle que ton grand-père m’avait faite pour mes vingt ans et que je n’avais jamais portée plus haut que les Granges. Boîtier de laiton épais, cinquante-cinq millimètres. J’ai démonté le fond. J’ai retiré le barillet de réserve, qui ne sert qu’aux voyages de plus d’un mois. Dans la cavité, avec du coton et un peu de cire, la fiole tenait tout juste. J’ai revissé le fond. Au poignet, on ne voyait rien. À l’oreille, la montre battait un peu plus sourd, comme un cœur sous un manteau.",
     "mentions": [
      "jules-ferrand",
      "atelier-ferrand",
      "les-granges"
     ]
    },
    {
     "id": "c1-b50",
     "text": "Puis j’ai réglé le second cadran.",
     "mentions": []
    },
    {
     "id": "c1-b51",
     "text": "Je ne sais pas comment te dire ce geste. Tout horloger le fait cent fois par an : on met la grande aiguille sur l’heure d’Aval, on vérifie le quantième, on referme. Ce soir-là, j’ai mis la grande aiguille sur ton heure. J’ai gravé au dos, à la pointe, la date de ton anniversaire, et en dessous, en tout petit, tes initiales. N. F. À Aval, au niveau de la rivière, les deux cadrans marchaient ensemble, exactement. Ils se suivaient comme deux chiens bien dressés. Ce serait la dernière fois avant longtemps.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c1-b52",
     "text": "Tu es rentrée du lycée à six heures. Tu as vu le rideau de fer baissé en plein jour, tu as vu ma tête, tu as vu le sac de montagne sur la table de la cuisine. Tu as quatorze ans dans cette scène, et je voudrais que tu te voies comme je t’ai vue : les cheveux coupés court la semaine d’avant, par toi-même, avec les ciseaux de couture, le blouson de ton père trop grand aux épaules, les doigts noircis par le poste de radio que tu démontais dans ta chambre depuis un mois. Tu as posé ton cartable. Tu as lu la lettre, que j’avais laissée sur la table exprès, parce que je n’aurais pas su te le dire.",
     "mentions": []
    },
    {
     "id": "c1-b53",
     "text": "— Combien de temps ? as-tu demandé.",
     "mentions": []
    },
    {
     "id": "c1-b54",
     "text": "— Je ne sais pas. Un an, peut-être. Un peu plus.",
     "mentions": []
    },
    {
     "id": "c1-b55",
     "text": "— Pour toi ou pour moi ?",
     "mentions": []
    },
    {
     "id": "c1-b56",
     "text": "C’était la bonne question. Je n’avais pas élevé une idiote.",
     "mentions": []
    },
    {
     "id": "c1-b57",
     "text": "— Pour toi, ai-je dit. Pour moi, une quinzaine de jours.",
     "mentions": []
    },
    {
     "id": "c1-b58",
     "text": "Tu as ri. C’était un rire affreux, un rire de grande personne.",
     "mentions": []
    },
    {
     "id": "c1-b59",
     "text": "— Donc tu pars quinze jours et je t’attends un an.",
     "mentions": []
    },
    {
     "id": "c1-b60",
     "text": "— Tu seras chez ton père. Il est d’accord. Je lui ai téléphoné.",
     "mentions": []
    },
    {
     "id": "c1-b61",
     "text": "— Tu as téléphoné à papa avant de me le dire.",
     "mentions": []
    },
    {
     "id": "c1-b62",
     "text": "Je n’ai rien répondu. Il n’y avait rien à répondre. J’avais fait ce que font les adultes quand ils ont peur : j’avais organisé.",
     "mentions": []
    },
    {
     "id": "c1-b63",
     "text": "— C’est un petit garçon que je n’ai pas vu depuis vingt-sept ans, ai-je dit. Il a sept ans. Il va mourir, Nine.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c1-b64",
     "text": "— C’est un petit garçon que je n’ai jamais vu de ma vie, as-tu répondu. Et moi je suis là.",
     "mentions": []
    },
    {
     "id": "c1-b65",
     "text": "Et puis tu as dit la phrase. Tu t’en souviens, je pense. Tu t’en es peut-être voulu. Il ne faut pas. C’était la phrase la plus juste qu’on m’ait jamais dite, et elle m’a tenu compagnie jusqu’en haut.",
     "mentions": []
    },
    {
     "id": "c1-b66",
     "text": "— Tu vas me faire ce qu’elle t’a fait.",
     "mentions": []
    },
    {
     "id": "c1-b67",
     "text": "— Ce n’est pas pareil.",
     "mentions": []
    },
    {
     "id": "c1-b68",
     "text": "— C’est exactement pareil. Sauf que toi, tu sais compter.",
     "mentions": []
    },
    {
     "id": "c1-b69",
     "text": "Tu es montée dans ta chambre et tu as fermé la porte. Je t’ai entendue remettre en marche ton poste de radio, tourner le bouton jusqu’à une musique de danse, très fort, une musique qui n’existait pas quand j’avais ton âge et qui, là-haut, n’existerait jamais. Je suis restée dans la cuisine avec la lettre et la montre. Vers minuit, j’ai frappé. Tu n’as pas ouvert. J’ai glissé un mot sous la porte. Je ne me rappelle pas ce que j’ai écrit. Quelque chose de maladroit, sûrement, avec « je t’aime » à la fin, comme on met une pièce dans un tronc.",
     "mentions": []
    },
    {
     "id": "c1-b70",
     "text": "À l’aube, je suis partie. Le ciel était encore noir au-dessus d’Aval, et là-haut, sur la falaise, la fenêtre de l’Hospice était allumée. Ma mère dormait. Elle dormait depuis début août. J’ai regardé ma montre sous le réverbère de la rue des Cadrans : cinq heures douze sur le petit cadran, cinq heures douze sur le grand. Ton heure et la mienne, pour la dernière fois la même.",
     "mentions": [
      "aval",
      "atelier-ferrand",
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c1-b71",
     "text": "Puis j’ai pris le chemin des Granges, où Orso m’attendait avec une petite fille.",
     "mentions": [
      "orso-lebreuil",
      "les-granges"
     ]
    }
   ]
  },
  {
   "id": "chapitre-2",
   "number": 2,
   "title": "La cascade arrêtée",
   "blocks": [
    {
     "id": "c2-b01",
     "text": "La petite fille s’appelait Capucine Rigal, elle avait neuf ans, et la première chose qu’elle m’a dite, avant même bonjour, c’est qu’elle n’était pas petite.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c2-b02",
     "text": "Elle était assise sur sa valise, au pied de la borne qui marque la fin des pavés et le début du chemin des Granges, derrière la petite gare du Tardif où finit la ligne du tramway, avec un manteau rouge boutonné jusqu’au menton et un gâteau enveloppé dans du papier journal sur les genoux. Sa mère se tenait derrière elle, les avant-bras rouges jusqu’au coude comme tous ceux des Tanneries, et regardait la montagne comme on regarde un homme qui vous doit de l’argent. Orso, un peu à l’écart, fumait une pipe de terre.",
     "mentions": [
      "orso-lebreuil",
      "le-tardif",
      "les-granges"
     ]
    },
    {
     "id": "c2-b03",
     "text": "— Voilà votre veilleuse, mademoiselle, a-t-il dit. Madame Ferrand.",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c2-b04",
     "text": "On ne m’avait pas demandé mon avis sur le mot. Veilleuse de louage : c’est ainsi qu’on appelle les femmes qu’on paie pour accompagner un enfant là-haut quand la famille ne peut pas se passer d’un salaire. Elles restent quelques jours, installent l’enfant, puis redescendent, ou pas. Les douaniers les fouillent moins que les mères. Une mère, disent-ils, on sait ce qu’elle est prête à cacher. Une femme payée, on sait ce qu’elle est prête à risquer : rien. C’était la couverture qu’Orso m’avait trouvée. Madame Rigal lui avait versé la moitié de mon salaire. L’autre moitié, je devais la toucher en redescendant. Je ne l’ai jamais réclamée.",
     "mentions": []
    },
    {
     "id": "c2-b05",
     "text": "— Elle tousse surtout le matin, m’a dit madame Rigal. Il faut lui faire boire chaud. Elle ne mange pas les carottes, mais ce n’est pas grave. Elle lit tout ce qu’elle trouve, il faut lui trouver des choses.",
     "mentions": []
    },
    {
     "id": "c2-b06",
     "text": "— Je lui trouverai des choses.",
     "mentions": []
    },
    {
     "id": "c2-b07",
     "text": "— Les médecins disent qu’elle a au moins trois ans devant elle, ici. Là-haut, ça fera…",
     "mentions": []
    },
    {
     "id": "c2-b08",
     "text": "Elle ne savait pas faire la multiplication, ou elle ne voulait pas la faire devant sa fille. Je l’ai faite dans ma tête. Trois cents ans. Capucine avait devant elle, à l’Hospice, trois siècles d’Aval pour attendre un remède qui existait déjà, et que je portais au poignet, dans une montre de laiton, à cinquante centimètres de son nez.",
     "mentions": [
      "capucine-rigal",
      "aval",
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c2-b09",
     "text": "Je voudrais te dire que j’ai hésité. Que j’ai failli tout avouer à cette femme aux bras rouges, lui dire : ne la montez pas, gardez-la, attendez votre tour sur la liste d’Esquerre. Je n’ai pas hésité. J’ai calculé. Sept doses : un traitement. Un seul enfant. Si j’en parlais, je n’en aurais plus aucun. Et la liste d’Esquerre, Capucine y était peut-être déjà, en trois mille et quelque, et sa mère avait fait sa propre multiplication, et elle avait choisi la montagne. Je me suis dit tout cela très vite, très bien, avec les mots qu’il fallait. Je le dis maintenant pour que tu saches de quoi ta mère est capable quand elle a peur : de raisonnements impeccables.",
     "mentions": [
      "pauline-esquerre"
     ]
    },
    {
     "id": "c2-b10",
     "text": "Madame Rigal s’est accroupie devant sa fille. Elle a reboutonné le premier bouton du manteau, qui était déjà boutonné.",
     "mentions": []
    },
    {
     "id": "c2-b11",
     "text": "— Tu écriras.",
     "mentions": []
    },
    {
     "id": "c2-b12",
     "text": "— Tous les jours, a dit Capucine.",
     "mentions": []
    },
    {
     "id": "c2-b13",
     "text": "— Pas tous les jours. Quand monsieur Lebreuil passe. Tous les jours, ça me ferait trop de lettres.",
     "mentions": []
    },
    {
     "id": "c2-b14",
     "text": "Elle a souri en disant cela, et j’ai compris qu’elle avait fait la multiplication, finalement. Tous les jours de Capucine, ce serait une lettre tous les trois mois. Elle recevrait, au mieux, une douzaine de lettres avant que sa fille ait eu le temps de finir son gâteau.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c2-b15",
     "text": "Puis elle s’est relevée et elle est partie sans se retourner. C’est la bonne façon. Je ne l’avais pas eue, moi, la veille, devant ta porte fermée.",
     "mentions": []
    },
    {
     "id": "c2-b16",
     "text": "On a commencé à monter vers sept heures. Le chemin des Granges part en lacets dans les prés, entre des murets de pierres sèches, et longe la Pendule sur toute sa hauteur. En bas, la cascade fait un bruit de cascade. Elle tombe dans une vasque où les enfants d’Aval se baignent l’été, et où j’ai appris à nager, et où tu as appris à nager aussi, je crois bien, avec ton père, un été où j’avais trop de travail. L’eau y est froide et furieuse. On se dit, en la regardant de près, qu’elle ne peut pas être la même que ce ruban immobile, là-haut, contre la falaise.",
     "mentions": [
      "aval",
      "les-granges",
      "la-pendule"
     ]
    },
    {
     "id": "c2-b17",
     "text": "C’est pourtant la même. Et la chose la plus étrange de la journée — plus étrange que tout ce que j’avais lu, que tout ce que ton grand-père m’avait raconté — a été de la voir se dégeler à mesure que nous montions.",
     "mentions": [
      "jules-ferrand"
     ]
    },
    {
     "id": "c2-b18",
     "text": "Il faut que je te l’explique bien, parce que tu ne l’as jamais vu. De la vasque, quand on lève la tête, la Pendule ralentit à mesure qu’elle monte : vive en bas, lente au milieu, arrêtée en haut. Au premier lacet, rien ne change. Au dixième, on s’aperçoit que le milieu de la cascade, qui semblait lent, bouge maintenant comme de l’eau ordinaire, et que c’est plus haut que ça ralentit. Au trentième, on est à la hauteur du milieu, et c’est le bas qui s’est mis à courir, bouillonnant, trop vif, comme un film qu’on passe en accéléré, pendant que le haut, toujours, reste immobile. La cascade ne se dégèle pas. C’est nous qui gelons. Nous, et tout ce que nous regardons de près.",
     "mentions": []
    },
    {
     "id": "c2-b19",
     "text": "Capucine a compris ça avant moi. Elle l’a dit à sa façon, en s’arrêtant au milieu du chemin, la main en visière.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c2-b20",
     "text": "— En bas, ça va plus vite, a-t-elle dit. Mais nous, on ne va pas plus lentement. Je me sens pareille.",
     "mentions": []
    },
    {
     "id": "c2-b21",
     "text": "— Tu es pareille, a dit Orso. C’est le monde qui ne l’est plus.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c2-b22",
     "text": "— Alors c’est le monde qui change, pas nous.",
     "mentions": []
    },
    {
     "id": "c2-b23",
     "text": "— Voilà, mademoiselle. Retenez ça. Ça vous servira toute la vie, et même un peu après.",
     "mentions": []
    },
    {
     "id": "c2-b24",
     "text": "Il parlait comme ça, Orso. Je ne l’avais jamais entendu parler plus de trois phrases de suite, à l’atelier, et là, sur le chemin, avec cette enfant qui posait des questions comme on lance des cailloux, il s’est mis à parler comme un livre de classe d’avant la guerre. Il appelait les automobiles des voitures sans chevaux. Il a dit la TSF quand Capucine a parlé de la radio, et quand elle lui a demandé ce que c’était, la TSF, il a eu l’air sincèrement surpris qu’on ne sache pas. Il connaissait par cœur des chansons que personne ne chante plus, sur des filles de ferme et des soldats qui reviennent, et il les chantait faux, avec une conviction de sonneur de cloches. Il avait des pièces dans son porte-monnaie avec un profil de roi dessus. Il connaissait tous les murets, toutes les sources, le nom des vaches.",
     "mentions": [
      "capucine-rigal",
      "atelier-ferrand"
     ]
    },
    {
     "id": "c2-b25",
     "text": "Les vaches des Granges, justement. Nous en avons croisé un troupeau vers midi, dans un pré en pente, et je me suis arrêtée pour les regarder. Elles broutaient. Elles broutaient à une allure tout à fait normale, avec cette application obtuse des vaches. Mais le pré où elles broutaient était un peu plus haut que nous, et elles, c’est vrai, un peu plus lentes : un mouvement de mâchoire qui durait, une queue qui chassait une mouche avec la majesté d’un balancier. Le berger, un garçon d’une quinzaine d’années appuyé sur un bâton, nous a crié quelque chose. Sa voix nous est arrivée grave, traînante, comme un disque qu’on passe au mauvais régime. Bon-jour-mes-sieurs-da-mes. Capucine a éclaté de rire. Le garçon a dû nous entendre rire avec des voix de souris.",
     "mentions": [
      "les-granges"
     ]
    },
    {
     "id": "c2-b26",
     "text": "— Ça, c’est le pire, m’a dit Orso plus tard. Pas le temps. Les voix. On s’habitue à tout sauf aux voix. Une mère en haut, un fils en bas, quand ils s’appellent d’un palier à l’autre, l’un entend un ogre et l’autre un oiseau.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c2-b27",
     "text": "À midi et demi à ma montre, j’ai regardé le second cadran pour la première fois.",
     "mentions": [
      "double-montre"
     ]
    },
    {
     "id": "c2-b28",
     "text": "Je m’étais promis de ne pas le faire trop souvent. C’est une promesse que je n’ai jamais tenue. Il marquait deux heures moins le quart. Le soleil, là-dessus, n’était pas d’accord avec moi : il était déjà nettement passé au couchant, pressé, comme en fin d’après-midi. Au bout de quelques heures de marche, on commence à le voir. Il ne se lève pas plus tôt, il n’est pas plus gros, il est seulement plus rapide. Il traverse le ciel à la manière d’un homme qui a rendez-vous. À Aval, pendant que je mangeais mon pain au bord du chemin, tu devais sortir de la cantine. À Aval, il se passait une heure et quart de plus que chez nous. Ce n’était rien. Ce n’était pas encore rien.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c2-b29",
     "text": "Les Granges, on y arrive par le haut d’un grand pré, où la pente cesse d’un coup comme une marche d’escalier. C’est le premier palier du Tardif. Tu n’y es jamais montée. Il y a une trentaine de fermes de pierre grise, un lavoir, une chapelle sans curé, des séchoirs à fromages qui sentent la cave, et des gens qui vivent trois fois moins vite que nous sans avoir l’air de s’en apercevoir. La cote y est de trois, un peu plus sur les hauteurs. Les enfants d’Aval les traitent de lambins. Eux traitent les gens d’Aval de courants d’air. Ils affinent des tommes qui passent six mois de chez nous en cave et en sortent au bout de deux mois de chez eux, ce qui fait leur fortune : à Aval on les paie comme des tommes de six mois, et elles leur ont coûté deux mois de travail. Tout le Tardif marche comme ça, Nine. Du haut en bas. Tu verras.",
     "mentions": [
      "nine",
      "le-tardif",
      "la-cote"
     ]
    },
    {
     "id": "c2-b30",
     "text": "Nous sommes arrivés vers quatre heures à ma montre. Orso nous a logées dans la grange d’une veuve qu’il appelait madame Anna et qu’il avait connue, disait-il, jeune fille. Elle avait soixante-dix ans. Elle l’a embrassé sur les deux joues comme on embrasse un frère cadet. Je ne sais pas quel âge il avait quand elle était jeune fille. Je ne sais pas quel âge il avait, à vrai dire, et ça m’a travaillée toute la soirée, pendant qu’elle nous servait une soupe au lard dans des bols de bois.",
     "mentions": []
    },
    {
     "id": "c2-b31",
     "text": "Le soleil s’est couché pendant que nous mangions.",
     "mentions": []
    },
    {
     "id": "c2-b32",
     "text": "Je veux dire : il s’est couché une première fois pour moi, à la fin de la soupe, et j’ai vu Aval s’éteindre en bas. Pas s’éteindre, pardon. S’allumer. Les réverbères de l’avenue des Tilleuls, puis ceux des quais, puis les fenêtres, une par une, puis la grande enseigne du cinéma Palace, qui clignote rouge et bleu. Et puis, pendant que madame Anna débarrassait les bols et qu’Orso bourrait sa pipe, les fenêtres ont commencé à s’éteindre, par quartiers, les Tanneries d’abord, qui se couchent tôt, puis le centre. L’enseigne du Palace s’est éteinte à sept heures de chez nous — onze heures du soir chez toi. Puis la ville a dormi. Puis, à peine le temps pour moi de raccommoder la chaussette de Capucine, les boulangeries se sont rallumées, et les tramways, et la ligne pâle du jour s’est levée derrière la montagne d’en face, et j’ai pensé, stupidement, que c’était le matin à Aval et pas chez nous, puisque chez nous la nuit venait à peine de tomber.",
     "mentions": [
      "orso-lebreuil",
      "capucine-rigal"
     ]
    },
    {
     "id": "c2-b33",
     "text": "Mais le soleil est le même pour tout le monde. S’il se levait sur Aval, il se levait sur nous, et il s’est levé sur nous : à dix heures moins le quart du soir, à ma montre, madame Anna a soufflé la lampe parce que la fenêtre de la grange était devenue claire. Aux Granges, on dort sous le soleil une fois sur deux. On y a trois journées pour une nuit de sommeil. On s’y fait, paraît-il. On ferme les volets.",
     "mentions": [
      "aval",
      "les-granges"
     ]
    },
    {
     "id": "c2-b34",
     "text": "Je n’ai pas fermé les volets. Je suis restée à la fenêtre, comme à douze ans, et j’ai regardé Aval vivre sa journée du lendemain pendant que je ne dormais pas. Le marché sur la place de la Halle, qu’on devinait aux bâches blanches. Les fumées de la tannerie. Le train de onze heures, un trait de vapeur sur la vallée qui a traversé toute la plaine pendant que je comptais jusqu’à quarante. Et puis le soleil a recommencé à tomber, trop vite, et le Palace s’est rallumé, rouge et bleu.",
     "mentions": []
    },
    {
     "id": "c2-b35",
     "text": "J’ai regardé ma montre. Le petit cadran disait une heure quarante du matin. Le grand disait : le lendemain, sept heures moins dix du soir. Il avait fait, depuis mon départ, presque un tour et demi de plus que le petit. Je l’ai vu avancer. Je veux dire que je l’ai vu, vraiment, pour la première fois, bouger sous mes yeux comme une trotteuse : la grande aiguille du second cadran, celle que j’avais réglée sur ton heure, qui glissait, lentement mais visiblement, pendant que la mienne ne bougeait pas. Pendant que je mangeais ma soupe, tu avais vécu une journée. Tu avais pris ton petit déjeuner chez ton père, tu étais allée au lycée, tu avais peut-être ri avec quelqu’un. Tu avais peut-être pleuré. Je n’en saurais jamais rien. C’était une journée entière de toi, Nine, et je ne l’avais pas vue passer, sauf sous la forme d’une aiguille.",
     "mentions": [
      "nine",
      "double-montre"
     ]
    },
    {
     "id": "c2-b36",
     "text": "— Ça va plus vite quand on regarde, a dit une petite voix derrière moi.",
     "mentions": []
    },
    {
     "id": "c2-b37",
     "text": "Capucine était debout dans sa chemise de nuit, pieds nus sur la terre battue. Elle regardait la montre à mon poignet.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c2-b38",
     "text": "— Non, ai-je dit. Ça va à la même vitesse. On le voit, c’est tout.",
     "mentions": []
    },
    {
     "id": "c2-b39",
     "text": "— Est-ce que ma maman va vieillir pendant que je dors ?",
     "mentions": []
    },
    {
     "id": "c2-b40",
     "text": "J’ai pensé à mentir. J’ai pensé à lui dire qu’on n’était qu’aux Granges, qu’ici ce n’était rien, trois fois, une broutille. Mais je venais de voir passer ta journée.",
     "mentions": [
      "les-granges"
     ]
    },
    {
     "id": "c2-b41",
     "text": "— Un peu, ai-je dit. Là-haut, plus.",
     "mentions": []
    },
    {
     "id": "c2-b42",
     "text": "— Alors je ne veux pas dormir.",
     "mentions": []
    },
    {
     "id": "c2-b43",
     "text": "— Il faudra bien, pourtant.",
     "mentions": []
    },
    {
     "id": "c2-b44",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c2-b45",
     "text": "Elle s’est assise à côté de moi sur le banc, sous la fenêtre, et elle a regardé Aval avec moi. Elle cherchait la tannerie de sa mère. Elle l’a trouvée, ou elle a cru la trouver, à une fumée. Elle a tenu vingt minutes. Puis elle s’est endormie contre mon épaule, avec son manteau rouge par-dessus sa chemise de nuit, et elle a toussé dans son sommeil, un petit bruit sec, comme on fait craquer une coquille de noix.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c2-b46",
     "text": "Orso était assis de l’autre côté de la grange, contre un ballot de foin. Je croyais qu’il dormait. Il ne dormait pas.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c2-b47",
     "text": "— Demain soir, nous serons au Pas, a-t-il dit à voix basse. Il faut que je vous parle de votre montre.",
     "mentions": [
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c2-b48",
     "text": "— Elle est bien cachée.",
     "mentions": []
    },
    {
     "id": "c2-b49",
     "text": "— Elle est très bien cachée. Et ils vont la prendre.",
     "mentions": []
    },
    {
     "id": "c2-b50",
     "text": "Je me suis retournée. Il ne bougeait pas. Je ne voyais de lui que le bout rouge de sa pipe.",
     "mentions": []
    },
    {
     "id": "c2-b51",
     "text": "— Depuis la souche, ils ouvrent tout ce qui a un fond, madame. Les boîtes à bijoux, les talons, les boutons de manchettes. Les montres, ils ne les ouvrent pas au guichet, ils n’ont pas l’outillage. Ils les saisissent. Tout objet d’Aval de moins de cinquante ans est saisi, et votre montre a combien ?",
     "mentions": [
      "aval",
      "souche-desquerre"
     ]
    },
    {
     "id": "c2-b52",
     "text": "— Dix-neuf.",
     "mentions": []
    },
    {
     "id": "c2-b53",
     "text": "— Voilà.",
     "mentions": []
    },
    {
     "id": "c2-b54",
     "text": "Je n’avais pas pensé à ça. Je fabrique des doubles montres depuis vingt ans, j’en ai vendu à la moitié des marchands qui montent aux Granges, et je ne connaissais pas la règle des cinquante ans, parce que mes clients s’arrêtent tous en dessous de l’Écluse. Ta mère, Nine, avait caché la seule chose qui comptait dans le seul objet que les douaniers étaient certains de lui prendre.",
     "mentions": [
      "nine",
      "les-granges",
      "double-montre"
     ]
    },
    {
     "id": "c2-b55",
     "text": "— Alors je la cache ailleurs. Dans mes cheveux. Dans…",
     "mentions": []
    },
    {
     "id": "c2-b56",
     "text": "— Ils fouillent les cheveux. Ils fouillent tout, depuis deux ans. Laissez-la dans la montre.",
     "mentions": []
    },
    {
     "id": "c2-b57",
     "text": "— Pour qu’ils la prennent ?",
     "mentions": []
    },
    {
     "id": "c2-b58",
     "text": "— Pour qu’ils la prennent. Les objets saisis vont au Greffe des Saisies, derrière la douane. Le Greffe ouvre les fonds le jeudi. Nous arriverons lundi soir, de chez eux. Il reste deux nuits.",
     "mentions": [
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c2-b59",
     "text": "— Et le Greffe, vous le connaissez ?",
     "mentions": []
    },
    {
     "id": "c2-b60",
     "text": "Il a tiré sur sa pipe. Le bout rouge a grossi, puis diminué.",
     "mentions": []
    },
    {
     "id": "c2-b61",
     "text": "— Je connais tout ce qui est au-dessus des Granges, madame. C’est tout ce qui me reste.",
     "mentions": [
      "les-granges"
     ]
    },
    {
     "id": "c2-b62",
     "text": "Il s’est tu un moment. En bas, le Palace s’est éteint une deuxième fois. Tu dormais, là-dessous. Ou tu ne dormais pas. Tu avais quatorze ans et presque deux jours de plus que lorsque j’étais partie.",
     "mentions": []
    },
    {
     "id": "c2-b63",
     "text": "— Dormez, a dit Orso. Vous en aurez besoin. Et ne regardez pas trop votre second cadran. Tiens bon la rampe.",
     "mentions": [
      "orso-lebreuil",
      "double-montre",
      "les-lettres"
     ]
    },
    {
     "id": "c2-b64",
     "text": "J’ai fermé les yeux. J’ai entendu, très loin, le carillon de la Halle sonner minuit, et il m’est arrivé aigu et pressé, comme une boîte à musique qu’on remonte trop fort : un minuit de grelots, un minuit pour poupées. Je me suis endormie en le comptant. Je n’ai pas pensé, à ce moment-là, qu’Orso venait d’employer la même expression que ma mère. Ou j’y ai pensé, et je me suis dit que là-haut, tout le monde parlait comme ça. Tu vois : on se trouve toujours une explication, quand on est fatigué.",
     "mentions": []
    }
   ]

  {
   "id": "chapitre-3",
   "number": 3,
   "title": "Le musée de ce qui n’est pas monté",
   "blocks": [
    {
     "id": "c3-b01",
     "text": "On ne voit pas le Pas de l’Écluse avant d’y être. Le chemin quitte les Granges par une forêt de mélèzes, grimpe dans des éboulis où l’on marche sur des pierres qui sonnent creux, puis s’engage dans une gorge si étroite qu’il faut lever la tête pour voir le ciel. Et au bout de la gorge, il y a un mur.",
     "mentions": [
      "les-granges",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c3-b02",
     "text": "C’est l’Écluse. On l’appelle ainsi parce qu’elle sépare deux niveaux, comme celles des canaux : en dessous, le temps d’Aval, à peine ralenti ; au-dessus, le temps des hauteurs, où chaque pas coûte davantage. Le mur ferme la gorge d’une paroi à l’autre, en blocs de granit gros comme des armoires, et il est percé d’une seule porte. Au-dessus de la porte, gravée dans le linteau, en lettres que trois siècles n’ont pas usées parce que pour elles il ne s’en est pas passé trente ans : RIEN DE RAPIDE NE MONTE.",
     "mentions": [
      "aval",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c3-b03",
     "text": "Nous y sommes arrivés à la fin de l’après-midi de ma montre. Je dis de ma montre parce qu’à partir de l’Écluse, il n’y a plus d’après-midi pour personne d’autre. La cote y est de dix. Le soleil traverse le ciel en un peu plus d’une heure. En montant les derniers lacets, j’ai vu l’ombre d’une borne de pierre tourner autour d’elle comme l’aiguille d’une horloge, et le temps de boire à ma gourde, elle avait avancé d’un quart de cadran. Les douaniers ne regardent pas le ciel. Ils vivent à la cloche, comme à l’Hospice. Leur cloche sonne toutes les heures de leur temps, et entre deux coups, à Aval, une demi-journée passe.",
     "mentions": [
      "hospice-longue-veille",
      "la-cote"
     ]
    },
    {
     "id": "c3-b04",
     "text": "Il y avait une file devant la porte. Une vingtaine de personnes, assises sur leurs bagages dans la poussière : deux veilleuses de louage avec leurs petits, que j’ai reconnues à leur façon de tenir l’enfant comme un paquet qu’on vous a confié ; un couple de paysans des Granges qui montaient une vache ; un porteur de pensions, les poches cousues, suant sous un sac de pièces ; et un homme en habit noir, avec un col qui montait jusqu’aux oreilles, que tout le monde laissait passer devant. Un intendant des Lents, m’a soufflé Orso. Il redescend chaque année d’Aval pour placer leur argent et remonte avec les intérêts. Il n’a pas fait la queue. On ne fait pas la queue devant quelqu’un qui porte trois siècles de rente dans une serviette.",
     "mentions": [
      "veilleuses",
      "les-lents",
      "pension-daltitude"
     ]
    },
    {
     "id": "c3-b05",
     "text": "Pendant que nous attendions, j’ai vu la femme au soupirail.",
     "mentions": [
      "madame-morand"
     ]
    },
    {
     "id": "c3-b06",
     "text": "Il y a, dans la façade de la douane, à hauteur de genou, une rangée de soupiraux à barreaux. Derrière l’un d’eux, il y avait un visage. Une femme d’une trentaine d’années, les cheveux défaits, les mains accrochées aux barreaux. Elle ne criait pas. Elle regardait la file, un par un, comme on cherche quelqu’un dans une foule à la gare. Je me suis approchée, je ne sais pas pourquoi. Orso a fait un geste pour me retenir, puis il m’a laissée.",
     "mentions": []
    },
    {
     "id": "c3-b07",
     "text": "— Madame, a-t-elle dit quand je me suis accroupie. Quel jour on est, en bas ?",
     "mentions": []
    },
    {
     "id": "c3-b08",
     "text": "— Le vingt-quatre septembre.",
     "mentions": []
    },
    {
     "id": "c3-b09",
     "text": "Elle a fermé les yeux. Elle a compté, les lèvres en mouvement.",
     "mentions": []
    },
    {
     "id": "c3-b10",
     "text": "— Mon fils a eu ses dix ans en août, a-t-elle dit. Je lui avais promis d’être là. Je l’ai cousue dans sa doublure, la fiole. Ils l’ont trouvée tout de suite. Tout de suite. Ils ont ri.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c3-b11",
     "text": "C’était elle. La mère dont m’avait parlé Esquerre. Pour elle, douze jours. Pour son fils, quatre mois, un anniversaire, une rentrée des classes, les premiers froids.",
     "mentions": [

     ]
    },
    {
     "id": "c3-b12",
     "text": "— Qu’est-ce qu’ils vont vous faire ?",
     "mentions": []
    },
    {
     "id": "c3-b13",
     "text": "— Le cachot jusqu’au jugement. Le jugement, c’est à la Saint-Martin de chez eux. Vous savez quand ça tombe, chez vous, la Saint-Martin de chez eux ?",
     "mentions": []
    },
    {
     "id": "c3-b14",
     "text": "Je savais. Je fais des tables de cote depuis vingt ans. Leur Saint-Martin tombait dans quatre mois de leur temps. Pour son fils, dans trois ans et quatre mois. Il aurait treize ans quand elle saurait si elle était condamnée.",
     "mentions": [
      "la-cote"
     ]
    },
    {
     "id": "c3-b15",
     "text": "Je ne le lui ai pas dit. Je ne lui ai rien dit, je crois. Je lui ai touché les doigts à travers les barreaux et je suis retournée dans la file, et ma montre battait sourd contre mon poignet, avec sa fiole au ventre, et j’avais l’impression que tout le Pas l’entendait.",
     "mentions": [
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c3-b16",
     "text": "Quand notre tour est venu, la cloche de la douane a sonné six heures. Là-dessous, à Aval, tu avais eu le temps de vivre presque six jours depuis mon départ.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c3-b17",
     "text": "La visiteuse s’appelait Adrienne Coquard. C’était écrit sur une plaque de cuivre, sur son pupitre, dans une écriture de notaire. Elle avait une soixantaine d’années, un chignon gris tiré à faire mal, une loupe d’horloger vissée dans l’orbite gauche et des manchettes de lustrine noire. Elle sentait le tabac à priser. Elle ne levait jamais les yeux plus haut que les mains des gens. Je l’ai vue faire avec les autres. Elle ne fouillait pas : elle lisait. Une valise, un manteau, un corps, elle les lisait comme on lit un registre, ligne à ligne, et elle trouvait. Au porteur de pensions, elle a fait découdre une poche et en a sorti une lettre non déclarée. À la veilleuse devant nous, elle a pris un flacon d’eau de Cologne d’Aval, marque de l’an dernier. « Rapide », a-t-elle dit, et le flacon est parti dans un panier d’osier derrière elle, avec une étiquette.",
     "mentions": [
      "adrienne-coquard",
      "edit-de-lecluse",
      "pension-daltitude"
     ]
    },
    {
     "id": "c3-b18",
     "text": "Puis c’est la valise de Capucine qui est passée.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c3-b19",
     "text": "Elle a sorti le gâteau de sa mère, l’a posé sur une planche et l’a coupé en seize. Proprement, avec un couteau à papier, en regardant chaque tranche à la loupe. Capucine a ouvert la bouche. Orso lui a posé la main sur l’épaule. Puis la visiteuse a sorti les livres. Il y en avait trois. Deux vieux albums qui avaient été ceux de sa grand-mère, et un roman d’aventures tout neuf, avec une couverture illustrée : un aéroplane au-dessus d’une jungle. La visiteuse a ouvert le roman à la page de garde, a lu l’année d’impression, et l’a mis dans le panier.",
     "mentions": [

    {
     "id": "c3-b20",
     "text": "— Rapide, a-t-elle dit.",

     "id": "c3-b21",
     "text": "— C’est un livre, a dit Capucine.",
     "mentions": []
    },
    {
     "id": "c3-b22",
     "text": "— Il a trois ans d’Aval, mademoiselle. Au-dessus du Pas, on ne lit rien qui ait moins de cinquante ans. Vous le récupérerez en redescendant.",
     "mentions": [
      "aval",

     "id": "c3-b23",
     "text": "— Je ne redescendrai pas avant trois cents ans !",

     "id": "c3-b24",
     "text": "— Alors il vous attendra. Le papier se conserve très bien, ici. Suivante.",

    {
     "id": "c3-b25",
     "text": "La suivante, c’était moi. Mon sac d’abord : les vêtements, la trousse de toilette, mon nécessaire de voyage, qu’elle a déroulé sur son pupitre. Tournevis, brucelles, loupe, huile, burin. Elle a pris le burin entre deux doigts et l’a regardé à la lumière de la fenêtre. Puis elle a regardé mes mains. C’était la première fois qu’elle levait les yeux vers quelqu’un, et elle ne les a pas levés beaucoup plus haut que mes poignets.",
     "mentions": []
    },
    {
     "id": "c3-b26",
     "text": "— Veilleuse de louage, a-t-elle lu sur mes papiers.",
     "mentions": []
    },
    {
     "id": "c3-b27",
     "text": "— Oui, madame.",
     "mentions": []
    },
    {
     "id": "c3-b28",
     "text": "— Vous avez des mains d’horlogère.",
     "mentions": []
    },
    {
     "id": "c3-b29",
     "text": "— J’ai été horlogère. Ça ne nourrit plus.",
     "mentions": []
    },
    {
     "id": "c3-b30",
     "text": "— À Aval, ça nourrit très bien, a-t-elle dit. On ne s’est jamais autant soucié de l’heure. Montrez-moi votre poignet.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c3-b31",
     "text": "Je l’ai tendu. Elle a regardé la montre longtemps, sans la toucher. Elle a lu le cadran, puis le second, puis la marque, minuscule, sous le chiffre six.",
     "mentions": []
    },
    {
     "id": "c3-b32",
     "text": "— Ferrand, a-t-elle dit. Rue des Cadrans. J’en ai saisi six cette année. Belles pièces. Il y a une Ferrand à l’Hospice, vous savez ? Une veilleuse. Depuis longtemps.",
     "mentions": [
      "hospice-longue-veille",
      "veilleuses"
     ]
    },
    {
     "id": "c3-b33",
     "text": "— C’est un nom courant.",
     "mentions": []
    },
    {
     "id": "c3-b34",
     "text": "— Pas tant que ça.",
     "mentions": []
    },
    {
     "id": "c3-b35",
     "text": "Elle a attendu. Je n’ai rien ajouté. Il y a des silences qui sont des aveux et d’autres qui sont des murs, et je ne sais pas lequel j’ai fait ce jour-là. Elle a dévissé sa loupe, l’a essuyée sur sa manchette, l’a revissée.",
     "mentions": []
    },
    {
     "id": "c3-b36",
     "text": "— Vous connaissez la règle, madame. Tout objet d’Aval de moins de cinquante ans. Votre montre en a combien ?",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c3-b37",
     "text": "— Dix-neuf.",
     "mentions": []
    },
    {
     "id": "c3-b38",
     "text": "— Elle a été faite pour vos vingt ans, alors, a-t-elle dit, et c’était une question, et je n’y ai pas répondu non plus. Je la saisis. Vous signerez le registre. Le Greffe ouvre les fonds le jeudi, pour vérifier qu’il n’y a rien dedans. S’il n’y a rien dedans, vous pourrez la réclamer à la descente.",
     "mentions": [
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c3-b39",
     "text": "J’ai débouclé le bracelet. J’ai eu du mal. Mes doigts ne voulaient pas. Elle a pris la montre par le bracelet, comme on prend une souris par la queue, et elle l’a posée dans le panier d’osier, à côté du roman de Capucine et du flacon d’eau de Cologne, et elle a écrit une étiquette : n° 4 417, montre double, laiton, Ferrand. J’ai signé le registre. Elle m’a tendu un récépissé. Je l’ai encore. Il est dans le tiroir de gauche de mon établi, si tu veux le voir.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c3-b40",
     "text": "Le Pas de l’Écluse n’est pas qu’une douane. Derrière le mur, la gorge s’élargit, et il y a tout un petit bourg : la caserne des douaniers, une chapelle, deux auberges, des écuries pour les mulets de la route longue, et, creusé dans la paroi nord, le Greffe des Saisies. Nous avons pris une chambre à l’auberge du Seuil. Capucine n’a rien dit pendant le repas. Elle a mangé sa soupe avec une concentration de condamnée. Au dessert, elle a posé sa cuillère.",
     "mentions": [
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c3-b41",
     "text": "— Je veux mon livre.",
     "mentions": []
    },
    {
     "id": "c3-b42",
     "text": "— Moi aussi, j’ai dit. Enfin, je veux ma montre.",
     "mentions": []
    },
    {
     "id": "c3-b43",
     "text": "Orso a regardé l’une, puis l’autre. Il a eu un petit sourire sous sa moustache, le premier que je lui voyais.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c3-b44",
     "text": "— Mesdames, a-t-il dit, vous êtes du même avis. Il n’y a donc pas à voter.",
     "mentions": []
    },
    {
     "id": "c3-b45",
     "text": "Il nous a expliqué le Greffe pendant que la nuit tombait. La nuit, au Pas, ça ne traîne pas : le soleil a glissé derrière l’arête ouest pendant qu’il bourrait sa pipe, et le temps qu’il l’allume, il faisait noir. Le Greffe, c’est une salle voûtée creusée dans le rocher, longue comme une église, où l’on range depuis trois siècles tout ce qui a été saisi au Pas. Une seule porte, sur la cour. Une serrure. Un garde de nuit, qui fait sa ronde dans la cour avec une lanterne quand il fait noir, et qui reste dans sa guérite quand il fait jour, parce que de jour, on voit tout, depuis la caserne. Il fallait donc faire vite, et faire dans le noir.",
     "mentions": [
      "pas-de-lecluse",
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c3-b46",
     "text": "— Combien de temps dure la nuit, ici ? ai-je demandé.",
     "mentions": []
    },
    {
     "id": "c3-b47",
     "text": "— Ça dépend de la saison d’en bas.",
     "mentions": []
    },
    {
     "id": "c3-b48",
     "text": "— Fin septembre.",
     "mentions": []
    },
    {
     "id": "c3-b49",
     "text": "— Une heure dix, une heure et quart, de chez nous.",
     "mentions": []
    },
    {
     "id": "c3-b50",
     "text": "J’ai fait le calcul à voix haute, parce que c’est comme ça que je pense. Les nuits de fin septembre, à Aval, font douze heures environ. Divisé par dix : une heure et douze minutes. Pendant une heure et douze minutes, la cour du Greffe serait noire. Ensuite, il ferait jour pendant presque autant, et puis de nouveau noir. Nous avions, jusqu’à jeudi, une vingtaine de nuits d’Aval pour le faire. Une vingtaine de fois une heure et douze minutes.",
     "mentions": [
      "aval",
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c3-b51",
     "text": "— La serrure ? ai-je demandé.",
     "mentions": []
    },
    {
     "id": "c3-b52",
     "text": "— Vieille. Plus vieille que moi.",
     "mentions": []
    },
    {
     "id": "c3-b53",
     "text": "— Alors c’est une serrure à gorges. Ça, je sais faire.",
     "mentions": []
    },
    {
     "id": "c3-b54",
     "text": "— Je m’en doutais un peu, a dit Orso. Le garde, c’est Mathurin. Je le connais depuis qu’il a vingt ans. Il en a soixante. Il aime l’eau-de-vie de gentiane et les histoires du temps d’avant, et il n’y a plus personne ici pour lui en raconter, à part moi. Je lui en raconterai.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c3-b55",
     "text": "— Et moi ? a demandé Capucine.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c3-b56",
     "text": "— Vous, mademoiselle, vous dormez.",
     "mentions": []
    },
    {
     "id": "c3-b57",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c3-b58",
     "text": "— Vous faites le guet, alors. De la fenêtre. Si la lanterne de la caserne s’allume, vous toussez. Fort. Vous savez tousser fort ?",
     "mentions": []
    },
    {
     "id": "c3-b59",
     "text": "Capucine l’a regardé comme on regarde un adulte qui vient de dire une énormité.",
     "mentions": []
    },
    {
     "id": "c3-b60",
     "text": "— Je ne sais faire que ça, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c3-b61",
     "text": "Nous avons attendu que la nuit revienne. Elle est revenue vers dix heures de ma montre — pardon, de la montre d’Orso, puisque je n’en avais plus. C’est lui qui m’a prêté la sienne, le boîtier d’argent de ton grand-père. Je l’ai tenue dans ma main tout le temps que ça a duré, comme on tient la main de quelqu’un. Le soleil est tombé derrière l’arête, l’ombre a couru dans la gorge comme de l’eau qu’on lâche, et Orso est sorti avec une bouteille sous le manteau. Je l’ai entendu frapper à la guérite. J’ai entendu la voix de Mathurin, surprise, puis contente. J’ai entendu Orso commencer une histoire qui débutait par « Du temps où l’on montait encore les cloches à dos d’homme ».",
     "mentions": [
      "orso-lebreuil",
      "jules-ferrand"
     ]
    },
    {
     "id": "c3-b62",
     "text": "J’ai traversé la cour en longeant le mur.",
     "mentions": []
    },
    {
     "id": "c3-b63",
     "text": "La porte du Greffe est en chêne, cloutée, avec une serrure grosse comme un missel. J’ai mis quatre minutes. Une serrure à gorges, c’est une suite de petites lames qu’il faut soulever à la bonne hauteur, toutes ensemble, pendant qu’on tourne le pêne. C’est un mouvement de montre, en plus gros et plus bête. Ton grand-père m’avait appris sur celle de la cave. Tu vois, finalement, ça sert.",
     "mentions": [
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c3-b64",
     "text": "Dedans, il faisait froid comme dans un puits. J’ai allumé la bougie que j’avais apportée. Et j’ai vu le musée.",
     "mentions": []
    },
    {
     "id": "c3-b65",
     "text": "Je ne sais pas comment te le décrire autrement. Des étagères, sur toute la longueur de la voûte, de chaque côté, jusqu’au plafond, avec des échelles. Et sur les étagères, rangé par années, étiqueté, tout ce que la montagne avait refusé depuis trois cents ans. Au fond, les plus anciennes saisies : des objets que je ne reconnaissais même pas, en bois et en fer forgé, un rouet à pédale, une charrue à versoir d’acier, des lunettes à branches, un almanach. Puis, en revenant vers la porte, à mesure que les étiquettes rajeunissaient, le monde qui arrivait. Des lampes à huile. Des pistolets à silex, puis à percussion. Une machine à coudre. Un vélocipède à grande roue, pendu à deux crochets. Un phonographe avec son pavillon. Des appareils photographiques. Des boîtes de conserve, par centaines. Une machine à écrire. Des postes de radio, comme le tien, et plus récents que le tien. Tout ce qu’on avait voulu monter pour vivre un peu mieux là-haut, et que l’Écluse avait gardé pour que là-haut rien ne change. Trois siècles d’avenir, empilés dans le froid, avec des étiquettes à l’encre violette. Rapide. Rapide. Rapide.",
     "mentions": [
      "pas-de-lecluse",
      "les-revenants",
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c3-b66",
     "text": "Et puis, sur l’avant-dernière étagère avant la porte, j’ai vu les fioles.",
     "mentions": []
    },
    {
     "id": "c3-b67",
     "text": "Il y en avait une quarantaine. Alignées dans des casiers de bois, bouchées de cire, avec leurs étiquettes. Fiole, souche d’Esquerre, saisie sur une mère. Fiole, saisie dans une doublure. Fiole, saisie dans un talon. Le liquide était clair. La souche vivante est trouble, couleur de petit-lait ; celle-là était claire comme de l’eau. Le froid la tue, avait dit Esquerre. Le Greffe est le lieu le plus froid du Pas. Quarante fioles. Quarante enfants, là-haut, qui attendaient ce qui dormait mort ici, à deux jours de marche. J’ai pris la dernière du casier, celle de la femme au soupirail, j’imagine, et je l’ai regardée à la bougie. Rien ne bougeait dedans. Je l’ai reposée.",
     "mentions": [
      "pauline-esquerre",
      "madame-morand",
      "souche-desquerre"
     ]
    },
    {
     "id": "c3-b68",
     "text": "Ma montre était dans le panier des arrivages du jour, par terre, près de la porte, avec le roman de Capucine et le flacon d’eau de Cologne. Je l’ai reconnue au toucher avant de la voir. J’ai dévissé le fond. La fiole était là, dans son coton, tiède encore de mon poignet, trouble. Vivante. J’ai revissé. J’ai pris le roman.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c3-b69",
     "text": "J’aurais dû ressortir tout de suite. Je ne l’ai pas fait. Sur le pupitre du greffier, il y avait le grand registre des passages, ouvert, et je n’ai pas pu m’en empêcher. J’ai remonté les pages à la bougie. C’est facile : chaque page est datée des deux calendriers, celui d’en bas et celui d’ici. Je les ai trouvés. Ferrand, Hélène, trente-deux ans, veilleuse. Ferrand, Tobie, sept ans, suspendu, calcine. Passeur : O. Lebreuil. La date de mes douze ans et quatre mois. L’écriture n’était pas celle de la visiteuse : quelqu’un d’autre, avant elle. Et dans la marge, d’une autre main, bien plus tard : « Lebreuil, 212e passage ». J’ai regardé ce nombre longtemps. Deux cent douze fois ce mur. Je n’avais jamais pensé qu’Orso avait un nombre.",
     "mentions": [
      "helene-ferrand",
      "calcine",
      "les-suspendus"
     ]
    },
    {
     "id": "c3-b70",
     "text": "Dehors, Capucine a toussé.",
     "mentions": []
    },
    {
     "id": "c3-b71",
     "text": "Pas sa toux de coquille de noix. Une toux énorme, une toux de marchande de poissons, qui a rebondi dans la gorge du Pas comme un coup de fusil. J’ai soufflé la bougie. Par la fente de la porte, j’ai vu la cour : toujours noire, mais au-dessus de l’arête est, le ciel avait commencé à pâlir. Pas la lanterne de la caserne. Le jour. J’avais perdu le compte. J’avais passé dix-huit minutes à lire un registre, et à Aval, pendant ces dix-huit minutes, il s’était écoulé trois heures, et la nuit de fin septembre touchait à sa fin.",
     "mentions": [
      "aval",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c3-b72",
     "text": "Je suis sortie. J’ai refermé la serrure — c’est plus long que de l’ouvrir, on n’y pense jamais. Le ciel blanchissait à vue d’œil, comme une page qu’on éclaire. À la guérite, Orso en était au moment de son histoire où la cloche tombe dans le ravin. J’ai longé le mur. Le soleil a touché le haut de la paroi ouest au moment où je poussais la porte de l’auberge, et la cour derrière moi est devenue d’un coup visible jusqu’au dernier pavé, comme sur une photographie.",
     "mentions": []
    },
    {
     "id": "c3-b73",
     "text": "Capucine m’attendait dans l’escalier. Je lui ai donné son livre. Elle l’a serré contre elle et n’a pas dit merci. Elle a dit :",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c3-b74",
     "text": "— Tu es en retard.",
     "mentions": []
    },
    {
     "id": "c3-b75",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c3-b76",
     "text": "— J’ai toussé exprès. Enfin, pas tout à fait exprès. Un peu.",
     "mentions": []
    },
    {
     "id": "c3-b77",
     "text": "Orso est rentré un quart d’heure plus tard, de sa démarche de toujours, en sentant la gentiane. Il a regardé mon poignet, où la montre avait repris sa place, puis le livre dans les bras de Capucine.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c3-b78",
     "text": "— Le Greffe ouvre les fonds jeudi, a-t-il dit. Mais la visiteuse, je la connais. Elle ne dort pas bien quand elle a un nom en tête. Nous partons à la prochaine nuit.",
     "mentions": [
      "adrienne-coquard",
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c3-b79",
     "text": "Nous sommes partis à la suivante. Je dis la suivante, mais il n’a fallu attendre qu’une heure : le jour est passé sur le Pas comme un nuage. Quand l’ombre est retombée, nous étions sur le chemin, au-dessus du bourg, dans les premiers lacets de la route de l’Échine, celle que ne prennent pas les mulets. Je me suis retournée une seule fois. Dans la cour du Greffe, en bas, une lanterne traversait les pavés, tenue haut, à pas pressés, par une silhouette au chignon serré. Elle s’est arrêtée devant la porte cloutée. Elle est restée longtemps. Puis la cloche de la douane s’est mise à sonner, pas l’heure : une volée, un carillon d’alarme, qui nous est monté aux oreilles déjà un peu trop aigu, un peu trop pressé, comme si l’Écluse elle-même avait peur.",
     "mentions": [
      "pas-de-lecluse",
      "lechine"
     ]
    },
    {
     "id": "c3-b80",
     "text": "— Voilà, a dit Orso sans se retourner. Maintenant, on ne s’arrête plus.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-4",
   "number": 4,
   "title": "Le ciel qui bat",
   "blocks": [
    {
     "id": "c4-b01",
     "text": "Au-dessus du Pas, le ciel se met à battre.",
     "mentions": [
      "pas-de-lecluse",
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c4-b02",
     "text": "Je ne sais pas le dire autrement, et ceux qui montent là-haut n’ont pas d’autre mot. À l’Écluse, on voit encore des jours : courts, pressés, mais des jours, avec un matin, un midi, un soir. Deux heures de marche plus haut, les jours raccourcissent jusqu’à ne plus être que des respirations. Le soleil se lève derrière l’arête est, file au-dessus de vous comme une pierre qu’on lance et plonge derrière l’arête ouest, et la nuit tombe, et le temps de chercher la lune, le soleil est déjà revenu. Plus on monte, plus ça va vite. Clair, sombre, clair, sombre. Un pouls. Le ciel au-dessus de l’Échine bat comme une artère sous le doigt, et on marche dedans.",
     "mentions": [
      "lechine"
     ]
    },
    {
     "id": "c4-b03",
     "text": "Nous avons marché près de trois jours de ma montre dans ce battement. Le chemin, au-dessus du Pas, s’élève en lacets dans un pierrier, puis rejoint la crête qu’on appelle l’Échine : une lame de rocher, longue de plusieurs lieues, qui monte du Pas jusqu’au pied de la falaise de l’Hospice. D’un côté, le vide sur la gorge. De l’autre, le vide sur la plaine. Au milieu, un sentier de la largeur d’une chaise, et des chaînes scellées dans la roche aux endroits où même les passeurs mettent les mains.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c4-b04",
     "text": "Je voudrais te décrire la lune, parce que tu aimes la lune. Je l’ai vue traverser le ciel en un quart d’heure, une nuit sur deux, pendant les nuits qui duraient ce qu’il faut pour fumer une pipe. Elle roulait sur la crête d’en face comme une pièce qu’un enfant fait rouler sur une table. Et d’une nuit à l’autre, elle changeait. Je l’ai vue pleine, puis entamée, puis réduite à un ongle, puis disparue, puis revenue de l’autre côté, en une seule journée de marche. Un mois de lune entre le petit déjeuner et le souper. Là-dessous, à Aval, un mois d’école. Tu avais eu le temps, pendant que je tenais une chaîne et que je ne regardais pas en bas, d’avoir une note, un chagrin, un rhume.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c4-b05",
     "text": "Et puis il y a eu l’automne.",
     "mentions": []
    },
    {
     "id": "c4-b06",
     "text": "Nous étions partis d’Aval à la mi-septembre. Au Pas, les mélèzes commençaient à roussir. Sur l’Échine, en une journée de ma montre, je les ai vus, en contrebas, dans le versant de la gorge, virer au jaune, puis à l’or, puis à la rouille, comme une allumette qui se consume, puis perdre leurs aiguilles d’un coup, toutes ensemble, dans un souffle de vent qui a fait monter jusqu’à nous une fumée dorée. Des vols d’oiseaux passaient au-dessus de la plaine, vers le sud, si vite qu’on aurait dit des traînées d’encre. Les hêtres de la plaine, que je voyais en bas, se sont dénudés le temps d’une halte. L’automne entier nous est passé dessus en une journée. Je n’avais jamais rien vu d’aussi beau. Je n’avais jamais rien vu d’aussi effrayant. Parce que c’était ton automne, Nine. Le seul que tu aurais à quatorze ans.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c4-b07",
     "text": "Capucine, elle, était ravie. Elle marchait devant, entre Orso et moi, encordée à nous deux, et elle commentait.",
     "mentions": [
      "orso-lebreuil",
      "capucine-rigal"
     ]
    },
    {
     "id": "c4-b08",
     "text": "— Là, c’est novembre, a-t-elle annoncé à un moment, en montrant les premiers flocons sur les sommets d’en face.",
     "mentions": []
    },
    {
     "id": "c4-b09",
     "text": "— Comment tu sais ?",
     "mentions": []
    },
    {
     "id": "c4-b10",
     "text": "— Il neige sur le Crêt de la Dame. À la maison, quand il neige sur le Crêt de la Dame, maman sort les édredons. C’est toujours en novembre.",
     "mentions": []
    },
    {
     "id": "c4-b11",
     "text": "Elle avait raison. J’ai regardé le second cadran. Il marquait le deux novembre. Sur le petit, onze heures du matin, notre deuxième jour depuis le Pas. Elle est restée silencieuse un moment. Puis elle a dit, sans se retourner :",
     "mentions": [
      "pas-de-lecluse",
      "double-montre"
     ]
    },
    {
     "id": "c4-b12",
     "text": "— Maman a sorti les édredons.",
     "mentions": []
    },
    {
     "id": "c4-b13",
     "text": "Et elle n’a plus rien dit pendant une heure.",
     "mentions": []
    },
    {
     "id": "c4-b14",
     "text": "À midi de ma montre, Orso s’est arrêté et a regardé l’ouest. Je n’ai rien vu d’abord. Le ciel battait, comme toujours, clair, sombre, clair. Puis j’ai compris qu’il ne regardait pas le ciel, mais le bas du ciel, au ras de la plaine : une barre grise, épaisse, qui avançait sur la vallée. Elle ne se déplaçait pas comme les nuages que je connaissais. Elle se déplaçait comme la marée qui monte dans un film accéléré : à vue d’œil, en roulant sur elle-même, en avalant les villages de la plaine l’un après l’autre.",
     "mentions": [
      "orso-lebreuil",
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c4-b15",
     "text": "— La première tempête de l’hiver, a dit Orso. Celle de chez vous. Elle dure deux ou trois jours, en bas, d’habitude.",
     "mentions": []
    },
    {
     "id": "c4-b16",
     "text": "— Et ici ?",
     "mentions": []
    },
    {
     "id": "c4-b17",
     "text": "— Ici, elle durera une heure. Et elle nous donnera toute sa neige.",
     "mentions": []
    },
    {
     "id": "c4-b18",
     "text": "J’ai compris ce qu’il voulait dire au moment où elle est arrivée. Une tempête de trois jours, c’est trois jours de neige, de vent, de froid. Ici, les trois jours tombent en une heure. Tout. Toute la neige de trois jours d’Aval, en une heure de la nôtre. La tempête ne nous a pas atteints : elle nous est tombée dessus, comme une armoire. Il y a eu d’abord un coup de vent qui m’a arraché mon bonnet, et puis le monde a disparu. Plus de ciel, plus de battement, plus de plaine. De la neige. De la neige à l’horizontale, épaisse, lourde, qui ne tombait pas en flocons mais en paquets, en draps, en murs. En quelques minutes, elle nous arrivait aux chevilles. En un quart d’heure, aux genoux. Je ne voyais plus Orso, à trois pas devant, que comme une tache sombre au bout de la corde.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c4-b19",
     "text": "— La Baume ! a-t-il crié. Deux cents pas !",
     "mentions": []
    },
    {
     "id": "c4-b20",
     "text": "Sa voix m’arrivait déformée, arrachée par le vent. J’ai tiré sur la corde. Capucine, entre nous, avait disparu dans le blanc. Je l’ai trouvée à tâtons. Elle ne marchait plus. Elle était à genoux dans la neige, penchée en avant, et elle essayait de respirer.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c4-b21",
     "text": "Je connaissais ce bruit. Je l’avais entendu toute une année quand j’avais douze ans, dans la chambre d’à côté, la nuit : le bruit de Tobie. Un sifflement, un raclement, et au bout, rien, pas d’air. Les poumons de calcine ne supportent pas le froid. Le sel se resserre. L’air ne passe plus.",
     "mentions": [
      "tobie-ferrand",
      "calcine"
     ]
    },
    {
     "id": "c4-b22",
     "text": "Je l’ai prise dans mes bras. Elle ne pesait rien. Orso est revenu en arrière le long de la corde, il a pris mon sac, et nous avons fait les deux cents pas. Je ne sais pas comment. Je me rappelle seulement le rocher, à la fin, une avancée noire au-dessus du sentier, et en dessous un creux sec, profond comme une petite chambre, où la neige n’entrait pas. La Baume des Passeurs. Orso y avait laissé du bois. Il a allumé un feu en moins d’une minute, avec des mains qui ne tremblaient pas. Moi, les miennes tremblaient tellement que je n’arrivais pas à défaire la corde.",
     "mentions": [
      "orso-lebreuil",
      "lechine"
     ]
    },
    {
     "id": "c4-b23",
     "text": "Capucine étouffait.",
     "mentions": []
    },
    {
     "id": "c4-b24",
     "text": "Orso a fait chauffer de l’eau dans une gamelle, y a jeté une poignée de résine de pin qu’il gardait dans une boîte, et lui a fait respirer la vapeur sous sa couverture. Ça a un peu aidé. Un peu. Elle a pris trois inspirations, sifflantes, puis ça s’est refermé. Elle me regardait. Elle avait les yeux énormes. Elle ne pleurait pas. Elle me regardait comme si j’étais une grande personne, c’est-à-dire quelqu’un qui peut quelque chose.",
     "mentions": []
    },
    {
     "id": "c4-b25",
     "text": "Et je pouvais quelque chose.",
     "mentions": []
    },
    {
     "id": "c4-b26",
     "text": "Je ne te raconterai pas combien de temps j’ai hésité, parce que je ne le sais pas. Je sais seulement ce que j’ai pensé. J’ai pensé : sept doses. Sept jours. Si j’en donne une, Tobie en aura six, et six, ce n’est pas sept, Esquerre l’a dit, ce n’est pas un médicament, c’est une bête, il lui faut ses sept jours. J’ai pensé : Tobie, c’est mon frère. J’ai pensé : je ne l’ai pas vu depuis vingt-sept ans, cette petite, je la connais depuis trois jours. Et j’ai pensé, très clairement, avec la voix de mon père : trois jours de chez toi, c’est trois mois de chez elle, tu la connais depuis trois mois, ma fille.",
     "mentions": [
      "tobie-ferrand",
      "pauline-esquerre",
      "jules-ferrand"
     ]
    },
    {
     "id": "c4-b27",
     "text": "J’ai dévissé le fond de ma montre.",
     "mentions": []
    },
    {
     "id": "c4-b28",
     "text": "L’aiguille, je l’avais. C’est une trousse d’horlogère, pas de médecin, mais il y a dedans une seringue de verre pour huiler les pivots, et je l’avais fait bouillir avant de partir, à tout hasard, en me disant que j’étais ridicule. J’ai rompu la cire. J’ai prélevé le septième de la fiole, à la graduation, en tenant le verre contre la flamme pour y voir. J’ai relevé la manche de Capucine. Orso m’a tenu le bras de la petite sans que j’aie à le lui demander. Je l’ai piquée. Elle n’a même pas crié. Elle était trop occupée à ne pas respirer.",
     "mentions": [
      "orso-lebreuil",
      "capucine-rigal",
      "souche-desquerre"
     ]
    },
    {
     "id": "c4-b29",
     "text": "Il a fallu dix minutes. Dix minutes de chez nous, ce qui faisait, en bas, six heures, et je les ai comptées toutes. Puis quelque chose s’est desserré. Je l’ai entendu avant de le voir : le sifflement a changé de note. Puis il a diminué. Puis elle a pris une inspiration, une vraie, longue, jusqu’au fond, et elle l’a lâchée dans un grand soupir, comme un enfant qui vient de pleurer, sauf qu’elle n’avait pas pleuré.",
     "mentions": []
    },
    {
     "id": "c4-b30",
     "text": "Elle a regardé la fiole dans ma main. Elle a regardé la montre ouverte sur mes genoux, avec son trou au milieu, là où aurait dû être le barillet. Elle avait neuf ans. Elle n’était pas bête.",
     "mentions": []
    },
    {
     "id": "c4-b31",
     "text": "— C’est le remède, a-t-elle dit. Celui du lavoir. Celui d’Esquerre.",
     "mentions": [
      "pauline-esquerre"
     ]
    },
    {
     "id": "c4-b32",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c4-b33",
     "text": "— Tu l’avais depuis le début.",
     "mentions": []
    },
    {
     "id": "c4-b34",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c4-b35",
     "text": "— Et tu m’as laissée monter.",
     "mentions": []
    },
    {
     "id": "c4-b36",
     "text": "Il n’y avait rien à répondre à ça non plus. Il faut croire que je collectionne, avec les filles de moins de quinze ans, les questions sans réponse.",
     "mentions": []
    },
    {
     "id": "c4-b37",
     "text": "— C’est pour mon frère, ai-je dit. Il est là-haut. Il est en train de mourir. Il n’y en a que pour un.",
     "mentions": []
    },
    {
     "id": "c4-b38",
     "text": "Elle a réfléchi. On voyait qu’elle réfléchissait : elle tirait sur une mèche de ses cheveux, au-dessus de l’oreille, comme tu le faisais à son âge. Dehors, la tempête hurlait, et la neige montait devant l’entrée de la Baume comme l’eau dans une baignoire.",
     "mentions": [
      "lechine"
     ]
    },
    {
     "id": "c4-b39",
     "text": "— Tu es comme maman, a-t-elle dit enfin. Non. Pire. Maman, elle ne l’avait pas.",
     "mentions": []
    },
    {
     "id": "c4-b40",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c4-b41",
     "text": "— Je ne dirai rien. À personne. Mais après ton frère, tu m’en donnes.",
     "mentions": []
    },
    {
     "id": "c4-b42",
     "text": "— Il n’y en aura plus.",
     "mentions": []
    },
    {
     "id": "c4-b43",
     "text": "— Tu m’en trouves.",
     "mentions": []
    },
    {
     "id": "c4-b44",
     "text": "Je lui ai promis. Je lui ai promis une chose que je ne pouvais pas tenir, les yeux dans les yeux, et elle m’a crue, parce qu’elle avait neuf ans et qu’on venait de lui rendre sa respiration. Puis elle s’est endormie, d’un coup, la tête sur mon sac, en respirant par la bouche, lentement, avec un petit bruit tout à fait ordinaire de petite fille qui dort.",
     "mentions": []
    },
    {
     "id": "c4-b45",
     "text": "La tempête est passée comme elle était venue : d’un coup. Il n’a pas fallu une heure. Le vent est tombé, la neige a cessé, et le ciel s’est remis à battre, clair, sombre, clair, au-dessus d’un monde entièrement blanc. Un hiver d’avance, a dit Orso. En bas, les jours raccourcissaient. En bas, tu avais sorti tes gants. Il a décidé que nous dormirions là. Pas longtemps. Le temps que la neige se tasse, que la petite reprenne des forces. Il a remis du bois. Il a sorti sa pipe. Et pour la première fois depuis Aval, il m’a parlé de lui sans que je le lui demande.",
     "mentions": [
      "orso-lebreuil",
      "aval"
     ]
    },
    {
     "id": "c4-b46",
     "text": "— Je suis né rue de la Tonnellerie, a-t-il dit. Vous savez où c’est ?",
     "mentions": []
    },
    {
     "id": "c4-b47",
     "text": "— Il n’y a pas de rue de la Tonnellerie à Aval.",
     "mentions": []
    },
    {
     "id": "c4-b48",
     "text": "— Il n’y en a plus. Il y en avait une. C’est là que sont les grands magasins, maintenant. Mon père faisait des tonneaux. J’avais six ans quand j’ai attrapé la fièvre bleue. Ça ne vous dit rien non plus, la fièvre bleue. On en mourait, de mon temps. On ne savait rien faire. On m’a monté à l’Hospice. L’ancien, celui d’avant l’incendie. Sans veilleuse : ma mère avait quatre autres enfants et un mari qui buvait. Un passeur m’a porté sur son dos. Je me souviens de son odeur. Il sentait le mulet.",
     "mentions": [
      "hospice-longue-veille",
      "veilleuses"
     ]
    },
    {
     "id": "c4-b49",
     "text": "Il a tiré sur sa pipe.",
     "mentions": []
    },
    {
     "id": "c4-b50",
     "text": "— Je suis resté là-haut cinq mois de mon temps. Quarante ans du vôtre. En bas, un médecin a trouvé ce qui soignait la fièvre bleue. Ça a pris trente-cinq ans, et cinq ans de plus pour que la nouvelle monte. On m’a soigné, on m’a redescendu. J’avais sept ans. Ma mère était morte. Mon père était mort. Mon frère aîné avait cinquante-trois ans et il ne m’a pas reconnu. Il m’a regardé sur le pas de sa porte, et il a dit : « Vous êtes le petit qu’on a monté ? » Vous. Il m’a vouvoyé. C’est ma nièce qui m’a élevé. Elle avait l’âge d’être ma grand-mère. Elle était gentille. Tout le monde était gentil. Personne ne jouait aux mêmes jeux que moi, personne ne connaissait les chansons, les rues avaient changé de nom. Je parlais comme un vieux. À quinze ans, je parlais déjà comme un vieux. Ça ne m’a jamais quitté.",
     "mentions": []
    },
    {
     "id": "c4-b51",
     "text": "— Et après ?",
     "mentions": []
    },
    {
     "id": "c4-b52",
     "text": "— Après, j’ai cherché un métier où ça ne se verrait pas. Où tout le monde, autour de moi, serait comme moi : pas de son temps. Je suis devenu passeur. Je monte, je descends. Chaque fois que je reviens, Aval a changé, et c’est normal, et personne ne s’étonne que je ne m’y retrouve pas. Je suis né il y a cent trente et un ans, madame. J’en ai vécu cinquante-trois. Je n’ai pas de contemporains. J’ai des clients.",
     "mentions": [
      "orso-lebreuil",
      "aval"
     ]
    },
    {
     "id": "c4-b53",
     "text": "Il a dit ça sans amertume. Comme on donne un renseignement. Je l’ai regardé, à la lueur du feu, et j’ai vu pour la première fois l’enfant de sept ans sur le pas de la porte, devant un vieux monsieur qui lui disait vous.",
     "mentions": []
    },
    {
     "id": "c4-b54",
     "text": "— Vous avez connu ma mère, ai-je dit. Vous l’avez montée.",
     "mentions": []
    },
    {
     "id": "c4-b55",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c4-b56",
     "text": "— Vous la voyez à chaque passage.",
     "mentions": []
    },
    {
     "id": "c4-b57",
     "text": "— Oui, madame.",
     "mentions": []
    },
    {
     "id": "c4-b58",
     "text": "— Ça fait combien de fois ?",
     "mentions": []
    },
    {
     "id": "c4-b59",
     "text": "— Pour vous, un passage tous les deux ans, à peu près. Treize, quatorze fois, depuis qu’elle est là-haut. Pour elle…",
     "mentions": []
    },
    {
     "id": "c4-b60",
     "text": "Il a hésité. C’est la première fois que je l’ai vu hésiter.",
     "mentions": []
    },
    {
     "id": "c4-b61",
     "text": "— Pour elle, je passe le dimanche, a-t-il dit. Presque tous les dimanches. Elle me fait du café. Nous parlons. Elle me demande des nouvelles d’en bas et je lui en donne. Elle me demande des nouvelles de vous.",
     "mentions": []
    },
    {
     "id": "c4-b62",
     "text": "J’ai senti quelque chose se déplacer dans ma poitrine, comme un meuble qu’on tire sur un plancher. Pour moi, ma mère était une lettre tous les deux ans. Une écriture ronde sur du papier gris. Pour elle, cet homme était une visite chaque dimanche, un café, une conversation. Il la connaissait. Il la connaissait comme on connaît quelqu’un qu’on voit toutes les semaines depuis des mois : son humeur du matin, ses silences, la façon dont elle tient sa tasse. Il avait vu ma mère plus souvent que moi. Beaucoup plus souvent. Il avait vécu avec elle, à sa vitesse, ce que je n’avais vécu qu’en lettres.",
     "mentions": []
    },
    {
     "id": "c4-b63",
     "text": "— Vous avez vu ma mère plus souvent que moi, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c4-b64",
     "text": "— Oui, madame. Beaucoup plus souvent.",
     "mentions": []
    },
    {
     "id": "c4-b65",
     "text": "Il n’a pas baissé les yeux. Il ne s’est pas excusé. Il a remis une bûche dans le feu, avec soin, en la calant contre les autres.",
     "mentions": []
    },
    {
     "id": "c4-b66",
     "text": "— Il faut que je vous dise quelque chose, avant l’Hospice, a-t-il dit.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c4-b67",
     "text": "J’ai attendu. Capucine respirait, lentement, derrière moi. La neige, dehors, était devenue bleue sous un ciel qui avait cessé de battre pour un moment, par hasard : une nuit un peu plus longue que les autres, peut-être, une nuit de novembre d’en bas.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c4-b68",
     "text": "— Demain, a-t-il dit enfin. Je vous le dirai demain.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "Il ne me l’a pas dit. Nous avons quitté la Baume quelques heures plus tard, dans une neige jusqu’aux cuisses, et nous avons passé la fin de la nuit et tout le jour suivant de ma montre à nous battre contre elle, pas contre la montagne. Quelque part au milieu de cette journée, j’ai regardé le second cadran et j’ai vu passer le vingt-cinq décembre. Je veux dire que je l’ai vu passer : la date a changé pendant que je dégageais ma jambe d’une congère, et quand j’ai relevé la tête une seconde fois, c’était le vingt-six. Ton Noël a duré vingt minutes de ma vie. Je ne sais pas ce que tu as reçu. Au milieu de l’après-midi de ma montre, en me retournant sur un replat, j’ai aperçu très loin en contrebas, dans les lacets de la route des mulets qui contourne l’Échine par l’ouest, un point noir qui montait. Un homme seul, sans charge, qui courait presque. Vu d’où j’étais, il allait vite, beaucoup trop vite, comme tout ce qui est en dessous. Orso l’a regardé aussi.",
     "mentions": [
      "orso-lebreuil",
      "lechine",
      "double-montre"
     ]
    },
    {
     "id": "c4-b70",
     "text": "— Le coureur de l’Écluse, a-t-il dit. La route des mulets fait un grand détour. Il arrivera après nous.",
     "mentions": [
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c4-b71",
     "text": "— Longtemps après ?",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "— Pas longtemps.",
     "mentions": []
    },
    {
     "id": "c4-b73",
     "text": "Et au crépuscule — si l’on peut dire crépuscule d’un ciel qui s’allume et s’éteint quatre fois par heure —, nous sommes arrivés au pied de la falaise. L’Hospice était au-dessus de nous. Je l’avais regardé toute ma vie, de la fenêtre de ma chambre, comme un nid d’hirondelle collé à la roche. De près, c’était une forteresse. Des murs gris, percés de fenêtres étroites, trois étages de galeries de bois accrochées au rocher, et un escalier taillé dans la paroi qui montait jusqu’à la porte en zigzags. Toutes les fenêtres étaient noires, sauf une, au troisième palier, celle que je connaissais depuis l’enfance. La lampe de garde. Ma mère ne dormait pas.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c4-b74",
