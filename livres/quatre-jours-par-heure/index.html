     "text": "Au-dessus encore, bien plus haut, là où la falaise se perdait, il y avait une sorte de brume. Pas une brume. Une lumière. Grise, égale, immobile, ni jour ni nuit. Les Terrasses, a dit Orso en suivant mon regard. Là-haut, le ciel bat si vite qu’on ne le voit plus battre. Ils vivent dans la moyenne.",
     "mentions": [
      "orso-lebreuil",
      "les-terrasses",
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c4-b75",
     "text": "J’ai regardé ma montre. Le petit cadran disait six heures du soir de notre troisième jour depuis le Pas. Le grand disait le vingt janvier, sept heures et quart du matin. Tu devais être en train de te lever pour aller au lycée, dans le froid, avec les gants que je ne t’avais pas vue mettre. Je suis restée longtemps devant le premier degré de l’escalier, la main sur la rampe de fer froide, sans monter. Orso ne m’a pas pressée. C’est Capucine qui a fini par me tirer par la manche.",
     "mentions": [
      "capucine-rigal",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c4-b76",
     "text": "— Tu viens ? a-t-elle dit. Ça coûte cher, de rester en bas des marches.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "La Longue Veille",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "L’escalier de l’Hospice compte trois cent douze marches. Je les ai comptées. Il fallait bien que je compte quelque chose d’autre que toi.",
     "mentions": [
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c5-b02",
     "text": "À la porte, une sœur tourière en gris nous a fait entrer sans un mot, comme on fait entrer des gens attendus depuis longtemps. Je dis sœur parce que c’est le mot qui vient, mais il n’y a pas de sœurs à l’Hospice, ni de prières, ni de chapelle. Il y a des veilleuses : les mères, les tantes, les grandes sœurs qui sont montées avec un enfant et qui sont restées, et les veilleuses de louage qui ne sont pas redescendues, et quelques femmes d’Aval qui ont pris le gris par vocation, il y a longtemps, et qui ne savent plus très bien pourquoi. Elles portent toutes la même robe, de la même laine grise, et elles marchent toutes du même pas, feutré, dans des chaussons de lisière. On les entend moins que la cloche.",
     "mentions": [
      "aval",
      "veilleuses"
     ]
    },
    {
     "id": "c5-b03",
     "text": "La cloche, c’est l’Hospice. Elle sonne les heures, les demies, les quarts, les repas, les soins, le lever, le coucher. Là-haut, le soleil ne sert à rien : il passe quatre fois par heure. Alors on a fermé les volets. Tous. Les fenêtres de l’Hospice ont des volets de chêne pleins, percés chacun d’une fente horizontale de la largeur d’un doigt, et par la fente, le ciel entre : clair, sombre, clair, sombre, un trait de lumière qui s’allume et s’éteint sur le carrelage des couloirs comme le feu d’un phare. On vit à la lampe. On mange à la lampe, on soigne à la lampe, on dort dans le noir des volets, et le pouls du ciel bat sur les murs, dans les fentes, sans que personne le regarde plus.",
     "mentions": [
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c5-b04",
     "text": "Il y avait une odeur de cire, de camphre et de soupe aux poireaux. Il y avait, derrière les portes, des voix d’enfants. Pas des cris : des voix. Des enfants qui jouaient doucement, comme on joue dans un hôpital ou dans une maison en deuil.",
     "mentions": []
    },
    {
     "id": "c5-b05",
     "text": "La tourière nous a menés au bureau du recteur.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c5-b06",
     "text": "Je savais son nom. Tout Aval le sait, parce qu’il signe les quittances de pension depuis plus longtemps que quiconque ne se souvient : Anselme Lestang, recteur de l’Hospice de la Longue Veille. Mon père payait à son nom. Je payais à son nom depuis neuf ans. Je m’étais toujours figuré un vieillard. C’était un homme d’une soixantaine d’années, grand, les cheveux blancs coupés court, en habit noir boutonné haut, avec des mains longues et très propres et une voix douce qui ne montait jamais. Il était assis derrière un bureau d’acajou, devant un registre ouvert, et il écrivait à la plume d’oie. Il a fini sa ligne avant de lever la tête. Il a sablé l’encre. Puis il nous a souri.",
     "mentions": [
      "hospice-longue-veille",
      "pension-daltitude"
     ]
    },
    {
     "id": "c5-b07",
     "text": "— Monsieur Lebreuil, a-t-il dit. Toujours fidèle. Et voici notre nouvelle pensionnaire.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "Il a tendu la main vers Capucine, paume ouverte, comme vers un chat. Capucine ne l’a pas prise. Il ne s’en est pas offusqué. Il a pris ses papiers, que je lui tendais, et il les a lus avec attention, en suivant les lignes du doigt.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c5-b09",
     "text": "— Rigal, Capucine. Neuf ans. Calcine, deuxième degré. Veilleuse de louage, madame Ferrand. Tiens.",
     "mentions": []
    },
    {
     "id": "c5-b10",
     "text": "Il a relevé les yeux vers moi. Ce n’était pas le regard de la visiteuse. C’était un regard qui ne cherchait rien, parce qu’il n’avait jamais eu besoin de chercher : tout finissait toujours par venir sur son bureau.",
     "mentions": [
      "adrienne-coquard"
     ]
    },
    {
     "id": "c5-b11",
     "text": "— Nous avons une Ferrand céans, a-t-il dit. Une veilleuse. Parente ?",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c5-b12",
     "text": "— C’est un nom courant, monsieur le recteur.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c5-b13",
     "text": "— Point tant que ça, a-t-il dit, et j’ai entendu, à trois jours de distance, la voix de la visiteuse Coquard. Mais vous avez raison, ce n’est pas mon affaire.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "Il a regardé Capucine. Elle respirait. Elle respirait trop bien. Depuis la Baume, elle ne toussait presque plus, et elle avait les joues d’une enfant qui vient de faire du traîneau.",
     "mentions": [
      "capucine-rigal",
      "lechine"
     ]
    },
    {
     "id": "c5-b15",
     "text": "— La petite respire mieux que ne le dit son certificat, a-t-il remarqué.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— C’est l’air des hauteurs, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "— Sans doute. C’est ce qu’on dit en bas.",
     "mentions": []
    },
    {
     "id": "c5-b18",
     "text": "Il a trempé sa plume. Il a écrit dans son registre, lentement, d’une écriture penchée magnifique. Rigal, Capucine, entrée ce jour.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "— La pension court à compter de ce soir, au tarif ordinaire. Trois écus l’an d’Aval, payables d’avance. Vous direz à la famille que le premier versement est échu. Monsieur Lebreuil s’en chargera.",
     "mentions": [
      "aval",
      "pension-daltitude"
     ]
    },
    {
     "id": "c5-b20",
     "text": "Trois écus l’an. C’est ce que payait mon père, et c’est ce que j’ai payé après lui. À Aval, trois écus, c’est le loyer d’une chambre pour un an. Ce n’est pas rien, mais ce n’est pas la ruine : c’est pour ça que les familles pauvres suspendent leurs enfants plutôt que de les soigner. Je n’avais jamais fait la multiplication dans ce sens-là. Je l’ai faite, debout devant l’acajou du recteur, en regardant sa plume. Un an d’Aval, à l’Hospice, c’est trois jours et demi. Trois écus pour trois jours et demi de soupe aux poireaux, de camphre et de veilleuse. À ce prix-là, à Aval, on loge un roi.",
     "mentions": [
      "anselme-lestang",
      "jules-ferrand",
      "veilleuses"
     ]
    },
    {
     "id": "c5-b21",
     "text": "Il a dû lire le calcul sur mon visage. Il a posé sa plume.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "— Vous faites le compte, madame. Tout le monde le fait, la première fois. Laissez-moi vous aider à le finir. Ce que nous vendons ici, ce n’est pas le gîte. Ce n’est pas le couvert. C’est la seule marchandise que les pauvres puissent s’offrir et que les riches ne peuvent pas leur prendre : du temps. Un an de sursis pour trois écus. Cherchez donc, en bas, qui vous fait un meilleur prix.",
     "mentions": []
    },
    {
     "id": "c5-b23",
     "text": "Il a souri de nouveau, et il a fait signe à la tourière, et nous étions congédiés.",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "On a installé Capucine dans la salle de la Pendule, au deuxième palier, un dortoir de douze lits sous une voûte blanchie à la chaux, avec des rideaux de coton autour de chaque lit et une veilleuse en gris qui tricotait près du poêle. Sept des lits étaient occupés. Des petites filles de six à douze ans, pâles, en chemise de nuit, qui ont regardé Capucine arriver avec une curiosité sans hâte. L’une d’elles, une grande à nattes rousses, m’a demandé quelle année c’était, en bas. Je le lui ai dit. Elle a fait un petit « oh » poli, comme on reçoit la nouvelle d’un mariage lointain.",
     "mentions": [
      "capucine-rigal",
      "mathilde",
      "la-pendule"
     ]
    },
    {
     "id": "c5-b25",
     "text": "— Elle est là depuis quatre-vingts ans, m’a soufflé la veilleuse au tricot. De chez vous. Sa famille ne paie plus depuis cinquante. Il n’y a plus de famille. C’est la Fondation qui paie.",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c5-b26",
     "text": "— Quelle fondation ?",
     "mentions": []
    },
    {
     "id": "c5-b27",
     "text": "— Celle des Lents. Ils ont des œuvres.",
     "mentions": [
      "les-lents"
     ]
    },
    {
     "id": "c5-b28",
     "text": "Capucine s’est assise sur son lit, son roman d’aventures sur les genoux. Elle a regardé les sept petites filles, la voûte, les volets, la fente de lumière qui battait sur le mur. Puis elle m’a regardée, moi, et elle n’a rien dit, et je savais très bien ce qu’elle ne disait pas.",
     "mentions": []
    },
    {
     "id": "c5-b29",
     "text": "— Je reviens, lui ai-je dit.",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "— Je sais, a-t-elle répondu. Tu as promis.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "Orso m’attendait dans le couloir. Il m’a menée au troisième palier par un escalier de service, en silence. Il ne m’a pas parlé de ce qu’il devait me dire. Il ne m’a pas parlé du tout. Devant une porte au bout d’une galerie, il s’est arrêté, et il a enlevé son chapeau, et il a eu l’air de vouloir ouvrir la bouche, et il ne l’a pas ouverte.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c5-b32",
     "text": "— Elle est allée chercher de l’eau chaude, a-t-il dit seulement. Le petit est seul.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "Il a poussé la porte. Je suis entrée.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "C’était une chambre étroite, blanchie à la chaux, avec un lit de fer, une table, deux chaises, un poêle de faïence, et sur la table, la lampe de garde. La lampe que je regardais de ma fenêtre depuis que j’avais douze ans. Elle était là. Elle était plus petite que dans mon souvenir. C’était une lampe à pétrole ordinaire, avec un verre un peu fêlé.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "Et dans le lit, il y avait Tobie.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c5-b36",
     "text": "Il avait sept ans. Je le savais. Je le savais depuis vingt-sept ans, je l’avais calculé mille fois, je l’avais expliqué à ton père, à toi, à moi-même. Et pourtant, je crois que je m’attendais à autre chose. À un homme. À un frère. Il y avait, dans ce lit trop grand, un petit garçon aux cheveux collés par la fièvre, maigre à faire peur, les lèvres un peu bleues, avec un cheval de bois serré contre lui, et des yeux immenses qui me regardaient entrer.",
     "mentions": []
    },
    {
     "id": "c5-b37",
     "text": "Il respirait mal. Ce bruit. Ce sifflement, ce raclement, ce silence au bout. Je l’avais laissé avec ce bruit-là, et je le retrouvais avec le même, exactement le même, comme si j’étais sortie de la chambre un soir et revenue le lendemain matin, et que dans l’intervalle j’avais vieilli de vingt-sept ans.",
     "mentions": []
    },
    {
     "id": "c5-b38",
     "text": "— Tu es qui ? a-t-il dit.",
     "mentions": []
    },
    {
     "id": "c5-b39",
     "text": "Sa voix. Je n’y étais pas préparée. On ne pense jamais aux voix. Orso avait raison.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c5-b40",
     "text": "— Je suis Lou.",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c5-b41",
     "text": "Il m’a regardée longtemps. Il avait le regard des malades, qui ont le temps.",
     "mentions": []
    },
    {
     "id": "c5-b42",
     "text": "— Non, a-t-il dit. Lou, c’est ma sœur. Elle est petite. Elle a douze ans.",
     "mentions": []
    },
    {
     "id": "c5-b43",
     "text": "— Elle a grandi.",
     "mentions": []
    },
    {
     "id": "c5-b44",
     "text": "— Pas si vite, a-t-il dit, avec un mépris d’enfant pour les mensonges des grandes personnes.",
     "mentions": []
    },
    {
     "id": "c5-b45",
     "text": "Je me suis assise sur la chaise, à côté du lit. Je ne savais pas quoi faire de mes mains. Je les ai posées sur mes genoux. Il a continué à me regarder, avec son cheval de bois contre la joue.",
     "mentions": []
    },
    {
     "id": "c5-b46",
     "text": "— Tu la connais ? a-t-il demandé. Lou ?",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c5-b47",
     "text": "— Un peu.",
     "mentions": []
    },
    {
     "id": "c5-b48",
     "text": "— Elle m’a promis de m’apprendre à siffler avec deux doigts. Elle sait. Elle siffle comme les garçons des Tanneries, papa dit que ce n’est pas convenable. Elle m’a dit que quand je serais guéri, elle m’apprendrait.",
     "mentions": []
    },
    {
     "id": "c5-b49",
     "text": "Alors j’ai mis deux doigts dans ma bouche et j’ai sifflé.",
     "mentions": []
    },
    {
     "id": "c5-b50",
     "text": "Je ne l’avais pas fait depuis des années. Ton père détestait ça. Toi, tu trouvais ça embarrassant, les rares fois où je l’ai fait pour appeler un taxi. C’est un sifflement strident, affreux, qui perce les tympans, que j’avais appris à neuf ans d’un apprenti tanneur en échange d’une toupie. Il a rebondi sur la chaux de la chambre comme une balle de fusil.",
     "mentions": []
    },
    {
     "id": "c5-b51",
     "text": "Tobie a lâché son cheval.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c5-b52",
     "text": "Il m’a regardée comme on regarde un tour de magie. Puis il a dit, tout doucement, avec une petite voix qui sifflait elle aussi, à sa façon, de ses poumons de sel :",
     "mentions": [
      "calcine"
     ]
    },
    {
     "id": "c5-b53",
     "text": "— C’est comme Lou.",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c5-b54",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c5-b55",
     "text": "— Tu es vraiment Lou ?",
     "mentions": []
    },
    {
     "id": "c5-b56",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c5-b57",
     "text": "— Tu es vieille.",
     "mentions": []
    },
    {
     "id": "c5-b58",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c5-b59",
     "text": "Il a réfléchi. Il a récupéré son cheval dans les draps. Il avait l’air de trouver ça injuste, mais d’une injustice intéressante, comme une règle de jeu qu’on découvre en cours de partie.",
     "mentions": []
    },
    {
     "id": "c5-b60",
     "text": "— Tu m’apprendras quand même ?",
     "mentions": []
    },
    {
     "id": "c5-b61",
     "text": "— Quand tu seras guéri.",
     "mentions": []
    },
    {
     "id": "c5-b62",
     "text": "— Je ne vais pas guérir, a-t-il dit, avec un calme de grand garçon. Les médecins ont dit à maman. Ils croient que je dors, mais je ne dors pas. Je fais semblant. C’est plus facile pour elle.",
     "mentions": []
    },
    {
     "id": "c5-b63",
     "text": "C’est à ce moment que la porte s’est ouverte derrière moi, et que ma mère est entrée avec une cuvette d’eau chaude.",
     "mentions": []
    },
    {
     "id": "c5-b64",
     "text": "Je me suis levée. Je ne sais pas pourquoi. Pour qu’elle me voie en entier, peut-être. Elle a posé la cuvette sur la table, à côté de la lampe, avec précaution, sans en renverser une goutte. Puis elle m’a regardée, et elle ne m’a pas reconnue.",
     "mentions": []
    },
    {
     "id": "c5-b65",
     "text": "Il faut que je te la décrive, Nine, parce que c’est ta grand-mère et que tu ne l’avais jamais vue qu’en photographie, sur le buffet, avec son chapeau de paille et moi à sept ans sur ses genoux. Elle avait trente-deux ans. Elle était plus petite que moi. Elle portait la robe grise des veilleuses, un tablier par-dessus, les manches retroussées, et ses cheveux, qui étaient noirs, pas encore un seul fil blanc, tenaient dans un chignon défait par la journée. Elle avait des taches de rousseur. Je les avais oubliées. Elle avait mon nez, ou j’avais le sien, et sur le front, entre les sourcils, la petite ride verticale que j’ai depuis mes trente ans et que tu commenceras à avoir, je pense, dans une dizaine d’années. Elle avait l’air fatiguée. Elle avait l’air d’une jeune femme fatiguée. Elle avait l’air, exactement, de ma petite sœur.",
     "mentions": [
      "nine",
      "helene-ferrand",
      "veilleuses"
     ]
    },
    {
     "id": "c5-b66",
     "text": "— Madame ? a-t-elle dit. Vous êtes la nouvelle veilleuse ?",
     "mentions": []
    },
    {
     "id": "c5-b67",
     "text": "Il y a un moment, dans la vie, où l’on sait qu’on va dire un mot qu’on n’a pas dit depuis longtemps, et où l’on a peur qu’il ne sorte pas. Il est sorti. Il est sorti tout petit, avec une voix qui n’était pas celle de mes trente-neuf ans.",
     "mentions": []
    },
    {
     "id": "c5-b68",
     "text": "— Maman.",
     "mentions": []
    },
    {
     "id": "c5-b69",
     "text": "Elle n’a pas bougé. Elle a regardé mon visage, longtemps. Puis mes mains. Puis de nouveau mon visage. Je l’ai vue chercher. Je l’ai vue chercher, sous cette femme plus âgée qu’elle, la petite fille de douze ans qu’elle avait laissée sur le quai de la gare du Tardif trois mois plus tôt. Trois mois. Pour elle, trois mois.",
     "mentions": [
      "le-tardif"
     ]
    },
    {
     "id": "c5-b70",
     "text": "— Tu as les mains de ton père, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c5-b71",
     "text": "Et puis elle s’est assise sur la deuxième chaise, très lentement, comme une vieille femme, et elle a mis ses mains sur sa bouche.",
     "mentions": []
    },
    {
     "id": "c5-b72",
     "text": "— Quel âge as-tu ?",
     "mentions": []
    },
    {
     "id": "c5-b73",
     "text": "— Trente-neuf ans.",
     "mentions": []
    },
    {
     "id": "c5-b74",
     "text": "— Je t’ai laissée il y a trois mois.",
     "mentions": []
    },
    {
     "id": "c5-b75",
     "text": "— Il y a vingt-sept ans.",
     "mentions": []
    },
    {
     "id": "c5-b76",
     "text": "Tu vois, c’était vrai des deux côtés. C’est ce que je n’ai pas compris tout de suite, et que j’ai mis tout le reste de ce voyage à comprendre. Elle ne mentait pas. Je ne mentais pas. Il y avait entre nous trois mois et vingt-sept ans, et c’était la même distance.",
     "mentions": []
    },
    {
     "id": "c5-b77",
     "text": "Je n’ai pas su quoi faire d’autre. J’ai défait ma montre. J’ai dévissé le fond. J’ai sorti la fiole et je l’ai posée sur la table, à côté de la cuvette et de la lampe, dans la lumière du pétrole, trouble, couleur de petit-lait.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c5-b78",
     "text": "— Qu’est-ce que c’est ? a-t-elle demandé.",
     "mentions": []
    },
    {
     "id": "c5-b79",
     "text": "— Le remède. Contre la calcine. La souche d’Esquerre.",
     "mentions": [
      "pauline-esquerre",
      "calcine"
     ]
    },
    {
     "id": "c5-b80",
     "text": "— Le remède, a-t-elle répété, comme un mot étranger.",
     "mentions": []
    },
    {
     "id": "c5-b81",
     "text": "— Ça existe depuis deux ans. En bas. Les enfants d’Aval guérissent. Sept jours, une injection par jour. Il y en a six. Il en faudrait sept, mais six…",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c5-b82",
     "text": "— Depuis deux ans, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c5-b83",
     "text": "Elle a regardé la fiole. Elle a fait la multiplication, je l’ai vue la faire, les lèvres en mouvement, comme la femme au soupirail.",
     "mentions": [
      "madame-morand",
      "souche-desquerre"
     ]
    },
    {
     "id": "c5-b84",
     "text": "— Une semaine, a-t-elle dit. Ça existe depuis une semaine.",
     "mentions": []
    },
    {
     "id": "c5-b85",
     "text": "— Tu ne le savais pas ? Le recteur le sait. Les journaux d’Aval en parlent depuis le début. Ils montent bien, les journaux, même en retard.",
     "mentions": []
    },
    {
     "id": "c5-b86",
     "text": "— Je ne lis plus rien d’en bas, a-t-elle dit. Plus rien. Depuis longtemps.",
     "mentions": []
    },
    {
     "id": "c5-b87",
     "text": "Je n’ai pas relevé. Je l’aurais dû. C’est la phrase que j’aurais dû entendre, ce soir-là, entre toutes les autres, et je ne l’ai pas entendue, parce que mon frère, derrière moi, s’était remis à siffler de ses poumons de sel.",
     "mentions": [
      "calcine"
     ]
    },
    {
     "id": "c5-b88",
     "text": "Nous lui avons fait la première injection à la tombée de ce qu’on appelle la nuit, là-haut, c’est-à-dire au coup de cloche de huit heures. Ma mère lui tenait la tête contre son épaule. Je tenais la seringue. Orso, sur le pas de la porte, faisait le guet. Tobie n’a pas pleuré. Il a regardé l’aiguille avec intérêt. Il a dit : « C’est pour que je guérisse et que tu m’apprennes ? » et j’ai dit oui, et j’ai poussé le piston, et le liquide trouble est entré dans son bras maigre, et il a fermé les yeux, et je ne savais pas du tout, du tout, si ça allait marcher.",
     "mentions": [
      "tobie-ferrand",
      "orso-lebreuil"
     ]
    },
    {
     "id": "c5-b89",
     "text": "Puis on a fermé les volets tout à fait, jusqu’à ce que la fente même soit bouchée par un chiffon, et on a baissé la lampe, et ma mère s’est allongée à côté de lui, tout habillée, et je me suis assise sur la chaise.",
     "mentions": []
    },
    {
     "id": "c5-b90",
     "text": "Je n’ai pas dormi tout de suite. J’ai regardé ma montre à la lueur de la lampe basse. Un peu avant minuit, j’ai vu la date du second cadran changer, puis changer encore, et puis encore, et j’ai arrêté de regarder parce qu’on ne peut pas regarder ça longtemps. Une nuit à l’Hospice dure dix heures, de la cloche du coucher à celle du lever. Dix heures, ce sont quarante et un jours d’Aval. La nuit où j’ai retrouvé ma mère, Nine, c’est la nuit de tes quinze ans. Le deux février est passé pendant que je dormais, sur une chaise, dans la chambre de mon frère. Je ne t’ai pas souhaité ton anniversaire. Je l’ai dormi.",
     "mentions": [
      "nine",
      "hospice-longue-veille",
      "double-montre"
     ]
    },
    {
     "id": "c5-b91",
     "text": "Au matin, à la cloche de six heures, j’ai été réveillée par un bruit que je ne connaissais pas.",
     "mentions": []
    },
    {
     "id": "c5-b92",
     "text": "C’était Tobie qui respirait.",
     "mentions": []
    },
    {
     "id": "c5-b93",
     "text": "Pas bien. Pas comme toi, pas comme Capucine depuis la Baume. Mais sans le sifflement. Un souffle rauque, lent, régulier, avec au bout, au lieu du silence, un autre souffle. Ma mère était assise dans le lit, la main sur la poitrine de son fils, et elle la sentait monter et descendre, et elle pleurait sans faire de bruit, avec les larmes qui tombaient sur la couverture.",
     "mentions": [
      "capucine-rigal",
      "lechine"
     ]
    },
    {
     "id": "c5-b94",
     "text": "Tobie a ouvert un œil.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c5-b95",
     "text": "— J’ai faim, a-t-il dit. Je voudrais du pain avec de la confiture. De la confiture de mûres.",
     "mentions": []
    },
    {
     "id": "c5-b96",
     "text": "Ma mère a ri. Un rire mouillé, un rire de petite fille. Elle s’est levée, elle a rajusté son chignon, elle a cherché ses chaussons dans la pénombre. À la porte, elle s’est retournée vers moi. Elle avait le visage de quelqu’un qui revient de très loin et qui découvre qu’on a changé les meubles de place.",
     "mentions": []
    },
    {
     "id": "c5-b97",
     "text": "— Et ton père ? a-t-elle demandé. Il n’est pas monté avec toi ? Il ne pouvait pas quitter l’atelier, c’est ça ? Il va être si content. Il faut que je lui écrive.",
     "mentions": [
      "atelier-ferrand"
     ]
    },
    {
     "id": "c5-b98",
     "text": "Je l’ai regardée. Elle attendait la réponse, la main sur la poignée, avec un sourire.",
     "mentions": []
    },
    {
     "id": "c5-b99",
     "text": "— Papa est mort, maman. Il y a neuf ans. Je te l’ai écrit.",
     "mentions": [
      "jules-ferrand"
     ]
    },
    {
     "id": "c5-b100",
     "text": "Elle n’a rien dit. Le sourire est resté un moment sur son visage, comme une lampe qu’on a oublié d’éteindre dans une pièce vide. Puis il est parti.",
     "mentions": []
    },
    {
     "id": "c5-b101",
     "text": "— Je ne savais pas, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c5-b102",
     "text": "Derrière elle, dans l’embrasure, Orso a fermé les yeux.",
     "mentions": [
      "orso-lebreuil"
     ]
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "Une nuit de vingt-deux ans",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Ma mère est revenue avec le pain et la confiture de mûres. Elle a fait manger Tobie, tartine par tartine, en coupant les croûtes, comme elle le faisait à Aval, et je l’ai regardée faire depuis ma chaise. Ses gestes étaient exactement ceux de mon souvenir. C’est une chose que personne ne m’avait dite et que je te dis : les gens qu’on retrouve après longtemps ont changé, sauf ceux qui sont restés là-haut. Eux, on les retrouve tels quels, avec leurs manies intactes. C’est encore plus difficile.",
     "mentions": [
      "tobie-ferrand",
      "aval"
     ]
    },
    {
     "id": "c6-b02",
     "text": "Elle ne parlait pas. Quand Tobie a eu fini, qu’il s’est rendormi — vraiment rendormi, cette fois, avec un souffle rauque et lent qui ressemblait presque à un ronflement —, elle s’est assise sur le bord du lit et elle a regardé ses mains.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "— Comment est-il mort ? a-t-elle demandé.",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "— Le cœur. À l’atelier. Il réglait une montre. On l’a trouvé le front sur l’établi, la loupe encore dans l’œil. Il n’a pas souffert, a dit le médecin.",
     "mentions": [
      "atelier-ferrand"
     ]
    },
    {
     "id": "c6-b05",
     "text": "— Il réglait une montre, a-t-elle répété. Évidemment.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "Elle a souri un peu. Puis elle a dit :",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "— Tu dis que tu me l’as écrit.",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "— Oui. Et tu m’as répondu.",
     "mentions": []
    },
    {
     "id": "c6-b09",
     "text": "— Je ne t’ai pas répondu.",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "— Si, maman. Une longue lettre. La plus longue de toutes. Tu disais que tu te souvenais du jour où il t’avait demandée en mariage, qu’il avait fait tomber la bague dans le bassin de la place de la Halle et qu’il était entré dedans tout habillé pour la repêcher. Tu disais qu’il t’avait fait rire pendant quinze ans et que c’était ce qu’on pouvait espérer de mieux d’un homme. Tu disais : « Il faut que tu ries, toi aussi, ma Lou, même si c’est trop tôt. »",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c6-b11",
     "text": "Ma mère me regardait. Elle avait la bouche un peu ouverte.",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "— C’est vrai, pour la bague, a-t-elle dit. C’est vrai, pour le bassin. Je l’ai raconté. Mais je ne l’ai pas écrit.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "— Tu l’as écrit. Je l’ai. Elle est dans le tiroir de ma table de nuit, à Aval, avec les autres.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c6-b14",
     "text": "— Quelles autres ?",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "— Tes lettres. J’en ai quatorze.",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "Elle s’est levée. Elle est allée jusqu’au lit, elle s’est agenouillée, elle a passé le bras dessous, et elle en a sorti une boîte en fer. Une vieille boîte à biscuits de la biscuiterie Mauduit, avec sur le couvercle une petite fille en tablier qui tend un gâteau à un chien. Je la connaissais. C’était la boîte des boutons, à la maison, sur l’étagère de la cuisine. Elle l’avait emportée. Elle l’a posée sur la table, sous la lampe, et elle l’a ouverte.",
     "mentions": [
      "les-lettres"
     ]
    },
    {
     "id": "c6-b17",
     "text": "Il y avait dedans des enveloppes.",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "Je les ai reconnues avant de les compter. C’était mon écriture. Dix enveloppes, et sur chacune, mon écriture qui changeait. La première avait encore des boucles, des ronds sur les i, une écriture de lycéenne qui s’applique. Puis elle se resserrait, se penchait, prenait de la vitesse. Sur les dernières, c’était celle que j’ai aujourd’hui, celle de mes factures et de mes étiquettes, nerveuse, un peu illisible, une écriture d’atelier. Dix fois, madame Hélène Ferrand, veilleuse, Hospice de la Longue Veille, aux bons soins de monsieur O. Lebreuil. Les cachets étaient intacts. Elle n’en avait ouvert aucune.",
     "mentions": [
      "helene-ferrand",
      "hospice-longue-veille",
      "veilleuses"
     ]
    },
    {
     "id": "c6-b19",
     "text": "— Je ne t’ai pas écrit depuis tes seize ans, a dit ma mère.",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "Il faut que je te raconte ce qu’elle m’a raconté, et que j’essaie de le faire sans lui en vouloir, parce que je lui en ai voulu pendant quelques heures, et puis je n’ai plus pu.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "Elle est montée quand j’avais douze ans et quatre mois. Le lendemain de son arrivée, pour elle, Orso lui a apporté ma première lettre. J’avais douze ans et demi, j’écrivais que Tobie me manquait, que papa faisait brûler les pommes de terre, que j’avais eu une bonne note en dictée. Elle m’a répondu le soir même. Cinq jours plus tard, Orso est revenu. La lettre suivante était d’une fille de quatorze ans. Une autre écriture, déjà. Une autre voix. Je parlais d’un garçon du lycée, que j’appelais par son initiale, et d’un disque que j’avais acheté, et je ne parlais plus de dictée. Elle m’a répondu quand même, et elle a pleuré en écrivant, parce qu’elle ne savait pas à qui elle écrivait. Une semaine plus tard, la troisième lettre. J’avais seize ans. Celle-là, elle l’a lue, et elle n’y a pas répondu. Je voulais quitter le lycée pour aller travailler à l’atelier avec papa. Je disais que papa était fatigué, que je l’aidais, que je n’avais plus besoin de personne. Je disais — je m’en souviens, parce que je l’avais écrit exprès, pour lui faire mal — que je m’étais habituée.",
     "mentions": [
      "tobie-ferrand",
      "orso-lebreuil",
      "atelier-ferrand"
     ]
    },
    {
     "id": "c6-b22",
     "text": "— En deux semaines, a dit ma mère, tu étais passée de douze ans à seize. Je te voyais grandir par secousses, comme sous un orage, d’un éclair à l’autre. Chaque fois qu’Orso frappait à la porte, j’avais peur. Je me disais : quelle fille va-t-il m’apporter, cette fois ? Et je n’étais pas là. Je n’étais là pour aucune de ces filles. Elles grandissaient toutes sans moi, et moi je restais la même, dans cette chambre, avec ton frère qui ne guérissait pas. Alors j’ai eu une idée. Une idée terrible, mais sur le moment elle m’a paru la seule. Je me suis dit : si je n’ouvre pas la lettre suivante, elle a seize ans. Elle reste à seize ans. Je la garde à seize ans aussi longtemps que je veux.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "Elle a posé la main sur les enveloppes.",
     "mentions": [
      "les-lettres"
     ]
    },
    {
     "id": "c6-b24",
     "text": "— Je t’ai gardée à seize ans, Lou. Pendant trois mois de ma vie. Je sais ce que c’était pour toi. Enfin, non. Je ne le savais pas. Je ne voulais pas le savoir. Je disais à Orso de te dire que j’allais bien. Que je t’aimais. Que je ne pouvais pas écrire. Je me disais que tu m’en voudrais, que tu penserais que ta mère t’avait abandonnée, et que c’était mieux comme ça. Mieux pour toi. Que tu m’en veuilles plutôt que de te voir grandir sans moi. Je me le disais, tu vois, et je le croyais.",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c6-b25",
     "text": "— Je ne t’en ai pas voulu, ai-je dit. Tu m’écrivais.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "Et c’est là que nous avons compris, toutes les deux, en même temps, en nous regardant par-dessus la boîte à biscuits Mauduit. Elle ne m’avait pas écrit. J’avais reçu douze lettres de sa main depuis mes seize ans. Il n’y avait qu’une personne au monde qui avait porté toutes les lettres dans les deux sens, qui connaissait son écriture et la mienne, qui la voyait tous les dimanches et me voyait tous les deux ans, qui savait ce qu’elle disait de moi et ce que je disais d’elle.",
     "mentions": []
    },
    {
     "id": "c6-b27",
     "text": "— Tiens bon la rampe, ai-je dit à voix haute.",
     "mentions": [
      "les-lettres"
     ]
    },
    {
     "id": "c6-b28",
     "text": "— Quoi ?",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "— Rien. Une expression.",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "Je l’ai trouvé dans la galerie du troisième palier, assis sur un banc, sous une fente de volet, le chapeau sur les genoux. Il m’attendait. Il m’attendait depuis la Baume. Il m’attendait, en fait, depuis vingt-deux ans.",
     "mentions": [
      "lechine"
     ]
    },
    {
     "id": "c6-b31",
     "text": "— C’est vous, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "— Oui, madame.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "— Toutes ?",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "— Onze. Et celle de la semaine dernière. Celle de Tobie.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c6-b35",
     "text": "Il a levé les yeux vers moi. Il n’y avait pas de défi dans ses yeux, et pas de honte non plus. Il y avait la même chose que d’habitude, cette patience de ceux qui ont trop attendu pour s’énerver encore.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "— Vous aviez seize ans, a-t-il dit. Vous étiez sur le quai, à la gare du Tardif, avec votre lettre à la main, et vous m’avez demandé si elle vous aimait encore. Vous avez dit : « Elle ne m’écrit plus parce qu’elle ne m’aime plus, c’est ça ? » Je suis monté. Je le lui ai demandé. Elle a pleuré tout le dimanche. Elle a dit : « Dites-lui que je l’aime. » Alors j’ai écrit : « Je t’aime. » Avec sa main. J’avais toutes ses lettres d’avant en tête, je les avais portées. Il m’a fallu trois nuits à l’Écluse pour apprendre à faire ses majuscules.",
     "mentions": [
      "le-tardif",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c6-b37",
     "text": "— Vous m’avez menti pendant vingt-deux ans.",
     "mentions": []
    },
    {
     "id": "c6-b38",
     "text": "— Non, madame. Je n’ai rien inventé. Tout ce que j’ai écrit, elle l’avait dit. Le dimanche, avec son café. Elle ne lisait pas vos lettres, mais elle parlait de vous tout le temps. De la petite Lou. De vos genoux écorchés, de votre sifflement, de vos colères. De votre père. Et vous, sur le quai, tous les deux ans, vous me racontiez votre vie, parce qu’il n’y avait personne d’autre à qui la raconter qui la lui porterait. Je mettais les deux ensemble. Je répondais à ce que vous me disiez avec ce qu’elle m’avait dit. C’était sa voix. C’était vos nouvelles. Je n’étais que la plume.",
     "mentions": [
      "lou-ferrand"
     ]
    },
    {
     "id": "c6-b39",
     "text": "— Ce n’était pas à vous de le décider.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "— Non, a-t-il dit. Mais personne d’autre ne décidait rien.",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "Je voudrais te dire que j’ai été juste. Je ne l’ai pas été. Je lui ai dit des choses que je ne répéterai pas, qui étaient des choses de fille de seize ans dans une bouche de femme de trente-neuf, et il les a écoutées sans baisser la tête, le chapeau sur les genoux. Je lui ai dit qu’il m’avait volé ma mère. Il a dit : « Je vous l’ai prêtée, madame, le temps qu’elle revienne. » Je lui ai dit qu’il n’avait pas le droit. Il a dit : « Je sais. » Je lui ai dit qu’il était un vieux fou, un revenant, un homme qui n’avait personne et qui s’était fabriqué une famille avec celle des autres. Il a mis longtemps à répondre à ça. Puis il a dit : « Oui. C’est à peu près ça. »",
     "mentions": [
      "les-revenants"
     ]
    },
    {
     "id": "c6-b42",
     "text": "Et je suis partie, parce que je n’avais plus rien à dire, et que lui n’avait plus rien à défendre.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "La journée a passé. Je ne sais pas te dire comment. Tobie dormait, se réveillait, mangeait, se rendormait, et chaque fois il respirait un peu mieux. À la cloche de midi, Capucine est montée en cachette par l’escalier de service, en chemise de nuit, pieds nus, avec son roman sous le bras, et elle s’est plantée au pied du lit de Tobie et elle l’a regardé avec la gravité d’un médecin.",
     "mentions": [
      "tobie-ferrand",
      "capucine-rigal"
     ]
    },
    {
     "id": "c6-b44",
     "text": "— C’est lui, ton frère ?",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "— C’est lui.",
     "mentions": []
    },
    {
     "id": "c6-b46",
     "text": "— Il a quel âge ?",
     "mentions": []
    },
    {
     "id": "c6-b47",
     "text": "— Sept ans.",
     "mentions": []
    },
    {
     "id": "c6-b48",
     "text": "— Moi, neuf, a-t-elle dit à Tobie, qui venait d’ouvrir les yeux. Tu sais lire ?",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c6-b49",
     "text": "— Un peu.",
     "mentions": []
    },
    {
     "id": "c6-b50",
     "text": "— Je te lirai. C’est l’histoire d’un aviateur qui tombe dans la jungle. C’est rapide, a-t-elle ajouté, avec une satisfaction de contrebandière. C’est interdit.",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Et elle s’est assise sur le lit, et elle a commencé à lire, et je l’ai laissée faire. Ma mère, dans le coin de la chambre, faisait semblant de repriser une chaussette. Elle n’a pas touché aux enveloppes de la journée. Elle les regardait de temps en temps, comme on regarde une bête endormie.",
     "mentions": [
      "les-lettres"
     ]
    },
    {
     "id": "c6-b52",
     "text": "Dans l’après-midi de l’Hospice, j’ai ouvert un volet de la galerie. C’est défendu, parce que la lumière qui bat dans les couloirs fait tousser les enfants, paraît-il ; je l’ai ouvert quand même, un instant. En bas, la plaine d’Aval, qui était blanche la veille, verdissait. Je l’ai vue verdir. Je l’ai vue passer du brun au vert tendre, puis au vert plein, pendant que le ciel battait au-dessus d’elle, clair, sombre, clair, et qu’une fois toutes les quatre battements, à peu près, un nuage passait comme une main sur une vitre. Le printemps a duré, en bas, le temps d’une conversation que je n’ai eue avec personne. J’ai refermé le volet.",
     "mentions": [
      "aval",
      "hospice-longue-veille",
      "ciel-qui-bat"
     ]
    },
    {
     "id": "c6-b53",
     "text": "Le soir, à la cloche de huit heures, nous avons fait la deuxième injection. Il en restait quatre.",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "Puis ma mère m’a demandé de sortir.",
     "mentions": []
    },
    {
     "id": "c6-b55",
     "text": "— Je vais les lire, a-t-elle dit. Toutes. Cette nuit. Mais pas devant toi. Je ne pourrai pas.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "Je suis sortie. Je me suis assise dans la galerie, sur le banc où Orso s’était assis le matin — il n’y était plus, je ne savais pas où il était, je ne voulais pas le savoir. Il y avait une fente de volet au-dessus de moi, et le trait de lumière battait sur le mur d’en face, clair, sombre. Et à travers la porte, pendant toute la nuit de l’Hospice, j’ai entendu ma mère lire ma vie.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c6-b57",
     "text": "Je savais ce qu’il y avait dans les lettres, puisque je les avais écrites. Alors je l’ai suivie, Nine, lettre après lettre, depuis le banc, aux bruits de la chambre. Au froissement du papier. Au silence. À sa respiration, qui changeait.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c6-b58",
     "text": "Vers neuf heures, j’ai entendu qu’elle déchirait la première enveloppe. C’était celle de mes seize ans et demi. J’y racontais que j’avais quitté le lycée, que je travaillais à l’atelier, que papa m’apprenait les échappements. Qu’il disait que j’avais de bonnes mains. Elle a lu longtemps. Elle a dû la relire.",
     "mentions": [
      "atelier-ferrand"
     ]
    },
    {
     "id": "c6-b59",
     "text": "Vers dix heures, la deuxième, et la troisième. Mes dix-huit ans, mes vingt ans. La double montre que papa m’avait faite pour mes vingt ans, celle que j’ai au poignet. Je la décrivais en détail. J’étais si fière. Je l’avais dessinée dans la marge. J’ai entendu ma mère rire. Un petit rire. Elle devait regarder le dessin.",
     "mentions": [
      "double-montre"
     ]
    },
    {
     "id": "c6-b60",
     "text": "Vers minuit, la lettre de mes vingt-trois ans, celle du mariage. Je racontais que ton père, le jour de la noce, avait fait tomber les alliances dans la vasque de la Pendule, en voulant faire une photographie au bord de l’eau, et qu’il était entré dedans en habit, et que toute la noce avait ri, et que c’était exactement ce qu’avait fait papa avec maman, dans le bassin de la Halle, et que je l’avais épousé un peu pour ça. Je n’avais pas su, en l’écrivant, que ma mère n’avait jamais lu la lettre où elle me racontait le bassin de la Halle. Je le savais d’Orso, qui le savait d’elle. Tout se tenait. Tout s’était tenu pendant vingt-deux ans, comme une montre dont on n’aurait jamais ouvert le fond. Derrière la porte, ma mère a ri plus fort, puis elle s’est arrêtée net, et je crois qu’elle venait de comprendre la même chose que moi.",
     "mentions": [
      "la-pendule"
     ]
    },
    {
     "id": "c6-b61",
     "text": "Vers une heure et demie, la lettre de ta naissance.",
     "mentions": []
    },
    {
     "id": "c6-b62",
     "text": "Je ne t’ai jamais dit ce que j’y avais mis. Il y avait une photographie de toi à trois semaines, dans les bras de ton père, avec ce bonnet ridicule que t’avait tricoté sa mère. Et il y avait une mèche de tes cheveux, dans un petit papier plié. Tu avais beaucoup de cheveux, en naissant. Noirs, comme les siens. J’avais écrit : « Elle s’appelle Nine. C’est un prénom qui ne veut rien dire, on l’a choisi pour ça, pour qu’elle en fasse ce qu’elle voudra. » Ma mère a pleuré longtemps. Pas fort. Longtemps. La mèche de tes cheveux avait attendu quatorze ans, dans une boîte à biscuits, sous le lit d’un enfant malade, à trois mille mètres, qu’on ouvre l’enveloppe. Pour elle, il y avait moins de deux mois.",
     "mentions": [
      "nine",
      "les-lettres"
     ]
    },
    {
     "id": "c6-b63",
     "text": "Vers deux heures et demie, la lettre de tes deux ans. Tu disais tes premiers mots dans l’atelier, assise sur l’établi de ton grand-père, et ce n’étaient ni papa ni maman : c’était « tic » et « tac ». Je l’avais écrit en riant. Derrière la porte, elle a ri aussi, et c’était le même rire.",
     "mentions": [
      "jules-ferrand",
      "atelier-ferrand"
     ]
    },
    {
     "id": "c6-b64",
     "text": "Vers trois heures, la lettre de la mort de papa. Je ne sais pas ce qu’elle a fait. Je n’ai rien entendu. Rien du tout. Le trait de lumière a battu une trentaine de fois sur le mur d’en face, et je n’ai pas entendu tourner la page.",
     "mentions": []
    },
    {
     "id": "c6-b65",
     "text": "Vers quatre heures, mon divorce. Ton père et moi, qui ne nous disputions même plus, qui nous étions trompés de vie sans nous tromper l’un l’autre. Vers cinq heures, les deux dernières : tes dix ans, et celle de l’an dernier. Celle-là, je l’avais écrite quand tu t’étais coupé les cheveux la première fois. Je lui disais que tu me ressemblais, et que ça me faisait peur. Je lui disais : « Je ne sais pas si je suis une bonne mère. Je n’ai pas eu beaucoup d’exemples. » Je l’avais écrit méchamment. Je l’avais écrit à la femme qui, croyais-je, m’écrivait tous les deux ans des lettres tendres et ne revenait jamais. Je l’avais écrit à Orso, en somme. Et c’est elle qui l’a lu.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c6-b66",
     "text": "Pendant la nuit, moi aussi, j’ai écrit une lettre.",
     "mentions": []
    },
    {
     "id": "c6-b67",
     "text": "À toi. Sur du papier gris de l’Hospice, que j’avais demandé à la tourière. Il y a, chaque matin, un porteur qui descend avec le sac des plis. Je voulais qu’il l’emporte. J’ai commencé par la date, les deux dates, la mienne et la tienne. Puis j’ai écrit : « Ma Nine, je ne te demande rien. » Et je me suis arrêtée, la plume en l’air, parce que c’était sa phrase. Pas celle de ma mère. Celle d’Orso. La première ligne de la lettre de Tobie. J’avais repris, sans y penser, la voix que je croyais être celle de ma mère, pour écrire à ma fille, de là-haut. J’ai rayé. J’ai recommencé. J’ai écrit l’heure qu’il était chez moi et l’heure qu’il était chez toi. J’ai écrit que ta grand-mère avait des taches de rousseur. J’ai écrit que je t’aimais sans le mettre à la fin, au milieu, pour qu’il ne ressemble pas à une pièce dans un tronc. Le reste, tu le sais : tu l’as reçue. Tu me l’as dit sur le quai.",
     "mentions": [
      "nine",
      "tobie-ferrand",
      "helene-ferrand"
     ]
    },
    {
     "id": "c6-b68",
     "text": "À la cloche de six heures, la porte s’est ouverte.",
     "mentions": []
    },
    {
     "id": "c6-b69",
     "text": "Ma mère avait les yeux gonflés et les cheveux défaits, et elle tenait à la main la photographie de toi à trois semaines. Elle m’a regardée, et ce n’était plus le regard de la veille. Elle ne cherchait plus la petite fille de douze ans sous la femme de trente-neuf. Elle avait vu passer, en une nuit, toutes celles d’entre les deux. Elle avait vu la lycéenne, l’apprentie, la mariée, la mère, l’orpheline, la divorcée. Elle les avait vues en dix heures. Elle avait fait, en une nuit, ce que j’avais fait en vingt-deux ans. Elle avait l’air aussi épuisée que moi.",
     "mentions": []
    },
    {
     "id": "c6-b70",
     "text": "— Tu as épousé un garçon qui perd les alliances, a-t-elle dit.",
     "mentions": [
      "helene-ferrand"
     ]
    },
    {
     "id": "c6-b71",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c6-b72",
     "text": "— Et tu as divorcé.",
     "mentions": []
    },
    {
     "id": "c6-b73",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c6-b74",
     "text": "— Et ton père est mort pendant que tu étais seule.",
     "mentions": []
    },
    {
     "id": "c6-b75",
     "text": "— J’avais Nine.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c6-b76",
     "text": "— Nine, a-t-elle répété, comme on goûte un mot. Elle a quel âge, maintenant ?",
     "mentions": []
    },
    {
     "id": "c6-b77",
     "text": "— Quinze ans. Depuis quelques jours. Enfin, quelques mois. Depuis la nuit d’avant-hier.",
     "mentions": []
    },
    {
     "id": "c6-b78",
     "text": "Elle a fait le calcul. Je l’ai vue le faire, pour la dernière fois peut-être.",
     "mentions": []
    },
    {
     "id": "c6-b79",
     "text": "— Elle a presque la moitié de mon âge, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c6-b80",
     "text": "Puis elle a regardé la photographie, le bébé dans le bonnet ridicule, et elle a demandé, avec une voix que je ne lui connaissais pas, une voix qui avait vieilli d’une nuit :",
     "mentions": []
    },
    {
     "id": "c6-b81",
     "text": "— Tu en as une plus récente ?",
     "mentions": []
    },
    {
     "id": "c6-b82",
     "text": "J’avais la tienne dans mon portefeuille. Celle de l’an dernier, au lycée, avant les ciseaux. Je la lui ai donnée. Elle l’a prise à deux mains et elle est restée longtemps à la regarder dans la lumière de la galerie, sous le trait qui battait. Tu as ce sourire, sur cette photo, celui où tu ne montres pas les dents parce que tu trouves ton appareil dentaire affreux. Ma mère a souri aussi. Le même, sans les dents.",
     "mentions": []
    },
    {
     "id": "c6-b83",
     "text": "— Elle te ressemble, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c6-b84",
     "text": "— C’est ce qui me fait peur.",
     "mentions": []
    },
    {
     "id": "c6-b85",
     "text": "— Je sais. Je l’ai lu.",
     "mentions": []
    },
    {
     "id": "c6-b86",
     "text": "Et pour la première fois depuis vingt-sept ans, ma mère m’a prise dans ses bras. Elle était plus petite que moi. Elle a dû se mettre sur la pointe des pieds.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-7",
   "number": 7,
   "title": "La chambre haute",
   "blocks": [
    {
     "id": "c7-b01",
     "text": "Le coureur de l’Écluse est arrivé au milieu de la matinée.",
     "mentions": [
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c7-b02",
     "text": "Je l’ai vu de la galerie, par la fente d’un volet. Un garçon maigre, en vareuse verte de douanier, trempé jusqu’à la taille par la neige de la route des mulets, qui traversait la cour en tenant contre lui une sacoche de cuir. Il ne regardait personne. Il allait droit à l’aile du recteur, du pas de quelqu’un qui porte une nouvelle dont il n’est pas responsable. La porte s’est refermée derrière lui. J’ai regardé ma montre. Elle battait à mon poignet, avec la fiole à nouveau dans son ventre, puisque je l’y avais remise la veille au soir, faute de meilleure cachette. Le second cadran disait le trois juillet. Tu étais en vacances.",
     "mentions": [
      "anselme-lestang",
      "double-montre",
      "souche-desquerre"
     ]
    },
    {
     "id": "c7-b03",
     "text": "Je suis retournée dans la chambre. Ma mère faisait la toilette de Tobie avec la cuvette de la veille. Je lui ai dit. Elle n’a pas levé la tête. Elle a continué à passer le gant sur les bras maigres de son fils, lentement, comme si le geste pouvait retenir le temps.",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c7-b04",
     "text": "— Il faut cacher la fiole, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c7-b05",
     "text": "— Où ?",
     "mentions": []
    },
    {
     "id": "c7-b06",
     "text": "Elle a regardé autour d’elle. La chambre, le lit de fer, la table, le poêle, la boîte à biscuits sous le lit. Il n’y avait nulle part où cacher quoi que ce soit dans cette chambre où elle vivait depuis trois mois, et qui avait été fouillée, j’imagine, deux fois par an d’Aval depuis vingt-sept ans.",
     "mentions": [
      "aval",
      "les-lettres"
     ]
    },
    {
     "id": "c7-b07",
     "text": "— Nulle part, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c7-b08",
     "text": "La tourière est venue me chercher à la cloche de dix heures. Deux hommes l’accompagnaient, des hommes de peine en tablier de cuir, larges comme des portes. Ils ne m’ont pas touchée. Ils m’ont encadrée dans le couloir, un de chaque côté, avec une courtoisie de déménageurs.",
     "mentions": []
    },
    {
     "id": "c7-b09",
     "text": "Le recteur Lestang était debout derrière son bureau. Sur l’acajou, à côté de son registre, il y avait une lettre ouverte, et je n’ai pas eu besoin de la lire pour savoir de quelle main elle venait. Il ne m’a pas fait asseoir.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c7-b10",
     "text": "— Madame Ferrand, a-t-il dit. Fille d’Hélène Ferrand, je présume. Sœur de notre petit Tobie.",
     "mentions": [
      "tobie-ferrand",
      "helene-ferrand"
     ]
    },
    {
     "id": "c7-b11",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c7-b12",
     "text": "— Vous voyez que ce n’était pas un nom si courant.",
     "mentions": []
    },
    {
     "id": "c7-b13",
     "text": "Il a pris la lettre. Il l’a lue à voix haute, sans hâte, comme on lit un acte chez le notaire. Montre double, laiton, marque Ferrand, n° 4 417, dérobée au Greffe des Saisies dans la nuit du lundi. Soupçon de contrebande de souche d’Esquerre. Porteuse : femme d’une quarantaine d’années, se disant veilleuse de louage, mains d’horlogère. Accompagnée du revenant O. Lebreuil et d’une enfant suspendue. Signé : A. Coquard, visiteuse.",
     "mentions": [
      "adrienne-coquard",
      "les-suspendus",
      "les-revenants"
     ]
    },
    {
     "id": "c7-b14",
     "text": "— La veilleuse du troisième palier m’a dit ce matin que votre frère avait mangé deux tartines de confiture, a-t-il ajouté en reposant la lettre. Il n’en avait pas mangé une depuis un mois. De chez nous. J’aurais dû comprendre hier, avec la petite Rigal. Je deviens lent. C’est l’endroit, sans doute.",
     "mentions": []
    },
    {
     "id": "c7-b15",
     "text": "Il a tendu la main. Paume ouverte, comme vers un chat.",
     "mentions": []
    },
    {
     "id": "c7-b16",
     "text": "— La fiole, madame.",
     "mentions": []
    },
    {
     "id": "c7-b17",
     "text": "Je n’ai pas bougé. Il a fait un signe. L’un des hommes de peine m’a pris le poignet. Il ne serrait pas. Il n’avait pas besoin de serrer. L’autre a défait le bracelet de ma montre avec des doigts énormes et d’une délicatesse inattendue, et il l’a posée sur le bureau, devant le recteur.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c7-b18",
     "text": "Lestang l’a regardée un long moment, sans la toucher, comme Coquard. Puis il a sorti d’un tiroir une petite trousse de cuir, et de la trousse, un tournevis d’horloger. Il a dévissé le fond. Il l’a fait bien. Il l’a fait mieux que la plupart de mes clients. Il a trouvé la fiole dans son coton et il l’a levée à la lumière de la lampe : trouble, couleur de petit-lait, avec encore quatre septièmes de sa hauteur.",
     "mentions": [
      "adrienne-coquard",
      "souche-desquerre"
     ]
    },
    {
     "id": "c7-b19",
     "text": "— Vivante, a-t-il dit. C’est la première que je vois vivante. Au Greffe, elles meurent toutes. Le froid. C’est très bien fait, le Greffe.",
     "mentions": [
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c7-b20",
     "text": "Il a posé la fiole à côté de son encrier. Puis il a repris la montre.",
     "mentions": []
    },
    {
     "id": "c7-b21",
     "text": "— Et ceci, a-t-il dit. Objet rapide.",
     "mentions": [
      "edit-de-lecluse"
     ]
    },
    {
     "id": "c7-b22",
     "text": "— C’est une montre.",
     "mentions": []
    },
    {
     "id": "c7-b23",
     "text": "— C’est une montre qui vous dit l’heure qu’il est chez votre fille, a-t-il dit. Vous la regardez beaucoup, je l’ai remarqué hier. Tout le monde la regarde beaucoup, les premiers jours. C’est une mauvaise habitude, madame. Ici, on s’en défait.",
     "mentions": []
    },
    {
     "id": "c7-b24",
     "text": "Il a pris une brucelle dans sa trousse. Il a soulevé le pont de balancier. Il a retiré le balancier avec son spiral, d’un seul geste, net, sans rien tordre, comme on retire une écharde. Je l’ai regardé faire, et je n’ai rien dit, et je crois que c’est le moment de toute cette histoire où j’ai eu le plus envie de tuer quelqu’un. Les aiguilles des deux cadrans se sont arrêtées ensemble. Le petit sur dix heures sept. Le grand sur le cinq juillet, onze heures du soir.",
     "mentions": []
    },
    {
     "id": "c7-b25",
     "text": "Il a mis le balancier dans une petite boîte de carton, et la boîte dans son gilet.",
     "mentions": []
    },
    {
     "id": "c7-b26",
     "text": "— Je ne casse rien, madame, a-t-il dit. Je suspends. C’est notre métier.",
     "mentions": [
      "les-suspendus"
     ]
    },
    {
     "id": "c7-b27",
     "text": "Il a rangé sa trousse. Il s’est assis. Il a joint ses longues mains propres sur l’acajou, et il m’a parlé, pendant peut-être une demi-heure, qui a dû être pour toi à peu près deux jours de vacances. Je n’ai jamais oublié ce qu’il a dit. Je vais essayer de le rapporter honnêtement, parce qu’il ne mentait pas, et que c’est ce qui le rendait si difficile à haïr autant que je l’aurais voulu.",
     "mentions": []
    },
    {
     "id": "c7-b28",
     "text": "— Vous me prenez pour un monstre, a-t-il dit. Un homme qui garde des enfants malades pour toucher leur pension. Ce n’est pas faux. Mais regardez les registres. Depuis trois siècles, cette maison a gardé en vie des milliers d’enfants qui seraient morts en bas en quelques mois. La fièvre bleue, le croup, la phtisie, la calcine. Ils sont montés, ils ont attendu, et pour beaucoup, le remède a fini par arriver. Pas pour tous. Pour beaucoup. Sans cette maison, sans l’attente que nous vendons, ils seraient tous au cimetière d’Aval, sous des pierres que plus personne ne fleurit.",
     "mentions": [
      "aval",
      "calcine",
      "pension-daltitude"
     ]
    },
    {
     "id": "c7-b29",
     "text": "« Votre souche guérit la calcine. Très bien. Je m’en réjouis, figurez-vous. Mais pensez un peu plus loin que votre frère. Si elle monte, les familles descendront leurs enfants. Tous. Et après la calcine, dans cinq ans de chez vous, un autre remède pour les cœurs faibles, et les familles descendront ceux-là aussi. Et l’Hospice se videra. Et les pensions cesseront. Et les Lents, qui vivent de nos pensions — oui, madame, les Terrasses vivent de nos pensions, les œuvres des Lents, c’est nous —, les Lents fermeront la maison. Et le jour où viendra une maladie nouvelle, sans remède, et il en viendra toujours une, il n’y aura plus d’Hospice pour la faire attendre. Il n’y aura plus d’endroit au monde où un enfant pauvre puisse gagner cent ans pour trois écus. Voilà ce que vous montez dans votre montre. La fin de l’attente. Pour tous ceux qui en auraient besoin, après.",
     "mentions": [
      "les-terrasses",
      "souche-desquerre",
      "les-lents"
     ]
    },
    {
     "id": "c7-b30",
     "text": "— Et Tobie ?",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c7-b31",
     "text": "— Votre frère a reçu deux doses. Il vivra quelques semaines de plus qu’il n’aurait vécu. Quelques semaines d’ici. Quelques années de chez vous. C’est un beau cadeau que vous lui avez fait. Je ne vous le reprends pas.",
     "mentions": []
    },
    {
     "id": "c7-b32",
     "text": "— Et la fiole ?",
     "mentions": []
    },
    {
     "id": "c7-b33",
     "text": "— Elle montera aux Terrasses, demain, à la cloche de six heures. Il y a un porteur. Les Lents décideront.",
     "mentions": []
    },
    {
     "id": "c7-b34",
     "text": "Je sais ce que ça veut dire, que les Lents décident. Tout Aval le sait. Aux Terrasses, la cote est de mille. Leur conseil siège une après-midi par semaine de chez eux, et une après-midi de chez eux, c’est quatre mois de chez nous. On y a débattu pendant quarante ans d’Aval, dit-on, de la couleur des rideaux de la salle des séances. Et il fait froid, aux Terrasses. La souche n’aimerait pas le froid.",
     "mentions": [
      "les-terrasses",
      "la-cote",
      "les-lents"
     ]
    },
    {
     "id": "c7-b35",
     "text": "— Elle sera morte avant qu’ils aient fini de lire l’ordre du jour, ai-je dit.",
     "mentions": []
    },
    {
     "id": "c7-b36",
     "text": "— C’est possible, a dit le recteur. Je n’y suis pour rien. Je ne suis pas le temps, madame. Je le tiens seulement en ordre.",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c7-b37",
     "text": "Puis il m’a annoncé ce qu’il allait faire de moi.",
     "mentions": []
    },
    {
     "id": "c7-b38",
     "text": "— Vous resterez céans jusqu’au jugement de l’Écluse. La visiteuse viendra vous chercher. Dans une semaine, ou deux, de chez nous, selon les neiges. Vous serez logée à la chambre haute, qui est au-dessus de la maison, dans la roche. Plus haut que nous d’une centaine de mètres. La cote y est de cent trente. L’heure y vaut cinq jours et demi de chez vous. Je peux vous y garder un mois, madame. Je ne vous toucherai pas. Je n’en ai aucun besoin.",
     "mentions": [
      "pas-de-lecluse",
      "chambre-haute"
     ]
    },
    {
     "id": "c7-b39",
     "text": "Il a sonné. Les deux hommes de peine sont rentrés.",
     "mentions": []
    },
    {
     "id": "c7-b40",
     "text": "La chambre haute, on y monte par une échelle de fer scellée dans la paroi, derrière l’aile du recteur, puis par un boyau taillé dans la roche où il faut se courber. C’est une cellule de trois pas sur quatre, avec une paillasse, un seau, une cruche, et une meurtrière pas plus large qu’une main, qui donne sur le vide. Une grille, à l’entrée du boyau. Un cadenas. Les hommes de peine l’ont fermé derrière moi, poliment, et j’ai entendu leurs pas redescendre l’échelle, et puis plus rien.",
     "mentions": []
    },
    {
     "id": "c7-b41",
     "text": "Je n’avais plus de montre.",
     "mentions": []
    },
    {
     "id": "c7-b42",
     "text": "Je ne savais pas, avant cette cellule, à quel point je m’étais accrochée à ce second cadran. À chaque halte, à chaque lacet, à chaque cuillerée de soupe, je le regardais. Je savais où tu en étais. Je le savais à l’heure près. C’était la seule chose qui me reliait à toi, et c’était un mensonge, en un sens, parce qu’une aiguille ne dit rien de ce qu’on vit. Mais c’était mon mensonge. Et Lestang me l’avait retiré avec une brucelle, en quatre secondes, comme une écharde.",
     "mentions": [
      "anselme-lestang",
      "double-montre"
     ]
    },
    {
     "id": "c7-b43",
     "text": "Alors j’ai compté le ciel.",
     "mentions": []
    },
    {
     "id": "c7-b44",
     "text": "Par la meurtrière, je le voyais battre. Plus vite qu’à l’Hospice : là-haut, c’était presque un clignotement, clair, sombre, clair, sombre, un peu plus de cinq fois par heure. Chaque sombre, c’était une nuit de chez toi. J’ai ramassé un clou rouillé dans la poussière et j’ai commencé à faire des traits sur la paroi, à côté de la meurtrière. Un trait par nuit. Des bâtons, par cinq, barrés, comme les prisonniers dans les romans que lisait Capucine. Je suis arrivée à vingt-neuf. Vingt-neuf nuits de toi. Le cinq juillet plus vingt-neuf : le trois août. Le mois où tu vas chez ta tante, à la campagne, d’habitude. J’ai continué. À trente-trois, je me suis endormie, assise contre la paroi, le clou dans la main.",
     "mentions": [
      "capucine-rigal",
      "hospice-longue-veille"
     ]
    },
    {
     "id": "c7-b45",
     "text": "Quand je me suis réveillée, je ne savais plus combien de nuits j’avais dormies.",
     "mentions": []
    },
    {
     "id": "c7-b46",
     "text": "C’est une chose simple et je ne sais pas te la dire. Pour la première fois de ta vie, Nine, je ne savais pas quel âge tu avais. Je savais que tu avais quinze ans. Je ne savais pas si tu étais en septembre ou en décembre, si tu avais froid ou chaud, si tu étais retournée au lycée, si tu avais eu la grippe, si tu m’en voulais encore. Il y a eu, entre mon sommeil et mon réveil, un nombre de nuits que je ne connaîtrai jamais. Cinq ? Quinze ? Je les ai perdues. Elles ne sont nulle part. Elles sont dans ta vie et pas dans la mienne, et je ne peux même pas les compter.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c7-b47",
     "text": "J’ai jeté le clou par la meurtrière.",
     "mentions": []
    },
    {
     "id": "c7-b48",
     "text": "Ma mère est venue un peu avant la cloche du souper. Je l’ai entendue monter l’échelle, puis dans le boyau, puis elle était à la grille, le visage contre les barreaux, comme la femme du soupirail.",
     "mentions": [
      "madame-morand"
     ]
    },
    {
     "id": "c7-b49",
     "text": "— Ils m’ont laissée monter cinq minutes, a-t-elle dit. Il fait semblant d’être humain. Il m’a dit : « Allez voir votre fille. » Il savait. Il savait depuis le début, je crois, que tu étais ma fille. Il attendait seulement la lettre.",
     "mentions": []
    },
    {
     "id": "c7-b50",
     "text": "— Comment va Tobie ?",
     "mentions": [
      "tobie-ferrand"
     ]
    },
    {
     "id": "c7-b51",
     "text": "Elle n’a pas répondu tout de suite.",
     "mentions": []
    },
    {
     "id": "c7-b52",
     "text": "— Il siffle de nouveau, a-t-elle dit. Depuis ce matin. Pas beaucoup. Mais il siffle.",
     "mentions": []
    },
    {
     "id": "c7-b53",
     "text": "Deux doses au lieu de sept. La bête qui s’installe et que l’on affame. Esquerre me l’avait dit, au lavoir : il lui faut ses sept jours. Je me suis assise contre la paroi, de l’autre côté de la grille, et ma mère s’est assise de son côté, et nous sommes restées un moment comme ça, dos à dos, séparées par des barreaux, à trente-neuf et trente-deux ans, et je crois que c’est la première fois de ma vie que je me suis sentie sa contemporaine.",
     "mentions": [
      "pauline-esquerre"
     ]
    },
    {
     "id": "c7-b54",
     "text": "— Et Orso ? ai-je demandé.",
     "mentions": [
      "orso-lebreuil"
     ]
    },
    {
     "id": "c7-b55",
     "text": "— Parti.",
     "mentions": []
    },
    {
     "id": "c7-b56",
     "text": "— Parti où ?",
     "mentions": []
    },
    {
     "id": "c7-b57",
     "text": "— Je ne sais pas. Il est sorti ce matin, avant la cloche de six heures, avec son sac. Il n’a rien dit à personne. La tourière croit qu’il est redescendu. Il fait toujours ça, a-t-elle ajouté, avec une amertume que je ne lui connaissais pas. Il s’en va sans dire au revoir. Il dit que c’est pour ne pas prendre l’habitude.",
     "mentions": []
    },
    {
     "id": "c7-b58",
     "text": "Je n’ai rien répondu. Je lui avais dit, la veille, qu’il était un vieux fou qui s’était fabriqué une famille avec celle des autres. Il était parti. C’était logique. C’était exactement ce que j’aurais fait.",
     "mentions": []
    },
    {
     "id": "c7-b59",
     "text": "Les cinq minutes sont passées. Ma mère est redescendue. Et un peu plus tard, à l’heure du souper, ce n’est pas un homme de peine qui m’a apporté la soupe : c’est une vieille veilleuse, toute petite, voûtée, avec un visage ridé comme une pomme de grenier et des yeux très noirs, très vifs, qui a posé la gamelle de l’autre côté de la grille et ne s’en est pas allée.",
     "mentions": [
      "veilleuses"
     ]
    },
    {
     "id": "c7-b60",
     "text": "— Agathe Sorel, a-t-elle dit. Je vous ai vue arriver, avec la petite Rigal. Je suis de la salle de la Pendule. C’est moi qui tricote près du poêle.",
     "mentions": [
      "agathe-sorel",
      "la-pendule"
     ]
    },
    {
     "id": "c7-b61",
     "text": "Je l’ai reconnue. La veilleuse qui m’avait parlé de la grande aux nattes rousses.",
     "mentions": [
      "mathilde"
     ]
    },
    {
     "id": "c7-b62",
     "text": "— J’étais infirmière, a-t-elle dit. À Aval. À l’hôpital des Tanneurs, quand il y avait encore un hôpital aux Tanneurs. Je suis montée pour un an de chez vous. Un an, je m’étais dit, pour voir, pour aider. Ça fait sept mois. Soixante ans de chez vous. J’ai vu mourir ici quatre cent douze enfants. J’ai leurs noms. Certains avaient attendu cent ans. Cent ans, madame. Pour mourir d’une maladie qu’on soignait en bas depuis vingt.",
     "mentions": [
      "aval"
     ]
    },
    {
     "id": "c7-b63",
     "text": "Elle a regardé la grille, le cadenas, la paillasse, moi.",
     "mentions": []
    },
    {
     "id": "c7-b64",
     "text": "— Je vous ai vue faire l’injection à la petite Rigal. Pas vue. Mais la petite respire. Et le petit Ferrand a mangé de la confiture. Je suis vieille, je ne suis pas sotte. Qu’est-ce qu’il vous faudrait ?",
     "mentions": []
    },
    {
     "id": "c7-b65",
     "text": "Je ne sais pas si c’est à ce moment-là que l’idée m’est venue, ou si elle était là depuis longtemps, depuis le lavoir d’Esquerre, et que j’attendais quelqu’un pour la dire à voix haute. Je me suis entendue répéter les mots d’Esquerre, presque exactement, comme on récite une leçon dont on vient seulement de comprendre le sens.",
     "mentions": [
      "pauline-esquerre"
     ]
    },
    {
     "id": "c7-b66",
     "text": "— Une souche, ça se multiplie, ai-je dit. Dans du lait sucré, au tiède. Elle se double en deux jours. En quinze jours, avec ce qui reste dans la fiole, on en fait de quoi soigner toute la maison. Le problème, c’est les quinze jours. Ici, quinze jours, c’est quinze jours. On n’a pas le temps. Personne n’a le temps.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c7-b67",
     "text": "— Ici, on a tout le temps, a dit Agathe.",
     "mentions": [
      "agathe-sorel"
     ]
    },
    {
     "id": "c7-b68",
     "text": "— Non. Ici, on a du temps pour attendre. On n’en a pas pour faire. Le temps pour faire, il est en bas.",
     "mentions": []
    },
    {
     "id": "c7-b69",
     "text": "Elle m’a regardée. Ses yeux noirs se sont plissés, et elle a eu, dans son visage de pomme ridée, un sourire de gamine.",
     "mentions": []
    },
    {
     "id": "c7-b70",
     "text": "— Vous avez vu le Puits ? a-t-elle demandé.",
     "mentions": [
      "puits-des-vendanges"
     ]
    },
    {
     "id": "c7-b71",
     "text": "Je ne l’avais pas vu. Elle me l’a décrit. Derrière la maison, du côté nord, là où la falaise surplombe, il y a une faille dans la roche, une cheminée naturelle, qui descend droit dans la montagne, sur quinze cents mètres. En bas, il y a une grotte, avec une source chaude, qu’on appelle la Chaudière. Il y fait tiède toute l’année, tiède comme une main. Les fondateurs de l’Hospice, il y a trois siècles, y avaient installé un treuil, pour y descendre leurs tonneaux. Quinze cents mètres plus bas, on est à l’altitude des Granges : la cote y est de trois. Un tonneau descendu une semaine de chez nous remonte avec six mois de cave. Ils faisaient des vins de trente ans en un an. On l’appelle encore le Puits des vendanges. Le treuil est toujours là. Le recteur y fait descendre, de temps en temps, l’eau-de-vie des Lents, pour la vieillir.",
     "mentions": [
      "les-granges",
      "la-cote",
      "les-lents"
     ]
    },
    {
     "id": "c7-b72",
     "text": "J’ai fait le calcul. C’est mon métier, Nine. C’est la seule chose que je sache faire vite.",
     "mentions": [
      "nine"
     ]
    },
    {
     "id": "c7-b73",
     "text": "— Cote de trois en bas, cote de cent ici. Une heure de l’Hospice, c’est trente-trois heures de la Chaudière. Quinze jours de la souche, ça fait… onze heures d’ici. À peu près. Une nuit. Une nuit de l’Hospice. On descend la souche au coucher, dans son lait, et on la remonte au lever, et en bas, pendant notre nuit, elle aura eu ses quinze jours.",
     "mentions": [
      "souche-desquerre"
     ]
    },
    {
     "id": "c7-b74",
     "text": "Agathe a hoché la tête, lentement.",
     "mentions": [
      "agathe-sorel"
     ]
    },
    {
     "id": "c7-b75",
     "text": "— Il faudrait du lait, a-t-elle dit. Du lait de chèvre, il y en a. Du miel, il y en a. Un bidon de cuivre, il y en a un à la laiterie. Il faudrait sortir d’ici. Il faudrait la fiole. Et il faudrait quelqu’un au treuil, pendant toute la nuit, et quelqu’un de plus fort que moi pour le tourner.",
     "mentions": []
    },
    {
     "id": "c7-b76",
     "text": "— La fiole monte aux Terrasses demain à six heures.",
     "mentions": [
      "les-terrasses"
     ]
    },
    {
     "id": "c7-b77",
     "text": "— Alors c’est cette nuit.",
     "mentions": []
    },
    {
     "id": "c7-b78",
     "text": "Elle a repris la gamelle, que je n’avais pas touchée, et elle l’a remise dans mes mains à travers les barreaux.",
     "mentions": []
    },
    {
     "id": "c7-b79",
     "text": "— Mangez, a-t-elle dit. Vous allez avoir besoin de vos bras. Et ne vous inquiétez pas pour le cadenas. Ici, il y a une petite fille de neuf ans qui a volé un livre au Greffe des Saisies. Elle me l’a raconté trois fois.",
     "mentions": [
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c7-b80",
     "text": "Elle est redescendue. J’ai mangé la soupe. Elle était froide. Par la meurtrière, le ciel clignotait, clair, sombre, clair, et en bas, très loin, sous le battement, la plaine d’Aval changeait de couleur, et je ne savais pas de quelle saison il s’agissait, et pour la première fois depuis le début de ce voyage, je n’ai pas cherché à le savoir. J’ai regardé mes mains. J’ai pensé à la serrure à gorges de la cave, à Aval, sur laquelle ton grand-père m’avait appris. Et j’ai attendu la nuit, sans compter.",
     "mentions": [
      "jules-ferrand",
      "aval",
      "ciel-qui-bat"
     ]
    }
   ]
  },
  {
   "id": "chapitre-8",
   "number": 8,
   "title": "Le puits des vendanges",
   "blocks": [
    {
     "id": "c8-b01",
     "text": "La cloche du coucher a sonné huit coups, et la maison s’est éteinte.",
     "mentions": []
    },
    {
     "id": "c8-b02",
     "text": "Je l’ai entendue s’éteindre, de ma cellule. C’est un bruit, une maison qui se couche : des portes, des pas feutrés, une toux ici et là, puis le silence qui descend d’étage en étage comme de l’eau dans un escalier. Par la meurtrière, le ciel continuait de battre. Il ne se couche jamais, lui.",
     "mentions": []
    },
    {
     "id": "c8-b03",
     "text": "Capucine est arrivée une demi-heure plus tard, en chaussettes, avec ma trousse d’horlogère serrée contre son ventre.",
     "mentions": [
      "capucine-rigal"
     ]
    },
    {
     "id": "c8-b04",
     "text": "— Agathe me l’a donnée, a-t-elle chuchoté à travers la grille. Elle était dans ton sac, sous ton lit. J’ai pris l’échelle toute seule. Il y a quarante-deux barreaux. J’ai eu peur au trente et unième.",
     "mentions": [
      "agathe-sorel"
     ]
    },
    {
     "id": "c8-b05",
     "text": "— Tu as été très courageuse.",
     "mentions": []
    },
    {
     "id": "c8-b06",
     "text": "— Je sais, a-t-elle dit.",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "Le cadenas était un cadenas de trois sous, comme on en met aux malles. Il m’a fallu moins de temps que pour le Greffe. En descendant l’échelle, derrière Capucine, un barreau après l’autre, dans le noir, avec la paroi froide contre la joue, j’ai pensé à ton grand-père penché sur la serrure de la cave, et je lui ai dit merci, à voix haute, ce qui a fait sursauter Capucine au dix-neuvième barreau.",
     "mentions": [
      "jules-ferrand",
      "greffe-des-saisies"
     ]
    },
    {
     "id": "c8-b08",
     "text": "L’aile du recteur était obscure. Son bureau donne sur le couloir, et sa chambre sur le bureau, par une porte intérieure. Je l’avais remarqué le matin, entre deux phrases de son sermon : une porte à panneaux, entrouverte, et derrière, un lit bien fait. Un homme qui dort à côté de son registre. Capucine s’est postée à l’angle de la galerie, comme au Pas, et moi je me suis agenouillée devant la serrure du bureau.",
     "mentions": [
      "capucine-rigal",
      "anselme-lestang",
      "pas-de-lecluse"
     ]
    },
    {
     "id": "c8-b09",
     "text": "Serrure à gorges. La même famille que celle du Greffe, un peu plus jeune, un peu plus fine. J’ai travaillé à tâtons, sans bougie. On n’a pas besoin de voir, pour ces choses-là. On a besoin de sentir la lame qui cède, une, puis deux, puis les cinq, et le pêne qui recule d’un cran avec un petit soupir de métal. La porte s’est ouverte sur le noir.",
     "mentions": []
    },
    {
     "id": "c8-b10",
     "text": "Il y avait une lampe de veille dans la chambre du recteur, et par l’entrebâillement de la porte intérieure, elle posait sur le tapis du bureau un trapèze de lumière jaune. Dans ce trapèze, j’ai vu le bas du bureau d’acajou, et ses pieds griffus. Je me suis glissée jusqu’au bureau en restant hors de la lumière. J’entendais Lestang respirer, de l’autre côté. Un souffle long, régulier, d’homme qui dort bien. Un souffle de propriétaire.",
     "mentions": []
    },
    {
     "id": "c8-b11",
     "text": "La fiole n’était plus à côté de l’encrier.",
     "mentions": []
    },
    {
     "id": "c8-b12",
     "text": "J’ai eu, pendant une seconde, cette peur qu’on a en rêve quand on tombe. Puis j’ai pensé : il sait que le froid la tue. Il veut qu’elle arrive vivante là-haut, pour que les Lents voient bien qu’il la leur a montée vivante. Il ne l’a pas laissée sur un bureau, dans une pièce sans feu. J’ai tâté le long du mur jusqu’au poêle de faïence. Il était encore tiède. Sur le rebord, dans une tasse à café, enveloppée d’un mouchoir, il y avait la fiole. À côté, dans une soucoupe, ma montre. Sans son balancier. Deux cadrans morts, qui m’ont regardée comme deux yeux ouverts.",
     "mentions": [
      "souche-desquerre",
      "les-lents"
     ]
    },
    {
     "id": "c8-b13",
     "text": "J’ai pris les deux. En me relevant, j’ai heurté le pare-feu.",
     "mentions": []
    },
    {
     "id": "c8-b14",
     "text": "Ce n’était presque rien. Un petit tintement de cuivre, le bruit d’une cuillère contre une tasse. Dans la chambre, la respiration s’est arrêtée.",
     "mentions": []
    },
    {
     "id": "c8-b15",
     "text": "— Qui est là ?",
     "mentions": []
    },
    {
     "id": "c8-b16",
     "text": "Je n’ai pas bougé. Je n’ai pas respiré. J’ai entendu le lit craquer, le froissement d’une couverture qu’on repousse. Et puis, dans le couloir, derrière moi, une petite voix pâteuse, une voix d’enfant tirée du sommeil, qui traînait sur les voyelles :",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "— C’est moi, monsieur le recteur… Je cherche les cabinets… Je me suis perdue…",
     "mentions": [
      "anselme-lestang"
     ]
    },
    {
     "id": "c8-b18",
     "text": "Un silence. Le lit qui craque de nouveau, dans l’autre sens.",
     "mentions": []
    },
    {
     "id": "c8-b19",
