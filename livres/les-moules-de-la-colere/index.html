      "blocks": [
        { "id": "c1-b01", "text": "On n’enterre pas un mytiliculteur n’importe quand. À Pénestin, même les morts consultent l’annuaire des marées : le curé avait avancé la messe d’une heure « à cause du coefficient », et personne dans l’église n’avait trouvé ça étrange. À part moi. Mais moi, ça faisait seize ans que je n’étais plus d’ici.", "mentions": [] },
        { "id": "c1-b02", "text": "Je m’appelle Gwenn Le Dantec. Je vis à Nantes, où j’audite des sociétés qui maquillent leurs comptes avec l’aplomb tranquille de gens persuadés qu’une auditrice, ça se fatigue avant les chiffres. Mon métier consiste à trouver la ligne qui cloche. Je précise tout de suite, pour l’honnêteté du récit : je n’étais pas venue pour ça.", "mentions": [] },
        { "id": "c1-b03", "text": "L’église du bourg était pleine comme un panier un matin de quinze août. Des cirés du dimanche, des cous rasés de frais, des mains énormes posées sur des missels minuscules. Au premier rang trônait une couronne de fleurs en forme de bouée, barrée d’un ruban : « À Job — la profession ». J’ai mis un moment à comprendre que la profession, ici, c’est la moule.", "mentions": [] },
        { "id": "c1-b04", "text": "Job Le Dantec, mon oncle. Quarante ans de bouchots dans l’estuaire de la Vilaine, et un matin de grande marée on l’avait retrouvé sous son quad retourné, la tête dans dix centimètres d’eau, au milieu de ses lignes du Scal. Accident, avait conclu la gendarmerie. Chagrin, avait résumé le village. Absurdité, avait dit un seul homme — mais celui-là, je ne l’avais pas encore rencontré.", "mentions": [] },
        { "id": "c1-b05", "text": "Le cercueil est sorti de l’église porté par six gaillards qui, à eux tous, devaient soulever plusieurs tonnes de moules par semaine ; il n’a jamais eu l’air si léger. Dehors, le vent d’ouest rabattait les cloches vers l’intérieur des terres, comme pour prévenir la Vilaine. Le cortège a pris à pied la direction du cimetière, et les commerçants baissaient leurs rideaux de fer à mesure qu’on passait — par respect, et aussi, j’imagine, parce que tout le monde était dans le cortège.", "mentions": [] },
        { "id": "c1-b06", "text": "Au bord de la fosse, un homme carré comme une armoire de quai a tourné sa casquette entre ses doigts, puis me l’a plus ou moins tendue avant de se raviser et de me serrer la main à la place — on aurait dit qu’il vissait un boulon. — Fañch. Je faisais les marées avec lui. Il a regardé le trou, l’air de vérifier une profondeur. — Quarante ans qu’on travaille ensemble. C’est la première fois qu’il me pose un lapin.", "mentions": [] },
        { "id": "c1-b07", "text": "Une chienne grise au poil de paillasson s’est assise sur mes pieds pendant toute la mise en terre. Personne ne la tenait en laisse ; elle avait décidé seule de sa place, à l’ancienneté. — Bernique, a dit Fañch. La chienne de Job. Maintenant la tienne, je suppose. Elle a levé vers moi un œil de commissaire-priseur. J’ai eu la très nette impression d’être, moi, l’objet adjugé.", "mentions": [] },
        { "id": "c1-b08", "text": "À Pénestin, la collation d’après-funérailles se compte en litres — de muscadet et de moules. Le Bout du Quai, le café du port de Tréhiguier, avait poussé les tables et sorti les faitouts ; la vapeur sentait l’échalote et le vin blanc, et les conversations, la marée de l’après-midi. On pleure comme on peut. Ici, on pleure en écaillant.", "mentions": [] },
        { "id": "c1-b09", "text": "C’est là que les condoléances ont commencé à ressembler à autre chose. Le premier fut un patriarche magnifique, du sourcil au menton, la poignée de main calibrée pour les inaugurations : Louis-Marie Caradec, m’a soufflé quelqu’un, comme on annonce une météo. Il m’a dit que Job était « le dernier des vrais », a laissé passer exactement trois secondes de recueillement, puis : — Si tu veux vendre, petite, tu viens me voir d’abord. Par respect pour lui. Le respect, dans le coin, ne perdait jamais le nord.", "mentions": [] },
        { "id": "c1-b10", "text": "Le deuxième portait un costume sans cravate et la poignée de main tiède des gens qui comptent vite : Gildas Caradec, le fils cadet. Lui n’a pas parlé de respect ; il m’a glissé une carte de visite. « Vilaine Marée — négoce et expédition de coquillages ». Une carte de visite. À un enterrement. Dans ma profession, on appelle ça une approche commerciale ; dans la sienne aussi, visiblement.", "mentions": [] },
        { "id": "c1-b11", "text": "Le troisième était un voisin de lignes, brave homme au demeurant, qui a rougi jusque sous sa casquette en me demandant si « les concessions allaient se libérer ». Trois offres avant même le café. Quand trois acheteurs se pressent autour d’un actif en deuil, l’auditrice ne dit pas « quelle belle solidarité ». Elle dit « faisceau d’indices » et elle ouvre un dossier.", "mentions": [] },
        { "id": "c1-b12", "text": "— Ne vends pas trop vite. La serveuse, Nolwenn, avait dit ça en remplissant mon verre que je n’avais pas tendu, sans me regarder, sur le ton dont on annonce que la seiche est finie. Puis elle est repartie vers ses faitouts. Le renseignement, à Tréhiguier, se sert comme le muscadet : frais, sec, sans commentaire.", "mentions": [] },
        { "id": "c1-b13", "text": "Le lendemain, l’étude de maître Quémeneur, à La Roche-Bernard, sentait la cire et le secret bien entretenu. Le notaire de la famille est un homme d’un autre siècle — ses dossiers sont ficelés avec de la vraie ficelle — et il a lu le testament comme on lit un relevé de phare : sans emphase, en articulant les chiffres.", "mentions": [] },
        { "id": "c1-b14", "text": "Tout revenait à la nièce, c’est-à-dire à moi : les concessions du Scal et du côté du Halguen, l’atelier de purification au bord de la route de Tréhiguier — avec son agrément sanitaire, a précisé Quémeneur du ton dont on signale une pièce rare —, le chaland, la longère, la chienne. L’entreprise s’appelait « Le Dantec & Fils » parce que mon grand-père avait de l’espoir. Le chaland s’appelait « Fils Unique » parce que Job avait de l’humour. L’un dans l’autre, le fils, désormais, c’était moi.", "mentions": [] },
        { "id": "c1-b15", "text": "Il y avait aussi une dette. Un prêt contracté trois ans plus tôt, « après la daurade », a dit le notaire, comme on date un règne. J’apprendrais plus tard ce que ce poisson au nom de bijouterie avait fait aux bouchoteurs de l’estuaire. Sur le moment, j’ai simplement noté le montant, qui n’était pas un chagrin mais commençait à y ressembler.", "mentions": [] },
        { "id": "c1-b16", "text": "Au moment où je signais, Quémeneur a fait tourner son stylo, ce qui, chez un notaire, équivaut à un aveu de trouble. — Votre oncle est passé me voir, il y a cinq ou six semaines. Il voulait savoir comment mettre des documents « à l’abri ». Je lui ai proposé un coffre, ici même. Il a répondu que c’était trop près de l’église. J’ai cru à une plaisanterie de vieux garçon. Il a reposé le stylo bien parallèle au buvard. — Depuis huit jours, je dors mal.", "mentions": [] },
        { "id": "c1-b17", "text": "Je suis rentrée par le barrage d’Arzal, cette digue têtue qui, depuis 1970, fait croire à la Vilaine qu’elle est un lac. En amont, des centaines de voiliers sages, à couple dans l’eau douce ; en aval, la vase que le fleuve n’a plus la force d’emporter et qui remonte l’estuaire comme un vieux reproche. Job disait : « Le barrage a coupé le fleuve en deux, et nous on vit dans la moitié qui s’envase. » Il votait contre, par principe, à chaque élection, même quand le barrage ne se présentait pas.", "mentions": [] },
        { "id": "c1-b18", "text": "Avant Tréhiguier, j’ai fait le détour par la Mine d’Or. La falaise donnait son numéro du soir : cet ocre qui, au couchant, vire à l’or massif et fait sortir les téléphones des poches. On a vraiment extrait de l’or ici, à la fin du dix-neuvième siècle — si peu qu’on a fini par arrêter. Le nom est resté, comme une promesse non tenue. En contrebas, à marée basse, les alignements de pieux sortaient de l’eau à perte de vue. Le vrai gisement, c’est celui-là. Il faut juste accepter qu’il soit gardé.", "mentions": [] },
        { "id": "c1-b19", "text": "À la longère, Bernique m’attendait devant la porte, assise sur le paillasson exactement comme si c’était elle qui m’hébergeait. Sur la table de la cuisine, les papiers de Job étaient en ordre. C’est ce qui m’a gênée sans que je sache d’abord pourquoi : Job classait ses factures dans une caisse à poissons, par strates, comme un site archéologique. Là, tout était en piles droites, angles alignés. Quelqu’un avait rangé après lui. Ou cherché quelque chose, puis rangé — les gens qui cherchent salement se trahissent, les gens qui rangent trop bien aussi.", "mentions": [] },
        { "id": "c1-b20", "text": "Mon associé m’a appelée à l’heure où Nantes sort des bureaux. Il voulait savoir si « tout était réglé ». J’ai regardé la pile de papiers trop droite, la chienne, le ciel qui tournait au gris d’ardoise. — Réglé, j’ai dit. Lundi, j’avais une mission à Cholet, chez un fabricant de fenêtres. Passionnant, les fenêtres. Étanches, surtout. Aucune ne donne sur l’estuaire.", "mentions": [] },
        { "id": "c1-b21", "text": "Fañch est passé à la nuit tombée, sans prévenir, avec un seau de moules « pour ne pas les perdre ». Il est resté debout dans la cuisine, sa casquette à la main. — Tu restes combien ? — Je repars lundi. Il a hoché la tête comme on encaisse une météo contraire. — Alors je ferai les marées tout seul. Comme ce matin-là. Il a dit ça sans reproche, sans rien. C’est fou ce que les gens d’ici arrivent à mettre dans une phrase sans rien y mettre.", "mentions": [] },
        { "id": "c1-b22", "text": "Je n’ai pas dormi. La maison craquait ses souvenirs, et la mer, quelque part derrière les prés, faisait son travail de mer. Job m’emmenait aux pieux quand j’avais six ans ; il me hissait sur le chaland en me tenant par le col, comme une prise. Il disait que la moule est le seul bétail qui ne s’enfuit pas — ce qui en dit long, ajoutait-il, sur la confiance qu’il accordait au reste du monde.", "mentions": [] },
        { "id": "c1-b23", "text": "À trois heures du matin, j’ai rallumé et j’ai relu mes condoléances chiffrées : trois offres en une journée, dont deux au-dessus de ce que j’aurais osé demander. Dans un marché sain, personne ne surpaie un actif en deuil. Dans un marché sain, on n’enterre pas les vendeurs avant la négociation. J’ai pris mon agenda et j’ai barré Cholet. Les fenêtres attendraient.", "mentions": [] },
        { "id": "c1-b24", "text": "Je suis restée pour une raison très simple, que je n’ai avouée à personne, pas même à la chienne : je voulais comprendre pourquoi tout le monde était si pressé. Et pour une autre, moins simple, qui ne s’est formulée que bien plus tard — ne pas laisser des gens très organisés noyer deux fois mon oncle.", "mentions": [] }
      ]
    },
    {
      "id": "chapitre-2",
      "number": 2,
      "title": "L’inventaire",
      "blocks": [
        { "id": "c2-b01", "text": "L’atelier sentait la marée, l’eau de Javel et le travail bien fait. Sous la charpente, deux rangées de bassins de purification alignaient leur eau claire brassée par les pompes ; au fond, la calibreuse attendait, avec ses grilles de tri, à côté de la table de dégrappage et d’un mur entier de poches et d’étiquettes. Fañch m’a fait la visite avec la solennité d’un conservateur de musée dont le musée sent la moule.", "mentions": [] },
        { "id": "c2-b02", "text": "— Les moules sortent de l’eau, elles passent vingt-quatre à quarante-huit heures ici, dans l’eau propre, à recracher ce qu’elles ont à recracher. Ensuite : dégrappage, lavage, calibrage, et pour les clients délicats on arrache la barbe — le byssus. Après quoi elles voyagent. Il a tapoté un panneau vissé au mur, où s’étalait un numéro d’agrément sanitaire. — Et ça, c’est le passeport. Sans ça, rien ne sort. Job disait : l’agrément, c’est notre signature. Tout ce qui part d’ici part sous notre nom.", "mentions": [] },
        { "id": "c2-b03", "text": "Le métier, Fañch me l’a résumé en une phrase de bilan : — On plante des bâtons dans la mer, on y accroche des bébés moules, on attend, on décroche. Entre-temps, il faut juste que rien ne meure, ne casse, ne se sauve ni ne se vole. Quarante ans que ça marche. Presque tous les ans.", "mentions": [] },
        { "id": "c2-b04", "text": "Le « bébé moule » s’appelle le naissain ; il arrive au printemps des pertuis charentais, capté là-bas sur des cordes en fibre de coco — jeune, entassé, promis à l’estran, comme les étudiants aux petites annonces. On garnit les pieux en enroulant les cordes en spirale, on enfile aux plus jeunes un filet-boudin dont elles ressortent d’elles-mêmes pour s’accrocher, et on coiffe le tout d’un filet plus large, la catin, pour que les tempêtes n’arrachent pas les grappes. J’ai demandé pourquoi « la catin ». Fañch a réfléchi. — Parce que ça retient tout le monde, je suppose. Le vocabulaire du métier a ses réponses ; il vaut mieux ne pas trop les chercher.", "mentions": [] },
        { "id": "c2-b05", "text": "Le bureau de Job occupait l’ancienne resserre : un secrétaire en chêne, un ordinateur d’avant le déluge, et, sur l’étagère, des carnets à spirale classés par années, alignés comme des soldats à l’inspection. Quarante et un carnets. Le quarante et unième s’arrêtait au printemps.", "mentions": [] },
        { "id": "c2-b06", "text": "J’ai fait ce que je fais toujours dans une entreprise inconnue : j’ai pris le dernier carnet et j’ai regardé si les chiffres avaient une écriture régulière. Les chiffres mentent mieux que les mots, mais ils mentent d’une autre main — plus appliquée, plus ronde, celle des choses qu’on recopie au lieu de les constater.", "mentions": [] },
        { "id": "c2-b07", "text": "Rien de tel chez Job. Sa comptabilité tenait du bulletin météo et du livre de bord : tonnages par marée, coefficients, vent, prix, avaries. Et, entre les lignes, des remarques d’une exactitude de poète : « Moules pleines, mer vide. » « Coef 96, dos cassé, cœur content. » « Vendu à V.M. au prix de V.M. — c’est-à-dire le leur. »", "mentions": [] },
        { "id": "c2-b08", "text": "Puis, au 12 mai, plus rien. Trois semaines blanches avant sa mort. Pour un homme qui notait même les jours creux — « RAS. Vent d’ouest. Bernique a mangé un crabe, s’en repent » —, trois semaines de silence, ce n’est pas du silence. C’est un vacarme.", "mentions": [] },
        { "id": "c2-b09", "text": "— Il était comment, en mai ? Fañch a rangé un tas de cordes qui n’en avait pas besoin. — Contrarié. Il allait à Vannes, des après-midis entiers, sans dire pourquoi. Et il a changé les cadenas de l’atelier. Les deux. — Il avait peur de qui ? — Il a jamais eu peur. Il vérifiait. Chez Job, vérifier, c’était sa façon d’aimer les choses.", "mentions": [] },
        { "id": "c2-b10", "text": "Par acquit de conscience professionnelle — bon, d’accord : par déformation —, j’ai ressorti les factures d’électricité. Les bassins tournent aux pompes, les pompes tournent au courant, et le courant se facture au kilowattheure près. Les factures ne font pas de sentiment ; c’est leur grande qualité.", "mentions": [] },
        { "id": "c2-b11", "text": "L’hiver dernier, l’atelier avait consommé comme en pleine saison. Or l’hiver, m’a confirmé Fañch, on vend peu : quelques marchés, les fêtes, et la mer vous rend vos horaires. Décembre, janvier : des semaines entières où les carnets de Job ne signalaient presque aucune expédition — et des compteurs qui, eux, chantaient jour et nuit. Quelqu’un avait fait tourner les bassins à plein régime pendant que les moules de Job, officiellement, dormaient.", "mentions": [] },
        { "id": "c2-b12", "text": "— Les pompes, des fois, on les laisse tourner. Pour l’entretien, a tenté Fañch. — Six semaines ? Il a remis sa casquette. C’est sa façon de plaider le doute raisonnable.", "mentions": [] },
        { "id": "c2-b13", "text": "Le dimanche, je suis allée au marché du bourg, officiellement pour du pain, officieusement parce que les marchés sont aux villages ce que les annexes sont aux bilans : tout ce qui compte y figure en petit. On m’a dévisagée avec cette courtoisie de façade qui vous mesure au millimètre. J’ai appris le prix des fraises, deux rumeurs sur le camping, et le mot que tout le monde évitait : la daurade.", "mentions": [] },
        { "id": "c2-b14", "text": "Entre deux étals, une main m’a serré le bras. Un grand type usé, la cinquantaine embuée, des yeux qui avaient été bleus. — Vous êtes la nièce. Gardez tout. Ou brûlez tout. Mais leur laissez pas. Il a disparu derrière les fraises avant que j’aie trouvé une question. Les oracles, dans le Morbihan, font des phrases courtes.", "mentions": [] },
        { "id": "c2-b15", "text": "— Michel Danion, m’a renseignée Nolwenn au Bout du Quai, l’après-midi. Il avait ses lignes vers la pointe du Bile. Il a « eu la daurade » deux étés de suite — des bancs entiers qui broient les moules sur pied, il paraît que ça fait un bruit de gravier qu’on mâche. Il a vendu. Maintenant il conduit pour les autres. Elle a essuyé un verre. — Lui parlez pas après onze heures. — Du soir ? — Du matin.", "mentions": [] },
        { "id": "c2-b16", "text": "De retour à l’atelier, j’ai fait ce que toute personne saine d’esprit fait face à un deuil incompréhensible : un tableau. Actifs, flux, tiers. Au feutre, sur le tableau blanc où Job notait les commandes. Bernique me regardait faire, couchée sur un tas de filets, avec l’indulgence des vieilles collaboratrices.", "mentions": [] },
        { "id": "c2-b17", "text": "Dans la colonne des tiers, un nom revenait comme un refrain : V.M. Ventes à V.M. Glace achetée à V.M. Transport assuré par V.M. Palettes, étiquettes, consignes : V.M. Vilaine Marée, la maison des Caradec — enfin, de la famille Caradec au sens large, car j’allais apprendre que le sens large, ici, c’est tout le sujet. À Tréhiguier, V.M. n’était pas un partenaire commercial. C’était l’air qu’on respirait.", "mentions": [] },
        { "id": "c2-b18", "text": "En fin de journée, je suis descendue au port voir le chaland. Le Fils Unique attendait le long du quai, gris, plat, cabossé aux bons endroits, avec sa grue et ses poches vides. Au bout de la jetée, l’ancien phare — éteint depuis la fin des années quatre-vingt, quand la vase a déplacé le chenal — tient toujours debout ; on y a installé la Maison de la Mytiliculture, un petit musée où Job jouait les guides bénévoles l’été. « Le seul phare de France, disait-il, reconverti dans l’éclairage des moules. »", "mentions": [] },
        { "id": "c2-b19", "text": "Dans la timonerie, sous le compas, une photo m’attendait depuis des années : moi à dix ans, hilare, brandissant une moule comme une médaille olympique. Je me suis assise dans le noir qui sentait le gazole et la vase. L’audit a ses limites ; il ne prévoit pas de ligne pour ça.", "mentions": [] },
        { "id": "c2-b20", "text": "J’ai rappelé Nantes. Mon associé a pris son ton des mauvais recouvrements : — Tu fais quoi, là-bas, exactement ? Par la vitre de la timonerie, les pieux sortaient de l’eau descendante, alignés jusqu’au coude de l’estuaire, comme des points de suspension plantés par quelqu’un qui n’aurait pas fini sa phrase. — L’inventaire, j’ai dit. Et j’ai raccroché avant la question suivante, qui aurait été raisonnable.", "mentions": [] },
        { "id": "c2-b21", "text": "À deux heures du matin, Bernique a grondé — un grondement de fond de gorge, économe, professionnel. Des phares ont balayé le plafond de la chambre ; un moteur a ronronné au ralenti devant l’atelier, longtemps, puis est reparti vers Tréhiguier sans que personne ne descende. Bernique a jugé l’incident clos et s’est rendormie. Pas moi.", "mentions": [] },
        { "id": "c2-b22", "text": "Avant de me recoucher, j’ai ouvert un carnet neuf — il en restait des vierges sur l’étagère, Job achetait l’avenir par lots — et j’ai écrit, à sa manière : « RAS. Vent d’ouest. Quelqu’un surveille la maison. » Puis, dessous, à la mienne : « Écart inexpliqué : 4 812 kilowattheures. » Le chagrin venait officiellement de changer de catégorie comptable.", "mentions": [] }
      ]
    },
    {
      "id": "chapitre-3",
      "number": 3,
      "title": "Basse mer",
      "blocks": [
        { "id": "c3-b01", "text": "La marée n’attend pas, et Fañch non plus : à cinq heures et demie, son tracteur amphibie ronflait devant la longère, tous feux allumés, avec Bernique déjà installée sur le garde-boue comme une figure de proue. Il conduisait cet engin — roues d’un mètre, échappement en périscope — avec la nonchalance d’un homme dans son fauteuil de salon. Le fauteuil descendait dans la mer, voilà tout.", "mentions": [] },
        { "id": "c3-b02", "text": "L’estuaire à l’aube ressemble à un chantier abandonné par la mer. Elle rend les clés deux fois par jour et reprend tout deux fois par jour, sans jamais signer d’état des lieux. La vasière luisait jusqu’au coude de la Vilaine, trouée de flaques où le ciel se regardait, et les lignes de pieux émergeaient par centaines, noires, coiffées de leurs filets. Au large de nos parcelles, des oiseaux que je ne savais pas nommer faisaient l’ouverture des marchés.", "mentions": [] },
        { "id": "c3-b03", "text": "Fañch m’a mise au travail sans cérémonie. Vérifier les catins après le coup de vent, retendre, remonter ce qui pendait. — Tu tires, tu visses, tu descends. Pas l’inverse. Au troisième pieu, mes mains avaient compris ce que mon master en finance n’avait jamais soupçonné : la moule de bouchot est un produit de luxe fabriqué à la main, dans le vent, par des gens penchés.", "mentions": [] },
        { "id": "c3-b04", "text": "Pour la récolte, il y a la pêcheuse : un tube hydraulique monté sur le chaland, qui coiffe le pieu, verrouille ses panneaux et racle toute la colonne de moules d’un seul mouvement — un dénoyauteur géant, en somme. Fañch la manœuvre au centimètre. J’ai demandé si c’était difficile. Il a réfléchi le temps réglementaire. — Trente ans pour le geste. Dix minutes pour l’explication. On a fait les dix minutes.", "mentions": [] },
        { "id": "c3-b05", "text": "La vasière m’a pris une botte — la gauche — avec un bruit de ventouse satisfaite, et j’ai fini la marée un pied en chaussette dans une poche à moules vide nouée à la cheville, invention de Fañch brevetée d’un haussement d’épaules. Il n’a pas ri. Ses épaules, si. Bernique, elle, a eu la délicatesse de regarder ailleurs, vers la pointe du Halguen, où des silhouettes grattaient le sable à la recherche de palourdes.", "mentions": [] },
        { "id": "c3-b06", "text": "Au retour, Fañch a arrêté le tracteur entre deux lignes, sans prévenir, et a coupé le moteur. L’endroit ne payait pas de mine : du sable dur, des flaques, les pieux du Scal en rangs sages. — C’est là. Le quad était retourné là. Lui dessous. J’ai regardé le sable, plat comme une table de conférence. Les quads ne se retournent pas sur du billard. Fañch regardait ailleurs. — Je l’ai dit, aux gendarmes. Ils ont dit : la fatigue, la nuit, l’âge. Job, fatigué ? Il dormait avant ses moules et se levait après elles. Enfin, avant. Tu me comprends.", "mentions": [] },
        { "id": "c3-b07", "text": "— Et le quad, il est où ? — Fourrière, expertise. « Défaillance de direction. » Fañch a remis le contact. — Job entretenait son matériel comme d’autres leur salut. La direction de ce quad, je l’ai graissée moi-même en avril. Le tracteur est reparti dans un nuage de gazole. Sur le sable dur, la marée montante commençait déjà à effacer nos traces, méthodique, comme une femme de ménage payée par quelqu’un.", "mentions": [] },
        { "id": "c3-b08", "text": "Le quai de Tréhiguier, à la débarque, tient du ballet et de la cour de récré : chalands à couple, grues qui pivotent, poches qui volent, tracteurs en double file. Les Bouchots Caradec occupaient le centre de la scène — trois chalands, six gaillards, un panneau publicitaire grand comme ma cuisine. Louis-Marie trônait au milieu, bras croisés, dans la posture universelle des hommes qui n’ont plus besoin de porter pour diriger.", "mentions": [] },
        { "id": "c3-b09", "text": "Il a inspecté ma dégaine — botte droite, chaussette gauche, vase jusqu’aux sourcils — avec une bienveillance d’ogre. — Alors, on apprend le métier ? Deux marées et tu sauras pourquoi on ne le vend pas aux touristes. Trois, et tu sauras pourquoi on ne le vend pas du tout. Il souriait de toutes ses dents. Ses fils, aucun.", "mentions": [] },
        { "id": "c3-b10", "text": "Erwan, l’aîné, a la carrure d’un pieu de chêne et à peu près sa conversation. À mon passage, il a soulevé une poche de cinquante kilos pour la reposer trois mètres plus loin, sans nécessité logistique apparente. Message reçu. Gildas, lui, a traversé le quai exprès pour me demander si j’avais « réfléchi à la proposition ». Au singulier. Comme s’il n’en avait jamais existé qu’une seule au monde — la leur.", "mentions": [] },
        { "id": "c3-b11", "text": "Puis Louis-Marie m’a parlé de Job, et c’est là que mon dossier s’est compliqué : l’émotion ne s’invente pas à ce niveau-là. La voix qui accroche, les yeux qui partent chercher le coude de l’estuaire. « Le dernier qui savait lire l’eau », il a dit. J’ai pensé : voilà le problème des patriarches. Le cœur est sincère, et la maison est pleine de courants d’air.", "mentions": [] },
        { "id": "c3-b12", "text": "Louis-Marie préside le Syndicat libre des bouchoteurs de l’estuaire — « libre » étant, comme souvent dans les intitulés, le mot qui travaille le plus. Le syndicat fixe les tours de débarque, arbitre les bisbilles de bornage et, surtout, prépare le gré à gré : la grand-messe d’avant-saison où les prix de l’année se décident autour d’une table. — Devine qui tient la table, a dit Nolwenn en posant mon café, avant que j’aie posé la question. Je commençais à soupçonner cette femme de servir aussi autre chose que du muscadet : de l’exposition des risques.", "mentions": [] },
        { "id": "c3-b13", "text": "L’après-midi, paperasse. J’ai épluché le classeur « Agrément » de l’atelier : numéros, contrôles, bordereaux d’expédition avec leurs étiquettes de salubrité — ces petites vignettes qui suivent chaque lot de coquillages de l’estran à l’assiette, et qui disent : celui-ci vient de chez nous, tel jour, telle zone. C’est fait pour rassurer. C’est fait pour responsabiliser. C’est aussi, ai-je pensé beaucoup plus tard en me maudissant d’avoir mis si longtemps, une signature qu’on peut voler.", "mentions": [] },
        { "id": "c3-b14", "text": "La gendarmerie maritime est arrivée avec la marée du soir : un semi-rigide gris, deux silhouettes en bleu, et ce ralenti particulier des gens dont l’arrivée n’est jamais une bonne nouvelle pour quelqu’un. Contrôle de routine, m’a-t-on dit. Le maréchal des logis-chef Simon Morvan, brigade de surveillance du littoral, a vérifié mes papiers tout neufs avec une lenteur d’horloger. — Tout est en règle, a-t-il conclu, presque déçu.", "mentions": [] },
        { "id": "c3-b15", "text": "Morvan a des yeux qui ont lu trop de procès-verbaux et pas assez dormi, et cette politesse un peu raide des gens qui passent leur vie à dire des choses désagréables à des gens qu’ils reverront au marché. Il a flatté Bernique, qui s’est laissée faire — première recommandation positive du dossier. — Toutes mes condoléances, au fait. Votre oncle était… Il a cherché le mot réglementaire, ne l’a pas trouvé. — …quelqu’un de précis.", "mentions": [] },
        { "id": "c3-b16", "text": "J’ai posé la question en regardant l’estuaire, pour lui laisser la sortie : est-ce que « quelqu’un de précis » se retourne tout seul sur du sable plat ? Il a laissé passer deux vagues. — Votre oncle a appelé la brigade mi-mai. Il voulait un rendez-vous. Pas au téléphone, il a dit. C’était fixé au 3 juin, à Vannes. Il est mort le 31 mai. J’ai fait le calcul à voix haute : trois jours. Morvan n’a pas corrigé.", "mentions": [] },
        { "id": "c3-b17", "text": "— Et ça ne vous a pas paru… — Si, il a coupé. Ça m’a paru. Mais un « ça m’a paru » n’ouvre pas une enquête ; une preuve, oui. L’expertise dit défaillance, le parquet dit accident, et moi je dis ce qu’on me dit de dire. Il a remis sa casquette, et au moment de remonter à bord : — Vous trouvez la ligne qui cloche, madame Le Dantec, vous me l’apportez. C’est votre métier, non ? Le renseignement, décidément, circulait vite dans l’estuaire. Plus vite que la vase.", "mentions": [] },
        { "id": "c3-b18", "text": "Le soir, dans la cuisine, j’ai ouvert mon carnet et j’ai écrit : « Constat n° 3 — Un homme méthodique demande un rendez-vous discret à la gendarmerie, change ses cadenas, cesse de tenir son journal, et meurt trois jours avant le rendez-vous, sous un quad qu’il graissait lui-même, sur du sable plat. » J’ai relu. En audit, on appelle ça une anomalie significative. Ici, on devait bien avoir un mot aussi. Personne ne semblait pressé de me l’apprendre.", "mentions": [] },
        { "id": "c3-b19", "text": "Bernique s’est endormie sur le carnet, ce qui clôturait la séance. Dehors, la marée remontait sans bruit sur le Scal, recouvrant les lignes, l’endroit du quad, nos empreintes du matin et tout ce que le sable aurait pu encore raconter. C’est le problème, avec la mer : c’est une scène de crime qu’on nettoie deux fois par jour.", "mentions": [] }
      ]
    },
    { "id": "chapitre-4", "number": 4, "title": "Les moules parlent espagnol", "blocks": [] },
    { "id": "chapitre-5", "number": 5, "title": "La part du crabe", "blocks": [] },
    { "id": "chapitre-6", "number": 6, "title": "Le phare qui ne dit rien", "blocks": [] },
    { "id": "chapitre-7", "number": 7, "title": "Byssus et coutumes", "blocks": [] },
    { "id": "chapitre-8", "number": 8, "title": "Gré à gré", "blocks": [] },
    { "id": "chapitre-9", "number": 9, "title": "La visite", "blocks": [] },
    { "id": "chapitre-10", "number": 10, "title": "Coefficient 108", "blocks": [] },
    { "id": "chapitre-11", "number": 11, "title": "L’addition", "blocks": [] },
    { "id": "chapitre-12", "number": 12, "title": "La saison", "blocks": [] }
  ],
  "codex": []
}
</script>
<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));
svg.innerHTML=links.map(l=>{const a=pos[l.from],b=pos[l.to];return '<line class="edge" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"><title>'+esc(l.nature||"")+'</title></line>'}).join("")
+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);
return '<g class="node'+(shown?"":" locked")+'"'+(shown?' data-open-entry="'+escA(n.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Entité non révélée"')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4"/>'+(shown?'<text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+esc(label)+'</text>':"")+'</g>'}).join("");
const revealed=nodes.filter(n=>open(n.codexId)).length;
$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");
$("#relations-list").innerHTML=links.length?links.map(l=>'<li><strong>'+esc(nodeTitle(nodes.find(n=>n.codexId===l.from),l.from))+' — '+esc(nodeTitle(nodes.find(n=>n.codexId===l.to),l.to))+'</strong><br><span class="viz-nature">'+esc(l.nature||"Lien non qualifié")+'</span></li>').join(""):'<li class="empty">Aucun lien n\u2019est encore révélé.</li>';
wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
