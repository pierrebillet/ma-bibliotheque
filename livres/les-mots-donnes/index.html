     "text": "Sur la rive d’ombre, à l’ancrage de l’est, Séverin s’arrêta devant l’autre nœud, le mort, celui du grand rouquin. Un gros nœud de Retenue défait à moitié, dont les torons pendaient comme des doigts ouverts. Il tira de sa manche sa ficelle grise, la sienne, et fit sur le câble du nord, à un pied du nœud mort, un nœud de Retenue neuf, serré, sans un mot dedans.",
     "mentions": []
    },
    {
     "id": "c4-b68",
     "text": "— À sec, dit-il en voyant qu’elle regardait. Un nœud sans mot, pour marquer la place. Le compagnon qui viendra saura où reprendre. Et il saura qu’une fileuse a tenu le pont avant lui avec une ficelle de sept ans. Ça lui fera du bien.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "Le chemin quittait le pont et montait au nord, dans les pins tordus, vers Sombreval. La pluie continuait. Ils marchèrent jusqu’au soir, Garance devant, qui ne parlait plus, et la mule légère, et Bastien qui portait un sac vide, et Séverin derrière, et au milieu Aube, le poignet nu, qui tenait de la main droite son poignet gauche sans s’en apercevoir, comme on tient une place.",
     "mentions": []
    },
    {
     "id": "c4-b70",
     "text": "Ils firent halte sous un surplomb, à la nuit. Garance alluma un feu de branches de pin qui fumait plus qu’il ne chauffait, sortit de son manteau ce qui n’avait pas été dans la charge : une demi-tomme, un quignon, un oignon, et partagea en quatre, à voix haute, avec les prix. Elle tendit sa part à Aube.",
     "mentions": []
    },
    {
     "id": "c4-b71",
     "text": "Aube la regarda. Elle ouvrit la bouche pour dire qu’elle ne payait pas, et que par conséquent, et qu’elle n’avait pas… et elle chercha le mot, et il n’était pas là, et à sa place il y avait la chose au ventre, sans contour, et elle ferma la bouche.",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "Garance ne la laissa pas la rouvrir. Elle lui mit le pain dans la main, comme Hersende, sans manières.",
     "mentions": []
    },
    {
     "id": "c4-b73",
     "text": "— Je fais le compte, dit-elle. Mange.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "Les anneaux de Sombreval",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "Les pruniers étaient en fleur dans les ruines.",
     "mentions": [
      "sombreval"
     ]
    },
    {
     "id": "c5-b02",
     "text": "C’était la première chose qu’on voyait de Sombreval, en montant par la rive d’ombre : non pas les murs, ni l’éboulis, ni le château, mais cette écume blanche accrochée à la pente entre les pierres grises, si légère dans la pluie qu’on la prenait pour de la brume. Les pruniers avaient été plantés en lignes, deux siècles plus tôt, par des gens qui comptaient les cueillir. Ils s’étaient passés de tout le monde. Ils poussaient dans les maisons, par les portes, à travers les toits effondrés, et ils fleurissaient comme si de rien n’était, et les pétales tombaient sur l’éboulis, et l’éboulis les buvait.",
     "mentions": []
    },
    {
     "id": "c5-b03",
     "text": "— On ne s’arrête pas ici, dit Garance.",
     "mentions": []
    },
    {
     "id": "c5-b04",
     "text": "— Il pleut à ne plus voir le chemin, dit Séverin, et la Tende monte. Regarde-la. On s’arrête où il y a un toit.",
     "mentions": []
    },
    {
     "id": "c5-b05",
     "text": "Ils s’arrêtèrent. La Tende, en effet, montait. Elle avait changé de voix dans la nuit ; la veille, elle était blanche et rapide ; ce matin, elle était brune, et elle avait ce grondement continu, sans respiration, que les gens des gorges connaissaient et n’aimaient pas. Elle charriait des branches. Elle charriait, à un moment, une porte entière, peinte en vert, qui tourna deux fois sur elle-même et disparut.",
     "mentions": [
      "la-tende",
      "la-fonte"
     ]
    },
    {
     "id": "c5-b06",
     "text": "— Huit jours d’avance, dit Garance en la regardant passer. Elle a huit jours d’avance, cette Fonte. C’est parti pour de bon.",
     "mentions": []
    },
    {
     "id": "c5-b07",
     "text": "Personne ne fit le compte à voix haute, mais tout le monde le fit. Douze jours moins trois. La lune dans neuf. Et un lac, en bas, qui buvait cette eau brune, porte verte comprise, et montait vers la marque.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "Le village était sous l’éboulis, ou plutôt l’éboulis était dans le village. Deux siècles plus tôt, un pan de la falaise s’était détaché au-dessus de Sombreval, et il était descendu, et il n’était pas reparti. On voyait encore la forme du coup : une langue de pierres grosses comme des mules, grosses comme des maisons, qui commençait très haut, sous une entaille pâle dans le roc, et finissait dans les ruelles, en enfonçant les murs, en remplissant les caves, en laissant çà et là un pignon debout par oubli. Au-dessus de tout, sur son piton, le château du sire de Sombreval n’avait rien reçu. Il était tombé de vieillesse, plus tard, doucement ; on voyait la différence.",
     "mentions": []
    },
    {
     "id": "c5-b09",
     "text": "Ils trouvèrent un toit : une grange à demi enfoncée dont la voûte de pierre avait tenu, et dont le fond était plein de terre et de pétales. Garance attacha Vergogne sous la voûte, Bastien fit du feu avec des lattes de porte, et Séverin alla voir la Tende, et revint, et dit qu’elle montait toujours.",
     "mentions": []
    },
    {
     "id": "c5-b10",
     "text": "Ce fut Bastien qui posa la question, parce que c’était lui qui avait lu les livres.",
     "mentions": []
    },
    {
     "id": "c5-b11",
     "text": "— C’est ici, dit-il. La veillée qui a échoué. Celle dont la Corderie se sert pour dire qu’on ne noue pas à plusieurs.",
     "mentions": []
    },
    {
     "id": "c5-b12",
     "text": "— C’est ici, dit Séverin.",
     "mentions": []
    },
    {
     "id": "c5-b13",
     "text": "— Raconte.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "Séverin s’assit contre le mur, les mains autour d’un bol d’eau de pluie, et il raconta, de la voix égale qu’il avait pour tout, comme s’il lisait une page du Registre, et peut-être en lisait-il une, de mémoire.",
     "mentions": [
      "la-veillee"
     ]
    },
    {
     "id": "c5-b15",
     "text": "— An 118 de la Levée. Le sire de Sombreval s’appelait Amaury ; c’était avant les Maisons, quand la vallée avait des sires. La falaise se fendait au-dessus du village. Il n’y avait pas de compagnon à Tressaille qui veuille monter la tenir : c’était un rocher, c’était loin, ça ne valait pas une vie de mots. Alors le sire a fait ce que faisaient les Hauts, à ce qu’on disait : une veillée. Il a fait courir une corde au pied de la falaise, du bout à l’autre du village, et il a fait venir tous ses gens, et chacun a noué sa cordelette sur la corde, une demi-clé, et chacun a donné un mot. Trois cents personnes. Trois cents mots. Trois cents petits nœuds, et le rocher tenu par tout le monde et par personne.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— Et ?",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "— Et la falaise est descendue le mois suivant, et voilà le village. On a compté cent quarante morts. Le sire n’a rien eu, il était dans sa tour. La Corderie a écrit une page là-dessus, on la lit aux apprentis la première année : « un mot menti ne tient rien, et dans trois cents bouches il y a toujours un menteur. » Il suffit d’un. Un seul qui donne un mot qu’il n’a pas vécu, ou qu’il ne veut pas donner, et sa demi-clé est fausse, et la corde n’est plus une corde, c’est une chaîne avec un maillon de bois. C’est pour cela qu’on ne noue pas à plusieurs. C’est pour cela qu’une reprise, c’est une bouche. Une seule, dont on connaît le poids, et qui a dit oui.",
     "mentions": [
      "la-grande-reprise"
     ]
    },
    {
     "id": "c5-b18",
     "text": "Il avait dit cela sans regarder Aube, ce qui revenait à la regarder.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "— C’est la version de Tressaille, dit Garance.",
     "mentions": []
    },
    {
     "id": "c5-b20",
     "text": "— C’est la version du Registre.",
     "mentions": []
    },
    {
     "id": "c5-b21",
     "text": "— Le Registre est à Tressaille. Ici, on chante autre chose. Ma grand-mère la chantait à Pont-Sauvage en écossant les haricots, et je peux te dire qu’elle n’avait pas lu le Registre.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "Et Garance, qui ne chantait jamais, qui parlait comme d’autres respirent et n’avait pas de voix pour autre chose, chanta. Ce fut court, et faux, et cela leur ferma la bouche à tous.",
     "mentions": []
    },
    {
     "id": "c5-b23",
     "text": "Le sire a mis ses gens à la corde",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "comme on met les bœufs au joug,",
     "mentions": []
    },
    {
     "id": "c5-b25",
     "text": "il a dit : donnez, ou la tour vous regarde,",
     "mentions": []
    },
    {
     "id": "c5-b26",
     "text": "et la tour avait des yeux partout.",
     "mentions": []
    },
    {
     "id": "c5-b27",
     "text": "Ils ont donné ce qu’on leur prenait,",
     "mentions": []
    },
    {
     "id": "c5-b28",
     "text": "et la pierre a su que c’était pris,",
     "mentions": []
    },
    {
     "id": "c5-b29",
     "text": "et la pierre est venue le chercher",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "jusque dans le lit des petits.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "— Ça ne dit pas qu’ils ont menti, dit Bastien à mi-voix.",
     "mentions": []
    },
    {
     "id": "c5-b32",
     "text": "— Ça dit qu’on leur a pris. Ce n’est pas la même chose.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "— Un mot pris ne tient rien, dit Séverin. Un mot menti ne tient rien. Le résultat est le même.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "— Le résultat, oui, dit Garance. La faute, non.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "Ils se turent. La pluie tombait sur la voûte, et la Tende grondait en bas, et Vergogne mâchait des pétales avec un air de reproche.",
     "mentions": []
    },
    {
     "id": "c5-b36",
     "text": "Ce fut Aube qui se leva. Elle ne l’avait pas décidé plus que le reste. Elle sortit sous la pluie, dans les ruelles envahies, et Bastien la suivit, puis Séverin, et Garance resta avec la mule et cria qu’ils étaient fous.",
     "mentions": []
    },
    {
     "id": "c5-b37",
     "text": "Elle cherchait la corde. Pas la corde elle-même, qui avait pourri en deux siècles ou qu’on avait volée, mais la place de la corde : une corde de veillée, avait dit Séverin, courue au pied de la falaise, du bout à l’autre du village. Il fallait bien qu’elle tienne à quelque chose. Elle longea le bas de l’éboulis, là où il touchait les premières maisons, en écartant les branches des pruniers, et elle les trouva au troisième mur.",
     "mentions": []
    },
    {
     "id": "c5-b38",
     "text": "Des pierres de corde. Elle connaissait cela : de gros blocs équarris, scellés dans les murs à hauteur de poitrine, percés d’un anneau de fer forgé, comme aux ancrages des ponts et aux quais du Déversoir. Il y en avait un tous les dix pas, sur toute la longueur du mur, et le mur continuait sous l’éboulis. Les anneaux étaient rouillés jusqu’à l’os, gros comme un poing.",
     "mentions": []
    },
    {
     "id": "c5-b39",
     "text": "— La corde passait là, dit Séverin. D’anneau en anneau. C’est bien fait.",
     "mentions": []
    },
    {
     "id": "c5-b40",
     "text": "— Il y en a d’autres, dit Bastien.",
     "mentions": []
    },
    {
     "id": "c5-b41",
     "text": "Il s’était penché. Sous chaque grand anneau, à hauteur de hanche, il y en avait un petit. Un anneau de la taille d’un poignet d’homme, avec, encore accrochés à certains, deux ou trois maillons d’une chaîne courte, rongés, qui se terminaient en rien. Un petit anneau sous chaque grand. Un tous les dix pas.",
     "mentions": []
    },
    {
     "id": "c5-b42",
     "text": "Personne ne dit ce que c’était. On le voyait.",
     "mentions": []
    },
    {
     "id": "c5-b43",
     "text": "— Pour tenir la corde, dit Séverin, sans conviction.",
     "mentions": []
    },
    {
     "id": "c5-b44",
     "text": "— Une corde de veillée, on la tient avec un grand anneau, dit Aube. Tu l’as dit toi-même. Celui-là est à hauteur de poignet. Et il y a des chaînes.",
     "mentions": []
    },
    {
     "id": "c5-b45",
     "text": "— Ils étaient attachés, dit Bastien. On les a attachés à la corde pour qu’ils nouent. Chacun devant son anneau. Chacun avec sa cordelette et une chaîne au poignet, et la tour qui regarde. Et ils ont donné ce qu’on leur prenait.",
     "mentions": []
    },
    {
     "id": "c5-b46",
     "text": "Séverin ne répondit pas tout de suite. Il posa la main sur un des petits anneaux, comme il l’avait posée sur le nœud mort de Pont-Sauvage, et il le tint un long moment, et la rouille lui rougit la paume.",
     "mentions": []
    },
    {
     "id": "c5-b47",
     "text": "— Le Registre ne dit pas cela, dit-il enfin.",
     "mentions": []
    },
    {
     "id": "c5-b48",
     "text": "— Le Registre est à Tressaille, dit Aube.",
     "mentions": []
    },
    {
     "id": "c5-b49",
     "text": "Il retira sa main. Il la regarda, elle, pour la première fois depuis Pont-Sauvage avec cette expression qu’il avait eue devant son nœud de gabare : celle d’un homme qui connaît ses cordes et qui en trouve une qu’il ne connaît pas.",
     "mentions": []
    },
    {
     "id": "c5-b50",
     "text": "— Ça ne prouve pas que trois cents mots choisis tiendraient, dit-il. Ça prouve que trois cents mots pris n’ont pas tenu. Personne n’a jamais essayé l’autre.",
     "mentions": []
    },
    {
     "id": "c5-b51",
     "text": "— Les Hauts, dit Bastien.",
     "mentions": []
    },
    {
     "id": "c5-b52",
     "text": "— Les Hauts tiennent des granges. Pas des lacs.",
     "mentions": []
    },
    {
     "id": "c5-b53",
     "text": "— Tu n’en sais rien.",
     "mentions": []
    },
    {
     "id": "c5-b54",
     "text": "— Non, dit Séverin. Je n’en sais rien. C’est ce que j’ai dit.",
     "mentions": []
    },
    {
     "id": "c5-b55",
     "text": "Ils rentrèrent sous la voûte. La pluie redoublait ; le soir venait dans la journée. Garance leur jeta un regard, comprit qu’ils avaient trouvé quelque chose qu’elle savait déjà, et ne demanda rien.",
     "mentions": []
    },
    {
     "id": "c5-b56",
     "text": "Ce fut ce soir-là que Séverin apprit à Aube à nouer.",
     "mentions": []
    },
    {
     "id": "c5-b57",
     "text": "Il ne le proposa pas ; il le fit. Il tira de sa manche une longueur de sa ficelle grise, la coupa en deux d’un coup de dents, en donna une moitié à Aube et garda l’autre, et lui montra, sur un bâton de porte, le nœud de Retenue.",
     "mentions": []
    },
    {
     "id": "c5-b58",
     "text": "— Tu as noué une fois avec un mot lourd et un nœud de gabare, dit-il. Ça a tenu parce que le nœud d’amarre tient de lui-même, il est fait pour ça. Mais si tu dois nouer encore, et tu le devras, sur ce chemin, avant la lune, dans un sens ou dans l’autre, alors autant que tu ne perdes pas un mot pour un nœud qui glisse. Un nœud faux avec un mot vrai, c’est un mot perdu pour rien. Le nœud d’abord. Le mot après. Regarde.",
     "mentions": []
    },
    {
     "id": "c5-b59",
     "text": "Il noua. Ses mains étaient ce qu’on disait aux fileuses qu’elles étaient : pas rapides, exactes. Le nœud de Retenue était une chose compliquée, un nœud dans un nœud, un tour qui passait dans sa propre boucle et revenait se coincer sous lui-même, de sorte qu’en tirant sur n’importe quel bout on ne faisait que le serrer. Il le défit. Il le refit, plus lentement. Il le défit et posa la ficelle dans les mains d’Aube.",
     "mentions": [
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c5-b60",
     "text": "Elle le fit du premier coup.",
     "mentions": []
    },
    {
     "id": "c5-b61",
     "text": "Il la regarda. Elle haussa les épaules.",
     "mentions": []
    },
    {
     "id": "c5-b62",
     "text": "— Trois ans de long brin. Je noue des bouts d’écheveau tout le jour. Ce n’est pas plus difficile qu’une épissure.",
     "mentions": []
    },
    {
     "id": "c5-b63",
     "text": "— C’est plus difficile qu’une épissure.",
     "mentions": []
    },
    {
     "id": "c5-b64",
     "text": "— Alors j’ai eu de la chance.",
     "mentions": []
    },
    {
     "id": "c5-b65",
     "text": "Il eut un demi-sourire, le premier, et lui montra la demi-clé de veillée, qui était simple, et la clé de plaie, et comment on rentre un bout pour qu’il ne se reprenne pas, et comment on serre : pas d’un coup, mais en trois temps, en écoutant, parce qu’une corde qu’on serre trop vite crie et qu’une corde qui crie n’a pas fini de bouger. Elle apprit. Elle apprenait vite, non parce qu’elle était douée, pensa-t-elle, mais parce qu’on lui avait refusé si longtemps qu’elle avait tout regardé, depuis le bat-flanc, sans en avoir l’air.",
     "mentions": []
    },
    {
     "id": "c5-b66",
     "text": "Bastien regardait aussi. Au bout d’un moment, il dit :",
     "mentions": []
    },
    {
     "id": "c5-b67",
     "text": "— Je peux ?",
     "mentions": []
    },
    {
     "id": "c5-b68",
     "text": "Séverin le considéra. Puis, sans un mot, il lui tendit une longueur de ficelle, une de la sienne, et une pierre de la taille d’un pain.",
     "mentions": []
    },
    {
     "id": "c5-b69",
     "text": "— Nœud d’amarre autour de la pierre. Tu sais le faire, tout le monde sait le faire. Ensuite, un mot. Pas un mot qui te manque. Un que tu as en trop.",
     "mentions": []
    },
    {
     "id": "c5-b70",
     "text": "— Ça ne tiendra pas. L’âme n’est pas la mienne.",
     "mentions": []
    },
    {
     "id": "c5-b71",
     "text": "— Non. Ça ne tiendra pas. Fais-le quand même.",
     "mentions": [
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c5-b72",
     "text": "Bastien noua. Il noua bien, avec soin, en tirant la langue, et il approcha la bouche du nœud, et Aube le vit hésiter, chercher, refuser quelque chose, et choisir. Il serra.",
     "mentions": []
    },
    {
     "id": "c5-b73",
     "text": "Rien ne se passa. La pierre resta une pierre, avec une ficelle autour. Bastien resta Bastien. Il rouvrit la bouche et, à voix basse, pour voir, dit :",
     "mentions": []
    },
    {
     "id": "c5-b74",
     "text": "— Faim.",
     "mentions": []
    },
    {
     "id": "c5-b75",
     "text": "Le mot vint. Il le regarda venir avec une espèce de désolation.",
     "mentions": []
    },
    {
     "id": "c5-b76",
     "text": "— Tu as pris celui-là, dit Séverin, parce que tu l’as vu tenir un pont. Tu n’y as pas droit. Tu l’as en trop pour de bon : tu ne l’as jamais eu. Un mot qu’on n’a pas vécu ne pèse rien, et un nœud ne peut pas manger ce qui ne pèse rien. Ça ne t’a rien pris, parce que tu n’avais rien à donner.",
     "mentions": []
    },
    {
     "id": "c5-b77",
     "text": "— Alors je ne peux pas.",
     "mentions": []
    },
    {
     "id": "c5-b78",
     "text": "— Tu peux. Tu as des mots qui pèsent, tout le monde en a. Tu en as au moins un, je l’ai vu sur ta figure quand tu as refusé de le donner à une pierre. Tu as bien fait. On ne donne pas ça pour une pierre. Le jour où tu noueras, ce sera avec celui-là, ou avec un autre que tu auras vécu d’ici là, et tu sauras que tu peux parce que ça te fera mal. C’est le seul signe.",
     "mentions": []
    },
    {
     "id": "c5-b79",
     "text": "Bastien défit le nœud, lentement, et rendit la ficelle. Il ne demanda pas comment on filait une âme. Aube vit qu’il y pensait.",
     "mentions": []
    },
    {
     "id": "c5-b80",
     "text": "La nuit vint tout à fait. Le feu de lattes s’éteignit et Garance ne le ralluma pas ; elle dit que le bois de porte de Sombreval ne devait pas se brûler pour rien, et que personne n’avait froid. Personne ne dit le contraire. La Tende grondait en bas, brune, pleine de portes vertes, et montait ; on l’entendait monter, c’était une note qui changeait, elle aussi.",
     "mentions": []
    },
    {
     "id": "c5-b81",
     "text": "Aube ne dormait pas. Elle avait dans la poche de sa chemise la moitié de ficelle grise que Séverin lui avait donnée, et elle la tenait, et elle pensait que ce n’était pas la sienne, et qu’elle n’avait plus rien qui fût à elle, pas même un poignet noué. Alors elle se leva sans bruit, alla jusqu’au bât de Vergogne, où Garance gardait, dans un sachet cousu au cuir et que la Fosse n’avait pas eu, une poignée de chanvre peigné des Hauts, celle qu’elle vendait par pincées aux mères pour les cordelettes de sept ans. Elle en prit une pincée. Elle revint s’asseoir contre le mur, dans le noir, et elle fila.",
     "mentions": []
    },
    {
     "id": "c5-b82",
     "text": "Elle fila entre le pouce et l’index, sans rouet, sans reculer, comme on file une cordelette : en tordant, en tirant, en soufflant sur le fil pour qu’il se couche. Cela prit ce que prend une lampe. Quand ce fut fini, elle avait deux avant-bras de ficelle grise, un peu inégale, à elle. Elle la noua à son poignet gauche. Puis, sur la ficelle, tout près du poignet, elle fit un premier nœud, petit, serré, sans mot dedans, un nœud de cordelette, un nœud pour se souvenir : « le pont ».",
     "mentions": []
    },
    {
     "id": "c5-b83",
     "text": "Elle hésita. Puis elle en fit un second, à un doigt du premier : « les anneaux ».",
     "mentions": []
    },
    {
     "id": "c5-b84",
     "text": "De l’autre côté de la voûte, Garance, qui ne dormait pas non plus, la regardait faire dans le noir, et ne dit rien, et fit le compte.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "La benne",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Malebosse sentait le chanvre vert, et c’était une odeur qu’Aube connaissait par le mauvais bout.",
     "mentions": [
      "malebosse"
     ]
    },
    {
     "id": "c6-b02",
     "text": "Elle connaissait le chanvre peigné, roui, séché, blond, tel qu’il arrivait dans la Salle en nappes prêtes à filer. Elle n’avait jamais vu d’où il venait : ces terrasses étroites accrochées à la rive d’ombre, une trentaine, empilées comme des marches jusqu’au pied de la falaise, où des hommes et des femmes courbés semaient à la volée dans une terre noire de pluie, et ces claies de séchage vides, hautes comme des maisons, qui attendaient l’été, et ces bassins de rouissage taillés dans le roc où l’eau brune de la Tende arrivait par des rigoles et ressortait plus brune encore. Tout Malebosse était fait pour la plante. Les maisons n’étaient que ce qui restait de place.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "— C’est d’ici, dit Garance, que vient ton long brin. Tout le chanvre de la Corderie monte de ces terrasses. Tu as filé trois ans de Malebosse sans le savoir.",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "— Je ne savais pas non plus pour quoi.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "— Ça fait deux choses. Il va falloir que tu commences à demander, la fileuse.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "Il ne pleuvait plus. Le ciel s’était levé d’un coup, dans la nuit, et au matin il était haut, blanc et froid, et la Tende, en bas, n’en avait pas profité pour redescendre : elle grondait plus fort que la veille, et au-delà de Malebosse, vers le nord, elle s’enfonçait entre deux parois qui se rapprochaient jusqu’à se toucher presque, et là il n’y avait plus de chemin. Les Gorges Fermées. La rive d’ombre s’arrêtait net contre le roc. Pour continuer vers les Hauts, il fallait repasser à l’ouest, et à l’ouest il n’y avait pas de pont.",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "Il y avait la benne.",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "Aube la vit avant de comprendre ce que c’était : un fil tendu en travers du vide, d’un pilier de roche à un autre, à quatre-vingts pas au-dessus de la rivière, si fin de loin qu’on l’aurait pris pour une fissure du ciel. Et sur le fil, immobile, à mi-chemin, une chose qui pendait, brune, grosse comme une hotte. En approchant, le fil devint un câble, gros comme un bras, goudronné, luisant ; la chose devint une nacelle de vannerie et de cuir, ouverte, suspendue au câble par deux poulies de bois et un anneau ; et sur la lèvre de l’est, sous un appentis de lauzes, un vieil homme tournait un cabestan à quatre bras, lentement, en chantant faux, et la nacelle avançait d’un pied à chaque tour.",
     "mentions": [
      "la-benne"
     ]
    },
    {
     "id": "c6-b09",
     "text": "— Firmin, dit Garance. Il tient la benne depuis avant ma naissance. Ne lui demande pas si c’est loin, de l’autre côté.",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c6-b11",
     "text": "— Tu verras.",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "Firmin les vit venir, arrêta le cabestan, cala la manivelle avec une cheville de bois et vint à leur rencontre en s’essuyant les mains. C’était un homme de soixante-dix ans, plié, avec des avant-bras de gabarier et un visage tout en rides qui avaient l’air d’aller vers la bouche pour l’entendre. Il embrassa Garance. Il regarda les autres, et la mule.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "— Quatre et une bête, dit-il. Deux par nacelle, la bête en sangle dessous avec quelqu’un dans la nacelle pour lui parler. Trois voyages. Vingt deniers, la bête dix, je fais le tour.",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "— Marché, dit Garance. Tu me le mets sur la ficelle, je n’ai plus un sol, la Fosse a tout bu.",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "— La Fosse ? Tu es passée sur la Traversée ?",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— Elle a filé sous le convoi de chez toi. Tout le monde est là. C’est la petite qui l’a tenue.",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "Firmin regarda Aube. Il regarda son poignet, la ficelle neuve, inégale, à deux nœuds. Il ne dit rien pendant un moment. Puis :",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "— Alors la bête, c’est gratuit.",
     "mentions": []
    },
    {
     "id": "c6-b19",
     "text": "Il retourna à son cabestan.",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "Le passage se fit dans l’ordre que Firmin voulut. Garance d’abord, avec Bastien, dans la nacelle qui grinçait ; on la vit s’éloigner sur le câble, se rapetisser, pendre au-dessus du vide comme un fruit, et toucher l’autre lèvre, où l’on distinguait un second appentis et un second cabestan, mais personne pour le tourner. Firmin tournait des deux côtés à la fois, expliqua-t-il, par une corde de rappel qui courait sous le câble : il tirait la nacelle à lui ou l’envoyait, seul, depuis trente ans. Il avait dit cela sans lever les yeux, en tournant, et Aube avait vu la ficelle grise, très ancienne, très noire de goudron, nouée sur le câble à l’anneau du pilier de l’est, à hauteur de ses yeux : un nœud de Retenue, gros comme deux poings, aux torons fondus par les années.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "— C’est le vôtre.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "— Trente et un ans. Il a fait dix mille voyages. Il en fera dix mille.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "— Vous avez donné quoi ?",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "Firmin arrêta le cabestan. Il se retourna vers elle et sembla, pendant un instant, chercher un mot, non parce qu’il l’avait perdu, mais pour l’expliquer sans lui. Il montra de la main l’autre lèvre de la gorge, l’appentis vide, le chemin qui montait derrière vers les Hauts, tout ce qui n’était pas ici.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "— Là-bas, dit-il. Tout là-bas.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "Et il rit, d’un rire qui n’avait rien d’amer, comme d’une plaisanterie qu’il faisait à lui-même depuis trente et un ans, et il se remit à tourner.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c6-b27",
     "text": "Ce fut pendant qu’il tournait, la nacelle revenant à vide, que Séverin s’approcha de lui, tira de sa manche une petite ficelle nouée et la lui mit dans la main, avec deux pièces.",
     "mentions": []
    },
    {
     "id": "c6-b28",
     "text": "Aube le vit. Elle était à cinq pas, elle tenait Vergogne par le licol pendant que Garance, de l’autre côté, criait à la mule des choses que le vide emportait. Elle vit la ficelle, courte, à sept ou huit nœuds, du parler de la Corderie et non de celui des Hauts, celui que les compagnons se passaient d’une gabare à l’autre. Elle vit les pièces. Elle entendit Séverin dire : « Pour la gabare de la Corderie, quand elle repassera à Pont-Sauvage. Pour Maître Aymon, de ma main. » Et Firmin qui hochait la tête et glissait la ficelle dans sa ceinture sans regarder.",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "Séverin se retourna, et la trouva qui le regardait, et ne détourna pas les yeux.",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "— Tu lui as dit où je vais, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "— Oui. Haut-Charme, par le col, et que tu ne redescendras pas avant. Que la Fonte a huit jours d’avance. Que tu as tenu la Traversée avec un nœud de gabare, et le mot. Qu’il y a le fils Dautry avec toi et que sa mère peut cesser de faire draguer le Déversoir. C’est mon travail. Je te l’ai dit sur le pont.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "Elle le regarda un long moment. Elle aurait pu, pensa-t-elle, prendre la ficelle dans la ceinture du vieux, la jeter dans la gorge, et Firmin l’aurait laissée faire, parce que la bête était gratuite et qu’il avait vu son poignet. Elle aurait pu. Elle sentit qu’elle en avait envie, et elle sentit aussitôt, au-dessous de l’envie, la forme exacte de ce que ça voudrait dire : qu’elle se cachait. Qu’elle fuyait, comme Aymon l’écrirait. Qu’elle montait aux Hauts pour qu’on ne la trouve pas.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "Ce n’était pas pour ça qu’elle montait. Elle le sut à cet instant, avec la même netteté qu’un fil qui ne tremble pas.",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "— Bien, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "Séverin cligna des yeux. C’était la première fois qu’elle le voyait pris de court.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "— Bien ?",
     "mentions": []
    },
    {
     "id": "c6-b37",
     "text": "— Qu’il sache où je suis. Qu’il sache que je vais chercher quelque chose. Je ne me cache pas de lui, Séverin. Je ne me cache de personne. Quand je redescendrai, je redescendrai par la porte.",
     "mentions": []
    },
    {
     "id": "c6-b38",
     "text": "— Tu redescendras.",
     "mentions": []
    },
    {
     "id": "c6-b39",
     "text": "— Avant la lune. C’est la Charte. On m’a lu la Charte, je ne l’ai pas oubliée.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "Il resta une seconde sans rien dire. Puis il inclina la tête, très légèrement, comme on incline la tête devant un compagnon, et retourna aider Firmin.",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "Vergogne fut le troisième voyage, avec eux deux au-dessus.",
     "mentions": []
    },
    {
     "id": "c6-b42",
     "text": "La mule n’aimait pas cela. Elle l’avait fait onze fois dans sa vie, dit Firmin, et onze fois elle n’avait pas aimé ; on lui passait deux larges sangles de cuir sous le ventre, croisées au dos, réunies au-dessus par un anneau de fer forgé, et l’anneau se pendait par une corde courte à celui de la nacelle, de sorte que la bête voyageait sous les passagers, les quatre pattes dans le vide, en tournant lentement sur elle-même. La personne dans la nacelle lui parlait. C’était le rôle.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "— C’est pour ça qu’elle te connaît, dit Firmin à Aube. Une bête qui ne connaît pas la voix rue dans les sangles. Et sur la corde de sangle, la ficelle, la vieille, c’est la mienne aussi, elle a l’âge de la bête, elle a tenu onze fois. Monte.",
     "mentions": []
    },
    {
     "id": "c6-b44",
     "text": "Elles montèrent, Aube et Séverin, dans la nacelle de vannerie qui grinçait ; Firmin sangla Vergogne dessous, vérifia l’anneau, la corde courte, le nœud noir et fondu qui la tenait, et cala tout d’une main ; il souhaita bon voyage d’un signe et se mit au cabestan.",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "Le pilier s’éloigna. Le vide vint.",
     "mentions": []
    },
    {
     "id": "c6-b46",
     "text": "Aube n’avait pas eu peur sur la Traversée. Il y avait eu le tablier, la rampe, les cordes chantantes, une chose faite pour qu’on marche dessus. Ici il n’y avait rien. La nacelle pendait à un fil, le fil pendait au ciel, et dessous, à quatre-vingts pas, la Tende brune emplissait le fond des Gorges Fermées d’un fracas qu’on prenait dans les dents. Vergogne tournait lentement au bout de sa corde, la tête basse, les oreilles rabattues, et Aube lui parlait, penchée par-dessus la vannerie, de tout et de rien, du prix du sel et des nouets d’hier, et la mule l’écoutait, et ses oreilles se relevaient à demi.",
     "mentions": []
    },
    {
     "id": "c6-b47",
     "text": "Ils étaient au milieu quand la corde de sangle glissa.",
     "mentions": []
    },
    {
     "id": "c6-b48",
     "text": "Ce fut un son sec, à peine un son, sous le fracas : le grincement bref d’une ficelle vieille comme une mule qui cède d’un coup dans un nœud de trente ans, et la corde courte fila dans l’anneau de la nacelle d’un pied, d’un coup, et Vergogne tomba d’un pied, et cria. Un cri de mule au-dessus du vide, qui n’est pas un bruit qu’on oublie. La sangle de droite, tordue par la chute, remonta d’un coup sur le flanc ; celle de gauche tint ; la bête pendit de travers, les pattes battant l’air, et se mit à ruer, et à chaque ruade la corde courte gagnait un pouce dans l’anneau.",
     "mentions": []
    },
    {
     "id": "c6-b49",
     "text": "Séverin fut sur la corde avant qu’Aube ait fini de comprendre. Il s’était jeté à plat ventre sur le bord de la nacelle, les deux bras dehors, et il avait saisi la corde courte à pleines mains sous l’anneau, et il la tenait ; on voyait les veines de son cou ; et la mule pesait dessus, et ruait, et la corde glissait quand même entre ses paumes, lentement, en fumant.",
     "mentions": []
    },
    {
     "id": "c6-b50",
     "text": "— La ficelle ! cria-t-il. Nœud d’amarre sur la corde, au-dessus de mes mains, dans l’anneau ! Je ne peux pas lâcher !",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Elle avait la moitié de sa ficelle à lui, dans sa chemise, et la sienne, au poignet. Elle prit les deux. Elle n’avait pas le temps de choisir et elle ne choisit pas : elle noua les deux bouts ensemble d’un nœud de pêcheur, d’un geste, sans regarder, comme on aboute deux mèches au rouet, et elle passa la ficelle double autour de la corde courte, entre les mains blanches de Séverin et l’anneau de fer, un tour mort, en serrant fort pour mordre le goudron, une demi-clé…",
     "mentions": []
    },
    {
     "id": "c6-b52",
     "text": "La mule rua. La corde sauta d’un pouce. La demi-clé se défit sous ses doigts.",
     "mentions": []
    },
    {
     "id": "c6-b53",
     "text": "— Je n’ai pas les deux mains !",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "— Passe-moi le bout !",
     "mentions": []
    },
    {
     "id": "c6-b55",
     "text": "Elle lui passa le bout de la ficelle double entre les doigts d’une main, sans qu’il lâche la corde, et il le coinça, et de l’autre main elle refit la demi-clé, la seconde, rentra le bout sous le tour, et c’était un nœud d’amarre, fait à deux, une main sur les tours et une main sur les clés, et la ficelle qui le faisait avait deux âmes : la sienne, grise, inégale, filée d’une pincée de Malebosse contre un mur de Sombreval ; et celle de Séverin, tordue serré, filée dans la Salle des Cordes par la meilleure main d’Aymon.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "Il n’y avait qu’un nœud. Il n’y avait qu’un instant.",
     "mentions": []
    },
    {
     "id": "c6-b57",
     "text": "Elle approcha la bouche du nœud. Séverin, à côté d’elle, la joue contre la vannerie, fit de même, et pendant une fraction de seconde ils se regardèrent à un pouce l’un de l’autre, par-dessus une ficelle grise, avec la même question dans les yeux : « lequel de nous deux. »",
     "mentions": []
    },
    {
     "id": "c6-b58",
     "text": "Ils serrèrent ensemble.",
     "mentions": []
    },
    {
     "id": "c6-b59",
     "text": "Elle ne l’entendit pas ; on n’entend pas les mots donnés. Elle sentit le souffle de Séverin sur ses doigts, et elle donna le sien, le seul qu’elle avait, celui qui lui remplissait la bouche depuis que le pilier s’était éloigné et que la mule était tombée d’un pied ; elle le donna comme elle avait donné l’autre, sans marchander, parce qu’il était là.",
     "mentions": []
    },
    {
     "id": "c6-b60",
     "text": "— Peur.",
     "mentions": []
    },
    {
     "id": "c6-b61",
     "text": "La corde s’arrêta.",
     "mentions": []
    },
    {
     "id": "c6-b62",
     "text": "Vergogne pendit de travers, immobile, une sangle sur le flanc, les pattes raides, et ne tomba pas d’un pouce de plus. La corde courte, sous le nœud à deux ficelles, était comme coulée dans le fer. Séverin ouvrit les mains. Ses paumes étaient noires de goudron et rouges dessous, à vif. Il les regarda. Puis il regarda le nœud.",
     "mentions": []
    },
    {
     "id": "c6-b63",
     "text": "— Ça ne devrait pas, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b64",
     "text": "Il l’avait dit très bas.",
     "mentions": []
    },
    {
     "id": "c6-b65",
     "text": "— Deux âmes. Deux mots. Un nœud. Ce n’est pas dans le Registre. Ce n’est dans aucune page. Un nœud a une bouche.",
     "mentions": []
    },
    {
     "id": "c6-b66",
     "text": "— Il en a eu deux.",
     "mentions": []
    },
    {
     "id": "c6-b67",
     "text": "— Il tient.",
     "mentions": []
    },
    {
     "id": "c6-b68",
     "text": "— Il tient.",
     "mentions": []
    },
    {
     "id": "c6-b69",
     "text": "Sur la lèvre de l’ouest, Garance criait quelque chose, et Firmin, sur celle de l’est, tournait le cabestan comme un homme qui pompe une barque qui coule, et la nacelle repartit, par saccades, vers le pilier, avec dessous une mule de travers qui avait cessé de ruer et regardait le vide avec un air d’offense profonde.",
     "mentions": []
    },
    {
     "id": "c6-b70",
     "text": "— Tu as donné quoi ? dit Aube.",
     "mentions": []
    },
    {
     "id": "c6-b71",
     "text": "Il ouvrit la bouche, et elle vit le trou, elle le reconnut, la marche manquée. Il mit la main sur son bras, sur son épaule, puis sur sa propre poitrine, et frotta, comme on se frotte pour se réchauffer.",
     "mentions": []
    },
    {
     "id": "c6-b72",
     "text": "— Froid, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b73",
     "text": "Il hocha la tête.",
     "mentions": []
    },
    {
     "id": "c6-b74",
     "text": "— J’ai grandi sur une gabare, dit-il. Je le connais assez pour le perdre sans qu’il me manque. Et toi ?",
     "mentions": []
    },
    {
     "id": "c6-b75",
     "text": "Elle chercha. Elle savait ce qu’elle avait eu, là, penchée sur le vide, quand la mule était tombée. Elle le savait exactement, elle l’avait encore dans les mains, dans le ventre, ce n’était pas parti avec le mot, c’était là. Mais quand elle voulut le dire, il n’y eut que la marche manquée, et la chose sans contour, et elle secoua la tête, et posa la main sur sa gorge.",
     "mentions": []
    },
    {
     "id": "c6-b76",
     "text": "Séverin comprit. Il ne dit rien pendant tout le reste du câble. Ce fut sur la lèvre de l’ouest, une fois la mule dessanglée et Garance en train de lui parler dans les oreilles en la frottant de partout, qu’il parla, sans la regarder.",
     "mentions": []
    },
    {
     "id": "c6-b77",
     "text": "— Tu donnes ce qui te fait mal, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b78",
     "text": "— Je donne ce qui vient.",
     "mentions": []
    },
    {
     "id": "c6-b79",
     "text": "— Ce qui te vient, c’est ce qui te fait mal, parce que tu n’as jamais rien eu d’autre dans la bouche. Réfléchis une fois, la fileuse. À Pont-Sauvage tu as donné le mot qui sert à dire qu’on n’a pas mangé. Ici tu as donné celui qui sert à dire qu’on a besoin qu’on vienne. Continue comme ça, et un jour tu n’auras plus un seul mot pour demander quoi que ce soit à qui que ce soit. Tu tiendras des ponts et tu crèveras debout sans pouvoir dire de quoi. Ce ne sont pas des mots à donner. Ce sont des mots à garder.",
     "mentions": []
    },
    {
     "id": "c6-b80",
     "text": "— Tu as donné « froid ».",
     "mentions": []
    },
    {
     "id": "c6-b81",
     "text": "— J’ai donné un mot que je connais et qui ne m’a jamais servi à rien : personne n’est jamais venu quand j’avais froid. Toi, tu perds les mots qui font qu’on vient te chercher. Ce n’est pas pareil. Ce n’est pas pareil du tout.",
     "mentions": []
    },
    {
     "id": "c6-b82",
     "text": "Elle ne répondit pas. Elle regarda son poignet, où il n’y avait plus rien, de nouveau : la ficelle neuve, à deux nœuds, était sur la corde de sangle de Vergogne avec la moitié de la sienne. Elle avait filé une cordelette pour la perdre en un jour. Elle en filerait une autre. Elle sentit, très loin sous tout cela, quelque chose qui aurait dû avoir un nom, et qui n’en avait plus, et qui ressemblait à l’envie de s’asseoir.",
     "mentions": []
    },
    {
     "id": "c6-b83",

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));
svg.innerHTML=links.map(l=>{const a=pos[l.from],b=pos[l.to];return '<line class="edge" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"><title>Les Mots donnés</title></line>'}).join("")
+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);
return '<g class="node'+(shown?"":" locked")+'"'+(shown?' data-open-entry="'+escA(n.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Entité non révélée"')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4"/>'+(shown?'<text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+esc(label)+'</text>':"")+'</g>'}).join("");
const revealed=nodes.filter(n=>open(n.codexId)).length;
$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");
$("#relations-list").innerHTML=links.length?links.map(l=>'<li><strong>'+esc(nodeTitle(nodes.find(n=>n.codexId===l.from),l.from))+' — '+esc(nodeTitle(nodes.find(n=>n.codexId===l.to),l.to))+'</strong><br><span class="viz-nature">'+esc(l.nature||"Lien non qualifié")+'</span></li>').join(""):'<li class="empty">Aucun lien n\u2019est encore révélé.</li>';
wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
function trap(e,d){if(e.key!=="Tab")return;const f=$$("button,[href],input,[tabindex]:not([tabindex='-1'])",d).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
$("#start").onclick=()=>go("#chapter/"+(saved.chapter||book.chapters[0].id));$("#home-btn").onclick=()=>go("");$("#codex-btn").onclick=()=>go("#codex");$("#codex-nav").onclick=()=>go("#codex");$("#map-btn").onclick=$("#map-nav").onclick=()=>go("#map");$("#relations-btn").onclick=$("#relations-nav").onclick=()=>go("#relations");$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";applyPrefs();persist()};$("#font-down").onclick=()=>{state.scale=Math.max(.85,+(state.scale-.1).toFixed(2));applyPrefs();persist()};$("#font-up").onclick=()=>{state.scale=Math.min(1.4,+(state.scale+.1).toFixed(2));applyPrefs();persist()};$("#search").oninput=e=>renderCodex(e.target.value);$("#entry-close").onclick=()=>closeDialog($("#entry-dialog"));$("#image-close").onclick=()=>closeDialog($("#image-dialog"));$$("dialog").forEach(d=>{d.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeDialog(d)}else trap(e,d)});d.addEventListener("click",e=>{if(e.target===d)closeDialog(d)})});document.addEventListener("keydown",e=>{if($("dialog[open]"))return;const i=book.chapters.findIndex(c=>c.id===state.chapter);if(e.key==="ArrowRight"&&!$("#reader").hidden&&i<book.chapters.length-1)go("#chapter/"+book.chapters[i+1].id);if(e.key==="ArrowLeft"&&!$("#reader").hidden&&i>0)go("#chapter/"+book.chapters[i-1].id)});function showModuleNav(){const m=hasMap(),r=hasRelations();$("#map-btn").hidden=$("#map-nav").hidden=!m;$("#relations-btn").hidden=$("#relations-nav").hidden=!r}
addEventListener("hashchange",route);applyPrefs();renderHome();renderToc();showModuleNav();syncUnlocks();updateProgress();route();
</script></body></html>
