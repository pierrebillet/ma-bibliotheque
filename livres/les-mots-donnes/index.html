     "id": "c8-b58",
     "text": "Alors Aube s’assit sur la rive, dans la boue, à la lumière des torches, et fila sa troisième cordelette en huit jours. Personne ne la regarda faire ; à Haut-Charme, une fille qui file n’est pas un spectacle. Elle fila entre le pouce et l’index, en tordant, en tirant, en soufflant sur le fil pour qu’il se couche, et quand ce fut fini elle avait deux avant-bras de ficelle blonde, égale, la meilleure qu’elle eût jamais filée, parce que le chanvre était bon et qu’elle n’avait plus rien d’autre dans les mains que ce qu’elle faisait.",
     "mentions": []
    },
    {
     "id": "c8-b59",
     "text": "Elle se leva pour aller au pont. Il restait une place, au bout de la rangée neuve, un doigt de corde nue.",
     "mentions": []
    },
    {
     "id": "c8-b60",
     "text": "Une main se posa sur son bras. Mère Ancelle. La vieille avait quitté son banc et son feu, et traversé la nuit sur des jambes qui ne devaient plus servir à ça, et elle tenait le bras d’Aube d’une main de racine, et elle ne dit rien, parce qu’elle avait dépensé ses phrases ; elle secoua la tête. Puis elle prit la ficelle blonde des mains d’Aube et la lui noua elle-même au poignet gauche, serré, comme on noue une cordelette de sept ans, et elle posa un doigt sur la bouche d’Aube, et puis elle montra le sud.",
     "mentions": []
    },
    {
     "id": "c8-b61",
     "text": "« Garde-les. Pour ta ville. »",
     "mentions": []
    },
    {
     "id": "c8-b62",
     "text": "— Je n’ai pas encore décidé ce que je fais de ma ville, dit Aube.",
     "mentions": []
    },
    {
     "id": "c8-b63",
     "text": "La vieille sourit. C’était la première fois, et cela creusa son visage de partout, et elle fit un signe, deux doigts qui se serrent, et Garance, derrière, traduisit à voix basse, d’une voix qui n’était pas la sienne :",
     "mentions": []
    },
    {
     "id": "c8-b64",
     "text": "— Elle dit que c’est ce que disait l’autre. À dix-neuf ans. Quand elle est partie d’ici pour Tressaille. Qu’elle n’avait pas encore décidé.",
     "mentions": []
    },
    {
     "id": "c8-b65",
     "text": "Aube ne dormit pas cette nuit-là. Elle resta assise sur la rive du Pont de Charme, qui chantait juste, avec sa ficelle blonde au poignet et un seul nœud dessus, petit, serré, sans mot dedans : « le pont qui a des cheveux. » Elle regardait le sud. On ne voyait rien au sud, que la masse noire du col et des étoiles. Sous le col il y avait une mer de nuages, et sous la mer une vallée, et au bout de la vallée une corde qui chantait faux, et sur la corde, ce soir, ou demain, une vieille femme agenouillée qui faisait un petit nœud et donnait un mot.",
     "mentions": []
    },
    {
     "id": "c8-b66",
     "text": "Douze. Moins ce qu’elle avait déjà donné. Aube compta jusqu’au matin, et le compte ne tombait jamais juste, et elle recommençait.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-9",
   "number": 9,
   "title": "Grandes eaux",
   "blocks": [
    {
     "id": "c9-b01",
     "text": "Ils redescendirent à six, en comptant la mule, et la mule comptait double, parce qu’Aurèle marchait à côté d’elle et qu’on ne les séparait plus.",
     "mentions": [
      "aurele-malaurie",
      "vergogne"
     ]
    },
    {
     "id": "c9-b02",
     "text": "Il était venu sans qu’on le lui demande. Le matin, à l’heure où les enfants de Haut-Charme recommençaient à crier, il s’était trouvé devant la grange avec un sac de laine brune, son chapeau, et ses ficelles à la ceinture, et il avait fait un signe à Ancelle, et Ancelle avait fait un signe en retour, et c’était tout. Garance n’avait rien dit. Elle avait chargé la mule, plus lourde qu’à la montée, parce que Haut-Charme leur avait donné ce qu’il avait, du lard, de la miche noire, une tomme, et un rouleau de chanvre peigné, blond, gros comme une cuisse, qu’Ancelle avait fait porter sans un mot et qu’Aube avait compris avant tout le monde : ce n’était pas pour vendre. C’était pour filer. Une ville n’a pas assez de cordelettes ; il faudrait en faire.",
     "mentions": []
    },
    {
     "id": "c9-b03",
     "text": "— Il vient pour toi ? avait demandé Bastien à Garance, en désignant Aurèle du menton.",
     "mentions": []
    },
    {
     "id": "c9-b04",
     "text": "— Il vient pour vérifier les nœuds. C’est le maître de veillée. Il faut quelqu’un qui tire sur chaque demi-clé avant qu’on donne, sinon on donne pour rien. Il n’y a personne à Tressaille qui sache faire ça.",
     "mentions": []
    },
    {
     "id": "c9-b05",
     "text": "— Séverin sait.",
     "mentions": []
    },
    {
     "id": "c9-b06",
     "text": "— Séverin sait depuis hier soir. Aurèle sait depuis quinze ans. Et puis il vient pour moi. Ne me fais pas dire les deux, fils de Maison, j’ai des mots à garder pour quand ils serviront.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c9-b07",

    },
    {
     "id": "c9-b08",
     "text": "Le brouillard, en dessous, s’était levé. Toute la vallée de la Tende était là, ouverte, verte et grise, dégringolant vers le sud en gorges superposées, et au fond, très loin, une tache d’étain qui était la Retenue, et Aube la vit d’un coup et sentit sa gorge se fermer : de si haut, le lac était rond. Il n’avait pas la forme longue qu’elle avait suivie à pied. Il avait débordé. Il avait bu ses rives, et de là-haut on voyait, à sa lisière du sud, une ligne droite, minuscule, qui le barrait comme un trait de plume : la Levée. Et rien, derrière. On ne voyait pas Tressaille. On ne voyait que l’eau, et le trait, et l’espace où la ville devait être.",

    {

    },
    {
     "id": "c9-b12",

    {

    {

    {
     "id": "c9-b41",

    {

    {

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
