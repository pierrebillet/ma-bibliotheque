     "text": "Sur la rive d’ombre, à l’ancrage de l’est, Séverin s’arrêta devant l’autre nœud, le mort, celui du grand rouquin. Un gros nœud de Retenue défait à moitié, dont les torons pendaient comme des doigts ouverts. Il tira de sa manche sa ficelle grise, la sienne, et fit sur le câble du nord, à un pied du nœud mort, un nœud de Retenue neuf, serré, sans un mot dedans.",
     "mentions": []
    },
    {
     "id": "c4-b68",
     "text": "— À sec, dit-il en voyant qu’elle regardait. Un nœud sans mot, pour marquer la place. Le compagnon qui viendra saura où reprendre. Et il saura qu’une fileuse a tenu le pont avant lui avec une ficelle de sept ans. Ça lui fera du bien.",
     "mentions": []
    },
    {
     "id": "c4-b69",
     "text": "Le chemin quittait le pont et montait au nord, dans les pins tordus, vers Sombreval. La pluie continuait. Ils marchèrent jusqu’au soir, Garance devant, qui ne parlait plus, et la mule légère, et Bastien qui portait un sac vide, et Séverin derrière, et au milieu Aube, le poignet nu, qui tenait de la main droite son poignet gauche sans s’en apercevoir, comme on tient une place.",
     "mentions": []
    },
    {
     "id": "c4-b70",
     "text": "Ils firent halte sous un surplomb, à la nuit. Garance alluma un feu de branches de pin qui fumait plus qu’il ne chauffait, sortit de son manteau ce qui n’avait pas été dans la charge : une demi-tomme, un quignon, un oignon, et partagea en quatre, à voix haute, avec les prix. Elle tendit sa part à Aube.",
     "mentions": []
    },
    {
     "id": "c4-b71",
     "text": "Aube la regarda. Elle ouvrit la bouche pour dire qu’elle ne payait pas, et que par conséquent, et qu’elle n’avait pas… et elle chercha le mot, et il n’était pas là, et à sa place il y avait la chose au ventre, sans contour, et elle ferma la bouche.",
     "mentions": []
    },
    {
     "id": "c4-b72",
     "text": "Garance ne la laissa pas la rouvrir. Elle lui mit le pain dans la main, comme Hersende, sans manières.",
     "mentions": []
    },
    {
     "id": "c4-b73",
     "text": "— Je fais le compte, dit-elle. Mange.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "Les anneaux de Sombreval",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "Les pruniers étaient en fleur dans les ruines.",
     "mentions": [
      "sombreval"
     ]
    },
    {
     "id": "c5-b02",
     "text": "C’était la première chose qu’on voyait de Sombreval, en montant par la rive d’ombre : non pas les murs, ni l’éboulis, ni le château, mais cette écume blanche accrochée à la pente entre les pierres grises, si légère dans la pluie qu’on la prenait pour de la brume. Les pruniers avaient été plantés en lignes, deux siècles plus tôt, par des gens qui comptaient les cueillir. Ils s’étaient passés de tout le monde. Ils poussaient dans les maisons, par les portes, à travers les toits effondrés, et ils fleurissaient comme si de rien n’était, et les pétales tombaient sur l’éboulis, et l’éboulis les buvait.",
     "mentions": []
    },
    {
     "id": "c5-b03",
     "text": "— On ne s’arrête pas ici, dit Garance.",
     "mentions": []
    },
    {
     "id": "c5-b04",
     "text": "— Il pleut à ne plus voir le chemin, dit Séverin, et la Tende monte. Regarde-la. On s’arrête où il y a un toit.",
     "mentions": []
    },
    {
     "id": "c5-b05",
     "text": "Ils s’arrêtèrent. La Tende, en effet, montait. Elle avait changé de voix dans la nuit ; la veille, elle était blanche et rapide ; ce matin, elle était brune, et elle avait ce grondement continu, sans respiration, que les gens des gorges connaissaient et n’aimaient pas. Elle charriait des branches. Elle charriait, à un moment, une porte entière, peinte en vert, qui tourna deux fois sur elle-même et disparut.",
     "mentions": [
      "la-tende",
      "la-fonte"
     ]
    },
    {
     "id": "c5-b06",
     "text": "— Huit jours d’avance, dit Garance en la regardant passer. Elle a huit jours d’avance, cette Fonte. C’est parti pour de bon.",
     "mentions": []
    },
    {
     "id": "c5-b07",
     "text": "Personne ne fit le compte à voix haute, mais tout le monde le fit. Douze jours moins trois. La lune dans neuf. Et un lac, en bas, qui buvait cette eau brune, porte verte comprise, et montait vers la marque.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "Le village était sous l’éboulis, ou plutôt l’éboulis était dans le village. Deux siècles plus tôt, un pan de la falaise s’était détaché au-dessus de Sombreval, et il était descendu, et il n’était pas reparti. On voyait encore la forme du coup : une langue de pierres grosses comme des mules, grosses comme des maisons, qui commençait très haut, sous une entaille pâle dans le roc, et finissait dans les ruelles, en enfonçant les murs, en remplissant les caves, en laissant çà et là un pignon debout par oubli. Au-dessus de tout, sur son piton, le château du sire de Sombreval n’avait rien reçu. Il était tombé de vieillesse, plus tard, doucement ; on voyait la différence.",
     "mentions": []
    },
    {
     "id": "c5-b09",
     "text": "Ils trouvèrent un toit : une grange à demi enfoncée dont la voûte de pierre avait tenu, et dont le fond était plein de terre et de pétales. Garance attacha Vergogne sous la voûte, Bastien fit du feu avec des lattes de porte, et Séverin alla voir la Tende, et revint, et dit qu’elle montait toujours.",
     "mentions": []
    },
    {
     "id": "c5-b10",
     "text": "Ce fut Bastien qui posa la question, parce que c’était lui qui avait lu les livres.",
     "mentions": []
    },
    {
     "id": "c5-b11",
     "text": "— C’est ici, dit-il. La veillée qui a échoué. Celle dont la Corderie se sert pour dire qu’on ne noue pas à plusieurs.",
     "mentions": []
    },
    {
     "id": "c5-b12",
     "text": "— C’est ici, dit Séverin.",
     "mentions": []
    },
    {
     "id": "c5-b13",
     "text": "— Raconte.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "Séverin s’assit contre le mur, les mains autour d’un bol d’eau de pluie, et il raconta, de la voix égale qu’il avait pour tout, comme s’il lisait une page du Registre, et peut-être en lisait-il une, de mémoire.",
     "mentions": [
      "la-veillee"
     ]
    },
    {
     "id": "c5-b15",
     "text": "— An 118 de la Levée. Le sire de Sombreval s’appelait Amaury ; c’était avant les Maisons, quand la vallée avait des sires. La falaise se fendait au-dessus du village. Il n’y avait pas de compagnon à Tressaille qui veuille monter la tenir : c’était un rocher, c’était loin, ça ne valait pas une vie de mots. Alors le sire a fait ce que faisaient les Hauts, à ce qu’on disait : une veillée. Il a fait courir une corde au pied de la falaise, du bout à l’autre du village, et il a fait venir tous ses gens, et chacun a noué sa cordelette sur la corde, une demi-clé, et chacun a donné un mot. Trois cents personnes. Trois cents mots. Trois cents petits nœuds, et le rocher tenu par tout le monde et par personne.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— Et ?",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "— Et la falaise est descendue le mois suivant, et voilà le village. On a compté cent quarante morts. Le sire n’a rien eu, il était dans sa tour. La Corderie a écrit une page là-dessus, on la lit aux apprentis la première année : « un mot menti ne tient rien, et dans trois cents bouches il y a toujours un menteur. » Il suffit d’un. Un seul qui donne un mot qu’il n’a pas vécu, ou qu’il ne veut pas donner, et sa demi-clé est fausse, et la corde n’est plus une corde, c’est une chaîne avec un maillon de bois. C’est pour cela qu’on ne noue pas à plusieurs. C’est pour cela qu’une reprise, c’est une bouche. Une seule, dont on connaît le poids, et qui a dit oui.",
     "mentions": [
      "la-grande-reprise"
     ]
    },
    {
     "id": "c5-b18",
     "text": "Il avait dit cela sans regarder Aube, ce qui revenait à la regarder.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "— C’est la version de Tressaille, dit Garance.",
     "mentions": []
    },
    {
     "id": "c5-b20",
     "text": "— C’est la version du Registre.",
     "mentions": []
    },
    {
     "id": "c5-b21",
     "text": "— Le Registre est à Tressaille. Ici, on chante autre chose. Ma grand-mère la chantait à Pont-Sauvage en écossant les haricots, et je peux te dire qu’elle n’avait pas lu le Registre.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "Et Garance, qui ne chantait jamais, qui parlait comme d’autres respirent et n’avait pas de voix pour autre chose, chanta. Ce fut court, et faux, et cela leur ferma la bouche à tous.",
     "mentions": []
    },
    {
     "id": "c5-b23",
     "text": "Le sire a mis ses gens à la corde",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "comme on met les bœufs au joug,",
     "mentions": []
    },
    {
     "id": "c5-b25",
     "text": "il a dit : donnez, ou la tour vous regarde,",
     "mentions": []
    },
    {
     "id": "c5-b26",
     "text": "et la tour avait des yeux partout.",
     "mentions": []
    },
    {
     "id": "c5-b27",
     "text": "Ils ont donné ce qu’on leur prenait,",
     "mentions": []
    },
    {
     "id": "c5-b28",
     "text": "et la pierre a su que c’était pris,",
     "mentions": []
    },
    {
     "id": "c5-b29",
     "text": "et la pierre est venue le chercher",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "jusque dans le lit des petits.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "— Ça ne dit pas qu’ils ont menti, dit Bastien à mi-voix.",
     "mentions": []
    },
    {
     "id": "c5-b32",
     "text": "— Ça dit qu’on leur a pris. Ce n’est pas la même chose.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "— Un mot pris ne tient rien, dit Séverin. Un mot menti ne tient rien. Le résultat est le même.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "— Le résultat, oui, dit Garance. La faute, non.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "Ils se turent. La pluie tombait sur la voûte, et la Tende grondait en bas, et Vergogne mâchait des pétales avec un air de reproche.",
     "mentions": []
    },
    {
     "id": "c5-b36",
     "text": "Ce fut Aube qui se leva. Elle ne l’avait pas décidé plus que le reste. Elle sortit sous la pluie, dans les ruelles envahies, et Bastien la suivit, puis Séverin, et Garance resta avec la mule et cria qu’ils étaient fous.",
     "mentions": []
    },
    {
     "id": "c5-b37",
     "text": "Elle cherchait la corde. Pas la corde elle-même, qui avait pourri en deux siècles ou qu’on avait volée, mais la place de la corde : une corde de veillée, avait dit Séverin, courue au pied de la falaise, du bout à l’autre du village. Il fallait bien qu’elle tienne à quelque chose. Elle longea le bas de l’éboulis, là où il touchait les premières maisons, en écartant les branches des pruniers, et elle les trouva au troisième mur.",
     "mentions": []
    },
    {
     "id": "c5-b38",
     "text": "Des pierres de corde. Elle connaissait cela : de gros blocs équarris, scellés dans les murs à hauteur de poitrine, percés d’un anneau de fer forgé, comme aux ancrages des ponts et aux quais du Déversoir. Il y en avait un tous les dix pas, sur toute la longueur du mur, et le mur continuait sous l’éboulis. Les anneaux étaient rouillés jusqu’à l’os, gros comme un poing.",
     "mentions": []
    },
    {
     "id": "c5-b39",
     "text": "— La corde passait là, dit Séverin. D’anneau en anneau. C’est bien fait.",
     "mentions": []
    },
    {
     "id": "c5-b40",
     "text": "— Il y en a d’autres, dit Bastien.",
     "mentions": []
    },
    {
     "id": "c5-b41",
     "text": "Il s’était penché. Sous chaque grand anneau, à hauteur de hanche, il y en avait un petit. Un anneau de la taille d’un poignet d’homme, avec, encore accrochés à certains, deux ou trois maillons d’une chaîne courte, rongés, qui se terminaient en rien. Un petit anneau sous chaque grand. Un tous les dix pas.",
     "mentions": []
    },
    {
     "id": "c5-b42",
     "text": "Personne ne dit ce que c’était. On le voyait.",
     "mentions": []
    },
    {
     "id": "c5-b43",
     "text": "— Pour tenir la corde, dit Séverin, sans conviction.",
     "mentions": []
    },
    {
     "id": "c5-b44",
     "text": "— Une corde de veillée, on la tient avec un grand anneau, dit Aube. Tu l’as dit toi-même. Celui-là est à hauteur de poignet. Et il y a des chaînes.",
     "mentions": []
    },
    {
     "id": "c5-b45",
     "text": "— Ils étaient attachés, dit Bastien. On les a attachés à la corde pour qu’ils nouent. Chacun devant son anneau. Chacun avec sa cordelette et une chaîne au poignet, et la tour qui regarde. Et ils ont donné ce qu’on leur prenait.",
     "mentions": []
    },
    {
     "id": "c5-b46",
     "text": "Séverin ne répondit pas tout de suite. Il posa la main sur un des petits anneaux, comme il l’avait posée sur le nœud mort de Pont-Sauvage, et il le tint un long moment, et la rouille lui rougit la paume.",
     "mentions": []
    },
    {
     "id": "c5-b47",
     "text": "— Le Registre ne dit pas cela, dit-il enfin.",
     "mentions": []
    },
    {
     "id": "c5-b48",
     "text": "— Le Registre est à Tressaille, dit Aube.",
     "mentions": []
    },
    {
     "id": "c5-b49",
     "text": "Il retira sa main. Il la regarda, elle, pour la première fois depuis Pont-Sauvage avec cette expression qu’il avait eue devant son nœud de gabare : celle d’un homme qui connaît ses cordes et qui en trouve une qu’il ne connaît pas.",
     "mentions": []
    },
    {
     "id": "c5-b50",
     "text": "— Ça ne prouve pas que trois cents mots choisis tiendraient, dit-il. Ça prouve que trois cents mots pris n’ont pas tenu. Personne n’a jamais essayé l’autre.",
     "mentions": []
    },
    {
     "id": "c5-b51",
     "text": "— Les Hauts, dit Bastien.",
     "mentions": []
    },
    {
     "id": "c5-b52",
     "text": "— Les Hauts tiennent des granges. Pas des lacs.",
     "mentions": []
    },
    {
     "id": "c5-b53",
     "text": "— Tu n’en sais rien.",
     "mentions": []
    },
    {
     "id": "c5-b54",
     "text": "— Non, dit Séverin. Je n’en sais rien. C’est ce que j’ai dit.",
     "mentions": []
    },
    {
     "id": "c5-b55",
     "text": "Ils rentrèrent sous la voûte. La pluie redoublait ; le soir venait dans la journée. Garance leur jeta un regard, comprit qu’ils avaient trouvé quelque chose qu’elle savait déjà, et ne demanda rien.",
     "mentions": []
    },
    {
     "id": "c5-b56",
     "text": "Ce fut ce soir-là que Séverin apprit à Aube à nouer.",
     "mentions": []
    },
    {
     "id": "c5-b57",
     "text": "Il ne le proposa pas ; il le fit. Il tira de sa manche une longueur de sa ficelle grise, la coupa en deux d’un coup de dents, en donna une moitié à Aube et garda l’autre, et lui montra, sur un bâton de porte, le nœud de Retenue.",
     "mentions": []
    },
    {
     "id": "c5-b58",
     "text": "— Tu as noué une fois avec un mot lourd et un nœud de gabare, dit-il. Ça a tenu parce que le nœud d’amarre tient de lui-même, il est fait pour ça. Mais si tu dois nouer encore, et tu le devras, sur ce chemin, avant la lune, dans un sens ou dans l’autre, alors autant que tu ne perdes pas un mot pour un nœud qui glisse. Un nœud faux avec un mot vrai, c’est un mot perdu pour rien. Le nœud d’abord. Le mot après. Regarde.",
     "mentions": []
    },
    {
     "id": "c5-b59",
     "text": "Il noua. Ses mains étaient ce qu’on disait aux fileuses qu’elles étaient : pas rapides, exactes. Le nœud de Retenue était une chose compliquée, un nœud dans un nœud, un tour qui passait dans sa propre boucle et revenait se coincer sous lui-même, de sorte qu’en tirant sur n’importe quel bout on ne faisait que le serrer. Il le défit. Il le refit, plus lentement. Il le défit et posa la ficelle dans les mains d’Aube.",
     "mentions": [
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c5-b60",
     "text": "Elle le fit du premier coup.",
     "mentions": []
    },
    {
     "id": "c5-b61",
     "text": "Il la regarda. Elle haussa les épaules.",
     "mentions": []
    },
    {
     "id": "c5-b62",
     "text": "— Trois ans de long brin. Je noue des bouts d’écheveau tout le jour. Ce n’est pas plus difficile qu’une épissure.",
     "mentions": []
    },
    {
     "id": "c5-b63",
     "text": "— C’est plus difficile qu’une épissure.",
     "mentions": []
    },
    {
     "id": "c5-b64",
     "text": "— Alors j’ai eu de la chance.",
     "mentions": []
    },
    {
     "id": "c5-b65",
     "text": "Il eut un demi-sourire, le premier, et lui montra la demi-clé de veillée, qui était simple, et la clé de plaie, et comment on rentre un bout pour qu’il ne se reprenne pas, et comment on serre : pas d’un coup, mais en trois temps, en écoutant, parce qu’une corde qu’on serre trop vite crie et qu’une corde qui crie n’a pas fini de bouger. Elle apprit. Elle apprenait vite, non parce qu’elle était douée, pensa-t-elle, mais parce qu’on lui avait refusé si longtemps qu’elle avait tout regardé, depuis le bat-flanc, sans en avoir l’air.",
     "mentions": []
    },
    {
     "id": "c5-b66",
     "text": "Bastien regardait aussi. Au bout d’un moment, il dit :",
     "mentions": []
    },
    {
     "id": "c5-b67",
     "text": "— Je peux ?",
     "mentions": []
    },
    {
     "id": "c5-b68",
     "text": "Séverin le considéra. Puis, sans un mot, il lui tendit une longueur de ficelle, une de la sienne, et une pierre de la taille d’un pain.",
     "mentions": []
    },
    {
     "id": "c5-b69",
     "text": "— Nœud d’amarre autour de la pierre. Tu sais le faire, tout le monde sait le faire. Ensuite, un mot. Pas un mot qui te manque. Un que tu as en trop.",
     "mentions": []
    },
    {
     "id": "c5-b70",
     "text": "— Ça ne tiendra pas. L’âme n’est pas la mienne.",
     "mentions": []
    },
    {
     "id": "c5-b71",
     "text": "— Non. Ça ne tiendra pas. Fais-le quand même.",
     "mentions": [
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c5-b72",
     "text": "Bastien noua. Il noua bien, avec soin, en tirant la langue, et il approcha la bouche du nœud, et Aube le vit hésiter, chercher, refuser quelque chose, et choisir. Il serra.",
     "mentions": []
    },
    {
     "id": "c5-b73",
     "text": "Rien ne se passa. La pierre resta une pierre, avec une ficelle autour. Bastien resta Bastien. Il rouvrit la bouche et, à voix basse, pour voir, dit :",
     "mentions": []
    },
    {
     "id": "c5-b74",
     "text": "— Faim.",
     "mentions": []
    },
    {
     "id": "c5-b75",
     "text": "Le mot vint. Il le regarda venir avec une espèce de désolation.",
     "mentions": []
    },
    {
     "id": "c5-b76",
     "text": "— Tu as pris celui-là, dit Séverin, parce que tu l’as vu tenir un pont. Tu n’y as pas droit. Tu l’as en trop pour de bon : tu ne l’as jamais eu. Un mot qu’on n’a pas vécu ne pèse rien, et un nœud ne peut pas manger ce qui ne pèse rien. Ça ne t’a rien pris, parce que tu n’avais rien à donner.",
     "mentions": []
    },
    {
     "id": "c5-b77",
     "text": "— Alors je ne peux pas.",
     "mentions": []
    },
    {
     "id": "c5-b78",
     "text": "— Tu peux. Tu as des mots qui pèsent, tout le monde en a. Tu en as au moins un, je l’ai vu sur ta figure quand tu as refusé de le donner à une pierre. Tu as bien fait. On ne donne pas ça pour une pierre. Le jour où tu noueras, ce sera avec celui-là, ou avec un autre que tu auras vécu d’ici là, et tu sauras que tu peux parce que ça te fera mal. C’est le seul signe.",
     "mentions": []
    },
    {
     "id": "c5-b79",
     "text": "Bastien défit le nœud, lentement, et rendit la ficelle. Il ne demanda pas comment on filait une âme. Aube vit qu’il y pensait.",
     "mentions": []
    },
    {
     "id": "c5-b80",
     "text": "La nuit vint tout à fait. Le feu de lattes s’éteignit et Garance ne le ralluma pas ; elle dit que le bois de porte de Sombreval ne devait pas se brûler pour rien, et que personne n’avait froid. Personne ne dit le contraire. La Tende grondait en bas, brune, pleine de portes vertes, et montait ; on l’entendait monter, c’était une note qui changeait, elle aussi.",
     "mentions": []
    },
    {
     "id": "c5-b81",
     "text": "Aube ne dormait pas. Elle avait dans la poche de sa chemise la moitié de ficelle grise que Séverin lui avait donnée, et elle la tenait, et elle pensait que ce n’était pas la sienne, et qu’elle n’avait plus rien qui fût à elle, pas même un poignet noué. Alors elle se leva sans bruit, alla jusqu’au bât de Vergogne, où Garance gardait, dans un sachet cousu au cuir et que la Fosse n’avait pas eu, une poignée de chanvre peigné des Hauts, celle qu’elle vendait par pincées aux mères pour les cordelettes de sept ans. Elle en prit une pincée. Elle revint s’asseoir contre le mur, dans le noir, et elle fila.",
     "mentions": []
    },
    {
     "id": "c5-b82",
     "text": "Elle fila entre le pouce et l’index, sans rouet, sans reculer, comme on file une cordelette : en tordant, en tirant, en soufflant sur le fil pour qu’il se couche. Cela prit ce que prend une lampe. Quand ce fut fini, elle avait deux avant-bras de ficelle grise, un peu inégale, à elle. Elle la noua à son poignet gauche. Puis, sur la ficelle, tout près du poignet, elle fit un premier nœud, petit, serré, sans mot dedans, un nœud de cordelette, un nœud pour se souvenir : « le pont ».",
     "mentions": []
    },
    {
     "id": "c5-b83",
     "text": "Elle hésita. Puis elle en fit un second, à un doigt du premier : « les anneaux ».",
     "mentions": []
    },
    {
     "id": "c5-b84",
     "text": "De l’autre côté de la voûte, Garance, qui ne dormait pas non plus, la regardait faire dans le noir, et ne dit rien, et fit le compte.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "La benne",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Malebosse sentait le chanvre vert, et c’était une odeur qu’Aube connaissait par le mauvais bout.",
     "mentions": [
      "malebosse"
     ]
    },
    {
     "id": "c6-b02",
     "text": "Elle connaissait le chanvre peigné, roui, séché, blond, tel qu’il arrivait dans la Salle en nappes prêtes à filer. Elle n’avait jamais vu d’où il venait : ces terrasses étroites accrochées à la rive d’ombre, une trentaine, empilées comme des marches jusqu’au pied de la falaise, où des hommes et des femmes courbés semaient à la volée dans une terre noire de pluie, et ces claies de séchage vides, hautes comme des maisons, qui attendaient l’été, et ces bassins de rouissage taillés dans le roc où l’eau brune de la Tende arrivait par des rigoles et ressortait plus brune encore. Tout Malebosse était fait pour la plante. Les maisons n’étaient que ce qui restait de place.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "— C’est d’ici, dit Garance, que vient ton long brin. Tout le chanvre de la Corderie monte de ces terrasses. Tu as filé trois ans de Malebosse sans le savoir.",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "— Je ne savais pas non plus pour quoi.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "— Ça fait deux choses. Il va falloir que tu commences à demander, la fileuse.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "Il ne pleuvait plus. Le ciel s’était levé d’un coup, dans la nuit, et au matin il était haut, blanc et froid, et la Tende, en bas, n’en avait pas profité pour redescendre : elle grondait plus fort que la veille, et au-delà de Malebosse, vers le nord, elle s’enfonçait entre deux parois qui se rapprochaient jusqu’à se toucher presque, et là il n’y avait plus de chemin. Les Gorges Fermées. La rive d’ombre s’arrêtait net contre le roc. Pour continuer vers les Hauts, il fallait repasser à l’ouest, et à l’ouest il n’y avait pas de pont.",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "Il y avait la benne.",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "Aube la vit avant de comprendre ce que c’était : un fil tendu en travers du vide, d’un pilier de roche à un autre, à quatre-vingts pas au-dessus de la rivière, si fin de loin qu’on l’aurait pris pour une fissure du ciel. Et sur le fil, immobile, à mi-chemin, une chose qui pendait, brune, grosse comme une hotte. En approchant, le fil devint un câble, gros comme un bras, goudronné, luisant ; la chose devint une nacelle de vannerie et de cuir, ouverte, suspendue au câble par deux poulies de bois et un anneau ; et sur la lèvre de l’est, sous un appentis de lauzes, un vieil homme tournait un cabestan à quatre bras, lentement, en chantant faux, et la nacelle avançait d’un pied à chaque tour.",
     "mentions": [
      "la-benne"
     ]
    },
    {
     "id": "c6-b09",
     "text": "— Firmin, dit Garance. Il tient la benne depuis avant ma naissance. Ne lui demande pas si c’est loin, de l’autre côté.",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c6-b11",
     "text": "— Tu verras.",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "Firmin les vit venir, arrêta le cabestan, cala la manivelle avec une cheville de bois et vint à leur rencontre en s’essuyant les mains. C’était un homme de soixante-dix ans, plié, avec des avant-bras de gabarier et un visage tout en rides qui avaient l’air d’aller vers la bouche pour l’entendre. Il embrassa Garance. Il regarda les autres, et la mule.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "— Quatre et une bête, dit-il. Deux par nacelle, la bête en sangle dessous avec quelqu’un dans la nacelle pour lui parler. Trois voyages. Vingt deniers, la bête dix, je fais le tour.",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "— Marché, dit Garance. Tu me le mets sur la ficelle, je n’ai plus un sol, la Fosse a tout bu.",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "— La Fosse ? Tu es passée sur la Traversée ?",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— Elle a filé sous le convoi de chez toi. Tout le monde est là. C’est la petite qui l’a tenue.",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "Firmin regarda Aube. Il regarda son poignet, la ficelle neuve, inégale, à deux nœuds. Il ne dit rien pendant un moment. Puis :",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "— Alors la bête, c’est gratuit.",
     "mentions": []
    },
    {
     "id": "c6-b19",
     "text": "Il retourna à son cabestan.",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "Le passage se fit dans l’ordre que Firmin voulut. Garance d’abord, avec Bastien, dans la nacelle qui grinçait ; on la vit s’éloigner sur le câble, se rapetisser, pendre au-dessus du vide comme un fruit, et toucher l’autre lèvre, où l’on distinguait un second appentis et un second cabestan, mais personne pour le tourner. Firmin tournait des deux côtés à la fois, expliqua-t-il, par une corde de rappel qui courait sous le câble : il tirait la nacelle à lui ou l’envoyait, seul, depuis trente ans. Il avait dit cela sans lever les yeux, en tournant, et Aube avait vu la ficelle grise, très ancienne, très noire de goudron, nouée sur le câble à l’anneau du pilier de l’est, à hauteur de ses yeux : un nœud de Retenue, gros comme deux poings, aux torons fondus par les années.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "— C’est le vôtre.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "— Trente et un ans. Il a fait dix mille voyages. Il en fera dix mille.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "— Vous avez donné quoi ?",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "Firmin arrêta le cabestan. Il se retourna vers elle et sembla, pendant un instant, chercher un mot, non parce qu’il l’avait perdu, mais pour l’expliquer sans lui. Il montra de la main l’autre lèvre de la gorge, l’appentis vide, le chemin qui montait derrière vers les Hauts, tout ce qui n’était pas ici.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "— Là-bas, dit-il. Tout là-bas.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "Et il rit, d’un rire qui n’avait rien d’amer, comme d’une plaisanterie qu’il faisait à lui-même depuis trente et un ans, et il se remit à tourner.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c6-b27",
     "text": "Ce fut pendant qu’il tournait, la nacelle revenant à vide, que Séverin s’approcha de lui, tira de sa manche une petite ficelle nouée et la lui mit dans la main, avec deux pièces.",
     "mentions": []
    },
    {
     "id": "c6-b28",
     "text": "Aube le vit. Elle était à cinq pas, elle tenait Vergogne par le licol pendant que Garance, de l’autre côté, criait à la mule des choses que le vide emportait. Elle vit la ficelle, courte, à sept ou huit nœuds, du parler de la Corderie et non de celui des Hauts, celui que les compagnons se passaient d’une gabare à l’autre. Elle vit les pièces. Elle entendit Séverin dire : « Pour la gabare de la Corderie, quand elle repassera à Pont-Sauvage. Pour Maître Aymon, de ma main. » Et Firmin qui hochait la tête et glissait la ficelle dans sa ceinture sans regarder.",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "Séverin se retourna, et la trouva qui le regardait, et ne détourna pas les yeux.",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "— Tu lui as dit où je vais, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "— Oui. Haut-Charme, par le col, et que tu ne redescendras pas avant. Que la Fonte a huit jours d’avance. Que tu as tenu la Traversée avec un nœud de gabare, et le mot. Qu’il y a le fils Dautry avec toi et que sa mère peut cesser de faire draguer le Déversoir. C’est mon travail. Je te l’ai dit sur le pont.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "Elle le regarda un long moment. Elle aurait pu, pensa-t-elle, prendre la ficelle dans la ceinture du vieux, la jeter dans la gorge, et Firmin l’aurait laissée faire, parce que la bête était gratuite et qu’il avait vu son poignet. Elle aurait pu. Elle sentit qu’elle en avait envie, et elle sentit aussitôt, au-dessous de l’envie, la forme exacte de ce que ça voudrait dire : qu’elle se cachait. Qu’elle fuyait, comme Aymon l’écrirait. Qu’elle montait aux Hauts pour qu’on ne la trouve pas.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "Ce n’était pas pour ça qu’elle montait. Elle le sut à cet instant, avec la même netteté qu’un fil qui ne tremble pas.",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "— Bien, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "Séverin cligna des yeux. C’était la première fois qu’elle le voyait pris de court.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "— Bien ?",
     "mentions": []
    },
    {
     "id": "c6-b37",
     "text": "— Qu’il sache où je suis. Qu’il sache que je vais chercher quelque chose. Je ne me cache pas de lui, Séverin. Je ne me cache de personne. Quand je redescendrai, je redescendrai par la porte.",
     "mentions": []
    },
    {
     "id": "c6-b38",
     "text": "— Tu redescendras.",
     "mentions": []
    },
    {
     "id": "c6-b39",
     "text": "— Avant la lune. C’est la Charte. On m’a lu la Charte, je ne l’ai pas oubliée.",
     "mentions": []
    },
    {
     "id": "c6-b40",
     "text": "Il resta une seconde sans rien dire. Puis il inclina la tête, très légèrement, comme on incline la tête devant un compagnon, et retourna aider Firmin.",
     "mentions": []
    },
    {
     "id": "c6-b41",
     "text": "Vergogne fut le troisième voyage, avec eux deux au-dessus.",
     "mentions": []
    },
    {
     "id": "c6-b42",
     "text": "La mule n’aimait pas cela. Elle l’avait fait onze fois dans sa vie, dit Firmin, et onze fois elle n’avait pas aimé ; on lui passait deux larges sangles de cuir sous le ventre, croisées au dos, réunies au-dessus par un anneau de fer forgé, et l’anneau se pendait par une corde courte à celui de la nacelle, de sorte que la bête voyageait sous les passagers, les quatre pattes dans le vide, en tournant lentement sur elle-même. La personne dans la nacelle lui parlait. C’était le rôle.",
     "mentions": []
    },
    {
     "id": "c6-b43",
     "text": "— C’est pour ça qu’elle te connaît, dit Firmin à Aube. Une bête qui ne connaît pas la voix rue dans les sangles. Et sur la corde de sangle, la ficelle, la vieille, c’est la mienne aussi, elle a l’âge de la bête, elle a tenu onze fois. Monte.",
     "mentions": []
    },
    {
     "id": "c6-b44",
     "text": "Elles montèrent, Aube et Séverin, dans la nacelle de vannerie qui grinçait ; Firmin sangla Vergogne dessous, vérifia l’anneau, la corde courte, le nœud noir et fondu qui la tenait, et cala tout d’une main ; il souhaita bon voyage d’un signe et se mit au cabestan.",
     "mentions": []
    },
    {
     "id": "c6-b45",
     "text": "Le pilier s’éloigna. Le vide vint.",
     "mentions": []
    },
    {
     "id": "c6-b46",
     "text": "Aube n’avait pas eu peur sur la Traversée. Il y avait eu le tablier, la rampe, les cordes chantantes, une chose faite pour qu’on marche dessus. Ici il n’y avait rien. La nacelle pendait à un fil, le fil pendait au ciel, et dessous, à quatre-vingts pas, la Tende brune emplissait le fond des Gorges Fermées d’un fracas qu’on prenait dans les dents. Vergogne tournait lentement au bout de sa corde, la tête basse, les oreilles rabattues, et Aube lui parlait, penchée par-dessus la vannerie, de tout et de rien, du prix du sel et des nouets d’hier, et la mule l’écoutait, et ses oreilles se relevaient à demi.",
     "mentions": []
    },
    {
     "id": "c6-b47",
     "text": "Ils étaient au milieu quand la corde de sangle glissa.",
     "mentions": []
    },
    {
     "id": "c6-b48",
     "text": "Ce fut un son sec, à peine un son, sous le fracas : le grincement bref d’une ficelle vieille comme une mule qui cède d’un coup dans un nœud de trente ans, et la corde courte fila dans l’anneau de la nacelle d’un pied, d’un coup, et Vergogne tomba d’un pied, et cria. Un cri de mule au-dessus du vide, qui n’est pas un bruit qu’on oublie. La sangle de droite, tordue par la chute, remonta d’un coup sur le flanc ; celle de gauche tint ; la bête pendit de travers, les pattes battant l’air, et se mit à ruer, et à chaque ruade la corde courte gagnait un pouce dans l’anneau.",
     "mentions": []
    },
    {
     "id": "c6-b49",
     "text": "Séverin fut sur la corde avant qu’Aube ait fini de comprendre. Il s’était jeté à plat ventre sur le bord de la nacelle, les deux bras dehors, et il avait saisi la corde courte à pleines mains sous l’anneau, et il la tenait ; on voyait les veines de son cou ; et la mule pesait dessus, et ruait, et la corde glissait quand même entre ses paumes, lentement, en fumant.",
     "mentions": []
    },
    {
     "id": "c6-b50",
     "text": "— La ficelle ! cria-t-il. Nœud d’amarre sur la corde, au-dessus de mes mains, dans l’anneau ! Je ne peux pas lâcher !",
     "mentions": []
    },
    {
     "id": "c6-b51",
     "text": "Elle avait la moitié de sa ficelle à lui, dans sa chemise, et la sienne, au poignet. Elle prit les deux. Elle n’avait pas le temps de choisir et elle ne choisit pas : elle noua les deux bouts ensemble d’un nœud de pêcheur, d’un geste, sans regarder, comme on aboute deux mèches au rouet, et elle passa la ficelle double autour de la corde courte, entre les mains blanches de Séverin et l’anneau de fer, un tour mort, en serrant fort pour mordre le goudron, une demi-clé…",
     "mentions": []
    },
    {
     "id": "c6-b52",
     "text": "La mule rua. La corde sauta d’un pouce. La demi-clé se défit sous ses doigts.",
     "mentions": []
    },
    {
     "id": "c6-b53",
     "text": "— Je n’ai pas les deux mains !",
     "mentions": []
    },
    {
     "id": "c6-b54",
     "text": "— Passe-moi le bout !",
     "mentions": []
    },
    {
     "id": "c6-b55",
     "text": "Elle lui passa le bout de la ficelle double entre les doigts d’une main, sans qu’il lâche la corde, et il le coinça, et de l’autre main elle refit la demi-clé, la seconde, rentra le bout sous le tour, et c’était un nœud d’amarre, fait à deux, une main sur les tours et une main sur les clés, et la ficelle qui le faisait avait deux âmes : la sienne, grise, inégale, filée d’une pincée de Malebosse contre un mur de Sombreval ; et celle de Séverin, tordue serré, filée dans la Salle des Cordes par la meilleure main d’Aymon.",
     "mentions": []
    },
    {
     "id": "c6-b56",
     "text": "Il n’y avait qu’un nœud. Il n’y avait qu’un instant.",
     "mentions": []
    },
    {
     "id": "c6-b57",
     "text": "Elle approcha la bouche du nœud. Séverin, à côté d’elle, la joue contre la vannerie, fit de même, et pendant une fraction de seconde ils se regardèrent à un pouce l’un de l’autre, par-dessus une ficelle grise, avec la même question dans les yeux : « lequel de nous deux. »",
     "mentions": []
    },
    {
     "id": "c6-b58",
     "text": "Ils serrèrent ensemble.",
     "mentions": []
    },
    {
     "id": "c6-b59",
     "text": "Elle ne l’entendit pas ; on n’entend pas les mots donnés. Elle sentit le souffle de Séverin sur ses doigts, et elle donna le sien, le seul qu’elle avait, celui qui lui remplissait la bouche depuis que le pilier s’était éloigné et que la mule était tombée d’un pied ; elle le donna comme elle avait donné l’autre, sans marchander, parce qu’il était là.",
     "mentions": []
    },
    {
     "id": "c6-b60",
     "text": "— Peur.",
     "mentions": []
    },
    {
     "id": "c6-b61",
     "text": "La corde s’arrêta.",
     "mentions": []
    },
    {
     "id": "c6-b62",
     "text": "Vergogne pendit de travers, immobile, une sangle sur le flanc, les pattes raides, et ne tomba pas d’un pouce de plus. La corde courte, sous le nœud à deux ficelles, était comme coulée dans le fer. Séverin ouvrit les mains. Ses paumes étaient noires de goudron et rouges dessous, à vif. Il les regarda. Puis il regarda le nœud.",
     "mentions": []
    },
    {
     "id": "c6-b63",
     "text": "— Ça ne devrait pas, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b64",
     "text": "Il l’avait dit très bas.",
     "mentions": []
    },
    {
     "id": "c6-b65",
     "text": "— Deux âmes. Deux mots. Un nœud. Ce n’est pas dans le Registre. Ce n’est dans aucune page. Un nœud a une bouche.",
     "mentions": []
    },
    {
     "id": "c6-b66",
     "text": "— Il en a eu deux.",
     "mentions": []
    },
    {
     "id": "c6-b67",
     "text": "— Il tient.",
     "mentions": []
    },
    {
     "id": "c6-b68",
     "text": "— Il tient.",
     "mentions": []
    },
    {
     "id": "c6-b69",
     "text": "Sur la lèvre de l’ouest, Garance criait quelque chose, et Firmin, sur celle de l’est, tournait le cabestan comme un homme qui pompe une barque qui coule, et la nacelle repartit, par saccades, vers le pilier, avec dessous une mule de travers qui avait cessé de ruer et regardait le vide avec un air d’offense profonde.",
     "mentions": []
    },
    {
     "id": "c6-b70",
     "text": "— Tu as donné quoi ? dit Aube.",
     "mentions": []
    },
    {
     "id": "c6-b71",
     "text": "Il ouvrit la bouche, et elle vit le trou, elle le reconnut, la marche manquée. Il mit la main sur son bras, sur son épaule, puis sur sa propre poitrine, et frotta, comme on se frotte pour se réchauffer.",
     "mentions": []
    },
    {
     "id": "c6-b72",
     "text": "— Froid, dit-elle.",
     "mentions": []
    },
    {
     "id": "c6-b73",
     "text": "Il hocha la tête.",
     "mentions": []
    },
    {
     "id": "c6-b74",
     "text": "— J’ai grandi sur une gabare, dit-il. Je le connais assez pour le perdre sans qu’il me manque. Et toi ?",
     "mentions": []
    },
    {
     "id": "c6-b75",
     "text": "Elle chercha. Elle savait ce qu’elle avait eu, là, penchée sur le vide, quand la mule était tombée. Elle le savait exactement, elle l’avait encore dans les mains, dans le ventre, ce n’était pas parti avec le mot, c’était là. Mais quand elle voulut le dire, il n’y eut que la marche manquée, et la chose sans contour, et elle secoua la tête, et posa la main sur sa gorge.",
     "mentions": []
    },
    {
     "id": "c6-b76",
     "text": "Séverin comprit. Il ne dit rien pendant tout le reste du câble. Ce fut sur la lèvre de l’ouest, une fois la mule dessanglée et Garance en train de lui parler dans les oreilles en la frottant de partout, qu’il parla, sans la regarder.",
     "mentions": []
    },
    {
     "id": "c6-b77",
     "text": "— Tu donnes ce qui te fait mal, dit-il.",
     "mentions": []
    },
    {
     "id": "c6-b78",
     "text": "— Je donne ce qui vient.",
     "mentions": []
    },
    {
     "id": "c6-b79",
     "text": "— Ce qui te vient, c’est ce qui te fait mal, parce que tu n’as jamais rien eu d’autre dans la bouche. Réfléchis une fois, la fileuse. À Pont-Sauvage tu as donné le mot qui sert à dire qu’on n’a pas mangé. Ici tu as donné celui qui sert à dire qu’on a besoin qu’on vienne. Continue comme ça, et un jour tu n’auras plus un seul mot pour demander quoi que ce soit à qui que ce soit. Tu tiendras des ponts et tu crèveras debout sans pouvoir dire de quoi. Ce ne sont pas des mots à donner. Ce sont des mots à garder.",
     "mentions": []
    },
    {
     "id": "c6-b80",
     "text": "— Tu as donné « froid ».",
     "mentions": []
    },
    {
     "id": "c6-b81",
     "text": "— J’ai donné un mot que je connais et qui ne m’a jamais servi à rien : personne n’est jamais venu quand j’avais froid. Toi, tu perds les mots qui font qu’on vient te chercher. Ce n’est pas pareil. Ce n’est pas pareil du tout.",
     "mentions": []
    },
    {
     "id": "c6-b82",
     "text": "Elle ne répondit pas. Elle regarda son poignet, où il n’y avait plus rien, de nouveau : la ficelle neuve, à deux nœuds, était sur la corde de sangle de Vergogne avec la moitié de la sienne. Elle avait filé une cordelette pour la perdre en un jour. Elle en filerait une autre. Elle sentit, très loin sous tout cela, quelque chose qui aurait dû avoir un nom, et qui n’en avait plus, et qui ressemblait à l’envie de s’asseoir.",
     "mentions": []
    },
    {
     "id": "c6-b83",
     "text": "De l’autre côté de la gorge, Firmin avait fini son tour de cabestan. Il se tenait au bord, la main levée, et il cria quelque chose qu’on n’entendit pas ; puis il montra, du bras, le nord, le chemin qui montait au-dessus d’eux vers un mur de nuages où le col devait être, et il fit ce geste qu’il avait fait le matin, la main tendue vers tout ce qui n’était pas ici, et Aube comprit qu’il lui souhaitait bon voyage avec le seul mot qu’il n’avait plus.",
     "mentions": []
    },
    {
     "id": "c6-b84",
     "text": "— Il a dans sa ceinture une ficelle pour Maître Aymon, dit Bastien qui les avait rejoints. Je l’ai vue. Tu l’as vue aussi.",
     "mentions": []
    },
    {
     "id": "c6-b85",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c6-b86",
     "text": "— Et tu la laisses partir.",
     "mentions": []
    },
    {
     "id": "c6-b87",
     "text": "Aube regarda vers le sud, où la vallée descendait, gorge après gorge, vers un lac qu’on ne voyait pas, et une ville dessous, et une corde qui chantait faux.",
     "mentions": []
    },
    {
     "id": "c6-b88",
     "text": "— Qu’il sache, dit-elle. Je ne monte pas pour me cacher. Je monte pour chercher. Et quand j’aurai trouvé, je redescendrai par la porte, avant la lune, et il faudra bien qu’il m’écoute, parce qu’il l’aura su d’avance.",
     "mentions": []
    },
    {
     "id": "c6-b89",
     "text": "Puis elle se tourna vers le nord, vers le mur de nuages, et se mit à monter.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-7",
   "number": 7,
   "title": "La harpe du col",
   "blocks": [
    {
     "id": "c7-b01",
     "text": "Le brouillard les prit une heure au-dessus de la benne, et ne les rendit pas.",
     "mentions": [
      "le-col-de-la-deliee"
     ]
    },
    {
     "id": "c7-b02",
     "text": "Ce n’était pas un brouillard de vallée, de ceux qui traînent le matin sur la Retenue et que le soleil range avant midi. C’était le mur de nuages qu’ils avaient vu de Malebosse, posé sur l’épaule de la montagne comme un couvercle, et ils étaient entrés dedans par en dessous, et il n’y avait plus, d’un coup, ni haut ni bas, ni gorge ni ciel, seulement dix pas de chemin gris devant les sabots de Vergogne et le bruit de leurs propres pieds. La Tende s’était tue. On ne l’entendait plus depuis les Gorges Fermées, et Aube s’aperçut qu’elle en avait le souffle coupé, comme quand la corde de la Levée avait cessé de chanter au premier tournant du rivage : le monde, sans un bruit de fond, ne semblait pas tenir.",
     "mentions": []
    },
    {
     "id": "c7-b03",
     "text": "— On ne passe pas le col de nuit, dit Garance. Personne ne passe le col de nuit, même quand il n’y a pas de brouillard, et il y a toujours du brouillard. On dort à l’Abri. On repart avant l’aube, quand le vent tombe.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c7-b04",
     "text": "— Comment tu sais où est l’Abri ?",
     "mentions": []
    },
    {
     "id": "c7-b05",
     "text": "— Je compte mes pas depuis la benne. Je compte depuis vingt ans. Ne me parle pas, tu me fais perdre le compte.",
     "mentions": []
    },
    {
     "id": "c7-b06",
     "text": "L’Abri des Muletiers était une voûte de pierres sèches, basse, enfumée, accrochée au chemin sous un ressaut de roc, avec un anneau de fer pour la bête et une réserve de bois qu’on n’avait pas le droit de vider, disait une règle gravée au-dessus de la porte en lettres qu’Aube déchiffra du doigt : « Prends. Laisse. » Ils prirent. Il faisait un froid qu’on ne connaissait pas à Tressaille, un froid sec qui entrait par les manches, et Bastien, qui n’avait jamais eu froid de sa vie, ne le dit pas, mais il se mit à parler d’autre chose très vite, ce qui revenait au même. Séverin fit le feu. Il ne pouvait plus dire ce qu’il avait, et il fit le feu.",
     "mentions": []
    },
    {
     "id": "c7-b07",
     "text": "Ils mangèrent ce que Firmin leur avait donné, du lard fumé au genévrier qui sentait la montagne et une miche des Hauts, noire, dense, où le chanvre entrait pour un tiers, disait Garance, et qui tenait au ventre comme une pierre. Aube en mangea sa part. Elle ne pouvait plus dire ce qu’elle avait au ventre ; elle mangea quand même, et remarqua que c’était plus simple.",
     "mentions": []
    },
    {
     "id": "c7-b08",
     "text": "Bastien s’assit près d’elle, contre le mur, pour la nuit. Il ne demanda pas. Il déroula son manteau de voyage trop neuf, qui était grand, et en jeta un pan sur les épaules d’Aube sans la regarder, et regarda le feu. Elle le laissa faire. Ils étaient assis dans le noir, sous le même drap, à écouter Vergogne mâcher et le vent chercher la porte, et elle sentit contre son bras le bras du garçon, et ce n’était rien, c’était de la chaleur, et elle ne le rangea nulle part, elle le laissa là.",
     "mentions": [
      "bastien-dautry"
     ]
    },
    {
     "id": "c7-b09",
     "text": "— Tu crois qu’ils sauront lire la ficelle ? demanda-t-il tout bas.",
     "mentions": []
    },
    {
     "id": "c7-b10",
     "text": "— Garance dit que oui.",
     "mentions": []
    },
    {
     "id": "c7-b11",
     "text": "— Et si ce qu’elle dit ne sert à rien ?",
     "mentions": []
    },
    {
     "id": "c7-b12",
     "text": "— Alors je redescendrai quand même, et j’aurai fait le chemin pour rien, et je monterai sur la Levée à la lune, et je dirai ce que je dirai.",
     "mentions": []
    },
    {
     "id": "c7-b13",
     "text": "— Tu ne sais pas encore ce que tu diras.",
     "mentions": []
    },
    {
     "id": "c7-b14",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c7-b15",
     "text": "Il se tut un moment.",
     "mentions": []
    },
    {
     "id": "c7-b16",
     "text": "— Ma mère l’a lue, tu sais. La Charte. Elle l’a lue en la détestant, ça se voyait. Ce n’est pas une méchante femme. C’est une femme qui a compté les maisons.",
     "mentions": []
    },
    {
     "id": "c7-b17",
     "text": "— Je sais. Je l’ai entendue.",
     "mentions": []
    },
    {
     "id": "c7-b18",
     "text": "— Je voulais te dire que je le sais aussi. Que je ne suis pas ici contre elle. Je suis ici parce que compter les maisons ne suffit pas, et qu’elle le sait, et qu’elle n’a pas trouvé quoi faire d’autre.",
     "mentions": []
    },
    {
     "id": "c7-b19",
     "text": "Aube ne répondit pas. Elle pensa qu’il était étrange qu’un fils de Maison ait besoin de dire qu’il aimait sa mère à une fileuse, et que c’était pourtant à elle qu’il le disait, et elle se demanda pourquoi, et n’alla pas plus loin, parce que le feu baissait et que ses yeux se fermaient.",
     "mentions": []
    },
    {
     "id": "c7-b20",
     "text": "Garance les réveilla dans le noir. Ce n’était pas l’aube ; c’était l’heure où l’aube se prépare, où le froid est le plus dur et le vent le plus bas.",
     "mentions": []
    },
    {
     "id": "c7-b21",
     "text": "— Écoutez, dit-elle.",
     "mentions": []
    },
    {
     "id": "c7-b22",
     "text": "Ils écoutèrent. Dehors, dans le brouillard qu’on ne voyait pas mais qu’on sentait sur la figure comme une main mouillée, il y avait une note.",
     "mentions": []
    },
    {
     "id": "c7-b23",
     "text": "Une seule, très haute, très fine, tenue, qui venait de nulle part et ne bougeait pas. Puis, à côté d’elle, une autre, un peu plus basse. Puis une troisième, très loin, plus grave, qui montait et descendait avec le souffle du vent. Ce n’était pas le pont de Pont-Sauvage : le pont chantait un accord, un tout, où l’on cherchait la phrase. Ici, chaque note était seule, séparée des autres par des longueurs de silence gris, posée dans le brouillard comme une lampe.",
     "mentions": []
    },
    {
     "id": "c7-b24",
     "text": "— La harpe, dit Garance. Les Veilleurs ont tendu des cordes sur le col, de roc en roc, depuis toujours, et chaque corde a sa note, et chaque note est à sa place. On ne voit pas le chemin. On l’entend. On marche vers la note qui monte, et quand elle est au-dessus de vous, on cherche la suivante. Il y en a quarante-deux jusqu’à la Pierre du Col. Vergogne les connaît mieux que moi.",
     "mentions": []
    },
    {
     "id": "c7-b25",
     "text": "— Qui les entretient ? dit Séverin.",
     "mentions": []
    },
    {
     "id": "c7-b26",
     "text": "Garance ne répondit pas tout de suite. Elle chargeait la mule dans le noir, et ses mains ne s’arrêtèrent pas.",
     "mentions": []
    },
    {
     "id": "c7-b27",
     "text": "— Quelqu’un à qui je porte des ficelles depuis quinze ans, dit-elle. Mon frère en a tendu la moitié. Marchez.",
     "mentions": []
    },
    {
     "id": "c7-b28",
     "text": "Ils marchèrent.",
     "mentions": []
    },
    {
     "id": "c7-b29",
     "text": "Aube n’oublia jamais cette heure-là. Le chemin n’existait pas ; il y avait de la pierre sous les pieds, et du gris devant, et parfois un bord qu’on sentait plutôt qu’on ne voyait, un souffle plus froid qui montait d’un vide. On marchait vers une note. Elle grossissait, elle devenait une corde qu’on ne voyait pas, tendue quelque part au-dessus dans la brume, qui vibrait au vent avec un son de verre ; on passait dessous, et derrière, déjà, une autre appelait, plus loin, plus haut, un peu différente, et on allait vers elle. Quarante-deux. Aube compta. Elle ne pouvait pas ne pas compter. À la dix-septième, elle s’aperçut que Vergogne allait devant, seule, la sonnaille au cou, et que Garance la suivait sans la guider ; la mule allait de note en note comme on va de porte en porte dans une maison qu’on connaît.",
     "mentions": []
    },
    {
     "id": "c7-b30",
     "text": "À la trentième, le gris changea.",
     "mentions": []
    },
    {
     "id": "c7-b31",
     "text": "Ce fut d’abord imperceptible : le brouillard devant elle n’était plus gris, il était blanc, puis d’un blanc qu’on aurait dit éclairé de l’intérieur, et le froid se fit plus vif, plus sec, et le vent qui avait été partout se mit à venir d’un seul côté, de l’ouest, régulier. À la trente-cinquième, elle vit ses propres mains. À la quarantième, elle vit une corde.",
     "mentions": []
    },
    {
     "id": "c7-b32",
     "text": "Elle était tendue au-dessus du chemin, d’un pilier de roc gris à un autre, à hauteur de deux hommes, grise de goudron, fine comme un doigt, et couverte d’un givre blanc qui la faisait briller ; le vent la frappait de côté et elle chantait, une note claire, un peu tremblée, qu’on avait suivie de loin et qui de près n’était plus qu’un fil dans le ciel. Aube passa dessous et leva la tête, et derrière la corde le brouillard s’ouvrit.",
     "mentions": []
    },
    {
     "id": "c7-b33",
     "text": "Elle s’arrêta, parce qu’on s’arrête.",
     "mentions": []
    },
    {
     "id": "c7-b34",
     "text": "Ils étaient au-dessus des nuages. Le col était une selle de pierre nue entre deux épaules de la montagne, large de cent pas, et tout autour, en dessous, jusqu’aux Aiguilles qui se dressaient en face, roses, si proches qu’on aurait cru pouvoir les toucher, il y avait une mer. Une mer de nuages, blanche, immobile, qui remplissait la vallée de la Tende d’un bord à l’autre et s’en allait vers le sud sans une ride, et sur laquelle le soleil, qui venait de sortir d’entre deux sommets, mettait une lumière qu’Aube n’avait aucun mot pour dire et dont elle sut, à l’instant, qu’elle ne le donnerait jamais à un nœud, quel qu’il soit. En bas, sous cette mer, il y avait Malebosse, Sombreval, Pont-Sauvage, un lac et une ville, et on n’en voyait rien, et pour la première fois depuis la Salle des Cordes, cela ne lui fit pas peur. Cela ne pouvait pas. Elle n’avait plus le mot. Elle regarda, simplement, avec la chose sans contour, et la chose sans contour se tenait tranquille.",
     "mentions": []
    },
    {
     "id": "c7-b35",
     "text": "Et sur le col, partout, des cordes.",
     "mentions": []
    },
    {
     "id": "c7-b36",
     "text": "Des dizaines. Tendues de pilier en pilier, de roc en roc, à toutes les hauteurs, dans tous les sens, certaines grosses comme un bras et d’autres fines comme des cheveux, toutes givrées, toutes brillantes, et le vent d’ouest les prenait toutes ensemble et elles chantaient toutes, chacune sa note, quarante-deux et bien d’autres, un chant qui n’était ni un accord ni une mélodie, quelque chose d’avant la musique, comme si la montagne elle-même essayait des sons pour voir. La harpe. Ce n’était pas une image. C’était une harpe grande comme un col, dressée pour que les gens ne se perdent pas, et accordée par quelqu’un.",
     "mentions": []
    },
    {
     "id": "c7-b37",
     "text": "Le quelqu’un était là.",
     "mentions": []
    },
    {
     "id": "c7-b38",
     "text": "Il se tenait debout au pied d’un des grands piliers, à cinquante pas, le dos tourné, un homme grand et maigre dans un manteau de laine brune, avec un chapeau à large bord qu’il retenait d’une main contre le vent ; de l’autre, il tournait une clé de bois plantée dans la pierre, à la base d’une corde, lentement, en penchant la tête, et la note de la corde montait, montait, et s’arrêta quand il retira la main. Il écouta. Il fit un signe de tête à la corde, comme on remercie. Puis il se retourna, et il les vit.",
     "mentions": []
    },
    {
     "id": "c7-b39",
     "text": "Garance s’était arrêtée à côté de la mule. Elle ne bougea pas. Aube, qui la connaissait depuis six jours, ne l’avait jamais vue immobile ; ce fut cela qu’elle comprit d’abord, avant de comprendre le reste.",
     "mentions": []
    },
    {
     "id": "c7-b40",
     "text": "L’homme ôta son chapeau. Il avait le visage de Garance, plus long, plus creusé, avec les mêmes yeux, et il souriait, et il ouvrait les bras, et il ne disait rien.",
     "mentions": [
      "aurele-malaurie"
     ]
    },
    {
     "id": "c7-b41",
     "text": "— Tu aurais pu répondre, dit Garance.",
     "mentions": []
    },
    {
     "id": "c7-b42",
     "text": "Sa voix ne ressemblait à rien de ce qu’elle avait dit en six jours.",
     "mentions": []
    },
    {
     "id": "c7-b43",
     "text": "— Quinze ans que je te porte des ficelles. Quinze ans que je te monte des ficelles et que je te redescends des ficelles, et à la fin je ne savais plus les lire, Aurèle, tu m’entends, je ne savais plus lire tes ficelles, tu ne faisais plus que des nœuds que je ne connaissais pas, et je les portais quand même à la vieille, et elle les lisait, elle, et elle ne me disait rien parce qu’elle ne pouvait rien dire, et je redescendais. Tu aurais pu répondre. Une fois. Avec un mot. Un seul. Tu en avais bien un.",
     "mentions": []
    },
    {
     "id": "c7-b44",
     "text": "L’homme ferma les bras, lentement. Il ne cessa pas de sourire, mais le sourire changea, et Aube vit qu’il y avait dessous exactement ce qu’il y avait sous la voix de Garance. Il porta la main à sa ceinture, où pendaient des ficelles, une dizaine, de toutes les longueurs, et en détacha une, et se mit à nouer. Vite. Ses doigts allaient comme ceux de Hersende, comme ceux de Séverin, exacts, et Aube, qui n’avait vu nouer le parler des Hauts qu’une fois, dans le noir, sur un bat-flanc, reconnut la façon sans reconnaître un seul mot.",
     "mentions": [
      "le-parler-noeud"
     ]
    },
    {
     "id": "c7-b45",
     "text": "Il tendit la ficelle à sa sœur.",
     "mentions": []
    },
    {
     "id": "c7-b46",
     "text": "Garance la prit. Elle la lut des doigts, lentement, en bougeant les lèvres, et elle s’arrêta au troisième nœud, et recommença, et s’arrêta encore.",
     "mentions": []
    },
    {
     "id": "c7-b47",
     "text": "— Je ne sais pas, dit-elle. Je ne sais pas ce que ça dit. Je sais celui-là, c’est « sœur ». Et celui-là, c’est « rester ». Après je ne sais plus. Je n’ai jamais appris. Je pensais que tu redescendrais.",
     "mentions": []
    },
    {
     "id": "c7-b48",
     "text": "Aurèle secoua la tête. Puis il fit une chose que personne n’attendait : il prit la main de sa sœur, la main qui tenait la ficelle, et la posa à plat sur sa propre poitrine, sur la laine brune, et la tint là, et il ouvrit la bouche, et rien ne sortit. Rien du tout. Pas la marche manquée qu’Aube connaissait, pas un mot qui manque : l’absence entière, la bouche d’un homme qui a tout donné, un par un, depuis quinze ans, à des cordes qui chantent pour que les gens ne se perdent pas dans le brouillard.",
     "mentions": []
    },
    {
     "id": "c7-b49",
     "text": "Garance retira sa main. Elle se retourna vers la mule, brusquement, et se mit à vérifier une sangle qui n’avait pas besoin d’être vérifiée.",
     "mentions": []
    },
    {
     "id": "c7-b50",
     "text": "— Bon, dit-elle. Bon. Il est vivant. Il tend des cordes. C’est ce que je vous disais.",
     "mentions": []
    },
    {
     "id": "c7-b51",
     "text": "Personne ne parla. Le vent chantait dans la harpe, et le soleil montait sur la mer de nuages, et Vergogne, qui connaissait l’homme, alla poser son mufle contre sa manche, et il lui gratta le front sans cesser de regarder le dos de sa sœur.",
     "mentions": []
    },
    {
     "id": "c7-b52",
     "text": "Ce fut Aube qui bougea. Elle traversa le col, dans le vent, jusqu’à lui, et tira de sa chemise le paquet de Hersende, l’œuf de ficelle nouée, et le lui tendit sans un mot, parce qu’il n’y avait pas de raison d’en gaspiller.",
     "mentions": []
    },
    {
     "id": "c7-b53",
     "text": "Il le prit. Il le déroula, lentement, sur toute sa longueur, deux fois la longueur du bras, et ses doigts coururent dessus comme sur une corde qu’on accorde, et son visage changea. Il relut. Il regarda Aube, longtemps, et elle soutint le regard. Puis il regarda vers le sud, vers la mer de nuages sous laquelle il y avait une Levée, et il porta deux doigts à ses lèvres, et les posa sur le troisième nœud de la ficelle, un nœud petit, double, tordu, qu’Aube avait vu Hersende serrer trois fois de suite comme on appuie sur une syllabe.",
     "mentions": []
    },
    {
     "id": "c7-b54",
     "text": "Il ne pouvait pas lui dire ce que c’était. Il montra, de la main, par-dessus l’épaule du col, le nord, où le chemin redescendait vers une vallée qu’on ne voyait pas encore, et il leva un doigt, puis en replia la moitié : une demi-journée. Il roula la ficelle, la lui rendit, et lui referma les doigts dessus, exactement comme Hersende l’avait fait sur le bat-flanc.",
     "mentions": []
    },
    {
     "id": "c7-b55",
     "text": "— Il dit qu’ils pourront la lire là-bas, dit Séverin derrière elle. Et qu’il faut se dépêcher.",
     "mentions": []
    },
    {
     "id": "c7-b56",
     "text": "— Il n’a rien dit.",
     "mentions": []
    },
    {
     "id": "c7-b57",
     "text": "— Non. Il faut quand même.",
     "mentions": []
    },
    {
     "id": "c7-b58",
     "text": "Aurèle remit son chapeau. Il alla à la corde qu’il accordait quand ils étaient arrivés, l’écouta encore une fois, et lui donna un dernier quart de clé, et la note monta d’un rien. Puis il prit le chemin du nord, devant la mule, sans se retourner, et Garance le suivit, à dix pas, en parlant à Vergogne du prix du lard.",
     "mentions": []
    },
    {
     "id": "c7-b59",
     "text": "Aube resta un instant la dernière sur le col. Elle regarda la mer de nuages, une dernière fois. Puis elle chercha, par habitude, ce qu’elle avait dans la bouche, pour le connaître avant d’avoir à le donner, comme Séverin le lui avait dit.",
     "mentions": []
    },
    {
     "id": "c7-b60",
     "text": "Il y avait un mot. Il était neuf. Elle ne l’avait jamais eu là, pas une fois, en dix-sept ans, et elle le tourna avec étonnement, comme une pièce trouvée dans un ourlet.",
     "mentions": []
    },
    {
     "id": "c7-b61",
     "text": "Elle ne le dit pas. Elle le garda. Puis elle descendit vers les Hauts, dans le chant des cordes.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-8",
   "number": 8,
   "title": "La veillée",
   "blocks": [
    {
     "id": "c8-b01",
     "text": "Haut-Charme était un village de vieux qui parlaient avec les mains.",
     "mentions": [
      "haut-charme"
     ]
    },
    {
     "id": "c8-b02",
     "text": "Aube le comprit avant d’avoir franchi la première clôture. Ils étaient descendus du col par un chemin qui perdait vite sa pierre pour de l’herbe rase, puis de la tourbe, puis une prairie mouillée où la Tende n’était plus une rivière mais cent ruisseaux qui sortaient de terre, partout, en gargouillant, entre des touffes de linaigrettes blanches. Les Fontaines. La Tende naissait là, dans une main de montagne ouverte, et au milieu de la main, sur une butte, il y avait Haut-Charme : trente toits de lauzes gris, un pont de cordes bas sur les ruisseaux, une grange plus grande que tout le reste, et autour de chaque maison, sans exception, un carré de terre noire fraîchement bêché, pas plus grand qu’une couverture, où rien ne poussait encore.",
     "mentions": [
      "la-tende"
     ]
    },
    {
     "id": "c8-b03",
     "text": "— Les carrés de chanvre, dit Garance. Une maison, un carré. On sème à la Fonte, on récolte à la fin de l’été, on file l’hiver. Chaque maison file sa corde. Chaque enfant file sa cordelette à sept ans dans le chanvre de sa maison. Ici, personne n’achète de ficelle à personne. Je vends tout ce que je veux à Haut-Charme, sauf ça.",
     "mentions": []
    },
    {
     "id": "c8-b04",
     "text": "Il y avait des gens dans les carrés, courbés, et des gens sur le seuil des maisons, et des brebis. Les gens levèrent la tête quand la sonnaille de Vergogne tinta, et ils regardèrent Aurèle, et Garance derrière lui, et le fils de Maison, et le manteau gris au col de goudron, et la fille au poignet nu ; et ils firent des signes. Pas des saluts. Des signes des mains, brefs, précis, adressés à Aurèle, qui répondait de même, et Aube vit une vieille femme éclater de rire sans un son en regardant Garance, et lui montrer quelque chose du doigt, et Garance rougir jusqu’aux oreilles.",
     "mentions": []
    },
    {
     "id": "c8-b05",
     "text": "— Elle dit que j’ai grossi, dit Garance.",
     "mentions": []
    },
    {
     "id": "c8-b06",
     "text": "— Tu comprends ?",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "— Celui-là, oui. Ce n’est pas du parler-nœud, c’est du parler-mains. Ils ont les deux. Le parler-nœud, c’est pour ce qui doit rester : les lettres, les comptes, les choses qu’on se dit d’une année sur l’autre. Les mains, c’est pour aujourd’hui. Et la bouche, c’est pour ce qui reste de la bouche. Il ne leur reste pas beaucoup.",
     "mentions": [
      "le-parler-noeud"
     ]
    },
    {
     "id": "c8-b08",
     "text": "Il y avait des enfants, aussi, une dizaine, qui couraient entre les maisons et criaient, et qui étaient les seuls à crier. Aube comprit pourquoi en les regardant : ils avaient tous leurs mots. On ne donnait pas avant quinze ans. Alors les enfants de Haut-Charme parlaient pour tout le village, à tue-tête, et le village les écoutait comme on écoute de la musique, sans leur répondre autrement qu’avec les mains, et les enfants s’en accommodaient parfaitement.",
     "mentions": []
    },
    {
     "id": "c8-b09",
     "text": "La doyenne s’appelait Ancelle. On les mena à elle, dans la grande grange, parce que c’était là qu’on recevait, et Aube vit, en entrant, ce que c’était qu’une grange tenue.",
     "mentions": [
      "mere-ancelle"
     ]
    },
    {
     "id": "c8-b10",
     "text": "Les poutres du toit étaient de mélèze, énormes, noircies, et sur chacune, tout au long, courait une corde ; et sur chaque corde, à touche-touche, sur toute sa longueur, il y avait des cordelettes. Des centaines. Nouées d’une demi-clé, l’une contre l’autre, si serrées qu’on ne voyait plus la corde dessous ; des cordelettes grises de vieillesse, brunes, blondes, neuves, chacune avec ses propres nœuds de vie, ses naissances et ses dettes ; des générations de Haut-Charme pendues au toit de leur grange par le poignet. On aurait dit une fourrure. On aurait dit un toit qui avait des cheveux.",
     "mentions": []
    },
    {
     "id": "c8-b11",
     "text": "— Trois cents hivers de neige, dit Garance à voix basse. Le toit n’a jamais bougé. Ils reprennent une poutre par automne, à tour de rôle, cinq poutres, tous les cinq ans chacune. Le soir de la reprise, tout le village vient avec sa cordelette. C’est la veillée.",
     "mentions": [
      "la-veillee"
     ]
    },
    {
     "id": "c8-b12",
     "text": "Séverin ne dit rien. Il était entré derrière eux, et il s’était arrêté sous la première poutre, la tête levée, et il regardait les cordelettes comme il avait regardé le nœud de gabare à Pont-Sauvage et les petits anneaux de Sombreval : en homme qui connaît ses cordes et qui en trouve une qu’il ne connaît pas, et qui commence à en trouver beaucoup.",
     "mentions": []
    },
    {
     "id": "c8-b13",
     "text": "Mère Ancelle était assise près du feu, au fond, sur un banc bas, et elle devait avoir quatre-vingts ans, et elle avait les mains les plus nouées qu’Aube ait jamais vues, des mains qui ressemblaient à des racines de pruniers, et des yeux clairs de fille. Elle ne se leva pas. Elle fit un signe à Aurèle, un autre à Garance, qui s’assit à ses pieds sans qu’on le lui dise ; elle regarda longuement Bastien, et le manteau de Séverin, et ne fit aucun signe pour eux. Puis elle tendit la main vers Aube, paume ouverte.",
     "mentions": []
    },
    {
     "id": "c8-b14",
     "text": "Aube y posa l’œuf de ficelle.",
     "mentions": []
    },
    {
     "id": "c8-b15",
     "text": "La vieille le déroula sur ses genoux. Elle le lut des doigts, les yeux fermés, comme Hersende ; à mi-longueur elle s’arrêta, rouvrit les yeux, et regarda Aube, et il y avait dans ce regard quelque chose qui n’était pas pour la fille devant elle mais pour quelqu’un d’autre, très loin, très longtemps avant. Elle reprit. Elle finit. Elle roula la ficelle et la garda dans ses mains, fermée.",
     "mentions": []
    },
    {
     "id": "c8-b16",
     "text": "Puis elle parla. C’était, comprit Aube, la phrase du jour ; elle en avait une, et elle la dépensait maintenant, et sa voix était rauque et exacte comme une corde qu’on n’a pas touchée depuis des années et qui chante encore juste.",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "— Celle-ci est à moi, dit Mère Ancelle. Apprenez-lui la veillée. Je tiens jusqu’à la lune.",
     "mentions": [
      "hersende"
     ]
    },
    {
     "id": "c8-b18",
     "text": "Elle se tut. Elle avait dit trois phrases, et Aube vit à sa bouche qu’elle en avait payé deux d’avance sur les jours suivants, et qu’elle ne le regrettait pas.",
     "mentions": []
    },
    {
     "id": "c8-b19",
     "text": "Le silence dura. Le feu craquait. Garance, aux pieds de la vieille, avait baissé la tête.",
     "mentions": []
    },
    {
     "id": "c8-b20",
     "text": "— « Je tiens », dit Aube.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "Personne ne répondit.",
     "mentions": []
    },
    {
     "id": "c8-b22",
     "text": "— Elle m’a dit « tiens ». Sur le bat-flanc. Je croyais qu’elle me disait de prendre la lampe.",
     "mentions": []
    },
    {
     "id": "c8-b23",
     "text": "— Elle te disait les deux, dit Séverin à voix basse. Elle n’avait qu’un mot pour les deux.",
     "mentions": []
    },
    {
     "id": "c8-b24",
     "text": "— Elle tient la Levée. Avec quoi ? Elle n’a plus de brin dans la corde, il est de l’an 274, il est mort. Elle a douze mots. Elle a douze…",
     "mentions": []
    },
    {
     "id": "c8-b25",
     "text": "Elle s’arrêta. Elle avait compris, et elle attendait que quelqu’un le dise à sa place, comme sur la crête devant Aymon, et cette fois non plus personne ne le dit, et elle le dit elle-même.",
     "mentions": []
    },
    {
     "id": "c8-b26",
     "text": "— Elle monte sur la Levée. Chaque soir. Avec une ficelle à elle, elle en a toujours, elle file encore. Elle fait un nœud sur la corde. Un petit. Et elle donne un mot. Un des douze. Pour que ça tienne un jour de plus. Le temps que je revienne.",
     "mentions": []
    },
    {
     "id": "c8-b27",
     "text": "— Oui, dit Garance sans lever la tête.",
     "mentions": []
    },
    {
     "id": "c8-b28",
     "text": "— Tu le savais.",
     "mentions": []
    },
    {
     "id": "c8-b29",
     "text": "— Je le sais depuis le col. Aurèle me l’a noué, c’est le nœud que je ne savais pas lire. Je ne pouvais pas te le dire avant qu’on soit sûrs, la fileuse. Et je n’avais pas envie.",
     "mentions": []
    },
    {
     "id": "c8-b30",
     "text": "Aube compta. Elle ne pouvait pas ne pas compter. Ils étaient partis depuis six jours. Hersende avait douze mots le soir du bat-flanc ; peut-être en avait-elle gardé un ou deux pour finir ; peut-être pas. Six nœuds. Six mots. Il en restait six, ou cinq, ou quatre. Et le dernier, celui qu’elle gardait comme une pièce dans un ourlet, Aube savait lequel ce serait, et elle savait aussi qu’on ne pouvait rien y faire d’ici, rien du tout, sinon être en bas avant qu’il n’y en ait plus.",
     "mentions": []
    },
    {
     "id": "c8-b31",
     "text": "— Il faut redescendre, dit-elle.",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "— Demain, dit Garance. On ne repasse pas le col ce soir, et ce soir il y a la veillée. Ils la font pour toi. Ancelle a dit d’apprendre. Alors tu apprends, et demain tu descends, et tu sauras ce que tu descends porter. Sinon tu auras fait le chemin pour rien.",
     "mentions": []
    },
    {
     "id": "c8-b33",
     "text": "La veillée se fit à la nuit, sur le pont.",
     "mentions": []
    },
    {
     "id": "c8-b34",
     "text": "Ce n’était pas la grange qu’on reprenait cette année-là ; c’était le Pont de Charme, le petit pont de cordes qui enjambait les Fontaines à l’entrée du village, dix pas de long, si bas qu’on aurait pu le passer à gué, et qu’on tenait depuis toujours parce qu’un pont qui ne bouge pas sous les pieds des enfants est une chose qu’on ne discute pas, à Haut-Charme. Sa corde maîtresse, une corde de chanvre grosse comme un bras, courait d’une rive à l’autre sous le tablier et, comme les poutres de la grange, elle avait des cheveux : des cordelettes à touche-touche, mais moins, une seule rangée, et il y avait un espace nu, à un bout, long comme un avant-bras, où la corde était à vif.",
     "mentions": []
    },
    {
     "id": "c8-b35",
     "text": "— La reprise de l’an dernier a été courte, dit Garance. Deux vieux sont morts dans l’hiver. On ne délie pas leurs cordelettes, ici : elles sont dans le pont, elles y restent, on les laisse tenir. Mais on n’a pas déplacé les autres, et le pont chante bas de ce côté. Alors on ajoute. Ceux qui veulent.",
     "mentions": []
    },
    {
     "id": "c8-b36",
     "text": "Tout le village était là. Ils étaient venus avec des torches de résine, et avec leurs cordelettes dénouées du poignet, dans la main, et les enfants derrière, à qui on avait dit de se taire, et qui se taisaient pour la première fois de la journée, les yeux énormes. Aurèle se tenait au bout nu de la corde. C’était lui, cette année, le maître de veillée ; il avait ôté son chapeau. Il ne dit rien. Il fit un signe.",
     "mentions": []
    },
    {
     "id": "c8-b37",
     "text": "Le premier fut une vieille femme, celle qui avait dit que Garance avait grossi. Elle s’agenouilla sur la rive, passa sa cordelette autour de la corde maîtresse, à ras de la dernière des anciennes, et fit la demi-clé, simple, une boucle et le bout dessous, le nœud d’enfant que Séverin avait montré à Aube dans les ruines. Aurèle se pencha. Il vérifia le nœud des doigts, sans un mot, tira dessus, hocha la tête. Alors la vieille approcha la bouche du nœud, et on ne l’entendit pas, et elle serra.",
     "mentions": []
    },
    {
     "id": "c8-b38",
     "text": "Aube ne vit rien changer. On ne voyait jamais rien changer ; c’était cela, le nœud qui tient. Mais le pont, sous les torches, fit un son : un tout petit son, une note qui montait d’un cheveu, comme une corde qu’on accorde.",
     "mentions": []
    },
    {
     "id": "c8-b39",
     "text": "Le deuxième s’agenouilla. Puis le troisième. Il y en eut vingt-huit ; Aube compta, parce qu’elle comptait, et parce qu’elle vit qu’ils n’étaient pas tous là : sur les quarante du village, une douzaine étaient restés debout avec leur torche, en retrait, la cordelette encore au poignet, et personne ne les regardait, personne ne leur faisait signe, personne ne les comptait. Ils tenaient les torches. C’était leur part de ce soir-là.",
     "mentions": []
    },
    {
     "id": "c8-b40",
     "text": "— Ceux-là ne donnent pas, dit-elle à Garance.",
     "mentions": []
    },
    {
     "id": "c8-b41",
     "text": "— Pas cette année. L’an prochain, peut-être. Ou jamais. On ne demande pas. Un mot qu’on demande est déjà à moitié pris, et un mot pris ne tient rien. Tu as vu Sombreval.",
     "mentions": []
    },
    {
     "id": "c8-b42",
     "text": "— Et s’il y en a un qui ment ? Un qui donne un mot qu’il n’a pas vécu, pour faire comme les autres ?",
     "mentions": []
    },
    {
     "id": "c8-b43",
     "text": "— Sa demi-clé ne tient rien, et le pont ne monte pas d’un cheveu, et il le sait, et Aurèle le sait, et personne ne dit rien, et il reprend sa cordelette. Ça arrive. Ce n’est pas une chaîne, la fileuse. C’est vingt-huit nœuds côte à côte. Il y en a un qui ne tient pas, il y en a vingt-sept qui tiennent. Il faut qu’ils mentent tous pour que le pont tombe. Tressaille a écrit une page sur un maillon de bois. Ici, il n’y a pas de maillons. Il n’y a que des nœuds.",
     "mentions": []
    },
    {
     "id": "c8-b44",
     "text": "Séverin, à côté d’elles, avait entendu. Il ne dit rien. Il regardait la corde du pont se couvrir, un nœud après l’autre, sous les torches, et ses mains, le long de son manteau, faisaient dans le vide, sans qu’il s’en aperçoive, le geste de la demi-clé.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c8-b45",
     "text": "Ce fut au dix-neuvième que Bastien s’avança.",
     "mentions": []
    },
    {
     "id": "c8-b46",
     "text": "Il ne demanda rien à personne. Il avait à la main sa cordelette, la sienne, celle des fils de Maison, lourde comme un chapelet, avec dedans dix-huit ans de fêtes et de deuils et un nœud qu’Aube reconnut sans le connaître, plus gros que les autres, serré à l’étrangler : l’an 308. Il s’agenouilla sur la rive de Haut-Charme, dans la boue des Fontaines, avec son manteau trop neuf, et passa la cordelette autour de la corde, et fit la demi-clé, et sa main tremblait, et Aurèle se pencha, vérifia, tira, et hocha la tête.",
     "mentions": [
      "bastien-dautry"
     ]
    },
    {
     "id": "c8-b47",
     "text": "Bastien approcha la bouche du nœud. Aube le vit hésiter, comme à Sombreval sur la pierre, chercher, refuser, refuser encore, et choisir autre chose, quelque chose de plus petit, qu’il avait, qu’il avait vécu tous les jours de sa vie sans le savoir, et serrer.",
     "mentions": []
    },
    {
     "id": "c8-b48",
     "text": "Le pont monta d’un cheveu.",
     "mentions": []
    },
    {
     "id": "c8-b49",
     "text": "Bastien resta à genoux, les mains sur le nœud, et il rit. Un rire bref, mouillé, qui lui fit du bien et qu’il ne chercha pas à retenir, et quand il se releva il avait de la boue jusqu’aux genoux et il ne l’essuya pas.",
     "mentions": []
    },
    {
     "id": "c8-b50",
     "text": "— Ça a tenu, dit-il à Aube. Ça a tenu, tu as entendu ? J’ai donné…",
     "mentions": []
    },
    {
     "id": "c8-b51",
     "text": "Il s’arrêta. Il chercha. Il y eut la marche manquée, il la reconnut sur sa propre figure, et il éclata de rire encore.",
     "mentions": []
    },
    {
     "id": "c8-b52",
     "text": "— Je ne peux plus le dire. Bon. C’était le mot pour… pour vouloir tout de suite. Pour ne pas savoir attendre. Ma mère disait que c’était ma seule faute, et qu’elle suffisait.",
     "mentions": []
    },
    {
     "id": "c8-b53",
     "text": "— « Hâte », dit Séverin.",
     "mentions": []
    },
    {
     "id": "c8-b54",
     "text": "— Oui. Ça. Je l’ai vécu, ça ?",
     "mentions": []
    },
    {
     "id": "c8-b55",
     "text": "— Tu as couru depuis la Porte du Nord, dit Aube. Tu es allé à la Corderie la nuit pour me dire une chose qui ne servait à rien. Tu l’as vécu.",
     "mentions": []
    },
    {
     "id": "c8-b56",
     "text": "Il la regarda. Elle regarda le pont.",
     "mentions": []
    },
    {
     "id": "c8-b57",
     "text": "Ce fut la vieille au rire silencieux qui vint à elle, après le vingt-huitième nœud, quand le pont chantait juste sur toute sa longueur et que les torches commençaient à baisser. Elle portait dans ses deux mains une poignée de chanvre peigné, du chanvre de Haut-Charme, blond, long, et elle le posa dans les mains d’Aube, et elle fit un signe qu’Aube ne connaissait pas et qui voulait manifestement dire : « file. »",
     "mentions": []
    },
    {
