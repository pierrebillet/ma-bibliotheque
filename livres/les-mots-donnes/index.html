      "la-corderie"
     ]
    },
    {
     "id": "c1-b03",
     "text": "C’était l’heure où la Salle sentait encore le goudron froid de la veille et pas encore la sueur du jour. Les hautes fenêtres ne donnaient qu’un gris de laine. Trente fileuses reculaient côte à côte, dans un froissement de chanvre et de pieds nus sur la terre battue, et personne ne parlait, parce qu’une fileuse qui parle fait un fil qui tremble. On le leur avait dit à sept ans. On le leur redisait à chaque fil tremblé.",
     "mentions": []
    },
    {
     "id": "c1-b04",
     "text": "Le sien ne tremblait pas. C’était le seul orgueil qu’on lui laissait, et elle le gardait au chaud sous la langue, avec la faim du matin.",
     "mentions": []
    },
    {
     "id": "c1-b05",
     "text": "Au-dessus des toits, la corde chantait.",
     "mentions": []
    },
    {
     "id": "c1-b06",
     "text": "On l’entendait de partout dans la Basse : de la Salle, des lavoirs, des ruelles qui grimpaient vers la Haute. Un son long et grave qui n’était pas du vent, qui n’était pas de l’eau, et que les enfants de Tressaille apprenaient à ne plus entendre avant même d’apprendre leur nom. La Maîtresse-Corde courait sur la crête de la Levée, à quarante pas au-dessus des toits, et le lac appuyait dessus, et la corde chantait. Aube l’entendait toujours. C’était peut-être un défaut de sans-nom : on n’avait personne pour vous apprendre à ne pas écouter.",
     "mentions": [
      "la-maitresse-corde",
      "la-levee",
      "tressaille"
     ]
    },
    {
     "id": "c1-b07",
     "text": "Ce matin-là, la note avait quelque chose de bas. Pas faux. Bas, comme une voix qui a froid.",
     "mentions": []
    },
    {
     "id": "c1-b08",
     "text": "— Fil ! cria l’apprenti du rouet.",
     "mentions": []
    },
    {
     "id": "c1-b09",
     "text": "Elle avait touché le mur du fond sans le sentir. Elle noua le bout, décrocha la nappe de sa ceinture, la roula sur son bras et remonta la Salle à l’endroit, cette fois, entre les fils tendus des autres qui vibraient au passage de son ombre. Deux cent vingt pas. Elle en avait fait, depuis trois ans, de quoi aller jusqu’à la lune et revenir, parce que le fil qu’on lui faisait filer n’était pas un fil ordinaire. Il ne servait ni aux amarres des gabares, ni aux cordes des puits, ni aux ponts. Il partait en écheveaux dans la réserve de Maître Aymon, sous clé, et on lui disait que c’était le long brin, et qu’il fallait qu’il fût parfait, et qu’elle avait la main pour ça.",
     "mentions": [
      "le-brin-d-ame",
      "maitre-aymon"
     ]
    },
    {
     "id": "c1-b10",
     "text": "On ne lui disait pas pour quoi. Une fileuse ne demande pas.",
     "mentions": []
    },
    {
     "id": "c1-b11",
     "text": "À la porte de la réserve, Hersende l’attendait, assise sur le banc des vieilles, les deux mains posées sur les genoux comme des outils qu’on a fini d’utiliser. Elle ne dit rien. Elle regarda l’écheveau, puis le visage d’Aube, puis leva le menton d’un doigt vers le toit, vers la corde qui chantait bas.",
     "mentions": [
      "hersende"
     ]
    },
    {
     "id": "c1-b12",
     "text": "— Je sais, dit Aube. Je l’entends aussi.",
     "mentions": []
    },
    {
     "id": "c1-b13",
     "text": "Hersende hocha la tête. Puis elle dit :",
     "mentions": []
    },
    {
     "id": "c1-b14",
     "text": "— Pain.",
     "mentions": []
    },
    {
     "id": "c1-b15",
     "text": "Et elle tira de sa manche une moitié de miche de châtaigne, encore tiède, qu’Aube prit sans faire de manières, parce qu’avec Hersende les manières coûtaient des mots, et qu’il lui en restait douze.",
     "mentions": []
    },
    {
     "id": "c1-b16",
     "text": "Douze. Aube les avait comptés, une année entière, avec l’application qu’on met à compter les marches d’un escalier qu’on descend dans le noir. Oui. Non. Va. Tiens. Viens. Eau. Pain. Dors. Haut. Encore. Mal. Et le douzième, que Hersende ne prononçait presque jamais, qu’elle gardait comme on garde une pièce dans un ourlet : Aube. Le nom qu’elle lui avait donné dix-sept ans plus tôt, en la tirant d’une benne de chanvre venue de Pont-Sauvage, parce que le jour se levait et que c’était un des mots qu’il lui restait.",
     "mentions": [
      "hersende",
      "les-mots-donnes"
     ]
    },
    {
     "id": "c1-b17",
     "text": "Elle mangea le pain debout. La corde chantait. Hersende écoutait, la tête un peu penchée, comme quelqu’un qui compte une monnaie qu’il connaît d’avance.",
     "mentions": []
    },
    {
     "id": "c1-b18",
     "text": "La cloche de la Salle ne sonna pas ; on n’avait pas de cloche à la Corderie, on avait Maître Aymon, dont la voix portait deux cent vingt pas sans effort. Il ne cria pas. Il ouvrit la porte de la réserve, jeta un regard aux fileuses qui repartaient à reculons pour la seconde nappe, et dit :",
     "mentions": []
    },
    {
     "id": "c1-b19",
     "text": "— La fileuse du long brin. Avec moi.",
     "mentions": []
    },
    {
     "id": "c1-b20",
     "text": "Quelqu’un rit, du côté des apprentis. Un rire court, qui voulait dire : « la sans-nom au bureau du Maître, on va rire. » Aube posa l’écheveau sur le banc à côté de Hersende, essuya ses mains sur ses cuisses et suivit le tablier de cuir.",
     "mentions": []
    },
    {
     "id": "c1-b21",
     "text": "Il ne la mena pas au bureau. Il la mena dehors.",
     "mentions": []
    },
    {
     "id": "c1-b22",
     "text": "La Basse s’éveillait dans une odeur de fumée de châtaignier et d’eau froide. Les ruelles descendaient vers le Déversoir, où la Tende, rendue à elle-même au pied de la Levée, filait entre deux quais de pierre noire. Au-dessus, la digue barrait le ciel d’un bout à l’autre du regard, quarante pas de pierres grises que l’hiver avait vernies de mousse, et sur la crête, invisible d’en bas mais présente comme un plafond, la corde.",
     "mentions": [
      "la-basse",
      "la-tende"
     ]
    },
    {
     "id": "c1-b23",
     "text": "Sur le quai du Déversoir, un attroupement. Un gabarier assis sur une bitte d’amarrage tenait son avant-bras de l’autre main, et le sang lui coulait entre les doigts jusque dans l’eau. Un crochet de gaffe, un coup de rouleau, une plaie longue comme la main. Agenouillé devant lui, un compagnon de la Corderie roulait déjà une bande de toile autour du bras : Séverin, la meilleure main d’Aymon, un garçon de la Basse monté aux cordes à quinze ans et qu’on citait aux fileuses comme on cite les saints. Il ne leva pas les yeux. Il passa la toile deux fois, tira une ficelle grise de sa manche, une ficelle qu’il avait filée lui-même, on le voyait à la torsion, et fit le nœud de plaie : deux tours, une clé, le bout rentré.",
     "mentions": [
      "severin",
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c1-b24",
     "text": "Puis il approcha la bouche du nœud et serra.",
     "mentions": []
    },
    {
     "id": "c1-b25",
     "text": "Aube ne l’entendit pas. Personne ne l’entendit ; un mot donné ne se dit qu’au nœud. Elle vit seulement les lèvres bouger, une fois, et le sang s’arrêter comme une porte qu’on ferme. Le gabarier regarda son bras, incrédule, et se mit à rire, du rire de ceux qui ont eu peur.",
     "mentions": []
    },
    {
     "id": "c1-b26",
     "text": "— Quel mot ? demanda Aymon par-dessus les têtes.",
     "mentions": []
    },
    {
     "id": "c1-b27",
     "text": "Séverin se releva, essuya ses mains à sa cuisse.",
     "mentions": []
    },
    {
     "id": "c1-b28",
     "text": "— « Tard », Maître.",
     "mentions": []
    },
    {
     "id": "c1-b29",
     "text": "— Tu l’avais vécu ?",
     "mentions": []
    },
    {
     "id": "c1-b30",
     "text": "— Assez pour une plaie d’un pouce. Elle tiendra dix jours ; il sera guéri avant.",
     "mentions": []
    },
    {
     "id": "c1-b31",
     "text": "Aymon hocha la tête et dit, à personne :",
     "mentions": []
    },
    {
     "id": "c1-b32",
     "text": "— Je l’inscris ce soir.",
     "mentions": []
    },
    {
     "id": "c1-b33",
     "text": "Et il repartit. Aube le suivit en se retournant une fois. Séverin la regardait, sans hostilité, sans curiosité non plus, comme on regarde un écheveau dont on ne sait pas encore la longueur. Il venait de perdre, pour un gabarier qu’il ne connaissait pas, le droit de dire qu’il était tard. Il ne semblait pas en souffrir. Il était simplement, pensa-t-elle, un peu plus économe qu’avant.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c1-b34",
     "text": "— Tu l’entends, dit Aymon. Ce n’est pas une question.",
     "mentions": []
    },
    {
     "id": "c1-b35",
     "text": "— Elle chante bas.",
     "mentions": []
    },
    {
     "id": "c1-b36",
     "text": "— Elle chante bas depuis la première neige. Depuis la lune passée, elle chante bas le matin et faux le soir, quand le lac a bu la journée. Tu ne l’as pas entendu le soir, tu dors dans la Salle.",
     "mentions": []
    },
    {
     "id": "c1-b37",
     "text": "Il marchait vite, pour un homme de son âge, les mains derrière le dos, la clé de la rigole battant sur sa poitrine au bout de son cordon. Ils prirent l’escalier des Lavandières, cent soixante marches taillées dans la Levée elle-même, luisantes, sans rampe. Aube ne l’avait gravi que deux fois dans sa vie, aux fêtes de la Nouée, avec toute la Basse qui montait manger des nouets sur la crête. Elle montait derrière lui et regardait ses talons.",
     "mentions": []
    },
    {
     "id": "c1-b38",
     "text": "Sur la crête, le vent venait du lac, et le lac était là.",
     "mentions": []
    },
    {
     "id": "c1-b39",
     "text": "Elle s’arrêta, parce que personne ne l’avait jamais prévenue, et que la première fois on s’arrête. La Retenue s’étendait vers le nord, deux lieues de gris d’étain jusqu’aux montagnes, lisse, énorme, si calme qu’on voyait le reflet des Aiguilles s’y tenir la tête en bas. À gauche et à droite, la Levée courait sur six cents pas, et sur son dos, dans une rigole de pierre à hauteur de genou, la Maîtresse-Corde reposait, grosse comme un tronc de jeune frêne, grise, goudronnée, vivante. Elle chantait sous leurs pieds. On la sentait dans les os des jambes.",
     "mentions": [
      "la-retenue",
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c1-b40",
     "text": "— Tu peux toucher, dit Aymon.",
     "mentions": []
    },
    {
     "id": "c1-b41",
     "text": "Elle posa la main. La corde était tiède sous le goudron, et tendue comme une chose qui retient son souffle. Quarante pas plus loin, une boursouflure grosse comme une tête : un nœud. Puis un autre, plus loin. Elle les compta d’un regard : sept, jusqu’à la Pierre d’Ancre de l’est, où la corde s’enfonçait dans la roche.",
     "mentions": []
    },
    {
     "id": "c1-b42",
     "text": "— Sept reprises, dit Aymon. Trois cents ans. Chacune de ces bosses a été un homme ou une femme qui a tout donné pour que l’eau reste où elle est. Tu connais la dernière.",
     "mentions": []
    },
    {
     "id": "c1-b43",
     "text": "— Hersende.",
     "mentions": []
    },
    {
     "id": "c1-b44",
     "text": "— La Reprise de l’an 274. Cent dix-sept mots. On a cru qu’elle nous tiendrait cinquante ans ; elle nous en a tenu quarante. Le lac a monté, les hivers sont plus longs, ce n’est la faute de personne. Voilà où nous sommes.",
     "mentions": [
      "la-grande-reprise",
      "hersende"
     ]
    },
    {
     "id": "c1-b45",
     "text": "Il s’était arrêté devant le septième nœud. Il posa la paume dessus, comme un guérisseur sur un front, et Aube vit ses lèvres bouger sans bruit : il comptait, ou il écoutait. Le vent rabattit une odeur de goudron et de lac.",
     "mentions": []
    },
    {
     "id": "c1-b46",
     "text": "— À la Fonte, dit-il, la Retenue montera jusqu’à la marque. Elle monte chaque année jusqu’à la marque, et chaque année la corde tient, parce que quelqu’un l’a tenue. Cette année, si rien n’est repris avant la lune de la Fonte, elle ne tiendra pas. Je ne te dis pas ce qui arrive après. Tu dors dans la Salle, la Salle est dans la Basse, tu le sais mieux que ceux de la Haute.",
     "mentions": [
      "la-fonte"
     ]
    },
    {
     "id": "c1-b47",
     "text": "Aube retira sa main de la corde. Elle avait compris avant qu’il finisse, et elle attendait qu’il le dise, parce qu’elle ne voulait pas le dire à sa place.",
     "mentions": []
    },
    {
     "id": "c1-b48",
     "text": "— Le long brin, dit-elle quand même.",
     "mentions": []
    },
    {
     "id": "c1-b49",
     "text": "— Le long brin.",
     "mentions": []
    },
    {
     "id": "c1-b50",
     "text": "— Depuis trois ans.",
     "mentions": []
    },
    {
     "id": "c1-b51",
     "text": "— Il faut trois ans pour filer une âme de six cents pas assez fine et assez forte pour se commettre dans une corde de trois siècles. Une reprise, ce n’est pas un nœud posé sur la corde des autres. On y couche d’abord son brin, d’un ancrage à l’autre, on le tord dans le sien, et alors on peut nouer. Il faut que l’âme soit de la même main que le nœud. Tu le sais, vous l’apprenez au premier fil.",
     "mentions": []
    },
    {
     "id": "c1-b52",
     "text": "— Je sais ce que fait une âme. Je ne savais pas que je filais la mienne.",
     "mentions": []
    },
    {
     "id": "c1-b53",
     "text": "Il la regarda pour la première fois depuis la Salle. Il avait des yeux clairs, presque sans couleur, et le visage de quelqu’un qui ne s’excuse pas parce qu’il n’a plus le mot pour.",
     "mentions": []
    },
    {
     "id": "c1-b54",
     "text": "— Non, dit-il. Tu ne le savais pas. Si je te l’avais dit, ton fil aurait tremblé. J’ai regardé ce fil chaque semaine pendant trois ans. Il n’a pas tremblé une fois.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c1-b55",
     "text": "C’était, elle s’en rendit compte, le plus long compliment qu’on lui eût jamais fait. Elle le rangea quelque part pour plus tard, et sentit en même temps, sous le compliment, la forme exacte du piège, comme on sent une pierre sous le pied avant de l’avoir vue.",
     "mentions": []
    },
    {
     "id": "c1-b56",
     "text": "— Pourquoi moi.",
     "mentions": []
    },
    {
     "id": "c1-b57",
     "text": "— Parce que tu as la main. Parce que tu es de la Corderie jusqu’à tes vingt ans, et que la Charte le permet. Parce que tu n’as ni mère, ni frère, ni promis, personne à qui tes mots manqueraient plus qu’à toi. Et parce que tes mots pèsent. Il faut avoir vécu un mot pour qu’il tienne. Une fille de la Haute donnerait « faim », le nœud resterait un nœud. Toi, tu as eu faim.",
     "mentions": []
    },
    {
     "id": "c1-b58",
     "text": "Il ne l’avait pas dit méchamment. Il l’avait dit comme il aurait dit que le chanvre de Malebosse est plus long que celui de la plaine. Aube regarda le lac, si calme, si lourd, et la ville en bas, et les fumées de la Basse qui montaient droit dans l’air sans vent, et elle se rendit compte qu’elle avait faim, encore, et qu’il avait raison, et que c’était insupportable.",
     "mentions": []
    },
    {
     "id": "c1-b59",
     "text": "— Un seul souffle, dit Aymon plus doucement. C’est ainsi que ça se fait depuis la Sans-Nom. Une seule bouche, tous ses mots, une nuit. Le Registre garde le nom. Sept noms en trois cents ans, tu les connais tous, la Basse les chante à la Nouée. Le tien serait le huitième.",
     "mentions": [
      "les-sans-nom",
      "le-registre-des-mots-donnes"
     ]
    },
    {
     "id": "c1-b60",
     "text": "— Je n’ai pas de nom.",
     "mentions": []
    },
    {
     "id": "c1-b61",
     "text": "— Tu en as un. Hersende te l’a donné, il est de sa bouche, il pèse ce qu’elle a payé pour le garder. Il tiendra sur la page.",
     "mentions": []
    },
    {
     "id": "c1-b62",
     "text": "Elle ne répondit pas. Au-dessous d’eux, la Basse envoyait ses bruits d’eau et de sabots, et la corde chantait bas dans la pierre, et tout cela, pensa-t-elle, tout cela, les lavoirs, les toits de la Salle, les trente fileuses à reculons, la benne de chanvre où on l’avait trouvée, tenait à un fil, et le fil était le sien.",
     "mentions": []
    },
    {
     "id": "c1-b63",
     "text": "— Tu ne me réponds pas maintenant, dit Aymon. Le Conseil siège demain à la Halle. Dame Ysabeau y lira le Droit de Reprise et ton nom, et à partir de là tu auras jusqu’à la lune pour te présenter à la Levée. C’est la Charte. Elle t’oblige à venir. Elle n’oblige personne à donner : un mot qu’on arrache ne tient rien, tu le sais aussi. Ce que tu diras sur cette crête, à la lune, il faudra que ce soit toi qui le dises.",
     "mentions": [
      "le-droit-de-reprise",
      "ysabeau-dautry"
     ]
    },
    {
     "id": "c1-b64",
     "text": "— Et si je dis non.",
     "mentions": []
    },
    {
     "id": "c1-b65",
     "text": "Il eut un geste vers la ville, vers le lac, un geste qui ne finissait pas.",
     "mentions": []
    },
    {
     "id": "c1-b66",
     "text": "— Alors je ferai ce que fait un Maître de la Corderie quand la corde chante faux et que personne ne se présente : je monterai ici moi-même avec ce qui me reste. Il me reste beaucoup moins qu’à toi, et mon brin n’est pas dans la corde. Ça tiendrait une saison, peut-être deux. Je ne t’en parle pas pour te forcer la main. Je t’en parle parce que tu m’as demandé.",
     "mentions": []
    },
    {
     "id": "c1-b67",
     "text": "Ils redescendirent les cent soixante marches en silence. Au bas de l’escalier, il s’arrêta, et pour la première fois parut chercher un mot, non pas parce qu’il l’avait perdu, mais parce qu’il ne savait pas lequel prendre.",
     "mentions": []
    },
    {
     "id": "c1-b68",
     "text": "— C’est un honneur, dit-il enfin.",
     "mentions": []
    },
    {
     "id": "c1-b69",
     "text": "Il n’avait pas dit pour qui.",
     "mentions": []
    },
    {
     "id": "c1-b70",
     "text": "Elle retourna à la Salle. Elle prit sa seconde nappe de chanvre, l’accrocha à sa ceinture, tira la première mèche, et recula. Le fil s’en alla vers l’est, tendu, pâle. Il ne trembla pas. Elle y veilla avec une attention féroce, pas après pas, jusqu’au mur du fond, parce que c’était le seul orgueil qu’on lui laissait, et qu’elle venait de comprendre à quoi il servait.",
     "mentions": []
    },
    {
     "id": "c1-b71",
     "text": "Au-dessus des toits, la corde chantait bas.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-2",
   "number": 2,
   "title": "Douze mots",
   "blocks": [
    {
     "id": "c2-b01",
     "text": "La Halle de la Haute sentait le sel.",
     "mentions": [
      "tressaille"
     ]
    },
    {
     "id": "c2-b02",
     "text": "C’était la première chose qu’on apprenait en y entrant, avant les bannières des neuf Maisons pendues aux poutres, avant la longue table de noyer et les visages : que le sel de Maison Dautry dormait dans les caves dessous depuis deux cents ans et que la pierre s’en souvenait. Aube n’était jamais montée si haut dans la ville. Elle se tenait debout au bout de la table, là où l’on fait tenir ceux qui n’ont pas de siège, les mains croisées devant elle pour cacher la brûlure de la paume gauche, et elle regardait le sel briller dans les joints des dalles.",
     "mentions": [
      "le-conseil-des-maisons"
     ]
    },
    {
     "id": "c2-b03",
     "text": "— Aube, fileuse, sans-nom, de la Corderie de Tressaille, lut Dame Ysabeau Dautry.",
     "mentions": [
      "ysabeau-dautry",
      "les-sans-nom"
     ]
    },
    {
     "id": "c2-b04",
     "text": "Elle lisait sans hausser la voix. Elle était grande, grise, droite comme un montant de porte, et elle tenait la Charte ouverte devant elle sur un pupitre, à plat, de la main qui ne tremblait pas. L’autre main reposait sur la table, et Aube remarqua qu’à son poignet, sous la manche de drap fin, la cordelette de la Prévôte était nouée serré, comme celle d’une lavandière. Toutes les cordelettes se ressemblent. C’était une des rares choses justes de Tressaille.",
     "mentions": [
      "la-cordelette"
     ]
    },
    {
     "id": "c2-b05",
     "text": "— … dont l’âme est couchée dans la Maîtresse-Corde par le brin de reprise, et qui, la corde chantant faux et nul compagnon ne s’étant présenté, est désignée par le Conseil au titre de l’article dix-neuf de la Charte. La désignée se présentera à la Levée à la lune de la Fonte. Nul ne donnera pour elle. Nul ne lui arrachera ce qu’elle ne donne pas. Le Conseil la tient quitte de son service jusqu’à la lune, et la Corderie la nourrit.",
     "mentions": [
      "le-droit-de-reprise"
     ]
    },
    {
     "id": "c2-b06",
     "text": "Elle leva les yeux.",
     "mentions": []
    },
    {
     "id": "c2-b07",
     "text": "— C’est le texte. Il a été lu une fois avant aujourd’hui, en l’an 212. Je ne l’aime pas plus que vous.",
     "mentions": []
    },
    {
     "id": "c2-b08",
     "text": "Personne, autour de la table, ne parut l’aimer non plus. Il y avait là les neuf chefs de Maison, cinq femmes, quatre hommes, du sel, du vin, du chanvre, du bois, de la pierre, et Maître Aymon debout à la droite de la Prévôte, les mains derrière le dos. Ils regardaient Aube comme on regarde une écluse : avec l’attention qu’on doit à ce qui retient beaucoup d’eau. Elle soutint leurs regards, un par un, parce qu’on ne lui avait pas dit de baisser les yeux, et qu’elle avait décidé la veille, sur la crête, de ne plus rien faire qu’on ne lui ait pas dit de faire ni qu’elle n’ait pas choisi.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c2-b09",
     "text": "— J’ai une question, dit une voix au fond.",
     "mentions": []
    },
    {
     "id": "c2-b10",
     "text": "Le fond de la Halle, c’était le banc des fils et des filles de Maison qu’on faisait assister au Conseil pour qu’ils apprennent. Un garçon s’était levé. Grand, blond, une veste de drap gris trop bien coupée, un visage qu’on aurait dit dessiné pour être aimable et qui ne l’était pas, en ce moment. Aube l’avait déjà vu, de loin, à la Nouée, et elle savait qui il était comme toute la Basse le savait : Bastien Dautry, le fils de la Prévôte, celui dont la petite sœur s’était noyée.",
     "mentions": [
      "bastien-dautry"
     ]
    },
    {
     "id": "c2-b11",
     "text": "— Bastien, dit Dame Ysabeau sans se retourner.",
     "mentions": []
    },
    {
     "id": "c2-b12",
     "text": "— Une question, mère. Le Maître a dit hier au Conseil restreint, et je cite, que la fileuse convenait parce que ses mots pèsent. J’ai demandé ce que cela voulait dire. On m’a répondu qu’il faut avoir vécu un mot pour qu’il tienne, et qu’une fille de la Basse a vécu plus de mots que nous.",
     "mentions": []
    },
    {
     "id": "c2-b13",
     "text": "— C’est exact, dit Aymon.",
     "mentions": []
    },
    {
     "id": "c2-b14",
     "text": "— Alors ma question est celle-ci : nous sommes neuf Maisons, nous avons des fils et des filles, et nous n’avons trouvé personne dont les mots pèsent assez. Parce que nous avons trop bien mangé. C’est bien cela ? On envoie sur la Levée ceux qui ont eu faim, et on appelle ça un honneur, et on rentre dîner.",
     "mentions": []
    },
    {
     "id": "c2-b15",
     "text": "Il y eut un silence, puis un rire, un seul, du côté du chanvre, et Bastien rougit jusqu’aux oreilles sans baisser la tête. Aube ne rit pas. Elle n’avait pas envie de lui être reconnaissante ; c’était trop facile, de parler quand on avait un siège. Mais elle enregistra qu’il avait dit tout haut la phrase exacte qu’elle avait sous la langue depuis la veille, et que cela lui faisait un drôle d’effet, comme d’entendre chanter juste une corde qu’on croyait seule.",
     "mentions": []
    },
    {
     "id": "c2-b16",
     "text": "— Fils de Maison, dit Aymon, sans dureté. Votre âme n’est pas dans la corde. Personne de la Haute n’a filé pour la Corderie depuis cent ans ; vos familles paient pour ne pas le faire, c’est la Charte aussi. Et vos mots pèsent moins que vous ne croyez. Pas parce que vous avez trop mangé. Parce qu’on vous a toujours répondu.",
     "mentions": []
    },
    {
     "id": "c2-b17",
     "text": "— Alors qu’on m’apprenne à filer.",
     "mentions": []
    },
    {
     "id": "c2-b18",
     "text": "— Trois ans, pour une âme de Levée. La lune de la Fonte est dans douze jours.",
     "mentions": []
    },
    {
     "id": "c2-b19",
     "text": "— Bastien, répéta Dame Ysabeau, et cette fois elle se retourna. Assieds-toi.",
     "mentions": []
    },
    {
     "id": "c2-b20",
     "text": "Il s’assit. Il regarda Aube. Elle regarda le sel dans les dalles.",
     "mentions": []
    },
    {
     "id": "c2-b21",
     "text": "— Fileuse, dit la Prévôte.",
     "mentions": []
    },
    {
     "id": "c2-b22",
     "text": "Aube releva la tête.",
     "mentions": []
    },
    {
     "id": "c2-b23",
     "text": "— Nul ne vous forcera. C’est écrit et je l’ai lu. Je ne vous dirai pas non plus ce que vous devez à cette ville, qui vous a nourrie dix-sept ans : vous le savez, et si vous ne le savez pas, ce n’est pas moi qui vous l’apprendrai en une phrase. Je vous dirai seulement ce que je sais, moi, et qui n’est pas dans la Charte. J’ai compté les maisons de la Basse au-dessous de la marque. Il y en a onze cents. J’ai compté les gens dedans. Je connais le chiffre, je ne le dirai pas ici. Je l’ai compté parce que c’est mon travail, et parce que j’ai déjà perdu quelqu’un à l’eau et que je sais ce que pèse une seule. Voilà. Vous avez jusqu’à la lune.",
     "mentions": [
      "la-basse"
     ]
    },
    {
     "id": "c2-b24",
     "text": "Elle referma la Charte.",
     "mentions": []
    },
    {
     "id": "c2-b25",
     "text": "— Le Conseil vous remercie de vous être présentée. Vous pouvez descendre.",
     "mentions": []
    },
    {
     "id": "c2-b26",
     "text": "Aube descendit.",
     "mentions": []
    },
    {
     "id": "c2-b27",
     "text": "Elle descendit les ruelles de la Haute, où les portes étaient peintes et les seuils lavés, où les gens s’écartaient d’elle sans savoir pourquoi et savaient quand même ; elle descendit vers la Basse, vers l’odeur de goudron et de fumée de châtaignier, et à chaque marche elle sentait la corde chanter au-dessus de la ville, bas, un peu plus bas qu’hier peut-être, ou c’était elle qui écoutait mieux.",
     "mentions": []
    },
    {
     "id": "c2-b28",
     "text": "Maître Aymon la rattrapa à la porte de la Salle. Il ne dit rien, il ouvrit la réserve, et sur la table où d’ordinaire on pesait le chanvre il y avait le Registre.",
     "mentions": [
      "le-registre-des-mots-donnes"
     ]
    },
    {
     "id": "c2-b29",
     "text": "Elle l’avait déjà vu fermé : un livre épais comme un pavé, relié de cuir noirci, avec une lanière. Elle ne l’avait jamais vu ouvert. Aymon tourna les pages, lentement, en remontant le temps : des colonnes serrées, des dates, des mains, des nœuds, des choses tenues, des mots. « Séverin, compagnon, nœud de plaie, bras du gabarier Fauvel, “tard”. » La date d’hier. Et plus haut, plus loin, des centaines de lignes de la même écriture ou d’écritures différentes, trois siècles de mots donnés, et de loin en loin une page où il n’y avait qu’un nom en travers, à l’encre rouge, et un nombre.",
     "mentions": []
    },
    {
     "id": "c2-b30",
     "text": "— Les sept, dit Aymon.",
     "mentions": []
    },
    {
     "id": "c2-b31",
     "text": "Il ne les lut pas. Il n’avait pas besoin : la Basse les chantait à la Nouée, on les savait avant de savoir compter, et le plus haut de tous, le premier, était une page blanche avec un chiffre, parce que la Sans-Nom n’avait pas de nom à écrire. Il s’arrêta sur l’avant-dernière page rouge. « Hersende, compagnonne, Reprise de la Levée, an 274. Cent dix-sept. » Puis il tourna encore une page, et celle-là était vide.",
     "mentions": [
      "hersende",
      "la-grande-reprise"
     ]
    },
    {
     "id": "c2-b32",
     "text": "— Je ne t’ai pas menée ici pour te faire peur, dit-il. Je t’ai menée ici pour que tu voies la page. Tu me demandais hier pourquoi toi. Il y avait aussi cela dans ma réponse, et je ne l’ai pas dit : que ce serait la seule fois de ta vie où on t’écrirait quelque part.",
     "mentions": []
    },
    {
     "id": "c2-b33",
     "text": "Il ne l’avait pas dit méchamment non plus. Il ne disait jamais rien méchamment. C’était le plus difficile, avec lui.",
     "mentions": []
    },
    {
     "id": "c2-b34",
     "text": "Elle regarda la page blanche longtemps. Elle se vit dessus. Ce n’était pas difficile à voir : quatre lettres, un trait, un nombre. Elle se vit chantée à la Nouée par des gamines à reculons qui ne sauraient rien d’elle sinon qu’elle avait tenu. Elle sentit, très exactement, à quel point elle en avait envie, et à quel point on l’avait su avant elle.",
     "mentions": []
    },
    {
     "id": "c2-b35",
     "text": "— Je peux la toucher ? demanda-t-elle.",
     "mentions": []
    },
    {
     "id": "c2-b36",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b37",
     "text": "Elle posa un doigt sur la page, comme la veille sur la corde. Le papier était doux et un peu froid. Elle retira sa main.",
     "mentions": []
    },
    {
     "id": "c2-b38",
     "text": "— Merci, Maître.",
     "mentions": []
    },
    {
     "id": "c2-b39",
     "text": "Et elle retourna filer, parce qu’il restait deux nappes et qu’on ne l’avait pas tenue quitte de ses nappes, seulement de son service.",
     "mentions": []
    },
    {
     "id": "c2-b40",
     "text": "La nuit tomba sur la Salle comme toutes les nuits, par les hautes fenêtres, en gris puis en bleu. Les fileuses dormaient sur les bat-flanc du fond, sous les écheveaux, dans l’odeur de chanvre qui ne quittait jamais leurs cheveux. Aube ne dormait pas. Elle écoutait la corde chanter faux, maintenant qu’elle savait ce que c’était que le soir, et elle roulait entre ses doigts sa propre cordelette, la petite corde de sa vie qu’elle portait au poignet gauche depuis ses sept ans, et qui avait si peu de nœuds. Le nœud du filage. Le nœud de la brûlure, l’année du goudron renversé. Un nœud pour la première nappe parfaite, qu’elle avait fait en cachette parce que ce n’était pas un événement qui compte. Trois nœuds pour dix-sept ans. Les cordelettes des filles de la Haute étaient déjà lourdes comme des chapelets.",
     "mentions": [
      "la-cordelette",
      "aube"
     ]
    },
    {
     "id": "c2-b41",
     "text": "Une ombre s’assit au bord de son bat-flanc. Hersende.",
     "mentions": []
    },
    {
     "id": "c2-b42",
     "text": "Elle avait apporté une lampe à huile qu’elle posa sur le sol, une pelote de ficelle neuve et ses mains. Elle ne dit rien. Elle regarda Aube un long moment, dans la lumière qui montait d’en bas et lui creusait le visage, puis elle prit la ficelle et commença à nouer.",
     "mentions": [
      "hersende"
     ]
    },
    {
     "id": "c2-b43",
     "text": "Aube s’assit pour regarder. Elle n’avait jamais vu Hersende nouer, pas vraiment ; elle l’avait vue reprendre des amarres, des nœuds de travail, avec une économie de gestes qui faisait taire les apprentis. Ce qu’elle faisait maintenant était autre chose. Des nœuds petits, serrés, à intervalles inégaux, certains simples, d’autres doubles, d’autres encore qu’Aube ne connaissait pas, qui laissaient une boucle ou une torsion, et entre eux des longueurs de ficelle lisse. Cela ressemblait aux lettres que Garance la colporteuse rapportait des Hauts au printemps, que Hersende lisait des doigts, les yeux fermés, et qu’elle brûlait ensuite. Aube avait toujours cru que c’était des comptes.",
     "mentions": [
      "le-parler-noeud",
      "garance-malaurie"
     ]
    },
    {
     "id": "c2-b44",
     "text": "— C’est une lettre, dit-elle.",
     "mentions": []
    },
    {
     "id": "c2-b45",
     "text": "Hersende ne répondit pas. Elle nouait. Cela dura ce que dure une lampe.",
     "mentions": []
    },
    {
     "id": "c2-b46",
     "text": "Quand elle eut fini, elle roula la ficelle nouée en un petit paquet serré, gros comme un œuf, et le mit dans la main d’Aube, et referma les doigts d’Aube dessus.",
     "mentions": []
    },
    {
     "id": "c2-b47",
     "text": "— Tiens.",
     "mentions": []
    },
    {
     "id": "c2-b48",
     "text": "— Pour qui ?",
     "mentions": []
    },
    {
     "id": "c2-b49",
     "text": "Hersende leva le menton vers le nord. Puis, comme Aube ne comprenait pas, elle fit avec la main droite le geste d’une clochette qui balance : la sonnaille de la mule de Garance, qu’on entendait chaque printemps dans la ruelle avant de la voir.",
     "mentions": []
    },
    {
     "id": "c2-b50",
     "text": "— Garance. Elle monte aux Hauts ?",
     "mentions": []
    },
    {
     "id": "c2-b51",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b52",
     "text": "— Quand ?",
     "mentions": []
    },
    {
     "id": "c2-b53",
     "text": "Hersende montra la fenêtre, le bleu qui ne serait pas encore gris avant des heures, et dit :",
     "mentions": []
    },
    {
     "id": "c2-b54",
     "text": "— Va.",
     "mentions": []
    },
    {
     "id": "c2-b55",
     "text": "Aube regarda le paquet de ficelle dans sa main, puis la vieille, puis le paquet.",
     "mentions": []
    },
    {
     "id": "c2-b56",
     "text": "— Tu veux que je le lui porte. Maintenant.",
     "mentions": []
    },
    {
     "id": "c2-b57",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c2-b58",
     "text": "— Tu veux que je monte avec elle.",
     "mentions": []
    },
    {
     "id": "c2-b59",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b60",
     "text": "— Hersende. Si je pars, ils diront que j’ai fui. Ils l’écriront. Aymon l’écrira, il écrit tout.",
     "mentions": []
    },
    {
     "id": "c2-b61",
     "text": "— Non.",
     "mentions": []
    },
    {
     "id": "c2-b62",
     "text": "C’était dit sans colère, comme on corrige un fil. Aube attendit. Elle connaissait la vieille assez pour savoir qu’il y avait encore un mot, et qu’il coûtait.",
     "mentions": []
    },
    {
     "id": "c2-b63",
     "text": "— Encore, dit Hersende.",
     "mentions": []
    },
    {
     "id": "c2-b64",
     "text": "— Encore quoi ?",
     "mentions": []
    },
    {
     "id": "c2-b65",
     "text": "Hersende toucha le paquet dans la main d’Aube. Puis elle toucha, du même doigt, la tempe d’Aube, juste au-dessus de l’oreille, à l’endroit où, quand on file, on sent le fil avant de le voir.",
     "mentions": []
    },
    {
     "id": "c2-b66",
     "text": "— Il y a quelque chose que je ne sais pas, dit Aube lentement. Là-haut. Quelque chose que tu sais et que tu ne peux plus dire.",
     "mentions": []
    },
    {
     "id": "c2-b67",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c2-b68",
     "text": "— Et toi ?",
     "mentions": []
    },
    {
     "id": "c2-b69",
     "text": "Hersende se leva. Elle remit la lampe dans sa main, et elle dit son mot le plus usé, celui qui servait à tout, à tendre le pain et à tendre la main :",
     "mentions": []
    },
    {
     "id": "c2-b70",
     "text": "— Tiens.",
     "mentions": []
    },
    {
     "id": "c2-b71",
     "text": "Aube crut qu’elle voulait dire « tiens la lampe ». Elle prit la lampe. Elle repenserait longtemps à cet instant, plus tard, et à ce que le mot voulait dire ; sur le moment, elle ne vit qu’une vieille femme qui lui tournait le dos et s’en allait entre les bat-flanc, sans bruit, dans le noir qu’elle connaissait mieux que la lumière.",
     "mentions": []
    },
    {
     "id": "c2-b72",
     "text": "Elle n’emporta presque rien, parce qu’elle n’avait presque rien : la couverture, le couteau à chanvre, la moitié de miche qui restait, la cordelette au poignet, le paquet de Hersende contre la peau, sous la chemise. Elle sortit de la Salle par la porte du goudron, celle qui ne grince pas, et traversa la Basse endormie en longeant les murs, et la corde chantait faux au-dessus d’elle, et elle pensa que c’était peut-être la dernière fois qu’elle l’entendait, et que si elle se trompait sur tout, ce serait à cause de cette note-là que la Basse se noierait. Elle pensa cela clairement, une fois, et le rangea avec le compliment d’Aymon, dans le même endroit, et continua.",
     "mentions": []
    },
    {
     "id": "c2-b73",
     "text": "La Porte du Nord n’était pas une porte, c’était une brèche dans le vieux mur de la Basse d’où partait la Montée des Gabariers, le chemin muletier qui grimpait à l’ouest de la Levée jusqu’au rivage du lac. On la fermait d’une chaîne, la nuit, par habitude. La chaîne était décrochée.",
     "mentions": []
    },
    {
     "id": "c2-b74",
     "text": "Une mule grise attendait de l’autre côté, si chargée qu’on aurait dit une maison en marche, avec une sonnaille au cou qu’une main avait bourrée de chiffon pour la faire taire. À côté de la mule, une femme en manteau de feutre, courte et carrée, un bâton à la main, qui mâchait quelque chose et regardait Aube venir sans surprise.",
     "mentions": [
      "vergogne",
      "garance-malaurie"
     ]
    },
    {
     "id": "c2-b75",
     "text": "Et derrière la femme, un peu à l’écart, appuyé au mur avec le naturel de quelqu’un qui n’est jamais resté debout dehors une nuit entière, un garçon en manteau de voyage trop neuf, un sac trop neuf aux pieds. Bastien Dautry.",
     "mentions": [
      "bastien-dautry"
     ]
    },
    {
     "id": "c2-b76",
     "text": "Aube s’arrêta net.",
     "mentions": []
    },
    {
     "id": "c2-b77",
     "text": "— Il ne vient pas, dit-elle.",
     "mentions": []
    },
    {
     "id": "c2-b78",
     "text": "— Il paie, dit Garance. Six sols le jour, il porte sa part, il ne parle pas à la mule. Toi tu ne paies pas. Je fais le compte, ne t’inquiète pas.",
     "mentions": []
    },
    {
     "id": "c2-b79",
     "text": "— Il est le fils de la Prévôte.",
     "mentions": []
    },
    {
     "id": "c2-b80",
     "text": "— Je sais qui il est, je vends du sel à sa mère depuis qu’il tétait. Écoute-moi, la fileuse, parce qu’on n’a pas le temps de faire ça deux fois. Une fille seule sur la route de la Tende avec la Corderie derrière elle, à la Fonte, ça se remarque. Une colporteuse qui monte aux Hauts avec un fils de Maison en tournée d’achat de chanvre et sa servante, ça passe tous les jours. Il paie, tu portes, je marche devant. Tu as autre chose à proposer ?",
     "mentions": []
    },
    {
     "id": "c2-b81",
     "text": "Aube regarda Bastien. Bastien la regarda, et pour la première fois depuis la Halle il eut l’air d’avoir dix-huit ans et froid.",
     "mentions": []
    },
    {
     "id": "c2-b82",
     "text": "— Je suis allé à la Corderie, dit-il. Cette nuit. Je voulais te dire que si tu montais à la Levée à la lune, j’y serais aussi. Debout, à côté. Ça ne sert à rien, je sais. Le portier a dit que tu étais sortie avec un sac par la porte du goudron. J’ai couru.",
     "mentions": []
    },
    {
     "id": "c2-b83",
     "text": "— Et tu as trouvé une colporteuse à la Porte du Nord à cette heure-là, par hasard.",
     "mentions": []
    },
    {
     "id": "c2-b84",
     "text": "— Non. J’ai trouvé une colporteuse qui m’a demandé six sols.",
     "mentions": []
    },
    {
     "id": "c2-b85",
     "text": "Garance haussa les épaules, débourra la sonnaille de la mule, qui tinta une fois, clair, dans le noir.",
     "mentions": []
    },
    {
     "id": "c2-b86",
     "text": "— La chaîne était déjà décrochée quand je suis arrivée, dit-elle. Je n’ai pas demandé par qui. La vieille ne m’a jamais rien demandé non plus, en quinze ans que je lui porte ses ficelles. On y va ? Vergogne n’aime pas attendre, et moi je n’aime pas Vergogne quand elle n’aime pas.",
     "mentions": []
    },
    {
     "id": "c2-b87",
     "text": "Elle prit le chemin. La mule suivit. Bastien ramassa son sac trop neuf et regarda Aube, et attendit, et elle comprit qu’il ne bougerait pas avant elle, et que c’était sa manière à lui de ne pas décider à sa place.",
     "mentions": []
    },
    {
     "id": "c2-b88",
     "text": "Elle regarda derrière elle une dernière fois. La Basse, noire. La Levée, plus noire, qui coupait le ciel. Et sur la crête, invisible, la corde, qui chantait faux.",
     "mentions": []
    },
    {
     "id": "c2-b89",
     "text": "Elle se mit en marche. Le jour n’était pas levé ; il se leva pendant qu’elle montait, dans son dos, sur le lac. Elle ne se retourna pas pour le voir. Elle ne regardait pas où elle allait. Elle filait.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-3",
   "number": 3,
   "title": "La corde qui chante",
   "blocks": [
    {
     "id": "c3-b01",
     "text": "Le rivage de la Retenue était fait de galets gris, plats, qui sonnaient sous les sabots de la mule comme de la vaisselle, et Garance marchait dessus sans les entendre.",
     "mentions": [
      "la-retenue",
      "garance-malaurie"
     ]
    },
    {
     "id": "c3-b02",
     "text": "Elle parlait. Elle parlait depuis la Porte du Nord, sans hâte et sans silence, de la voix égale des gens qui font le même chemin depuis vingt ans et qui savent où il faut poser le pied avant de le poser. Elle disait le prix du sel à Tressaille et le prix du sel à Malebosse, qui n’était pas le même, et pourquoi. Elle disait quel pêcheur du lac avait épousé la fille de quel batelier et ce que ça valait en féra fumée. Elle disait que la Fonte serait tôt cette année, on le voyait à la couleur de l’eau au pied des Aiguilles, un vert de bouteille qui ne trompait pas, et que par conséquent il fallait marcher.",
     "mentions": []
    },
    {
     "id": "c3-b03",
     "text": "— Tu ne t’arrêtes jamais ? demanda Bastien, au bout d’une lieue.",
     "mentions": []
    },
    {
     "id": "c3-b04",
     "text": "— De marcher ou de parler ?",
     "mentions": []
    },
    {
     "id": "c3-b05",
     "text": "— De parler.",
     "mentions": []
    },
    {
     "id": "c3-b06",
     "text": "— Quand on m’achète quelque chose. Tu veux acheter quelque chose ? J’ai des aiguilles de Tressaille, du fil, du sel, de la ficelle des Hauts pour les cordelettes, de la piquette de Malebosse en outre, deux paires de bas, et des nouvelles de la Haute que tu connais déjà. Et des nouets d’hier, pour la mule.",
     "mentions": []
    },
    {
     "id": "c3-b07",
     "text": "— Pour la mule.",
     "mentions": []
    },
    {
     "id": "c3-b08",
     "text": "— Vergogne n’avance pas sans nouets. C’est une bête qui a des principes.",
     "mentions": [
      "vergogne",
      "les-nouets"
     ]
    },
    {
     "id": "c3-b09",
     "text": "Aube marchait derrière, à hauteur de la charge, une main sur le bât pour se tenir dans les passages de galets, et elle écoutait la voix de Garance comme on écoute la pluie sur un toit : non pour ce qu’elle disait, mais pour ce qu’elle couvrait. Depuis une lieue, la corde ne chantait plus. On l’avait perdue en contournant la première pointe du rivage, et le silence qu’elle avait laissé était immense et plein d’oiseaux.",
     "mentions": []
    },
    {
     "id": "c3-b10",
     "text": "Le lac était à leur droite, si près qu’on aurait pu y tremper la main. Il n’avait pas de vagues. Il avait des respirations, de longs plis qui venaient du nord, glissaient sous le reflet des montagnes et mouraient dans les galets avec un bruit de soie. Et il était haut. Aube ne connaissait pas le lac, mais elle connaissait les pierres : sur toute la rive, une ligne de mousse morte, brune, marquait le niveau ordinaire des eaux, et l’eau était deux pieds au-dessus. Des troncs de saules trempaient jusqu’à mi-hauteur. Des piquets d’amarre disparaissaient. Le lac était en train de boire la rive, doucement, sans bruit, et rien de ce qu’il buvait ne ressortait.",
     "mentions": []
    },
    {
     "id": "c3-b11",
     "text": "Derrière eux, la Levée rapetissait. De ce côté-ci on la voyait de dos, si l’on peut dire : un long mur de pierre grise coupé net sur le ciel, et en travers du mur, juste sous la crête, une bande plus sombre, un peu luisante, où l’eau avait affleuré toutes les Fontes depuis trois cents ans. La marque. L’eau en était encore à trois hauteurs d’homme. Elle monterait.",
     "mentions": [
      "la-levee"
     ]
    },
    {
     "id": "c3-b12",
     "text": "Bastien marchait à côté d’Aube, maintenant, parce que le rivage s’était élargi et parce qu’il n’avait pas trouvé de raison de ne pas le faire. Il portait son sac trop neuf et un ballot de Garance sur l’autre épaule, et il n’avait pas protesté quand elle lui avait chargé le ballot, ce qu’Aube avait remarqué et rangé au même endroit que les autres choses. Il avait des ampoules. Ça, elle ne l’avait pas remarqué : elle l’avait vu à sa façon de poser le pied, et elle ne dit rien, parce qu’il ne disait rien.",
     "mentions": []
    },
    {
     "id": "c3-b13",
     "text": "Ils ne parlèrent pas pendant la deuxième lieue. Ce fut lui qui parla à la troisième.",
     "mentions": []
    },
    {
     "id": "c3-b14",
     "text": "— Tu n’as pas demandé pourquoi je viens.",
     "mentions": []
    },
    {
     "id": "c3-b15",
     "text": "— Je l’ai demandé à la porte.",
     "mentions": []
    },
    {
     "id": "c3-b16",
     "text": "— Tu as demandé si je venais. Pas pourquoi.",
     "mentions": []
    },
    {
     "id": "c3-b17",
     "text": "— Une fileuse ne demande pas.",
     "mentions": []
    },
    {
     "id": "c3-b18",
     "text": "Il rit, court, du nez, et se tut, et elle crut que c’était fini. Puis :",
     "mentions": []
    },
    {
     "id": "c3-b19",
     "text": "— Ma sœur s’appelait Clémence. Elle avait neuf ans. C’était l’an 308, la Fonte avait été forte, la Tende avait mangé la Passerelle des Lavandières par le milieu, et on avait mis une corde en travers pour tenir ce qui restait, une corde de la Corderie, une corde avec un nœud dedans. Je te dis ce qu’on m’a dit, j’avais douze ans, je n’étais pas là. Le compagnon qui avait le tour de garde était de l’autre côté de la ville. Le nœud avait dix ans. Personne ne l’avait repris parce que la passerelle ne comptait pas, ce n’était pas la Levée, c’était une passerelle de lavandières. Il a lâché avec six personnes dessus. Cinq sont ressorties.",
     "mentions": [
      "bastien-dautry",
      "la-tende"
     ]
    },
    {
     "id": "c3-b20",
     "text": "Aube ne dit rien. Il n’y avait rien à dire, et elle avait appris depuis longtemps que le silence était la seule chose qu’on pouvait offrir sans en avoir.",
     "mentions": []
    },
    {
     "id": "c3-b21",
     "text": "— Je veux savoir nouer, dit Bastien. Depuis ce jour-là. Pas pour la Levée. Pour qu’il y ait quelqu’un, la prochaine fois, du bon côté de la ville. J’ai demandé à Maître Aymon à quatorze ans. Il a répondu ce qu’il a répondu hier : que mes mots ne pèsent pas. À seize, il a ajouté que ma mère ne le permettrait pas, et que c’était heureux pour moi. Alors j’ai lu. Il y a des livres dans la Haute, tu sais, de vieux livres de chanvre, les Maisons achetaient le chanvre aux Hauts avant que Malebosse en fasse. Dans ces livres, là-haut, on noue autrement. À plusieurs. Je ne sais pas comment, les livres ne disent pas, ils disent que ça se faisait. Je voulais monter voir. Depuis deux ans. Je n’avais pas trouvé de raison assez bonne pour partir sans permission.",
     "mentions": [
      "haut-charme"
     ]
    },
    {
     "id": "c3-b22",
     "text": "— Et moi j’en suis une.",
     "mentions": []
    },
    {
     "id": "c3-b23",
     "text": "— Toi, tu en es une. Je ne vais pas te dire le contraire pour être poli.",
     "mentions": []
    },
    {
     "id": "c3-b24",
     "text": "Elle hocha la tête. C’était, d’une certaine manière, la première chose honnête qu’un fils de Maison lui ait jamais dite, et elle s’aperçut qu’elle préférait cela aux excuses.",
     "mentions": []
    },
    {
     "id": "c3-b25",
     "text": "— Tu sais ce qu’il y a dans les livres et pas dans la vie ? dit Garance sans se retourner. Le prix. Les livres ne donnent jamais le prix. Vergogne, avance.",
     "mentions": []
    },
    {
     "id": "c3-b26",
     "text": "À midi, ils atteignirent la tête du lac, là où la Tende y entrait. Aube l’avait vue en bas, à Tressaille, sage entre ses quais de pierre ; elle ne l’avait jamais vue arriver. La rivière sortait des montagnes par une faille qui semblait taillée à la hache, verte, blanche, si bruyante qu’on cessait de s’entendre à cent pas, et elle se jetait dans le lac avec une violence qui faisait un bourrelet d’écume sur un quart de lieue, et le lac la buvait, et se taisait. Là commençaient les gorges. Le chemin muletier, qui avait été un rivage, devenait une corniche.",
     "mentions": []
    },
    {
     "id": "c3-b27",
     "text": "Ils mangèrent debout, du pain de châtaigne et de la tomme que Garance débitait au couteau sur le bât de la mule, en criant pour se faire entendre. Puis ils entrèrent dans le bruit.",
     "mentions": []
    },
    {
     "id": "c3-b28",
     "text": "L’après-midi fut long et étroit. Le chemin montait en lacets sur la rive de l’ouest, entre la paroi et le vide, parfois large de trois pas, parfois d’un seul, avec des marches taillées et des rampes de corde grise scellées dans le roc, que Garance touchait au passage comme on salue. La Tende était dessous, tantôt à dix pas, tantôt à cent, toujours blanche. L’autre rive, la rive d’ombre, dressait en face une muraille où le soleil ne donnait jamais et où poussaient des pins tordus, la tête en bas. Bastien ne regardait pas le vide. Aube le regardait pour lui, et regardait aussi les rampes de corde, et les nœuds qui les tenaient au roc, et pensait, à chaque nœud, à un mot qu’elle ne saurait jamais.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c3-b29",
     "text": "Vers le soir, le bruit changea.",
     "mentions": []
    },
    {
     "id": "c3-b30",
     "text": "Ce fut d’abord une note sous le bruit de l’eau, une seule, longue, si basse qu’on la prenait pour le sang dans ses oreilles. Puis une autre, plus haute, qui vint s’y poser. Puis une troisième. Garance s’arrêta, leva la tête, et Aube vit son visage faire quelque chose qu’il n’avait pas fait de toute la journée : se taire.",
     "mentions": []
    },
    {
     "id": "c3-b31",
     "text": "— Elle chante, dit Garance. On arrive.",
     "mentions": []
    },
    {
     "id": "c3-b32",
     "text": "Le chemin tourna, la gorge s’ouvrit, et le pont était là.",
     "mentions": []
    },
    {
     "id": "c3-b33",
     "text": "Aube avait vu des ponts. Elle avait vu la Levée. Elle n’avait jamais vu cela. La Tende, à cet endroit, se resserrait dans une fosse si étroite qu’un homme aurait pu la jeter d’une pierre, et si profonde qu’on ne voyait pas le fond, seulement une lueur blanche qui bougeait ; et d’une lèvre de la fosse à l’autre, à quatre cents pas au-dessus de l’eau, sur toute la largeur du ciel, la Grande Traversée était tendue. Deux câbles gros comme des cuisses, gris, goudronnés, plongeaient d’un rocher à l’autre en une courbe qu’on aurait dite dessinée ; entre eux, un tablier de planches suspendu à des centaines de cordes verticales, chacune plus fine que la précédente à mesure qu’elle s’éloignait, jusqu’à n’être plus, au milieu, que des traits d’encre sur le soir. Et le vent qui remontait la gorge passait au travers, et chaque corde avait sa note, et le pont chantait.",
     "mentions": [
      "pont-sauvage"
     ]
    },
    {
     "id": "c3-b34",
     "text": "Ce n’était pas la voix de la Maîtresse-Corde. La Maîtresse-Corde chantait une note, grave, pour une seule chose. Le pont chantait des centaines de notes, changeantes, qui s’accordaient et se déprenaient au gré du vent, un accord immense, mouvant, où l’oreille cherchait sans cesse une phrase et n’en trouvait pas, et c’était cela qui faisait qu’on ne pouvait plus s’en détacher. Aube resta debout au bord du chemin, la main sur le bât de la mule, la bouche entrouverte, et quelque chose en elle se dénoua qu’elle ne savait pas noué depuis la Halle. Elle ne savait pas qu’on pouvait faire ça avec de la corde. Elle ne savait pas que la corde, qui tenait, pouvait aussi chanter pour rien, pour le vent, pour que ce soit beau.",
     "mentions": []
    },
    {
     "id": "c3-b35",
     "text": "— Pluie demain, dit Garance, la tête penchée. Tu entends la troisième, celle qui traîne ? Quand elle traîne, il pleut. Mon père disait ça. Il n’avait pas toujours raison.",
     "mentions": []
    },
    {
     "id": "c3-b36",
     "text": "— Ton père était d’ici.",
     "mentions": []
    },
    {
     "id": "c3-b37",
     "text": "— Je suis d’ici. Pont-Sauvage. Vingt maisons, une auberge, un pont. On naît en écoutant ça et on ne l’entend plus à dix ans, comme vous avec votre corde. Il faut partir pour l’entendre. Moi, je pars quinze fois l’an.",
     "mentions": []
    },
    {
     "id": "c3-b38",
     "text": "Le village s’accrochait à la lèvre de l’ouest, au-dessus de l’ancrage du pont : des maisons de pierre grise à toits de lauzes, des cordes à linge, une auberge dont la lanterne était déjà allumée, et sur la petite place, devant le pont, des gens. Ils étaient là comme on est sur une place à la fin du jour, des femmes avec des seaux, des hommes qui revenaient des terrasses, des enfants ; mais ils ne parlaient pas fort, et de temps en temps l’un d’eux levait la tête vers le pont, et écoutait, et hochait la tête, et reprenait sa phrase. Le pont était leur ciel. Il leur disait le temps.",
     "mentions": []
    },
    {
     "id": "c3-b39",
     "text": "Deux garçons couraient dessus, au milieu, à quatre cents pas au-dessus de la Tende, et personne ne leur criait rien. Le tablier se balançait sous eux, à peine, et les centaines de cordes chantaient, et Aube comprit que ces enfants avaient appris à marcher là-dessus, et que c’était cela, aussi, la corde : une chose sur laquelle on pouvait laisser courir ses enfants parce que quelqu’un, un jour, avait donné un mot.",
     "mentions": []
    },
    {
     "id": "c3-b40",
     "text": "— Qui la tient ? demanda-t-elle.",
     "mentions": []
    },
    {
     "id": "c3-b41",
     "text": "— Un compagnon de Tressaille, tous les dix ans. Deux nœuds, un par câble, aux ancrages. La dernière reprise date de l’an 306, c’était un grand rouquin qui a bu l’auberge pendant trois jours après. Il a donné « soif ». C’est ce qu’il a dit, en tout cas. Ça a fait rire tout le village, il l’a fait exprès.",
     "mentions": []
    },
    {
     "id": "c3-b42",
     "text": "— Elle est à échéance dans deux ans.",
     "mentions": []
    },
    {
     "id": "c3-b43",
     "text": "— Elle est à échéance quand elle chante faux, et elle chante juste. Écoute-la. Écoute-la et arrête de compter, la fileuse, pour une fois.",
     "mentions": [
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c3-b44",
     "text": "Aube écouta. Elle essaya. Puis son regard traversa le pont, comme le vent, et se posa de l’autre côté, sur la lèvre de l’est, sur la grosse pierre d’ancrage où les câbles s’enfonçaient dans le roc.",
     "mentions": []
    },
    {
     "id": "c3-b45",
     "text": "Quelqu’un était assis dessus.",
     "mentions": []
    },
    {
     "id": "c3-b46",
     "text": "Il mangeait une poire. Il la mangeait avec application, en tournant le fruit dans sa main pour ne rien perdre, les jambes pendantes, le dos à la rive d’ombre, le visage vers le village, et il regardait Aube depuis un moment, elle le comprit à la manière dont il ne détourna pas les yeux quand elle le vit. Un manteau de la Corderie, gris, au col de goudron. Des mains qui ne faisaient rien de plus que ce qu’il fallait pour manger une poire.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c3-b47",
     "text": "— Le compagnon, dit Bastien à côté d’elle, d’une voix qui avait changé.",
     "mentions": []
    },
    {
     "id": "c3-b48",
     "text": "— Séverin.",
     "mentions": []
    },
    {
     "id": "c3-b49",
     "text": "— Il est arrivé avant nous.",
     "mentions": []
    },
    {
     "id": "c3-b50",
     "text": "— La gabare de la Corderie file sur le lac, dit Garance. Il a traversé la Retenue en trois heures, il a pris la rive d’ombre. Un jour de gagné. Maître Aymon ne l’a pas envoyé pour te rattraper, la fileuse. Il l’a envoyé pour t’attendre. Ce n’est pas pareil.",
     "mentions": []
    },
    {
     "id": "c3-b51",
     "text": "Aube ne répondit pas. Elle prit le pont.",
     "mentions": []
    },
    {
     "id": "c3-b52",
     "text": "Elle n’y avait jamais marché. Le tablier se souleva sous elle, se déroba, revint ; les câbles chantèrent plus fort à son passage, comme si elle ajoutait une note. Elle marcha au milieu, une main sur la corde de rampe, la Tende blanche quatre cents pas dessous, et elle ne regarda pas dessous, et elle ne regarda pas derrière, elle regarda le garçon qui mangeait une poire et qui, quand elle fut à dix pas, jeta le trognon dans la fosse et l’écouta ne pas tomber.",
     "mentions": []
    },
    {
     "id": "c3-b53",
     "text": "— Bonsoir, la fileuse, dit-il.",
     "mentions": []
    },
    {
     "id": "c3-b54",
     "text": "— Tu es venu me ramener.",
     "mentions": []
    },
    {
     "id": "c3-b55",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c3-b56",
     "text": "— Comment ?",
     "mentions": []
    },
    {
     "id": "c3-b57",
     "text": "Il réfléchit, honnêtement, elle le vit.",
     "mentions": []
    },
    {
     "id": "c3-b58",
     "text": "— Je n’ai pas d’idée. Maître Aymon non plus. C’est pour ça qu’il m’a envoyé, moi, et pas les gabariers : les gabariers t’auraient prise sous le bras, et alors tu aurais dit non sur la Levée, et la ville aurait eu un nœud qui ne tient pas, et un cadavre debout dessus. Il l’a dit avec d’autres mots. Il n’a plus « cadavre ». Il a dit : « une fileuse debout et une Basse au fond de l’eau ».",
     "mentions": []
    },
    {
     "id": "c3-b59",
     "text": "— Alors tu ne peux rien.",
     "mentions": []
    },
    {
     "id": "c3-b60",
     "text": "— Je peux te parler. Je peux marcher avec toi. Je peux te garder en vie jusqu’à la lune, ce qui, sur ce chemin, à la Fonte, avec un fils de Maison qui a des ampoules et une colporteuse qui parle, n’est pas rien. Et je peux espérer que tu réfléchisses en marchant. Il m’a dit : « Elle a de la tête. Le fil n’a pas tremblé une fois. » Il t’aime bien, je crois. Il n’a pas le mot.",
     "mentions": []
    },
    {
     "id": "c3-b61",
     "text": "Aube regarda la fosse. Le pont chantait autour d’elle, dans ses pieds, dans la rampe sous sa main, et elle sentit très exactement, comme sur la crête devant Aymon, la forme de ce qui venait de changer. Ils l’avaient désignée. Ils l’avaient nourrie, filée, écrite d’avance sur une page blanche. Et ils ne pouvaient rien. Rien du tout. Ils avaient besoin d’une seule chose au monde, et cette chose était dans sa bouche, et personne, ni la Charte, ni la Prévôte, ni le Maître, ni ce garçon qui mangeait des poires en attendant, ne pouvait la lui prendre.",
     "mentions": []
    },
    {
     "id": "c3-b62",
     "text": "Elle n’avait jamais rien eu que quelqu’un veuille. C’était une sensation étrange, et pas entièrement désagréable, et elle se méfia d’elle aussitôt.",
     "mentions": []
    },
    {
     "id": "c3-b63",
     "text": "— Je ne redescends pas, dit-elle.",
     "mentions": []
    },
    {
     "id": "c3-b64",
     "text": "— Je sais. Je l’ai su en te voyant prendre le pont. Tu ne l’as pas pris comme une fille qui fuit, tu l’as pris comme une fille qui va quelque part. Où ?",
     "mentions": []
    },
    {
     "id": "c3-b65",
     "text": "— Haut.",
     "mentions": []
    },
    {
     "id": "c3-b66",
     "text": "Il hocha la tête, comme si c’était une réponse.",
     "mentions": []
    },
    {
     "id": "c3-b67",
     "text": "— Alors je marche avec vous. Jusqu’à ce que tu changes d’avis, ou jusqu’à la lune.",
     "mentions": []
    },
    {
     "id": "c3-b68",
     "text": "— Et si je ne change pas d’avis ?",
     "mentions": []
    },
    {
     "id": "c3-b69",
     "text": "Séverin se leva de la pierre d’ancrage, épousseta son manteau, et regarda vers le village où Garance déchargeait Vergogne devant l’auberge et où Bastien, debout au bord du pont, n’osait pas le prendre.",
     "mentions": []
    },
    {
     "id": "c3-b70",
     "text": "— Alors la ville aura eu ce qu’elle a choisi, dit-il. Elle t’a choisie. Il fallait bien qu’un jour ça se retourne.",
     "mentions": []
    },
    {
     "id": "c3-b71",
     "text": "Derrière eux, au-dessus de la fosse, le vent du soir fraîchit, et la Grande Traversée changea de note. Personne, sur la place, ne leva la tête : c’était le vent, c’était la pluie de demain. Aube, elle, écouta. La troisième note traînait. Et sous la troisième, tout en bas de l’accord, il y en avait une qu’elle connaissait, pour l’avoir entendue de son bat-flanc toute sa vie : une note un peu basse, comme une voix qui a froid.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-4",
   "number": 4,
   "title": "Nœud d’amarre",
   "blocks": [
    {
     "id": "c4-b01",
     "text": "Il pleuvait, comme la troisième note l’avait dit.",
     "mentions": [
      "pont-sauvage"
     ]
    },
    {
     "id": "c4-b02",
     "text": "Une pluie de Fonte, fine et têtue, qui ne tombait pas tant qu’elle restait suspendue dans la gorge, et qui mettait sur les lauzes, sur les cordes, sur le dos de Vergogne, un vernis gris. L’auberge de Pont-Sauvage servait une bouillie d’avoine à deux deniers le bol. Garance en prit trois, pour elle, pour Bastien et pour la mule, et posa les six deniers sur la table un par un, à voix haute, parce qu’elle tenait ses comptes comme d’autres disent leurs prières. Aube n’en prit pas. Elle ne payait pas ; on ne lui avait pas dit qu’on paierait pour elle, et elle ne demandait pas. Elle avait le fond de la miche de Hersende. Elle le mangea en regardant la pluie.",
     "mentions": [
      "garance-malaurie",
      "vergogne"
     ]
    },
    {
     "id": "c4-b03",
     "text": "Séverin descendit le dernier. Il avait dormi à l’auberge aussi, dans la salle commune, roulé dans son manteau au col de goudron, et il avait, remarqua-t-elle, la même tête au réveil que la veille au soir : une tête de quelqu’un qui n’est jamais pris au dépourvu parce qu’il ne compte sur rien. Il salua Garance d’un signe, Bastien d’un autre, plus court, s’assit et commanda un bol.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c4-b04",
     "text": "— Vous êtes arrivés la veille au soir, dit-il à Bastien. Par la corniche ?",
     "mentions": []
    },
    {
     "id": "c4-b05",
     "text": "— Hier soir. Oui.",
     "mentions": []
    },
    {
     "id": "c4-b06",
     "text": "— C’est ce que j’ai dit.",
     "mentions": []
    },
    {
     "id": "c4-b07",
     "text": "Bastien ouvrit la bouche, puis la ferma, et Aube vit qu’il venait de comprendre, et qu’il avait décidé de ne pas le montrer. Séverin n’avait plus « hier ». Il avait « la veille ». Elle se demanda pour quoi il l’avait donné, et à qui, et depuis quand il tournait ainsi autour du trou, comme on contourne une pierre dans un chemin qu’on connaît par cœur.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c4-b08",
     "text": "— On passe le pont avec le chanvre, dit Garance en se levant. Le convoi de Malebosse descend ce matin, je l’ai entendu arriver à l’aube de l’autre côté. Quand ils seront passés, on monte. Le tablier n’aime pas les deux sens.",
     "mentions": []
    },
    {
     "id": "c4-b09",
     "text": "Le convoi était déjà engagé quand ils sortirent : six mules chargées de balles de chanvre brut, hautes comme des meules, trois hommes en capes de feutre, et une clochette en tête. Ils venaient de la rive d’ombre et marchaient vers le village, lentement, au pas des mules, et le pont chantait sous eux d’une voix changée, alourdie, où la pluie mettait des sourdines. Toute la place regardait. On regardait toujours passer le chanvre : c’était l’argent de l’année qui traversait.",
     "mentions": [
      "malebosse"
     ]
    },
    {
     "id": "c4-b10",
     "text": "Aube regardait les câbles.",
     "mentions": []
    },
    {
     "id": "c4-b11",
     "text": "Elle ne l’avait pas décidé. Ses yeux étaient allés là tout seuls, comme sur un fil : sous le tablier, les deux câbles porteurs, gros comme des cuisses, qui prenaient tout le poids et le portaient d’un roc à l’autre ; de leur ancrage de l’ouest, sous ses pieds presque, où ils entraient dans la pierre par des anneaux de fer forgé aussi larges que des colliers de bœuf ; et de l’autre, à quatre cents pas, invisibles dans la pluie, les nœuds. Deux nœuds. Un grand rouquin qui avait donné « soif ». Elle écoutait le pont avec le ventre, et le pont, sous les six mules, chantait bas.",
     "mentions": []
    },
    {
     "id": "c4-b12",
     "text": "— Séverin, dit-elle.",
     "mentions": []
    },
    {
     "id": "c4-b13",
     "text": "Il était déjà à côté d’elle. Il écoutait aussi. Elle le vit fermer les yeux, une seconde, comme Hersende quand elle lisait une ficelle.",
     "mentions": []
    },
    {
     "id": "c4-b14",
     "text": "— Le câble du nord, dit-il. Il file.",
     "mentions": []
    },
    {
     "id": "c4-b15",
     "text": "— Il ne peut pas filer, dit Garance derrière eux. Il est noué.",
     "mentions": []
    },
    {
     "id": "c4-b16",
     "text": "— Il file quand même. Regardez le tablier.",
     "mentions": []
    },
    {
     "id": "c4-b17",
     "text": "Ils regardèrent. Il fallait le savoir pour le voir. Au milieu du pont, là où les six mules avançaient en file, le plancher n’était plus tout à fait plat : il penchait vers le nord, d’un rien, d’un doigt, puis de deux ; et sur la place, une femme cria, un seul cri, parce qu’elle venait de le voir aussi, et alors tout le monde le vit, et la note du pont descendit d’un ton, d’un coup, comme une marche qu’on rate.",
     "mentions": []
    },
    {
     "id": "c4-b18",
     "text": "Le câble du nord filait par son ancrage de l’est. Pas vite. Un pouce à la fois, avec un frottement qu’on entendait maintenant sous le chant, un gémissement de corde goudronnée qui glisse dans un anneau de fer, et à chaque pouce le tablier penchait un peu plus, et les mules s’arrêtaient, et les hommes criaient, et une balle de chanvre bascula par-dessus la rampe et tomba dans la Fosse, longtemps, et on ne l’entendit pas toucher l’eau.",
     "mentions": []
    },
    {
     "id": "c4-b19",
     "text": "— Le nœud lâche, dit Séverin. Huit ans, la pluie, six mules. Il a dû être serré juste pour dix.",
     "mentions": [
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c4-b20",
     "text": "— Fais quelque chose, dit Bastien.",
     "mentions": []
    },
    {
     "id": "c4-b21",
     "text": "— Le nœud est à l’est. Il faut le reprendre à l’est.",
     "mentions": []
    },
    {
     "id": "c4-b22",
     "text": "Et il partit. Il ne courut pas : on ne court pas sur un tablier qui penche. Il marcha vite, très vite, penché en avant, une main sur la rampe du sud, et il s’enfonça dans la pluie vers les mules, vers les hommes, vers le nœud qui lâchait à quatre cents pas, et Aube compta sans le vouloir : il lui faudrait le temps d’une nappe, et le câble filait un pouce à chaque souffle.",
     "mentions": []
    },
    {
     "id": "c4-b23",
     "text": "Elle regarda l’ancrage de l’ouest. À trois pas de ses pieds. L’anneau de fer, la pierre, et le câble du nord qui y entrait, et qui bougeait. On le voyait bouger, maintenant, ici aussi, à quatre cents pas du nœud : il glissait dans l’anneau vers le vide, un pouce, un pouce, entraîné par sa propre longueur qui s’en allait de l’autre côté. Tout le câble filait. D’un bout à l’autre. C’était une seule corde, et une corde n’a qu’un seul état à la fois.",
     "mentions": []
    },
    {
     "id": "c4-b24",
     "text": "« Un nœud sur une chose tient la chose. » Ce n’était pas une pensée, c’était la première leçon qu’on donnait aux fileuses avec la première mèche, comme on dit aux enfants de ne pas toucher le feu, et elle l’avait entendue mille fois sans jamais l’entendre. Elle l’entendit.",
     "mentions": []
    },
    {
     "id": "c4-b25",
     "text": "Elle n’avait pas de corde.",
     "mentions": []
    },
    {
     "id": "c4-b26",
     "text": "Elle avait une ficelle, au poignet gauche, longue comme deux avant-bras, grise, un peu usée, filée par une enfant de sept ans sous les yeux d’une vieille qui ne parlait déjà plus beaucoup, et sur laquelle il y avait trois nœuds.",
     "mentions": [
      "la-cordelette"
     ]
    },
    {
     "id": "c4-b27",
     "text": "Elle la dénoua de son poignet. Ses mains le firent avant elle. Elle se jeta à genoux sur la pierre mouillée, devant l’anneau, et passa la cordelette autour du câble du nord, deux fois, un tour mort, en serrant fort pour que le goudron morde ; le câble glissa sous ses doigts, brûlant de frottement, et emporta un pouce de plus ; elle fit la première demi-clé, la deuxième, et bloqua le bout sous le tour, et c’était le nœud d’amarre qu’on faisait dix fois par jour aux gabares du Déversoir, un nœud d’enfant, un nœud qui n’avait jamais rien tenu d’autre que des barques.",
     "mentions": []
    },
    {
     "id": "c4-b28",
     "text": "Puis elle approcha la bouche du nœud, et elle ne savait pas quel mot.",
     "mentions": []
    },
    {
     "id": "c4-b29",
     "text": "Elle n’avait pas réfléchi. Elle n’avait pas eu le temps d’une nappe. Elle avait dans la bouche ce qu’elle avait toujours dans la bouche à cette heure-là, le matin, depuis dix-sept ans ; ce qu’elle avait eu à l’aube dans la Salle, à la Porte du Nord, sur le rivage ; ce qu’elle avait encore là, maintenant, avec le fond de la miche de Hersende qui ne pesait rien.",
     "mentions": []
    },
    {
     "id": "c4-b30",
     "text": "Elle serra sur le mot.",
     "mentions": []
    },
    {
     "id": "c4-b31",
     "text": "— Faim.",
     "mentions": []
    },
    {
     "id": "c4-b32",
     "text": "Le câble s’arrêta.",
     "mentions": []
    },
    {
     "id": "c4-b33",
     "text": "Pas comme une chose qu’on retient : comme une chose qui n’a jamais bougé. Sous ses doigts, le goudron cessa de brûler. Le gémissement dans l’anneau se tut. Sur toute sa longueur, d’un roc à l’autre, la corde du nord se figea dans la pluie, penchée, tordue, exactement là où elle était, et le pont s’arrêta de pencher, et la note remonta, non pas jusqu’au juste, mais jusqu’à quelque chose qui tenait, et sur la place derrière elle il y eut un silence, puis le bruit d’une femme qui se rassied par terre.",
     "mentions": []
    },
    {
     "id": "c4-b34",
     "text": "Aube resta à genoux, les deux mains sur le nœud. Sa cordelette. Trois nœuds pour dix-sept ans, et un quatrième qui n’était plus à elle, qui ne le serait plus jamais, serré sur un câble de Pont-Sauvage avec un mot dedans.",
     "mentions": []
    },
    {
     "id": "c4-b35",
     "text": "Elle essaya le mot.",
     "mentions": []
    },
    {
     "id": "c4-b36",
     "text": "Elle ouvrit la bouche pour le dire, à voix basse, pour voir, comme on touche une dent avec la langue. Il n’y avait rien. Pas un vide : une marche manquée dans le noir, un pied qui descend et ne trouve pas. Elle savait ce qu’elle avait au ventre. Elle savait parfaitement ce que c’était, elle le connaissait mieux que son nom. Et elle ne pouvait pas le dire, et en cherchant à le dire elle s’aperçut qu’elle ne pouvait pas non plus tout à fait le penser, que le mot était là comme un mot d’une langue apprise trop tard, qu’on comprend et qu’on ne peut pas prononcer, et que ce qu’il désignait en elle, du coup, n’avait plus de contour. Il y avait une chose au ventre. C’était tout.",
     "mentions": []
    },
    {
     "id": "c4-b37",
     "text": "— Debout, la fileuse, dit Garance. Tu es trempée jusqu’à l’os.",
     "mentions": []
    },
    {
     "id": "c4-b38",
     "text": "Elle se releva. La place la regardait comme la Halle l’avait regardée : avec l’attention qu’on doit à ce qui retient beaucoup d’eau. Elle n’aima pas ça davantage.",
     "mentions": []
    },
    {
     "id": "c4-b39",
     "text": "Sur le pont, les hommes faisaient reculer les mules vers l’est, une à une, sur le tablier immobile et de travers. Deux balles étaient tombées. Personne. Tout au bout, dans la pluie, on devinait une forme penchée sur l’ancrage : Séverin, arrivé, agenouillé devant un nœud qui n’avait plus besoin de lui, les deux mains sur un câble qui ne bougeait pas, et qui, elle le savait sans le voir, écoutait.",
     "mentions": []
    },
    {
     "id": "c4-b40",
     "text": "Il revint une heure plus tard, quand le convoi eut fini de reculer et que les gens du village eurent fini de venir toucher le câble du nord à l’ancrage de l’ouest, comme on touche une relique, en regardant la petite ficelle grise nouée dessus sans oser y poser le doigt. Il s’accroupit devant le nœud. Il le regarda longtemps. Il ne le toucha pas.",
     "mentions": []
    },
    {
     "id": "c4-b41",
     "text": "— Tour mort et deux demi-clés, dit-il enfin. Un nœud de gabare.",
     "mentions": []
    },
    {
     "id": "c4-b42",
     "text": "— Je ne connais que ceux-là.",
     "mentions": []
    },
    {
     "id": "c4-b43",
     "text": "— Il tient toute la corde. Il tiendra le pont tant qu’on ne le déliera pas, et personne ne le déliera, parce que le nœud de l’est est mort et qu’il faudra un compagnon pour le reprendre avant qu’on touche à celui-ci. Tu as donné quoi ?",
     "mentions": []
    },
    {
     "id": "c4-b44",
     "text": "Elle ouvrit la bouche. Rien ne vint. Elle posa la main à plat sur son ventre, et il comprit tout de suite, et pour la première fois depuis la poire quelque chose bougea dans son visage.",
     "mentions": []
    },
    {
     "id": "c4-b45",
     "text": "— Ah, dit-il.",
     "mentions": []
    },
    {
     "id": "c4-b46",
     "text": "— Quoi.",
     "mentions": []
    },
    {
     "id": "c4-b47",
     "text": "— C’est un mot lourd, pour toi. Il tiendra vingt ans, peut-être trente. Tu n’as pas marchandé.",
     "mentions": []
    },
    {
     "id": "c4-b48",
     "text": "— Je n’ai pas eu le temps.",
     "mentions": []
    },
    {
     "id": "c4-b49",
     "text": "— Personne n’a jamais le temps. C’est pour ça qu’on nous apprend à choisir avant. On monte sur un pont avec deux ou trois mots dans la poche, décidés d’avance, des mots qu’on a vécus assez pour qu’ils tiennent et pas assez pour qu’ils nous manquent. Moi j’avais « tard » dans la poche depuis un an. Toi, tu as pris ce qui venait.",
     "mentions": [
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c4-b50",
     "text": "— Il est venu.",
     "mentions": []
    },
    {
     "id": "c4-b51",
     "text": "— Oui. Il faudra l’inscrire.",
     "mentions": []
    },
    {
     "id": "c4-b52",
     "text": "Elle le regarda sans comprendre.",
     "mentions": []
    },
    {
     "id": "c4-b53",
     "text": "— Le Registre, dit-il. Chaque mot donné, chaque nœud, chaque main. Même les fileuses. Même les nœuds de gabare. Je l’inscrirai à mon retour, à la date d’aujourd’hui : « Aube, fileuse, nœud d’amarre, câble nord de la Grande Traversée. » Et le mot. C’est la règle.",
     "mentions": [
      "le-registre-des-mots-donnes"
     ]
    },
    {
     "id": "c4-b54",
     "text": "Elle ne dit rien. Elle pensa à la page blanche, et à la ligne noire qu’on écrirait ailleurs, plus haut, dans le gris des autres, entre un gabarier et une amarre, et elle ne sut pas ce qu’elle en pensait, et elle le rangea.",
     "mentions": []
    },
    {
     "id": "c4-b55",
     "text": "Ce fut en se retournant vers l’auberge qu’elle vit Garance.",
     "mentions": []
    },
    {
     "id": "c4-b56",
     "text": "Garance ne bougeait pas. Elle se tenait au bord de la place, près de l’ancrage, là où elle avait laissé Vergogne pendant le passage du convoi, et elle regardait dans la Fosse. Vergogne était là, la tête basse, ruisselante, indemne. Le bât était là. Les sangles étaient là, coupées net au couteau, et elles pendaient, vides.",
     "mentions": []
    },
    {
     "id": "c4-b57",
     "text": "— Elle a glissé, dit Bastien à voix basse, à côté d’Aube. Quand le pont a penché, le tablier a tiré sur la rampe, la rampe a tiré sur la pierre où Garance l’avait attachée, et la mule a été traînée vers le bord. Elle ne voulait pas lâcher la charge. La charge pesait deux fois la mule. Garance a dit : coupe. J’ai coupé.",
     "mentions": []
    },
    {
     "id": "c4-b58",
     "text": "— Tout ?",
     "mentions": []
    },
    {
     "id": "c4-b59",
     "text": "— Tout. Le sel. Les aiguilles. Le drap. L’outre. Les bas. Les nouets.",
     "mentions": []
    },
    {
     "id": "c4-b60",
     "text": "Aube regarda la Fosse, blanche, quatre cents pas dessous, qui avait bu deux balles de chanvre, un chargement de colporteuse et le mot qu’elle n’avait plus, et n’avait rien rendu.",
     "mentions": []
    },
    {
     "id": "c4-b61",
     "text": "Elle s’approcha de Garance. Elle ne savait pas quoi dire, et de toute façon elle avait un mot de moins pour le dire, et elle resta debout à côté d’elle, dans la pluie, à regarder le même vide, jusqu’à ce que Garance parle.",
     "mentions": []
    },
    {
     "id": "c4-b62",
     "text": "— Vingt ans de tournées, dit Garance. Je ne dis pas ça pour toi. Tu as tenu le pont. Sans toi, il y avait six mules et trois hommes de Malebosse au fond, et la Fosse aurait eu autre chose que du sel à boire. Je dis ça parce qu’il faut que quelqu’un le dise, et que ce ne sera pas la Corderie. Huit ans, ce nœud. Serré pour dix, il a dit, ton compagnon. Serré juste. Parce que Pont-Sauvage ne compte pas plus que la passerelle du gamin. On reprend la Levée tous les quarante ans avec la vie d’une femme, et les ponts, on les serre juste, et on rentre.",
     "mentions": []
    },
    {
     "id": "c4-b63",
     "text": "Elle cracha dans la Fosse. Le crachat ne tomba pas plus vite que le reste.",
     "mentions": []
    },
    {
     "id": "c4-b64",
     "text": "— Tu montes quand même, dit Aube.",
     "mentions": []
    },
    {
     "id": "c4-b65",
     "text": "— Je vous ai vendu la montée. Je livre. Et j’ai quelqu’un là-haut à qui je porte des ficelles depuis quinze ans, et une vieille en bas qui m’a décroché une chaîne. Ce n’est pas le sel qui me fait marcher, la fileuse. Le sel, ça se rachète. Vergogne, viens là. Tu es une mule sans emploi, il va falloir qu’on te trouve des principes moins chers.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c4-b66",
     "text": "Ils ne passèrent le pont qu’à midi, quand les gens du village eurent fini de tendre des cordes de rappel le long du tablier penché, et qu’un vieux eut déclaré, après avoir écouté longtemps, la main sur le câble du nord, qu’il chantait bas mais qu’il chantait droit. Ils passèrent en file, la mule allégée au milieu, en se tenant à la rampe du sud, sur un plancher de travers où la pluie ruisselait vers le vide, et Aube, en passant, regarda le nœud à l’ancrage de l’ouest, sa cordelette grise sur la grosse corde noire, et elle pensa qu’elle ne saurait jamais plus, maintenant, si elle avait vécu ce jour-là, parce qu’il n’y aurait pas de nœud pour le dire. Puis elle pensa qu’elle le saurait quand même. Puis elle passa.",
     "mentions": []
    },
    {
     "id": "c4-b67",
