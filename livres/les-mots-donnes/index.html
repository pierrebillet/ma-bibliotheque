     "text": "Il y avait des gens dans les carrés, courbés, et des gens sur le seuil des maisons, et des brebis. Les gens levèrent la tête quand la sonnaille de Vergogne tinta, et ils regardèrent Aurèle, et Garance derrière lui, et le fils de Maison, et le manteau gris au col de goudron, et la fille au poignet nu ; et ils firent des signes. Pas des saluts. Des signes des mains, brefs, précis, adressés à Aurèle, qui répondait de même, et Aube vit une vieille femme éclater de rire sans un son en regardant Garance, et lui montrer quelque chose du doigt, et Garance rougir jusqu’aux oreilles.",
     "mentions": [
      "aurele-malaurie",
      "bastien-dautry"
     ]
    },
    {
     "id": "c8-b05",
     "text": "— Elle dit que j’ai grossi, dit Garance.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b06",
     "text": "— Tu comprends ?",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "— Celui-là, oui. Ce n’est pas du parler-nœud, c’est du parler-mains. Ils ont les deux. Le parler-nœud, c’est pour ce qui doit rester : les lettres, les comptes, les choses qu’on se dit d’une année sur l’autre. Les mains, c’est pour aujourd’hui. Et la bouche, c’est pour ce qui reste de la bouche. Il ne leur reste pas beaucoup.",
     "mentions": [
      "le-parler-noeud"
     ]
    },
    {
     "id": "c8-b08",
     "text": "Il y avait des enfants, aussi, une dizaine, qui couraient entre les maisons et criaient, et qui étaient les seuls à crier. Aube comprit pourquoi en les regardant : ils avaient tous leurs mots. On ne donnait pas avant quinze ans. Alors les enfants de Haut-Charme parlaient pour tout le village, à tue-tête, et le village les écoutait comme on écoute de la musique, sans leur répondre autrement qu’avec les mains, et les enfants s’en accommodaient parfaitement.",
     "mentions": [
      "haut-charme"
     ]
    },
    {
     "id": "c8-b09",
     "text": "La doyenne s’appelait Ancelle. On les mena à elle, dans la grande grange, parce que c’était là qu’on recevait, et Aube vit, en entrant, ce que c’était qu’une grange tenue.",
     "mentions": [
      "mere-ancelle"
     ]
    },
    {
     "id": "c8-b10",
     "text": "Les poutres du toit étaient de mélèze, énormes, noircies, et sur chacune, tout au long, courait une corde ; et sur chaque corde, à touche-touche, sur toute sa longueur, il y avait des cordelettes. Des centaines. Nouées d’une demi-clé, l’une contre l’autre, si serrées qu’on ne voyait plus la corde dessous ; des cordelettes grises de vieillesse, brunes, blondes, neuves, chacune avec ses propres nœuds de vie, ses naissances et ses dettes ; des générations de Haut-Charme pendues au toit de leur grange par le poignet. On aurait dit une fourrure. On aurait dit un toit qui avait des cheveux.",
     "mentions": [
      "la-cordelette",
      "la-veillee"
     ]
    },
    {
     "id": "c8-b11",
     "text": "— Trois cents hivers de neige, dit Garance à voix basse. Le toit n’a jamais bougé. Ils reprennent une poutre par automne, à tour de rôle, cinq poutres, tous les cinq ans chacune. Le soir de la reprise, tout le village vient avec sa cordelette. C’est la veillée.",
     "mentions": [
      "la-veillee",
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b12",
     "text": "Séverin ne dit rien. Il était entré derrière eux, et il s’était arrêté sous la première poutre, la tête levée, et il regardait les cordelettes comme il avait regardé le nœud de gabare à Pont-Sauvage et les petits anneaux de Sombreval : en homme qui connaît ses cordes et qui en trouve une qu’il ne connaît pas, et qui commence à en trouver beaucoup.",
     "mentions": [
      "pont-sauvage",
      "sombreval"
     ]
    },
    {
     "id": "c8-b13",
     "text": "Mère Ancelle était assise près du feu, au fond, sur un banc bas, et elle devait avoir quatre-vingts ans, et elle avait les mains les plus nouées qu’Aube ait jamais vues, des mains qui ressemblaient à des racines de pruniers, et des yeux clairs de fille. Elle ne se leva pas. Elle fit un signe à Aurèle, un autre à Garance, qui s’assit à ses pieds sans qu’on le lui dise ; elle regarda longuement Bastien, et le manteau de Séverin, et ne fit aucun signe pour eux. Puis elle tendit la main vers Aube, paume ouverte.",
     "mentions": [
      "aurele-malaurie",
      "bastien-dautry"
     ]
    },
    {
     "id": "c8-b14",
     "text": "Aube y posa l’œuf de ficelle.",
     "mentions": []
    },
    {
     "id": "c8-b15",
     "text": "La vieille le déroula sur ses genoux. Elle le lut des doigts, les yeux fermés, comme Hersende ; à mi-longueur elle s’arrêta, rouvrit les yeux, et regarda Aube, et il y avait dans ce regard quelque chose qui n’était pas pour la fille devant elle mais pour quelqu’un d’autre, très loin, très longtemps avant. Elle reprit. Elle finit. Elle roula la ficelle et la garda dans ses mains, fermée.",
     "mentions": [
      "le-parler-noeud",
      "hersende"
     ]
    },
    {
     "id": "c8-b16",
     "text": "Puis elle parla. C’était, comprit Aube, la phrase du jour ; elle en avait une, et elle la dépensait maintenant, et sa voix était rauque et exacte comme une corde qu’on n’a pas touchée depuis des années et qui chante encore juste.",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "— Celle-ci est à moi, dit Mère Ancelle. Apprenez-lui la veillée. Je tiens jusqu’à la lune.",
     "mentions": [
      "hersende",
      "la-veillee"
     ]
    },
    {
     "id": "c8-b18",
     "text": "Elle se tut. Elle avait dit trois phrases, et Aube vit à sa bouche qu’elle en avait payé deux d’avance sur les jours suivants, et qu’elle ne le regrettait pas.",
     "mentions": []
    },
    {
     "id": "c8-b19",
     "text": "Le silence dura. Le feu craquait. Garance, aux pieds de la vieille, avait baissé la tête.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b20",
     "text": "— « Je tiens », dit Aube.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "Personne ne répondit.",
     "mentions": []
    },
    {
     "id": "c8-b22",
     "text": "— Elle m’a dit « tiens ». Sur le bat-flanc. Je croyais qu’elle me disait de prendre la lampe.",
     "mentions": [
      "la-corderie"
     ]
    },
    {
     "id": "c8-b23",
     "text": "— Elle te disait les deux, dit Séverin à voix basse. Elle n’avait qu’un mot pour les deux.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c8-b24",
     "text": "— Elle tient la Levée. Avec quoi ? Elle n’a plus de brin dans la corde, il est de l’an 274, il est mort. Elle a douze mots. Elle a douze…",
     "mentions": [
      "la-levee",
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c8-b25",
     "text": "Elle s’arrêta. Elle avait compris, et elle attendait que quelqu’un le dise à sa place, comme sur la crête devant Aymon, et cette fois non plus personne ne le dit, et elle le dit elle-même.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c8-b26",
     "text": "— Elle monte sur la Levée. Chaque soir. Avec une ficelle à elle, elle en a toujours, elle file encore. Elle fait un nœud sur la corde. Un petit. Et elle donne un mot. Un des douze. Pour que ça tienne un jour de plus. Le temps que je revienne.",
     "mentions": []
    },
    {
     "id": "c8-b27",
     "text": "— Oui, dit Garance sans lever la tête.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b28",
     "text": "— Tu le savais.",
     "mentions": []
    },
    {
     "id": "c8-b29",
     "text": "— Je le sais depuis le col. Aurèle me l’a noué, c’est le nœud que je ne savais pas lire. Je ne pouvais pas te le dire avant qu’on soit sûrs, la fileuse. Et je n’avais pas envie.",
     "mentions": [
      "le-col-de-la-deliee",
      "aurele-malaurie"
     ]
    },
    {
     "id": "c8-b30",
     "text": "Aube compta. Elle ne pouvait pas ne pas compter. Ils étaient partis depuis six jours. Hersende avait douze mots le soir du bat-flanc ; peut-être en avait-elle gardé un ou deux pour finir ; peut-être pas. Six nœuds. Six mots. Il en restait six, ou cinq, ou quatre. Et le dernier, celui qu’elle gardait comme une pièce dans un ourlet, Aube savait lequel ce serait, et elle savait aussi qu’on ne pouvait rien y faire d’ici, rien du tout, sinon être en bas avant qu’il n’y en ait plus.",
     "mentions": [
      "la-corderie",
      "hersende"
     ]
    },
    {
     "id": "c8-b31",
     "text": "— Il faut redescendre, dit-elle.",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "— Demain, dit Garance. On ne repasse pas le col ce soir, et ce soir il y a la veillée. Ils la font pour toi. Ancelle a dit d’apprendre. Alors tu apprends, et demain tu descends, et tu sauras ce que tu descends porter. Sinon tu auras fait le chemin pour rien.",
     "mentions": [
      "la-veillee",
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b33",
     "text": "La veillée se fit à la nuit, sur le pont.",
     "mentions": []
    },
    {
     "id": "c8-b34",
     "text": "Ce n’était pas la grange qu’on reprenait cette année-là ; c’était le Pont de Charme, le petit pont de cordes qui enjambait les Fontaines à l’entrée du village, dix pas de long, si bas qu’on aurait pu le passer à gué, et qu’on tenait depuis toujours parce qu’un pont qui ne bouge pas sous les pieds des enfants est une chose qu’on ne discute pas, à Haut-Charme. Sa corde maîtresse, une corde de chanvre grosse comme un bras, courait d’une rive à l’autre sous le tablier et, comme les poutres de la grange, elle avait des cheveux : des cordelettes à touche-touche, mais moins, une seule rangée, et il y avait un espace nu, à un bout, long comme un avant-bras, où la corde était à vif.",
     "mentions": [
      "haut-charme",
      "la-cordelette"
     ]
    },
    {
     "id": "c8-b35",
     "text": "— La reprise de l’an dernier a été courte, dit Garance. Deux vieux sont morts dans l’hiver. On ne délie pas leurs cordelettes, ici : elles sont dans le pont, elles y restent, on les laisse tenir. Mais on n’a pas déplacé les autres, et le pont chante bas de ce côté. Alors on ajoute. Ceux qui veulent.",
     "mentions": [
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c8-b36",
     "text": "Tout le village était là. Ils étaient venus avec des torches de résine, et avec leurs cordelettes dénouées du poignet, dans la main, et les enfants derrière, à qui on avait dit de se taire, et qui se taisaient pour la première fois de la journée, les yeux énormes. Aurèle se tenait au bout nu de la corde. C’était lui, cette année, le maître de veillée ; il avait ôté son chapeau. Il ne dit rien. Il fit un signe.",
     "mentions": [
      "aurele-malaurie"
     ]
    },
    {
     "id": "c8-b37",
     "text": "Le premier fut une vieille femme, celle qui avait dit que Garance avait grossi. Elle s’agenouilla sur la rive, passa sa cordelette autour de la corde maîtresse, à ras de la dernière des anciennes, et fit la demi-clé, simple, une boucle et le bout dessous, le nœud d’enfant que Séverin avait montré à Aube dans les ruines. Aurèle se pencha. Il vérifia le nœud des doigts, sans un mot, tira dessus, hocha la tête. Alors la vieille approcha la bouche du nœud, et on ne l’entendit pas, et elle serra.",
     "mentions": [
      "la-veillee",
      "garance-malaurie"
     ]
    },
    {
     "id": "c8-b38",
     "text": "Aube ne vit rien changer. On ne voyait jamais rien changer ; c’était cela, le nœud qui tient. Mais le pont, sous les torches, fit un son : un tout petit son, une note qui montait d’un cheveu, comme une corde qu’on accorde.",
     "mentions": [
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c8-b39",
     "text": "Le deuxième s’agenouilla. Puis le troisième. Il y en eut vingt-huit ; Aube compta, parce qu’elle comptait, et parce qu’elle vit qu’ils n’étaient pas tous là : sur les quarante du village, une douzaine étaient restés debout avec leur torche, en retrait, la cordelette encore au poignet, et personne ne les regardait, personne ne leur faisait signe, personne ne les comptait. Ils tenaient les torches. C’était leur part de ce soir-là.",
     "mentions": [
      "la-cordelette"
     ]
    },
    {
     "id": "c8-b40",
     "text": "— Ceux-là ne donnent pas, dit-elle à Garance.",
     "mentions": []
    },
    {
     "id": "c8-b41",
     "text": "— Pas cette année. L’an prochain, peut-être. Ou jamais. On ne demande pas. Un mot qu’on demande est déjà à moitié pris, et un mot pris ne tient rien. Tu as vu Sombreval.",
     "mentions": [
      "sombreval"
     ]
    },
    {
     "id": "c8-b42",
     "text": "— Et s’il y en a un qui ment ? Un qui donne un mot qu’il n’a pas vécu, pour faire comme les autres ?",
     "mentions": []
    },
    {
     "id": "c8-b43",
     "text": "— Sa demi-clé ne tient rien, et le pont ne monte pas d’un cheveu, et il le sait, et Aurèle le sait, et personne ne dit rien, et il reprend sa cordelette. Ça arrive. Ce n’est pas une chaîne, la fileuse. C’est vingt-huit nœuds côte à côte. Il y en a un qui ne tient pas, il y en a vingt-sept qui tiennent. Il faut qu’ils mentent tous pour que le pont tombe. Tressaille a écrit une page sur un maillon de bois. Ici, il n’y a pas de maillons. Il n’y a que des nœuds.",
     "mentions": [

     ]
    },
    {
     "id": "c8-b44",

     "text": "Il ne demanda rien à personne. Il avait à la main sa cordelette, la sienne, celle des fils de Maison, lourde comme un chapelet, avec dedans dix-huit ans de fêtes et de deuils et un nœud qu’Aube reconnut sans le connaître, plus gros que les autres, serré à l’étrangler : l’an 308. Il s’agenouilla sur la rive de Haut-Charme, dans la boue des Fontaines, avec son manteau trop neuf, et passa la cordelette autour de la corde, et fit la demi-clé, et sa main tremblait, et Aurèle se pencha, vérifia, tira, et hocha la tête.",

    },
    {
     "id": "c8-b58",
     "text": "Alors Aube s’assit sur la rive, dans la boue, à la lumière des torches, et fila sa troisième cordelette en huit jours. Personne ne la regarda faire ; à Haut-Charme, une fille qui file n’est pas un spectacle. Elle fila entre le pouce et l’index, en tordant, en tirant, en soufflant sur le fil pour qu’il se couche, et quand ce fut fini elle avait deux avant-bras de ficelle blonde, égale, la meilleure qu’elle eût jamais filée, parce que le chanvre était bon et qu’elle n’avait plus rien d’autre dans les mains que ce qu’elle faisait.",
     "mentions": [
      "la-cordelette"
     ]
    },

     "id": "c8-b59",
     "text": "Elle se leva pour aller au pont. Il restait une place, au bout de la rangée neuve, un doigt de corde nue.",

  {

   "visualDescription": "Plan large nocturne sur un lac de montagne immobile, plaque d’argent sous une lune presque pleine ; une gabare à fond plat avance au milieu, un gabarier à la perche, une voile molle, et à bord une mule debout, une femme, un homme au chapeau, Aube, Bastien et Séverin ; de part et d’autre, des saules debout dans l’eau jusqu’à mi-tronc, des toits de cabanes affleurant ; au fond, en travers, la longue muraille noire et droite de la Levée qui coupe le ciel, et à son extrémité gauche un escalier taillé où monte une file de centaines de petites lanternes ; au-dessus de la digue, une lueur de ville.",
   "blocks": [
    {
     "id": "c9-b01",
     "text": "Ils redescendirent à six, en comptant la mule, et la mule comptait double, parce qu’Aurèle marchait à côté d’elle et qu’on ne les séparait plus.",
     "mentions": [

     ]
    },
    {
     "id": "c9-b02",
     "text": "Il était venu sans qu’on le lui demande. Le matin, à l’heure où les enfants de Haut-Charme recommençaient à crier, il s’était trouvé devant la grange avec un sac de laine brune, son chapeau, et ses ficelles à la ceinture, et il avait fait un signe à Ancelle, et Ancelle avait fait un signe en retour, et c’était tout. Garance n’avait rien dit. Elle avait chargé la mule, plus lourde qu’à la montée, parce que Haut-Charme leur avait donné ce qu’il avait, du lard, de la miche noire, une tomme, et un rouleau de chanvre peigné, blond, gros comme une cuisse, qu’Ancelle avait fait porter sans un mot et qu’Aube avait compris avant tout le monde : ce n’était pas pour vendre. C’était pour filer. Une ville n’a pas assez de cordelettes ; il faudrait en faire.",

      "la-cordelette"
     ]
    },
    {
     "id": "c9-b03",
     "text": "— Il vient pour toi ? avait demandé Bastien à Garance, en désignant Aurèle du menton.",

     ]
    },
    {
     "id": "c9-b04",
     "text": "— Il vient pour vérifier les nœuds. C’est le maître de veillée. Il faut quelqu’un qui tire sur chaque demi-clé avant qu’on donne, sinon on donne pour rien. Il n’y a personne à Tressaille qui sache faire ça.",
     "mentions": [

      "tressaille"
     ]
    },
    {
     "id": "c9-b05",
     "text": "— Séverin sait.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c9-b06",
     "text": "— Séverin sait depuis hier soir. Aurèle sait depuis quinze ans. Et puis il vient pour moi. Ne me fais pas dire les deux, fils de Maison, j’ai des mots à garder pour quand ils serviront.",
     "mentions": [
      "garance-malaurie",
      "aurele-malaurie"
     ]
    },
    {
     "id": "c9-b07",
     "text": "Le col fut vite passé. Le vent d’ouest tenait, la harpe chantait, on la traversa dans le soleil, entre des cordes qui brillaient sans givre, et Aurèle s’arrêta à la dernière, celle qu’il accordait quand ils étaient arrivés, et posa la main dessus, et la garda là un instant, la tête penchée. Puis il la lâcha et descendit sans se retourner, et Aube, qui savait maintenant ce que c’était que de laisser derrière soi quelque chose qu’on a tenu, ne regarda pas son visage.",
     "mentions": [
      "le-col-de-la-deliee"
     ]
    },
    {
     "id": "c9-b08",
     "text": "Le brouillard, en dessous, s’était levé. Toute la vallée de la Tende était là, ouverte, verte et grise, dégringolant vers le sud en gorges superposées, et au fond, très loin, une tache d’étain qui était la Retenue, et Aube la vit d’un coup et sentit sa gorge se fermer : de si haut, le lac était rond. Il n’avait pas la forme longue qu’elle avait suivie à pied. Il avait débordé. Il avait bu ses rives, et de là-haut on voyait, à sa lisière du sud, une ligne droite, minuscule, qui le barrait comme un trait de plume : la Levée. Et rien, derrière. On ne voyait pas Tressaille. On ne voyait que l’eau, et le trait, et l’espace où la ville devait être.",

      "la-retenue",
      "la-levee"
     ]
    },
    {
     "id": "c9-b09",
     "text": "— Elle chante encore, dit Séverin à côté d’elle. Regarde le trait. S’il avait lâché, tu verrais du blanc dessous. Il n’y a pas de blanc.",
     "mentions": []
    },

     "text": "— Tu vois ça d’ici ?",
     "mentions": []
    },
    {
     "id": "c9-b11",
     "text": "— Non. Mais je sais à quoi ça ressemblerait.",
     "mentions": []
    },
    {
     "id": "c9-b12",
     "text": "Malebosse au soir. Firmin les attendait au cabestan, comme s’il n’avait pas bougé, et il regarda Aurèle descendre de la nacelle avec une expression qu’Aube ne comprit pas d’abord, puis comprit : c’était l’expression d’un homme qui n’avait pas vu quelqu’un descendre des Hauts depuis très longtemps. Il fit passer la mule sous la nacelle sans un mot, sur la corde de sangle où le nœud à deux ficelles tenait toujours, et cette fois personne ne parla à la bête, et la bête ne broncha pas, comme si elle avait compris qu’on n’avait plus le temps.",
     "mentions": [
      "la-benne",
      "malebosse"
     ]
    },
    {
     "id": "c9-b13",
     "text": "— La ficelle du compagnon est partie, dit Firmin à Aube quand ils furent tous sur la rive d’ombre. Avec le chanvre de la veille. La gabare l’a eue à Pont-Sauvage. Elle est en bas depuis deux jours.",
     "mentions": [

    },

     "text": "— Bien.",
     "mentions": []
    },
    {
     "id": "c9-b15",
     "text": "— Vous redescendez par la gorge ?",
     "mentions": []
    },
    {
     "id": "c9-b16",
     "text": "— Par où voulez-vous qu’on redescende.",
     "mentions": []
    },
    {
     "id": "c9-b17",
     "text": "Il leva le bras vers le sud, vers le chemin de la rive d’ombre qui plongeait dans les Gorges, et il fit son geste, la main tendue vers ce qui n’était pas ici, et pour la première fois Aube y entendit autre chose qu’une plaisanterie.",
     "mentions": []

     "mentions": [

     "text": "L’eau était haute.",
     "mentions": []
    },

     "id": "c9-b20",
     "text": "Ils s’en aperçurent une lieue plus bas, à l’aube du lendemain, quand le chemin de la rive d’ombre, qui la veille encore courait à dix pas au-dessus de la Tende, entra dans la Tende. Il n’y avait pas de bord. La rivière brune, énorme, épaisse, sans écume, avait monté jusqu’à la corniche et la léchait, et par endroits la couvrait d’un doigt d’eau qui courait vers l’aval plus vite qu’un homme, et il fallait marcher dedans, une main sur la paroi, l’autre sur le bât de la mule, en sentant les galets rouler sous les pieds. La Tende ne grondait plus. Elle sifflait. Elle charriait des arbres entiers qui passaient à hauteur de leurs genoux, lents et tournants, avec des oiseaux dessus.",

    },
    {
     "id": "c9-b21",
     "text": "À Sombreval, les pruniers avaient les pieds dans l’eau, et leurs pétales flottaient en bancs blancs qui descendaient vers le lac. Les petits anneaux étaient sous l’eau. Aube regarda l’endroit sans s’arrêter.",

    },
    {
     "id": "c9-b22",
     "text": "À Pont-Sauvage, la Grande Traversée chantait toujours, penchée, avec un nœud de gabare à son ancrage de l’ouest et une ficelle grise dessus, mais on ne la passait plus : la Fosse, dessous, n’était plus une fosse. La Tende l’avait remplie jusqu’à trente pas du tablier, et elle y tournait sur elle-même, brune, avec un bruit de meule, et sur la place, les gens du village faisaient des paquets. Ils partaient vers les hauteurs, sur les terrasses, avec leurs enfants et leurs chèvres, comme on le faisait à chaque grande Fonte de mémoire d’homme ; mais l’aubergiste dit qu’il n’avait jamais vu la Fosse pleine, ni son père, ni le père de son père, et qu’il ne resterait pas voir ce qu’elle faisait ensuite.",

     ]
    },
    {
     "id": "c9-b23",
     "text": "— Il y a une gabare à la tête du lac, dit-il. Depuis deux jours. Une gabare de la Corderie, avec deux hommes, qui attend. Ils ont dit qu’ils attendaient une fileuse.",

     "text": "— Ce n’est pas ma ficelle, dit-il. Ma ficelle disait où tu allais. Pas de t’attendre.",
     "mentions": []
    },
    {
     "id": "c9-b26",
     "text": "— Alors c’est lui.",
     "mentions": []

    {
     "id": "c9-b27",
     "text": "— C’est lui. Il t’a envoyé une gabare. Il veut que tu reviennes vivante, il l’a toujours voulu, je te l’ai dit sur le pont. Ce que tu diras sur la Levée, ça, il n’en sait rien, et il envoie une gabare quand même.",
     "mentions": [
      "la-levee"
     ]
    },
    {
     "id": "c9-b28",
     "text": "Elle pensa à l’homme qui n’avait plus le mot pour s’excuser et qui montrait le lac d’un geste qui ne finissait pas, et elle ne sut pas ce qu’elle en pensait, et pour une fois elle ne le rangea nulle part.",
     "mentions": [

     ]
    },
    {
     "id": "c9-b29",
     "text": "La tête du lac n’existait plus. Là où la Tende se jetait dans la Retenue avec un bourrelet d’écume, dix jours plus tôt, il n’y avait plus qu’une nappe brune sans bord, où les pins de la rive trempaient jusqu’aux premières branches et où la gabare était amarrée à un arbre, parce que les pierres d’amarre étaient à trois pieds sous l’eau. Deux gabariers dessus, en capes de goudron. L’un des deux avait un bras bandé. Il regarda Aube monter, et la reconnut, et ne dit rien, et elle reconnut le bandage. Le nœud de plaie de Séverin. « Tard ». Il tenait encore.",

      "la-tende",
      "le-noeud-qui-tient"
     ]
    },
    {
     "id": "c9-b30",
     "text": "Ils embarquèrent tout : quatre gens, un muet, un rouleau de chanvre et une mule, qu’on fit monter par une planche et qui se laissa faire avec une résignation nouvelle, et resta debout au milieu du pont, les quatre pattes écartées, à regarder l’eau d’un air de mépris. La gabare largua l’arbre. Le lac les prit.",
     "mentions": []
    },
    {
     "id": "c9-b31",
     "text": "Ce fut la nuit sur la Retenue qu’Aube n’oublia pas non plus, après le col.",

      "le-col-de-la-deliee"
     ]
    },
    {
     "id": "c9-b32",
     "text": "Le vent était tombé. La gabare descendait le lac à la perche et à la voile molle, lentement, au milieu, parce que les rives n’étaient plus des rives : c’étaient des forêts noyées, des saules debout dans l’eau jusqu’à mi-tronc, des toits de cabanes de pêcheurs qui affleuraient, des piquets. La lune se leva sur les Aiguilles, presque pleine, à un doigt de l’être, et mit sur toute cette eau une plaque d’argent que la gabare fendait sans bruit, et les saules noyés y faisaient des ombres immobiles, et de temps en temps un poisson sautait, ou une branche craquait sous l’eau, et c’était tout. La Retenue ne bougeait pas. Elle était pleine. Elle était pleine comme un verre qu’on a rempli à ras et qu’on n’ose plus porter, et elle attendait.",
     "mentions": []
    },
    {
     "id": "c9-b33",
     "text": "Et devant, au bout du lac, au bout de la plaque d’argent, la corde chantait.",
     "mentions": [
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c9-b34",
     "text": "On l’entendait de deux lieues. Aube ne l’avait jamais entendue de si loin, ni de ce côté, ni sur l’eau ; c’était la même note grave que dans la Salle, celle qu’on apprenait à ne plus entendre avant son nom, mais elle venait de devant, sur l’eau, et l’eau la portait, et elle était fausse. Pas basse. Fausse. Une note qui n’était pas à sa place et qui le savait, qui tirait vers le bas et remontait et retombait, et qui faisait mal aux dents.",

     ]
    },
    {
     "id": "c9-b35",
     "text": "Aurèle, debout à l’avant, la tête penchée, écoutait. Au bout d’un long moment il tira une ficelle de sa ceinture et noua, vite, et la tendit à Garance, qui la lut, lentement, et cette fois lut jusqu’au bout.",
     "mentions": [

     ]

    {

     "mentions": []
    },
    {
     "id": "c9-b37",
     "text": "— Combien ?",
     "mentions": []
    },
    {
     "id": "c9-b38",
     "text": "Aurèle leva une main. Il replia les doigts un par un. Il en resta deux. Puis il hésita, et en replia un.",

    {
     "id": "c9-b39",
     "text": "— La lune est demain, dit Séverin.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c9-b40",
     "text": "— Je sais quand est la lune.",
     "mentions": []
    },
    {
     "id": "c9-b41",
     "text": "— Il faut que tu saches autre chose. Les gabariers me l’ont dit à l’embarquement. Maître Aymon a fait lire au Conseil, il y a trois jours, quand ma ficelle est arrivée, qu’il monterait lui-même sur la Levée à la lune de la Fonte, si la fileuse n’y était pas, et qu’il donnerait tout ce qui lui reste. Il a fait filer un brin dès le lendemain de ton départ, un brin de dix jours, tordu par tous les compagnons à la fois, pour qu’il ait de quoi coucher son âme dans la corde. Ça tiendra une saison, il l’a dit lui-même. Il le fera quand même. Il l’a dit devant la Prévôte et les neuf Maisons, et il l’a écrit dans le Registre, à la date, avec l’heure.",
     "mentions": [
      "maitre-aymon",
      "la-grande-reprise"
     ]
    },
    {
     "id": "c9-b42",
     "text": "Aube regarda la note fausse au bout du lac. Elle ne dit rien pendant longtemps.",
     "mentions": []
    },
    {
     "id": "c9-b43",
     "text": "— Il l’a écrit d’avance, dit-elle enfin. Comme moi.",
     "mentions": []
    },
    {
     "id": "c9-b44",
     "text": "— Comme toi.",
     "mentions": []
    },
    {
     "id": "c9-b45",
     "text": "— Et il sait que je viens.",
     "mentions": []
    },
    {
     "id": "c9-b46",
     "text": "— Il sait que tu viens. Il ne sait pas ce que tu apportes. Il croit que tu apportes une légende de Sombreval et une fille qui a décidé de ne pas mourir, et il a raison sur la fille et il a la page sur Sombreval, et il a préparé sa corde pour ne pas laisser la ville à une légende. C’est un homme qui ne parie pas. Il l’a dit avec d’autres mots, il n’a plus « parier ». Il a dit : « je ne laisse pas la Basse sur un mot que je n’ai pas entendu ».",
     "mentions": [
      "tressaille",
      "les-mots-donnes"
     ]
    },
    {
     "id": "c9-b47",
     "text": "Bastien, assis sur le bord, les pieds au-dessus de l’eau d’argent, se retourna.",
     "mentions": [
      "bastien-dautry"
     ]
    },
    {
     "id": "c9-b48",
     "text": "— Alors ce n’est plus la Fonte, dit-il. La course. Ce n’est plus contre l’eau.",
     "mentions": [
      "la-fonte"
     ]
    },
    {
     "id": "c9-b49",
     "text": "— Non, dit Aube. C’est contre lui.",
     "mentions": []
    },
    {
     "id": "c9-b50",
     "text": "Elle regarda la corde fausse, et elle pensa qu’il n’y avait pas au monde de chose plus difficile que d’arriver à temps pour empêcher un homme qui a raison de payer ce qu’il croit devoir, et qu’elle allait le faire quand même, et qu’elle ne savait pas encore avec quoi.",
     "mentions": []
    },
    {
     "id": "c9-b51",
     "text": "Il y avait un mot dans sa bouche. Le neuf, celui du col. Elle le tourna, et le garda.",
     "mentions": [
      "le-col-de-la-deliee"
     ]
    },
    {
     "id": "c9-b52",
     "text": "La Levée apparut à la troisième heure de la nuit.",
     "mentions": []
    },
    {
     "id": "c9-b53",
     "text": "Elle sortit de l’argent d’un coup, à cinq cents pas, comme un mur qui aurait marché vers eux : la longue crête noire, droite, coupant le lac et le ciel, et dessous, jusqu’à un doigt de la crête, l’eau. La marque était sous l’eau. Aube la chercha, la ligne sombre et luisante qu’elle avait vue dix jours plus tôt du rivage, à trois hauteurs d’homme au-dessus du lac, et elle n’était plus là ; le lac était dessus, il touchait presque la rigole, il léchait la pierre de la crête à hauteur de la Maîtresse-Corde, et la corde chantait faux à dix pas d’eux, si fort que Vergogne baissa les oreilles.",
     "mentions": [
      "la-levee",
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c9-b54",
     "text": "Il y avait des lumières sur la crête. Des lanternes, une dizaine, à l’ancrage de l’ouest, qui bougeaient. Et au-delà de la Levée, de l’autre côté, invisible d’ici, là où la ville devait être, il y avait dans le ciel une lueur qui n’était pas la lune.",
     "mentions": []
    },
    {
     "id": "c9-b55",
     "text": "— Ils évacuent la Basse, dit Séverin. Regarde l’escalier.",
     "mentions": [
      "tressaille",
      "severin"
     ]
    },
    {
     "id": "c9-b56",
     "text": "Elle regarda. À l’extrémité de l’ouest, là où la Levée se soudait au rocher, l’escalier des Lavandières montait de la ville vers la crête, cent soixante marches, et sur les cent soixante marches, du bas jusqu’en haut, il y avait des lumières. Une file de lumières qui montait, lentement, sans s’arrêter, des centaines de petites flammes qui tremblaient, une par famille, une par maison des onze cents maisons sous la marque, et qui passaient la crête et disparaissaient de l’autre côté, vers la Haute, avec ce qu’elles pouvaient porter. On ne les entendait pas. On voyait la file. Elle ressemblait, pensa Aube, à un fil qu’on tire d’une nappe et qui n’en finit pas de venir.",
     "mentions": [
      "tressaille"
     ]
    },
    {
     "id": "c9-b57",
     "text": "La gabare toucha la pierre de l’ancrage de l’ouest sous les lanternes, et un des gabariers cria, et une voix d’en haut répondit, et les lanternes se penchèrent par-dessus la crête, et Aube leva les yeux vers elles, vers la corde qui chantait faux à portée de main, vers la ville qui montait en file dans la nuit, et elle mit le pied sur la Levée.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-10",
   "number": 10,
   "title": "Le registre",
   "image": "images/chapter-10.webp",
   "alt": "Dans la Salle des Cordes inondée, sur des planches, trente fileuses tiennent des lampes en silence autour d’Aube, assise près d’une forme couverte d’une couverture de chanvre, qui délie une cordelette nœud après nœud.",
   "visualDescription": "Intérieur nocturne : la longue salle de corderie a de l’eau au sol, des planches posées dessus ; trente jeunes fileuses debout ou assises sur les bat-flanc tiennent des lampes à huile, immobiles, visages graves ; au centre, sur un banc bas, une forme très petite sous une couverture de chanvre, dont dépasse un poignet ; Aube, assise à côté, tient une longue cordelette grise et en défait un nœud, tête baissée ; écheveaux suspendus au-dessus ; lumière chaude des lampes, reflets dans l’eau noire.",
   "blocks": [
    {
     "id": "c10-b01",
     "text": "Il y avait douze nœuds sur la corde, et elle les compta avant de voir les visages.",
     "mentions": [
      "la-maitresse-corde",
      "hersende"
     ]
    },
    {
     "id": "c10-b02",
     "text": "Ils étaient là, à un pas de la Pierre d’Ancre de l’ouest, sur le dos gris de la Maîtresse-Corde, dans la rigole où le lac venait maintenant lécher la pierre : douze petits nœuds de ficelle grise, à touche-touche, alignés comme des perles sur un fil, chacun de la taille d’une noisette, chacun serré de la même main lente et exacte qu’Aube avait vue nouer une lettre sur un bat-flanc, dix jours plus tôt, à la lumière d’une lampe. Douze. Elle compta deux fois. Le compte tombait juste, pour la première fois depuis Haut-Charme, et c’était la pire chose qui lui fût jamais arrivée.",
     "mentions": [
      "haut-charme",
      "la-corderie"
     ]
    },
    {
     "id": "c10-b03",
     "text": "Elle posa la main dessus. La corde chantait faux sous sa paume, et dans le faux, tout près de sa peau, il y avait douze petites notes justes, très minces, comme des aiguilles dans un drap.",
     "mentions": []
    },
    {
     "id": "c10-b04",
     "text": "— Elle a fini ce soir, dit Maître Aymon.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c10-b05",
     "text": "Il se tenait de l’autre côté de la rigole, avec sa lanterne, son tablier de cuir, la clé au cou, et trois compagnons derrière lui qui ne disaient rien. Il avait l’air de ne pas avoir dormi depuis la Porte du Nord. Il regarda Aube, puis Séverin, puis le fils Dautry, puis la colporteuse, puis l’homme grand et maigre au chapeau qui descendait de la gabare avec un rouleau de chanvre sur l’épaule et qui regardait la corde comme on regarde une malade ; il regarda tout cela un par un, et ne posa aucune question, parce que la seule qui lui importait était devant lui, debout sur la Levée, vivante, avant la lune, par la porte.",
     "mentions": [
      "maitre-aymon",
      "la-levee"
     ]
    },
    {
     "id": "c10-b06",
     "text": "— Le douzième, dit Aube.",
     "mentions": []
    },
    {
     "id": "c10-b07",
     "text": "— Tu le sais.",
     "mentions": []
    },
    {
     "id": "c10-b08",
     "text": "— Je veux l’entendre.",
     "mentions": []
    },
    {
     "id": "c10-b09",
     "text": "Il ne discuta pas. Il dit, de sa voix qui portait deux cent vingt pas :",
     "mentions": []
    },
    {
     "id": "c10-b10",
     "text": "— « Aube. »",
     "mentions": []
    },
    {
     "id": "c10-b11",
     "text": "Le mot passa sur la crête, dans le vent du lac, et il n’y eut rien après. Aube garda la main sur les douze nœuds. Elle ne pleura pas. Elle n’avait plus le mot qui sert à demander qu’on vienne, et elle s’aperçut qu’à cet instant précis cela l’aidait, et elle en eut honte, et elle garda la main.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c10-b12",
     "text": "— Elle est descendue à la Salle, dit Aymon. Sur le banc des vieilles. Les fileuses sont avec elle. Elle a fait le douzième au coucher du soleil, et elle s’est assise contre la Pierre, et elle a regardé le lac, et quand nous sommes venus la relever elle ne se relevait plus. Elle n’avait pas… Il n’y avait pas de…",
     "mentions": [
      "la-corderie",
      "la-retenue"
     ]
    },
    {
     "id": "c10-b13",
     "text": "Il chercha. Il n’avait plus « mal », lui non plus, ou il ne l’avait jamais eu ; il fit un geste de la main, à plat, comme on lisse un drap.",
     "mentions": []
    },
    {
     "id": "c10-b14",
     "text": "— Elle était tranquille, dit-il.",
     "mentions": []
    },
    {
     "id": "c10-b15",
     "text": "— Vous l’avez laissée monter chaque soir.",
     "mentions": []
    },
    {
     "id": "c10-b16",
     "text": "— Je l’ai laissée. Elle avait plus de droit que moi sur cette corde, et je n’avais pas de mot pour le lui interdire, au sens propre. Elle m’a montré le premier nœud le soir de ton départ, et j’ai compris ce qu’elle faisait, et j’ai compté avec elle. Un nœud par soir, puis deux quand la Fonte a pris. Douze nœuds en neuf soirs. Elle t’achetait des jours. Tu en as pris dix.",
     "mentions": [
      "la-fonte"
     ]
    },
    {
     "id": "c10-b17",
     "text": "Ce n’était pas un reproche. Il ne disait jamais rien méchamment. Elle le haït une seconde pour cela, pleinement, et cela passa comme passe le vent sur l’eau.",
     "mentions": []
    },
    {
     "id": "c10-b18",
     "text": "— Je suis revenue par la porte, dit-elle. Avant la lune.",
     "mentions": []
    },
    {
     "id": "c10-b19",
     "text": "— Tu es revenue par la porte. Le Conseil siège à la première heure, à la Halle, si on peut encore appeler ça la Halle : la Basse dort dedans. Tu parleras. Je t’écouterai. J’écoute toujours, tu l’as vu. Et ce que je ferai ensuite est écrit dans le Registre, à la date de demain, avec l’heure. Je ne l’effacerai pas pour une nuit sur un lac.",
     "mentions": [
      "tressaille",
      "le-conseil-des-maisons"
     ]
    },
    {
     "id": "c10-b20",
     "text": "— Je sais ce qui est écrit. Séverin me l’a dit.",
     "mentions": [
      "severin"
     ]
    },
    {
     "id": "c10-b21",
     "text": "Aymon regarda Séverin. Séverin soutint le regard.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c10-b22",
     "text": "— Il fait bien son travail, dit Aymon. Il t’a ramenée vivante. Va voir la vieille, fileuse. On ne délie pas une cordelette à l’aube, on la délie la nuit, et il ne reste pas beaucoup de nuit.",
     "mentions": [
      "la-cordelette"
     ]
    },
    {
     "id": "c10-b23",
     "text": "Elle descendit les cent soixante marches à contre-courant.",
     "mentions": []
    },
    {
     "id": "c10-b24",
     "text": "La file des lanternes montait toujours, plus clairsemée, les derniers de la Basse, des vieux, des retardataires, une femme avec une chèvre sous le bras ; ils s’écartaient pour la laisser passer et la regardaient, et certains la reconnaissaient, et personne ne disait rien. En bas, la Basse était noire et vide et pleine d’eau : le Déversoir avait débordé, la Tende courait dans les ruelles à hauteur de cheville, et la Salle des Cordes avait de l’eau jusqu’au seuil. Dedans, sur la terre battue, on avait mis des planches. Les fileuses étaient là. Trente, toutes, debout ou assises sur les bat-flanc, avec des lampes, en silence, et sur le banc des vieilles, sous une couverture de chanvre, une forme très petite.",
     "mentions": [
      "la-corderie",
      "tressaille"
     ]
    },
    {
     "id": "c10-b25",
     "text": "Aube s’assit à côté d’elle. Elle ne souleva pas la couverture. Elle prit le poignet gauche de Hersende, qui dépassait, léger comme une branche, et dénoua la cordelette.",
     "mentions": [
      "hersende"
     ]
    },
    {
     "id": "c10-b26",
     "text": "C’était ce qu’on faisait. À Tressaille, quand quelqu’un mourait, les siens déliaient sa cordelette la nuit même, nœud après nœud, en disant à chaque nœud ce qu’il avait été ; et ce qu’on ne savait pas, on l’inventait, et quand tout était délié la cordelette était rendue au vent, et la personne avec. Les siens. Aube regarda les trente fileuses, et les trente fileuses la regardèrent, et il fut entendu sans un mot que les siens, c’était elle.",
     "mentions": [
      "la-cordelette",
      "tressaille"
     ]
    },
    {
     "id": "c10-b27",
     "text": "La cordelette de Hersende était longue et lourde. Aube commença par le bout du poignet, le plus récent, et remonta.",
     "mentions": []
    },
    {
     "id": "c10-b28",
     "text": "Le premier nœud était frais, serré, à peine goudronné par les doigts : dix jours. Elle sut ce qu’il était sans le savoir. « La nuit de la lampe », dit-elle à voix basse, et elle le délia. Puis un long espace lisse, sans rien, des années ; puis un nœud petit, double, tordu, qu’elle reconnut parce qu’Aurèle avait posé deux doigts dessus au col, sur une autre ficelle, et elle comprit que ce nœud-là était un nom, et que c’était le sien, et que dans le parler des Hauts c’était ainsi qu’on l’écrivait. « Aube, dit-elle. Dans une benne de chanvre. Le jour se levait. » Elle le délia. Ses mains ne tremblaient pas. Elle y veilla.",
     "mentions": [
      "la-benne",
      "le-col-de-la-deliee"
     ]
    },
    {
     "id": "c10-b29",
     "text": "Et avant ce nœud, un autre espace lisse, plus court ; et puis un nœud énorme, noir, dur comme du bois, gros comme une prune, serré à ne plus pouvoir être défait par des doigts humains, et Aube n’eut pas besoin qu’on lui dise : « La Reprise. An 274. Cent dix-sept. » Elle ne le délia pas tout de suite. Elle le tint dans sa paume, et il pesait ce qu’il pesait.",
     "mentions": []
    },
    {
     "id": "c10-b30",
     "text": "Puis, en remontant, des nœuds qu’elle ne connaissait pas, d’une forme différente, plus longs, plus lâches, avec des boucles : les nœuds des Hauts, ceux d’une fille née à Haut-Charme qui avait filé sa cordelette dans le chanvre de sa maison et l’avait nouée là-haut, dix-neuf ans, avant de descendre. Aube ne savait pas les lire. Elle inventa, comme on faisait. « Un hiver. Une brebis. Un pont. » Et le tout premier, à l’autre bout, au bout de la cordelette, le nœud de sept ans, un nœud d’enfant, maladroit, qu’une petite fille avait fait sous les yeux d’une vieille qui ne parlait déjà plus beaucoup, six jours de marche plus haut et soixante ans plus tôt : « Le filage. »",
     "mentions": [
      "haut-charme"
     ]
    },
    {
     "id": "c10-b31",
     "text": "Elle le délia. La cordelette de Hersende pendit entre ses doigts, lisse, grise, sans rien dessus, une ficelle. On aurait dû la rendre au vent. Aube la roula, et la mit dans sa chemise, contre le paquet vide où avait été l’œuf de ficelle, et personne, parmi les trente, ne dit que ce n’était pas ce qu’on faisait.",
     "mentions": [
      "la-cordelette",
      "hersende"
     ]
    },
    {
     "id": "c10-b32",
     "text": "Elle ouvrit la bouche. Il y avait un mot dedans, le neuf, celui du col, et il n’avait jamais été plus là, plus plein, plus inutile ; elle le tint sous la langue comme Hersende avait tenu le douzième, et ne le dit pas, et se leva.",
     "mentions": []
    },
    {
     "id": "c10-b33",
     "text": "Le Registre était sur la table de la réserve, ouvert.",
     "mentions": [
      "le-registre-des-mots-donnes"
     ]
    },
    {
     "id": "c10-b34",
     "text": "Elle n’avait pas demandé à le voir. Séverin l’avait ouvert avant elle, en revenant de la Levée ; il était debout devant, une plume à la main, et il écrivait, lentement, de sa belle écriture de compagnon, et il ne se retourna pas quand elle entra. Elle regarda par-dessus son bras.",
     "mentions": [
      "le-registre-des-mots-donnes",
      "severin"
     ]
    },
    {
     "id": "c10-b35",
     "text": "Douze lignes. De la main d’Aymon, une par soir, datées : « Hersende, compagnonne, nœud de reprise, Maîtresse-Corde, ancrage ouest. » Et le mot. « Oui. » « Non. » « Va. » « Tiens. » « Viens. » « Eau. » « Pain. » « Dors. » « Haut. » « Encore. » « Mal. » Et la douzième ligne, d’hier au soir, de la même main qui n’avait pas tremblé : « Aube. »",
     "mentions": [
      "la-maitresse-corde",
      "maitre-aymon"
     ]
    },
    {
     "id": "c10-b36",
     "text": "Et dessous, de la main de Séverin, l’encre pas sèche :",
     "mentions": []
    },
    {
     "id": "c10-b37",
     "text": "« Aube, fileuse, nœud d’amarre, câble nord de la Grande Traversée de Pont-Sauvage, tenu. » « Faim. »",
     "mentions": [
      "le-noeud-qui-tient",
      "pont-sauvage"
     ]
    },
    {
     "id": "c10-b38",
     "text": "« Aube, fileuse, et Séverin, compagnon, nœud d’amarre à deux âmes, corde de sangle de la benne de Malebosse, tenu. » « Peur. » « Froid. »",
     "mentions": [
      "la-benne",
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c10-b39",
     "text": "— Ça n’existe pas, dit-elle. Un nœud à deux âmes. Tu l’as dit toi-même.",
     "mentions": []
    },
    {
     "id": "c10-b40",
     "text": "— Ça existe depuis que je l’ai écrit. C’est à ça que sert le Registre. Il n’écrit pas ce qui doit être, il écrit ce qui a tenu.",
     "mentions": [
      "le-registre-des-mots-donnes"
     ]
    },
    {
     "id": "c10-b41",
     "text": "Il sécha la plume et referma le livre à moitié, la main dessus.",
     "mentions": []
    },
    {
     "id": "c10-b42",
     "text": "— Tu es écrite, dit-il. En noir, entre un gabarier et une amarre, comme tout le monde. Pas en rouge. Je te l’avais dit sur le pont, que je le ferais.",
     "mentions": []
    },
    {
     "id": "c10-b43",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c10-b44",
     "text": "— Alors ?",
     "mentions": []
    },
    {
     "id": "c10-b45",
     "text": "Elle regarda le livre fermé, le cuir noirci, la lanière. Elle pensa à la page blanche, plus loin, qui attendait toujours un nom en travers, et elle pensa qu’elle n’en voulait plus, et que ce n’était pas parce qu’elle avait peur, puisqu’elle n’avait plus le mot, mais parce qu’elle avait vu un toit avec des cheveux, et qu’on ne peut plus vouloir être seule sur une page après ça.",
     "mentions": [
      "les-mots-donnes"
     ]
    },
    {
     "id": "c10-b46",
     "text": "— Alors il faut que la ville ait ses cordelettes ce soir, dit-elle. Toutes. Et il faut que quelqu’un le dise au Conseil dans une heure avec des mots qui tiennent, et je n’en ai pas beaucoup, Séverin. J’en ai deux de moins qu’en partant.",
     "mentions": [
      "la-cordelette",
      "severin"
     ]
    },
    {
     "id": "c10-b47",
     "text": "— Tu en as un de plus. Je t’ai vue le tourner sur la gabare.",
     "mentions": []
    },
    {
     "id": "c10-b48",
     "text": "Elle ne répondit pas. Il était le seul à l’avoir vu, et il était de la Corderie, et elle s’aperçut qu’elle ne lui en voulait pas.",
     "mentions": [
      "la-corderie"
     ]
    },
    {
     "id": "c10-b49",
     "text": "La Halle sentait le sel, et la Basse.",
     "mentions": [
      "tressaille"
     ]
    },
    {
     "id": "c10-b50",
     "text": "Onze cents maisons dormaient là, ou ne dormaient pas ; on avait roulé les bannières des neuf Maisons pour faire de la place, et entre les piliers, sur les dalles où le sel brillait dans les joints, il y avait des couvertures, des enfants, des chèvres, des paquets, des vieilles assises très droites, et une odeur de laine mouillée et de fumée froide qui n’était pas celle de la Haute. La longue table de noyer était toujours là. Les neuf y siégeaient, gris, sans nuit ; Dame Ysabeau debout au pupitre, sans Charte cette fois ; Aymon à sa droite, son brin de dix jours, filé depuis la Porte du Nord, enroulé sur l’épaule comme un serpent pâle, parce qu’il ne l’avait pas quitté et ne le quitterait plus jusqu’à la lune. Et au bout de la table, là où l’on fait tenir ceux qui n’ont pas de siège, il y avait de la place pour cinq et une mule, et la mule était restée dehors.",
     "mentions": [
      "le-conseil-des-maisons",
      "ysabeau-dautry"
     ]
    },
    {
     "id": "c10-b51",
     "text": "— Fileuse, dit la Prévôte. Vous êtes revenue. Parlez.",
     "mentions": []
    },
    {
     "id": "c10-b52",
     "text": "Aube parla.",
     "mentions": []
    },
    {
     "id": "c10-b53",
     "text": "Elle ne raconta pas le chemin. Elle dit ce qu’elle avait vu, dans l’ordre où cela servait : un nœud de gabare avec un mot dedans qui tenait quatre cents pas de pont ; un nœud à deux âmes, avec deux mots, qui tenait une mule au-dessus du vide, et le compagnon qui l’avait fait était là et pouvait le dire ; une grange, à Haut-Charme, dont le toit portait trois cents hivers sur des centaines de cordelettes nouées d’une demi-clé, une par personne, un mot par nœud, sans un seul grand nœud rouge nulle part ; et des petits anneaux, à hauteur de poignet, avec des chaînes, sous les grands anneaux de Sombreval.",
     "mentions": [
      "la-veillee",
      "sombreval"
     ]
    },
    {
     "id": "c10-b54",
     "text": "— On vous a lu une page sur Sombreval, dit-elle aux neuf. Elle dit que dans trois cents bouches il y a toujours un menteur. Elle ne dit pas qu’ils étaient enchaînés. Un mot pris ne tient rien, la Corderie le sait, c’est pour cela qu’elle ne peut pas me forcer, c’est écrit dans votre Charte. Alors on ne prendra rien à personne ce soir. On ouvrira la Levée, et ceux qui veulent monteront avec leur cordelette, et ceux qui ne veulent pas tiendront les lanternes, et on ne comptera pas qui fait quoi. Une demi-clé chacun. Un mot chacun. Vérifié par une main qui sait, avant qu’on donne. Il y a deux mains qui savent, ici, et l’une d’elles ne parle pas.",
     "mentions": [
      "la-cordelette",
      "la-corderie"
     ]
    },
    {
     "id": "c10-b55",
     "text": "— Combien seront-ils ? demanda une voix, du côté du bois.",
     "mentions": []
    },
    {
     "id": "c10-b56",
     "text": "— Je ne sais pas.",
     "mentions": []
    },
    {
     "id": "c10-b57",
     "text": "— Et si vous n’êtes que cent ?",
     "mentions": []
    },
    {
     "id": "c10-b58",
     "text": "— Alors ce seront cent nœuds vrais sur la corde, et la corde chantera moins faux, et Maître Aymon montera derrière avec son brin, comme c’est écrit, et il donnera ce qu’il restera à donner. Pas tout. Ce qui manque. Je ne vous demande pas de choisir entre lui et nous. Je vous demande de nous laisser passer devant.",
     "mentions": [
      "la-maitresse-corde",
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c10-b59",
     "text": "Il y eut un silence, et dans le silence, quelque part entre les piliers, un enfant de la Basse demanda à voix haute ce que c’était qu’une demi-clé, et une vieille lui répondit que c’était le nœud qu’il ferait quand il aurait quinze ans, et de se taire.",
     "mentions": [
      "tressaille",
      "la-veillee"
     ]
    },
    {
     "id": "c10-b60",
     "text": "Aymon parla. Il ne s’était pas déplacé ; il avait écouté, comme il avait promis, tout, jusqu’au bout, les mains derrière le dos, et le brin pâle sur l’épaule.",
     "mentions": [
      "maitre-aymon"
     ]
    },
    {
     "id": "c10-b61",
     "text": "— Elle a raison sur les anneaux, dit-il. Je ne le savais pas ; je le sais depuis six jours, par une ficelle, et j’ai relu la page, et la page ne dit pas cela, et la page a tort de ne pas le dire. Je le ferai réécrire. Elle a raison sur la grange : j’ai vu une fois, à vingt ans, le toit de Haut-Charme, et je l’ai oublié parce qu’on m’a appris à l’oublier. Elle a raison sur le nœud à deux âmes, puisqu’il est dans le Registre et qu’il a tenu. Elle a raison sur la Charte. Sur tout cela, elle a raison, et je le dis devant vous pour qu’on ne dise pas que je ne l’ai pas dit.",
     "mentions": [
      "haut-charme",
      "le-droit-de-reprise"
     ]
    },
    {
     "id": "c10-b62",
     "text": "Il fit un pas. Il regarda Aube, et pour la première fois depuis la crête, dix jours plus tôt, il n’y avait plus entre eux la corde, ni la page, ni la Basse ; il y avait un homme fatigué qui avait donné trente et un mots pour des gens qu’il ne connaissait pas et qui avait décidé de donner le reste ce soir.",
     "mentions": []
    },
    {
     "id": "c10-b63",
     "text": "— Et je monterai quand même à la lune, dit-il. Avec ceci. Je ne monte pas contre toi, fileuse. Je monte parce que la corde chante faux et qu’il y a onze cents maisons dans cette salle, et que je ne laisse pas onze cents maisons sur une grange que j’ai vue à vingt ans et sur un nœud de mule. Tu passes devant. Tu as ma corde derrière. Si la Maîtresse-Corde chante juste avant que la lune soit haute sur les Aiguilles, je n’aurai rien à faire, et je l’écrirai, et ce sera la plus belle ligne du Registre depuis la première page. Si elle chante faux, je ferai ce que fait un Maître de la Corderie. Je ne parie pas la Basse, fileuse. Je ne l’ai jamais pariée. Je n’ai pas le mot, et je n’en veux pas.",
     "mentions": [
      "la-corderie",
      "la-maitresse-corde"
     ]
    },
    {
     "id": "c10-b64",
     "text": "Dame Ysabeau n’avait rien dit. Elle regardait son fils, au bout de la table, avec ses bottes boueuses jusqu’aux genoux et son manteau trop neuf qui ne l’était plus, et son fils la regardait. Elle détourna les yeux la première. Elle dit :",
     "mentions": [
      "ysabeau-dautry"
     ]
    },
    {
     "id": "c10-b65",
     "text": "— Le Conseil laisse passer. La Levée est ouverte à qui monte. On ne demandera à personne, et on ne comptera pas. C’est tout ce que le Conseil a à dire, et c’est déjà plus que la Charte.",
     "mentions": [
      "le-conseil-des-maisons"
     ]
    },
    {
     "id": "c10-b66",
     "text": "Elle ne dit pas ce que ferait la Haute. Personne ne le lui demanda.",
     "mentions": [
      "tressaille"
     ]
    },
    {
     "id": "c10-b67",
     "text": "Le jour fut court, et long comme une nappe.",
     "mentions": []
    },
    {
     "id": "c10-b68",
     "text": "Garance le passa dans la Halle et dans les ruelles de la Haute, de couverture en couverture, de porte en porte, la mule derrière elle avec sur le bât le rouleau de chanvre de Haut-Charme dont elle vendait des pincées pour un denier et donnait des pincées pour rien, selon la figure ; et elle ne disait qu’une chose, la même, sans la vendre : « Ce soir, sur la Levée, avec ta cordelette, si tu veux. On ne te demande rien. » Et elle passait à la suivante avant qu’on lui réponde, parce qu’un mot qu’on demande est déjà à moitié pris. Aurèle et Séverin le passèrent dans la Salle des Cordes, les pieds dans l’eau, à montrer la demi-clé à qui entrait, cent fois, mille fois, le muet avec ses doigts et le compagnon avec sa voix, jusqu’à ce que les gabariers et les lavandières la fassent les yeux fermés. Bastien le passa à monter et descendre l’escalier des Lavandières, avec un message qu’il ne confia à personne, vers une maison de la Haute qui avait le sel dans ses caves.",
     "mentions": [
      "garance-malaurie",
      "aurele-malaurie"
     ]
    },
    {
     "id": "c10-b69",
     "text": "Aube fila.",
     "mentions": []
    },
    {
     "id": "c10-b70",
     "text": "Elle s’assit sur le banc des vieilles, à la place de Hersende, avec les trente fileuses autour d’elle, et elles filèrent, du chanvre blond de Haut-Charme, entre le pouce et l’index, sans rouet, sans reculer, des cordelettes de deux avant-bras, pour ceux qui avaient perdu la leur à l’eau, pour ceux qui n’en avaient jamais eu, pour les sans-nom de la Salle qui l’avaient filée à sept ans sous les yeux d’une vieille et qui la portaient encore. Trente fileuses font beaucoup de ficelle en un jour. Elles ne parlaient pas, parce qu’une fileuse qui parle fait un fil qui tremble, et parce qu’elles avaient, ce jour-là, autre chose à faire de leur bouche que parler : elles cherchaient. Aube les voyait chercher. Chacune tournait un mot sous sa langue, comme on cherche une pièce dans un ourlet, et le pesait, et le gardait ou le rendait, et en prenait un autre.",
     "mentions": [
      "le-brin-d-ame",
      "les-sans-nom"
     ]
    },
    {
     "id": "c10-b71",
     "text": "Elle aussi. Elle ne prit pas ce qui venait, cette fois. Elle avait tout le jour, et deux avant-bras de ficelle blonde au poignet avec un seul nœud dessus, et elle chercha comme Séverin le lui avait dit, un mot vécu assez pour qu’il tienne, et elle en trouva un, très vite, un qu’elle avait vécu tous les jours de sa vie, qu’on lui avait donné à la place d’un nom, à sept ans, à douze, dans la Halle, sur la crête ; et elle le tourna tout le jour, et le pesa, et il pesait. Elle sut qu’elle pouvait parce que cela lui fit mal. C’était le seul signe.",
     "mentions": [

      "severin"
     ]
    },
    {
     "id": "c10-b72",
     "text": "Le soleil descendit sur la Basse noyée. La Salle se vida. Par la porte du goudron, celle qui ne grince pas, Aube regarda la lumière rougir sur l’eau des ruelles et sur la muraille de la Levée, et au-dessus de la Levée le ciel pâlir vers l’est, vers les Aiguilles, où quelque chose de rond et de blanc allait se lever.",

      "tressaille",
      "la-levee"
     ]
    },
    {
     "id": "c10-b73",
     "text": "Maître Aymon se tenait sur le seuil. Il avait son brin sur l’épaule, et le Registre sous le bras, fermé de sa lanière, et il regarda Aube, et il dit ce qu’il avait à dire, ce qui était son travail :",
     "mentions": [
      "le-registre-des-mots-donnes",
      "maitre-aymon"

   "alt": "La nuit de la pleine lune sur la crête de la Levée : des centaines de gens agenouillés le long de la rigole avec des lanternes nouent leurs cordelettes sur la grosse corde ; Aube, debout à la pierre d’ancrage, regarde ; à une planche, Maître Aymon écrit dans un grand livre.",
   "visualDescription": "Plan très large nocturne sur la crête d’une digue de pierre longue et droite, le lac plein et noir à gauche léchant la pierre, la ville en lumières en bas à droite ; la pleine lune se lève sur des aiguilles rocheuses au fond ; le long d’une rigole de pierre où repose une corde grosse comme un tronc, des centaines de personnes agenouillées avec des lanternes de fer et de cuivre, la bouche près de la corde, et la corde déjà couverte de petites cordelettes ; au premier plan, Aube debout près d’une grosse pierre d’ancrage, une main sur la corde ; à côté, un homme barbu en tablier de cuir écrit dans un grand livre posé sur une planche, une lanterne à côté ; un homme au chapeau à large bord se penche sur un nœud ; lueur de lanternes dorées sur les visages.",
   "blocks": [
    {
     "id": "c11-b01",
     "text": "La crête était vide, et la corde chantait faux, et le lac touchait la pierre.",
     "mentions": [

     ]
    },
    {
     "id": "c11-b02",
     "text": "Ils étaient neuf sur la Levée quand le soleil disparut : Aube, Séverin, Aurèle, Garance, Bastien, Maître Aymon et ses trois compagnons, et dix lanternes plantées dans les anneaux de la rigole, de dix pas en dix pas, depuis la Pierre d’Ancre de l’ouest jusqu’à un point, vers le milieu, où la nuit les mangeait. Le vent venait du lac, régulier, froid, avec une odeur de saule noyé. La Retenue s’étendait derrière eux, noire, pleine, si pleine qu’à chaque souffle une lame mince passait par-dessus la pierre et venait mouiller la corde dans sa rigole, et repartait. Elle ne faisait pas de bruit. Elle attendait, elle aussi.",
     "mentions": [

      "aurele-malaurie"
     ]
    },
    {
     "id": "c11-b03",
     "text": "Aymon avait posé le Registre sur une planche, en travers de la rigole, avec une lanterne à côté et l’encre. Il avait déroulé son brin de dix jours le long de la corde, sur trente pas, pâle contre le gris, prêt à être couché dedans si la lune montait sur une note fausse. Il ne disait rien. Il regardait l’est, où le ciel, au-dessus des Aiguilles, blanchissait par en dessous.",
     "mentions": [
      "maitre-aymon",
      "le-brin-d-ame"
     ]
    },
    {
     "id": "c11-b04",
     "text": "Personne ne montait.",
     "mentions": []
    },
    {
     "id": "c11-b05",
     "text": "Aube regardait l’escalier des Lavandières. Cent soixante marches, luisantes, sans rampe, qui descendaient dans le noir vers une Basse noyée et vide ; et en haut de l’escalier, la Haute, avec ses lumières aux fenêtres, ses portes peintes, onze cents maisons de la Basse couchées dans ses halles et ses greniers, et rien qui bouge. Le vent chantait faux dans la corde. Vergogne, qu’on avait montée par la Montée des Gabariers parce que Garance avait dit qu’elle ne laissait pas la mule en bas un soir comme ça, mâchait un nouet et regardait le lac.",
     "mentions": [
      "tressaille",
      "les-nouets"
     ]
    },
    {
     "id": "c11-b06",
     "text": "— Ils ne viendront pas, dit un des compagnons, pas méchamment.",
     "mentions": []

    {
     "id": "c11-b07",
     "text": "— On ne leur a rien demandé, dit Garance. Ça prend du temps, une chose qu’on ne demande pas.",
     "mentions": [
      "garance-malaurie"
     ]
    },
    {
     "id": "c11-b08",
     "text": "Aube ne répondit pas. Elle alla s’agenouiller à la Pierre d’Ancre, devant les douze nœuds gris de Hersende, à la place exacte où une vieille femme s’était assise pour regarder le lac ; elle dénoua de son poignet la ficelle blonde de Haut-Charme, avec un seul nœud dessus, et elle attendit qu’Aurèle vienne.",
     "mentions": [
      "aurele-malaurie",
      "haut-charme"
     ]
    },
    {
     "id": "c11-b09",
     "text": "Il vint. Il ôta son chapeau.",
     "mentions": []
    },
    {
     "id": "c11-b10",
     "text": "Elle passa la ficelle autour de la Maîtresse-Corde, à ras du douzième nœud, et fit la demi-clé, la boucle et le bout dessous, le nœud d’enfant. Aurèle se pencha. Il le prit entre ses doigts, tira, sentit, tira encore. Il hocha la tête.",
     "mentions": [
      "la-maitresse-corde",
      "la-veillee"
     ]
    },
    {
     "id": "c11-b11",
     "text": "Alors elle approcha la bouche du nœud, et elle n’eut pas à chercher. Elle avait cherché tout le jour. Elle avait le mot sous la langue depuis midi, pesé, tourné, vécu à sept ans quand on lui avait dit qu’elle ne pouvait pas être apprentie, à douze quand on riait du côté des apprentis, dans la Halle quand on lisait son nom avec ce qu’il y avait derrière, sur la crête quand un homme sans méchanceté lui avait expliqué pourquoi elle convenait. Ce mot-là. Celui qu’on lui avait donné à la place d’un nom. Elle le rendait.",
     "mentions": [
      "le-conseil-des-maisons"
     ]
    },
    {
     "id": "c11-b12",
     "text": "Elle serra.",
     "mentions": []
    },
    {
     "id": "c11-b13",
     "text": "— Personne.",
     "mentions": []
    },
    {
     "id": "c11-b14",
     "text": "Rien ne bougea. On ne voyait jamais rien bouger. Mais sous sa paume, la corde fit ce que le Pont de Charme avait fait sous les torches : un tout petit son, une note qui montait d’un cheveu, dans le faux, comme une aiguille de plus dans le drap. Aube resta à genoux, les mains sur le nœud, et chercha le mot pour voir, par habitude, comme on touche une dent ; il n’y avait pas de marche manquée. Il y avait autre chose, qu’elle ne s’expliqua pas tout de suite : à l’endroit où le mot avait été, il n’y avait pas de trou. Il y avait de la place.",
     "mentions": [
      "haut-charme",
      "les-mots-donnes"
     ]
    },
    {
     "id": "c11-b15",
     "text": "Elle se releva. Aymon, à la planche, avait écrit sans qu’elle le voie : « Aube, fileuse, demi-clé, Maîtresse-Corde, ancrage ouest. » Il leva les yeux.",
     "mentions": [
      "la-maitresse-corde",
      "la-veillee"
     ]
    },
    {
     "id": "c11-b16",
     "text": "— Le mot ?",
     "mentions": []
    },
    {
     "id": "c11-b17",
     "text": "Elle ouvrit la bouche. Elle voulut dire ce qu’elle avait donné, et ne put pas, évidemment, et elle fit ce qu’elle put : elle montra la corde, la crête vide, l’escalier vide, et elle-même, et elle ouvrit les deux mains, paumes en l’air, sans rien dedans.",
     "mentions": []
    },
    {
     "id": "c11-b18",
     "text": "Aymon la regarda longtemps. Puis il baissa la tête et écrivit le mot, et Aube vit sa main s’arrêter au milieu, une seconde, et reprendre.",

     "text": "— Il tiendra, dit-il seulement.",
     "mentions": []
    },
    {
     "id": "c11-b20",
     "text": "Ce fut Bastien qui le vit le premier, parce qu’il regardait l’escalier depuis le début et qu’il n’avait plus le mot pour dire qu’il n’en pouvait plus d’attendre.",
     "mentions": [
      "les-mots-donnes",

     ]
    },
    {
     "id": "c11-b21",
     "text": "— Là, dit-il.",
     "mentions": []
    },
    {
     "id": "c11-b22",
     "text": "Une lumière. En bas de l’escalier des Lavandières, une seule, une lanterne qui montait, lentement, marche après marche ; et derrière elle, à dix marches, une autre ; et une troisième. Elles montaient comme la file de l’évacuation avait monté deux nuits plus tôt, mais en sens inverse, et sans paquets, et il y avait quelque chose de différent dans leur façon de monter, que Aube ne sut nommer qu’en voyant la première arriver sur la crête : c’était une lavandière de la Basse, une grosse femme aux bras rouges qu’elle connaissait de vue, et elle n’avait rien dans les mains que sa lanterne et, dans l’autre, sa cordelette, dénouée du poignet, tenue comme on tient un enfant par le bras.",

      "la-cordelette"
     ]
    },
    {
     "id": "c11-b23",
     "text": "Elle ne dit rien. Elle regarda Aube, et la corde, et Aurèle qui remettait son chapeau et l’ôtait à nouveau. Elle alla s’agenouiller à côté de la ficelle blonde et fit la demi-clé, et Aurèle tira, et hocha la tête, et elle serra sur un mot, et la corde monta d’un cheveu.",

     ]

    {
     "id": "c11-b24",
     "text": "Derrière elle, un gabarier qu’elle reconnut à la cicatrice rose, longue comme la main, sur son avant-bras nu. Il regarda Séverin en passant et ne dit rien, et s’agenouilla, et donna. Puis deux vieux. Puis un homme de Malebosse qu’Aube n’avait jamais vu et qui avait, dit-il à voix basse à Garance, descendu la gorge dans l’eau jusqu’aux genoux parce que sa mule était passée sur un pont qui avait tenu. Puis les fileuses. Les trente. Elles montèrent ensemble, en file, comme elles reculaient dans la Salle, avec des cordelettes filées le jour même ou vieilles de dix ans, et elles ne parlaient pas, et elles s’agenouillèrent l’une après l’autre le long de la rigole, et Aurèle allait de l’une à l’autre en tirant sur les nœuds, et Séverin en faisait autant quarante pas plus loin, et la corde montait, cheveu après cheveu, et l’escalier n’était plus qu’une file de lumières.",

     ]
    },
    {
     "id": "c11-b25",
     "text": "Aube se tenait debout à la Pierre d’Ancre, et elle les regardait venir. Elle ne comptait pas. C’était la première fois de sa vie, et elle s’en aperçut, et elle ne recommença pas.",
     "mentions": []
    },

   "blocks": [

     "id": "c12-b01",
     "text": "La Fonte dura trois semaines, comme toutes les Fontes, et la Levée tint, et personne n’en parla plus que du temps qu’il fait, ce qui est la façon des villes de dire merci.",

     "id": "c12-b02",
     "text": "Le lac redescendit. Il rendit la marque, d’abord, la ligne sombre et luisante sous la crête, puis les pierres d’amarre, puis les saules ; à la troisième semaine, la Retenue avait retrouvé sa forme longue et sa couleur d’étain, et la Tende, au Déversoir, courait de nouveau entre ses quais de pierre noire, sage, brune encore, avec dans ses remous des pétales de prunier venus de très haut. La Basse redescendit aussi. Onze cents maisons rentrèrent chez elles avec des balais, dans une odeur de vase et de fumée de châtaignier, et on gratta les murs, et on refit les feux, et sur les seuils, à hauteur de cheville, il resta longtemps une ligne grise qu’on ne lava pas, parce qu’il faut bien savoir jusqu’où.",

    {
     "id": "c12-b03",
     "text": "La Salle des Cordes sécha en huit jours. Les fileuses reculèrent de nouveau, deux cent vingt pas, dans le froissement du chanvre et des pieds nus, et personne ne parlait, et au-dessus des toits la corde chantait juste, et les enfants de la Basse, qui apprenaient à ne plus l’entendre, s’aperçurent qu’ils l’entendaient pour la première fois, parce qu’elle avait changé de voix. Elle n’était plus une note. Elle était mille, si serrées qu’elles n’en faisaient qu’une, comme le pont de Pont-Sauvage un soir de vent, et quand on écoutait bien, on y trouvait la sienne. Les gens montaient sur la Levée, le soir, pour ça. Ils marchaient le long de la rigole jusqu’à leur demi-clé, et posaient la main sur leur cordelette, et écoutaient. La Levée avait des cheveux. On ne les déliait pas ; on les laissait tenir. Il fallut changer la façon dont on mourait, à Tressaille, et cela se fit sans qu’on en décide : quand quelqu’un s’en allait, désormais, les siens montaient à la Levée la nuit même, et disaient les nœuds de sa cordelette sans les défaire, la main dessus, et redescendaient, et la personne restait dans la corde. On trouva que ce n’était pas plus mal.",

      "la-cordelette"

    {
     "id": "c12-b04",
     "text": "Le reste, on l’appela les manquants.",

     "id": "c12-b05",
     "text": "Ce fut le mot qui vint tout seul, et il vint de la Basse, comme les mots utiles. Une ville de mille personnes à qui il manque un mot chacune est une ville où l’on ne peut plus parler comme avant : on trébuche. Une lavandière ne pouvait plus dire « propre » ; un gabarier n’avait plus « amont » et disait « là d’où ça vient » ; le vieux bibliothécaire des livres de chanvre avait donné « page » et se le faisait répéter dix fois par jour par des gamins qui trouvaient ça drôle. On trébuchait, et l’autre ramassait. Cela se fit tout seul, en huit jours, comme le reste : quand quelqu’un s’arrêtait au milieu d’une phrase avec la marche manquée sur la figure, celui d’en face disait le mot pour lui, et on continuait. On appela ça prêter un mot. On ne le rendait pas, on le prêtait toujours ; c’était l’idée.",

   "text": "Vieille femme de la Corderie, soixante-dix ans passés, compagnonne depuis quarante ans et plus. C’est elle qui a fait la Reprise de la Levée en l’an 274, à trente et un ans : cent dix-sept mots en une nuit, une page rouge dans le Registre, et la Basse la chante à la Nouée sans savoir qu’elle est encore assise sur le banc des vieilles à écouter la corde.\n\nIl lui reste douze mots. Je les connais, tout le monde à la Corderie les connaît : oui, non, va, tiens, viens, eau, pain, dors, haut, encore, mal, et un douzième qu’elle ne dit presque jamais. Avec ça elle mène sa vie, et elle la mène mieux que bien des gens qui en ont dix mille. Elle noue des lettres que je porte aux Hauts au printemps, et en redescends d’autres, depuis quinze ans ; je ne sais pas ce qu’elles disent et je n’ai jamais demandé, parce qu’avec elle une question coûte un mot, et pas à moi.\n\nOn dit qu’elle n’est pas de Tressaille. On le dit de tous ceux qui ne parlent pas. Prix : elle m’a payé mes ficelles quinze ans de suite, au juste prix, sans un mot, et je n’ai jamais eu de meilleure cliente.",

   "text": "Maître de la Corderie de Tressaille depuis vingt ans, cinquante-six ans, fils d’un cordier de Pont-Sauvage, ce qui fait de lui un homme de chez moi et ne me le rend pas plus facile. Barbe grise coupée ras, tablier de cuir, la clé de la rigole de la Levée au cou sur un cordon, des yeux clairs presque sans couleur, et une voix qui porte deux cent vingt pas sans qu’il la lève.\n\nLe Registre lui compte trente et un mots donnés, ce qui est beaucoup pour un homme qui n’a pas fait de Reprise. Il a donné « mort », « peur », « jamais », « assez », et d’autres ; et il a donné « pardon », ce qui explique qu’il ne s’excuse jamais et qu’il regrette « ce qu’il faut regretter ». Il ne dit rien méchamment. C’est le plus difficile, avec lui : on cherche la méchanceté pour pouvoir la lui rendre, et il n’y en a pas, il n’y a qu’un homme qui a compté ce que pèse la Basse sous la marque et qui ne parie pas.\n\nIl croit à ce qu’on lui a appris : une reprise, c’est une bouche, tous ses mots, une nuit. Il l’a écrit, il l’enseigne, il en a vu la page rouge à seize ans. Prix : il m’achète mon chanvre des Hauts au tarif de Malebosse, et il sait que je le sais.",

   "text": "Dix-huit ans, fils de Dame Ysabeau Dautry et de la Maison du sel, grand, blond, des vêtements toujours un peu trop bien coupés pour l’endroit où il se trouve. Je lui vends du sel depuis qu’il tète, si l’on peut dire ; je connais la maison.\n\nSa sœur Clémence s’est noyée en l’an 308, à neuf ans, quand la Passerelle des Lavandières a lâché sous six personnes à la Fonte : le nœud qui la tenait avait dix ans et personne ne l’avait repris, parce qu’une passerelle de lavandières ne compte pas. Il avait douze ans. Depuis, il veut nouer. Il a demandé à Maître Aymon à quatorze ans, à seize ; on lui a répondu que ses mots ne pèsent pas, ce qui est la façon de la Corderie de dire qu’on lui a toujours répondu. Alors il a lu les vieux livres de chanvre de la Haute, où il est écrit qu’aux Hauts on noue autrement, sans dire comment. Les livres ne donnent jamais le prix.\n\nIl a des ampoules dès la première lieue et ne le dit pas. Il porte ce qu’on lui charge sans protester. Ce sont deux choses que je n’attendais pas d’un fils de Maison, et je les note à son crédit. Prix : six sols le jour, il porte sa part, il ne parle pas à la mule. Il a payé d’avance.",

   "text": "Puisqu’il faut bien que quelqu’un le fasse : Garance Malaurie, trente-huit ans, née à Pont-Sauvage dans une maison qui entend chanter le pont, colporteuse sur la route de la Tende depuis vingt ans, quinze tournées l’an entre Tressaille et les Hauts. Je vends du sel, des aiguilles de Tressaille, du fil, de la ficelle des Hauts pour les cordelettes, de la piquette de Malebosse, des bas, et des nouvelles ; j’achète du chanvre peigné, du lard au genévrier, de la tomme, et des nouvelles. Je porte des lettres nouées que je ne sais pas lire, depuis quinze ans, entre une vieille de la Corderie et quelqu’un là-haut.\n\nJe compte mes pas, mes sols et mes deniers, à voix haute quand il le faut, parce qu’un compte qu’on ne dit pas est un compte qu’on oublie. On dit que je parle tout le temps. On dit vrai. Je m’arrête quand on m’achète quelque chose.\n\nCe carnet est tenu sur la route et repris au propre après la Fonte de l’an 314. Il n’est pas impartial, je n’ai jamais dit qu’il le serait, et il donne le prix de tout, y compris de ce qui ne se vend pas, parce que ça aussi il faut bien que quelqu’un le fasse.",

   "text": "Mule grise, douze ans, achetée à Malebosse une année de mauvais chanvre pour le prix de trois bonnes brebis. Elle porte une maison en marche sans se plaindre, et elle n’avance pas sans nouets. Ce n’est pas de la gourmandise : c’est un contrat. Elle connaît les quarante-deux notes du col mieux que moi et ne rue jamais en sangle sous la benne de Malebosse, pourvu qu’on lui parle ; onze traversées.\n\nSon nom, je l’ai choisi pour la faire honte aux gens qui me disaient que j’en manquais. Elle le porte avec dignité. Elle a un air d’offense profonde qu’elle réserve au vide, à la pluie et aux fils de Maison, et elle regarde l’eau des rivières comme une chose qu’on aurait dû lui demander avant de la mettre là.\n\nPrix : n’est pas à vendre. On me l’a demandé deux fois ; les deux fois j’ai dit un chiffre si haut qu’on a cru à une plaisanterie. C’en était une. À moitié.",

   "hook": "Le veilleur du col, qui accorde les cordes de la harpe et n’a plus un mot à dire.",
   "text": "Mon frère. Quarante-quatre ans, six de plus que moi, parti aux Hauts il y a quinze ans pour « voir comment ils font », et resté. Il est le veilleur du col de la Déliée : c’est lui qui tend, accorde et reprend les cordes de la harpe, une quarantaine, de roc en roc, pour que les gens et les mules ne se perdent pas dans le brouillard. Chaque corde a sa note, chaque note sa place ; il les tourne avec une clé de bois plantée dans la pierre, et il écoute, et il remercie la corde d’un signe de tête. Il a donné tous ses mots aux nœuds de là-haut, un par un, en quinze ans. Il parle avec les mains et avec des ficelles, et il sourit beaucoup, et je ne sais pas encore ce que je pense de ça.\n\nGrand, maigre, le visage de la famille en plus long, un manteau de laine brune, un chapeau à large bord qu’il retient contre le vent. Vergogne le connaît et va poser son mufle sur sa manche, ce qu’elle ne fait à personne.\n\nIl m’a noué des lettres pendant quinze ans, que je portais à la vieille de la Corderie. Vers la fin je ne savais plus les lire. Je les portais quand même. Prix : il ne m’a jamais rien acheté ni vendu ; c’est le seul de la vallée.",

   "text": "Le hameau des Veilleurs, à la source de la Tende, là où la rivière n’est encore que cent ruisseaux dans une tourbière de linaigrettes : les Fontaines. Trente toits de lauzes sur une butte, une grange plus grande que tout le reste, un petit pont de cordes bas sur les ruisseaux, des brebis. Quarante âmes, où il y en eut deux cents ; les jeunes descendent et ne remontent guère.\n\nAutour de chaque maison, un carré de terre noire pas plus grand qu’une couverture : le carré de chanvre. Chaque maison file sa corde ; chaque enfant file sa cordelette à sept ans dans le chanvre de sa maison ; personne n’achète de ficelle à personne, et je vends tout ce que je veux là-haut sauf ça. Ils tiennent leurs choses eux-mêmes, à leur manière, sans compagnon ni Registre, et la Corderie appelle ça une légende parce qu’elle ne monte pas voir.\n\nLes vieux ont donné leurs mots aux nœuds et parlent avec les mains ; les enfants, qui ne donnent pas avant quinze ans, parlent pour tout le village, à tue-tête, et le village les écoute comme de la musique. On y mange du lard fumé au genévrier, une miche noire où le chanvre entre pour un tiers, et une tomme de brebis qui vaut le col. Prix du lard : je l’échange contre du sel, à mon désavantage, et je ne sais pas pourquoi.",
