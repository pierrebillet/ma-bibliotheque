  "chapters": [
    {
      "id": "chapitre-1",
      "number": 1,
      "title": "Le linge qui reste",
      "blocks": [
        {
          "id": "c1-b01",
          "text": "La première chose que je sauve de la rivière est un drap qui ne nous appartient pas. La seconde est une enfant, et ma mère va sûrement trouver à redire à cet ordre. Pour le drap, je n’ai eu qu’à tendre le bras. Pour l’enfant, il faut que je lâche la corde.",
          "mentions": []
        },
        {
          "id": "c1-b02",
          "text": "Elle pend sous le lavoir, accrochée à une traverse dont le bout s’en va avec l’eau. Je vois ses quatre doigts, puis trois. Le drap claque contre mes jambes. Une pince de frêne me reste dans la bouche ; j’ai le goût du linge propre et du bois mâchonné.",
          "mentions": [
            "lavoir",
            "pinces"
          ]
        },
        {
          "id": "c1-b03",
          "text": "— Maman, la perche.",
          "mentions": [
            "mado"
          ]
        },
        {
          "id": "c1-b04",
          "text": "Ma mère a déjà compris. Elle couche sa longue perche à linge en travers des montants, y passe une boucle de la corde de séchage et pose son pied dessus. Je noue le drap autour de ma taille. Je ne sais pas faire un beau nœud de batelière, mais je sais tirer sur une couture pour voir où elle lâchera. Je tire. Elle tient.",
          "mentions": []
        },
        {
          "id": "c1-b05",
          "text": "La traverse est prise dans un anneau jaune. Au milieu de l’anneau, une fissure montre une petite bouche noire. Quelqu’un a donné un geste pour que ce bois reste là, un geste qu’il ne refera plus jamais. La rivière se moque de ce que cela lui a coûté.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c1-b06",
          "text": "— Tu peux me regarder ?",
          "mentions": []
        },
        {
          "id": "c1-b07",
          "text": "L’enfant ouvre les yeux. Elle a perdu une chaussure. Je lui tends le coin du drap, mais elle refuse de lâcher la traverse. Alors je descends encore. La corde de séchage, retenue par ma mère, se tend sous mes aisselles. Le froid entre dans mon tablier avec une violence qui me coupe la voix.",
          "mentions": []
        },
        {
          "id": "c1-b08",
          "text": "Je passe le drap sous le ventre de l’enfant. Il faudrait une troisième main pour tenir les deux épaisseurs le temps de les nouer. J’ai une pince. Je la retire de ma bouche, rassemble le tissu, enfonce les mâchoires de bois. Ce n’est pas solide. C’est assez pour une seconde. Une seconde, c’est parfois une troisième main.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c1-b09",
          "text": "— Maintenant, tu lâches.",
          "mentions": []
        },
        {
          "id": "c1-b10",
          "text": "Elle secoue la tête. La traverse descend d’un doigt. Je n’ai rien de rassurant à lui raconter.",
          "mentions": []
        },
        {
          "id": "c1-b11",
          "text": "— Je m’appelle Aubine. Si on tombe, tu pourras crier mon nom.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c1-b12",
          "text": "Elle lâche. Le poids nous entraîne ; le nœud mord ma taille. Au-dessus, ma mère pousse un bruit qu’elle garde d’ordinaire pour les baquets trop pleins. Quelqu’un vient l’aider. Nous remontons en cognant la pierre, l’enfant et moi, liées comme deux mauvaises pièces de toile.",
          "mentions": []
        },
        {
          "id": "c1-b13",
          "text": "Sur les dalles, elle se met à pleurer. Je vérifie machinalement la couture du drap. Déchirée. Trois jours de reprise, et le propriétaire marchandera encore. Voilà ma pensée héroïque. J’ai dix-sept ans, les genoux bleus et un métier qui me suit jusque dans une rivière.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c1-b14",
          "text": "Le garçon qui a aidé ma mère nous jette sa veste. Je le reconnais à ses chaussures : même cuir sur les deux pieds, luxe rare chez les bateliers, mais les semelles cousues avec du fil de voile. Colas. Il fait passer les légumes jusqu’à la ville haute et revient avec des caisses qu’il prétend toujours vides.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c1-b15",
          "text": "— La prochaine fois, dit-il, choisis un drap moins cher.",
          "mentions": []
        },
        {
          "id": "c1-b16",
          "text": "Je ris. Cela me fait mal entre les côtes. L’enfant nous regarde comme deux personnes d’un autre pays.",
          "mentions": []
        },
        {
          "id": "c1-b17",
          "text": "Puis le bruit change. Ce ne sont plus les gens qui accourent, c’est le bâton du crieur sur les pavés de Rivebasse. Trois coups, une attente, trois coups. L’enfant cesse de pleurer. Tout le monde connaît ce rythme-là, même sans l’avoir entendu : on l’apprend aux exercices de crue.",
          "mentions": [
            "rivebasse"
          ]
        },
        {
          "id": "c1-b18",
          "text": "Une jeune femme en manteau bleu descend les marches. Elle porte une sacoche blanche, tenue haut sous son bras pour éviter les éclaboussures. Deux gardes restent au débouché de la ruelle. La jeune femme ne regarde pas mes jambes nues ni le drap. Elle regarde l’anneau brisé qui tourne encore au bout de la traverse.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c1-b19",
          "text": "— Ordre de la prévôte Orane. À compter de la quatrième cloche du quatrième jour, les maisons sous la borne rouge seront évacuées. Le délestage du lac commencera avant la nuit.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c1-b20",
          "text": "— La borne rouge, répète ma mère.",
          "mentions": []
        },
        {
          "id": "c1-b21",
          "text": "Il y a un trait rouge au-dessus de notre porte. Je croyais qu’on le repeignait chaque année pour mesurer l’humidité. Je comprends pourquoi le peintre avait eu l’air gêné, cette fois.",
          "mentions": []
        },
        {
          "id": "c1-b22",
          "text": "— Des places sont réservées sur les charrettes, dit la messagère. Je m’appelle Bertille. Je reviendrai pour les personnes qui ne peuvent pas monter seules.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c1-b23",
          "text": "Elle dit cela simplement, et je la déteste moins que je ne voudrais. Ma mère demande combien de paniers. Un seul par personne, répond Bertille. Les animaux seront regroupés. Les outils longs voyageront à part si la place le permet.",
          "mentions": []
        },
        {
          "id": "c1-b24",
          "text": "Dans notre chambre, tout tient sur quatre patères et une table. Pourtant, je n’arrive pas à trouver par quel bout on met une vie dans un panier. Ma mère essore sa manche. Depuis qu’une tenue lui a pris son geste de tressage du pain, elle ferme nos pains en les repliant, comme des paquets. Elle les rate quand elle est fatiguée. Moi, je raccommode les draps ; mon point de reprise est si régulier qu’elle doit le chercher à contre-jour. Nous avons mis des années à nous partager cela.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c1-b25",
          "text": "Les voisins se dispersent. La mère de l’enfant arrive en courant, reprend sa fille, me touche l’épaule sans trouver de parole. Colas récupère sa veste. Je retourne près de l’eau. Ma pince s’est coincée dans la grille, une mâchoire cassée. Je la repêche.",
          "mentions": [
            "lavoir"
          ]
        },
        {
          "id": "c1-b26",
          "text": "Sur le montant, la marque de la crue précédente est à hauteur de ma cheville. Celle que les gardes viennent de tracer me dépasse de deux têtes.",
          "mentions": []
        }
      ],
      "image": "images/chapter-01.webp",
      "alt": "Un drap gonflé de vent claque au bord d’un lavoir de pierre au-dessus d’une rivière en crue.",
      "visualDescription": "Plan large horizontal, hauteur humaine depuis les dalles du lavoir. Aubine de trois quarts, au bord gauche, retient un grand drap écru qui se gonfle vers la rivière ; perches, cordes et pinces de frêne au premier plan. Mado est près d’une perche derrière elle. Matin clair après pluie, eau brune vive, maisons modestes étagées. Aucun enfant en danger visible : instant qui précède le sauvetage, sans en montrer l’issue."
    },
    {
      "id": "chapitre-2",
      "number": 2,
      "title": "Une place sur la charrette",
      "blocks": [
        {
          "id": "c2-b01",
          "text": "La Maison des mesures sent la cire et la soupe. C’est une chose agaçante : j’avais préparé ma colère pour un endroit où les riches ne mangeraient rien d’aussi ordinaire. Une femme remue la marmite du poste de garde. Je me demande si elle salera avant de servir, comme nous, ou si chacun pourra choisir.",
          "mentions": [
            "maison-des-mesures"
          ]
        },
        {
          "id": "c2-b02",
          "text": "Sabine m’attend devant la porte de la salle. Elle est large, grise, un crayon derrière chaque oreille, et elle tient à la main le reçu de sa dernière amende. On l’a condamnée pour avoir réparé sans autorisation un escalier public. Elle avait bien demandé l’autorisation. L’escalier n’avait pas attendu la réponse pour tomber.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c2-b03",
          "text": "— J’ai apporté ta pince, lui dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b04",
          "text": "— J’avais demandé l’anneau.",
          "mentions": []
        },
        {
          "id": "c2-b05",
          "text": "— Il est au fond de l’eau. La pince, c’est ce qui a marché.",
          "mentions": []
        },
        {
          "id": "c2-b06",
          "text": "Elle la prend quand même. Sabine faisait autrefois des ponts. Aujourd’hui elle redresse les portes que les maisons de Rivebasse serrent entre leurs murs. Je lui apporte parfois les fers de mon petit métier à reprendre, et elle me paie pour recoudre ses poches. Nous sommes clientes l’une de l’autre ; elle dit que c’est plus sain que d’être reconnaissantes.",
          "mentions": []
        },
        {
          "id": "c2-b07",
          "text": "Orane se tient debout derrière une table où il n’y a pas assez de place pour ses cartes. Elle a roulé ses manches ; une tache de soupe marque son poignet. Trois gens parlent à la fois. Elle en fait taire deux, écoute le troisième jusqu’au bout, puis déplace un caillou blanc d’un côté de la carte à l’autre.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c2-b08",
          "text": "— Vous avez quatre jours, dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b09",
          "text": "— Trois jours et une matinée, répond-elle. Et vous venez d’en employer une partie à attendre devant ma porte. Que proposez-vous ?",
          "mentions": []
        },
        {
          "id": "c2-b10",
          "text": "Elle ne sourit pas. Je pose ma pince cassée. Sabine pose un dessin. Sur le mur, une coupe du lac montre la grande retenue, un assemblage de poutres et de pierre, entre deux falaises. La neige a fondu trop tôt sur les plateaux ; la pluie n’a pas cessé derrière les crêtes. Les anneaux du barrage blanchissent sous la charge. Orane nous montre le dernier relevé. Deux prises ont lâché dans la nuit. Si le barrage tombe, l’eau emportera les quartiers bas et les fondations de la ville haute.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c2-b11",
          "text": "— Ouvrir le chenal de la carrière, dit Sabine.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c2-b12",
          "text": "— Condamné depuis douze ans. Sur votre rapport.",
          "mentions": []
        },
        {
          "id": "c2-b13",
          "text": "Le silence qui suit n’est pas vide. Il a la forme du dos de Sabine, devenu très droit.",
          "mentions": []
        },
        {
          "id": "c2-b14",
          "text": "— La vanne peut se reprendre. Il faut rapporter son étrier. Il est resté à la Forge des Échos.",
          "mentions": [
            "forge"
          ]
        },
        {
          "id": "c2-b15",
          "text": "Elle dessine un U avec deux pieds recourbés. C’est une pièce de fer qui tient l’axe de la vanne pendant qu’on change ses appuis. Sans elle, le battant peut s’abattre sur les ouvriers. Les dimensions ne se devinent pas ; les logements sont taillés dans la pierre. La forge possède l’étrier ajusté pour cette vanne et les cales qui vont avec. En fabriquer un autre prendrait davantage de temps que d’aller le chercher.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c2-b16",
          "text": "— On ne passe plus par le pont de la carrière, dit Orane.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c2-b17",
          "text": "— Par les vergers, puis le bac. Deux jours jusqu’à la forge, un pour revenir par les crêtes.",
          "mentions": []
        },
        {
          "id": "c2-b18",
          "text": "— Et vous voulez mettre Rivebasse en attente d’un objet qui a peut-être rouillé, avec une vanne que vous avez déclarée dangereuse ?",
          "mentions": []
        },
        {
          "id": "c2-b19",
          "text": "Je regarde les cailloux. Quatre blancs serrés dans un carré, un rouge en bas. Notre maison ne mérite même pas son propre caillou.",
          "mentions": []
        },
        {
          "id": "c2-b20",
          "text": "— Je veux que vous essayiez autre chose avant de la noyer.",
          "mentions": []
        },
        {
          "id": "c2-b21",
          "text": "Orane enlève sa main de la carte.",
          "mentions": []
        },
        {
          "id": "c2-b22",
          "text": "— Moi aussi. Mais je dois faire monter ceux qui y vivent pendant que vous essayez. Votre mère aura une place. Quoi que vous décidiez.",
          "mentions": []
        },
        {
          "id": "c2-b23",
          "text": "Bertille entre avec une brassée de feuilles. Elle s’arrête en reconnaissant Sabine. Quelque chose passe entre elles que je prends pour de l’hostilité. La prévôte donne à Sabine un sauf-conduit, valable jusqu’au soir du troisième jour. Il autorise notre passage, pas l’ouverture de la vanne. Bertille nous accompagnera ; elle connaît les postes et doit relever les niveaux d’eau sur la route.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c2-b24",
          "text": "Nous trouvons Colas devant son bateau. Il a reçu notre visite par avance : sa barque est chargée de perches, de pain et d’un paquet ficelé qui ressemble à des habits propres. Il a dix-neuf ans et assez d’orgueil pour se faire passer pour un homme surpris par sa propre bonté.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c2-b25",
          "text": "— Je vais de toute façon aux Fosses. On m’achète la barque là-bas. Après, je monterai travailler aux greniers.",
          "mentions": [
            "fosses"
          ]
        },
        {
          "id": "c2-b26",
          "text": "Il tapote le bordage. Je l’ai vu remplacer chaque planche. Sur l’avant, le nom du bateau a été poncé. Je fais semblant de ne pas le remarquer.",
          "mentions": []
        },
        {
          "id": "c2-b27",
          "text": "Ma mère ne me retient pas. C’est pire : elle vérifie le fond de mes chaussures, refait le paquet de pain, trouve trois pinces entières dans le tiroir. Elle me les glisse dans la poche du manteau rouille, celui que j’ai retaillé dans deux manteaux différents.",
          "mentions": [
            "mado",
            "pinces"
          ]
        },
        {
          "id": "c2-b28",
          "text": "— Tu sauveras peut-être moins de draps là-haut.",
          "mentions": []
        },
        {
          "id": "c2-b29",
          "text": "Je voudrais lui promettre la maison. Je pourrais le faire ; j’ai une bouche, comme tous ceux qui promettent.",
          "mentions": []
        },
        {
          "id": "c2-b30",
          "text": "— Tu prends la charrette, dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b31",
          "text": "— Je prends la charrette.",
          "mentions": []
        },
        {
          "id": "c2-b32",
          "text": "Elle tire mon aiguille de la pelote, en vérifie la pointe contre son ongle. Puis elle la remet dans mon nécessaire. Ce geste, elle peut encore le faire. Je connais trop bien la liste des autres pour ne pas voir celui-là.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c2-b33",
          "text": "— Ne leur laisse pas décider ce que tes mains peuvent perdre.",
          "mentions": []
        },
        {
          "id": "c2-b34",
          "text": "Je l’embrasse avec de la colère qui n’est pas pour elle. Au bout du quai, Sabine s’appuie sur le dessin de l’étrier pour expliquer le chargement. Bertille a déjà mis un pied à bord. Je descends les marches et le bateau s’écarte alors que je cherche encore où poser les pieds.",
          "mentions": []
        }
      ],
      "image": "images/chapter-02.webp",
      "alt": "Aubine et Sabine attendent devant une porte ouverte de la Maison des mesures, des feuilles et une pince à la main.",
      "visualDescription": "Plan moyen dans un corridor de pierre claire, Aubine tenant une pince cassée et Sabine portant un dessin roulé aux traits indéchiffrables. À travers la porte ouverte, une table chargée de cartes muettes et une marmite plus loin. Matin doux, lumière latérale, gestes d’attente ; aucune scène de confrontation et aucun texte dans les papiers."
    },
    {
      "id": "chapitre-3",
      "number": 3,
      "title": "Les fruits de la nuit",
      "blocks": [
        {
          "id": "c3-b01",
          "text": "Aux vergers suspendus, on ne cueille pas les fruits en levant la main. On la baisse dans le ciel. Les arbres poussent sur des terrasses si étroites que leurs branches franchissent le bord ; dessous, des filets recueillent les poires tombées. Le bateau nous dépose au pied du chemin, puis Colas le mène jusqu’au bac où nous devons le rejoindre. Nous montons avec des paniers vides sur le dos : le sauf-conduit ne dispense pas de payer le passage en portant quelque chose.",
          "mentions": [
            "vergers"
          ]
        },
        {
          "id": "c3-b02",
          "text": "Sabine s’arrête près d’un garde-corps. Elle frappe du doigt l’anneau qui unit le bois à la pierre. Le son est net, presque gai.",
          "mentions": [
            "sabine",
            "tenues"
          ]
        },
        {
          "id": "c3-b03",
          "text": "— À quoi tu reconnais une tenue sûre ?",
          "mentions": []
        },
        {
          "id": "c3-b04",
          "text": "— Elle sonne bien.",
          "mentions": []
        },
        {
          "id": "c3-b05",
          "text": "— Ça, c’est un pot intact. Une tenue sûre a été chargée de sacs avant d’être chargée de gens. Il faut chercher la marque d’épreuve.",
          "mentions": []
        },
        {
          "id": "c3-b06",
          "text": "Elle me montre trois encoches sous la glaçure. Les anneaux ne savent pas si une personne a donné un geste précieux ou sans importance. Ils savent seulement tenir, jusqu’à une certaine charge qu’on mesure. Les plus pauvres offrent souvent les gestes les plus utiles : ils n’en ont pas beaucoup d’autres. Sabine me le dit sans lever la voix. Je pense au pain plat de ma mère.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c3-b07",
          "text": "— Alors pourquoi ils tiennent les ponts avec ça ?",
          "mentions": []
        },
        {
          "id": "c3-b08",
          "text": "— Parce qu’un anneau fait en une heure peut remplacer un mois de charpente. Le premier mois, c’est merveilleux. Ensuite, quelqu’un décide qu’on n’a plus besoin de charpentiers.",
          "mentions": []
        },
        {
          "id": "c3-b09",
          "text": "Bertille marche derrière nous. Ses bottes ont le talon usé du côté gauche. Elle compte les marches par groupes de vingt, à voix si basse que je ne l’entends que lorsque le vent tombe. Je lui demande si c’est pour ses relevés.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c3-b10",
          "text": "— Pour ne pas regarder en bas.",
          "mentions": []
        },
        {
          "id": "c3-b11",
          "text": "Je croyais que la peur donnait de meilleures raisons de se taire. Je lui montre comment fixer la sangle de son panier avec une pince : elle cessera de lui cisailler le cou. Elle me remercie. Je vérifie la pince une fois de trop.",
          "mentions": []
        },
        {
          "id": "c3-b12",
          "text": "Nous atteignons le pressoir à la nuit. La femme qui nous reçoit exige qu’on attende dehors pendant qu’elle finit de coucher les petits. Alors le verger s’allume. Une lumière verte apparaît dans une poire, puis dans une autre, à l’intérieur de la chair. Des insectes minuscules en sortent par les trous de guêpe. Ils vont d’une branche à l’autre, traçant des coutures qui ne restent pas. Sous les filets, leurs reflets flottent dans le vide ; on croirait les racines tournées vers les étoiles.",
          "mentions": [
            "veilleuses"
          ]
        },
        {
          "id": "c3-b13",
          "text": "Je ne parle pas. Pour une fois, je ne cherche même pas ce qui tient.",
          "mentions": []
        },
        {
          "id": "c3-b14",
          "text": "Bertille retire sa capuche. Elle a de courtes boucles noires collées aux tempes. Un insecte se pose sur son sourcil, l’éclaire comme une idée. Elle souffle vers le haut sans oser bouger. Je voudrais que ma mère voie cela. Je reste pourtant là, les mains vides, et la regarde jusqu’au bout.",
          "mentions": []
        },
        {
          "id": "c3-b15",
          "text": "On nous sert des poires rôties dans une soupe de grains, avec du pain plié. Je reconnais le pli de ma mère dans celui d’une inconnue et cela me repose. La femme du pressoir n’a rien donné à une tenue ; elle fait le pain ainsi parce que cela cuit plus vite. Il existe donc un endroit où notre pain n’est le souvenir de rien.",
          "mentions": [
            "pain-plie"
          ]
        },
        {
          "id": "c3-b16",
          "text": "Avant de manger, la femme du pressoir a laissé refroidir une cuillerée sur le rebord de la fenêtre. Pour les morts qui suivent les voyageurs, nous a-t-elle expliqué. Chez nous aussi, on leur réserve l’odeur du repas ; ma mère se fâche quand je ferme trop tôt. Je pousse le bol d’un doigt pour qu’il ne tombe pas. Je n’ai pas d’avis certain sur les morts. Les bols, eux, cassent.",
          "mentions": [
            "pain-plie"
          ]
        },
        {
          "id": "c3-b17",
          "text": "Au matin, le bac n’est plus dans l’alignement des deux rives. Sa corde amont s’est allongée pendant la nuit, ou l’un des ancrages a bougé. Colas est là, sa barque attachée derrière la plateforme. Le passeur refuse de faire traverser les paniers tant que les passagers ne sont pas descendus. Sabine l’approuve. Nous montons seuls, avec notre sac de ferraille et les provisions.",
          "mentions": [
            "bac"
          ]
        },
        {
          "id": "c3-b18",
          "text": "Le courant prend la plateforme par-dessous. Le passeur crie à Colas de détacher sa barque pour la mener à l’abri. Bertille s’assied d’un coup. Son visage devient aussi blanc que sa sacoche. Je lui donne la main ; elle me la broie avec beaucoup de politesse.",
          "mentions": []
        },
        {
          "id": "c3-b19",
          "text": "Puis le verrou de la poulie saute. Pas la corde, pas l’ancrage : une cheville grosse comme mon petit doigt. La plateforme tourne, le bord s’enfonce. Le passeur pousse la barre de sécurité avec son épaule. Sabine ouvre son coffret. Il y a dedans deux anneaux neufs, un poinçon et un petit morceau de craie.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c3-b20",
          "text": "— Il faut fixer le verrou, dit-elle. Je peux tenir la barre. Aubine, prends l’anneau.",
          "mentions": []
        },
        {
          "id": "c3-b21",
          "text": "Je ne l’ai jamais fait. Je sais comment on fait : tout le monde le sait. On appuie la céramique entre les deux pièces, on y trace la fermeture avec un geste volontaire, appris, qu’on laissera dedans. C’est la chose qu’on sait avant de savoir écrire son nom.",
          "mentions": []
        },
        {
          "id": "c3-b22",
          "text": "— Un geste entier, dit Sabine. Que tu pourrais faire les yeux fermés. Pas un mouvement au hasard. Et personne ici ne choisit pour toi.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c3-b23",
          "text": "La barre glisse sur son épaule. Elle a donné assez de gestes pour connaître ce qui lui reste, mais pas le temps d’en essayer un dans cette position. Bertille vomit par-dessus le bord. Le passeur a ses deux bras pris dans la corde. Colas, loin déjà, ramène la barque contre le courant.",
          "mentions": []
        },
        {
          "id": "c3-b24",
          "text": "Je sais siffler avec deux doigts. Un appel montant, puis deux notes brèves : ma mère me répond ainsi depuis la fenêtre quand je rentre au lavoir. Je pose l’anneau. Je mets deux doigts dans ma bouche et j’envoie le cri contre la terre cuite, en fermant de l’autre main le trait de craie.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c3-b25",
          "text": "Le son s’arrête avant que mon souffle soit épuisé. Le verrou ne bouge plus. Sous mes doigts, la céramique est chaude, et ce n’est pas de ma chaleur.",
          "mentions": []
        },
        {
          "id": "c3-b26",
          "text": "Nous finissons la traversée à la perche. Sur l’autre rive, le passeur décharge chaque panier, puis ferme le bac. Il veut me donner ses recettes du matin. Je secoue la tête. Je ne sais pas encore combien vaut le chemin sonore qui me ramenait chez moi.",
          "mentions": [
            "bac"
          ]
        },
        {
          "id": "c3-b27",
          "text": "Je mets mes doigts entre mes lèvres. De l’air passe, rien de plus. Je les place autrement. Je pourrais essayer toute ma vie.",
          "mentions": []
        },
        {
          "id": "c3-b28",
          "text": "Bertille me tend de l’eau. Je la prends des deux mains pour qu’elle ne voie pas qu’une seule aurait suffi. De l’autre côté du fleuve, le chemin officiel s’arrête au bac fermé. Devant nous, Sabine déplie sa carte, puis la tourne pour suivre une route qui n’y est plus tracée.",
          "mentions": []
        }
      ],
      "image": "images/chapter-03.webp",
      "alt": "Des poiriers débordent de terrasses de pierre au-dessus de filets tendus dans le vide.",
      "visualDescription": "Vue panoramique des vergers suspendus au couchant, branches de poiriers chargées de fruits vert doré dépassant des terrasses très étroites, grands filets en fibres tendus dessous. Aubine, Sabine et Bertille petites silhouettes avec paniers vides sur le dos le long du chemin ; Colas absent car il mène la barque. Fleuve loin en bas, lumière dorée, profondeur lisible. Pas de pont en ruine, pas de sacrifice ; montrer l’approche du verger."
    },
    {
      "id": "chapitre-4",
      "number": 4,
      "title": "Le fond des choses",
      "blocks": [
        {
          "id": "c4-b01",
          "text": "Les Fosses ne sont pas un trou. C’est ce que Colas nous explique en poussant sa barque le long d’une levée, au milieu des bassins carrés. On y a tiré la pierre avant de tirer des bassins le poisson qui s’y était installé. Des escaliers entrent dans l’eau sans mener à aucune porte. Les maisons se tiennent sur les marches hautes, avec un anneau d’amarrage à côté de chaque cheminée.",
          "mentions": [
            "fosses"
          ]
        },
        {
          "id": "c4-b02",
          "text": "L’acheteur attend sur une terrasse. Il a une barbe en pointe, des mains propres et une balance qui n’a rien à faire près d’un bateau. Colas pose sa perche, passe les doigts sur un bordage. Il a passé le bac sans l’abîmer ; on voit à son visage qu’il en est désolé. Une avarie aurait pu fournir une raison honnête de ne plus vendre.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c4-b03",
          "text": "— On avait dit soixante, dit-il.",
          "mentions": []
        },
        {
          "id": "c4-b04",
          "text": "— Avant l’annonce de la crue. Quarante.",
          "mentions": []
        },
        {
          "id": "c4-b05",
          "text": "L’acheteur nous regarde ; il n’avait pas baissé la voix. Les barques de Rivebasse vont bientôt se présenter toutes ensemble sur son quai ; il les attend déjà. Il nous offre des gobelets. Le mien sent la menthe ; j’ai envie de le jeter très loin et je le repose avec soin, parce que nous n’aurions pas de quoi le payer.",
          "mentions": [
            "rivebasse"
          ]
        },
        {
          "id": "c4-b06",
          "text": "Sabine m’emmène voir la sortie du chenal. Nous traversons un champ où les épis sont attachés par poignées pour résister au vent. Sous une arche, un ruisselet passe entre des pierres blanches. Ce filet d’eau devrait devenir une route pour le lac. Je comprends mal comment un espoir peut tenir dans quelque chose qu’on franchit à pied sec.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c4-b07",
          "text": "Sabine plante sa canne contre la paroi, mesure la hauteur jusqu’à une encoche et déroule une ficelle. Elle me donne l’autre bout. Nous avançons dans la poussière, fléchies pour ne pas perdre le niveau. Après trois mesures, elle fronce les sourcils.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c4-b08",
          "text": "— Trop de dépôt. Il faudrait enlever la terre jusqu’à la troisième marche, sur toute cette longueur.",
          "mentions": []
        },
        {
          "id": "c4-b09",
          "text": "— Ça se fait ?",
          "mentions": []
        },
        {
          "id": "c4-b10",
          "text": "— Avec quarante personnes et des pelles. Avec nous quatre, non.",
          "mentions": []
        },
        {
          "id": "c4-b11",
          "text": "Je déteste cette réponse davantage qu’un non entier. Un non entier aurait fermé quelque chose.",
          "mentions": []
        },
        {
          "id": "c4-b12",
          "text": "Le jardinier du champ vient nous demander si nous préparons une saisie. Sabine lui montre le sauf-conduit. Il le lit lentement, revient deux fois sur une ligne. Puis il nous prend la ficelle.",
          "mentions": [
            "fosses"
          ]
        },
        {
          "id": "c4-b13",
          "text": "— Votre encoche, c’est la troisième. La deuxième est là, sous le lichen. J’avais quinze ans quand on a creusé. Je portais les seaux.",
          "mentions": []
        },
        {
          "id": "c4-b14",
          "text": "Sabine gratte. Une marque paraît, un empan plus bas. Elle ne se défend pas. Elle refait toutes ses mesures. Il faudra vingt personnes et une journée ; l’eau pourra ensuite entraîner les sables fins. Le jardinier regarde son champ. Il perdra la moitié de sa récolte si nous ouvrons.",
          "mentions": []
        },
        {
          "id": "c4-b15",
          "text": "— Et en bas ? demande-t-il.",
          "mentions": []
        },
        {
          "id": "c4-b16",
          "text": "— Des maisons, dis-je.",
          "mentions": []
        },
        {
          "id": "c4-b17",
          "text": "Il mâche une tige. Je ne veux pas lui faire choisir devant moi ; pourtant, je ne m’en vais pas.",
          "mentions": []
        },
        {
          "id": "c4-b18",
          "text": "— Vous me donnez un reçu pour les grains. Pas une promesse que vous penserez à moi.",
          "mentions": []
        },
        {
          "id": "c4-b19",
          "text": "Nous n’avons pas le droit de promettre ce paiement. Sabine le dit. Bertille, qui nous a rejoints, ouvre sa sacoche et inscrit la quantité estimée, le nom du jardinier et la perte prévue. Elle précise que sa feuille constate un dommage possible, sans garantir l’indemnité. Il signe quand même. Elle fait une seconde copie.",
          "mentions": [
            "maison-des-mesures"
          ]
        },
        {
          "id": "c4-b20",
          "text": "Au retour, je la vois attacher cette copie au paquet d’un courrier qui part vers les moulins. Le garçon porte le même petit carré blanc sur la poitrine qu’elle sur sa sacoche. Elle me regarde la regarder.",
          "mentions": [
            "bertille",
            "moulins"
          ]
        },
        {
          "id": "c4-b21",
          "text": "— Orane doit savoir qu’il y a un passage.",
          "mentions": []
        },
        {
          "id": "c4-b22",
          "text": "— Elle doit savoir qu’il y a des gens qui acceptent de perdre quelque chose.",
          "mentions": []
        },
        {
          "id": "c4-b23",
          "text": "— C’est écrit aussi.",
          "mentions": []
        },
        {
          "id": "c4-b24",
          "text": "Colas nous attend à bord. L’acheteur est reparti. Quarante pièces auraient payé un lit près des greniers, l’apprentissage d’un autre métier et quelques mois de nourriture. Colas le dit en détachant son amarre. Je remarque qu’il a remis la plaque du bateau, face contre le bois.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c4-b25",
          "text": "— Tu n’as pas vendu.",
          "mentions": []
        },
        {
          "id": "c4-b26",
          "text": "— Il voulait le gouvernail compris.",
          "mentions": []
        },
        {
          "id": "c4-b27",
          "text": "— Un peu normal, pour une barque.",
          "mentions": []
        },
        {
          "id": "c4-b28",
          "text": "— Il n’avait pas besoin de le dire comme ça.",
          "mentions": []
        },
        {
          "id": "c4-b29",
          "text": "Nous mangeons assis autour d’un panier. Colas découpe le pain, mesure chaque part sur le manche de son couteau et se donne la plus petite. Sabine échange la sienne contre la sienne sans commentaire. Bertille les voit faire. C’est la première fois que nous avons l’air d’être quatre à table au lieu de quatre personnes en route.",
          "mentions": [
            "pain-plie"
          ]
        },
        {
          "id": "c4-b30",
          "text": "Quand je viens l’aider à fixer la voile, Colas me montre une petite ligne d’eau entre deux planches. Elle est à peine humide.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c4-b31",
          "text": "— Je voulais partir avant qu’elle ait besoin de moi encore. Tu comprends ? Chaque hiver je me dis : l’an prochain, je vais voir de l’autre côté des plateaux. Puis je change une pièce. Et comme elle est neuve, il faut bien que j’en profite.",
          "mentions": []
        },
        {
          "id": "c4-b32",
          "text": "Je touche la planche qu’il vient de montrer. Elle est tiède de soleil, malgré l’humidité.",
          "mentions": []
        },
        {
          "id": "c4-b33",
          "text": "— Tu aurais pu partir avec elle.",
          "mentions": []
        },
        {
          "id": "c4-b34",
          "text": "— Oui. C’est ce qui m’ennuie le plus dans mon histoire.",
          "mentions": []
        },
        {
          "id": "c4-b35",
          "text": "À l’extrémité du bassin, une petite passerelle nous barre la route. Le garde l’a cadenassée ; les pieds reposent sur deux tenues ternes, sans marque d’épreuve. Colas pourrait coucher le mât et se glisser dessous. Sabine refuse. Nous contournons le bassin en traînant la barque sur des rouleaux prêtés par le jardinier. Une heure de perdue, les épaules meurtries. Une heure pendant laquelle personne ne donne rien d’irréparable.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c4-b36",
          "text": "Sur la pente opposée, les moulins de la ville haute nous apparaissent enfin : cinq grandes roues serrées dans une entaille de roche. Entre elles, un ancien passage a été muré pour porter les greniers. La sortie de notre chenal est libre ; plus haut, son passage disparaît sous toutes ces tonnes de farine.",
          "mentions": [
            "moulins"
          ]
        }
      ],
      "image": "images/chapter-04.webp",
      "alt": "Une barque de bois longe les marches noyées d’anciennes carrières bordées de jardins.",
      "visualDescription": "Plan large horizontal sur les Fosses, anciennes carrières à gradins de craie, bassins verts et escaliers noyés, maisons sur les marches hautes, potagers et céréales attachées par poignées. Colas pousse sa barque au premier plan, Aubine tient un cordage, Sabine et Bertille assises à bord. Après-midi chaud, eau calme dans les bassins, aucune avarie. La plaque de nom du bateau est retournée, aucun lettrage."
    },
    {
      "id": "chapitre-5",
      "number": 5,
      "title": "La chambre des mesures",
      "blocks": [
        {
          "id": "c5-b01",
          "text": "Nous dormons peu, amarrés au quai des moulins. Colas choisit deux points d’attache, vérifie le jeu des cordes, puis laisse la barque à la garde du batelier de poste. À la deuxième aube, les roues nous couvrent de leur ombre, puis de leur eau. Le moulin le plus bas broie de la craie pour les champs ; le suivant écrase les grains. Je le sais parce qu’une femme à la figure blanche nous interdit de confondre les deux poudres. Elle nous offre malgré tout des galettes. Celle de Colas disparaît en deux bouchées ; il affirme qu’il en a gardé une pour la route. Personne ne cherche où.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c5-b02",
          "text": "La chambre des mesures est une petite salle au-dessus des engrenages. Les tasses y dansent sans tomber. Sur le mur, une règle de bois indique le niveau du lac par une corde et un flotteur. Une tige rouge reste immobile au-dessus de l’aiguille. La distance qui les sépare tient dans la largeur de mon pouce.",
          "mentions": [
            "maison-des-mesures"
          ]
        },
        {
          "id": "c5-b03",
          "text": "Orane nous attend là. Son cheval est en sueur dans la cour ; elle a pris la route haute après le rapport de Bertille. Elle nous laisse finir nos galettes avant de poser un cahier sur la table. Je reconnais la couverture : Bertille l’avait chaque soir sur ses genoux.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c5-b04",
          "text": "— Votre groupe continue jusqu’à la forge, dit Orane. Le relevé des Fosses justifie l’essai. Mais il faut d’abord parler du bac.",
          "mentions": []
        },
        {
          "id": "c5-b05",
          "text": "Bertille regarde ma bouche. Je comprends avant qu’Orane ouvre le cahier.",
          "mentions": [
            "bertille",
            "don"
          ]
        },
        {
          "id": "c5-b06",
          "text": "— Tu as écrit ce que j’ai donné.",
          "mentions": []
        },
        {
          "id": "c5-b07",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c5-b08",
          "text": "— Pour qui ?",
          "mentions": []
        },
        {
          "id": "c5-b09",
          "text": "— Pour elle.",
          "mentions": []
        },
        {
          "id": "c5-b10",
          "text": "Elle ne désigne pas Orane. Elle la regarde. Cela rend sa réponse plus dure à entendre. La prévôte tourne le cahier pour que je puisse lire. Mon âge, le lieu, le geste perdu. Puis cette phrase : aucun autre moyen immédiat de bloquer le verrou ; la décision de la donneuse paraît libre, à confirmer hors de la présence de la maîtresse de chantier.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c5-b11",
          "text": "— La maîtresse de chantier, c’est moi, dit Sabine.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c5-b12",
          "text": "— C’était vous aussi au pont des moulins, répond Bertille.",
          "mentions": []
        },
        {
          "id": "c5-b13",
          "text": "Je ne connaissais pas cette voix. Elle n’est pas plus forte, mais elle tient les mots comme on tient un objet brûlant sans vouloir le lâcher.",
          "mentions": []
        },
        {
          "id": "c5-b14",
          "text": "Son père tournait des pots. Pour la tenue du pont, on lui avait proposé six mois de loyer contre son geste de centrage : celui qui empêche la terre de se disperser sur le tour. Six mois de loyer, puis plus de pots réguliers. Il avait signé qu’il donnait librement. Il savait lire. On le lui avait souvent rappelé depuis.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c5-b15",
          "text": "Sabine retire un de ses crayons, le pose sur la table.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c5-b16",
          "text": "— J’ai accepté sa signature.",
          "mentions": []
        },
        {
          "id": "c5-b17",
          "text": "— Vous avez demandé s’il avait bien compris ?",
          "mentions": []
        },
        {
          "id": "c5-b18",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c5-b19",
          "text": "— Et s’il pouvait dire non ?",
          "mentions": []
        },
        {
          "id": "c5-b20",
          "text": "Sabine ne répond pas. Sous le plancher, les meules font vibrer le pied de ma chaise. Je pourrais lui venir en aide avec une question sur le départ. Ce serait facile. Bertille me verrait faire.",
          "mentions": []
        },
        {
          "id": "c5-b21",
          "text": "Orane m’invite à la suivre dans la pièce voisine. Elle me demande si quelqu’un m’a désignée pour donner, si je sais ce que j’ai perdu, si Sabine a exigé autre chose. Je dis non, oui, non. Elle écrit mes réponses et me les relit. Je suis furieuse qu’on me traite comme une enfant ; je serais plus furieuse encore qu’elle ne se donne pas cette peine.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c5-b22",
          "text": "— Vous voulez nous arrêter ?",
          "mentions": []
        },
        {
          "id": "c5-b23",
          "text": "— Je veux savoir à quel prix vous comptez me présenter votre solution.",
          "mentions": []
        },
        {
          "id": "c5-b24",
          "text": "Elle déroule un plan qui ressemble au nôtre, mais il est plus récent. Le chenal traverse bien la gorge des moulins. Deux greniers sont construits sur son ancien lit. Il faudra abattre leurs piliers, arrêter trois roues et mettre à l’abri les réserves qu’on pourra porter. La ville perdra une partie de sa farine et du travail de tout un quartier.",
          "mentions": [
            "moulins",
            "chenal"
          ]
        },
        {
          "id": "c5-b25",
          "text": "— Et vous préférez les maisons du bas, dis-je.",
          "mentions": []
        },
        {
          "id": "c5-b26",
          "text": "— Je préfère perdre les maisons après en avoir sorti les gens que perdre les gens avec toutes les maisons. J’ai vingt-six charrettes, quatre équipes au barrage et aucun étrier dans les mains. Vous avez une hypothèse qui mérite deux jours. Je vous les donne. Je ne lui donne pas la vie de ceux qui attendent en bas.",
          "mentions": []
        },
        {
          "id": "c5-b27",
          "text": "Elle marque sur le plan le seuil d’arrêt : si le flotteur atteint la tige rouge avant que la vanne soit réparée et le passage dégagé, elle ouvre le délestage prévu. Sabine acquiesce. Moi, je veux dire qu’Orane pourrait déplacer sa tige. Je me tais juste assez longtemps pour entendre la stupidité de cette idée.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c5-b28",
          "text": "Dans l’escalier, Bertille me rattrape.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c5-b29",
          "text": "— Je ne t’ai pas dénoncée.",
          "mentions": []
        },
        {
          "id": "c5-b30",
          "text": "— Tu m’as fait parler sans me dire ce que tu écoutais.",
          "mentions": []
        },
        {
          "id": "c5-b31",
          "text": "Elle serre sa sacoche. Ma main va vers la pince qui tient sa sangle. Je pourrais la resserrer. Je la reprends. Bertille retient sa sacoche avant qu’elle tombe.",
          "mentions": []
        },
        {
          "id": "c5-b32",
          "text": "Je m’éloigne jusqu’à la roue de craie. Une enfant apprend à sa grand-mère à nouer un foulard d’une seule main. Elles échouent, rient, recommencent. Il y a des choses qu’on perd sans les donner à personne. Je pense à Bertille, et à ce que j’aurais écrit si j’avais trouvé ma mère dans un cahier de Sabine.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c5-b33",
          "text": "Je rejoins la charpentière derrière le moulin. Elle taille une cale avec son couteau, de longues lamelles très minces. Quand elle a fini, elle les casse toutes au même endroit.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c5-b34",
          "text": "— Tu savais pour son père ?",
          "mentions": []
        },
        {
          "id": "c5-b35",
          "text": "— Je me souvenais du pont. Pas de lui.",
          "mentions": []
        },
        {
          "id": "c5-b36",
          "text": "Cette réponse me fait plus mal que n’importe quel mensonge. Sur la route de la forge, je marche désormais entre deux personnes que je ne sais plus comment regarder.",
          "mentions": []
        }
      ],
      "image": "images/chapter-05.webp",
      "alt": "Cinq grandes roues de moulin occupent une gorge étroite sous des greniers de bois.",
      "visualDescription": "Vue au pied des moulins de la ville haute, cinq roues à aubes successives dans une entaille de roche, bâtiments de pierre claire et greniers en bois au-dessus d’un passage muré. Aubine et ses trois compagnons arrivent à pied ; leurs visages ne montrent aucune dispute. Aube pâle, poussière de farine et eau scintillante. Ne pas représenter les démolitions futures ni le cahier ouvert de Bertille."
    },
    {
      "id": "chapitre-6",
      "number": 6,
      "title": "Ce qui porte encore",
      "blocks": [
        {
          "id": "c6-b01",
          "text": "Le chenal sec passe derrière les moulins, monte vers la gorge, puis rejoint la vieille vanne du lac. Il ne suit pas notre route : il la croise, un peu au-dessus de la taille. Nous entrons sous la voûte par une brèche assez étroite pour obliger Sabine à tourner les épaules. Colas reste dehors avec les sacs. Bertille vient avec nous, sa lampe levée.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c6-b02",
          "text": "La lumière rencontre le plafond et s’y multiplie. Des cristaux longs comme des aiguilles pendent de la roche ; à chacun, une goutte renverse nos visages. Je lève la main. Mille mains se lèvent, petites et patientes. Nous avançons sous une foule qui n’a pas encore appris à marcher.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c6-b03",
          "text": "Sabine souffle la lampe. Pendant un instant, je crois qu’elle vient de tout gâcher. Puis le jour de la brèche prend sa place. Les cristaux, presque transparents sous la flamme, deviennent bleus et roses. Un courant d’air fait trembler les gouttes sans en décrocher aucune. Bertille s’assied sur ses talons, la lampe éteinte entre les genoux. J’oublie de lui en vouloir pendant une respiration entière.",
          "mentions": []
        },
        {
          "id": "c6-b04",
          "text": "Plus loin, un craquement nous arrête. Sabine touche la paroi, nous ordonne de reculer. Une plaque de calcaire se détache à l’endroit où je posais la main. Elle tombe sans fracas, s’enfonce dans le sable avec le bruit mou d’une porte qu’on ferme. Derrière, nous apercevons les anneaux d’un ancien étai, tous cassés dans le même sens.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c6-b05",
          "text": "— C’est ce qui s’est passé à la vanne ?",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c6-b06",
          "text": "Sabine ramasse un morceau. Elle y passe le pouce, puis se coupe. Une goutte tombe sur la craie.",
          "mentions": []
        },
        {
          "id": "c6-b07",
          "text": "— Le bâti devait pouvoir travailler. Se gonfler avec l’eau, se contracter au froid. On l’a tenu trop court.",
          "mentions": []
        },
        {
          "id": "c6-b08",
          "text": "— On ?",
          "mentions": []
        },
        {
          "id": "c6-b09",
          "text": "— Moi.",
          "mentions": []
        },
        {
          "id": "c6-b10",
          "text": "L’ancien étrier permettait de soulever l’axe pour entretenir deux appuis de bois. Il fallait les changer souvent. Sabine avait proposé de les remplacer par des assemblages à tenue. Moins de frottement, moins d’entretien, plus de temps pour les autres ouvrages. Elle avait fait l’épreuve avec la vanne fermée. Sous l’eau, les poutres avaient gonflé ; les anneaux étaient restés immobiles. Le premier hiver, la pierre s’était fendue autour des logements.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c6-b11",
          "text": "— Les poids disaient vrai, dit-elle. Je n’avais pas posé la bonne question.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c6-b12",
          "text": "Elle avait condamné la vanne. On avait démonté l’étrier pour libérer le chantier, muré le chenal sous les moulins, installé le délestage vers Rivebasse. Aucun de ces gestes, pris seul, n’avait eu l’air de décider où vivraient les pauvres douze ans plus tard.",
          "mentions": []
        },
        {
          "id": "c6-b13",
          "text": "— Pourquoi tu n’as pas remis les vieux appuis ?",
          "mentions": []
        },
        {
          "id": "c6-b14",
          "text": "— Les logements étaient abîmés. Il fallait élargir, refaire les semelles. J’ai chiffré. On a refusé. J’aurais dû insister.",
          "mentions": []
        },
        {
          "id": "c6-b15",
          "text": "— Combien de fois ?",
          "mentions": []
        },
        {
          "id": "c6-b16",
          "text": "— Jusqu’à ce que mon rapport dise aussi qui paierait le choix inverse.",
          "mentions": []
        },
        {
          "id": "c6-b17",
          "text": "Je veux qu’elle soit entièrement coupable. Cela me donnerait une personne à laquelle adresser tout. Mais j’ai vu Orane et sa tige rouge, le jardinier et son champ, ma mère devant son panier. Sabine s’essuie le pouce, examine encore le fragment, puis le range. Elle emporte ce qu’elle a fait au lieu de le laisser dans la poussière.",
          "mentions": [
            "sabine",
            "don"
          ]
        },
        {
          "id": "c6-b18",
          "text": "Dehors, Colas a dressé une petite table avec les sacs. Je pose une de mes pinces dessus, glisse un caillou entre les mâchoires, appuie. Les deux branches se séparent en restant jointes à la tête. Sabine me regarde sans parler. Je lui demande pourquoi un appui ne pourrait pas faire pareil : porter l’axe tout en lui laissant un peu de jeu.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c6-b19",
          "text": "— Il pourrait. L’ancien le faisait, par usure. Si nous trouvons de bonnes semelles et assez de place dans les logements.",
          "mentions": []
        },
        {
          "id": "c6-b20",
          "text": "— Alors la pince sert à quelque chose.",
          "mentions": []
        },
        {
          "id": "c6-b21",
          "text": "— La pince te montre quelque chose. Ne lui demande pas de porter une vanne.",
          "mentions": []
        },
        {
          "id": "c6-b22",
          "text": "Je ris, de mauvaise grâce. Elle a raison, ce qui devient fatigant chez les gens qui se sont trompés.",
          "mentions": []
        },
        {
          "id": "c6-b23",
          "text": "Bertille ouvre son cahier. Je crois qu’elle va noter notre conversation. Elle en tire une feuille blanche et me la tend.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c6-b24",
          "text": "— Dessine-la. Pour qu’on ne se souvienne pas chacune d’une pince différente.",
          "mentions": []
        },
        {
          "id": "c6-b25",
          "text": "Je dessine mal. Colas met un doigt sur mon trait, me fait recommencer l’endroit où la charge s’appuie. Sabine ajoute les dimensions à vérifier. Nous avons enfin quelque chose qui ne tient pas dans la tête d’une seule personne.",
          "mentions": []
        },
        {
          "id": "c6-b26",
          "text": "Au col, la Forge des Échos se découvre de l’autre côté d’un pont de planches. Les portes sont ouvertes. Le toit manque par endroits, et les herbes poussent dans la rigole qui amenait l’eau à la roue. Un bruit de marteau nous arrive, régulier, léger. Nous nous arrêtons tous les quatre.",
          "mentions": [
            "forge"
          ]
        },
        {
          "id": "c6-b27",
          "text": "— Tu avais dit abandonnée, murmure Colas.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c6-b28",
          "text": "Sabine écoute. Le marteau frappe encore. Elle retire son sac et me le donne ; son visage a pris l’expression des gens qui ont reconnu une voix. Puis elle traverse seule les premières planches.",
          "mentions": []
        }
      ],
      "image": "images/chapter-06.webp",
      "alt": "Une lumière de jour colore les cristaux d’une voûte où trois voyageuses se tiennent en silence.",
      "visualDescription": "Vue intérieure large du chenal sec, sol sableux et voûte basse couverte de cristaux fins portant des gouttes. Lumière du jour entrant par une brèche latérale, reflets délicats bleus et roses, pas de lumière artificielle surnaturelle. Aubine de profil lève la main ; Sabine debout observe le plafond ; Bertille accroupie tient une lampe éteinte. Colas absent, dehors avec les sacs. Pas d’éboulement montré, atmosphère d’émerveillement tranquille."
    },
    {
      "id": "chapitre-7",
      "number": 7,
      "title": "Le fer au soleil",
      "blocks": [
        {
          "id": "c7-b01",
          "text": "Ce n’est pas un marteau. Une barre de fer pend au bout d’une chaîne rompue ; le vent la balance contre le montant de la porte. Sabine l’arrête avec la paume. Le silence qui suit semble entrer par le toit. Sur l’établi, un gobelet est plein de terre, et dans cette terre une fleur minuscule a poussé.",
          "mentions": [
            "forge"
          ]
        },
        {
          "id": "c7-b02",
          "text": "— Je pensais à quelqu’un, dit-elle.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c7-b03",
          "text": "Je ne demande pas qui. Il y a déjà assez de personnes entre nous. Elle décroche la chaîne, la plie, la pose à l’abri de la pluie. Ce soin pour une maison vide me donne envie de lui reprendre son sac.",
          "mentions": []
        },
        {
          "id": "c7-b04",
          "text": "Nous trouvons l’étrier derrière le four, sous deux roues cassées. Le fer a rouillé en surface, mais les quatre portées sont encore grasses sous leurs bandes de toile. Colas et moi le soulevons avec un manche. Il pèse moins qu’un homme, davantage que ce qu’on veut porter dans une montagne. À côté, dans une boîte à couvercle bombé, les cales ont gardé leurs numéros gravés. Sabine vérifie chaque pièce sur le dessin. Pour la première fois depuis notre départ, elle sourit sans avoir à encourager quelqu’un.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c7-b05",
          "text": "Il ne suffit pas d’avoir trouvé du fer. Nous apportons deux billots sous la presse, y posons l’étrier, puis chargeons l’axe d’essai avec les masses de la forge. Colas roule les plus lourdes ; Bertille les pèse sur le bras gradué. Je chasse les écailles de rouille qui cacheraient une fente. La lumière se déplace sur l’établi. Le jour continue de passer pendant que nous prouvons des choses.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c7-b06",
          "text": "Sabine taille deux semelles dans un reste de bois dur. Ce ne seront pas celles de la vanne : celles-ci tiennent dans ma paume. Elle leur donne un dos arrondi, les pose sur les billots et remet l’axe dessus. Je comprends la pince autrement. Ce n’est pas son ressort qu’il faut copier, mais ses surfaces qui se touchent sans se coller.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c7-b07",
          "text": "Nous poussons de côté. Les semelles roulent d’un rien ; l’axe reste porté. Nous ajoutons des poids. Colas bloque l’un des côtés avec un coin : le bois gémit, puis se fend. Il retire le coin, recommence avec une semelle neuve. Cette fois, le mouvement passe. Bertille inscrit les deux résultats, y compris celui qui nous plaît moins.",
          "mentions": []
        },
        {
          "id": "c7-b08",
          "text": "— Ça prouve que nous pouvons travailler, dit Sabine. Pas que la vanne est sauvée. Là-bas, il faut voir les logements.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c7-b09",
          "text": "Je voudrais déjà repartir en criant. À la place, nous cherchons quatre fortes perches, des sangles et de quoi traîner l’étrier dans les passages lisses. Sabine emporte aussi le petit modèle. J’emporte la semelle cassée. Elle a autant travaillé que l’autre.",
          "mentions": []
        },
        {
          "id": "c7-b10",
          "text": "Derrière le four, Bertille me rejoint. Elle a repris sa sacoche à la main parce que sa sangle lui fait mal.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c7-b11",
          "text": "— Mon père fait les anses, maintenant, dit-elle. Pour une autre potière. Il dit que c’est un métier. J’ai mis du temps à le croire.",
          "mentions": []
        },
        {
          "id": "c7-b12",
          "text": "Je ponce une bavure sur le fer. Elle attend.",
          "mentions": []
        },
        {
          "id": "c7-b13",
          "text": "— Tu aurais dû me parler de ton cahier.",
          "mentions": []
        },
        {
          "id": "c7-b14",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c7-b15",
          "text": "Elle ne me donne pas ses raisons une seconde fois. Je remets ma pince sur sa sangle, sans lui demander de se retourner. Elle continue de regarder le four. Quand je retire les mains, ses épaules descendent un peu.",
          "mentions": []
        },
        {
          "id": "c7-b16",
          "text": "Nous avons deux routes. La crête nous ramènera aux moulins dans la nuit ; de là, la route monte à la retenue. Reprendre le vieux pont gagnerait quatre heures de descente jusqu’au bateau. Colas va sonder les premières planches ; sous son poids, une traverse se soulève. Au bout, les tenues ont été mangées par le gel. À l’aller, Sabine nous avait fait passer un à un, sans autre charge que nos sacs. Avec l’étrier, nous pèserons tous ensemble sur les mêmes planches.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c7-b17",
          "text": "Elle ouvre le coffret. Il reste un anneau vierge. Elle pourrait fixer la traverse, dit-elle. Un passage éprouvé avec nos sacs, puis un à un. Elle a encore des gestes qu’elle pourrait donner.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c7-b18",
          "text": "Je regarde le soleil. Le détour coûtera quatre heures. Peut-être davantage. Je regarde ses mains. Je ne sais pas quels gestes y vivent encore. C’est la première fois que cette ignorance me paraît devoir peser dans une décision.",
          "mentions": []
        },
        {
          "id": "c7-b19",
          "text": "— On porte, dis-je.",
          "mentions": []
        },
        {
          "id": "c7-b20",
          "text": "— La crue n’attendra pas que tu sois satisfaite de nous, répond Sabine.",
          "mentions": []
        },
        {
          "id": "c7-b21",
          "text": "— Alors on va vite. Mais tu ne peux pas payer tous les raccourcis.",
          "mentions": []
        },
        {
          "id": "c7-b22",
          "text": "Colas se place au bout d’une perche. Bertille prend l’autre. Sabine ne nous bénit pas, ne nous remercie pas. Elle vérifie les sangles, passe son épaule dessous et compte trois. L’étrier se lève. Mon manteau tire de travers, une pointe me rentre dans le dos. Notre beau principe pèse terriblement lourd.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c7-b23",
          "text": "Sur la crête, nous nous arrêtons au-dessus du lac. Le soleil descend derrière nous, et le barrage projette ses arches sur une eau immobile. Au-dessus, les oiseaux volent dans le ciel ; en dessous, leurs doubles volent entre les poutres renversées. Il y a deux mondes qui se rejoignent au ras de mes chaussures. Je reste un moment sans sentir la sangle.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c7-b24",
          "text": "Puis une cloche sonne très loin, une seule note qui continue dans la pierre. Bertille compte sur ses doigts. Elle attend la suivante. Quand elle sonne, plus vite qu’elle ne l’espérait, elle nous dit de reprendre la charge.",
          "mentions": []
        }
      ],
      "image": "images/chapter-07.webp",
      "alt": "Dans une forge vide, une petite fleur pousse dans un gobelet posé sur l’établi.",
      "visualDescription": "Plan rapproché large de l’établi d’une forge abandonnée, gobelet d’argile rempli de terre avec une petite fleur blanche. Au second plan, Sabine à la porte arrête une barre pendue à une chaîne ; Aubine et Bertille restent sur le seuil, Colas derrière. Toit incomplet, vieux four froid, outils sombres, soleil d’après-midi. Ne pas montrer l’étrier encore recherché, ni des flammes ni un forgeron vivant."
    },
    {
      "id": "chapitre-8",
      "number": 8,
      "title": "Les lumières sur la rive",
      "blocks": [
        {
          "id": "c8-b01",
          "text": "Nous arrivons au-dessus des moulins dans la nuit. Le bruit de l’eau a pris toute la gorge. Il couvre les roues, les chiens, les gens qui nous répondent depuis le chemin. Des lanternes descendent entre les bâtiments ; les porteurs avancent penchés sous des sacs de farine. Quelqu’un a commencé à vider les greniers.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c8-b02",
          "text": "Colas pose sa perche sans attendre le compte. Je manque de tomber. Il dit pardon, mais il a déjà le visage tourné vers le quai. Nous laissons l’étrier sous un auvent et le suivons. À l’endroit où il avait attaché sa barque, une amarre flotte entre deux débris de planches. Le taquet a arraché un morceau du quai.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c8-b03",
          "text": "Un garde nous explique que les ravines ont débordé après l’orage, plus haut. Le barrage tient encore ; cette eau-ci arrive dans la rivière en dessous de lui. Orane a fait sonner l’évacuation des rives dès les premiers grondements. Les charrettes roulent depuis le soir. Le garde parle fort pour être entendu, puis cesse : Colas est entré dans l’eau.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c8-b04",
          "text": "Il n’a que de l’eau aux chevilles, puis jusqu’aux genoux. Sa barque est en travers d’une grille, deux longueurs plus bas, prise sous un tronc. Elle n’est pas entière. Il continue pourtant, la main tendue vers la proue. Je lui agrippe la ceinture. Il me repousse sans se retourner.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c8-b05",
          "text": "— Le bateau ne va pas s’en aller davantage, je lui crie.",
          "mentions": []
        },
        {
          "id": "c8-b06",
          "text": "C’est faux. À cet instant, le tronc pivote. Une planche se soulève, casse au milieu. Le bateau s’en va davantage.",
          "mentions": []
        },
        {
          "id": "c8-b07",
          "text": "Je veux appeler Sabine. Je mets deux doigts dans ma bouche, comme je l’ai fait toute ma vie, et l’absence de son me frappe avec une violence neuve. Alors je hurle son nom. Ma voix ordinaire existe encore. Je la trouve laide, énorme, et elle fait venir Sabine, un garde et deux meunières.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c8-b08",
          "text": "Nous sortons Colas à plusieurs. Il a réussi à ramener la plaque de proue, arrachée à ses deux vis. Il me la met dans les mains pour pouvoir s’asseoir. Le bois porte un nom peint en jaune : Assez loin. Je ne l’avais encore jamais lu.",
          "mentions": []
        },
        {
          "id": "c8-b09",
          "text": "Du parapet, on voit Rivebasse entre deux bras de la gorge. Le lavoir n’a plus de toit. Les montants se dressent hors de l’eau, et la fenêtre de notre chambre est noire. Je cherche une lumière à côté, une personne, un drap connu. Les choses que je reconnais sont celles qui manquent.",
          "mentions": [
            "rivebasse",
            "lavoir"
          ]
        },
        {
          "id": "c8-b10",
          "text": "Ma mère me trouve avant que je la trouve. Elle monte l’escalier derrière un charretier, un panier dans chaque main : le sien et celui d’une voisine. Elle pose les deux sur la même marche et me serre si fort que la boucle de sa ceinture me rentre dans le ventre.",
          "mentions": [
            "mado"
          ]
        },
        {
          "id": "c8-b11",
          "text": "— Tu devais prendre la charrette.",
          "mentions": []
        },
        {
          "id": "c8-b12",
          "text": "— Je l’ai prise. Tu vois bien, je suis en haut.",
          "mentions": []
        },
        {
          "id": "c8-b13",
          "text": "— Le lavoir…",
          "mentions": []
        },
        {
          "id": "c8-b14",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c8-b15",
          "text": "Elle ne dit pas que ce n’est que du bois. Elle a tenu ce bois propre, travaillé dessus, attendu son tour d’eau, juré quand les autres oubliaient de rincer. Elle remet mon col. C’est encore une façon de travailler quand elle ne peut rien réparer.",
          "mentions": [
            "mado"
          ]
        },
        {
          "id": "c8-b16",
          "text": "J’ouvre son panier. Le nécessaire de ma table est là, la boîte de boutons, le petit métier de reprise démonté. Elle a laissé nos couvertures. Je me mets à pleurer à cause d’une boîte de boutons, et cela ne m’étonne même pas. Mado referme le panier sans l’emporter plus loin. Nous restons assises une minute sur la marche, gênant les gens pressés qui choisissent de nous contourner.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c8-b17",
          "text": "Orane arrive en bas de l’escalier. Je descends avant qu’elle ait le temps de parler.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c8-b18",
          "text": "— Vous aviez promis quatre jours.",
          "mentions": []
        },
        {
          "id": "c8-b19",
          "text": "— La pluie ne me les a pas promis. Les rues basses sont vidées ; je fais compter les arrivants. Votre quartier des maisons tient encore, sauf le bord du lavoir. Il reste à empêcher le lac de finir ce que la rivière a commencé.",
          "mentions": []
        },
        {
          "id": "c8-b20",
          "text": "Je voudrais la gifler. Je regarde ses mains couvertes de poussière de farine. Elle me tend une feuille : les premiers relevés des logements de la vanne, faits par son équipe pendant notre absence. Elle a travaillé pour notre hypothèse. Je prends la feuille, avec toute ma colère encore dedans.",
          "mentions": []
        },
        {
          "id": "c8-b21",
          "text": "Sabine vérifie les mesures contre l’étrier. Les logements peuvent être repris sans démolir les flancs. Les semelles devront être plus larges que celles du modèle, taillées dans le bois de la réserve des moulins. Il manque surtout des bras ; les équipes de la retenue ne peuvent pas quitter les prises qui craquent.",
          "mentions": [
            "sabine",
            "etrier"
          ]
        },
        {
          "id": "c8-b22",
          "text": "Colas se lève. Il pose la plaque de son bateau dans le panier de ma mère, à côté des boutons.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c8-b23",
          "text": "— Je sais équarrir.",
          "mentions": []
        },
        {
          "id": "c8-b24",
          "text": "— Tu dois te sécher, dit Sabine.",
          "mentions": []
        },
        {
          "id": "c8-b25",
          "text": "— Je peux le faire en équarrissant.",
          "mentions": []
        },
        {
          "id": "c8-b26",
          "text": "Elle ne discute pas avec lui. Elle demande à une meunière de lui trouver des vêtements. Bertille ferme la liste des arrivants : chacun des habitants du bord du lavoir a répondu à l’appel. Alors seulement ma mère ramasse ses paniers.",
          "mentions": []
        },
        {
          "id": "c8-b27",
          "text": "Je suis partie pour lui rendre notre maison. À présent, même si nous gagnons, elle ne sera pas la même. Je pose la main sur l’étrier, froid sous l’auvent. Il faut encore le porter, et je ne peux plus me raconter qu’il nous ramènera au matin d’avant.",
          "mentions": [
            "aubine"
          ]
        }
      ],
      "image": "images/chapter-08.webp",
      "alt": "Quatre silhouettes portent un étrier de fer sur des perches au-dessus de moulins éclairés dans la nuit.",
      "visualDescription": "Plan large depuis le chemin de crête, de nuit bleue, Aubine, Sabine, Bertille et Colas portent ensemble un lourd U de fer à pieds recourbés suspendu à quatre perches par des sangles. En contrebas, moulins encore entiers, lanternes et silhouettes de porteurs de sacs. Eau agitée mais pas de bateau détruit ni de lavoir ruiné visible : image d’arrivée avant la révélation des pertes. Colas porte encore sa veste bleu pétrole."
    },
    {
      "id": "chapitre-9",
      "number": 9,
      "title": "Les mains disponibles",
      "blocks": [
        {
          "id": "c9-b01",
          "text": "Au petit jour, la retenue ressemble à un bâtiment qui respire mal. Entre les grandes arches, les poutres gémissent à des intervalles irréguliers. Les équipes ont tracé des repères à la craie sur chaque joint. Quand deux traits se séparent, un ouvrier appelle un autre ouvrier ; personne ne court tant que personne n’a dit pourquoi.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c9-b02",
          "text": "Orane nous attend près de la vieille vanne, du côté du chenal. La tige rouge a été reportée ici, sur une règle reliée au même niveau d’eau. Il reste deux doigts avant le seuil. Le temps, après avoir été des jours puis des heures, devient de la place sur une règle.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c9-b03",
          "text": "L’étrier entre dans les logements. Nous l’essayons sans charger l’axe. Sabine vérifie les pieds, refait les calages, laisse le chef d’équipe vérifier à son tour. Il n’est pas d’accord avec l’une des semelles. Colas la reprend. Je m’impatiente, puis je vois qu’il a trouvé un nœud dans le bois juste à l’endroit où la charge aurait porté.",
          "mentions": [
            "sabine",
            "etrier"
          ]
        },
        {
          "id": "c9-b04",
          "text": "Au poste de garde, les voisins attendent qu’on leur dise quoi faire. Certains ont des pelles. D’autres se frottent les doigts d’une façon qui me déplaît. Un vieil homme demande s’il faut encore des donneurs. Il sait nouer les filets, dit-il, de quatre manières. Son fils en connaît deux et cela leur suffirait.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c9-b05",
          "text": "— On a surtout besoin de porter du bois, répond Sabine.",
          "mentions": []
        },
        {
          "id": "c9-b06",
          "text": "Il paraît presque déçu. On nous a tellement appris le prix des grandes choses que nous ne savons plus où nous mettre quand on demande simplement des épaules.",
          "mentions": []
        },
        {
          "id": "c9-b07",
          "text": "Je prends le modèle de la forge et le pose sur un tonneau. Des gens se rapprochent. Je ne monte pas dessus : je serais incapable de parler de là-haut. Je fais rouler la petite semelle sous l’axe et montre la pièce cassée.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c9-b08",
          "text": "— Il faut porter ici, et laisser bouger là. Nous avons éprouvé le modèle. Maintenant, il faut tailler les grandes pièces, vider les derniers dépôts du chenal et finir de sortir la farine. Si le niveau arrive au trait rouge trop tôt, on arrête.",
          "mentions": []
        },
        {
          "id": "c9-b09",
          "text": "Une voisine me demande si j’accepte vraiment qu’on ouvre le délestage sur nos maisons en cas d’échec. Elle a gardé sur sa manche les épingles de sa lessive interrompue. Je baisse les yeux vers elles. Je voudrais une réponse qui ne ressemble pas à celle d’Orane.",
          "mentions": [
            "rivebasse"
          ]
        },
        {
          "id": "c9-b10",
          "text": "— Oui. Si on ne peut plus empêcher la chute du barrage, oui.",
          "mentions": []
        },
        {
          "id": "c9-b11",
          "text": "Elle me regarde longtemps. Puis elle pose son panier contre le tonneau et prend la première perche.",
          "mentions": []
        },
        {
          "id": "c9-b12",
          "text": "Bertille vient se placer à côté de moi. Elle sort son cahier, montre le petit carré blanc de sa sacoche.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c9-b13",
          "text": "— La prévôte m’avait chargée de relever aussi les dons de gestes. Je l’ai fait sans le dire à mes compagnons. À partir de maintenant, c’est affiché. Toute personne qui envisage un don peut venir me parler sans son chef d’équipe. Vous pouvez refuser, même après avoir accepté. Cela ne change ni votre place sur une charrette, ni votre ration, ni le paiement de votre travail.",
          "mentions": []
        },
        {
          "id": "c9-b14",
          "text": "Un maître meunier dit que Bertille n’a pas autorité pour garantir le paiement. Orane prend la feuille qu’elle vient d’écrire, la lit et la signe sur le tonneau. Puis elle en fait afficher une copie au poste et une aux moulins. La solde du chantier sera la même pour les déplacés et les ouvriers de la ville. Le maître meunier regarde sa signature plus longtemps que le reste.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c9-b15",
          "text": "— Et les greniers ? demande-t-il.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c9-b16",
          "text": "— Ils doivent être vidés. Leurs piliers tomberont si la vanne s’ouvre.",
          "mentions": []
        },
        {
          "id": "c9-b17",
          "text": "— Vous allez affamer la ville pour leurs maisons.",
          "mentions": []
        },
        {
          "id": "c9-b18",
          "text": "Il désigne le bas sans nous regarder. Orane l’emmène devant la coupe du lac. Elle lui montre les fondations des moulins et ce qui arrivera si la retenue cède. Il reste hostile. Elle ne le fait pas taire ; elle lui demande combien de sacs ses équipes peuvent encore monter. Il répond un nombre. Elle inscrit ce nombre.",
          "mentions": []
        },
        {
          "id": "c9-b19",
          "text": "Les premiers travailleurs des Fosses arrivent par le chenal. Ils ont déblayé le dépôt depuis la veille, dès qu’Orane a confirmé le chantier. Le jardinier porte une pelle trop grande pour lui. Il cherche Bertille afin de faire corriger la quantité de grain perdue : il a sauvé davantage d’épis qu’il ne pensait. Je le regarde modifier à la baisse ce qu’on pourrait lui devoir, puis il demande très fermement où se prend le repas.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c9-b20",
