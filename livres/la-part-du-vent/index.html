  "cover": {

    "catalogImage": "couvertures/la-part-du-vent.webp",
    "alt": "Aubine, un manteau couleur de rouille sur les épaules, tient une pince de bois devant des ponts suspendus au-dessus d’une vallée lumineuse."

  "chapters": [
    {
      "id": "chapitre-1",
      "number": 1,
      "title": "Le linge qui reste",
      "blocks": [
        {
          "id": "c1-b01",
          "text": "La première chose que je sauve de la rivière est un drap qui ne nous appartient pas. La seconde est une enfant, et ma mère me reprochera longtemps cet ordre. Pour le drap, je n’ai eu qu’à tendre le bras. Pour l’enfant, il faut que je lâche la corde.",
          "mentions": [
            "aubine",
            "pinces"
          ]
        },
        {
          "id": "c1-b02",
          "text": "Elle pend sous le lavoir, accrochée à une traverse dont le bout s’en va avec l’eau. Je vois ses quatre doigts, puis trois. Le drap claque contre mes jambes. Une pince de frêne me reste dans la bouche ; j’ai le goût du linge propre et du bois mâchonné.",
          "mentions": [
            "lavoir"
          ]
        },
        {
          "id": "c1-b03",
          "text": "— Maman, la perche.",
          "mentions": [
            "mado"
          ]
        },
        {
          "id": "c1-b04",
          "text": "Ma mère a déjà compris. Elle couche sa longue perche à linge sur les dalles, passe son pied dessus. Je noue le drap autour de ma taille. Je ne sais pas faire un beau nœud de batelière, mais je sais tirer sur une couture pour voir où elle lâchera. Je tire. Elle tient.",
          "mentions": []
        },
        {
          "id": "c1-b05",
          "text": "La traverse est prise dans un anneau jaune. Au milieu de l’anneau, une fissure montre une petite bouche noire. Quelqu’un a donné un geste pour que ce bois reste là, un geste qu’il ne refera plus jamais. La rivière se moque de ce que cela lui a coûté.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c1-b06",
          "text": "— Tu peux me regarder ?",
          "mentions": []
        },
        {
          "id": "c1-b07",
          "text": "L’enfant ouvre les yeux. Elle a perdu une chaussure. Je lui tends le coin du drap, mais elle refuse de lâcher la traverse. Alors je descends encore. La corde de séchage, retenue par ma mère, se tend sous mes aisselles. Le froid entre dans mon tablier avec une violence qui me coupe la voix.",
          "mentions": []
        },
        {
          "id": "c1-b08",
          "text": "Je passe le drap sous le ventre de l’enfant. Il faudrait une troisième main pour tenir les deux épaisseurs le temps de les nouer. J’ai une pince. Je la retire de ma bouche, rassemble le tissu, enfonce les mâchoires de bois. Ce n’est pas solide. C’est assez pour une seconde. Une seconde, c’est parfois une troisième main.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c1-b09",
          "text": "— Maintenant, tu lâches.",
          "mentions": []
        },
        {
          "id": "c1-b10",
          "text": "Elle secoue la tête. La traverse descend d’un doigt. Je n’ai rien de rassurant à lui raconter.",
          "mentions": []
        },
        {
          "id": "c1-b11",
          "text": "— Je m’appelle Aubine. Si on tombe, tu pourras crier mon nom.",
          "mentions": []
        },
        {
          "id": "c1-b12",
          "text": "Elle lâche. Le poids nous entraîne ; le nœud mord ma taille. Au-dessus, ma mère pousse un bruit qu’elle garde d’ordinaire pour les baquets trop pleins. Quelqu’un vient l’aider. Nous remontons en cognant la pierre, l’enfant et moi, liées comme deux mauvaises pièces de toile.",
          "mentions": []
        },
        {
          "id": "c1-b13",
          "text": "Sur les dalles, elle se met à pleurer. Je vérifie machinalement la couture du drap. Déchirée. Trois jours de reprise, et le propriétaire marchandera encore. Voilà ma pensée héroïque. J’ai dix-sept ans, les genoux bleus et un métier qui me suit jusque dans une rivière.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c1-b14",
          "text": "Le garçon qui a aidé ma mère nous jette sa veste. Je le reconnais à ses chaussures : même cuir sur les deux pieds, luxe rare chez les bateliers, mais les semelles cousues avec du fil de voile. Colas. Il fait passer les légumes jusqu’à la ville haute et revient avec des caisses qu’il prétend toujours vides.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c1-b15",
          "text": "— La prochaine fois, dit-il, choisis un drap moins cher.",
          "mentions": []
        },
        {
          "id": "c1-b16",
          "text": "Je ris. Cela me fait mal entre les côtes. L’enfant nous regarde comme deux personnes d’un autre pays.",
          "mentions": []
        },
        {
          "id": "c1-b17",
          "text": "Puis le bruit change. Ce ne sont plus les gens qui accourent, c’est le bâton du crieur sur les pavés de Rivebasse. Trois coups, une attente, trois coups. L’enfant cesse de pleurer. Tout le monde connaît ce rythme-là, même sans l’avoir entendu : on l’apprend aux exercices de crue.",
          "mentions": [
            "rivebasse"
          ]
        },
        {
          "id": "c1-b18",
          "text": "Une jeune femme en manteau bleu descend les marches. Elle porte une sacoche blanche, tenue haut sous son bras pour éviter les éclaboussures. Deux gardes restent au débouché de la ruelle. La jeune femme ne regarde pas mes jambes nues ni le drap. Elle regarde l’anneau brisé qui tourne encore au bout de la traverse.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c1-b19",
          "text": "— Ordre de la prévôte Orane. À compter de la quatrième cloche du quatrième jour, les maisons sous la borne rouge seront évacuées. Le délestage du lac commencera avant la nuit.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c1-b20",
          "text": "— La borne rouge, répète ma mère.",
          "mentions": []
        },
        {
          "id": "c1-b21",
          "text": "Il y a un trait rouge au-dessus de notre porte. Je croyais qu’on le repeignait chaque année pour mesurer l’humidité. Je comprends pourquoi le peintre avait eu l’air gêné, cette fois.",
          "mentions": []
        },
        {
          "id": "c1-b22",
          "text": "— Des places sont réservées sur les charrettes, dit la messagère. Je m’appelle Bertille. Je reviendrai pour les personnes qui ne peuvent pas monter seules.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c1-b23",
          "text": "Elle dit cela simplement, et je la déteste moins que je ne voudrais. Ma mère demande combien de paniers. Un seul par personne, répond Bertille. Les animaux seront regroupés. Les outils longs voyageront à part si la place le permet.",
          "mentions": []
        },
        {
          "id": "c1-b24",
          "text": "Dans notre chambre, tout tient sur quatre patères et une table. Pourtant, je n’arrive pas à trouver par quel bout on met une vie dans un panier. Ma mère essore sa manche. Depuis qu’une tenue lui a pris son geste de tressage, elle ferme nos pains en les repliant, comme des paquets. Elle les rate quand elle est fatiguée. Moi, je raccommode les draps ; mon point de reprise est si régulier qu’elle doit le chercher à contre-jour. Nous avons mis des années à nous partager cela.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c1-b25",
          "text": "Les voisins se dispersent. La mère de l’enfant arrive en courant, reprend sa fille, me touche l’épaule sans trouver de parole. Colas récupère sa veste. Je retourne près de l’eau. Ma pince s’est coincée dans la grille, une mâchoire cassée. Je la repêche.",
          "mentions": [
            "lavoir"
          ]
        },
        {
          "id": "c1-b26",
          "text": "Sur le montant, la marque de la crue précédente est à hauteur de ma cheville. Celle que les gardes viennent de tracer me dépasse de deux têtes.",
          "mentions": []
        }
      ]
    },
    {
      "id": "chapitre-2",
      "number": 2,
      "title": "Une place sur la charrette",
      "blocks": [
        {
          "id": "c2-b01",
          "text": "La Maison des mesures sent la cire et la soupe. C’est une chose agaçante : j’avais préparé ma colère pour un endroit où les riches ne mangeraient rien d’aussi ordinaire. Une femme remue la marmite du poste de garde. Je me demande si elle salera avant de servir, comme nous, ou si chacun pourra choisir.",
          "mentions": [
            "maison-des-mesures"
          ]
        },
        {
          "id": "c2-b02",
          "text": "Sabine m’attend devant la porte de la salle. Elle est large, grise, un crayon derrière chaque oreille, et elle tient à la main le reçu de sa dernière amende. On l’a condamnée pour avoir réparé sans autorisation un escalier public. Elle avait bien demandé l’autorisation. L’escalier n’avait pas attendu la réponse pour tomber.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c2-b03",
          "text": "— J’ai apporté ta pince, lui dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b04",
          "text": "— J’avais demandé l’anneau.",
          "mentions": []
        },
        {
          "id": "c2-b05",
          "text": "— Il est au fond de l’eau. La pince, c’est ce qui a marché.",
          "mentions": []
        },
        {
          "id": "c2-b06",
          "text": "Elle la prend quand même. Sabine faisait autrefois des ponts. Aujourd’hui elle redresse les portes que les maisons de Rivebasse serrent entre leurs murs. Je lui apporte parfois les fers de mon petit métier à reprendre, et elle me paie pour recoudre ses poches. Nous sommes clientes l’une de l’autre ; elle dit que c’est plus sain que d’être reconnaissantes.",
          "mentions": []
        },
        {
          "id": "c2-b07",
          "text": "Orane se tient debout derrière une table où il n’y a pas assez de place pour ses cartes. Elle a roulé ses manches ; une tache de soupe marque son poignet. Trois gens parlent à la fois. Elle en fait taire deux, écoute le troisième jusqu’au bout, puis déplace un caillou blanc d’un côté de la carte à l’autre.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c2-b08",
          "text": "— Vous avez quatre jours, dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b09",
          "text": "— Trois jours et une matinée, répond-elle. Et vous venez d’en employer une partie à attendre devant ma porte. Que proposez-vous ?",
          "mentions": []
        },
        {
          "id": "c2-b10",
          "text": "Elle ne sourit pas. Je pose ma pince cassée. Sabine pose un dessin. Sur le mur, une coupe du lac montre la grande retenue, un assemblage de poutres et de pierre, entre deux falaises. La neige a fondu trop tôt sur les plateaux ; la pluie n’a pas cessé derrière les crêtes. Les anneaux du barrage blanchissent sous la charge. Orane nous montre le dernier relevé. Deux prises ont lâché dans la nuit. Si le barrage tombe, l’eau emportera les quartiers bas et les fondations de la ville haute.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c2-b11",
          "text": "— Ouvrir le chenal de la carrière, dit Sabine.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c2-b12",
          "text": "— Condamné depuis douze ans. Sur votre rapport.",
          "mentions": []
        },
        {
          "id": "c2-b13",
          "text": "Le silence qui suit n’est pas vide. Il a la forme du dos de Sabine, devenu très droit.",
          "mentions": []
        },
        {
          "id": "c2-b14",
          "text": "— La vanne peut se reprendre. Il faut rapporter son étrier. Il est resté à la Forge des Échos.",
          "mentions": []
        },
        {
          "id": "c2-b15",
          "text": "Elle dessine un U avec deux pieds recourbés. C’est une pièce de fer qui tient l’axe de la vanne pendant qu’on change ses appuis. Sans elle, le battant peut s’abattre sur les ouvriers. Les dimensions ne se devinent pas ; les logements sont taillés dans la pierre. La forge possède l’étrier ajusté pour cette vanne et les cales qui vont avec. En fabriquer un autre prendrait davantage de temps que d’aller le chercher.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c2-b16",
          "text": "— On ne passe plus par le pont de la carrière, dit Orane.",
          "mentions": [
            "orane"
          ]
        },
        {
          "id": "c2-b17",
          "text": "— Par les vergers, puis le bac. Deux jours jusqu’à la forge, un pour revenir par les crêtes.",
          "mentions": []
        },
        {
          "id": "c2-b18",
          "text": "— Et vous voulez mettre Rivebasse en attente d’un objet qui a peut-être rouillé, avec une vanne que vous avez déclarée dangereuse ?",
          "mentions": []
        },
        {
          "id": "c2-b19",
          "text": "Je regarde les cailloux. Quatre blancs serrés dans un carré, un rouge en bas. Notre maison ne mérite même pas son propre caillou.",
          "mentions": []
        },
        {
          "id": "c2-b20",
          "text": "— Je veux que vous essayiez autre chose avant de la noyer.",
          "mentions": []
        },
        {
          "id": "c2-b21",
          "text": "Orane enlève sa main de la carte.",
          "mentions": []
        },
        {
          "id": "c2-b22",
          "text": "— Moi aussi. Mais je dois faire monter ceux qui y vivent pendant que vous essayez. Votre mère aura une place. Quoi que vous décidiez.",
          "mentions": []
        },
        {
          "id": "c2-b23",
          "text": "Bertille entre avec une brassée de feuilles. Elle s’arrête en reconnaissant Sabine. Quelque chose passe entre elles que je prends pour de l’hostilité. La prévôte donne à Sabine un sauf-conduit, valable jusqu’au soir du troisième jour. Il autorise notre passage, pas l’ouverture de la vanne. Bertille nous accompagnera ; elle connaît les postes et doit relever les niveaux d’eau sur la route.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c2-b24",
          "text": "Nous trouvons Colas devant son bateau. Il a reçu notre visite par avance : sa barque est chargée de perches, de pain et d’un paquet ficelé qui ressemble à des habits propres. Il a dix-neuf ans et assez d’orgueil pour se faire passer pour un homme surpris par sa propre bonté.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c2-b25",
          "text": "— Je vais de toute façon aux Fosses. On m’achète la barque là-bas. Après, je monterai travailler aux greniers.",
          "mentions": []
        },
        {
          "id": "c2-b26",
          "text": "Il tapote le bordage. Je l’ai vu remplacer chaque planche. Sur l’avant, le nom du bateau a été poncé. Je fais semblant de ne pas le remarquer.",
          "mentions": []
        },
        {
          "id": "c2-b27",
          "text": "Ma mère ne me retient pas. C’est pire : elle vérifie le fond de mes chaussures, refait le paquet de pain, trouve trois pinces entières dans le tiroir. Elle me les glisse dans la poche du manteau rouille, celui que j’ai retaillé dans deux manteaux différents.",
          "mentions": [
            "mado",
            "pinces"
          ]
        },
        {
          "id": "c2-b28",
          "text": "— Tu sauveras peut-être moins de draps là-haut.",
          "mentions": []
        },
        {
          "id": "c2-b29",
          "text": "Je voudrais lui promettre la maison. Je pourrais le faire ; j’ai une bouche, comme tous ceux qui promettent.",
          "mentions": []
        },
        {
          "id": "c2-b30",
          "text": "— Tu prends la charrette, dis-je.",
          "mentions": []
        },
        {
          "id": "c2-b31",
          "text": "— Je prends la charrette.",
          "mentions": []
        },
        {
          "id": "c2-b32",
          "text": "Elle tire mon aiguille de la pelote, en vérifie la pointe contre son ongle. Puis elle la remet dans mon nécessaire. Ce geste, elle peut encore le faire. Je connais trop bien la liste des autres pour ne pas voir celui-là.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c2-b33",
          "text": "— Ne leur laisse pas décider ce que tes mains peuvent perdre.",
          "mentions": []
        },
        {
          "id": "c2-b34",
          "text": "Je l’embrasse avec de la colère qui n’est pas pour elle. Au bout du quai, Sabine s’appuie sur le dessin de l’étrier pour expliquer le chargement. Bertille a déjà mis un pied à bord. Je descends les marches et le bateau s’écarte avant que j’aie fini d’avoir peur de partir.",
          "mentions": []
        }
      ]
    },
    {
      "id": "chapitre-3",
      "number": 3,
      "title": "Les fruits de la nuit",
      "blocks": [
        {
          "id": "c3-b01",
          "text": "Aux vergers suspendus, on ne cueille pas les fruits en levant la main. On la baisse dans le ciel. Les arbres poussent sur des terrasses si étroites que leurs branches franchissent le bord ; dessous, des filets recueillent les poires tombées. Le bateau nous dépose au pied du chemin, puis Colas le mène jusqu’au bac où nous devons le rejoindre. Nous montons avec des paniers vides sur le dos : le sauf-conduit ne dispense pas de payer le passage en portant quelque chose.",
          "mentions": [
            "vergers"
          ]
        },
        {
          "id": "c3-b02",
          "text": "Sabine s’arrête près d’un garde-corps. Elle frappe du doigt l’anneau qui unit le bois à la pierre. Le son est net, presque gai.",
          "mentions": [
            "sabine",
            "tenues"
          ]
        },
        {
          "id": "c3-b03",
          "text": "— À quoi tu reconnais une tenue sûre ?",
          "mentions": []
        },
        {
          "id": "c3-b04",
          "text": "— Elle sonne bien.",
          "mentions": []
        },
        {
          "id": "c3-b05",
          "text": "— Ça, c’est un pot intact. Une tenue sûre a été chargée de sacs avant d’être chargée de gens. Il faut chercher la marque d’épreuve.",
          "mentions": []
        },
        {
          "id": "c3-b06",
          "text": "Elle me montre trois encoches sous la glaçure. Les anneaux ne savent pas si une personne a donné un geste précieux ou sans importance. Ils savent seulement tenir, jusqu’à une certaine charge qu’on mesure. Les plus pauvres offrent souvent les gestes les plus utiles : ils n’en ont pas beaucoup d’autres. Sabine me le dit sans lever la voix. Je pense au pain plat de ma mère.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c3-b07",
          "text": "— Alors pourquoi ils tiennent les ponts avec ça ?",
          "mentions": []
        },
        {
          "id": "c3-b08",
          "text": "— Parce qu’un anneau fait en une heure peut remplacer un mois de charpente. Le premier mois, c’est merveilleux. Ensuite, quelqu’un décide qu’on n’a plus besoin de charpentiers.",
          "mentions": []
        },
        {
          "id": "c3-b09",
          "text": "Bertille marche derrière nous. Ses bottes ont le talon usé du côté gauche. Elle compte les marches par groupes de vingt, à voix si basse que je ne l’entends que lorsque le vent tombe. Je lui demande si c’est pour ses relevés.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c3-b10",
          "text": "— Pour ne pas regarder en bas.",
          "mentions": []
        },
        {
          "id": "c3-b11",
          "text": "Je croyais que la peur donnait de meilleures raisons de se taire. Je lui montre comment fixer la sangle de son panier avec une pince : elle cessera de lui cisailler le cou. Elle me remercie, et cela m’embarrasse.",
          "mentions": []
        },
        {
          "id": "c3-b12",
          "text": "Nous atteignons le pressoir à la nuit. La femme qui nous reçoit exige qu’on attende dehors pendant qu’elle finit de coucher les petits. Alors le verger s’allume. Une lumière verte apparaît dans une poire, puis dans une autre, à l’intérieur de la chair. Des insectes minuscules en sortent par les trous de guêpe. Ils vont d’une branche à l’autre, traçant des coutures qui ne restent pas. Sous les filets, leurs reflets flottent dans le vide ; on croirait les racines tournées vers les étoiles.",
          "mentions": [
            "veilleuses"
          ]
        },
        {
          "id": "c3-b13",
          "text": "Je ne parle pas. Pour une fois, je ne cherche même pas ce qui tient.",
          "mentions": []
        },
        {
          "id": "c3-b14",
          "text": "Bertille retire sa capuche. Elle a de courtes boucles noires collées aux tempes. Un insecte se pose sur son sourcil, l’éclaire comme une idée. Elle souffle vers le haut sans oser bouger. Je voudrais que ma mère voie cela. Je voudrais voir quelque chose sans devoir aussitôt le rapporter à quelqu’un qui n’y est pas.",
          "mentions": []
        },
        {
          "id": "c3-b15",
          "text": "On nous sert des poires rôties dans une soupe de grains, avec du pain plié. Je reconnais le pli de ma mère dans celui d’une inconnue et cela me repose. La femme du pressoir n’a rien donné à une tenue ; elle fait le pain ainsi parce que cela cuit plus vite. Il existe donc un endroit où notre pain n’est le souvenir de rien.",
          "mentions": [
            "pain-plie"
          ]
        },
        {
          "id": "c3-b16",
          "text": "Au matin, le bac n’est plus dans l’alignement des deux rives. Sa corde amont s’est allongée pendant la nuit, ou l’un des ancrages a bougé. Colas est là, sa barque attachée derrière la plateforme. Le passeur refuse de faire traverser les paniers tant que les passagers ne sont pas descendus. Sabine l’approuve. Nous montons seuls, avec notre sac de ferraille et les provisions.",
          "mentions": [
            "bac"
          ]
        },
        {
          "id": "c3-b17",
          "text": "Le courant prend la plateforme par-dessous. Le passeur crie à Colas de détacher sa barque pour la mener à l’abri. Bertille s’assied d’un coup. Son visage devient aussi blanc que sa sacoche. Je lui donne la main ; elle me la broie avec beaucoup de politesse.",
          "mentions": []
        },
        {
          "id": "c3-b18",
          "text": "Puis le verrou de la poulie saute. Pas la corde, pas l’ancrage : une cheville grosse comme mon petit doigt. La plateforme tourne, le bord s’enfonce. Le passeur pousse la barre de sécurité avec son épaule. Sabine ouvre son coffret. Il y a dedans deux anneaux neufs, un poinçon et un petit morceau de craie.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c3-b19",
          "text": "— Il faut fixer le verrou, dit-elle. Je peux tenir la barre. Aubine, prends l’anneau.",
          "mentions": []
        },
        {
          "id": "c3-b20",
          "text": "Je ne l’ai jamais fait. Je sais comment on fait : tout le monde le sait. On appuie la céramique entre les deux pièces, on y trace la fermeture avec un geste volontaire, appris, qu’on laissera dedans. C’est la chose qu’on sait avant de savoir écrire son nom.",
          "mentions": []
        },
        {
          "id": "c3-b21",
          "text": "— Un geste entier, dit Sabine. Que tu pourrais faire les yeux fermés. Pas un mouvement au hasard. Et personne ici ne choisit pour toi.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c3-b22",
          "text": "La barre glisse sur son épaule. Elle a donné assez de gestes pour connaître ce qui lui reste, mais pas le temps d’en essayer un dans cette position. Bertille vomit par-dessus le bord. Le passeur a ses deux bras pris dans la corde. Colas, loin déjà, ramène la barque contre le courant.",
          "mentions": []
        },
        {
          "id": "c3-b23",
          "text": "Je sais siffler avec deux doigts. Un appel montant, puis deux notes brèves : ma mère me répond ainsi depuis la fenêtre quand je rentre au lavoir. Je pose l’anneau. Je mets deux doigts dans ma bouche et j’envoie le cri contre la terre cuite, en fermant de l’autre main le trait de craie.",
          "mentions": [
            "aubine"
          ]
        },
        {
          "id": "c3-b24",
          "text": "Le son s’arrête avant que mon souffle soit épuisé. Le verrou ne bouge plus. Sous mes doigts, la céramique est chaude, et ce n’est pas de ma chaleur.",
          "mentions": []
        },
        {
          "id": "c3-b25",
          "text": "Nous finissons la traversée à la perche. Sur l’autre rive, le passeur décharge chaque panier, puis ferme le bac. Il veut me donner ses recettes du matin. Je secoue la tête. Je ne sais pas encore combien vaut le chemin sonore qui me ramenait chez moi.",
          "mentions": [
            "bac"
          ]
        },
        {
          "id": "c3-b26",
          "text": "Je mets mes doigts entre mes lèvres. De l’air passe, rien de plus. Je les place autrement. Je pourrais essayer toute ma vie.",
          "mentions": []
        },
        {
          "id": "c3-b27",
          "text": "Bertille me tend de l’eau. Je la prends des deux mains pour qu’elle ne voie pas qu’une seule aurait suffi. De l’autre côté du fleuve, le chemin officiel s’arrête au bac fermé. Devant nous, Sabine déplie sa carte, puis la tourne pour suivre une route qui n’y est plus tracée.",
          "mentions": []
        }
      ]
    },
    {
      "id": "chapitre-4",
      "number": 4,
      "title": "Le fond des choses",
      "blocks": []
    },
    {
      "id": "chapitre-5",
      "number": 5,
      "title": "La chambre des mesures",
      "blocks": []
    },
    {
      "id": "chapitre-6",
      "number": 6,
      "title": "Ce qui porte encore",
      "blocks": []
    },
    {
      "id": "chapitre-7",
      "number": 7,
      "title": "Le fer au soleil",
      "blocks": []
    },
    {
      "id": "chapitre-8",
      "number": 8,
      "title": "Une maison en moins",
      "blocks": []
    },
    {
      "id": "chapitre-9",

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));
svg.innerHTML=links.map(l=>{const a=pos[l.from],b=pos[l.to];return '<line class="edge" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"><title>La Part du vent</title></line>'}).join("")
+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);
return '<g class="node'+(shown?"":" locked")+'"'+(shown?' data-open-entry="'+escA(n.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Entité non révélée"')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4"/>'+(shown?'<text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+esc(label)+'</text>':"")+'</g>'}).join("");
const revealed=nodes.filter(n=>open(n.codexId)).length;
$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");
$("#relations-list").innerHTML=links.length?links.map(l=>'<li><strong>'+esc(nodeTitle(nodes.find(n=>n.codexId===l.from),l.from))+' — '+esc(nodeTitle(nodes.find(n=>n.codexId===l.to),l.to))+'</strong><br><span class="viz-nature">'+esc(l.nature||"Lien non qualifié")+'</span></li>').join(""):'<li class="empty">Aucun lien n\u2019est encore révélé.</li>';
wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
