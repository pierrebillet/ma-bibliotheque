          "text": "C’est ma mère qui distribue la soupe. Elle a trouvé une marmite, des grains et des bols dépareillés. Les pains sont tous pliés ; les femmes qui l’aident ont adopté sa manière parce qu’il faut aller vite. Je passe près d’elle avec une charge. Elle me tend une tranche sans m’arrêter. Nous n’avons plus de cuisine, mais elle a recommencé à en fabriquer une autour des gens.",
          "mentions": [
            "mado",
            "pain-plie"
          ]
        },
        {
          "id": "c9-b21",
          "text": "Colas taille la dernière semelle. Il ne parle presque pas. Quand il me demande une mesure, je la lui donne deux fois pour qu’il ne se sente pas obligé de répondre autre chose. Il marque le bois du plat de sa lame. Ses vêtements prêtés sont trop courts aux poignets.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c9-b22",
          "text": "— Assez loin, dis-je.",
          "mentions": []
        },
        {
          "id": "c9-b23",
          "text": "Il garde le couteau immobile.",
          "mentions": []
        },
        {
          "id": "c9-b24",
          "text": "— C’était un bon nom.",
          "mentions": []
        },
        {
          "id": "c9-b25",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c9-b26",
          "text": "Il reprend la taille. Je reste avec lui pour ramasser les copeaux.",
          "mentions": []
        },
        {
          "id": "c9-b27",
          "text": "Un craquement sec traverse la cour. Toutes les têtes se tournent vers le même endroit. Une prise du grand barrage vient de lâcher. L’équipe abat immédiatement son étai de secours ; le bois reçoit la charge et tient. Sur la règle, l’eau monte encore. Sabine ramasse les semelles, Colas les sangles. Je prends le dernier anneau vierge et mon nécessaire de couture. Nous entrons dans la chambre de la vanne.",
          "mentions": [
            "tenues"
          ]
        }
      ],
      "image": "images/chapter-09.webp",
      "alt": "Des habitants entourent Aubine près d’un tonneau portant un petit modèle d’appui en bois.",
      "visualDescription": "Plan moyen élargi à hauteur des gens dans la cour de la retenue au petit matin. Sur un tonneau, modèle mécanique muet : axe sur deux petites semelles au dos arrondi et une semelle fendue. Aubine montre le contact entre bois et axe. Autour, personnes de métiers avec pelles et perches, Mado avec une marmite en arrière-plan, Bertille et Orane de côté, Sabine et Colas près d’un établi. Colas porte les habits prêtés. Pas de geste magique ni d’anneau lumineux."
    },
    {
      "id": "chapitre-10",
      "number": 10,
      "title": "La part du vent",
      "blocks": [
        {
          "id": "c10-b01",
          "text": "Il n’y a pas de place pour avoir peur correctement. Nous travaillons dans une fente de pierre, sous le grand axe, les épaules mouillées par les infiltrations. Au-dessus, l’eau du lac pousse contre le battant. En dessous, le chenal attend. Le premier charpentier qui est descendu a tracé une ligne à ne pas franchir : si l’axe tombe, il balaiera tout ce qui se trouve devant elle.",
          "mentions": [
            "retenue"
          ]
        },
        {
          "id": "c10-b02",
          "text": "L’étrier porte. Les masses de pierre qu’on a suspendues à ses bras ont levé l’axe juste assez pour sortir les vieux appuis. Sabine me fait passer la semelle neuve. Elle entre du premier coup. Je sens un bonheur idiot dans ma poitrine : toute cette route pour quelque chose qui entre du premier coup.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c10-b03",
          "text": "La seconde n’entre pas. Le logement s’est déformé plus profondément que ne l’indiquait le relevé. On ne pouvait pas voir le fond avant de sortir l’ancien bois. Colas demande qu’on lui rende la pièce pour la retailler. Sabine mesure l’espace ; elle secoue la tête. Réduire la semelle ferait porter trop de poids sur une bande trop mince. Il faut reprendre la pierre, pas le bois.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c10-b04",
          "text": "Nous pourrions le faire, mais une des cales de l’étrier a commencé à s’écraser. Le fer est bon ; la paroi qui le reçoit s’effrite. Nous avons quelques minutes avant que le pied ne pivote. Pour le soulager, il faut reporter temporairement la charge sur le petit palier voisin, encore sain. Aucun étai n’entre dans l’angle. Une tenue éprouvée pourrait unir ce palier au bras de fer pendant le travail.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c10-b05",
          "text": "Il faut aussi que la tenue puisse être déchargée après la pose. Sabine me montre la cale inclinée entre l’anneau et le bras de fer : une fois les deux semelles en place, on la retirera lentement. Le poids descendra sur le bois neuf. Alors seulement on pourra casser la céramique sans faire tomber l’axe.",
          "mentions": [
            "etrier",
            "tenues"
          ]
        },
        {
          "id": "c10-b06",
          "text": "Sabine montre l’emplacement. L’anneau du coffret a la capacité nécessaire ; elle l’a éprouvé avant notre départ. Le poids du battant restera réparti entre l’autre pied de l’étrier et cette fixation. Je répète ce qu’elle me dit, parce que les mots risquent de glisser dans le bruit de l’eau. Elle confirme chaque point. Pas un geste rendu à la fin. Pas un simple prêt. Briser la tenue libérera le fer, jamais la main.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c10-b07",
          "text": "— Je peux donner, dit Colas.",
          "mentions": [
            "don"
          ]
        },
        {
          "id": "c10-b08",
          "text": "— Tu tiens le levier. Si tu le lâches, on commence par tous sortir, répond Sabine. C’est possible. On le fait si on doit.",
          "mentions": []
        },
        {
          "id": "c10-b09",
          "text": "— Moi aussi, dit-elle ensuite. Je peux encore tracer un cercle au compas.",
          "mentions": []
        },
        {
          "id": "c10-b10",
          "text": "Il lui sert à régler ses appuis. Il lui sert à beaucoup de choses que j’ignore. Elle ne cache pas le prix derrière un sourire.",
          "mentions": []
        },
        {
          "id": "c10-b11",
          "text": "Je regarde l’anneau dans ma main. Mon sifflement est parti si vite que j’en mesure encore l’absence par surprises. Le point de reprise, je sais ce qu’il représente. Des jours à regarder ma mère chercher une couture à la lumière. La première pièce qu’une cliente n’a pas marchandée. Un avenir étroit, mais un avenir dont j’avais appris les dimensions.",
          "mentions": [
            "aubine",
            "reprise"
          ]
        },
        {
          "id": "c10-b12",
          "text": "— Je veux donner mon point.",
          "mentions": []
        },
        {
          "id": "c10-b13",
          "text": "Sabine ferme les yeux. Quand elle les rouvre, elle n’a pas l’air heureuse de moi.",
          "mentions": []
        },
        {
          "id": "c10-b14",
          "text": "— Tu n’as rien à prouver.",
          "mentions": []
        },
        {
          "id": "c10-b15",
          "text": "— Je sais.",
          "mentions": []
        },
        {
          "id": "c10-b16",
          "text": "Je ne le sais pas entièrement. Une partie de moi veut être celle qui peut, celle dont on dira le nom. Il vaut mieux que je la voie, cette partie-là, avant de lui confier mes mains.",
          "mentions": []
        },
        {
          "id": "c10-b17",
          "text": "Bertille me fait remonter les quatre marches jusqu’au jour. Elle ne me demande pas si je suis courageuse. Elle me demande si je sais quelle solution reste si je refuse. Sabine pourra donner, ou l’équipe évacuera et Orane ouvrira le délestage avant le seuil ; les habitants sont sortis. Je le répète. Elle me demande si je me crois obligée de racheter les erreurs de Sabine.",
          "mentions": [
            "bertille"
          ]
        },
        {
          "id": "c10-b18",
          "text": "— Non. Mais c’est aussi mon travail, maintenant.",
          "mentions": []
        },
        {
          "id": "c10-b19",
          "text": "— Qu’est-ce que tu ne pourras plus faire ?",
          "mentions": []
        },
        {
          "id": "c10-b20",
          "text": "— La reprise serrée qui reconstitue une toile. Même avec l’autre main. Même en recommençant l’apprentissage. Je pourrai encore coudre un ourlet, passer une aiguille. Pas faire cela.",
          "mentions": []
        },
        {
          "id": "c10-b21",
          "text": "Elle attend. Le temps qu’elle me laisse n’est pas assez long pour devenir confortable, mais il est réel. Je pourrais le remplir avec un non.",
          "mentions": []
        },
        {
          "id": "c10-b22",
          "text": "Ma mère nous voit depuis la marmite. Elle comprend le nécessaire ouvert, l’anneau, Bertille. Elle ne court pas. Elle vient, s’arrête à ma hauteur et prend le carré de toile que j’ai sorti.",
          "mentions": [
            "mado"
          ]
        },
        {
          "id": "c10-b23",
          "text": "— Tu choisis lequel ?",
          "mentions": []
        },
        {
          "id": "c10-b24",
          "text": "Je le lui dis. Elle plie le carré, le déplie. Une fois.",
          "mentions": []
        },
        {
          "id": "c10-b25",
          "text": "— Je n’aimerai pas que tu l’aies perdu.",
          "mentions": []
        },
        {
          "id": "c10-b26",
          "text": "— Moi non plus.",
          "mentions": []
        },
        {
          "id": "c10-b27",
          "text": "— D’accord.",
          "mentions": []
        },
        {
          "id": "c10-b28",
          "text": "Elle me rend la toile. Son accord ne ressemble pas à une permission ; c’est une place qu’elle fait à quelque chose qu’elle n’aurait pas choisi pour moi.",
          "mentions": []
        },
        {
          "id": "c10-b29",
          "text": "Je redescends. Dans la toile, j’ouvre avec la pointe de mes ciseaux une déchirure aussi nette que possible. Puis je place l’anneau dans son logement et le maintiens avec la cale de Sabine. La céramique touche les deux pièces à unir. Je passe le fil. Le premier rang tend la chaîne, le deuxième entrelace la trame. Je connais ce mouvement mieux que mon écriture. Au dernier passage, je ferme le trait sur l’anneau et je fais mon dernier point.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c10-b30",
          "text": "Il est beau. J’aurais préféré le rater.",
          "mentions": []
        },
        {
          "id": "c10-b31",
          "text": "Le fil devient lâche entre mes doigts. La tenue prend la charge ; le bras de fer cesse de descendre. Il ne se passe rien dans le ciel, rien qui avertirait le monde de ce qui vient de disparaître. Sabine glisse le ciseau contre la pierre et commence à frapper. Chaque coup me revient dans les dents.",
          "mentions": [
            "tenues"
          ]
        },
        {
          "id": "c10-b32",
          "text": "Je tiens la lampe. Voilà ce que je fais pendant que le geste dont j’étais fière porte un morceau de vanne : je tiens une lampe pour que quelqu’un travaille. Colas ajuste la semelle au fur et à mesure. Dehors, les porteurs se relaient. La petite pince de frêne maintient le dessin ouvert sur une planche humide, et son ombre a la taille d’un outil immense.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c10-b33",
          "text": "Enfin, la semelle entre. Nous vérifions le jeu, retirons le ciseau et libérons le levier d’un cran. Les appuis prennent progressivement le poids. Sabine marque au charbon la position de l’axe, puis attend. Le bois parle, une plainte basse. Il ne se fend pas.",
          "mentions": []
        },
        {
          "id": "c10-b34",
          "text": "— La part du vent, dit-elle.",
          "mentions": [
            "sabine"
          ]
        },
        {
          "id": "c10-b35",
          "text": "Je la regarde.",
          "mentions": []
        },
        {
          "id": "c10-b36",
          "text": "— C’est comme ça que mon maître appelait le jeu qu’on doit laisser. Il disait : si tu construis pour un jour sans vent, tu construis pour un jour qui n’existe pas.",
          "mentions": []
        },
        {
          "id": "c10-b37",
          "text": "Elle brise l’anneau devenu inutile. La tenue se détache du fer ; l’axe ne bouge pas de son appui. Je regarde les fragments au sol. Mes doigts essaient de reprendre le fil. Ils savent le tenir, le tirer, pas retrouver le chemin. Je range la toile avant qu’on me voie essayer une deuxième fois.",
          "mentions": [
            "etrier"
          ]
        },
        {
          "id": "c10-b38",
          "text": "Au-dessus, Bertille crie que le lit inférieur du chenal est libre. La règle n’a pas encore atteint le rouge. Sabine pose les mains sur le treuil de la vanne. De l’autre côté du battant, il y a un lac entier.",
          "mentions": []
        }
      ],
      "image": "images/chapter-10.webp",
      "alt": "Dans une chambre étroite sous la vanne, Aubine tient une lampe pendant que Sabine examine un appui.",
      "visualDescription": "Composition horizontale intérieure, vue oblique hors de la trajectoire de l’axe. Un fort étrier de fer porte l’axe de la vanne entre deux murs de pierre. Sabine mesure un logement, Colas tient un levier et Aubine éclaire avec une lampe à huile. Une petite pince maintient un dessin illisible sur une planche. Eau suintante, tons bleu sombre et ambre, gestes précis. Aucun sacrifice en cours, aucune couture offerte, aucun anneau brisé : début du chantier de ce chapitre."
    },
    {
      "id": "chapitre-11",
      "number": 11,
      "title": "Ce que tient une épaule",
      "blocks": [
        {
          "id": "c11-b01",
          "text": "Le treuil tourne d’un quart de tour, puis s’arrête. Nous avons mis six personnes aux barres. Les six poussent, et rien ne change. Le bruit du lac me traverse les côtes. Je voudrais qu’il se produise enfin quelque chose, et je m’aperçois que c’est une façon dangereuse de vouloir.",
          "mentions": []
        },
        {
          "id": "c11-b02",
          "text": "Sabine fait arrêter tout le monde. Elle descend regarder l’axe. Je la suis à distance avec la lampe. Les semelles ont roulé comme prévu, mais le battant est collé à son seuil par douze ans de dépôt. Il faut le décoller, pas ajouter des bras jusqu’à casser le treuil. Elle remonte chercher les coins de levage. Je reste près du repère et surveille la pierre.",
          "mentions": []
        },
        {
          "id": "c11-b03",
          "text": "Mon carré de toile dépasse de la poche. Je le rentre du bout d’un doigt. Ce que j’ai payé ne nous donne droit à rien. Cette pensée me paraît injuste pendant un moment ; puis elle me fait lâcher la barre sur laquelle je m’appuyais trop fort.",
          "mentions": []
        },
        {
          "id": "c11-b04",
          "text": "Colas passe une longue pièce de bois sous le bord du battant. Avec deux ouvriers, il monte dessus. Le levier fléchit. Une ouvrière frappe le coin, de côté, pour ne pas recevoir le fer s’il saute. Il y a un claquement sourd. Une ligne d’eau paraît au ras du seuil.",
          "mentions": []
        },
        {
          "id": "c11-b05",
          "text": "Elle est mince, presque décevante. Elle court entre les pierres, atteint la première marche, emporte les poussières que nos semelles ont laissées. Nous reculons. Au deuxième cran, la ligne devient une lame et la lame efface le sol. Le chenal avale son premier bruit d’eau depuis douze ans.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c11-b06",
          "text": "Bertille descend jusqu’au poste de signal. Elle doit avertir les moulins avant qu’on ouvre davantage. La courbe du chenal et les seuils ralentiront la première eau ; nous avons prévu ce temps, pas davantage. Elle agite le panneau blanc, attend une réponse. Un panneau paraît très loin, puis se baisse. Elle recommence. Rien.",
          "mentions": []
        },
        {
          "id": "c11-b07",
          "text": "Orane prend la longue-vue. Des silhouettes s’agitent sur le dernier grenier. Le maître meunier a retenu son équipe pour descendre des sacs supplémentaires ; les piliers sont entamés mais encore debout. L’eau arrive déjà sous eux. Il ne reste plus le temps d’achever à la main ce qui aurait dû être fait à sec.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c11-b08",
          "text": "— On referme ? demande le chef d’équipe.",
          "mentions": []
        },
        {
          "id": "c11-b09",
          "text": "La règle touche le bas de la tige rouge. L’entrée d’eau dans le lac dépasse encore ce qui sort par l’ouverture étroite. Refermer, c’est devoir ouvrir l’autre délestage immédiatement. Continuer, c’est risquer que les sacs et les piliers bouchent le chenal et fassent remonter l’eau contre les maisons hautes.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c11-b10",
          "text": "Orane me tend la longue-vue. Je distingue les ouvriers qui sortent du grenier. Le maître reste au pied de l’escalier, tout petit, ses bras levés vers les sacs. Je pense à Colas entrant dans l’eau. Je ne suis plus aussi sûre de savoir reconnaître les imbéciles.",
          "mentions": []
        },
        {
          "id": "c11-b11",
          "text": "La prévôte envoie deux gardes au galop par la route latérale. Ils devront faire évacuer la plateforme, puis tirer depuis la berge les cordes de démolition préparées. Elle signe sur le genou un ordre qui autorise à détruire les roues et les greniers, avec les réserves restantes. Le chef d’équipe lui demande si elle confirme la perte des meules. On ne les remplacera pas avant des mois.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c11-b12",
          "text": "— Je confirme, dit-elle.",
          "mentions": []
        },
        {
          "id": "c11-b13",
          "text": "Elle le dit de manière à ce que Bertille puisse l’écrire.",
          "mentions": []
        },
        {
          "id": "c11-b14",
          "text": "Le panneau blanc s’agite en bas. Une fois, deux fois : la plateforme est vide. Bertille compte les silhouettes par la longue-vue, vérifie le nombre avec le signal. Au troisième mouvement, elle abaisse son bras vers nous. Sabine donne un quart de tour au treuil. J’entends le battant monter avant de voir l’eau.",
          "mentions": []
        },
        {
          "id": "c11-b15",
          "text": "Elle prend toute la largeur du passage. Elle est brune, lourde, chargée de branches qui tournent sur elles-mêmes. Le premier pilier du grenier cède ; le bâtiment s’incline sans vouloir tomber. Puis les cordes se tendent, tirées de la berge, et le second pilier se rompt. Les poutres basculent vers l’emplacement dégagé pour elles, hors du courant principal. Un nuage blanc sort du grenier, de la farine, si clair qu’on le prendrait pour de la lumière.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c11-b16",
          "text": "La retenue ne se calme pas tout de suite. Deux équipes restent aux étais. La vanne monte encore, lentement ; Sabine surveille les appuis, Colas le treuil, moi les traits au charbon. Je suis déçue de devoir attendre après tant d’efforts. Je voudrais le moment où tout le monde sait. Mais les choses que nous avons mises en mouvement ont leur propre durée.",
          "mentions": []
        },
        {
          "id": "c11-b17",
          "text": "Le soleil atteint les embruns qui montent du chenal. Un arc de couleurs se forme au-dessous de nous, si bas que les oiseaux le traversent par le haut. Puis le vent déplace la brume : l’arc se dédouble, une moitié sur la roche, l’autre suspendue devant les roues lointaines. Les gouttes se posent sur mes manches ; elles n’ont plus aucune couleur. Je tends la main une seconde, pour les recevoir, avant de reprendre la lampe.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c11-b18",
          "text": "Ma mère monte avec des bols. Un ouvrier lui dit que ce n’est pas le moment. Elle lui met le sien sur une pierre à portée de main.",
          "mentions": []
        },
        {
          "id": "c11-b19",
          "text": "— Tu choisiras quand ce sera le moment.",
          "mentions": []
        },
        {
          "id": "c11-b20",
          "text": "Il le boit presque aussitôt. Je me mets à rire, seule d’abord, puis Colas aussi. Nous ne rions pas beaucoup, ni très bien. Cela suffit pour que j’aie soudain faim.",
          "mentions": []
        },
        {
          "id": "c11-b21",
          "text": "Bertille fait un trait sur la règle. Elle attend trente battements, en fait un deuxième. L’eau n’a pas monté. Encore trente. Le troisième trait est un peu plus bas. Elle vérifie le flotteur, s’assure que rien ne le retient. Puis elle appelle Orane.",
          "mentions": [
            "epreuves"
          ]
        },
        {
          "id": "c11-b22",
          "text": "La prévôte vient regarder les traits sans les toucher. Un des gardes se met à crier ; elle l’arrête d’un geste, attend la mesure suivante. L’eau descend encore. Alors elle s’assied sur la première marche, là où tout le monde passe. Personne n’ose lui demander de se déplacer.",
          "mentions": []
        },
        {
          "id": "c11-b23",
          "text": "Le délestage vers Rivebasse restera fermé. Bertille porte la nouvelle jusqu’au poste, où le signal part vers les charrettes. Je vois ma mère poser sa main contre le mur, comme si elle essayait déjà une pièce de notre maison. Une meunière s’assied à côté d’elle. Pendant un moment, aucune ne dit rien.",
          "mentions": [
            "rivebasse"
          ]
        },
        {
          "id": "c11-b24",
          "text": "Colas me demande si je veux descendre voir l’eau sortir aux Fosses. Je veux. Je voudrais voir tout le trajet, chaque marche libérée, le champ du jardinier, le courant allant enfin là où nous avons travaillé pour lui. Mais Sabine a besoin d’une relève devant les appuis.",
          "mentions": []
        },
        {
          "id": "c11-b25",
          "text": "— Tout à l’heure, dis-je.",
          "mentions": []
        },
        {
          "id": "c11-b26",
          "text": "Il prend un des tabourets, le pose à côté du mien et s’assied. Nous restons garder ce qui tient.",
          "mentions": []
        }
      ],
      "image": "images/chapter-11.webp",
      "alt": "Six ouvriers attendent près des barres d’un treuil devant la vanne encore fermée.",
      "visualDescription": "Plan large depuis la cour de la retenue, treuil de bois et de fer au premier plan avec six ouvriers anonymes, Sabine leur fait signe d’attendre, Aubine porte une lampe basse et Colas est près des outils. La grande vanne est encore fermée, lac lumineux aperçu derrière les arches, air chargé d’humidité. Orane et Bertille sont au poste de signal au second plan. Aucun grenier détruit, aucune eau triomphante : ne pas anticiper l’issue du chapitre."
    },
    {
      "id": "chapitre-12",
      "number": 12,
      "title": "Le linge du lendemain",
      "blocks": [
        {
          "id": "c12-b01",
          "text": "Six semaines plus tard, on retrouve des poissons dans des endroits où ils n’ont aucune raison d’avoir l’air chez eux. Le dernier est dans le baquet à lessive d’une voisine. Elle accuse la crue ; sa petite-fille accuse le chat ; le chat a la prudence de ne pas être là. Nous le remettons dans la rivière à trois, comme si c’était une opération importante. C’en est une pour le poisson.",
          "mentions": []
        },
        {
          "id": "c12-b02",
          "text": "Le lavoir neuf n’a que la moitié de la longueur de l’ancien. L’autre moitié attend du bois, comme plusieurs escaliers et deux charrettes. Notre chambre a séché portes ouvertes ; la marque de l’eau reste visible sous la fenêtre. Mado a refusé qu’on la peigne avant l’hiver. Elle veut voir si la pierre travaille encore.",
          "mentions": []
        },
        {
          "id": "c12-b03",
          "text": "La ville moud ses grains dans les deux roues restées debout. On fait la queue plus longtemps, et la farine coûte trop cher malgré les réserves sauvées. Les ouvriers des moulins touchent une solde pour la remise en état du chenal. Les maîtres ont porté plainte contre Orane pour les démolitions. Elle leur a transmis les mesures et l’ordre signé. La plainte suit son chemin ; personne ne prétend que le fleuve l’a jugée à la place des gens.",
          "mentions": [
            "moulins"
          ]
        },
        {
          "id": "c12-b04",
          "text": "Sur les chantiers payés par la ville, l’affiche de Bertille est devenue une clause de contrat : le refus d’un don ne retire ni ration ni travail ; un entretien se fait hors de la présence du chef. Pour les ateliers privés, le conseil discute encore. Bertille passe certains soirs au lavoir avec ses copies. Elle a changé sa sangle et me doit toujours une pince.",
          "mentions": [
            "don",
            "bertille"
          ]
        },
        {
          "id": "c12-b05",
          "text": "La première semaine, j’ai essayé de reprendre un trou dans mon tablier. Je savais exactement ce que le fil devait faire. Mes mains posaient les rangs, puis perdaient leur chemin au croisement, obstinées comme une personne qui entre dans une pièce et oublie pourquoi. J’ai essayé le lendemain. Le troisième jour, ma mère a déplacé mon ouvrage pour mettre la table. Ni elle ni moi n’avons parlé de courage.",
          "mentions": [
            "reprise"
          ]
        },
        {
          "id": "c12-b06",
          "text": "Je peux coudre un ourlet. Je peux faire un point avant, bâtir deux tissus et poser un bouton. Je ne peux plus rendre à une toile sa trame invisible. Les clientes sont allées chez une autre raccommodeuse ; certaines se sont excusées avec tant de gentillesse que je n’ai pas pu leur en vouloir avant leur départ. D’autres m’apportent des ourlets dont elles n’ont pas besoin. Je préfère encore les premières.",
          "mentions": []
        },
        {
          "id": "c12-b07",
          "text": "Sabine m’a proposé un apprentissage d’appuis et de gabarits, avec une part de travail de couture pour les protections de chantier. Un vrai contrat, moins bien payé que je l’espérais. J’ai discuté la somme. Elle a discuté le nombre de journées. Nous sommes tombées d’accord en nous agaçant un peu, ce qui m’a fait du bien.",
          "mentions": []
        },
        {
          "id": "c12-b08",
          "text": "Sur ma première feuille, j’avais écrit : laisser du jeu. Sabine m’a rendu le dessin.",
          "mentions": [
            "pinces"
          ]
        },
        {
          "id": "c12-b09",
          "text": "— Combien ?",
          "mentions": []
        },
        {
          "id": "c12-b10",
          "text": "J’ai levé les yeux au ciel. Puis j’ai mesuré. Le vent a droit à sa part, pas à des dimensions imaginaires. La pince cassée du lavoir est posée au-dessus de mon nouvel établi. Elle ne sert plus à tenir le linge. Elle sert à ce que je me souvienne de regarder les choses ordinaires avant de les jeter.",
          "mentions": []
        },
        {
          "id": "c12-b11",
          "text": "Colas construit un bac avec deux autres bateliers. Ce ne sera pas sa barque, même en lui donnant le même nom. Il a remis la plaque Assez loin dans son sac ; elle ne figurera pas sur la coque commune. Quand le bac aura passé ses épreuves, il partira un mois au-delà des plateaux, puis reviendra faire sa part des traversées. Il m’a montré le tour de service. C’était une façon étrange, très belle, de montrer un horizon.",
          "mentions": [
            "colas"
          ]
        },
        {
          "id": "c12-b12",
          "text": "Un soir, Bertille apporte un pot de son père. Il est un peu penché ; l’anse est parfaitement ajustée à la main. Nous y mettons de la soupe. Mon ancien point de reprise lui manque, à moi ; le centrage manque à son père, à lui. Nous ne faisons pas de concours entre les pertes. Colas demande du pain, Mado lui tend la corbeille, et la conversation arrive peu à peu ailleurs.",
          "mentions": []
        },
        {
          "id": "c12-b13",
          "text": "À la retenue, l’étrier reste désormais sous un abri sec. Les cales sont rangées à côté, les mesures copiées au poste et dans la chambre des moulins. Sabine a fait refaire son ancien rapport : la vanne avait été mal immobilisée, le défaut pouvait se corriger par des appuis mobiles, et le choix de ne pas payer ces travaux avait déplacé le danger vers Rivebasse. Elle a signé sans effacer la première version.",
          "mentions": [
            "etrier",
            "retenue"
          ]
        },
        {
          "id": "c12-b14",
          "text": "Nous marchons une fois jusqu’aux Fosses, ma mère et moi. Le chenal coule entre les marches blanches. Le jardinier nous montre les grains qu’il a resemés, puis nous explique que l’indemnité n’est pas entièrement versée. Ma mère lui demande s’il a gardé ses doubles. Il en a trois. Ils s’entendent aussitôt.",
          "mentions": [
            "chenal"
          ]
        },
        {
          "id": "c12-b15",
          "text": "Au retour, les vergers s’allument au-dessus du fleuve. Les veilleuses entrent dans les poires mûres et ressortent par d’autres trous. Ma mère s’arrête au milieu du chemin. Je pourrais lui raconter le pressoir, la soupe, la lumière sur le sourcil de Bertille. Je ne dis rien. Il faut qu’elle ait sa propre nuit verte.",
          "mentions": [
            "vergers",
            "veilleuses"
          ]
        },
        {
          "id": "c12-b16",
          "text": "Le lendemain matin, elle est à la fenêtre pendant que je tends le linge. Je lève la tête et porte deux doigts à mes lèvres. Je m’arrête à temps. Cela arrive moins souvent ; cela arrive encore. Je prends une pince et frappe trois petits coups contre le poteau.",
          "mentions": []
        },
        {
          "id": "c12-b17",
          "text": "Elle répond avec sa cuillère sur le rebord. Trois coups. Le bruit est sec, pas très musical. Je ris et elle recommence, plus fort.",
          "mentions": []
        },
        {
          "id": "c12-b18",
          "text": "La petite que j’ai tirée de l’eau passe avec sa mère. Elle a deux chaussures neuves et veut m’aider à étendre. Je lui donne les mouchoirs. Nous fixons un coin, puis l’autre ; elle serre chaque pince à deux mains, concentrée au point d’en tirer la langue.",
          "mentions": []
        },
        {
          "id": "c12-b19",
          "text": "Arrivée au dernier drap, je lui fais laisser un peu de mou entre les attaches. Elle recule pour voir si c’est bien. Le vent entre dans la toile, la soulève et la repose. Au-dessus, ma mère nous appelle : le pain est prêt. Je prends la main de l’enfant pour remonter les marches, et derrière nous le drap continue de bouger.",
          "mentions": []
        }
      ],
      "image": "images/chapter-12.webp",
      "alt": "Du linge sèche sur les cordes d’un lavoir reconstruit, à côté d’une chambre dont le mur garde une marque d’eau.",
      "visualDescription": "Plan large horizontal d’un lavoir modeste neuf, plus court que ses anciennes fondations visibles. Aubine fixe un mouchoir sur une corde ; Mado se tient à la fenêtre au-dessus, cuillère à la main. Quelques enfants passent à distance, aucun danger. Marque d’eau sous la fenêtre, bois neuf blond, matin lumineux, draps avec du mou entre les pinces et vent doux. Aucune foule de célébration, aucune restauration fastueuse."
    }
  ],
  "codex": [
    {
      "id": "aubine",
      "title": "Aubine",
