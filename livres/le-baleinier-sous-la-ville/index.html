 "chapters": [
  {
   "id": "chapitre-1",
   "number": 1,
   "title": "Cinq sacs de courses",
   "blocks": [
    {
     "id": "c1-b01",
     "text": "Le monde arriva un samedi, dans cinq sacs de courses en papier kraft, et la voisine s’excusa presque de l’encombrement. Elle avait été l’institutrice de maternelle de John Hanke ; elle vidait un placard ; elle se disait que les enfants trouveraient peut-être à s’occuper avec ça. Les sacs pesaient chacun le poids d’un petit chien. Ils étaient pleins de vieux National Geographic, jaunes comme des blés en septembre, et John et sa sœur les traînèrent jusqu’au salon en se relayant, parce qu’à eux deux ils n’en portaient qu’un à la fois.",
     "mentions": []
    },
    {
     "id": "c1-b02",
     "text": "Ils passèrent l’après-midi assis par terre. Les photographies, d’abord : des pêcheurs de perles, un volcan fumant au-dessus d’une ville, des hommes en parka qui souriaient sans dents sur une banquise. Puis John découvrit que certains numéros cachaient, pliée en huit dans le dos du magazine, une carte. Il la déplia avec la lenteur qu’on met à ouvrir une lettre qui n’est pas pour soi. C’était l’Asie du Sud-Est, en couleurs de bonbons, avec des noms qu’il ne savait pas prononcer et des routes fines comme des cheveux. Il y en avait une autre dans le numéro suivant, et une autre encore. Sa sœur tenait les coins pendant qu’il cherchait où ils étaient, eux, sur la carte des États-Unis. Le Texas était grand comme une nappe. Cross Plains n’y figurait pas.",
     "mentions": []
    },
    {
     "id": "c1-b03",
     "text": "— On n’existe pas, dit sa sœur, pas très émue.",
     "mentions": []
    },
    {
     "id": "c1-b04",
     "text": "— On est entre Abilene et Brownwood, dit John en posant le doigt dans un blanc. Là. Juste là.",
     "mentions": []
    },
    {
     "id": "c1-b05",
     "text": "Le soir, les cartes couvraient le mur de sa chambre. Il les avait fixées avec des punaises et, là où les punaises manquaient, avec du ruban adhésif que sa mère lui reprocherait plus tard. Il y avait la Lune, face visible, criblée comme une passoire ; il y avait le fond de l’Atlantique, qu’il ne savait pas qu’on pouvait dessiner, avec ses montagnes noyées et sa longue cicatrice au milieu ; il y avait l’Europe, penchée sur ses fleuves. Couché, la lampe éteinte, il distinguait encore les contours dans le noir. Il pensa qu’une carte était une chose étrange : on voyait le monde d’en haut, en entier, comme un oiseau ou comme Dieu, et pourtant on avait aussitôt envie d’y descendre.",
     "mentions": []
    },
    {
     "id": "c1-b06",
     "text": "Cross Plains, pour ce qui était d’y descendre, ne demandait pas beaucoup d’effort. Un millier d’habitants, une école, un Dairy Queen, et au croisement principal un seul feu, orange, qui clignotait nuit et jour sans jamais passer au rouge, comme s’il n’avait jamais vu assez de voitures pour se donner cette peine. Autour, les pâturages, les chênes nains, les réservoirs de terre rouge où les vaches venaient boire, et le ciel, énorme, qui faisait tout le reste du travail. Les étés sentaient le foin chaud et le goudron des routes de comté. Les hivers ne sentaient rien du tout.",
     "mentions": []
    },
    {
     "id": "c1-b07",
     "text": "Il y avait pourtant, au bout d’une rue tranquille, une maison blanche à véranda où quelque chose s’était passé. Un homme y avait vécu dans les années trente avec ses parents, un grand gaillard qui tapait à la machine la nuit en criant ses dialogues à voix haute, au grand scandale des voisins. Il s’appelait Robert E. Howard. De cette chambre, dans ce trou poussiéreux du Texas central, il avait inventé Conan le Cimmérien, des royaumes entiers, des cartes d’âges qui n’avaient jamais existé. Les gens de Cross Plains en parlaient avec un mélange de fierté et de gêne, comme d’un cousin excentrique. John, lui, retint surtout ceci : qu’on pouvait habiter une ville avec un seul feu clignotant et en tirer un monde.",
     "mentions": []
    },
    {
     "id": "c1-b08",
     "text": "Le deuxième événement de sa vie arriva, lui aussi, par une porte entrouverte. Il était en eighth grade, il avait treize ans et des bras trop longs, et il longeait le couloir du lycée quand il entendit, dans la salle de mathématiques, un bruit qu’il ne connaissait pas : un petit cliquetis de touches, des rires, et un bip aigu, répété, triomphal. Il s’arrêta. Par l’entrebâillement, il vit trois grands de terminale penchés sur une boîte gris et noir, un clavier, un écran où bougeaient des carrés blancs. Un TRS-80. Il n’avait jamais vu d’ordinateur ailleurs qu’à la télévision, et à la télévision les ordinateurs étaient grands comme des réfrigérateurs et servaient à envoyer des hommes sur la Lune.",
     "mentions": []
    },
    {
     "id": "c1-b09",
     "text": "Il resta sur le seuil un long moment. Personne ne lui dit d’entrer ; personne ne lui dit de partir. Alors il entra.",
     "mentions": []
    },
    {
     "id": "c1-b10",
     "text": "Le professeur de mathématiques s’appelait Tom Barkley. C’était un homme patient qui avait compris avant tout le monde que la machine posée dans sa salle n’était pas un gadget, et qui la défendait contre l’administration avec la ténacité d’un fermier défendant un puits. Il regarda le gamin de quatrième planté derrière ses élèves, il regarda ses yeux, et il ne le mit pas dehors. Le lendemain, John revint. Le surlendemain aussi. Au bout d’une semaine, il savait écrire un programme qui affichait son nom en boucle jusqu’à ce qu’on le supplie d’arrêter ; au bout d’un mois, il savait faire rebondir une balle d’un bord à l’autre de l’écran, ce qui lui parut, pendant quelques jours, le sommet de l’intelligence humaine.",
     "mentions": []
    },
    {
     "id": "c1-b11",
     "text": "— Qu’est-ce que tu veux en faire ? lui demanda Barkley un soir, alors que les autres étaient partis et que John restait à taper, le dos rond.",
     "mentions": []
    },
    {
     "id": "c1-b12",
     "text": "John réfléchit. Il pensa aux cartes du mur, à la Lune criblée, à la cicatrice de l’Atlantique.",
     "mentions": []
    },
    {
     "id": "c1-b13",
     "text": "— Un endroit, dit-il. Je veux faire un endroit où on peut aller.",
     "mentions": []
    },
    {
     "id": "c1-b14",
     "text": "Barkley hocha la tête comme si c’était une réponse parfaitement raisonnable, ce qui, pour un professeur de mathématiques du Texas central en 1981, n’était pas si courant.",
     "mentions": []
    },
    {
     "id": "c1-b15",
     "text": "À la maison, les négociations durèrent un certain temps. Mais un jour il y eut un Atari 400 sur la table de sa chambre, sous les cartes, avec son clavier plat à membrane sur lequel les doigts glissaient sans bruit, comme sur une vitre. C’était une machine pour jouer. John s’en servit pour fabriquer. Il apprit seul, dans les manuels et par essais, erreurs, colères et petits miracles, à dessiner des personnages avec des pixels grands comme des timbres, à les faire marcher, à leur construire des labyrinthes. Il remarqua très vite que ce qui l’intéressait n’était pas tant le monstre ou le trésor que le plan : la façon dont les salles tenaient ensemble, dont le joueur, en avançant, découvrait qu’il y avait quelque chose derrière la porte, puis quelque chose derrière la chose. Une carte qui se dévoile en marchant. Il n’avait pas encore les mots pour le dire. Il avait les doigts.",
     "mentions": []
    },
    {
     "id": "c1-b16",
     "text": "Sa sœur, qui jouait à ses jeux par charité fraternelle, lui fit un jour une remarque qu’il n’oublia pas.",
     "mentions": []
    },
    {
     "id": "c1-b17",
     "text": "— Ton château, là, il est bien. Mais c’est toujours moi toute seule dedans.",
     "mentions": []
    },
    {
     "id": "c1-b18",
     "text": "Il haussa les épaules. Il faudrait des années, et plusieurs entreprises, pour qu’il comprenne ce qu’elle avait dit.",
     "mentions": []
    },
    {
     "id": "c1-b19",
     "text": "Au lycée, Barkley monta une équipe de programmation. Il y avait quatre garçons, un van emprunté, et un concours à l’université Baylor, à Waco, à deux heures et demie de route vers l’est, où se retrouvaient les meilleurs élèves de l’État. Ceux de Dallas et de Houston arrivèrent avec des mallettes et des parents ingénieurs. Ceux de Cross Plains arrivèrent avec des sandwichs et un professeur qui leur avait fait répéter, dans le van, les pièges classiques des boucles mal fermées. On leur donna des problèmes à résoudre en temps limité ; on les installa devant des machines qu’ils n’avaient jamais vues ; John sentit, pendant la première demi-heure, qu’il avait les mains trop froides pour taper. Puis le problème le prit, et il oublia qu’il avait des mains.",
     "mentions": []
    },
    {
     "id": "c1-b20",
     "text": "Ils finirent troisièmes de l’État. Troisièmes : pas premiers, pas deuxièmes, mais au-dessus de dizaines d’équipes venues de villes qui avaient plus de feux rouges que Cross Plains n’avait de rues. Sur la route du retour, dans le van qui sentait le soda chaud, personne ne parla beaucoup. Barkley conduisait avec un demi-sourire qu’il ne cherchait pas à cacher. John regardait défiler les clôtures, les éoliennes de pompage, les panneaux criblés de plombs par les chasseurs, et il éprouva pour la première fois une sensation qu’il retrouverait souvent : le monde était plus grand qu’on ne le lui avait dit, et il n’était pas, lui, plus petit que le monde.",
     "mentions": []
    },
    {
     "id": "c1-b21",
     "text": "Il y avait aussi des soirs où il ne faisait rien. Il montait sur le toit du garage, s’allongeait sur la tôle encore tiède, et regardait le ciel du Texas, ce ciel sans ville qui vous tombe dessus avec toutes ses étoiles en même temps. Il pensait aux satellites. On disait qu’il y en avait maintenant des centaines, là-haut, qui photographiaient la Terre. Il se demandait à quoi ressemblait Cross Plains, vue de là : une tache, un croisement, un point orange qui clignote. Il se demandait si quelqu’un, dans une salle climatisée du Maryland ou de Californie, avait déjà zoomé sur son toit à lui, sur ce garçon allongé les bras en croix, et ce qu’il en avait conclu. Il trouvait l’idée à la fois inquiétante et magnifique. Il n’avait jamais pensé que ces deux mots pouvaient aller ensemble.",
     "mentions": []
    },
    {
     "id": "c1-b22",
     "text": "En 1985, il sortit du lycée avec des notes qui firent parler dans la famille, un dossier d’admission à l’université du Texas à Austin, et une place dans le Plan II, un programme d’honneurs où l’on mélangeait la philosophie, les sciences et la littérature pour fabriquer, disait-on, des esprits capables de tout. Il ne savait pas très bien ce qu’il voulait devenir. Diplomate, peut-être : on voyageait, on voyait les pays des cartes. Ingénieur, peut-être. Il y avait quelque chose, au fond de lui, qui ne voulait pas choisir entre les deux, et qu’il prenait pour de l’indécision.",
     "mentions": []
    },
    {
     "id": "c1-b23",
     "text": "Le matin du départ, il décrocha les cartes du mur. Il le fit lentement, en retirant les punaises une à une, et en pliant chaque feuille le long de ses anciens plis, qui avaient gardé leur mémoire. Le ruban adhésif avait laissé des traces claires sur la peinture, de petits rectangles pâles, et quand il eut fini, le mur ressemblait lui-même à une carte : celle d’un monde qui n’était plus là. Sa mère regarda les rectangles et ne dit rien. Elle ne savait pas encore jusqu’où ce garçon-là irait.",
     "mentions": []
    },
    {
     "id": "c1-b24",
     "text": "Ils prirent la route au lever du jour. Le feu orange clignotait au croisement, patient, pour personne. Dans le rétroviseur, Cross Plains se replia en quelques secondes : le château d’eau, le toit de l’école, puis plus rien que la plaine. John garda les yeux sur la route devant lui.",
     "mentions": []
    },
    {
     "id": "c1-b25",
     "text": "Austin, en comparaison, était une capitale. Il y avait des feux rouges à chaque croisement, et ils passaient au rouge. Il y avait la tour de l’université, massive, couleur de biscuit, qui dominait le campus comme un phare planté dans les terres. Il y avait des milliers de jeunes gens qui marchaient vite, en bermudas, avec l’air de savoir où ils allaient ; il comprit plus tard que la plupart l’ignoraient autant que lui.",
     "mentions": []
    },
    {
     "id": "c1-b26",
     "text": "Le dimanche qui précéda la rentrée, dans le vacarme de la résidence où les familles montaient des cartons en s’engueulant dans les escaliers, il croisa un garçon au rire facile, qui portait un carton de disques et avait l’art de parler à des inconnus comme s’ils se connaissaient depuis la maternelle. Il s’appelait Bill Kilday. Il était texan lui aussi, et ils découvrirent en dix minutes qu’ils avaient les mêmes blagues sur les gens de Dallas, le même goût pour les projets trop grands, et la même incapacité à rester assis quand une idée les tenait.",
     "mentions": []
    },
    {
     "id": "c1-b27",
     "text": "— Tu fais quoi, toi ? demanda Kilday.",
     "mentions": []
    },
    {
     "id": "c1-b28",
     "text": "— Plan II.",
     "mentions": []
    },
    {
     "id": "c1-b29",
     "text": "— Non, je veux dire : tu fais quoi ? Qu’est-ce qui te fait lever le matin ?",
     "mentions": []
    },
    {
     "id": "c1-b30",
     "text": "John hésita. Personne ne lui avait jamais posé la question comme ça.",
     "mentions": []
    },
    {
     "id": "c1-b31",
     "text": "— Les cartes, finit-il par dire. Et les ordinateurs.",
     "mentions": []
    },
    {
     "id": "c1-b32",
     "text": "— Les deux ensemble ?",
     "mentions": []
    },
    {
     "id": "c1-b33",
     "text": "— Je ne sais pas encore.",
     "mentions": []
    },
    {
     "id": "c1-b34",
     "text": "Kilday éclata de rire, sans méchanceté, comme on rit d’un bon mot qu’on n’a pas tout à fait compris.",
     "mentions": []
    },
    {
     "id": "c1-b35",
     "text": "— Quand tu sauras, préviens-moi.",
     "mentions": []
    },
    {
     "id": "c1-b36",
     "text": "L’hiver suivant, ils partirent skier à Winter Park, dans le Colorado, entassés dans une voiture avec le colocataire de Bill, et ils descendirent des pentes qu’ils n’avaient aucune compétence pour descendre. John tomba souvent. En remontant sur le télésiège, les skis ballants au-dessus du vide, il regarda la vallée sous lui, les sapins tout petits, les chalets pareils à des dés, la route qui serpentait jusqu’au fond, et il reconnut la sensation de la chambre de Cross Plains, le monde vu d’en haut et le désir d’y descendre. Il en parla à Kilday, qui lui répondit qu’il était surtout en train de descendre sur les fesses.",
     "mentions": []
    },
    {
     "id": "c1-b37",
     "text": "Ils restèrent amis. Kilday ne le savait pas encore, mais un soir de printemps, quatorze ans plus tard, John frapperait à sa porte avec un ordinateur sous le bras et le monde entier dedans. Il tiendrait alors sa promesse : il viendrait le prévenir.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-2",
   "number": 2,
   "title": "Rangoun",
   "blocks": [
    {
     "id": "c2-b01",
     "text": "Plus tard, quand on l’interrogerait sur ces années-là, John Hanke répondrait en une phrase, toujours la même : il avait travaillé quatre ans pour le Foreign Service, à Washington puis en Birmanie, sur des questions de politique étrangère. Les journalistes notaient, passaient à la suite, pressés d’arriver aux jeux vidéo et aux milliards. Personne n’insistait. C’était pourtant là, dans ces quatre années dont il parlait si peu, qu’il avait appris à regarder une carte comme on regarde un visage : en se demandant ce qu’elle cache.",
     "mentions": []
    },
    {
     "id": "c2-b02",
     "text": "Washington, d’abord, en 1989. Il avait vingt-deux ans, un diplôme du Plan II, un costume qui lui allait presque, et la conviction encore intacte qu’on pouvait changer le monde en rédigeant des notes intelligentes. Le département d’État occupait à Foggy Bottom un immense bâtiment aux couloirs si longs et si semblables qu’on y donnait aux nouveaux venus des plans photocopiés pour ne pas s’y perdre. John garda le sien dans sa poche pendant des mois, par superstition plus que par nécessité. C’était une carte, après tout, et il avait toujours aimé les cartes.",
     "mentions": []
    },
    {
     "id": "c2-b03",
     "text": "On lui apprit le métier : lire des télégrammes, les résumer, les classer, en rédiger d’autres qui seraient résumés et classés à leur tour à l’autre bout de la planète. On lui apprit que l’information avait un poids et une vitesse, qu’elle s’abîmait en voyageant, qu’un fait vrai le lundi pouvait être faux le jeudi et que, entre les deux, des gens prenaient des décisions. On lui apprit surtout que la question « où ? » était presque toujours la plus difficile. Où se trouvait tel camp, telle route, tel village dont le nom changeait selon la langue de celui qui l’écrivait ? Les cartes du bâtiment étaient belles, précises, souvent fausses. Il remarqua que les plus anciens diplomates ne les regardaient plus. Ils avaient appris à s’en méfier comme d’un collègue trop sûr de lui.",
     "mentions": []
    },
    {
     "id": "c2-b04",
     "text": "Puis vint la Birmanie.",
     "mentions": []
    },
    {
     "id": "c2-b05",
     "text": "Il débarqua à Rangoun dans une chaleur qui n’était pas celle du Texas : une chaleur mouillée, épaisse, qui collait la chemise au dos avant la sortie de l’aéroport et ne la décollait plus. La ville était vieille, verte, délabrée avec une sorte de grâce ; les façades coloniales se décomposaient doucement sous les pluies, les arbres poussaient dans les gouttières, et au-dessus de tout, sur sa colline, la pagode Shwedagon brillait comme un morceau de soleil tombé là par erreur. Le soir, quand la lumière baissait, son or devenait rose, puis cuivre, puis une lueur que John ne sut jamais nommer.",
     "mentions": []
    },
    {
     "id": "c2-b06",
     "text": "Le pays était tenu par des militaires. Ils avaient écrasé les manifestations de 1988, organisé en 1990 des élections qu’ils avaient perdues, puis décidé que le résultat ne comptait pas. La femme qui les avait gagnées, Aung San Suu Kyi, vivait assignée à résidence dans une maison au bord du lac Inya, et les habitants de Rangoun, qui passaient devant en bus, regardaient droit devant eux avec une application qui en disait plus long que n’importe quel tract. John apprit à lire ces regards-là. C’était une autre sorte de carte : celle des choses qu’on ne montre pas.",
     "mentions": []
    },
    {
     "id": "c2-b07",
     "text": "Il ne parlerait jamais de ce qu’il faisait exactement à l’ambassade, et ce livre ne le lui fera pas dire. Mais il y a des choses qu’on voit à Rangoun au début des années quatre-vingt-dix quand on a vingt-cinq ans et les yeux ouverts, et John les vit. Il vit qu’une carte d’état-major pouvait être un secret d’État. Il vit que dans ce pays les téléphones étaient rares et écoutés, les photocopieuses surveillées, et qu’un plan de ville exact valait plus cher qu’une montre. Il vit que celui qui sait où sont les choses a le pouvoir sur ceux qui l’ignorent, et que la première chose que fait un pouvoir qui a peur, c’est d’éteindre la lumière.",
     "mentions": []
    },
    {
     "id": "c2-b08",
     "text": "Il avait un ami, parmi le personnel local de l’ambassade, un homme d’une quarantaine d’années que tout le monde appelait Ko Aung, qui parlait un anglais d’avant-guerre appris dans des livres de missionnaires et qui connaissait chaque ruelle de Rangoun. Un après-midi de mousson, alors que la pluie tombait si dru qu’on ne voyait plus l’autre côté de la rue, ils se réfugièrent dans une maison de thé, sous un auvent de tôle qui résonnait comme un tambour. Ko Aung commanda un thé au lait trop sucré, puis, sans prévenir, prit le stylo de John et se mit à dessiner sur une serviette en papier.",
     "mentions": []
    },
    {
     "id": "c2-b09",
     "text": "— Mon village, dit-il. Dans le delta. À deux jours de bateau.",
     "mentions": []
    },
    {
     "id": "c2-b10",
     "text": "Il traça la rivière, les rizières, la pagode blanche, l’école, la maison de son père avec son toit de palmes. Il dessina le puits, le grand banian sous lequel les vieux jouaient aux dames, le chemin qui menait au bac. Il dessina un petit rond à côté de la pagode et dit que c’était l’endroit où il avait embrassé sa femme pour la première fois, et il rit en disant cela, et le rire se perdit dans le tambour de la pluie.",
     "mentions": []
    },
    {
     "id": "c2-b11",
     "text": "— Sur les cartes de l’armée, dit-il en tapotant la serviette, il n’y a pas tout ça. Il y a la rivière. Il y a le numéro. C’est tout.",
     "mentions": []
    },
    {
     "id": "c2-b12",
     "text": "— Et sur les nôtres ?",
     "mentions": []
    },
    {
     "id": "c2-b13",
     "text": "Ko Aung haussa les épaules avec politesse, ce qui voulait dire : sur les vôtres non plus.",
     "mentions": []
    },
    {
     "id": "c2-b14",
     "text": "John garda la serviette. Il la glissa dans son portefeuille, où elle resta des années, pliée en quatre, de plus en plus douce, jusqu’à ce que l’encre ne soit plus qu’un souvenir bleu. Il pensait qu’il y avait là quelque chose d’important, sans pouvoir dire quoi : que la carte de l’armée et la carte de Ko Aung décrivaient le même endroit, et que seule la seconde donnait envie d’y aller.",
     "mentions": []
    },
    {
     "id": "c2-b15",
     "text": "Le soir, dans l’appartement que lui louait l’administration, il lisait sous le ventilateur. Les livres arrivaient par la valise diplomatique, en retard de plusieurs mois, dans des cartons qui sentaient le moisi en arrivant. En 1992, dans l’un d’eux, il y avait un roman au titre bizarre, Snow Crash, d’un certain Neal Stephenson. Une couverture criarde, un héros livreur de pizzas pour la mafia et hacker de génie, un univers d’avenir où les gens vivaient la moitié de leur temps dans un monde virtuel appelé le Métavers. John le lut en deux nuits, à moitié amusé, à moitié inquiet, car le futur que décrivait Stephenson était franchement désagréable.",
     "mentions": []
    },
    {
     "id": "c2-b16",
     "text": "Et puis, au détour d’un chapitre, il tomba sur une chose qui le fit se redresser dans son lit. Dans le roman, une organisation possédait un logiciel appelé simplement Earth. Un globe, sur un écran. On pouvait le faire tourner, puis plonger dessus, traverser les nuages, descendre sur un continent, un pays, une ville, une rue, jusqu’à voir un seul bâtiment, une seule fenêtre, toutes les données du monde rangées au bon endroit, à la bonne échelle. John posa le livre ouvert sur sa poitrine. Au plafond, les pales du ventilateur tournaient en faisant trembler les ombres. Il pensa aux cinq sacs de courses, au mur couvert de cartes, au toit du garage et aux satellites. Il pensa à la serviette de Ko Aung.",
     "mentions": []
    },
    {
     "id": "c2-b17",
     "text": "On pourrait faire ça, pensa-t-il. Pas dans un roman. Pour de vrai.",
     "mentions": []
    },
    {
     "id": "c2-b18",
     "text": "Il ne savait pas comment. Il ne savait même pas si c’était possible : les ordinateurs qu’il connaissait peinaient à afficher un labyrinthe en seize couleurs. Mais l’idée s’était installée en lui avec la tranquillité des idées qui savent qu’elles ont le temps. Elle attendit.",
     "mentions": []
    },
    {
     "id": "c2-b19",
     "text": "Il y eut d’autres soirs, d’autres pluies, et des nouvelles du monde qui arrivaient avec retard. À Washington, lui écrivait-on, les universités commençaient à se relier entre elles par un réseau que les militaires avaient inventé et que les étudiants s’étaient approprié ; on parlait d’un logiciel qui permettait de naviguer d’un document à l’autre en cliquant sur des mots soulignés. John lisait ces lettres à Rangoun, dans un pays où, disait-on, on ne pouvait pas envoyer un fax sans que quelqu’un le lise avant le destinataire, et il sentit, pour la première fois de sa vie, qu’il était au mauvais endroit au mauvais moment. Le monde basculait ailleurs. Il le voyait basculer de loin.",
     "mentions": []
    },
    {
     "id": "c2-b20",
     "text": "Il comprit aussi autre chose, plus lentement. Il aimait ce métier, mais il n’était pas fait pour lui. Un diplomate représente ; il porte la parole d’un État, il la protège, il la plie, il la transmet. John voulait fabriquer. Il voulait que les gens puissent voir par eux-mêmes, sans attendre qu’on leur résume le monde dans un télégramme. L’idée était naïve, il le savait. Elle avait la naïveté des idées qui finissent par changer les choses, mais il ne le savait pas encore, et personne ne le lui aurait garanti.",
     "mentions": []
    },
    {
     "id": "c2-b21",
     "text": "Il se renseigna. Il y avait en Californie, à Berkeley, une école de commerce, Haas, où l’on apprenait à monter des entreprises, et où l’on croisait, disait-on, les gens qui fabriquaient les ordinateurs de demain. Il envoya un dossier. Il ne dit presque rien à personne. On lui répondit oui.",
     "mentions": []
    },
    {
     "id": "c2-b22",
     "text": "En 1994, il remit sa démission. Son supérieur le regarda avec l’air de quelqu’un qui voit un jeune homme sérieux faire une bêtise, et le lui dit gentiment. John répondit qu’il avait sans doute raison. Il partit quand même.",
     "mentions": []
    },
    {
     "id": "c2-b23",
     "text": "Ko Aung l’accompagna jusqu’à l’aéroport. Sur le trottoir, sous un ciel lourd, ils se serrèrent la main longtemps, à l’occidentale, puis Ko Aung joignit les mains devant son front, à la birmane, et John l’imita maladroitement.",
     "mentions": []
    },
    {
     "id": "c2-b24",
     "text": "— Quand tu auras fait ta machine, dit Ko Aung, qui ne savait rien de la machine mais devinait beaucoup de choses, mets mon village dedans.",
     "mentions": []
    },
    {
     "id": "c2-b25",
     "text": "— Promis.",
     "mentions": []
    },
    {
     "id": "c2-b26",
     "text": "— Avec la pagode.",
     "mentions": []
    },
    {
     "id": "c2-b27",
     "text": "— Avec la pagode. Et le banian.",
     "mentions": []
    },
    {
     "id": "c2-b28",
     "text": "— Et le petit rond.",
     "mentions": []
    },
    {
     "id": "c2-b29",
     "text": "John rit. Ko Aung aussi. Puis le taxi klaxonna, et il fallut y aller.",
     "mentions": []
    },
    {
     "id": "c2-b30",
     "text": "L’avion décolla vers le sud-ouest, puis vira au-dessus du delta de l’Irrawaddy. John avait demandé un hublot. En bas, le pays se déroula d’un coup, comme une carte qu’on défroisse : les bras innombrables du fleuve, brun et or dans la lumière de fin d’après-midi, les rizières en damier d’un vert presque fluorescent, les villages posés au bord de l’eau comme des perles sur un fil. Quelque part là-dessous, à deux jours de bateau, il y avait une pagode blanche, un banian, un petit rond sur une serviette. D’ici, c’était invisible. D’ici, tout était beau et rien n’avait de nom.",
     "mentions": []
    },
    {
     "id": "c2-b31",
     "text": "Il colla le front au hublot jusqu’à ce que les nuages ferment le paysage. Il pensait : il faudrait qu’on puisse voir les deux à la fois. D’en haut, le tout. D’en bas, le nom des choses. Et passer de l’un à l’autre sans se perdre.",
     "mentions": []
    },
    {
     "id": "c2-b32",
     "text": "Il avait vingt-sept ans. Il n’avait ni argent, ni associés, ni la moindre idée de la façon dont on bâtit une entreprise. Il avait une serviette en papier dans son portefeuille, un roman corné dans son sac, et la certitude, qu’il n’aurait su défendre devant aucun jury, que le reste finirait par venir.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-3",
   "number": 3,
   "title": "Meridian",
   "blocks": [
    {
     "id": "c3-b01",
     "text": "Léna Marchal était venue en Californie pour apprendre à calculer la lumière, et elle passa l’hiver 1995 à se faire tuer par des araignées géantes.",
     "mentions": []
    },
    {
     "id": "c3-b02",
     "text": "Elle avait vingt-deux ans, un accent qu’elle ne parvenait pas à perdre et qu’on trouvait charmant, ce qui l’agaçait, et une bourse d’échange d’un an au département d’informatique de Berkeley. Elle venait de Brest. Son père était hydrographe au service de la Marine : il passait des semaines en mer, sur des bâtiments gris, à promener au-dessus des fonds des sondeurs qui renvoyaient des échos, et il en tirait des cartes du dessous de l’eau, des cartes que personne ne verrait jamais de ses propres yeux et sur lesquelles pourtant les navires comptaient pour ne pas mourir. Enfant, Léna s’endormait dans l’odeur de papier calque et de crayon gras de son bureau. Elle avait retenu de lui que le monde avait des couches, que la plus visible n’était pas toujours la plus importante, et qu’on pouvait passer sa vie à dessiner ce qu’on ne verrait pas.",
     "mentions": []
    },
    {
     "id": "c3-b03",
     "text": "Elle, pour l’instant, dessinait des sphères. Au laboratoire d’images de synthèse, on lui avait confié la modélisation de la lumière sur des surfaces : comment un rayon rebondit sur une pomme, s’enfonce un peu dans sa peau, en ressort rougi. Elle aimait ce travail d’une passion un peu austère. Elle passait ses journées devant des stations de travail qui mettaient des heures à rendre une seule image, et elle rentrait le soir dans une colocation de Telegraph Avenue où l’on buvait du thé au jasmin en parlant de la fin du monde.",
     "mentions": []
    },
    {
     "id": "c3-b04",
     "text": "C’était sa colocataire, une étudiante en linguistique qui passait ses nuits sur Internet, qui lui avait parlé de Meridian 59.",
     "mentions": []
    },
    {
     "id": "c3-b05",
     "text": "— C’est un monde, expliqua-t-elle en installant les disquettes. Un monde entier, en trois dimensions. Et tous les gens que tu croises dedans sont des vrais gens, connectés en même temps que toi.",
     "mentions": []
    },
    {
     "id": "c3-b06",
     "text": "— Des vrais gens déguisés en elfes.",
     "mentions": []
    },
    {
     "id": "c3-b07",
     "text": "— Des vrais gens. C’est ça, le truc.",
     "mentions": []
    },
    {
     "id": "c3-b08",
     "text": "Léna s’était moquée. Le lendemain, elle s’était connectée par curiosité professionnelle, pour voir comment ces gens-là calculaient leur lumière. La lumière était pauvre, les murs en briques pixelisées, les torches clignotaient d’un orange de fête foraine. Mais il y avait, dans ces rues rudimentaires, des silhouettes qui marchaient, s’arrêtaient, se saluaient, et au-dessus de chacune flottait un nom qui n’était pas celui d’un programme. Quelqu’un, à Seattle ou à Boston ou dans une ferme de l’Iowa, faisait avancer ce petit bonhomme maladroit. Elle choisit un nom de fée des eaux bretonne, Ondine, parce que c’était le premier qui lui était venu, et elle sortit des murs de la ville. Au bout de deux minutes, une araignée la tua.",
     "mentions": []
    },
    {
     "id": "c3-b09",
     "text": "Elle ressuscita à la chapelle, nue, pauvre, vexée. Elle ressortit. Une autre araignée la tua.",
     "mentions": []
    },
    {
     "id": "c3-b10",
     "text": "Au troisième retour, quelqu’un l’attendait devant la chapelle. Une silhouette haute, en armure dépareillée, qui s’appelait Pélican.",
     "mentions": []
    },
    {
     "id": "c3-b11",
     "text": "— tu vas encore te faire manger, écrivit Pélican, sans majuscules, avec une lenteur de dactylographe à deux doigts. suis-moi. on va par l’autre porte.",
     "mentions": []
    },
    {
     "id": "c3-b12",
     "text": "Elle le suivit. Il connaissait les chemins. Il marchait devant, s’arrêtait aux carrefours, attendait qu’elle le rattrape, et il lui expliquait le monde avec un sérieux comique, comme un guide de musée qui prendrait les visiteurs pour des enfants et les enfants pour des visiteurs. Il savait où poussaient les herbes rares, quel pont était gardé, quelle forêt valait le détour. Au bout d’une heure, elle lui demanda comment il savait tout ça.",
     "mentions": []
    },
    {
     "id": "c3-b13",
     "text": "— je fais des cartes, répondit-il. sur du papier millimétré. j’ai tout le continent, sauf le nord.",
     "mentions": []
    },
    {
     "id": "c3-b14",
     "text": "— Pourquoi ?",
     "mentions": []
    },
    {
     "id": "c3-b15",
     "text": "— parce que personne ne l’a fait. et parce que c’est mon métier, un peu. enfin, ce sera mon métier.",
     "mentions": []
    },
    {
     "id": "c3-b16",
     "text": "Il était étudiant en géographie à Austin, au Texas. Il venait de La Nouvelle-Orléans. Il s’appelait Daniel, mais tout le monde disait Dan, et elle pouvait l’appeler Pélican si elle préférait, c’était l’oiseau de la Louisiane, un grand machin maladroit qui plonge la tête la première et qui remonte toujours avec quelque chose dans le bec. Elle lui dit qu’elle venait de Brest, que son père faisait des cartes du fond de la mer. Il y eut un silence dans la fenêtre de discussion, un de ces silences typographiques où l’on devine quelqu’un qui relit une phrase.",
     "mentions": []
    },
    {
     "id": "c3-b17",
     "text": "— des cartes de ce qu’on voit pas, écrivit-il enfin. c’est les plus belles.",
     "mentions": []
    },
    {
     "id": "c3-b18",
     "text": "Elle rit toute seule devant son écran, à deux heures du matin, et sa colocataire, qui passait dans le couloir, la regarda d’un air entendu qu’elle trouva insupportable.",
     "mentions": []
    },
    {
     "id": "c3-b19",
     "text": "Le monde de Meridian ouvrit officiellement ses portes à la fin de décembre 1995. Il y eut soudain des centaines de silhouettes dans les rues, puis des milliers, des voix de partout, des disputes, des amitiés, des vols, des mariages. Léna n’avait jamais vu une chose pareille. Ce qui la frappa, ce ne fut pas le jeu, qui restait rudimentaire, ce furent les gens : la façon dont ils se regroupaient d’eux-mêmes, sans que personne le leur demande, comme la limaille de fer autour d’un aimant. Des bandes se formaient, se donnaient un nom, des couleurs, un chef, des règles. Elles se réunissaient à heure fixe dans une taverne, se défendaient les unes les autres, pleuraient ensemble quand l’un des leurs était tué par un joueur malveillant. Les concepteurs n’avaient rien prévu de tel. Le monde n’avait pas de mot pour ça ; les joueurs en prirent un dans les vieux livres, et ils appelèrent ça des guildes.",
     "mentions": []
    },
    {
     "id": "c3-b20",
     "text": "Pélican fonda la sienne un soir de janvier, un peu par hasard, parce qu’une dizaine de voyageurs perdus avaient pris l’habitude de le suivre et qu’il fallait bien donner un nom à la procession. Il proposa les Arpenteurs. Personne n’avait de meilleure idée. La guilde se donna pour règle de cartographier le monde entier et de partager ses cartes avec tous ceux qui le demandaient, amis ou ennemis, ce qui fit ricaner les guildes guerrières et remplit les Arpenteurs d’un orgueil tranquille. Ondine fut nommée, par acclamation et contre son gré, secrétaire.",
     "mentions": []
    },
    {
     "id": "c3-b21",
     "text": "Le problème était que le monde ne savait rien d’eux. Il n’y avait aucun moyen, dans le jeu, de reconnaître un Arpenteur, de lui parler en privé s’il était loin, de lui confier une clef. Tout se faisait à la main, par des listes tenues dans des fichiers texte, par des rendez-vous notés sur des Post-it. Léna, que l’informatique rendait méthodique, écrivit un soir un long rapport aux concepteurs. Elle y décrivait comment les guildes naissaient, ce dont elles avaient besoin, ce qui les faisait mourir. Elle l’envoya à l’adresse de contact d’Archetype Interactive, la petite société qui faisait tourner Meridian, sans rien en attendre.",
     "mentions": []
    },
    {
     "id": "c3-b22",
     "text": "La réponse arriva deux jours plus tard. Elle était signée John Hanke. Il la remerciait, lui posait onze questions numérotées, et ajoutait en post-scriptum qu’il était lui-même à Berkeley, en MBA à Haas, et qu’il pouvait lui offrir un café si elle voulait bien lui expliquer tout ça de vive voix.",
     "mentions": []
    },
    {
     "id": "c3-b23",
     "text": "Elle le retrouva dans un café bruyant près du campus. Elle s’attendait à un homme d’affaires en cravate ; elle trouva un grand Texan de vingt-huit ans en chemise à carreaux, un peu voûté, au visage ouvert et aux yeux attentifs, qui avait posé devant lui un carnet et ne l’ouvrit jamais. Il écoutait. C’était la première chose qu’elle remarqua : il écoutait comme d’autres parlent, avec tout le corps. Elle lui raconta les Arpenteurs, les listes, les Post-it, la taverne du jeudi, le joueur qui avait pleuré en ligne parce qu’un autre l’avait trahi, et le fait étrange, qu’elle n’arrivait pas à s’expliquer, que ces gens qui ne s’étaient jamais vus s’aimaient pour de bon.",
     "mentions": []
    },
    {
     "id": "c3-b24",
     "text": "— Ce n’est pas nous qui les avons faites, dit Hanke au bout d’un moment. Les guildes. Elles se sont formées toutes seules.",
     "mentions": []
    },
    {
     "id": "c3-b25",
     "text": "— Oui.",
     "mentions": []
    },
    {
     "id": "c3-b26",
     "text": "— Alors il faut les aider. Pas les diriger : les aider. Leur donner des outils.",
     "mentions": []
    },
    {
     "id": "c3-b27",
     "text": "Il le dit sans emphase, comme on constate qu’il pleut, et elle comprit plus tard que c’était sa façon de prendre les décisions importantes. Il posa encore quelques questions, précises, presque techniques : combien de membres, à partir de combien une guilde se divise, qui garde les clefs. Puis il la remercia, paya les cafés, et s’en alla d’un pas rapide, avec l’air d’un homme qui a trouvé quelque chose sur le trottoir et se dépêche de le rapporter chez lui.",
     "mentions": []
    },
    {
     "id": "c3-b28",
     "text": "Quelques semaines plus tard, Meridian eut ses guildes officielles : des noms reconnus par le jeu, des halls où l’on pouvait se réunir, des canaux pour se parler. Les Arpenteurs eurent leur bannière, une boussole blanche sur fond bleu. Pélican écrivit à Ondine qu’il ne savait pas qui elle avait soudoyé, mais que c’était du beau travail.",
     "mentions": []
    },
    {
     "id": "c3-b29",
     "text": "Ils se parlaient maintenant toutes les nuits. Ils avaient fini par épuiser le monde du jeu ; il restait le leur. Il lui racontait La Nouvelle-Orléans, sa mère qui tenait une petite maison à Gentilly, les orages d’été qui tombaient à heure fixe, la façon dont la ville était posée plus bas que l’eau qui l’entourait, retenue par des digues auxquelles personne ne pensait jamais. Elle lui racontait Brest, rebâtie après la guerre en béton gris, la rade, le crachin qui ne mouillait pas mais pénétrait, son père qui revenait de mer avec des cartes de montagnes englouties. Il lui dit qu’il voulait devenir pilote, faire des photographies aériennes, ces grandes images verticales qu’on assemble pour faire des cartes. Elle lui dit qu’elle voulait fabriquer des images si justes qu’on ne saurait plus les distinguer du réel, et il répondit que ce serait dommage, qu’il aimait bien savoir quand il était dans le réel.",
     "mentions": []
    },
    {
     "id": "c3-b30",
     "text": "Ils ne s’étaient jamais vus. Ils ne s’étaient pas envoyé de photographies : on n’en envoyait pas encore, en 1996, ou si peu, et aucun des deux n’avait proposé. Léna connaissait de Dan sa ponctuation, ses fautes de frappe, son humour qui arrivait avec un temps de retard comme le tonnerre après l’éclair, et une armure dépareillée sous un nom d’oiseau. C’était peu. C’était étrangement beaucoup. Elle se surprenait, le jour, au laboratoire, devant ses pommes éclairées, à penser à une réplique de la veille et à sourire. Elle se trouvait ridicule. Elle continuait.",
     "mentions": []
    },
    {
     "id": "c3-b31",
     "text": "Au printemps, on apprit par les forums qu’Archetype était en train de se vendre. Un éditeur, 3DO, rachetait la société et son monde. Les joueurs s’inquiétèrent, comme s’inquiètent les habitants d’une ville qu’on vend avec eux dedans. Léna croisa Hanke une ou deux fois sur le campus, pressé, un téléphone portable gros comme une brique à la main, et il lui fit chaque fois un signe de tête amical, de loin, comme un voisin.",
     "mentions": []
    },
    {
     "id": "c3-b32",
     "text": "Elle le revit en juin, à une fête de fin d’année dans une maison de North Berkeley, pleine de futurs banquiers et de futurs fondateurs de choses. Il portait encore, par-dessus son jean, la toge noire de la cérémonie de remise des diplômes, qu’il avait oublié d’enlever ou décidé de garder. Quelqu’un racontait à qui voulait l’entendre que Hanke avait reçu son MBA le matin et signé la vente de la société l’après-midi, le même jour, et que c’était la meilleure blague de la promotion. Hanke, au milieu d’un cercle, souriait sans confirmer ni démentir, un gobelet de bière tiède à la main.",
     "mentions": []
    },
    {
     "id": "c3-b33",
     "text": "Léna s’approcha. Il la reconnut aussitôt.",
     "mentions": []
    },
    {
     "id": "c3-b34",
     "text": "— L’Arpenteuse.",
     "mentions": []
    },
    {
     "id": "c3-b35",
     "text": "— Secrétaire des Arpenteurs.",
     "mentions": []
    },
    {
     "id": "c3-b36",
     "text": "— Pardon. Madame la secrétaire.",
     "mentions": []
    },
    {
     "id": "c3-b37",
     "text": "— Félicitations. Pour les deux.",
     "mentions": []
    },
    {
     "id": "c3-b38",
     "text": "Il haussa les épaules.",
     "mentions": []
    },
    {
     "id": "c3-b39",
     "text": "— Le diplôme, c’est un papier. La vente, c’est un début. On a appris des choses qu’on ne savait pas qu’on apprenait.",
     "mentions": []
    },
    {
     "id": "c3-b40",
     "text": "— Les guildes.",
     "mentions": []
    },
    {
     "id": "c3-b41",
     "text": "— Les guildes, dit-il. Les gens se rassemblent. Même dans un monde faux, ils se rassemblent. Surtout dans un monde faux, peut-être, parce qu’il n’y a que ça de vrai dedans.",
     "mentions": []
    },
    {
     "id": "c3-b42",
     "text": "Il but une gorgée, regarda par la fenêtre la baie grise où le brouillard commençait à entrer par la Golden Gate, lent, dense, comme une coulée de lait.",
     "mentions": []
    },
    {
     "id": "c3-b43",
     "text": "— Un jour, dit-il, il faudra que ça marche dans l’autre sens.",
     "mentions": []
    },
    {
     "id": "c3-b44",
     "text": "— Quel sens ?",
     "mentions": []
    },
    {
     "id": "c3-b45",
     "text": "Mais quelqu’un l’appelait de l’autre côté de la pièce, et il s’excusa, et il ne répondit pas.",
     "mentions": []
    },
    {
     "id": "c3-b46",
     "text": "Cette nuit-là, en rentrant, Léna trouva un message de Pélican dans sa boîte. Pas dans le jeu : dans sa vraie boîte, celle de l’université, où il n’avait jamais écrit. Il avait pris des majuscules, pour une fois, et cela la troubla plus que le contenu.",
     "mentions": []
    },
    {
     "id": "c3-b47",
     "text": "« Je viens à San Francisco le 12 juillet. Pour un stage de photographie aérienne à Oakland, trois semaines. Je ne sais pas si c’est une bonne idée de se voir. On se connaît bien, là-dedans, et peut-être qu’on ne se connaît pas du tout. Peut-être que je suis moins bien qu’en armure. Mais j’aimerais savoir. Tu peux dire non, je continuerai à t’attendre devant la chapelle. »",
     "mentions": []
    },
    {
     "id": "c3-b48",
     "text": "Elle resta longtemps devant l’écran. Par la fenêtre ouverte entrait le brouillard, froid, salé, qui sentait un peu Brest. Elle pensa aux araignées, à l’autre porte, au papier millimétré, à la boussole blanche sur fond bleu. Elle pensa que, jusqu’ici, toute sa vie avait consisté à fabriquer des images de choses, et qu’on lui proposait, pour une fois, la chose.",
     "mentions": []
    },
    {
     "id": "c3-b49",
     "text": "Elle écrivit « oui ». Puis elle effaça, et écrivit « Oui. » Avec une majuscule, elle aussi. Et elle éteignit l’ordinateur avant d’avoir le temps de changer d’avis.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-4",
   "number": 4,
   "title": "Le globe dans le Dell",
   "blocks": [
    {
     "id": "c4-b01",
     "text": "À trois heures du matin, heure de Californie, il y avait toujours quelqu’un pour jouer au spades.",
     "mentions": []
    },
    {
     "id": "c4-b02",
     "text": "John Hanke l’avait vérifié bien des fois, penché sur les tableaux de bord de The Big Network, la petite société de jeux en ligne qu’il avait fondée avec Steve Sellers au sortir de l’aventure Meridian. On n’y combattait pas de dragons. On y jouait aux cartes, aux dames, aux échecs, au backgammon, aux jeux que les grands-mères connaissaient et que les petits-enfants apprenaient sur leurs genoux. C’était, disait-il aux investisseurs, le contraire d’une révolution : les jeux les plus vieux du monde sur le réseau le plus neuf. Les investisseurs trouvaient la formule jolie et demandaient combien ça rapporterait.",
     "mentions": []
    },
    {
     "id": "c4-b03",
     "text": "Ce que John regardait, lui, ce n’étaient pas les parties. C’étaient les fenêtres de discussion à côté des parties. Une retraitée de Floride et un chauffeur routier de l’Ohio qui jouaient ensemble tous les soirs depuis six mois et ne s’étaient jamais vus. Un groupe d’étudiants qui se retrouvait pour le backgammon et ne jouait presque plus, tant ils avaient à se dire. Une femme qui s’excusait d’être absente la semaine suivante parce qu’elle se faisait opérer, et trente messages de joueurs qui lui souhaitaient bon courage. Les cartes étaient un prétexte. Les gens venaient pour les gens.",
     "mentions": []
    },
    {
     "id": "c4-b04",
     "text": "Il avait retenu la leçon de Meridian, et celle-ci la confirmait : on croyait vendre un jeu, on vendait une place où se retrouver. Il poussa l’équipe à construire LivePlace, un petit programme qui permettait à deux personnes de se parler tout en naviguant ensemble sur le Web, de voir la même page au même moment, comme deux amis penchés sur le même journal. C’était ambitieux, un peu en avance, et cela marchait une fois sur deux. Mais les fois où ça marchait, il y avait quelque chose de nouveau dans l’air : deux inconnus qui regardaient ensemble la même image d’une plage de Thaïlande en se demandant s’ils iraient un jour.",
     "mentions": []
    },
    {
     "id": "c4-b05",
     "text": "Au printemps 1999, un ami lui parla d’une start-up de Mountain View qui faisait des moteurs graphiques pour les jeux vidéo, Intrinsic Graphics, fondée par une poignée d’anciens de Silicon Graphics. Des magiciens, disait l’ami. Ils avaient, pour montrer ce que leur moteur savait faire, une démonstration que personne n’arrivait à oublier. John y alla un après-midi, par curiosité.",
     "mentions": []
    },
    {
     "id": "c4-b06",
     "text": "On le fit entrer dans une salle aux stores baissés où ronronnaient des machines trop grosses pour leurs bureaux. Un ingénieur au regard vif, Michael Jones, mit en marche la démonstration sans rien dire, avec la coquetterie des gens qui savent que ce qu’ils vont montrer se passe de commentaire. Sur l’écran apparut la Terre. Elle tournait lentement dans le noir, bleue, blanche, brune, avec ses nuages accrochés aux océans. Jones posa la main sur la souris, et la Terre s’arrêta, puis grossit. Ils plongèrent. Le continent américain se déroula sous eux, la côte ouest, la baie de San Francisco, la péninsule ; les couleurs se précisèrent, les montagnes prirent du relief, les villes se dessinèrent, puis les rues, puis les toits. Tout était fluide, continu, sans ces sauts d’image en image auxquels les ordinateurs avaient habitué tout le monde. Ils finirent au-dessus du parking d’Intrinsic, où l’on distinguait, en plissant les yeux, une tache rouge qui était la voiture de quelqu’un.",
     "mentions": []
    },
    {
     "id": "c4-b07",
     "text": "— Pour les jeux, expliqua Jones, c’est pour montrer qu’on peut charger d’énormes quantités de données à la volée. Là, c’est des images satellite et des photos aériennes, des téraoctets. Mais le moteur s’en fiche : ça pourrait être un donjon.",
     "mentions": []
    },
    {
     "id": "c4-b08",
     "text": "John ne répondit pas tout de suite. Il regardait la voiture rouge. Il pensait au plafond de Rangoun, aux pales du ventilateur, au logiciel Earth de Snow Crash qu’il avait cru réservé aux romans. Il pensait au toit du garage de Cross Plains.",
     "mentions": []
    },
    {
     "id": "c4-b09",
     "text": "— Ce n’est pas une démo, dit-il enfin. C’est le produit.",
     "mentions": []
    },
    {
     "id": "c4-b10",
     "text": "Jones et l’ingénieur à côté de lui, un certain Brian McClendon, échangèrent un regard. On leur avait déjà dit que c’était joli. On ne leur avait jamais dit ça.",
     "mentions": []
    },
    {
     "id": "c4-b11",
     "text": "John revint. Il revint plusieurs fois, et chaque fois il posait des questions sur ce qu’il faudrait pour que n’importe qui, chez soi, sur un ordinateur ordinaire, puisse faire ce voyage. La réponse était décourageante : il faudrait des données sur toute la planète, des serveurs pour les distribuer, des connexions Internet que la moitié des foyers n’avaient pas, et un modèle économique que personne n’avait inventé. John notait. Il ne se décourageait pas. Il avait remarqué depuis longtemps que les réponses décourageantes étaient souvent les listes de courses des choses à faire.",
     "mentions": []
    },
    {
     "id": "c4-b12",
     "text": "Un soir de ce printemps-là, il débrancha la machine qu’on lui avait prêtée pour la montrer autour de lui, une tour Dell beige et un écran cathodique qui pesait le poids d’un enfant, les chargea dans le coffre de sa voiture, et alla sonner chez Bill Kilday.",
     "mentions": []
    },
    {
     "id": "c4-b13",
     "text": "Kilday ouvrit en tee-shirt, une bière à la main, et regarda l’écran que John portait dans ses bras comme on regarde un voisin qui arrive avec une tronçonneuse.",
     "mentions": []
    },
    {
     "id": "c4-b14",
     "text": "— Tu déménages ?",
     "mentions": []
    },
    {
     "id": "c4-b15",
     "text": "— Tu m’as dit de te prévenir. Je te préviens.",
     "mentions": []
    },
    {
     "id": "c4-b16",
     "text": "Il fallut un quart d’heure pour tout brancher sur la table de la salle à manger, entre la corbeille de fruits et le courrier en retard. Kilday avait fait carrière dans le marketing ; il avait vu passer des centaines de démonstrations et appris à sourire poliment devant chacune. Il s’assit avec ce sourire-là. Sur l’écran, la Terre se mit à tourner.",
     "mentions": []
    },
    {
     "id": "c4-b17",
     "text": "— Donne-moi ton adresse, dit John.",
     "mentions": []
    },
    {
     "id": "c4-b18",
     "text": "Kilday la lui donna, en riant à moitié. John la tapa. La Terre s’arrêta net. Puis elle repartit en sens inverse, pivota, se présenta sous le bon angle, et commença sa chute. L’Amérique, un État, une ville ; le quartier ; les rues avec leurs arbres ; et enfin, au milieu de l’écran, un toit gris, une allée, un rectangle de pelouse et, garée devant, la tache claire d’une voiture qui était la sienne.",
     "mentions": []
    },
    {
     "id": "c4-b19",
     "text": "Kilday ne souriait plus. Il se pencha, lentement, jusqu’à ce que son nez touche presque l’écran.",
     "mentions": []
    },
    {
     "id": "c4-b20",
     "text": "— C’est ma maison.",
     "mentions": []
    },
    {
     "id": "c4-b21",
     "text": "— C’est ta maison.",
     "mentions": []
    },
    {
     "id": "c4-b22",
     "text": "— C’est ma voiture.",
     "mentions": []
    },
    {
     "id": "c4-b23",
     "text": "— Elle aurait besoin d’être lavée, dit John.",
     "mentions": []
    },
    {
     "id": "c4-b24",
     "text": "Kilday resta un long moment sans rien dire, ce qui, pour lui, tenait du prodige. Puis il se tourna vers son ami et posa la question que John attendait depuis Rangoun, la seule qui comptait.",
     "mentions": []
    },
    {
     "id": "c4-b25",
     "text": "— Tout le monde pourra faire ça ?",
     "mentions": []
    },
    {
     "id": "c4-b26",
     "text": "— C’est l’idée.",
     "mentions": []
    },
    {
     "id": "c4-b27",
     "text": "— Chez soi ? Sur sa maison ?",
     "mentions": []
    },
    {
     "id": "c4-b28",
     "text": "— Sur la maison de sa grand-mère. Sur l’école où il est allé. Sur la plage où il a demandé sa femme en mariage. Sur Bagdad, sur Tokyo, sur un village de Birmanie à deux jours de bateau.",
     "mentions": []
    },
    {
     "id": "c4-b29",
     "text": "Kilday regarda encore le toit gris.",
     "mentions": []
    },
    {
     "id": "c4-b30",
     "text": "— Je suis dedans, dit-il. Je ne sais pas dans quoi, mais je suis dedans.",
     "mentions": []
    },
    {
     "id": "c4-b31",
     "text": "L’été 1999, The Big Network fut vendu à eUniverse, une société de divertissement en ligne qui avalait à l’époque tout ce qui bougeait. John signa les papiers avec une gratitude sincère et l’esprit ailleurs. Il avait appris, avec Meridian puis avec Big Network, à bâtir, à lever de l’argent, à vendre ; il savait maintenant à quoi il voulait employer tout ça.",
     "mentions": []
    },
    {
     "id": "c4-b32",
     "text": "Chez Intrinsic, le conseil d’administration voulait rester fidèle à sa vocation, les moteurs de jeux vidéo, et regardait la Terre qui tournait comme une distraction coûteuse. On trouva une solution élégante : on en ferait une société à part. On la confia à John. Il en serait le patron, avec une petite équipe venue d’Intrinsic, Chikai Ohazama, Mark Aubin, Phil Keslin, Avi Bar-Zeev, et avec la bénédiction de Jones et de McClendon, qui restaient dans les parages comme des parrains inquiets autour d’un berceau.",
     "mentions": []
    },
    {
     "id": "c4-b33",
     "text": "Il fallait un nom. On en proposa des dizaines, tous mauvais. Ce fut Keyhole qui resta. Le trou de la serrure : l’œil qui regarde par une petite ouverture un monde trop grand pour lui. Certains, dans l’équipe, y entendaient aussi un clin d’œil aux satellites espions américains de la guerre froide, les KH, les Keyhole, dont les photographies avaient longtemps été le secret le mieux gardé du Pentagone. John laissa dire. Il aimait qu’un nom ait deux fonds, comme les cartes de son enfance. Il aimait surtout l’idée qu’on allait prendre un regard réservé aux espions et le donner à tout le monde.",
     "mentions": []
    },
    {
     "id": "c4-b34",
     "text": "Les bureaux s’installèrent à Mountain View, dans un bâtiment bas et quelconque, à quelques rues d’une jeune entreprise de moteur de recherche qui faisait beaucoup parler d’elle et qu’on appelait Google. On y déménagea des tables pliantes, des machines, un tableau blanc où John écrivit le premier jour, en haut à gauche, trois mots qu’il n’effaça jamais : « Toute la Terre ». En dessous, les autres écrivirent la liste de ce qu’il fallait pour y arriver. La liste occupa le reste du tableau, puis déborda sur le mur.",
     "mentions": []
    },
    {
     "id": "c4-b35",
     "text": "Le plus difficile, ce n’était pas le logiciel. Le logiciel, les magiciens d’Intrinsic savaient le faire. Le plus difficile, c’était la Terre elle-même : il fallait l’acheter morceau par morceau. Les images satellite coûtaient une fortune et couvraient mal les villes ; les photographies aériennes étaient plus précises, mais il fallait les commander à des sociétés qui envoyaient des petits avions quadriller le ciel, bande après bande, par temps clair. John passa des semaines au téléphone avec des loueurs d’images, des agences de cadastre, des vendeurs d’orthophotographies qui ne comprenaient pas ce qu’un inconnu voulait faire de leurs pixels. On lui demandait : pour quelle ville ? Il répondait : toutes. On croyait à une plaisanterie.",
     "mentions": []
    },
    {
     "id": "c4-b36",
     "text": "Au début de l’an 2000, il chercha quelqu’un pour prendre en main la chaîne des images : les recevoir, les corriger, les assembler, faire en sorte que les couleurs d’un quartier photographié en avril s’accordent avec celles du quartier voisin photographié en octobre, que les bords se raccordent, que la lumière ne saute pas d’une dalle à l’autre. Il lui fallait une ingénieure de la lumière et de l’image, quelqu’un qui aime les couches. Un nom lui revint, d’un café bruyant de Berkeley et d’un rapport sur les guildes dont il se souvenait presque mot pour mot.",
     "mentions": []
    },
    {
     "id": "c4-b37",
     "text": "Il retrouva Léna Marchal chez un éditeur de logiciels d’images de synthèse à San Francisco, où elle faisait briller des carrosseries de voitures pour des publicités. Elle accepta de venir le voir par curiosité, en prévenant qu’elle n’avait aucune intention de changer de travail. Il lui montra la Terre. Elle ne dit rien pendant tout le voyage, du globe au parking ; puis elle demanda, les yeux sur l’écran, comment ils géraient les écarts de couleur entre les prises de vue, et il sut qu’elle viendrait.",
     "mentions": []
    },
    {
     "id": "c4-b38",
     "text": "— Et les Arpenteurs ? demanda-t-il pendant qu’elle réfléchissait. Le type à l’armure dépareillée, le cartographe du Texas ?",
     "mentions": []
    },
    {
     "id": "c4-b39",
     "text": "Elle rougit un peu, ce qui l’amusa.",
     "mentions": []
    },
    {
     "id": "c4-b40",
     "text": "— Il pilote, dit-elle. Il a eu sa licence. Il fait des photos aériennes pour une société de levés, au Texas et en Louisiane. Il vole tous les jours où il fait beau.",
     "mentions": []
    },
    {
     "id": "c4-b41",
     "text": "— Il est toujours là-bas ?",
     "mentions": []
    },
    {
     "id": "c4-b42",
     "text": "— Il est toujours là-bas. Moi, je suis ici. On se voit quand on peut. On s’écrit beaucoup.",
     "mentions": []
    },
    {
     "id": "c4-b43",
     "text": "John hocha la tête. Il pensa à la serviette de Ko Aung, pliée en quatre dans son portefeuille, et au fait étrange que certaines personnes se trouvent grâce aux cartes et vivent ensuite à des milliers de kilomètres l’une de l’autre, chacune d’un côté.",
     "mentions": []
    },
    {
     "id": "c4-b44",
     "text": "— Il photographie la Terre, dit-il. Et toi, tu l’assembleras. Au fond, vous travaillerez ensemble.",
     "mentions": []
    },
    {
     "id": "c4-b45",
     "text": "— Vous essayez de me recruter ou de me marier ?",
     "mentions": []
    },
    {
     "id": "c4-b46",
     "text": "— Les deux, si ça peut aider.",
     "mentions": []
    },
    {
     "id": "c4-b47",
     "text": "Elle rit. Elle signa la semaine suivante.",
     "mentions": []
    },
    {
     "id": "c4-b48",
     "text": "Le 10 mars 2000, l’indice des valeurs technologiques de New York atteignit le sommet de son histoire. Dans les bureaux de Keyhole, personne ne le remarqua : on était trop occupé à faire tourner la Terre. Personne ne pouvait savoir que ce jour-là, précisément, la marée venait de s’inverser, et qu’elle allait redescendre plus vite qu’elle n’était montée, emportant avec elle des milliers d’entreprises, des milliards de dollars, et presque celle-ci. Sur le tableau blanc, en haut à gauche, il était toujours écrit : « Toute la Terre ». John le relisait chaque matin en arrivant. Il avait trente-deux ans. Il venait de tout miser sur une planète.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-5",
   "number": 5,
   "title": "L’hiver des pionniers",
   "blocks": [
    {
     "id": "c5-b01",
     "text": "Il y avait, dans les photographies de Dan, un défaut que Léna avait appris à aimer.",
     "mentions": []
    },
    {
     "id": "c5-b02",
     "text": "Quand le soleil se trouvait exactement derrière l’avion, au-dessus de la carlingue, l’ombre de l’appareil tombait droit sous lui, sur le sol qu’il photographiait. Autour de cette ombre, la lumière faisait une tache plus claire, un halo où les arbres et les toits perdaient leur relief, et que les photogrammètres appelaient le point chaud. Les logiciels de Keyhole étaient conçus pour effacer ces défauts ; c’était le travail de Léna d’harmoniser les couleurs, de raccorder les bords, de gommer tout ce qui trahissait qu’une image du monde avait été prise par quelqu’un, un certain jour, à une certaine heure. Mais parfois, en corrigeant une dalle de banlieue de Baton Rouge ou de Corpus Christi, elle tombait sur une petite croix sombre au milieu d’un halo : l’ombre du Cessna de Dan, posée sur un champ de canne à sucre comme une signature. Elle ne l’effaçait pas tout de suite. Elle la regardait un moment. Puis elle l’effaçait quand même, parce que c’était son métier.",
     "mentions": []
    },
    {
     "id": "c5-b03",
     "text": "Ils étaient ensemble depuis cinq ans. Ils ne vivaient pas ensemble ; ils vivaient dans deux fuseaux horaires. Elle se souvenait de juillet 1996 avec une précision qui l’embarrassait : l’aéroport d’Oakland, le hall trop éclairé, et ce grand type aux cheveux noirs en bataille, plus maigre qu’elle ne l’avait imaginé, qui tenait à deux mains, comme un bouclier, une feuille de papier millimétré. Il avait dessiné dessus, à l’encre, une carte de San Francisco faite de mémoire à partir de photos aériennes, avec une croix rouge sur Ocean Beach et une légende : « si tout se passe mal, on se sépare ici ». Tout ne s’était pas mal passé. Ils avaient marché des heures sur la plage dans le brouillard, et à un moment elle avait compris qu’il était exactement le même qu’en armure, sauf qu’il avait des mains, qu’elles tremblaient un peu, et qu’il riait avec tout le visage. Depuis, il y avait eu des week-ends volés, des billets d’avion trop chers, des nuits au téléphone, et la sensation persistante, qu’elle ne disait à personne, de vivre une histoire d’amour à l’échelle d’une carte routière.",
     "mentions": []
    },
    {
     "id": "c5-b04",
     "text": "En juin 2001, Keyhole sortit EarthViewer.",
     "mentions": []
    },
    {
     "id": "c5-b05",
     "text": "Ce ne fut pas un événement mondial. On organisa, dans les bureaux de Mountain View, une petite fête avec des gobelets en plastique, du vin californien et des chips au paprika, et John Hanke fit un discours de quatre minutes où il remerciait tout le monde nommément, y compris la femme de ménage, qui en fut émue. Le produit s’adressait d’abord aux professionnels : des agents immobiliers qui voulaient montrer à leurs clients le toit et le voisinage d’un bâtiment commercial, des urbanistes, des assureurs, quelques services de l’État. On s’abonnait à l’année. On installait un logiciel, on se connectait, et la Terre apparaissait sur l’écran, avec sa promesse : n’importe où, n’importe quand, descendez. La promesse n’était tenue que pour une poignée de villes américaines, les autres restaient floues comme des souvenirs d’enfance. Mais elle était tenue.",
     "mentions": []
    },
    {
     "id": "c5-b06",
     "text": "Léna passa la nuit de la fête au bureau, à corriger une dalle de Phoenix dont le ciel avait viré au vert. Hanke vint la voir vers minuit, un gobelet à la main, et regarda l’écran par-dessus son épaule.",
     "mentions": []
    },
    {
     "id": "c5-b07",
     "text": "— Il y a encore des gens qui vont dire que ça ne sert à rien, dit-il.",
     "mentions": []
    },
    {
     "id": "c5-b08",
     "text": "— Ils auront raison, pour l’instant.",
     "mentions": []
    },
    {
     "id": "c5-b09",
     "text": "— Pour l’instant, dit-il, satisfait, comme si c’était un compliment.",
     "mentions": []
    },
    {
     "id": "c5-b10",
     "text": "Au-dehors, la vallée continuait de se vider. Le printemps avait été celui des premières faillites ; l’été fut celui des faillites en série. Des sociétés dont on avait vu les affiches sur toutes les autoroutes fermaient en une semaine ; on voyait sur les parkings de Mountain View et de Palo Alto des chaises de bureau en cuir vendues au poids, des baby-foots abandonnés, des salariés en tee-shirt à l’effigie d’entreprises mortes qui cherchaient du travail en portant, sans ironie, le nom de leur échec. Chez Keyhole, on avait levé un peu d’argent au printemps, auprès d’un fonds lié à Sony et de quelques autres, et on le comptait maintenant comme on compte l’eau dans un désert.",
     "mentions": []
    },
    {
     "id": "c5-b11",
     "text": "Puis vint le mardi de septembre.",
     "mentions": []
    },
    {
     "id": "c5-b12",
     "text": "Léna était arrivée tôt, comme toujours, pour profiter du calme. Quelqu’un avait allumé la télévision de la salle de réunion, et elle entendit d’abord le silence des autres, puis le son. Elle resta debout, sa tasse à la main, avec les premiers arrivés, pendant que les images se répétaient en boucle. Personne ne parlait. À un moment, sans que personne le lui demande, elle retourna à son poste et ouvrit EarthViewer sur New York. La ville apparut, nette, dans la lumière d’un printemps d’avant, et au sud de Manhattan, sur l’image qu’elle avait elle-même raccordée des mois plus tôt, les deux tours se dressaient, intactes, projetant sur le quartier leurs deux longues ombres parallèles.",
     "mentions": []
    },
    {
     "id": "c5-b13",
     "text": "Elle ferma la fenêtre. Elle ne la rouvrit pas de la journée.",
     "mentions": []
    },
    {
     "id": "c5-b14",
     "text": "On lui demanderait, les semaines suivantes, s’il fallait mettre à jour l’image. Des clients écrivaient ; certains voulaient voir, d’autres suppliaient qu’on ne montre rien. Hanke réunit l’équipe et dit, avec une gravité qu’on ne lui connaissait pas, qu’il n’y avait pas de réponse simple, qu’une carte disait ce qui était et qu’une photographie disait ce qui avait été, et qu’il faudrait apprendre à tenir ces deux choses ensemble. Il ne prit pas de décision ce jour-là. Léna comprit plus tard que c’était une décision.",
     "mentions": []
    },
    {
     "id": "c5-b15",
     "text": "Le soir, elle appela Dan. Tous les avions du pays étaient cloués au sol ; le ciel américain était vide pour la première fois depuis que les frères Wright l’avaient ouvert. Il était à Baton Rouge, dans un motel près de l’aérodrome, et il avait passé la journée à regarder le ciel désert par la fenêtre.",
     "mentions": []
    },
    {
     "id": "c5-b16",
     "text": "— C’est bizarre, dit-il. Pas un avion. Pas une trace. Il fait un temps parfait pour voler. Je n’ai jamais vu un temps pareil.",
     "mentions": []
    },
    {
     "id": "c5-b17",
     "text": "— Tu voudrais être là-haut.",
     "mentions": []
    },
    {
     "id": "c5-b18",
     "text": "— Je voudrais être à Mountain View.",
     "mentions": []
    },
    {
     "id": "c5-b19",
     "text": "Elle ne répondit rien. Elle écouta sa respiration à trois mille kilomètres, et pour la première fois depuis cinq ans elle trouva que c’était trop loin.",
     "mentions": []
    },
    {
     "id": "c5-b20",
     "text": "L’hiver qui suivit fut long. Les clients professionnels, déjà rares, rognaient leurs budgets. Les investisseurs ne répondaient plus au téléphone, ou répondaient pour dire non avec une courtoisie de croque-mort. Les salaires se mirent à arriver en retard : d’abord de quelques jours, puis d’une semaine, puis un mois où Hanke réunit tout le monde pour annoncer, sans détour, qu’il y aurait un demi-salaire et qu’il comprendrait que certains s’en aillent. Certains s’en allèrent. Les bureaux se vidaient poste après poste ; on récupérait les écrans des partants pour doubler ceux des restants. Léna hérita d’un deuxième moniteur, d’une plante verte et d’un fauteuil ergonomique qui avait appartenu à un développeur parti chez un fabricant de puces.",
     "mentions": []
    },
    {
     "id": "c5-b21",
     "text": "Hanke, lui, ne changeait pas. C’était ce qui frappait le plus. Il arrivait le matin à la même heure, relisait les trois mots du tableau blanc, faisait le tour des bureaux en demandant à chacun sur quoi il travaillait, et il écoutait la réponse jusqu’au bout. Il passait des heures au téléphone avec des gens qui ne voulaient pas de lui. Il revenait de rendez-vous ratés avec le même air concentré, comme un joueur d’échecs qui vient de perdre une pièce et recalcule. Un jour, Léna le vit s’arrêter devant une vieille carte murale de la baie de San Francisco que quelqu’un avait accrochée dans le couloir, et rester là plusieurs minutes, les mains dans les poches. Elle lui demanda ce qu’il regardait.",
     "mentions": []
    },
    {
     "id": "c5-b22",
     "text": "— On a construit toutes ces villes sur de l’eau, dit-il. Sur des marécages, des remblais, des bateaux coulés. Et elles tiennent.",
     "mentions": []
    },
    {
     "id": "c5-b23",
     "text": "Elle ne sut pas s’il parlait de la baie ou de Keyhole.",
     "mentions": []
    },
    {
     "id": "c5-b24",
     "text": "Au printemps 2002, il y eut une éclaircie. Nvidia, le fabricant de cartes graphiques dont les puces faisaient tourner les jeux vidéo de toute une génération, signa un accord avec Keyhole et s’engagea à investir. Une version grand public du logiciel, EarthViewer 3D, serait vendue par Nvidia à tous ceux qui possédaient une carte assez puissante. Pour la première fois, des gens ordinaires, des adolescents, des retraités, des pères de famille curieux, allaient pouvoir voler au-dessus de leur propre maison. On déboucha du mousseux. On fit une photo d’équipe devant le tableau blanc. Il manquait, sur la photo, la moitié de ceux qui avaient été là un an plus tôt.",
     "mentions": []
    },
    {
     "id": "c5-b25",
     "text": "La version grand public se vendit, un peu. Les forums s’enthousiasmèrent. Des gens écrivaient pour raconter qu’ils avaient retrouvé la maison de leur enfance, la ferme de leur grand-père dans le Nebraska, le lac où ils avaient appris à nager. Léna lisait ces messages le soir, à son bureau, et elle y retrouvait quelque chose des guildes de Meridian : des inconnus qui se racontaient leur vie à partir d’un endroit. Mais l’argent ne suivait pas. La Terre coûtait trop cher. Chaque ville ajoutée coûtait des images, des serveurs, des nuits.",
     "mentions": []
    },
    {
     "id": "c5-b26",
     "text": "Dan vint la voir pour Noël. Il resta dix jours dans son petit appartement de Mountain View, qu’il trouva trop propre, et ils marchèrent beaucoup, sur les crêtes au-dessus de la vallée, dans les collines de Los Altos où les chênes tordus rappelaient le Texas. Un soir, assis sur un banc face à la baie, il lui proposa de venir s’installer en Louisiane. Il y avait du travail là-bas pour une ingénieure de l’image, disait-il ; il y avait sa mère, qui voulait la rencontrer depuis six ans ; il y avait la ville, sa ville, qu’il voulait lui montrer autrement qu’en photos verticales.",
     "mentions": []
    },
    {
     "id": "c5-b27",
     "text": "— Et Keyhole ?",
     "mentions": []
    },
    {
     "id": "c5-b28",
     "text": "— Keyhole va couler, Léna. Tout le monde le sait.",
     "mentions": []
    },
    {
     "id": "c5-b29",
     "text": "— Pas lui.",
     "mentions": []
    },
    {
     "id": "c5-b30",
     "text": "— Lui, il ne compte pas. C’est le capitaine. Les capitaines, c’est fait pour couler avec.",
     "mentions": []
    },
    {
     "id": "c5-b31",
     "text": "Elle ne répondit pas. Elle regardait les lumières de la baie, où les avions descendaient vers San Francisco en une longue file patiente, et elle pensait à la petite croix sombre dans les champs de canne à sucre.",
     "mentions": []
    },
    {
     "id": "c5-b32",
     "text": "En janvier 2003, le conseil d’administration se réunit dans la salle au bout du couloir. Tout le monde savait de quoi il s’agissait, même si personne ne le disait : on parlait de licenciements massifs, d’une vente à la découpe, peut-être de fermer. La porte resta close quatre heures. Dans l’open space, on faisait semblant de travailler. Léna corrigeait la même dalle de Sacramento depuis le début de l’après-midi sans rien y changer.",
     "mentions": []
    },
    {
     "id": "c5-b33",
     "text": "Quand la porte s’ouvrit, Hanke sortit le premier. Il avait le visage de quelqu’un qui n’a pas dormi, mais il marchait du même pas. Il ne fit pas de discours. Il passa devant les postes, s’arrêta devant quelques-uns, dit quelques mots à voix basse. Devant celui de Léna, il regarda l’écran, la dalle de Sacramento immobile.",
     "mentions": []
    },
    {
     "id": "c5-b34",
     "text": "— On a encore quelques semaines, dit-il. Je vais trouver.",
     "mentions": []
    },
    {
     "id": "c5-b35",
     "text": "— Trouver quoi ?",
     "mentions": []
    },
    {
     "id": "c5-b36",
     "text": "— Quelqu’un qui a besoin de voir la Terre entière. Il y en a forcément un.",
     "mentions": []
    },
    {
     "id": "c5-b37",
     "text": "Il repartit vers son bureau. Léna le suivit des yeux. Elle pensa à Dan sur le banc, à la Louisiane, à la maison de Gentilly et à la mère qui voulait la connaître. Elle pensa qu’il avait sans doute raison, que Keyhole allait couler, que tout le monde le savait.",
     "mentions": []
    },
    {
     "id": "c5-b38",
     "text": "Elle rouvrit la dalle de Sacramento. Elle la corrigea pour de bon, cette fois, en entier, jusqu’à ce que les couleurs se raccordent. Puis elle en ouvrit une autre.",
     "mentions": []
    }
   ]
  },
  {
   "id": "chapitre-6",
   "number": 6,
   "title": "Map Viewer",
   "blocks": [
    {
     "id": "c6-b01",
     "text": "Celui qui avait besoin de voir la Terre entière s’appelait In-Q-Tel, et il avait une adresse en Virginie.",
     "mentions": []
    },
    {
     "id": "c6-b02",
     "text": "C’était un fonds d’investissement, mais pas tout à fait comme les autres : la CIA l’avait créé quelques années plus tôt pour repérer dans la Silicon Valley les technologies dont le renseignement américain pourrait avoir besoin, et y placer de l’argent avant les autres. On y croisait des anciens de l’Agence en polo, qui parlaient la langue des start-up avec un léger accent, et des ingénieurs qui savaient exactement ce qu’on pouvait faire d’une photographie aérienne à trente centimètres de résolution. Ils avaient vu EarthViewer. Ils l’avaient trouvé très intéressant. Ils l’avaient surtout trouvé rapide : leurs propres systèmes, lourds, coûteux, conçus pour des spécialistes, mettaient des minutes à afficher ce que Keyhole montrait en quelques secondes sur un ordinateur de bureau.",
     "mentions": []
    },
    {
     "id": "c6-b03",
     "text": "La négociation dura quelques semaines de février 2003. John la mena lui-même, avec son équipe réduite et une conscience aiguë de l’horloge : il restait à Keyhole de quoi payer les salaires jusqu’au printemps, pas au-delà. Les gens d’In-Q-Tel posaient des questions précises sur les volumes de données, les serveurs, la sécurité. Ils agissaient pour le compte de l’agence nationale d’imagerie et de cartographie, la NIMA, qui voulait équiper ses analystes. On parla d’environ deux millions de dollars. C’était peu à l’échelle de l’État fédéral. C’était, pour Keyhole, la différence entre la vie et la mort.",
     "mentions": []
    },
    {
     "id": "c6-b04",
     "text": "La veille de la signature, John resta tard au bureau. Il n’avait pas d’hésitation sur le fond : il avait vu à Rangoun ce que coûte l’ignorance, et il savait que ceux qui prennent les décisions les plus graves les prennent souvent avec des cartes fausses. Mais il y avait quelque chose d’étrange à boucler la boucle de cette manière. Le nom de la société faisait un clin d’œil aux satellites espions ; il avait voulu prendre le regard des espions pour le donner à tout le monde ; et c’étaient les espions qui venaient le sauver. Il écrivit sur un Post-it, qu’il colla sur son écran : « Pour tout le monde. Y compris eux. » Il le relut, trouva la formule prétentieuse, le froissa, puis le défroissa et le recolla. Il le garda des années.",
     "mentions": []
    },
    {
     "id": "c6-b05",
     "text": "Le communiqué fut rédigé dans la langue des communiqués. On y lisait que la communauté du renseignement pourrait désormais bénéficier de la formidable capacité de montée en charge de la solution Keyhole. John relut la phrase qu’on lui attribuait et pensa qu’il n’avait jamais parlé comme ça de sa vie, et qu’il aurait sans doute à le faire souvent.",
     "mentions": []
    },
    {
     "id": "c6-b06",
     "text": "Un mois plus tard, le 20 mars, les États-Unis envahirent l’Irak.",
     "mentions": []
    },
    {
     "id": "c6-b07",
     "text": "La guerre entra dans les bureaux de Keyhole par la télévision de la salle de réunion, la même qui, dix-huit mois plus tôt, avait montré les tours. On la laissait allumée en sourdine. Des envoyés spéciaux en gilet pare-balles, sur des toits de Bagdad, décrivaient au téléphone satellite des explosions qu’on voyait mal ; des généraux en retraite montraient sur des cartes plastifiées des flèches qui avançaient ; tout le monde parlait de lieux dont personne ne savait où ils étaient. Il y avait un vertige dans cette abondance de mots et cette pauvreté d’images. John regardait les cartes plastifiées et pensait à ce qu’il avait sur ses serveurs.",
     "mentions": []
    },
    {
     "id": "c6-b08",
     "text": "L’idée vint de Dave Lorenzini, l’un des directeurs de Keyhole, qui avait le talent rare de faire des coups de téléphone que les autres jugeaient impossibles. Il appela CNN. Il leur proposa de se servir de Keyhole en direct, à l’antenne, pour montrer aux téléspectateurs où se trouvaient les lieux dont on parlait. Pas de facture : on demandait seulement que le nom de Keyhole soit cité. Au bout d’une semaine de guerre, l’accord était fait. La chaîne rebaptisa l’outil pour l’occasion, avec cette sobriété des rédactions qui n’ont pas le temps : Map Viewer.",
     "mentions": []
    },
    {
     "id": "c6-b09",
     "text": "John vit la première utilisation en direct debout dans la salle de réunion, entouré de la moitié de l’équipe. Sur l’écran de CNN, la Terre apparut, familière, leur Terre, avec ses nuages et ses océans, sous le logo de la chaîne. Elle tourna, s’arrêta, plongea. Le Moyen-Orient, l’Irak, le Tigre ; Bagdad qui grandissait ; les palais le long du fleuve, les ponts, les avenues. Le présentateur commentait en suivant la descente, un peu en retard sur elle, comme quelqu’un qui découvre un pays en même temps que ses téléspectateurs. Puis la caméra repassa sur un reporter, et la voix dit, à la fin d’une phrase, presque en passant : « images Keyhole ».",
     "mentions": []
    },
    {
     "id": "c6-b10",
     "text": "Il y eut dans la salle un silence stupéfait, puis un cri, puis des applaudissements, puis un malaise, tout cela en moins de dix secondes. John n’applaudit pas. Il regardait l’écran où la guerre avait repris son cours ordinaire de fumée et de poussière. Il sentait monter en lui deux choses contraires : une joie immense, physique, de voir leur Terre, cette Terre qu’on leur disait inutile depuis deux ans, montrée à des dizaines de millions de gens ; et une gêne qu’il ne parvenait pas à nommer, qui ressemblait à celle qu’il avait éprouvée dans les rues de Rangoun en voyant les passants regarder droit devant eux.",
     "mentions": []
    },
    {
     "id": "c6-b11",
