     "text": "Les serveurs tombèrent dans l’heure. Le site de Keyhole, habitué à un filet de visiteurs, reçut soudain un fleuve ; les gens voulaient voir par eux-mêmes, télécharger le logiciel, plonger sur Bagdad, sur Bassora, sur leur propre maison. Les ingénieurs passèrent la nuit à ajouter des machines, à rediriger le trafic, à écrire des pages d’excuses. ABC et CBS appelèrent le lendemain. Les journaux suivirent. Le téléphone de John, qui ne sonnait plus depuis des mois, ne s’arrêta plus. Des investisseurs qui l’avaient éconduit à l’automne demandaient maintenant, d’une voix pleine de chaleur, s’il avait un moment pour un café.",
     "mentions": []
    },
    {
     "id": "c6-b12",
     "text": "Léna vint le voir le troisième soir. Elle frappa à la porte ouverte de son bureau, attendit qu’il lève les yeux, et resta sur le seuil.",
     "mentions": []
    },
    {
     "id": "c6-b13",
     "text": "— Je peux te dire quelque chose qui ne va pas te plaire ?",
     "mentions": []
    },
    {
     "id": "c6-b14",
     "text": "— C’est souvent ce qu’il y a de plus utile.",
     "mentions": []
    },
    {
     "id": "c6-b15",
     "text": "Elle entra. Elle avait les yeux rouges de quelqu’un qui passe ses journées devant des écrans et ses nuits à mal dormir.",
     "mentions": []
    },
    {
     "id": "c6-b16",
     "text": "— Cet après-midi, dit-elle, j’ai regardé CNN. Ils ont zoomé sur un quartier de Bagdad, juste avant de montrer des images de bombardement. Notre image. Ma dalle. Je l’ai raccordée moi-même, l’an dernier ; j’avais corrigé un défaut de couleur au-dessus d’une école, je m’en souviens, le toit était trop jaune. Et ce soir, des millions de gens ont vu ce quartier comme on voit un plateau de jeu. Vu d’en haut. Sans personne dedans.",
     "mentions": []
    },
    {
     "id": "c6-b17",
     "text": "John ne répondit pas tout de suite. Il savait qu’elle avait raison. Il savait aussi autre chose.",
     "mentions": []
    },
    {
     "id": "c6-b18",
     "text": "— Qu’est-ce que tu voudrais qu’on fasse ? demanda-t-il. Qu’on retire les images ?",
     "mentions": []
    },
    {
     "id": "c6-b19",
     "text": "— Je ne sais pas. Je voudrais que ce soit moins beau.",
     "mentions": []
    },
    {
     "id": "c6-b20",
     "text": "Il se leva, alla jusqu’à la fenêtre. Dehors, le parking de Mountain View était presque vide, éclairé par des lampadaires orange qui lui rappelèrent, absurdement, le feu clignotant de Cross Plains.",
     "mentions": []
    },
    {
     "id": "c6-b21",
     "text": "— Quand j’étais en Birmanie, dit-il, il y avait des cartes que personne n’avait le droit de voir. L’armée les gardait pour elle. Les gens ne savaient pas où étaient les camps, les routes, les villages qu’on déplaçait. Ce n’est pas qu’on leur montrait mal le monde : on ne le leur montrait pas du tout. C’est pire, Léna. Je te jure que c’est pire.",
     "mentions": []
    },
    {
     "id": "c6-b22",
     "text": "— Je sais.",
     "mentions": []
    },
    {
     "id": "c6-b23",
     "text": "— Ce soir, il y a des Irakiens à Detroit, à Londres, à Paris, qui ont regardé leur quartier à la télévision et qui ont vu que leur rue était encore là. Il y a des mères de soldats qui ont regardé où était leur fils. Il y a des gens qui ont compris, pour la première fois, que Bagdad était une ville, avec des ponts et des écoles, et pas un mot dans un journal.",
     "mentions": []
    },
    {
     "id": "c6-b24",
     "text": "— Et il y a les autres.",
     "mentions": []
    },
    {
     "id": "c6-b25",
     "text": "— Et il y a les autres.",
     "mentions": []
    },
    {
     "id": "c6-b26",
     "text": "Ils restèrent silencieux. John se retourna vers elle.",
     "mentions": []
    },
    {
     "id": "c6-b27",
     "text": "— Ce qu’on montre ne nous appartient plus, dit-il. Je crois que c’est ça que j’apprends cette semaine. On fabrique un regard, et après, chacun en fait ce qu’il veut. On ne peut pas choisir qui regarde. On peut seulement choisir de faire le regard le plus honnête possible. Montrer ce qui est. Dire de quand date l’image. Ne pas mentir sur l’échelle.",
     "mentions": []
    },
    {
     "id": "c6-b28",
     "text": "— Et mettre des gens dedans, dit Léna.",
     "mentions": []
    },
    {
     "id": "c6-b29",
     "text": "— Comment ça ?",
     "mentions": []
    },
    {
     "id": "c6-b30",
     "text": "— Tu as dit un jour, à Berkeley, qu’il faudrait que ça marche dans l’autre sens. Je ne sais toujours pas ce que tu voulais dire. Mais ce que je sais, c’est que la Terre qu’on fabrique est vide. Des toits, des routes, des arbres. Pas une personne. Même Meridian, avec ses torches de fête foraine, avait des gens dedans.",
     "mentions": []
    },
    {
     "id": "c6-b31",
     "text": "John la regarda longtemps. Elle soutint son regard. Il pensa aux cinq sacs de National Geographic, aux photos de pêcheurs de perles et d’hommes en parka qui accompagnaient les cartes, et à sa sœur qui disait : c’est toujours moi toute seule dedans.",
     "mentions": []
    },
    {
     "id": "c6-b32",
     "text": "— Je ne sais pas encore comment, dit-il enfin. Mais tu as raison. Écris-le. Mets-le au tableau.",
     "mentions": []
    },
    {
     "id": "c6-b33",
     "text": "Elle sortit sans répondre. Le lendemain matin, sous les trois mots écrits en haut à gauche du tableau blanc, il y en avait trois autres, d’une écriture penchée qu’il reconnut : « Avec les gens. » Personne ne sut expliquer d’où ils venaient, et personne ne les effaça.",
     "mentions": []
    },
    {
     "id": "c6-b34",
     "text": "Ce soir-là, Léna appela Dan. John ne l’apprit que bien plus tard, et par morceaux. Dan était à Lafayette, entre deux vols ; il avait vu CNN lui aussi, et il avait reconnu, dans une séquence sur le Koweït, des images aériennes vendues par une société concurrente de la sienne. Il avait dit à Léna qu’il comprenait son malaise et qu’il ne le partageait pas tout à fait. Lui photographiait la Terre tous les jours depuis le ciel ; il savait que la hauteur ne rendait pas indifférent, qu’elle obligeait seulement à imaginer ce qu’on ne voyait pas. Tous les pilotes le savent, avait-il dit : de là-haut, on ne voit pas les gens, alors on pense à eux tout le temps. C’était peut-être la phrase la plus sage qu’on prononça sur Keyhole cette année-là, et elle ne fut entendue que par une seule personne, dans un petit appartement de Mountain View, à onze heures du soir.",
     "mentions": []
    },
    {
     "id": "c6-b35",
     "text": "En avril, la guerre sembla finie, puis ne le fut pas. On annonça officiellement l’investissement d’In-Q-Tel. Les demandes d’abonnement affluèrent, des professionnels comme des curieux. Les candidats se pressaient pour des postes qu’on n’avait plus les moyens d’offrir un an plus tôt. Keyhole était vivante. Keyhole était visible. On la citait dans les journaux, on l’invitait dans les conférences, on écrivait son nom sans faute.",
     "mentions": []
    },
    {
     "id": "c6-b36",
     "text": "Un matin de ce printemps-là, John arriva le premier et resta un moment devant le tableau blanc, dans le bureau encore vide. « Toute la Terre. » « Avec les gens. » Il pensa qu’ils n’avaient fait, jusqu’ici, que la moitié de la première phrase et rien de la seconde. Il pensa aussi qu’une entreprise ne choisit pas toujours la porte par laquelle elle entre dans le monde, et que celle-ci était entrée par une guerre, ce qu’aucun d’eux n’oublierait.",
     "mentions": []
    },
    {
     "id": "c6-b37",
     "text": "Puis il alla se faire un café, alluma son ordinateur, et se remit au travail. Il y avait encore beaucoup de planète.",

    }

  {
   "id": "chapitre-7",
   "number": 7,
   "title": "Toute la Terre",
   "blocks": [
    {
     "id": "c7-b01",
     "text": "John Hanke raconta l’histoire à toute l’équipe un vendredi d’octobre 2004, dans la salle de réunion où l’on avait éteint la télévision pour l’occasion. Il la raconta en précisant d’emblée qu’il n’y était pas, ce qui la rendait meilleure.",
     "mentions": []
    },
    {
     "id": "c7-b02",
     "text": "— Ça se passe chez Google, dit-il. Il y a une réunion importante, avec les fondateurs, sur le rachat d’une autre société. Rien à voir avec nous. Et à un moment, apparemment, Sergey Brin s’ennuie. Il sort Keyhole. Il le branche sur le grand écran. Et il commence à faire le tour de la table : il demande à chacun son adresse, et il plonge sur sa maison. Une maison, puis une autre, puis les bureaux de Google, puis la maison suivante. La réunion est complètement partie en vrille. Plus personne ne parlait de l’autre société.",
     "mentions": []
    },
    {
     "id": "c7-b03",
     "text": "Il y eut des rires. Léna rit aussi, en imaginant la scène : ces gens très sérieux, penchés comme Kilday l’avait été, le nez sur l’écran, cherchant leur toit.",
     "mentions": []
    },
    {
     "id": "c7-b04",
     "text": "— Après ça, reprit Hanke, quelqu’un nous a appelés pour nous dire : on veut vous racheter.",
     "mentions": []
    },
    {
     "id": "c7-b05",
     "text": "Ce quelqu’un s’appelait Megan Smith. Elle dirigeait le développement des affaires chez Google et elle avait vu Keyhole à la télévision pendant la guerre, comme les fondateurs. Chez Google, on avait fait une découverte qui éclairait tout : une part considérable des recherches tapées chaque jour dans le petit rectangle blanc concernait des lieux. Des adresses, des villes, des restaurants, des itinéraires. Les gens ne cherchaient pas seulement des choses ; ils cherchaient où étaient les choses. Et Google n’avait rien à leur montrer.",
     "mentions": []
    },
    {
     "id": "c7-b06",
     "text": "Les négociations durèrent tout l’automne. Il en circula, dans les couloirs de Keyhole, des récits de plus en plus beaux à mesure qu’ils voyageaient. On racontait qu’un des gars de Keyhole avait demandé aux fondateurs de Google ce qu’ils voulaient, au juste : dix millions de dollars de revenus, ou dix millions d’utilisateurs ? Et que la réponse avait été : pensez plus grand. On racontait qu’après un calcul griffonné au dos d’une enveloppe, Larry Page avait conclu : faisons simplement le monde entier. Personne ne savait si c’était vrai. Tout le monde voulait que ce le soit. Léna remarqua que Hanke, quand on lui rapportait ces histoires, souriait sans jamais les corriger ni les confirmer, exactement comme à la fête de Berkeley huit ans plus tôt.",
     "mentions": []
    },
    {
     "id": "c7-b07",
     "text": "Le rachat fut annoncé le 27 octobre 2004. Le montant resta secret. Le communiqué de Google disait qu’avec Keyhole on pouvait voler au-dessus de la Terre comme un super-héros depuis son ordinateur, et l’équipe, qui avait passé trois ans à essayer de faire comprendre ce qu’elle fabriquait, trouva la formule à la fois ridicule et parfaite. Le prix de l’abonnement grand public fut divisé par plus de deux dans la semaine. Ce n’était qu’un début.",
     "mentions": []
    },
    {
     "id": "c7-b08",
     "text": "Ils déménagèrent sur le campus de Google au début de l’hiver. Léna eut l’impression de passer d’une cabane de trappeur à un paquebot de croisière. Il y avait des cafétérias gratuites où l’on servait des sushis à midi et des gaufres à quatre heures, des ballons de gymnastique au lieu de chaises, des lampes à lave, des vélos multicolores pour aller d’un bâtiment à l’autre, et surtout des ingénieurs, des centaines, des milliers, qui marchaient vite en parlant de choses qu’elle ne comprenait qu’à moitié. Les gens de Keyhole, une poignée perdue dans ce palais, se serrèrent les uns contre les autres pendant quelques semaines comme les survivants d’un naufrage invités à bord d’un yacht.",
     "mentions": []
    },
    {
     "id": "c7-b09",
     "text": "Hanke, lui, s’adapta en quelques jours. On lui confia la responsabilité de tout ce que Google faisait autour des cartes, une division qu’on baptisa Geo, et qui allait grandir plus vite que personne ne l’avait imaginé. Brian McClendon dirigeait les ingénieurs ; Bill Kilday, qui avait tenu parole et était « dedans » depuis le soir du Dell, s’occupait de faire savoir au monde ce qu’ils faisaient. En février 2005, une autre équipe, venue d’une petite société de Sydney fondée par deux frères danois, lança Google Maps : des cartes dans le navigateur, qu’on pouvait faire glisser à la souris, sans recharger la page. Léna passa une soirée entière à faire glisser la carte de Brest, d’un bout à l’autre de la rade, pour le seul plaisir du geste.",
     "mentions": []
    },
    {
     "id": "c7-b10",
     "text": "Le vrai lancement eut lieu le 28 juin 2005. Le logiciel ne s’appelait plus EarthViewer ; il s’appelait Google Earth. Il était gratuit. N’importe qui, n’importe où, pouvait le télécharger.",
     "mentions": []
    },
    {
     "id": "c7-b11",
     "text": "Ce qui se passa ensuite, Léna ne l’avait jamais vu et ne le revit jamais tout à fait. En quelques heures, les compteurs s’affolèrent. En quelques jours, ils cessèrent d’avoir un sens. Des millions de gens, puis des dizaines de millions, installèrent la Terre sur leur ordinateur, et presque tous firent la même chose en premier : ils tapèrent leur adresse et plongèrent sur leur toit. Ils le faisaient seuls, puis ils appelaient leurs enfants, leurs parents, leurs voisins, pour qu’ils viennent voir. On recevait des milliers de messages. Un homme de Manchester avait retrouvé la tache blanche de la voiture qu’on lui avait volée, garée dans une rue voisine. Une femme de l’Ohio avait vu pour la première fois le village de Sicile d’où venait sa grand-mère. Un écolier de Nairobi avait mesuré, avec l’outil de règle, la distance exacte entre sa maison et l’école, et écrivait pour se plaindre qu’elle était plus longue qu’on ne le lui avait dit.",
     "mentions": []
    },
    {
     "id": "c7-b12",
     "text": "La mère de Léna l’appela de Brest un dimanche matin. Elle n’avait jamais rien compris au métier de sa fille ; elle avait passé la nuit dessus.",
     "mentions": []
    },
    {
     "id": "c7-b13",
     "text": "— J’ai vu la maison, dit-elle. Le jardin. Le figuier. Ton père est allé chercher ses lunettes. Il a regardé la rade pendant une heure sans rien dire. Puis il a dit que les fonds étaient mal représentés.",
     "mentions": []
    },
    {
     "id": "c7-b14",
     "text": "Léna rit tellement qu’elle dut s’asseoir.",
     "mentions": []
    },
    {
     "id": "c7-b15",
     "text": "Les semaines suivantes, elle travailla plus que jamais. Chaque jour arrivaient de nouvelles images à intégrer, de nouvelles villes, de nouveaux pays ; chaque nuit, les serveurs de Google distribuaient la Terre à un monde qui semblait ne pas pouvoir s’en rassasier. Dan l’appelait le soir, depuis Lafayette ou Baton Rouge, pour lui raconter que les gens, à l’aérodrome, avaient découvert qu’ils pouvaient voir d’en haut les parcelles que lui photographiait depuis des années, et qu’ils le regardaient maintenant avec un respect nouveau, comme un homme qui aurait été dans le secret.",
     "mentions": []
    },
    {
     "id": "c7-b16",
     "text": "Puis, à la fin du mois d’août, un ouragan se forma au-dessus des Bahamas, traversa la Floride, et entra dans le golfe du Mexique où les eaux chaudes le nourrirent jusqu’à en faire un monstre. On lui avait donné un nom de femme, comme à tous les ouragans : Katrina.",
     "mentions": []
    },
    {
     "id": "c7-b17",
     "text": "Dan appela le samedi soir. Sa mère refusait de quitter Gentilly. Elle avait vu passer d’autres ouragans ; elle avait sa maison, ses voisines, son église, et une conviction de fer que les digues tiendraient parce qu’elles avaient toujours tenu. Dan était parti la chercher en voiture ; il la ramena à Baton Rouge le dimanche, dans des bouchons de dix heures, sous un ciel de plomb. Le lundi 29 août, l’ouragan toucha terre, et dans la journée les digues de La Nouvelle-Orléans cédèrent.",
     "mentions": []
    },
    {
     "id": "c7-b18",
     "text": "Léna vit les images à la télévision de la cafétéria, entre deux plateaux de salade. L’eau dans les rues. Les toits où des gens agitaient des draps. Les hélicoptères. Elle essaya d’appeler Dan ; les réseaux de la région étaient saturés ou coupés. Elle réessaya toute la journée. Le soir, elle reçut un message de trois lignes : ils allaient bien, ils étaient à Baton Rouge, il était à l’aérodrome.",
     "mentions": []
    },
    {
     "id": "c7-b19",
     "text": "Chez Google, Hanke réunit dans l’urgence une poignée de gens dans une salle trop petite. Il n’y eut pas de diapositives. Il dit simplement que des millions de personnes avaient désormais Google Earth sur leur ordinateur, que l’image de La Nouvelle-Orléans qu’ils y voyaient datait d’avant, et qu’elle était donc fausse, et que cette fausseté pouvait tuer : les sauveteurs, les familles, les services de secours avaient besoin de savoir où était l’eau maintenant. Il fallait des images fraîches. Il fallait les obtenir, les traiter et les mettre en ligne en quelques heures au lieu de quelques mois. On travaillait déjà avec l’agence fédérale des océans et de l’atmosphère, la NOAA, qui faisait voler ses propres appareils ; il fallait aussi trouver des pilotes, des avions, des caméras, partout où il y en avait.",
     "mentions": []
    },
    {
     "id": "c7-b20",

     "mentions": []

    {
     "id": "c7-b22",
     "text": "— Il est à Baton Rouge. Il a un avion équipé pour la photo verticale. Il connaît la ville par cœur. Sa mère habite Gentilly.",
     "mentions": []
    },
    {
     "id": "c7-b23",
     "text": "Hanke la regarda un instant, sans étonnement, comme si les pièces d’un vieux puzzle se mettaient enfin en place.",
     "mentions": []
    },
    {
     "id": "c7-b24",
     "text": "— Appelle-le.",
     "mentions": []
    },
    {
     "id": "c7-b25",
     "text": "Dan vola le lendemain, puis les jours suivants, à l’aube, dès que le ciel le permit, en suivant les couloirs que les autorités ouvraient aux avions civils. Il photographia sa ville bande après bande, d’est en ouest, avec la même application qu’il mettait depuis des années à photographier les champs de canne et les lotissements neufs. Il atterrissait, confiait les disques à un coursier ou les envoyait par des liaisons qui marchaient une fois sur deux, et redécollait. Les images arrivaient à Mountain View au milieu de la nuit. Léna les attendait.",
     "mentions": []
    },
    {
     "id": "c7-b26",
     "text": "Elle ne dormit presque pas pendant une semaine. Elle ne se souviendrait plus tard que de fragments : la lumière bleue de l’écran dans le bâtiment désert, les gobelets de café froid, les dalles qui s’affichaient une à une, comme des cartes qu’on retourne. L’eau, partout, brune et lisse, qui recouvrait les rues jusqu’aux gouttières. Les toits qui dépassaient comme des radeaux. Les voitures dont on ne voyait que la forme sous la surface. Le Superdome. Les autoroutes surélevées qui traversaient le lac que la ville était devenue. Elle raccordait, corrigeait les couleurs, ajustait les bords, et elle n’effaçait rien d’autre que ce qu’il fallait effacer.",
     "mentions": []
    },
    {
     "id": "c7-b27",
     "text": "La quatrième nuit, en assemblant une bande de Gentilly, elle reconnut une maison. Elle ne l’avait jamais vue d’en haut, mais Dan lui en avait montré cent photos : une petite maison de bois à un étage, avec une véranda et un grand magnolia devant. Le magnolia était là, sa couronne sombre posée sur l’eau comme un nénuphar géant. La maison n’avait plus que le toit. Et, au milieu du halo clair qui entourait le magnolia, il y avait une petite croix noire : l’ombre du Cessna, passé juste au-dessus, le soleil dans le dos.",
     "mentions": []
    },
    {
     "id": "c7-b28",
     "text": "Elle ne l’effaça pas tout de suite. Elle resta longtemps devant l’écran, la main sur la bouche. Puis elle l’effaça, parce que c’était son métier, et que des gens attendaient ces images pour savoir si leur rue était encore là.",
     "mentions": []
    },
    {
     "id": "c7-b29",
     "text": "Les images furent en ligne quelques heures plus tard. Des milliers de sinistrés, depuis les gymnases de Houston ou les chambres d’hôtel de Baton Rouge, plongèrent sur leur maison pour savoir si l’eau avait atteint le premier étage ou seulement la véranda. Des secouristes les utilisèrent pour préparer leurs sorties. Des familles dispersées s’envoyèrent les coordonnées d’un toit comme on s’envoie des nouvelles. Personne ne sut jamais combien de vies ces images avaient aidé à sauver ; les chiffres qui circulèrent plus tard ne furent jamais vérifiés. Mais ce mois-là, pour la première fois, Léna eut le sentiment que ce qu’ils fabriquaient n’était pas un jouet.",
     "mentions": []
    },
    {
     "id": "c7-b30",
     "text": "Dan l’appela à la fin de la deuxième semaine, un soir, depuis le parking de l’aérodrome. Il avait la voix de quelqu’un qui n’a pas dormi depuis dix jours et qui n’a plus la force d’avoir peur.",
     "mentions": []

    {
     "id": "c7-b31",

     "id": "c7-b35",
     "text": "Il y eut un silence, un de ces silences qu’elle connaissait depuis Meridian, où l’on devine quelqu’un qui relit une phrase avant de l’écrire.",

  {
   "id": "chapitre-8",
   "number": 8,
   "title": "La voiture de Larry",
   "blocks": [
    {
     "id": "c8-b01",
     "text": "L’idée avait commencé, comme beaucoup d’idées chez Google, par un fondateur qui s’amusait. Larry Page avait fixé une caméra vidéo sur sa voiture et roulé dans les rues de la péninsule en filmant les façades, puis il avait rapporté les cassettes au bureau en demandant si l’on pouvait faire quelque chose avec. À l’université Stanford, à quelques kilomètres, des chercheurs travaillaient depuis des années à reconstituer des rues entières à partir de photographies prises au ras du trottoir. Un ingénieur de Google, Luc Vincent, bricola un premier prototype de caméra à plusieurs objectifs. Puis on en fabriqua d’autres. Puis on les fixa sur des mâts, sur le toit de voitures, et on lâcha les voitures dans les villes.",
     "mentions": []
    },
    {
     "id": "c8-b02",
     "text": "John Hanke regarda la première carte de couverture avec l’émotion de quelqu’un qui revoit, en grand, un dessin d’enfant. Jusque-là, la Terre de Google était vue d’en haut, à la verticale, comme un oiseau ou comme un satellite ; on descendait sur les toits, et on s’arrêtait là. Avec les voitures, on pouvait continuer. On posait le petit bonhomme orange sur une rue, et l’on se retrouvait debout sur le trottoir, à hauteur d’yeux, face à une boulangerie, à un arrêt de bus, à la porte d’un immeuble, et l’on pouvait tourner la tête, avancer, prendre à droite au carrefour. Le monde d’en haut et le monde d’en bas, enfin raccordés. Il pensa à l’avion au-dessus du delta de l’Irrawaddy : d’en haut, le tout ; d’en bas, le nom des choses.",
     "mentions": []
    },
    {
     "id": "c8-b03",
     "text": "Street View ouvrit le 25 mai 2007, dans cinq villes américaines : San Francisco, Las Vegas, Denver, Miami, New York. Les premiers jours, ce fut un émerveillement. Les gens se promenaient dans des villes où ils n’étaient jamais allés, remontaient la rue de leur enfance, préparaient un rendez-vous en repérant la porte d’avance. Puis ils commencèrent à regarder de plus près, et ce qu’ils trouvèrent dans les images, c’était eux-mêmes.",
     "mentions": []
    },
    {
     "id": "c8-b04",
     "text": "Un homme qui sortait d’un établissement où il aurait préféré ne pas être vu. Une femme à sa fenêtre. Des enfants dans un jardin. Un chat, célèbre en une semaine, qui regardait l’objectif depuis un rebord. Des visages, partout, reconnaissables, saisis sans qu’on leur ait rien demandé. Les journaux s’en emparèrent ; des associations protestèrent ; des gens écrivirent, furieux, pour demander qu’on retire leur maison, leur voiture, leur existence. John lisait ces lettres le soir. Elles ne lui faisaient pas plaisir. Elles ne lui semblaient pas absurdes non plus.",
     "mentions": []
    },
    {
     "id": "c8-b05",
     "text": "Il y avait, dans cette colère, quelque chose qu’il reconnaissait. Il avait voulu donner le regard des espions à tout le monde ; tout le monde découvrait maintenant ce que c’était, d’être regardé. On mit en place des procédures de retrait, puis, en 2008, un système qui floutait automatiquement les visages et les plaques d’immatriculation. Dans les pays où les voitures arrivèrent ensuite, chacun eut ses exigences. En Allemagne, où la mémoire des polices politiques restait à vif, on obtint le droit de demander le floutage de sa maison entière, et des rues entières se couvrirent de façades troubles, comme des fantômes. Au Japon, on fit remarquer poliment que les caméras, perchées trop haut, voyaient par-dessus les murs des jardins, ce qui ne se faisait pas ; Google abaissa ses mâts. John approuva chaque ajustement. Il apprenait, lentement, une règle que personne ne lui avait enseignée : on ne pose pas une couche sur le monde sans que le monde réponde.",
     "mentions": []
    },
    {
     "id": "c8-b06",
     "text": "Ces années-là furent les plus grandes de sa vie professionnelle, et parmi les plus lourdes. La division Geo avait grandi jusqu’à devenir une petite ville à l’intérieur de Google. Google Earth, Google Maps, Street View, et d’autres encore, SketchUp pour modéliser les bâtiments en trois dimensions, Panoramio pour les photos de voyageurs : tout remontait jusqu’à lui. Il passait ses journées en réunions, ses soirées en arbitrages, ses week-ends en lecture de rapports. Il avait des milliers de personnes sous sa responsabilité et des centaines de millions d’utilisateurs, et il se surprenait parfois, au milieu d’une revue de produit, à penser au bureau de Keyhole, aux tables pliantes, au tableau blanc. Il n’était pas nostalgique. Il se demandait seulement s’il ne s’était pas éloigné du sol.",
     "mentions": []
    },
    {
     "id": "c8-b07",
     "text": "Léna travaillait toujours avec lui. Elle dirigeait maintenant une équipe qui s’occupait des images de Street View : les raccords, les couleurs, les expositions qui sautaient d’une photo à l’autre quand la voiture passait de l’ombre au soleil. Elle avait épousé Dan à l’automne 2006, sous le magnolia de Gentilly, dans le jardin d’une maison qu’on avait vidée, séchée, rebâtie planche par planche. John était venu. Il se souvenait d’une chaleur de four, d’un orchestre de cuivres qui jouait trop fort, de la mère de Dan qui l’avait pris par le bras pour lui dire que son ordinateur avait sauvé son magnolia, ce qui était faux et qu’il n’eut pas le cœur de corriger, et de Léna en robe blanche qui riait avec tout le visage.",
     "mentions": []
    },
    {
     "id": "c8-b08",
     "text": "Puis les deux mariés étaient repartis chacun de son côté de la carte. Dan ne voulait pas quitter La Nouvelle-Orléans, qui avait besoin de bras et de photographes ; Léna ne voulait pas quitter Google, qui avait besoin d’elle. On se disait qu’on trouverait. On ne trouva pas. John vit, sur trois ans, la lumière de Léna baisser, comme celle d’une ville qu’on regarde s’éloigner d’un avion. Elle travaillait de plus en plus tard. Elle prenait de moins en moins de vacances. Elle ne parlait plus de Gentilly.",
     "mentions": []
    },
    {
     "id": "c8-b09",
     "text": "Un soir de l’hiver 2009, elle vint dans son bureau et ferma la porte derrière elle, ce qu’elle ne faisait jamais.",
     "mentions": []
    },
    {
     "id": "c8-b10",
     "text": "— Dan est parti, dit-elle.",
     "mentions": []
    },
    {
     "id": "c8-b11",
     "text": "John ne dit rien. Il lui fit signe de s’asseoir. Elle resta debout.",
     "mentions": []
    },
    {
     "id": "c8-b12",
     "text": "— Il m’a dit une chose, hier soir, au téléphone. Il m’a dit : tu as photographié toutes les rues du monde, et tu ne sais plus où est la mienne. Il a raison. Je connais Gentilly par cœur, vue du trottoir. Je peux te dire la couleur de chaque porte. Je n’y ai pas mis les pieds depuis dix mois.",
     "mentions": []
    },
    {
     "id": "c8-b13",
     "text": "— Prends du temps, dit John. Pars. Autant que tu veux.",
     "mentions": []
    },
    {
     "id": "c8-b14",
     "text": "— Pour aller où ? Il ne veut pas que je vienne. Il veut que je sois là. Ce n’est pas pareil.",
     "mentions": []
    },
    {
     "id": "c8-b15",
     "text": "Elle repartit, et le lendemain elle était à son bureau à huit heures. John ne sut pas quoi faire, et il ne fit rien, ce qu’il se reprocherait plus tard. Mais la phrase de Dan lui resta, comme lui était restée, des années plus tôt, celle de sa sœur devant son château sur l’Atari. Toutes les rues du monde, et plus la sienne.",
     "mentions": []
    },
    {
     "id": "c8-b16",
     "text": "Au printemps 2010, il y eut l’affaire.",
     "mentions": []
    },
    {
     "id": "c8-b17",
     "text": "Elle commença par une question posée par les autorités allemandes de protection des données : que collectaient exactement les voitures de Street View quand elles passaient dans les rues ? On savait qu’elles repéraient les réseaux Wi-Fi, pour améliorer la localisation des téléphones ; c’était documenté, et banal. Mais en creusant, on découvrit autre chose. Pendant des années, un logiciel embarqué dans les voitures avait aussi enregistré des fragments de ce qui circulait sur les réseaux sans mot de passe : des morceaux de messages, d’adresses, de pages visitées. Personne ne semblait l’avoir voulu. Le code avait été écrit par un ingénieur pour un autre usage et s’était retrouvé là. C’était, dirait un des dirigeants de Google, un échec grave, et l’entreprise le reconnut publiquement. Les enquêtes se multiplièrent dans une douzaine de pays. La presse trouva un nom à l’affaire, un jeu de mots qui fit le tour du monde : Wi-Spy.",
     "mentions": []
    },
    {
     "id": "c8-b18",
     "text": "John l’apprit comme tout le monde, en même temps que tout le monde, et il en fut atterré. Les voitures dépendaient de sa division. Il avait passé des années à défendre l’idée que Street View regardait le monde sans l’espionner, que le floutage et les procédures de retrait prouvaient la bonne foi de l’entreprise, que tout cela était au service des gens. Et voilà que ses voitures, dans la rue, avaient écouté. Il n’avait rien su ; il le fit dire, et le dirait toujours. Mais il savait aussi que ne rien savoir n’excuse pas tout quand on dirige, et cette pensée-là ne le quitta pas de l’été.",
     "mentions": []
    },
    {
     "id": "c8-b19",
     "text": "Il se mit à marcher. Il n’avait jamais été un grand marcheur ; il le devint cet été-là, le soir, dans les rues de Mountain View puis de Palo Alto, sans but, son téléphone dans la poche. C’était un de ces nouveaux téléphones, sans clavier, avec un écran de verre et une puce GPS, sur lequel la carte de Google s’ouvrait en un geste et le suivait pas à pas, un petit point bleu qui avançait avec lui. Il le sortait parfois et regardait le point bleu. Il pensa que c’était la chose la plus importante qui soit arrivée aux cartes depuis leur invention : elles savaient désormais où l’on était. Elles pouvaient marcher avec vous.",
     "mentions": []
    },
    {
     "id": "c8-b20",
     "text": "Un soir, il s’arrêta sous un réverbère, le téléphone à la main, et une idée lui traversa l’esprit avec la netteté de celles qui arrivent tard parce qu’elles ont attendu longtemps. Depuis vingt ans, il faisait entrer le monde dans l’écran : les jeux, les tables de cartes, la Terre, les rues. Et si l’on faisait l’inverse ? Si l’écran servait à faire sortir les gens dans le monde ? Pas pour le regarder d’en haut, ni pour le photographier au passage, mais pour y aller, à pied, et y rencontrer d’autres gens. Il pensa à Léna, qui connaissait par cœur une rue où elle ne mettait plus les pieds. Il pensa au mot de Berkeley : il faudra que ça marche dans l’autre sens. Il l’avait dit sans savoir ce qu’il disait. Il savait maintenant.",
     "mentions": []
    },
    {
     "id": "c8-b21",
     "text": "À l’automne, il écrivit une lettre aux trois hommes qui dirigeaient Google : Eric Schmidt, Larry Page et Sergey Brin. Il y disait qu’il avait passé six belles années dans l’entreprise, qu’il en était fier, et qu’il avait envie de faire quelque chose de nouveau. C’était une lettre de démission, même si elle ne portait pas ce nom. Il l’envoya un soir et dormit mal.",
     "mentions": []
    },
    {
     "id": "c8-b22",
     "text": "Larry Page le fit venir quelques jours plus tard. Il ne lui parla pas de la lettre. Il lui parla de réalité augmentée : de téléphones, de lunettes peut-être un jour, qui poseraient sur le monde réel des couches d’information, des histoires, des jeux. Il lui demanda ce qu’il ferait, lui, s’il pouvait faire n’importe quoi dans ce domaine. John le lui dit. Page l’écouta, puis lui proposa de le faire sans partir : une petite équipe, dans Google mais à l’écart, avec la liberté d’une start-up et l’argent d’un géant. John demanda un jour de réflexion. Il n’en eut pas besoin.",
     "mentions": []
    },
    {
     "id": "c8-b23",
     "text": "Il fallait un nom. Il le trouva dans un vieux livre sur l’histoire de San Francisco, qu’il feuilletait depuis des mois sans savoir pourquoi. Il le garda pour lui quelques jours, comme on garde une pierre ramassée sur une plage, pour le plaisir de la sentir dans sa poche.",
     "mentions": []
    },
    {
     "id": "c8-b24",
     "text": "Avant de l’annoncer, il alla voir Léna. Elle était à son bureau, comme toujours, devant une rue de Lyon dont les couleurs sautaient au passage d’un tunnel.",
     "mentions": []
    },
    {
     "id": "c8-b25",
     "text": "— Je pars, dit-il. Enfin, je reste, mais je pars. On va faire une petite équipe. On va faire des choses pour que les gens sortent de chez eux.",
     "mentions": []
    },
    {
     "id": "c8-b26",
     "text": "— Quelles choses ?",
     "mentions": []
    },
    {
     "id": "c8-b27",
     "text": "— Je ne sais pas encore. Des jeux, peut-être. Des histoires posées sur les lieux. Des raisons de marcher.",
     "mentions": []
    },
    {
     "id": "c8-b28",
     "text": "Elle leva les yeux de sa rue de Lyon. Il y avait dans son regard une fatigue immense et, tout au fond, une petite lueur qu’il n’avait pas vue depuis longtemps.",
     "mentions": []
    },
    {
     "id": "c8-b29",
     "text": "— Tu me demandes de venir ?",
     "mentions": []
    },
    {
     "id": "c8-b30",
     "text": "— Je te demande de venir.",
     "mentions": []
    },
    {
     "id": "c8-b31",
     "text": "— Pourquoi moi ?",
     "mentions": []
    },
    {
     "id": "c8-b32",
     "text": "John réfléchit. Il pensa à un rapport sur les guildes, à une dalle de Bagdad, à trois mots au tableau blanc, à une petite croix noire sur un magnolia.",

     "mentions": []

    {
     "id": "c8-b34",
     "text": "Elle ferma la fenêtre de la rue de Lyon. Dehors, il faisait nuit. En octobre 2010, une petite équipe s’installa à part, dans un coin de Google, sous un nom que personne ne comprenait encore : Niantic Labs.",

  {
   "id": "chapitre-9",
   "number": 9,
   "title": "Le baleinier",
   "blocks": [
    {
     "id": "c9-b01",
     "text": "Pour expliquer le nom, John Hanke emmena toute l’équipe en promenade. Ils étaient onze, ce jour-là, un matin gris du début de 2011, et ils le suivirent à travers le quartier financier de San Francisco comme une classe suit un professeur un peu original, entre les tours de verre et les employés en costume qui marchaient vite, un gobelet de café à la main. Il s’arrêta au pied de la pyramide Transamerica, cette flèche blanche et pointue que Léna avait toujours trouvée vaguement comique, puis prit une petite rue sur le côté et s’arrêta encore, devant un immeuble quelconque.",
     "mentions": []
    },
    {
     "id": "c9-b02",
     "text": "— Ici, dit-il, il y a un bateau.",
     "mentions": []
    },
    {
     "id": "c9-b03",
     "text": "Ils regardèrent le trottoir. Il y avait du béton, une bouche d’égout, un pigeon.",
     "mentions": []
    },
    {
     "id": "c9-b04",
     "text": "— Sous nos pieds, dit Hanke. Un baleinier. Il s’appelait le Niantic.",
     "mentions": []
    },
    {
     "id": "c9-b05",
     "text": "Il raconta. En 1849, au plus fort de la ruée vers l’or, le Niantic était entré dans la baie avec des centaines de passagers pressés d’aller chercher fortune dans les collines. L’équipage avait déserté à peine l’ancre jetée, comme presque tous les équipages de ce temps-là : la baie était une forêt de mâts abandonnés. Alors on avait tiré le bateau sur la grève, à l’endroit où l’on se tenait maintenant, qui était alors le bord de l’eau, et on en avait fait un entrepôt, puis un hôtel. Un incendie l’avait rasé. La ville avait comblé la baie par-dessus, avec du sable, des gravats, et les carcasses d’autres navires, et elle avait avancé de plusieurs rues sur la mer. On avait retrouvé des morceaux du Niantic, plus tard, en creusant des fondations : du bois, des bouteilles, des objets du quotidien d’une époque disparue.",
     "mentions": []
    },
    {
     "id": "c9-b06",
     "text": "— Toute cette ville est construite sur des choses qu’on ne voit plus, dit-il. Il y a énormément de choses fascinantes sous la surface. On va faire des logiciels qui aident les gens à les trouver.",
     "mentions": []
    },
    {
     "id": "c9-b07",
     "text": "Quelqu’un demanda, un peu sceptique, si le nom n’était pas difficile à prononcer. Hanke sourit.",
     "mentions": []
    },
    {
     "id": "c9-b08",
     "text": "— Justement. Il faudra le chercher.",
     "mentions": []
    },
    {
     "id": "c9-b09",
     "text": "Léna resta un moment après les autres devant l’immeuble quelconque. Elle pensa à son père et à ses cartes de ce qu’on ne voit pas. Elle pensa qu’elle avait passé dix ans à fabriquer une surface parfaite du monde, sans raccord, sans défaut, sans ombre d’avion, et qu’on lui proposait maintenant de creuser dessous.",
     "mentions": []
    },
    {
     "id": "c9-b10",
     "text": "Les premiers mois de Niantic Labs ressemblèrent aux débuts de Keyhole, en plus confortable. Une petite équipe, des bureaux à part, un tableau blanc. Léna y écrivit elle-même, en haut à gauche, les trois mots qu’elle avait écrits huit ans plus tôt, et Hanke, en passant, ajouta au-dessus les trois siens. « Toute la Terre. » « Avec les gens. » On pouvait commencer.",
     "mentions": []
    },
    {
     "id": "c9-b11",
     "text": "Le premier produit s’appela Field Trip. C’était une application pour téléphone qui vous accompagnait en ville et vous signalait, quand vous passiez près d’un endroit qui en valait la peine, une petite fiche : l’histoire d’un bâtiment, un restaurant, une œuvre d’art cachée dans une cour, une anecdote sur la rue. Hanke l’avait imaginée pour des lunettes que Google préparait en secret, qui afficheraient ces fiches devant les yeux sans qu’on ait à sortir quoi que ce soit de sa poche ; les lunettes n’étaient pas prêtes, alors on commença par le téléphone. L’application sortit en septembre 2012. Léna passa des mois à constituer la base de lieux : des plaques historiques, des monuments, des fresques, des bâtiments remarquables, des milliers de points qu’il fallait vérifier, décrire, placer au mètre près. C’était un travail de fourmi. Elle y prit un plaisir inattendu. Pour la première fois depuis des années, elle regardait le monde à hauteur de plaque commémorative.",
     "mentions": []
    },
    {
     "id": "c9-b12",
     "text": "Un soir, en rentrant chez elle à pied, son téléphone vibra au coin d’une rue du quartier financier. La fiche disait : « Ici gît le Niantic ». Elle rit toute seule sur le trottoir, comme autrefois devant l’écran de Meridian.",
     "mentions": []
    },
    {
     "id": "c9-b13",
     "text": "Mais Field Trip n’était qu’un échauffement. Ce que Hanke voulait vraiment faire, il le disait à qui voulait l’entendre : un jeu. Un jeu qui se jouerait dehors, dans les vraies rues, avec de vrais gens, et qui ne serait possible qu’en marchant.",
     "mentions": []
    },
    {
     "id": "c9-b14",
     "text": "Ingress naquit à la fin de 2012. Il commença par un mystère : une campagne étrange, sur Internet, où il était question d’une énergie inconnue découverte par des scientifiques européens, d’une matière exotique qui suintait de certains lieux du monde, d’une influence qui modifiait peut-être la pensée humaine. On l’appela le Niantic Project. Des fragments de récit apparaissaient sur des sites obscurs, des vidéos cryptées circulaient, des internautes enquêtaient sans savoir que c’était un jeu. Puis, en novembre, on ouvrit une version d’essai sur invitation.",
     "mentions": []
    },
    {
     "id": "c9-b15",
     "text": "Le principe tenait en quelques lignes. Le joueur, qu’on appelait un agent, voyait sur son téléphone une carte du monde réel où apparaissaient des portails : des lieux publics, une statue, une fresque, une église, une plaque, un kiosque à musique. Ces portails étaient des sources de cette matière exotique qu’on appelait XM. Pour s’en emparer, il fallait s’y rendre physiquement, à pied, se tenir à quelques dizaines de mètres, et les pirater. Deux factions se disputaient le monde : les Enlightened, en vert, qui voyaient dans cette énergie une chance pour l’humanité de s’élever ; la Résistance, en bleu, qui voulait la protéger contre une influence qu’elle jugeait dangereuse. On reliait les portails entre eux par des liens, on dessinait des triangles sur les villes, et les triangles recouvraient les quartiers d’un champ de sa couleur. Pour relier deux portails éloignés, il fallait souvent s’organiser, se donner rendez-vous, partir à plusieurs à l’aube vers une colline ou une chapelle perdue.",
     "mentions": []
    },
    {
     "id": "c9-b16",
     "text": "Léna choisit les Enlightened, parce que Hanke les avait choisis et qu’elle trouvait la couleur plus jolie. Hanke, quand il l’apprit, lui dit gravement qu’elle était du bon côté de l’histoire.",
     "mentions": []
    },
    {
     "id": "c9-b17",
     "text": "Le jeu décolla lentement, puis vite. Les agents proposaient eux-mêmes de nouveaux portails, en envoyant la photo et la description d’un lieu qu’ils trouvaient digne d’intérêt, et Léna, dont l’équipe vérifiait les propositions, vit arriver par milliers des endroits qu’aucune carte n’avait jamais notés : une fresque d’écolier sur le mur d’un gymnase, un vieux lavoir, la tombe d’un chien célèbre dans un village, un banc dédié à une femme morte que tout le quartier aimait. Des gens, partout, se mettaient à regarder leur propre ville comme un territoire à découvrir. Ils sortaient le soir, en groupes, des gens qui ne se seraient jamais adressé la parole, un comptable et un étudiant, une grand-mère et un livreur, et ils marchaient ensemble pendant des heures, parlaient de tout, se retrouvaient au café à trois heures du matin après une opération réussie. Des guildes, pensa Léna. Les guildes de Meridian, mais dehors.",
     "mentions": []
    },
    {
     "id": "c9-b18",
     "text": "Un soir de l’automne 2013, alors qu’elle examinait sur la carte générale du jeu l’avancée des deux factions sur le sud des États-Unis, elle s’arrêta sur La Nouvelle-Orléans. La ville était bleue. Pas quelques portails : toute la ville, de Gentilly au Bywater, était recouverte d’un champ de la Résistance, un grand triangle serré, tenu, entretenu avec une obstination de jardinier. Elle regarda qui tenait les portails. Le même nom revenait partout, à côté des icônes bleues.",
     "mentions": []
    },
    {

     "text": "Pelican.",
     "mentions": []
    },
    {
     "id": "c9-b20",
     "text": "Elle resta longtemps immobile devant l’écran. Puis elle ouvrit la fiche d’un des portails de Gentilly. Il avait été proposé par Pelican deux mois plus tôt. La photo montrait un poteau électrique ordinaire, sur lequel une bande de peinture, à hauteur d’épaule d’homme, marquait le niveau atteint par l’eau en 2005. La description disait : « Ligne d’eau de Katrina. Ici, l’eau est montée jusque-là. Le magnolia au coin de la rue a tenu. »",
     "mentions": []
    },
    {
     "id": "c9-b21",
     "text": "Elle lut plusieurs fois la dernière phrase. Elle ferma l’ordinateur. Elle le rouvrit.",
     "mentions": []
    },
    {
     "id": "c9-b22",
     "text": "Dans la messagerie du jeu, on pouvait écrire aux agents qui se trouvaient dans une zone. Il fallait être sur place, ou presque. Elle n’était pas sur place. Elle était à trois mille kilomètres, comme toujours.",
     "mentions": []
    },
    {
     "id": "c9-b23",
     "text": "En décembre, pour la sortie officielle du jeu, des agents organisèrent des rencontres dans plusieurs villes, et Niantic y envoyait volontiers quelqu’un pour écouter les joueurs. Léna demanda à aller à celle de La Nouvelle-Orléans. Hanke signa sans poser de question, ce qui voulait dire qu’il avait tout compris.",
     "mentions": []
    },
    {
     "id": "c9-b24",
     "text": "Elle arriva un vendredi soir, dans une ville qu’elle n’avait pas vue depuis cinq ans et qui avait changé, et qui n’avait pas changé. L’humidité, même en décembre. La musique qui sortait des portes. Les maisons repeintes de couleurs de bonbons, et entre elles, encore, des terrains vagues où l’herbe avait mangé les fondations. Elle marcha dans le Quarter avec son téléphone, comme n’importe quel agent, et partout les portails étaient bleus.",
     "mentions": []
    },
    {
     "id": "c9-b25",
     "text": "Elle le trouva à minuit passé, sur une petite place où se tenait une statue qui servait de portail très disputé. Il était assis sur le rebord d’une fontaine, seul, penché sur son écran, et il ne la vit pas arriver. Il avait maigri. Il avait des fils gris dans ses cheveux noirs. Il portait une veste de pilote qu’elle ne connaissait pas. Elle s’arrêta à dix mètres, dans la portée du portail, et elle le pirata.",
     "mentions": []
    },
    {
     "id": "c9-b26",

    },
    {
     "id": "c9-b31",
     "text": "Ils se regardèrent. Il y avait entre eux dix mètres de pavés, une fontaine, une statue et quatre ans. Il y avait aussi, elle le savait, beaucoup de choses qu’une nuit ne suffirait pas à réparer. Il ne se leva pas. Elle ne s’approcha pas. Mais il décala un peu sa veste sur le rebord de la fontaine, un geste minuscule, et elle vint s’asseoir à côté de lui.",
     "mentions": []
    },
    {
     "id": "c9-b32",
     "text": "Ils parlèrent jusqu’à l’aube. De tout, sauf d’eux. Du jeu, de la ville, de sa mère qui avait quatre-vingts ans et jardinait encore, du magnolia qui avait fleuri deux fois cette année-là, ce qui ne s’était jamais vu. Des agents de la Résistance, des Enlightened de Baton Rouge qui venaient la nuit lui voler ses portails, des opérations à l’aube vers les ponts du lac. Il riait avec tout le visage. Elle retrouvait son humour à retardement, le tonnerre après l’éclair. À un moment, un groupe d’agents verts passa sur la place en riant, les salua, et ils les saluèrent ensemble.",
     "mentions": []

    {

     "mentions": []

    {
     "id": "c9-b37",
     "text": "Il pirata le portail une dernière fois, pour la forme, et le reprit en bleu. Puis il s’en alla dans la rue qui descendait vers le fleuve, sans se retourner. Mais au coin de la rue, il leva la main, sans se retourner non plus, et la laissa en l’air un moment.",
     "mentions": []

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));
svg.innerHTML=links.map(l=>{const a=pos[l.from],b=pos[l.to];return '<line class="edge" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"><title>'+esc(l.nature||"")+'</title></line>'}).join("")
+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);
return '<g class="node'+(shown?"":" locked")+'"'+(shown?' data-open-entry="'+escA(n.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Entité non révélée"')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4"/>'+(shown?'<text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+esc(label)+'</text>':"")+'</g>'}).join("");
const revealed=nodes.filter(n=>open(n.codexId)).length;
$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");
$("#relations-list").innerHTML=links.length?links.map(l=>'<li><strong>'+esc(nodeTitle(nodes.find(n=>n.codexId===l.from),l.from))+' — '+esc(nodeTitle(nodes.find(n=>n.codexId===l.to),l.to))+'</strong><br><span class="viz-nature">'+esc(l.nature||"Lien non qualifié")+'</span></li>').join(""):'<li class="empty">Aucun lien n\u2019est encore révélé.</li>';
wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
function trap(e,d){if(e.key!=="Tab")return;const f=$$("button,[href],input,[tabindex]:not([tabindex='-1'])",d).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
$("#start").onclick=()=>go("#chapter/"+(saved.chapter||book.chapters[0].id));$("#home-btn").onclick=()=>go("");$("#codex-btn").onclick=()=>go("#codex");$("#codex-nav").onclick=()=>go("#codex");$("#map-btn").onclick=$("#map-nav").onclick=()=>go("#map");$("#relations-btn").onclick=$("#relations-nav").onclick=()=>go("#relations");$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";applyPrefs();persist()};$("#font-down").onclick=()=>{state.scale=Math.max(.85,+(state.scale-.1).toFixed(2));applyPrefs();persist()};$("#font-up").onclick=()=>{state.scale=Math.min(1.4,+(state.scale+.1).toFixed(2));applyPrefs();persist()};$("#search").oninput=e=>renderCodex(e.target.value);$("#entry-close").onclick=()=>closeDialog($("#entry-dialog"));$("#image-close").onclick=()=>closeDialog($("#image-dialog"));$$("dialog").forEach(d=>{d.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeDialog(d)}else trap(e,d)});d.addEventListener("click",e=>{if(e.target===d)closeDialog(d)})});document.addEventListener("keydown",e=>{if($("dialog[open]"))return;const i=book.chapters.findIndex(c=>c.id===state.chapter);if(e.key==="ArrowRight"&&!$("#reader").hidden&&i<book.chapters.length-1)go("#chapter/"+book.chapters[i+1].id);if(e.key==="ArrowLeft"&&!$("#reader").hidden&&i>0)go("#chapter/"+book.chapters[i-1].id)});function showModuleNav(){const m=hasMap(),r=hasRelations();$("#map-btn").hidden=$("#map-nav").hidden=!m;$("#relations-btn").hidden=$("#relations-nav").hidden=!r}
addEventListener("hashchange",route);applyPrefs();renderHome();renderToc();showModuleNav();syncUnlocks();updateProgress();route();
</script></body></html>
