  "chapters": [
    {
      "id": "chapitre-1",
      "number": 1,
      "title": "Le câble",
      "blocks": [
        {
          "id": "c1-b01",
          "text": "Le câble chantait avant le jour. Aimé Roussel l’entendait de son lit, à travers le mur de la maison du passeur, et il savait à la note ce que la rivière avait fait pendant la nuit. Un son plein, un peu bas : l’Aubrance avait baissé de quelques centimètres. Il n’avait pas besoin de regarder l’échelle peinte sur la pile de la cale. Il regarderait quand même, parce que c’était l’ordre des choses, et que l’ordre des choses, à Ferréol, tenait à peu de gestes.",
          "mentions": [
            "aime-roussel",
            "la-traille",
            "laubrance",
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c1-b02",
          "text": "Il descendit à six heures et quart. L’herbe de la berge était grise de rosée, la brume tenait encore le milieu de l’eau, et le bac, amarré à sa chaîne, se soulevait d’un souffle régulier, comme une bête qui dort debout. La Patience. Son père avait choisi le nom en 1946, l’avait peint lui-même en lettres blanches sur le bordé, et Aimé l’avait repeint quatre fois depuis, toujours dans la même graisse de lettre, toujours un peu trop grosse pour le bateau.",
          "mentions": [
            "la-patience",
            "fernand-roussel",
            "la-cale"
          ]
        },
        {
          "id": "c1-b03",
          "text": "Il fit ce qu’il faisait chaque matin. Il vérifia la tension des deux bras qui montaient du bac vers le chariot, là-haut, où les poulies mordaient le câble porteur. Il graissa l’axe du guindeau, qui n’en avait pas besoin. Il posa la main sur le câble d’amarre, sentit le courant à travers le métal, et décrocha la chaîne. La rivière, aussitôt, prit la barque de biais et la tira vers le large : il la laissa aller d’un mètre, puis rendit du guindeau, et la Patience se plaça dans l’angle qu’il lui demandait, une hanche dans le courant, l’autre à l’abri. C’était tout. On ne poussait pas, on n’avironnait pas. On donnait à l’eau un angle et l’eau faisait le reste.",
          "mentions": [
            "le-guindeau",
            "la-traille"
          ]
        },
        {
          "id": "c1-b04",
          "text": "À sept heures, de la rive droite, un cri lui arriva par-dessus la brume, aigu et joyeux :",
          "mentions": []
        },
        {
          "id": "c1-b05",
          "text": "— Aimé ! Tu m’attends ?",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c1-b06",
          "text": "Il ne répondit pas. Il n’avait jamais répondu à cette question en quarante ans ; le bac attendait, c’était son métier, et Tom Ferrand le savait très bien. Le garçon dévalait le chemin des Vergnes avec son cartable qui battait contre ses reins, dépassa le portique de la traille, s’arrêta net au bord de la cale, comme on lui avait appris, et attendit que le bac vienne à lui. Onze ans. La dernière semaine d’école avant l’été. Il montait à bord depuis le cours préparatoire, tous les matins de classe, une heure avant l’école parce que le bac valait mieux que la cour, et sa mère avait cessé de discuter. Il avait le regard qu’ont les enfants qui savent qu’ils vont bientôt être trop grands pour quelque chose.",
          "mentions": [
            "tom-ferrand",
            "les-vergnes"
          ]
        },
        {
          "id": "c1-b07",
          "text": "— Il a baissé, dit Tom en sautant sur le platelage sans attendre la passerelle.",
          "mentions": []
        },
        {
          "id": "c1-b08",
          "text": "— De quatre doigts.",
          "mentions": []
        },
        {
          "id": "c1-b09",
          "text": "— Tu as regardé l’échelle ?",
          "mentions": [
            "laubrance"
          ]
        },
        {
          "id": "c1-b10",
          "text": "— Pas encore.",
          "mentions": []
        },
        {
          "id": "c1-b11",
          "text": "Tom alla se pencher par-dessus le bord, en amont, là où le courant se fendait sur l’étrave, et il compta les barreaux peints sur la pile en revenant vers la rive gauche. Quatre doigts, à peu près. Il n’y avait pas de quoi être fier, et Aimé ne le fut pas. Il regarda la brume se déchirer sur le bourg, la flèche de l’église neuve prendre le soleil la première, les toits descendre vers la cale comme des marches. La traversée durait quatre minutes quand la rivière était haute, sept quand elle était basse. Ce matin-là, cinq.",
          "mentions": [
            "ferreol"
          ]
        },
        {
          "id": "c1-b12",
          "text": "Ils étaient à mi-chemin lorsqu’ils entendirent la voiture.",
          "mentions": []
        },
        {
          "id": "c1-b13",
          "text": "Elle venait par la route de Vaubrun, sur la rive droite, et elle allait trop vite pour quelqu’un qui connaissait la descente. Aimé la vit apparaître entre les chênes : une berline grise, propre, avec un logo d’entreprise sur la portière, et elle freina au dernier moment devant la barrière de la cale, comme font ceux qui découvrent qu’une route peut finir dans l’eau. La conductrice descendit. Elle regarda le bac, qui s’éloignait d’elle, puis le câble au-dessus de sa tête, puis le bac encore, et elle leva une main, pas pour appeler, pour dire qu’elle avait compris qu’il faudrait attendre.",
          "mentions": [
            "vaubrun"
          ]
        },
        {
          "id": "c1-b14",
          "text": "— C’est qui ? dit Tom.",
          "mentions": [
            "tom-ferrand"
          ]
        },
        {
          "id": "c1-b15",
          "text": "— Quelqu’un qui n’est jamais venu.",
          "mentions": []
        },
        {
          "id": "c1-b16",
          "text": "— Comment tu le sais ?",
          "mentions": []
        },
        {
          "id": "c1-b17",
          "text": "— Elle a freiné.",
          "mentions": []
        },
        {
          "id": "c1-b18",
          "text": "Sur la rive gauche, il redressa le bac dans le courant, accosta sans bruit, mit la passerelle. Tom sauta, courut trois pas, se retourna.",
          "mentions": []
        },
        {
          "id": "c1-b19",
          "text": "— Ce soir, tu me laisses le guindeau ?",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c1-b20",
          "text": "— On verra.",
          "mentions": []
        },
        {
          "id": "c1-b21",
          "text": "Le garçon partit vers l’école en faisant claquer ses semelles sur les pavés. Aimé reprit l’angle, et la Patience, docile, retraversa toute seule. Il ne pensait à rien de particulier. Il pensait à la femme qui attendait, à la voiture grise, à l’heure qu’il était, au fait que le boulanger de Vaubrun passerait à sept heures et demie avec sa camionnette et qu’il faudrait qu’elle soit de l’autre côté avant, ou qu’elle attende. Il pensait à cela avec la partie de lui qui faisait le métier, et le reste de lui regardait l’eau.",
          "mentions": [
            "lecole"
          ]
        },
        {
          "id": "c1-b22",
          "text": "Elle avait garé sa voiture au bord de la cale, moteur coupé, et elle se tenait debout à côté, le téléphone à la main, sans le regarder. Une trentaine d’années. Un pantalon de chantier propre, des chaussures de sécurité neuves, une veste légère sur un tee-shirt, les cheveux attachés vite. Il accosta, mit la passerelle, et elle s’avança sans monter.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c1-b23",
          "text": "— Bonjour. Je peux passer avec la voiture ?",
          "mentions": []
        },
        {
          "id": "c1-b24",
          "text": "— Deux à la fois. Vous êtes toute seule.",
          "mentions": []
        },
        {
          "id": "c1-b25",
          "text": "— C’est combien ?",
          "mentions": []
        },
        {
          "id": "c1-b26",
          "text": "— Rien. C’est le département qui paie.",
          "mentions": []
        },
        {
          "id": "c1-b27",
          "text": "Elle hocha la tête comme si elle savait cela et l’avait oublié. Elle remonta en voiture, la fit avancer sur la passerelle avec une prudence d’ingénieur, s’arrêta là où il lui montrait, pile sur la marque, et il cala les roues sans qu’elle ait à le demander. Puis elle descendit et vint se placer près de lui, au guindeau, ce que les gens ne faisaient jamais : les gens restaient dans leur voiture ou allaient à l’avant regarder l’eau. Elle regardait le câble.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c1-b28",
          "text": "— Il n’y a pas de moteur.",
          "mentions": []
        },
        {
          "id": "c1-b29",
          "text": "— Il y en a un. Il ne sert pas.",
          "mentions": []
        },
        {
          "id": "c1-b30",
          "text": "— Alors qu’est-ce qui…",
          "mentions": []
        },
        {
          "id": "c1-b31",
          "text": "Il décrocha la chaîne. La rivière prit le bac, il rendit du guindeau, la Patience se coucha dans l’angle et se mit en route, et il la vit comprendre. Ce n’était pas la première fois qu’il voyait quelqu’un comprendre la traille, mais c’était rare, et cela le touchait toujours au même endroit, un endroit qu’il n’aurait pas su nommer. Elle suivit du regard les deux bras qui montaient vers le chariot, les poulies qui roulaient sur le câble avec leur petit bruit de train lointain, puis la ligne de l’eau contre le bordé, cette ligne oblique qui disait tout.",
          "mentions": [
            "la-patience",
            "le-guindeau"
          ]
        },
        {
          "id": "c1-b32",
          "text": "— C’est le courant, dit-elle.",
          "mentions": []
        },
        {
          "id": "c1-b33",
          "text": "— C’est l’eau qui porte.",
          "mentions": []
        },
        {
          "id": "c1-b34",
          "text": "Elle ne répondit pas tout de suite. Elle sortit un carnet de sa poche de veste, un vrai carnet, avec un élastique, et elle nota quelque chose, et Aimé, qui en quarante ans avait vu passer des gens qui photographiaient, ne se souvenait pas d’avoir vu quelqu’un noter.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c1-b35",
          "text": "— Inès Marchal, dit-elle sans lever les yeux. Je suis la conductrice de travaux du pont. J’arrive ce matin.",
          "mentions": [
            "ines-marchal",
            "le-pont"
          ]
        },
        {
          "id": "c1-b36",
          "text": "— Je sais.",
          "mentions": []
        },
        {
          "id": "c1-b37",
          "text": "Elle leva les yeux, cette fois.",
          "mentions": []
        },
        {
          "id": "c1-b38",
          "text": "— Vous savez ?",
          "mentions": []
        },
        {
          "id": "c1-b39",
          "text": "— Une voiture grise avec un logo. Le maire a dit que vous arriveriez fin juin. Il n’y a qu’un pont.",
          "mentions": []
        },
        {
          "id": "c1-b40",
          "text": "Elle eut un demi-sourire, bref, qui ne s’adressait pas à lui.",
          "mentions": []
        },
        {
          "id": "c1-b41",
          "text": "— Je voulais me présenter avant qu’on se croise en réunion. Parce qu’on va se croiser. Je vais faire ça deux fois par jour, dit-elle, avec un mouvement du menton vers l’eau. Je loge aux Vergnes, au café. La base vie est côté bourg.",
          "mentions": [
            "les-vergnes",
            "ferreol"
          ]
        },
        {
          "id": "c1-b42",
          "text": "— C’est ce qu’on fait ici. On traverse.",
          "mentions": []
        },
        {
          "id": "c1-b43",
          "text": "Le bac approchait de la rive gauche. Il commençait à redresser, et la Patience perdait son biais, s’alignait, ralentissait. Il vit qu’Inès Marchal cherchait ses mots, ce qui ne lui arrivait sans doute pas souvent, et il attendit, parce qu’attendre était la chose qu’il savait le mieux faire.",
          "mentions": [
            "la-patience"
          ]
        },
        {
          "id": "c1-b44",
          "text": "— Monsieur Roussel. Je préfère vous le dire moi-même. La livraison est fixée au vingt septembre. Inauguration le matin, ouverture à la circulation l’après-midi. Et le marché comprend un lot de dépose. Le câble, les portiques. Le bac s’arrête le vingt.",
          "mentions": [
            "aime-roussel",
            "la-traille"
          ]
        },
        {
          "id": "c1-b45",
          "text": "Le bac toucha la cale. Il n’y eut pas de choc ; il n’y en avait jamais. Aimé passa la chaîne dans l’anneau, sortit la passerelle, ôta les cales des roues. Puis il se redressa, et il la regarda, et il vit qu’elle attendait quelque chose de lui, une colère peut-être, ou une question, et que cette attente lui coûtait.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c1-b46",
          "text": "— Bien, dit-il.",
          "mentions": []
        },
        {
          "id": "c1-b47",
          "text": "Elle cligna des yeux.",
          "mentions": []
        },
        {
          "id": "c1-b48",
          "text": "— Bien ?",
          "mentions": []
        },
        {
          "id": "c1-b49",
          "text": "— Le vingt septembre. C’est un dimanche. Il n’y a pas école. Les gens viendront.",
          "mentions": []
        },
        {
          "id": "c1-b50",
          "text": "Elle remonta en voiture. Elle avança lentement sur la passerelle, s’arrêta sur la terre ferme, baissa sa vitre.",
          "mentions": []
        },
        {
          "id": "c1-b51",
          "text": "— Merci pour la traversée.",
          "mentions": []
        },
        {
          "id": "c1-b52",
          "text": "— Ce soir, six heures et demie, dit-il. Après, je ne fais plus que sur demande. Il y a une cloche.",
          "mentions": []
        },
        {
          "id": "c1-b53",
          "text": "Elle regarda la cloche, en fonte, accrochée au portique, avec sa corde qui pendait à hauteur d’homme. Elle hocha la tête, et la voiture grise monta vers le bourg, et il l’entendit longtemps parce que le matin était sans vent.",
          "mentions": [
            "ines-marchal",
            "le-pont",
            "la-depose"
          ]
        },
        {
          "id": "c1-b54",
          "text": "Il resta un moment sur la cale. Puis il fit ce qu’il faisait toujours quand il n’y avait personne à passer : il alla regarder l’échelle. Quatre doigts. Tom avait raison. Il revint au bac, s’assit sur le banc de l’avant, celui que son père avait fixé là pour les vieux et les femmes enceintes, et il regarda en aval, à trois cents mètres, l’endroit où les deux piles du pont sortaient de l’eau, avec leurs échafaudages et leur tablier presque fini qui jetait sur la rivière une ombre neuve. Il y avait des hommes, déjà, sur le tablier, petits, en orange. Il entendait leurs voix par instants. Il se demanda si, de là-haut, ils voyaient le bac, et il se dit que oui, sans doute, mais qu’ils ne le regardaient pas, parce qu’on ne regarde pas ce qu’on remplace, et il n’y trouva rien à redire.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c1-b55",
          "text": "Le boulanger arriva à sept heures vingt-huit. Aimé le passa. Puis il passa la Renault des Combes, puis la factrice, puis personne pendant une heure, et le soleil monta au-dessus des chênes de la rive droite, et le câble, à mesure qu’il chauffait, changea de note.",
          "mentions": [
            "aime-roussel",
            "la-traille"
          ]
        }
      ]
    },
    {
      "id": "chapitre-2",
      "number": 2,
      "title": "L’eau qui porte",
      "blocks": [
        {
          "id": "c2-b01",
          "text": "Inès Marchal avait appris à arriver. C’était un savoir-faire, comme un autre, qu’on n’enseignait pas à l’école d’ingénieurs et qu’elle avait acquis chantier après chantier, sept en huit ans : on arrive un matin, on trouve la clé de la base vie sous le pot qu’on vous a indiqué, on branche la bouilloire, on ouvre le dossier, on apprend les prénoms des compagnons avant le déjeuner et on ne fait aucune promesse avant le vendredi. Elle savait aussi partir, ce qui était plus rare. Ce qu’elle ne savait pas, découvrit-elle la première semaine, c’était dépendre d’une cloche.",
          "mentions": [
            "ines-marchal",
            "la-base-vie"
          ]
        },
        {
          "id": "c2-b02",
          "text": "La base vie était un assemblage de trois bungalows posés sur le pré communal, à cent mètres de la cale, côté bourg. De la fenêtre du bureau, en se penchant, elle voyait le bac. Elle ne se pencha pas, les premiers jours. Elle lut. Le dossier du pont de Ferréol faisait quatre classeurs et deux disques durs, et elle le prit dans l’ordre, parce qu’elle avait appris cela aussi : un chantier qu’on reprend à quatre-vingt-dix pour cent est un chantier dont on hérite les silences. Elle chercha les silences. Elle trouva un ouvrage sobre, deux piles en rivière, trois travées, quatre-vingt-seize mètres de tablier, un béton bien mené par son prédécesseur, qui était parti diriger un viaduc en Savoie et lui avait laissé un mot de deux lignes. Elle trouva les finitions à conduire — garde-corps, joints de chaussée, enrobés, épreuves de charge — et, à la fin du quatrième classeur, le lot 4, dépose de la traille et de ses portiques, quinze pages, un planning de trois jours, la semaine du vingt-deux septembre.",
          "mentions": [
            "le-pont",
            "la-depose"
          ]
        },
        {
          "id": "c2-b03",
          "text": "Elle referma le classeur et resta la main dessus.",
          "mentions": []
        },
        {
          "id": "c2-b04",
          "text": "Puis elle traversa, à six heures et demie, comme il l’avait dit. Il l’attendait. Il attendait sans doute tout le monde de la même façon, assis sur le banc de l’avant, les avant-bras sur les cuisses, et il se levait quand quelqu’un apparaissait en haut de la cale, pas avant. Elle avait décidé de laisser la voiture au bourg et de traverser à pied : le café des Vergnes était à deux cents mètres de la cale, elle n’avait besoin de rien d’autre, et il lui semblait, sans qu’elle se l’explique, qu’on ne pouvait pas faire monter une berline d’entreprise deux fois par jour sur un bateau qu’on allait démonter.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c2-b05",
          "text": "Le troisième soir, elle lui posa la question qu’elle retenait depuis le premier matin.",
          "mentions": []
        },
        {
          "id": "c2-b06",
          "text": "— Comment vous faites pour l’angle ?",
          "mentions": []
        },
        {
          "id": "c2-b07",
          "text": "Il la regarda comme on regarde une réponse et non une question. Puis il posa la main sur le tambour du guindeau, un cylindre de fonte gros comme un tronc, autour duquel les deux bras du bac venaient s’enrouler et se dérouler.",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c2-b08",
          "text": "— Là. Je rends d’un côté, je reprends de l’autre. Ça déplace le point où le bac est pendu. Si le point est en amont, le bac se couche dans le courant et le courant le pousse. Si le point est au milieu, il s’arrête.",
          "mentions": []
        },
        {
          "id": "c2-b09",
          "text": "— Et pour revenir ?",
          "mentions": []
        },
        {
          "id": "c2-b10",
          "text": "— L’autre côté.",
          "mentions": []
        },
        {
          "id": "c2-b11",
          "text": "Elle regarda les deux bras monter en oblique vers le chariot, huit mètres au-dessus de l’eau, et le chariot rouler lentement sur le câble porteur avec ce bruit de train qu’elle commençait à attendre le soir comme d’autres attendent une voix. Elle fit le calcul sans le vouloir. Cent dix mètres de portée d’un portique à l’autre. Une flèche de trois mètres, peut-être un peu plus. Le poids du bac chargé, la composante du courant, le renvoi d’angle. C’était une machine simple, une machine de quatre pièces, et elle marchait depuis 1902 sur la seule force d’une rivière qui ne demandait rien.",
          "mentions": [
            "le-guindeau",
            "la-traille"
          ]
        },
        {
          "id": "c2-b12",
          "text": "— Et quand il n’y a pas de courant ?",
          "mentions": []
        },
        {
          "id": "c2-b13",
          "text": "— Il y a toujours du courant. Sauf en août.",
          "mentions": []
        },
        {
          "id": "c2-b14",
          "text": "— Alors ?",
          "mentions": []
        },
        {
          "id": "c2-b15",
          "text": "Il indiqua du menton, à l’arrière, sous une bâche verte, une forme qu’elle avait prise pour un coffre. Un moteur hors-bord, de taille modeste, dont le capot avait pâli.",
          "mentions": [
            "le-moteur-de-la-honte"
          ]
        },
        {
          "id": "c2-b16",
          "text": "— Ça. Mon père l’appelait le moteur de la honte. Il ne l’a jamais mis en marche. Moi, je m’en sers trois semaines par an.",
          "mentions": []
        },
        {
          "id": "c2-b17",
          "text": "— Vous n’avez pas honte ?",
          "mentions": []
        },
        {
          "id": "c2-b18",
          "text": "— Si. Mais je passe les gens.",
          "mentions": []
        },
        {
          "id": "c2-b19",
          "text": "Elle rit, brièvement, et il ne rit pas, mais quelque chose dans sa façon de tenir le guindeau se détendit, et elle comprit qu’il avait fait une plaisanterie et qu’il la faisait sans doute depuis vingt ans à qui posait la question.",
          "mentions": [
            "le-moteur-de-la-honte",
            "fernand-roussel"
          ]
        },
        {
          "id": "c2-b20",
          "text": "Le lendemain matin, en traversant dans l’autre sens, elle prit son carnet et nota : « Traille de Ferréol. 1902. Câble porteur, chariot à deux poulies, deux bras réglés au guindeau. Aucun moteur en service normal. À documenter avant dépose : photos, relevés, témoignage du passeur. » Elle souligna « témoignage » et se demanda ce qu’elle entendait par là.",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c2-b21",
          "text": "C’était un jeudi. Il y avait quelqu’un d’autre sur le bac ce matin-là, un vieil homme très droit avec un vélo de dame noir, chargé sur le porte-bagages d’un seau, d’une brosse et d’un bouquet de pivoines fatiguées enveloppé dans du papier journal. Il s’était installé debout à l’avant, une main sur le guidon, l’autre sur le plat-bord, et il regardait la rive droite venir avec l’attention de quelqu’un qui compte les secondes sans en avoir l’air.",
          "mentions": []
        },
        {
          "id": "c2-b22",
          "text": "— Lucien Astier, dit-il quand elle le salua, en ôtant une casquette qui n’était pas une casquette d’agriculteur. J’ai été l’instituteur d’ici. Vous êtes la dame du pont.",
          "mentions": [
            "lucien-astier",
            "le-pont"
          ]
        },
        {
          "id": "c2-b23",
          "text": "— Inès Marchal.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c2-b24",
          "text": "— Je sais. Tout le monde sait. Vous logez chez Nadia, vous laissez votre voiture au bourg, vous notez des choses. Ici, on n’a pas besoin de journal.",
          "mentions": [
            "nadia-ferrand",
            "ferreol"
          ]
        },
        {
          "id": "c2-b25",
          "text": "Il souriait sans malice. Elle remarqua que ses ongles étaient bordés de terre et qu’il avait, dans la poche de poitrine de sa veste, un crayon de menuisier taillé au couteau.",
          "mentions": []
        },
        {
          "id": "c2-b26",
          "text": "— Vous allez au cimetière, dit-elle, à cause du seau.",
          "mentions": [
            "le-cimetiere"
          ]
        },
        {
          "id": "c2-b27",
          "text": "— Tous les jeudis. Ma femme est là-bas depuis sept ans. Le cimetière est resté de l’autre côté quand le bourg a traversé. Vous devez savoir cela, c’est dans votre dossier, en principe. Ou alors ce n’est pas dans votre dossier et il faudra que je vous le raconte.",
          "mentions": []
        },
        {
          "id": "c2-b28",
          "text": "— Le bourg a traversé ?",
          "mentions": []
        },
        {
          "id": "c2-b29",
          "text": "— En 1856. Il y avait un pont, avant. En bois. La crue l’a emporté, avec le bas du village. On a rebâti en haut, de l’autre côté, sur la rive qui ne monte pas. Les morts sont restés où ils étaient. C’est comme ça que Ferréol s’est trouvé à devoir passer l’eau pour aller les voir. Depuis cent soixante-dix ans, madame, les vivants de cette commune traversent pour aller aux morts. Votre pont va changer ça aussi. Ce n’est pas un reproche.",
          "mentions": [
            "lucien-astier",
            "le-cimetiere",
            "le-pont-de-bois"
          ]
        },
        {
          "id": "c2-b30",
          "text": "Elle ne trouva rien à répondre. Le bac approchait. Aimé, au guindeau, n’avait pas l’air d’écouter et écoutait tout.",
          "mentions": [
            "aime-roussel",
            "le-guindeau"
          ]
        },
        {
          "id": "c2-b31",
          "text": "— J’écris la monographie de la commune, ajouta Lucien Astier en remettant sa casquette. Depuis ma retraite. Il y a des choses que je ne sais pas et que je n’aurai jamais le temps de savoir. Mais il y a des choses que je sais et qu’il faut que quelqu’un écrive avant la fin de l’été, parce que le vingt septembre, une partie de ce que je sais deviendra faux.",
          "mentions": [
            "lucien-astier"
          ]
        },
        {
          "id": "c2-b32",
          "text": "Il descendit avec son vélo, la remercia d’un signe de tête, et prit le chemin qui montait vers le vieux cimetière à travers les prés.",
          "mentions": [
            "la-monographie"
          ]
        },
        {
          "id": "c2-b33",
          "text": "Ce même jour, elle rencontra le maire. Bernard Quéré était éleveur, cinquante-huit ans, un homme large qui parlait vite et regardait sa montre en s’excusant de la regarder. Il la reçut dans la salle du conseil, sous une carte du cadastre où l’Aubrance était un ruban bleu pâle qui coupait la commune en deux parts inégales, et il ne perdit pas de temps.",
          "mentions": [
            "bernard-quere",
            "laubrance"
          ]
        },
        {
          "id": "c2-b34",
          "text": "— Le vingt septembre, ça tient ?",
          "mentions": []
        },
        {
          "id": "c2-b35",
          "text": "— Ça tient. Les enrobés la première semaine de septembre, les épreuves de charge le douze, la commission de sécurité le seize.",
          "mentions": []
        },
        {
          "id": "c2-b36",
          "text": "— Bien. Parce que j’ai le sous-préfet, le conseiller départemental, la fanfare de Vaubrun et trois cents personnes. Et il faut que le car de ramassage passe le lundi vingt et un au matin sur le pont, pas sur le bac. Les gamins des Vergnes, madame Marchal. Il y en a onze qui prennent le car pour le collège de Vaubrun. Depuis toujours, ils traversent d’abord. Depuis toujours, quand la rivière est trop haute, ils ne vont pas en classe. Ça, c’est fini.",
          "mentions": [
            "ines-marchal",
            "le-pont"
          ]
        },
        {
          "id": "c2-b37",
          "text": "— Je comprends.",
          "mentions": []
        },
        {
          "id": "c2-b38",
          "text": "— Non, dit-il, sans agressivité. Vous ne comprenez pas encore. Mais vous êtes ici pour ça.",
          "mentions": []
        },
        {
          "id": "c2-b39",
          "text": "Il lui serra la main et la raccompagna jusqu’au perron. En bas, entre les toits, on voyait la cale et le bac qui revenait à vide de la rive droite, tout seul, incliné dans le courant comme un oiseau qui se laisse porter par le vent.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c2-b40",
          "text": "— Il ne vous a rien dit ? demanda Quéré.",
          "mentions": [
            "bernard-quere"
          ]
        },
        {
          "id": "c2-b41",
          "text": "— Monsieur Roussel ? Il a dit : bien.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c2-b42",
          "text": "Le maire hocha la tête plusieurs fois.",
          "mentions": []
        },
        {
          "id": "c2-b43",
          "text": "— C’est ce qu’il dit.",
          "mentions": [
            "bernard-quere",
            "ferreol",
            "laubrance"
          ]
        },
        {
          "id": "c2-b44",
          "text": "Le soir, elle s’arrêta au milieu de la traversée pour regarder le pont. C’était la première fois qu’elle le voyait de l’eau, à hauteur de la rivière, et non du tablier ou de la rive. Il était beau. Elle n’avait pas de fausse pudeur là-dessus : elle aimait les ouvrages, c’était pour cela qu’elle faisait ce métier, et celui-là était bien proportionné, avec ses deux piles fuselées qui fendaient le courant et son tablier mince qui semblait tenir tout seul. Dans trois mois, des enfants le traverseraient en car sans le regarder, ce qui était le plus grand compliment qu’on puisse faire à un pont.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c2-b45",
          "text": "— Vous l’aimez, dit Aimé derrière elle. Ce n’était pas une question.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c2-b46",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c2-b47",
          "text": "— Il est bien fait ?",
          "mentions": []
        },
        {
          "id": "c2-b48",
          "text": "— Il est bien fait.",
          "mentions": []
        },
        {
          "id": "c2-b49",
          "text": "— Tant mieux.",
          "mentions": []
        },
        {
          "id": "c2-b50",
          "text": "Il redressa le bac. Elle sentit l’angle se défaire sous ses pieds, cette petite perte de portance qui annonçait la rive, et elle se rendit compte qu’elle l’avait sentie avant de la comprendre, comme on sent un ascenseur qui ralentit. Elle nota cela aussi, plus tard, dans sa chambre au-dessus du café, avec le bruit des verres en bas et celui de la rivière derrière : « Le corps apprend l’angle avant l’esprit. » Puis elle rangea le carnet et regarda longtemps, par la fenêtre ouverte, le câble qui luisait au-dessus de l’eau noire, tendu d’une rive à l’autre comme une phrase qu’on n’a pas finie.",
          "mentions": [
            "la-traille"
          ]
        }
      ]
    },
    {
      "id": "chapitre-3",
      "number": 3,
      "title": "Les Vergnes",
      "blocks": [
        {
          "id": "c3-b01",
          "text": "Le café des Vergnes s’appelait Chez Ferrand depuis trois générations et ne s’était jamais appelé autrement, même quand une brasserie de Vaubrun avait offert une enseigne lumineuse en échange d’un contrat d’exclusivité. La mère de Nadia avait dit non, et Nadia avait gardé le non avec le reste : le comptoir en zinc, le rayon d’épicerie qui tenait sur deux étagères et un congélateur, le dépôt de pain, la Française des jeux, le tableau des matchs du dimanche, et l’habitude de savoir avant les gens ce dont ils avaient besoin.",
          "mentions": [
            "chez-ferrand",
            "nadia-ferrand",
            "les-vergnes"
          ]
        },
        {
          "id": "c3-b02",
          "text": "— Vous ne prenez jamais de sucre, dit-elle à Inès la deuxième semaine en posant le café sur le comptoir. Et vous lisez le journal en commençant par la fin.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c3-b03",
          "text": "— Je regarde la météo.",
          "mentions": []
        },
        {
          "id": "c3-b04",
          "text": "— C’est ce que je dis. Vous êtes du bâtiment.",
          "mentions": []
        },
        {
          "id": "c3-b05",
          "text": "Elle avait quarante-quatre ans, des bras solides et des yeux qui ne cillaient pas. Elle avait repris le café à la mort de sa mère, douze ans plus tôt, après avoir travaillé à Vaubrun dans une agence d’assurances dont elle ne parlait jamais, et elle élevait Tom seule depuis que le père du garçon était parti conduire des camions frigorifiques entre l’Espagne et la Belgique. Elle ne parlait pas de cela non plus. Elle parlait de la rivière, du prix du gasoil, des vaches de Quéré, et du pont, avec une neutralité de commerçante qui n’excluait rien.",
          "mentions": [
            "tom-ferrand",
            "bernard-quere"
          ]
        },
        {
          "id": "c3-b06",
          "text": "— Ça va vous changer, dit Inès.",
          "mentions": []
        },
        {
          "id": "c3-b07",
          "text": "— Ça va tout changer. Les gens de Vaubrun viendront le dimanche voir le pont, ils s’arrêteront boire un verre, et puis ils passeront de l’autre côté sans s’arrêter. Les gens d’ici iront faire leurs courses au bourg en trois minutes au lieu de prendre le bac. Je perds le pain, je gagne les touristes. On verra le compte en décembre.",
          "mentions": [
            "le-pont",
            "ferreol"
          ]
        },
        {
          "id": "c3-b08",
          "text": "— Vous êtes pour ou contre ?",
          "mentions": []
        },
        {
          "id": "c3-b09",
          "text": "Nadia rinça un verre, le retourna sur l’égouttoir, la regarda.",
          "mentions": [
            "nadia-ferrand"
          ]
        },
        {
          "id": "c3-b10",
          "text": "— Ma fille, il y a un pont. On n’est plus au temps où on était pour ou contre.",
          "mentions": [
            "vaubrun"
          ]
        },
        {
          "id": "c3-b11",
          "text": "Tom entra à ce moment-là, en tenue de vacances, c’est-à-dire pieds nus dans des sandales et le visage déjà brun, et il annonça qu’Aimé lui avait laissé le guindeau sur la moitié de la traversée du matin, celle d’aller, où il n’y avait personne, et qu’il n’avait pas dérivé de plus d’un mètre à l’accostage.",
          "mentions": [
            "aime-roussel",
            "tom-ferrand"
          ]
        },
        {
          "id": "c3-b12",
          "text": "— Un mètre, dit sa mère. Tu as pris la rive ?",
          "mentions": []
        },
        {
          "id": "c3-b13",
          "text": "— Non. Le bac.",
          "mentions": []
        },
        {
          "id": "c3-b14",
          "text": "— Alors c’est un mètre de trop.",
          "mentions": []
        },
        {
          "id": "c3-b15",
          "text": "Le garçon se tourna vers Inès pour trouver une alliée et n’en trouva pas ; elle avait déjà, elle aussi, appris à ne pas prendre parti dans les histoires d’angle. Il repartit en courant vers la cale, où Aimé, pensa-t-elle, l’attendait sans le lui dire, assis sur son banc, et elle se demanda ce qu’un enfant de onze ans faisait d’un savoir qui n’aurait plus d’usage le jour de sa rentrée en sixième.",
          "mentions": [
            "tom-ferrand",
            "aime-roussel"
          ]
        },
        {
          "id": "c3-b16",
          "text": "Les Vergnes se composaient de douze fermes, dont quatre encore en activité, d’une chapelle fermée, du café, d’une ancienne école transformée en gîte, et du vieux cimetière avec, à côté, les murs sans toit de l’église Saint-Ferréol d’avant 1856. Inès y monta un dimanche, seule, parce qu’il faisait beau et qu’elle voulait voir de là-haut la commune entière. Le chemin traversait des prés secs où des vaches la regardèrent passer sans intérêt. Le cimetière était petit, bien tenu, entouré d’un mur de pierre sèche que quelqu’un réparait par tronçons : on voyait la couleur plus claire des pierres remaniées. Elle trouva la tombe d’Odile Astier sans la chercher, parce que c’était la seule avec des pivoines fraîches. Institutrice, 1949-2019. Et dessous, gravé d’avance, Lucien Astier, 1947-, avec le tiret qui attendait.",
          "mentions": [
            "le-cimetiere",
            "odile-astier"
          ]
        },
        {
          "id": "c3-b17",
          "text": "De là, on voyait tout. L’Aubrance décrivait une courbe lente, vert sombre sous les frênes, plus claire au milieu où le courant portait. Le bourg s’étageait en face, avec l’église neuve, la mairie à fronton, les toits d’ardoise, et, tout en bas, la cale et la maison du passeur dont la cheminée fumait, en plein juillet, parce qu’Aimé Roussel cuisinait au bois. Le câble de la traille était un trait de crayon au-dessus de l’eau. Le pont, en aval, était un trait plus large, gris, avec ses grues, et de cette hauteur les deux traits se ressemblaient d’une façon qu’elle n’aurait pas su expliquer à quelqu’un qui n’aurait pas été du métier. Deux lignes tendues d’une rive à l’autre. L’une avait cent vingt-quatre ans. L’autre deux.",
          "mentions": [
            "laubrance",
            "ferreol",
            "la-maison-du-passeur",
            "le-pont",
            "la-traille"
          ]
        },
        {
          "id": "c3-b18",
          "text": "Le quatorze juillet, la fête se tenait aux Vergnes, comme toutes les années impaires : c’était une convention ancienne dont personne, sauf Lucien Astier, ne connaissait plus l’origine ; il la fit remonter, quand elle l’interrogea, à une querelle de conseil municipal de 1923. On dressait des tables sous les tilleuls devant le café, la fanfare de Vaubrun venait en camionnette par la route, et le feu d’artifice se tirait depuis la rive gauche, du pré communal, pour que les deux rives le voient de face. Le bac passait les gens du bourg à partir de six heures du soir, par douzaines, en robe et en chemise repassée, et Aimé faisait la traversée en huit minutes au lieu de cinq parce que l’eau était basse et le bac lourd.",
          "mentions": [
            "aime-roussel",
            "lucien-astier"
          ]
        },
        {
          "id": "c3-b19",
          "text": "Inès aida Nadia au comptoir, sans qu’on lui ait demandé, parce qu’il lui parut impossible de rester assise. Elle servit des bières et des sirops, coupa des tartes, apprit les prénoms. Elle vit Bernard Quéré en chemise blanche serrer des mains avec la conviction d’un homme qui a un pont à inaugurer dans deux mois. Elle vit Lucien Astier assis un peu à l’écart sous le dernier tilleul, un verre de vin devant lui, qui écrivait au crayon dans un cahier d’écolier, relevait la tête, regardait quelqu’un, écrivait de nouveau. Elle vit Tom et trois autres enfants courir vers la cale à chaque fois que le câble chantait, pour être les premiers à voir qui arrivait.",
          "mentions": [
            "bernard-quere",
            "lucien-astier"
          ]
        },
        {
          "id": "c3-b20",
          "text": "À la nuit, quand les fusées montèrent de l’autre rive et que leur reflet se cassa dans le courant, elle se trouva à côté d’un vieil agriculteur qui lui expliqua sans qu’elle le lui demande qu’en 1985, il avait fallu annuler la fête parce que le bac ne pouvait pas passer, à cause de la crue de février qui avait abîmé le portique, et qu’on l’avait réparé en août seulement.",
          "mentions": [
            "la-traille",
            "la-crue"
          ]
        },
        {
          "id": "c3-b21",
          "text": "— En février ? La fête est en juillet.",
          "mentions": []
        },
        {
          "id": "c3-b22",
          "text": "— Oui, mais on a eu peur. Et puis il y avait eu l’histoire de la petite. On n’avait pas le cœur.",
          "mentions": []
        },
        {
          "id": "c3-b23",
          "text": "— Quelle petite ?",
          "mentions": []
        },
        {
          "id": "c3-b24",
          "text": "Il fit un geste vague vers le café, vers la nuit, vers quarante ans plus tôt, et une fusée dorée éclata qui fit lever toutes les têtes, et il ne répondit pas, ou elle n’entendit pas.",
          "mentions": [
            "la-crue"
          ]
        },
        {
          "id": "c3-b25",
          "text": "Plus tard, alors qu’on rangeait les tréteaux et que le bac faisait ses dernières traversées pleines de gens qui chantaient faux, elle se retrouva près de Quéré, un plateau de verres dans les mains.",
          "mentions": [
            "bernard-quere"
          ]
        },
        {
          "id": "c3-b26",
          "text": "— Ça a été long, ce pont, dit-elle. Quarante ans de dossier. J’ai vu les dates dans le classeur.",
          "mentions": []
        },
        {
          "id": "c3-b27",
          "text": "— Quarante et un.",
          "mentions": []
        },
        {
          "id": "c3-b28",
          "text": "— Comment ça se passe, un dossier qui dure quarante et un ans ? Qui le porte ?",
          "mentions": []
        },
        {
          "id": "c3-b29",
          "text": "Le maire posa sur elle un regard qui hésita, une seconde, entre deux réponses.",
          "mentions": []
        },
        {
          "id": "c3-b30",
          "text": "— Le département, en fin de compte. La programmation routière. Le collège de Vaubrun, qui a menacé de ne plus prendre les gamins des Vergnes si on ne garantissait pas leur présence en classe l’hiver. Ça, c’est ce qui a fait basculer, en 2023.",
          "mentions": [
            "les-vergnes",
            "vaubrun"
          ]
        },
        {
          "id": "c3-b31",
          "text": "— Et avant ?",
          "mentions": []
        },
        {
          "id": "c3-b32",
          "text": "— Avant, il y en a un qui a écrit. Pendant quarante ans. Tous les ans, une lettre au conseil général, puis au conseil départemental quand ça a changé de nom. Toujours la même demande. Ils l’ont mise dans le dossier quand ils ont enfin monté le projet, en préambule. Trente-neuf lettres. Vous ne les avez pas vues ?",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c3-b33",
          "text": "— Elles doivent être dans les archives du maître d’ouvrage. Je n’ai que le dossier d’exécution.",
          "mentions": []
        },
        {
          "id": "c3-b34",
          "text": "— Elles y sont. Vous devriez les lire.",
          "mentions": []
        },
        {
          "id": "c3-b35",
          "text": "— Qui ?",
          "mentions": []
        },
        {
          "id": "c3-b36",
          "text": "Quéré regarda vers le tilleul du fond, où Lucien Astier rangeait son cahier dans une musette, et Inès suivit son regard, et le maire ne dit ni oui ni non. Il prit le plateau de ses mains.",
          "mentions": [
            "lucien-astier",
            "ines-marchal"
          ]
        },
        {
          "id": "c3-b37",
          "text": "— Il y a des choses, ici, qu’on laisse dire aux gens eux-mêmes. Bonne nuit, madame Marchal. Belle fête.",
          "mentions": [
            "les-trente-neuf-lettres",
            "bernard-quere"
          ]
        },
        {
          "id": "c3-b38",
          "text": "Elle traversa avec les derniers, à une heure du matin. L’eau était noire et lisse, la rive gauche encore piquée de lampes, et le bac allait sans bruit dans son angle, chargé de gens fatigués qui ne parlaient plus. Aimé Roussel tenait le guindeau sans le regarder. Elle s’approcha de lui, ce qu’elle n’avait pas fait de la soirée.",
          "mentions": [
            "aime-roussel",
            "le-guindeau"
          ]
        },
        {
          "id": "c3-b39",
          "text": "— Vous n’êtes pas venu à la fête.",
          "mentions": []
        },
        {
          "id": "c3-b40",
          "text": "— J’ai passé la fête. Quatre cent douze personnes, aller et retour. C’est ma façon d’y aller.",
          "mentions": []
        },
        {
          "id": "c3-b41",
          "text": "— Vous comptez ?",
          "mentions": []
        },
        {
          "id": "c3-b42",
          "text": "— Toujours.",
          "mentions": []
        },
        {
          "id": "c3-b43",
          "text": "Elle songea à l’instituteur qui écrivait sous le tilleul, à ses trente-neuf lettres, à cette obstination de quarante ans qu’elle croyait maintenant comprendre, et elle se dit que ce village avait au moins deux hommes qui comptaient tout, et qu’ils ne comptaient pas la même chose. Elle se trompait. Elle ne le saurait que plus tard, et elle penserait alors à ce moment précis, à l’eau noire, au câble qui chantait bas au-dessus d’eux, et à la façon dont Aimé avait dit « toujours », comme on referme une porte.",
          "mentions": [
            "ines-marchal",
            "lucien-astier",
            "aime-roussel"
          ]
        }
      ]
    },
    {
      "id": "chapitre-4",
      "number": 4,
      "title": "Étiage",
      "blocks": [
        {
          "id": "c4-b01",
          "text": "En août, l’Aubrance cessait de porter. Ce n’était pas une image. Le niveau descendait sous le premier barreau de l’échelle, les galets du fond apparaissaient en amont de la cale, pâles comme des os, et le courant, au milieu, n’était plus qu’une hésitation verte que le vent d’ouest suffisait à contrarier. Le câble ne chantait plus ; il grinçait au soleil, dilaté, et le chariot roulait dessus avec un bruit sec de dents. Aimé mettait le moteur. Il le mettait comme on prend un médicament, au dernier moment, à la dose la plus faible, et il le coupait dès que le bac avait assez d’erre pour finir seul.",
          "mentions": [
            "letiage",
            "laubrance",
            "le-moteur-de-la-honte"
          ]
        },
        {
          "id": "c4-b02",
          "text": "— Pourquoi tu ne le laisses pas tourner jusqu’au bout ? demanda Tom.",
          "mentions": [
            "tom-ferrand"
          ]
        },
        {
          "id": "c4-b03",
          "text": "— Parce qu’il n’en a pas besoin.",
          "mentions": []
        },
        {
          "id": "c4-b04",
          "text": "— Il n’a pas besoin non plus au début. On pourrait pousser avec la gaffe.",
          "mentions": []
        },
        {
          "id": "c4-b05",
          "text": "— Essaie.",
          "mentions": []
        },
        {
          "id": "c4-b06",
          "text": "Tom essaya. Il planta la gaffe dans le fond, poussa de tout son poids, et le bac, chargé de la camionnette du plombier, ne bougea pas d’un centimètre. Il recommença, les pieds calés, la figure rouge, et Aimé le laissa faire jusqu’à ce que le plombier, dans sa cabine, commence à regarder sa montre. Alors il mit le moteur, dix secondes, et rendit du guindeau, et la Patience se décolla du fond et prit son angle, lent, pesant, comme une vieille qui se lève d’un fauteuil.",
          "mentions": [
            "tom-ferrand",
            "la-patience"
          ]
        },
        {
          "id": "c4-b07",
          "text": "— Tu vois, dit-il. Tu ne pousses pas. Tu demandes. Tu lui donnes l’angle et tu attends qu’elle veuille bien. Quand elle veut bien, tu arrêtes de demander.",
          "mentions": []
        },
        {
          "id": "c4-b08",
          "text": "— Et si elle ne veut pas ?",
          "mentions": []
        },
        {
          "id": "c4-b09",
          "text": "— Alors c’est qu’il n’y a plus d’eau, et tu vas à pied.",
          "mentions": []
        },
        {
          "id": "c4-b10",
          "text": "Le garçon rit. Le plombier, sur la rive gauche, les remercia d’un coup de klaxon, et Aimé nota, sans le vouloir, que c’était la six mille deux cent quarante-troisième fois qu’il passait cette camionnette-là ou celle qui l’avait précédée, puisque le plombier avait changé de camionnette deux fois depuis 1984 mais pas d’habitudes. Il comptait tout. Il n’avait jamais décidé de compter ; il s’était aperçu un jour, vers trente ans, qu’il le faisait, comme d’autres s’aperçoivent qu’ils fredonnent. Les traversées, les voitures, les vaches en 1991 quand Quéré avait fait passer son troupeau pour l’estive du plateau, les enterrements.",
          "mentions": [
            "aime-roussel",
            "bernard-quere"
          ]
        },
        {
          "id": "c4-b11",
          "text": "Il y en eut un le dix août.",
          "mentions": []
        },
        {
          "id": "c4-b12",
          "text": "Renée Combes était morte dans son lit, au bourg, à quatre-vingt-onze ans, la veille au soir, sans avoir été malade, ce qui était la façon de mourir qu’on souhaitait à Ferréol et qu’on accordait rarement. On l’enterrait aux Vergnes, comme tous les morts de la commune depuis 1856, et cela voulait dire qu’elle passerait l’eau. Aimé lava le platelage à l’aube, à la brosse et à grande eau, comme son père avant lui, et il retira la bâche du moteur pour la replier soigneusement à l’arrière, hors de vue.",
          "mentions": [
            "renee-combes",
            "le-cimetiere"
          ]
        },
        {
          "id": "c4-b13",
          "text": "Le corbillard descendit la rue du bourg à dix heures, au pas, suivi de la famille à pied, puis du reste : une centaine de personnes, en noir ou en sombre, qui marchaient sans parler dans la chaleur déjà lourde. Aimé fit monter le corbillard seul, le cala, et les Combes se placèrent autour, les mains sur le toit de la voiture, comme on tient une table qui pourrait bouger. Il prit douze personnes de plus, celles que la famille lui désigna d’un signe, et pas une de plus, alors que le bac en aurait porté vingt. Les autres attendraient. Il ferait autant de traversées qu’il faudrait. C’était la règle, et personne ne la discutait, parce qu’on avait tous, un jour, été de ceux qui attendaient.",
          "mentions": [
            "ferreol"
          ]
        },
        {
          "id": "c4-b14",
          "text": "Il décrocha la chaîne. Il ne mit pas le moteur.",
          "mentions": [
            "le-moteur-de-la-honte"
          ]
        },
        {
          "id": "c4-b15",
          "text": "Le bac, en étiage, ne bougea d’abord pas. Il resta contre la cale, un long moment, dans un silence où l’on entendait les sauterelles dans les prés de la rive droite et, au loin, sur le chantier du pont, le compresseur qui s’arrêta net, comme si quelqu’un venait de comprendre. Aimé rendit du guindeau, lentement, tout ce qu’il pouvait. Il donna à la Patience l’angle le plus grand qu’elle pût prendre sans se mettre en travers. Et l’eau, qui n’avait presque plus de force, la prit quand même. Un centimètre. Puis un autre. Le bordé s’écarta de la cale, la chaîne pendit dans le vide, et le bac s’en alla, si lentement qu’on aurait pu marcher à côté, vers la rive où les morts attendaient les vivants depuis cent soixante-dix ans.",
          "mentions": [
            "le-guindeau",
            "le-pont"
          ]
        },
        {
          "id": "c4-b16",
          "text": "Ce fut la traversée la plus longue qu’il ait jamais faite. Vingt-deux minutes. Personne ne parla. La fille de Renée Combes, qui avait soixante-cinq ans, pleurait sans bruit, une main sur le toit du corbillard, et son mari regardait l’eau, et les autres regardaient l’eau aussi, ou le câble, ou leurs chaussures. Sur la rive droite, les gens des Vergnes s’étaient rassemblés à la cale, chapeau bas, et Lucien Astier était parmi eux, très droit, avec son vélo qu’il avait descendu exprès et qu’il tenait comme une canne. Sur la rive gauche, ceux qui attendaient leur tour ne bougeaient pas. Et sur le chantier, à trois cents mètres, les hommes en orange s’étaient alignés au bord du tablier, immobiles, casques à la main, et il ne sut jamais qui leur avait dit de le faire.",
          "mentions": [
            "lucien-astier"
          ]
        },
        {
          "id": "c4-b17",
          "text": "Quand la Patience toucha enfin la cale, il y eut ce silence particulier qui suit une chose accomplie. Puis la fille de Renée Combes s’approcha de lui, et il crut qu’elle allait le remercier, et il se prépara à ne pas savoir quoi répondre. Elle ne le remercia pas. Elle dit :",
          "mentions": [
            "la-patience",
            "la-cale"
          ]
        },
        {
          "id": "c4-b18",
          "text": "— Maman disait toujours qu’elle voulait passer avec vous. Pas avec le moteur.",
          "mentions": [
            "le-moteur-de-la-honte"
          ]
        },
        {
          "id": "c4-b19",
          "text": "— Il n’y a pas eu de moteur.",
          "mentions": []
        },
        {
          "id": "c4-b20",
          "text": "— Je sais. On a entendu.",
          "mentions": []
        },
        {
          "id": "c4-b21",
          "text": "Il fit quatre autres traversées, pleines, avec le moteur cette fois, parce que les vivants ont moins de patience que les morts et que le curé de Vaubrun attendait au cimetière avec sa montre. Puis il ramena tout le monde, en cinq voyages, dans la chaleur de midi, et quand le dernier fut débarqué il s’assit sur son banc et compta. Deux cent douze. Renée Combes était le deux cent douzième mort qu’il avait passé depuis 1984. Il ne dit ce chiffre à personne. Il ne l’avait jamais dit.",
          "mentions": [
            "vaubrun"
          ]
        },
        {
          "id": "c4-b22",
          "text": "Inès Marchal descendit à la cale vers une heure. Elle avait le visage de quelqu’un qui n’a pas déjeuné et qui ne le sait pas encore. Elle resta debout au bord de l’eau, à deux mètres du bac, sans monter.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c4-b23",
          "text": "— C’est vous qui avez arrêté le compresseur, dit-il.",
          "mentions": []
        },
        {
          "id": "c4-b24",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c4-b25",
          "text": "— Et les hommes sur le tablier ?",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c4-b26",
          "text": "— Non. Ça, c’est eux.",
          "mentions": []
        },
        {
          "id": "c4-b27",
          "text": "Elle regarda l’eau basse, les galets, le câble qui grinçait.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c4-b28",
          "text": "— Je ne savais pas. Pour le cimetière. Enfin, je savais, Lucien Astier me l’avait dit, mais je ne savais pas… ça.",
          "mentions": [
            "lucien-astier",
            "le-cimetiere"
          ]
        },
        {
          "id": "c4-b29",
          "text": "— Maintenant vous savez.",
          "mentions": []
        },
        {
          "id": "c4-b30",
          "text": "— Après le vingt septembre, le corbillard passera sur le pont. Trente secondes.",
          "mentions": []
        },
        {
          "id": "c4-b31",
          "text": "— C’est un bon pont.",
          "mentions": []
        },
        {
          "id": "c4-b32",
          "text": "Elle secoua la tête, pas pour le contredire.",
          "mentions": []
        },
        {
          "id": "c4-b33",
          "text": "— Combien ? dit-elle.",
          "mentions": []
        },
        {
          "id": "c4-b34",
          "text": "Il ne comprit pas tout de suite. Puis il comprit, et il fut surpris, parce que personne ne lui avait jamais posé la question, pas même son père, pas même Lucien qui écrivait tout.",
          "mentions": []
        },
        {
          "id": "c4-b35",
          "text": "— Deux cent douze.",
          "mentions": []
        },
        {
          "id": "c4-b36",
          "text": "Elle ne nota pas ce chiffre. Elle ne sortit pas son carnet. Elle resta un moment encore, puis elle dit qu’elle allait manger, et elle remonta vers la base vie, et il la regarda partir dans la lumière blanche, petite silhouette de chantier sur la rampe de béton, et il pensa que c’était une femme qui savait ce qu’elle faisait et qui commençait à se demander ce qu’elle faisait, et que les deux pouvaient durer longtemps ensemble.",
          "mentions": [
            "ines-marchal",
            "la-base-vie"
          ]
        },
        {
          "id": "c4-b37",
          "text": "L’après-midi, Tom revint. Il ne dit rien de l’enterrement ; il avait onze ans, il en avait vu deux, et il ne savait pas encore que c’était une chose dont on parlait. Il demanda le guindeau. Aimé le lui laissa, sur une traversée à vide, dans l’eau morte de quatre heures, et il s’assit sur le banc de l’avant pour regarder le garçon faire.",
          "mentions": [
            "aime-roussel",
            "tom-ferrand"
          ]
        },
        {
          "id": "c4-b38",
          "text": "Tom mit le moteur trop tôt et le coupa trop tard. Il rendit du guindeau d’un coup, et le bac partit de travers, puis il reprit d’un coup, et le bac s’arrêta net, et il regarda Aimé, et Aimé ne dit rien. Alors le garçon souffla, posa les deux mains sur la manivelle, et il recommença, lentement, en regardant la ligne de l’eau contre le bordé, cette ligne oblique, et la Patience, au bout d’un moment, se décida, et alla.",
          "mentions": [
            "la-patience",
            "le-guindeau"
          ]
        },
        {
          "id": "c4-b39",
          "text": "— Là, dit Aimé.",
          "mentions": []
        },
        {
          "id": "c4-b40",
          "text": "Il ne dit rien d’autre. Il pensait au premier lundi après le pont, au car qui passerait dessus, au garçon dedans qui regarderait peut-être par la vitre l’endroit où il n’y aurait plus de câble, et il pensait qu’il lui apprenait un geste qui ne servirait jamais à personne, et qu’il le lui apprenait quand même, et il ne trouva pas à cela de raison, sinon que le geste existait et qu’il fallait bien qu’il soit quelque part.",
          "mentions": [
            "tom-ferrand",
            "la-traille"
          ]
        },
        {
          "id": "c4-b41",
          "text": "Le soir, l’échelle marquait quarante-deux centimètres. La plus basse de l’année. Il le nota dans sa tête, avec les autres chiffres, et il alla dormir sans fermer la fenêtre, pour entendre si le câble, dans la nuit, changerait de note.",
          "mentions": [
            "letiage"
          ]
        }
      ]
    },
    {
      "id": "chapitre-5",
      "number": 5,
      "title": "La dépose",
      "blocks": [
        {
          "id": "c5-b01",
          "text": "La lettre arriva un mardi, par Inès Marchal, et non par la factrice, et c’est à cela qu’Aimé comprit avant de l’ouvrir ce qu’elle contenait. Elle descendit à la cale à sept heures du matin, une enveloppe à la main, alors qu’elle n’avait pas à traverser avant huit heures, et elle attendit qu’il ait fini de passer le boulanger. Puis elle monta à bord et la lui tendit sans rien dire, et il vit qu’elle avait préparé quelque chose à dire et y renonçait.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c5-b02",
          "text": "Elle venait du département. Direction des routes et des mobilités. L’en-tête était nouveau ; il avait vu changer l’en-tête six fois en quarante ans. « Monsieur, nous avons l’honneur de vous informer… » Il lut debout, au guindeau, la lettre dans une main, le bac amarré. Fin du service public de bac le 20 septembre à 12 heures, après le passage du cortège officiel. Résiliation de plein droit de sa vacation à cette date. Dépose du câble porteur et des deux portiques par l’entreprise titulaire du marché, semaine du 22 septembre, lot 4. Et, au troisième paragraphe, pour la barque elle-même, une phrase qu’il relut deux fois parce qu’elle était écrite dans une langue qu’il connaissait sans l’aimer : « L’embarcation, propriété du Département, sera réformée et évacuée vers une filière de déconstruction agréée, aucune conservation à flot ne pouvant être envisagée pour un ouvrage non exploité, pour des raisons de sécurité et de responsabilité. »",
          "mentions": [
            "la-depose",
            "la-patience"
          ]
        },
        {
          "id": "c5-b03",
          "text": "Il replia la lettre. Il la remit dans l’enveloppe. Il la posa sur le banc de l’avant, à l’endroit où son père faisait asseoir les vieux.",
          "mentions": [
            "la-depose"
          ]
        },
        {
          "id": "c5-b04",
          "text": "— À la ferraille, dit-il.",
          "mentions": []
        },
        {
          "id": "c5-b05",
          "text": "— Ce n’est pas le mot qu’ils emploient.",
          "mentions": []
        },
        {
          "id": "c5-b06",
          "text": "— C’est le mot.",
          "mentions": []
        },
        {
          "id": "c5-b07",
          "text": "Elle ne le contredit pas. Elle regardait le bac, pas lui, le platelage usé, les bordés repeints, le nom en lettres trop grosses.",
          "mentions": []
        },
        {
          "id": "c5-b08",
          "text": "— Le lot de dépose, c’est nous. Le câble, les portiques. Pas la barque. La barque, c’est le département qui décide.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c5-b09",
          "text": "— Et vous, vous décidez quoi ?",
          "mentions": []
        },
        {
          "id": "c5-b10",
          "text": "— Je décide de la semaine où on démonte, et de l’ordre. Je décide que ce soit propre. Je n’ai pas le pouvoir de ne pas le faire.",
          "mentions": []
        },
        {
          "id": "c5-b11",
          "text": "— Vous l’avez demandé ?",
          "mentions": []
        },
        {
          "id": "c5-b12",
          "text": "Elle ne répondit pas tout de suite, et il comprit que non, et qu’elle venait de comprendre elle aussi qu’elle ne l’avait pas demandé, et que cela la mettait en colère contre elle-même plus que contre lui.",
          "mentions": []
        },
        {
          "id": "c5-b13",
          "text": "— Monsieur Roussel, le câble est un ouvrage d’art de 1902 qui n’a plus d’usage. Personne ne l’entretiendra. Dans dix ans il tombe dans la rivière avec un enfant dessous. On ne peut pas laisser ça.",
          "mentions": [
            "aime-roussel",
            "laubrance"
          ]
        },
        {
          "id": "c5-b14",
          "text": "— Je sais.",
          "mentions": []
        },
        {
          "id": "c5-b15",
          "text": "— Alors quoi ?",
          "mentions": []
        },
        {
          "id": "c5-b16",
          "text": "Il regarda l’eau. Elle avait remonté de quinze centimètres depuis la semaine précédente ; il y avait eu de la pluie sur le plateau. Le courant portait de nouveau, un peu, et le câble chantait bas, comme au printemps.",
          "mentions": []
        },
        {
          "id": "c5-b17",
          "text": "— Quarante-deux ans, dit-il.",
          "mentions": []
        },
        {
          "id": "c5-b18",
          "text": "Ce n’était pas une réponse. Ce n’était pas non plus un reproche. C’était un chiffre, comme les autres, et il le dit du ton dont il aurait dit la hauteur d’eau. Puis il décrocha la chaîne et passa Inès Marchal sur l’autre rive, parce que c’était l’heure et que c’était son métier, et il ne lui adressa pas la parole pendant la traversée, et elle n’essaya pas. Sur la cale des Vergnes, elle descendit, se retourna, et il vit qu’elle allait encore dire quelque chose.",
          "mentions": [
            "ines-marchal",
            "les-vergnes"
          ]
        },
        {
          "id": "c5-b19",
          "text": "— Je ne suis pas d’accord avec la phrase sur la barque, dit-elle. Je voulais que vous le sachiez.",
          "mentions": []
        },
        {
          "id": "c5-b20",
          "text": "— Ce n’est pas votre phrase.",
          "mentions": []
        },
        {
          "id": "c5-b21",
          "text": "— Non. Mais je l’ai apportée.",
          "mentions": [
            "aime-roussel",
            "la-traille"
          ]
        },
        {
          "id": "c5-b22",
          "text": "Le soir, il ne vint pas au premier coup de cloche. Il l’entendit sonner à six heures et demie, trois coups, comme il fallait, et il resta assis dans la cuisine de la maison du passeur devant un verre qu’il ne buvait pas. Elle sonna de nouveau à sept heures moins le quart. Alors il se leva, parce qu’il n’avait jamais laissé quelqu’un sur une rive de sa vie, et il descendit, et il traversa, et il la trouva debout au bord de la cale des Vergnes, sans colère, qui avait attendu comme on attend un train qu’on sait en retard.",
          "mentions": [
            "la-cale",
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c5-b23",
          "text": "— Je suis désolé, dit-il.",
          "mentions": []
        },
        {
          "id": "c5-b24",
          "text": "— Non. C’est moi.",
          "mentions": []
        },
        {
          "id": "c5-b25",
          "text": "Ils traversèrent. Il ne fut pas dit un mot de plus, et ce fut, d’une manière qu’aucun des deux n’aurait su expliquer, la première traversée où ils furent d’accord.",
          "mentions": [
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c5-b26",
          "text": "Le jeudi, Lucien vint avec son vélo, son seau et ses fleurs, à sept heures, avant tout le monde. C’était son heure. Il n’y avait personne à passer, et Aimé lui fit signe de monter sans amarrer, et le vieil homme posa son vélo contre le bordé et resta debout à l’avant, comme d’habitude, la casquette à la main.",
          "mentions": [
            "aime-roussel",
            "lucien-astier"
          ]
        },
        {
          "id": "c5-b27",
          "text": "— Tu as eu la lettre, dit-il.",
          "mentions": [
            "la-depose"
          ]
        },
        {
          "id": "c5-b28",
          "text": "— Mardi.",
          "mentions": []
        },
        {
          "id": "c5-b29",
          "text": "— Nadia me l’a dit. Pas ce qu’il y a dedans. Que tu l’avais eue, et que tu n’as pas passé la dame du pont le soir, et qu’elle a sonné deux fois.",
          "mentions": [
            "nadia-ferrand",
            "le-pont"
          ]
        },
        {
          "id": "c5-b30",
          "text": "— Elle a sonné deux fois.",
          "mentions": []
        },
        {
          "id": "c5-b31",
          "text": "— C’est ce qu’on dit.",
          "mentions": []
        },
        {
          "id": "c5-b32",
          "text": "Lucien regarda la rive venir. Il avait toujours regardé la rive venir. Il était monté sur ce bac la première fois en 1971, jeune instituteur affecté à un bourg dont il ne connaissait pas le nom, avec une valise et une femme, et il avait dit à Fernand Roussel, qui tenait le guindeau ce jour-là : « C’est beau, votre machine », et Fernand avait répondu : « Ce n’est pas une machine. » Aimé avait neuf ans, il tenait la chaîne, et il se souvenait de la phrase mieux que de son propre visage à cet âge.",
          "mentions": [
            "lucien-astier",
            "fernand-roussel"
          ]
        },
        {
          "id": "c5-b33",
          "text": "— Ils veulent la mettre à la ferraille, dit Aimé. La barque.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c5-b34",
          "text": "— Je sais. Je connais leur langue. Nadia ne connaît pas la lettre mais moi, je connais la langue.",
          "mentions": [
            "la-depose",
            "nadia-ferrand"
          ]
        },
        {
          "id": "c5-b35",
          "text": "— Le câble, je comprends. Le câble, il tombe. La barque, elle ne fait rien. Elle flotte.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c5-b36",
          "text": "— Un objet qui flotte et qui ne sert à rien, pour eux, c’est un risque.",
          "mentions": []
        },
        {
          "id": "c5-b37",
          "text": "— Pour moi, c’est un bateau.",
          "mentions": []
        },
        {
          "id": "c5-b38",
          "text": "Ils se turent. La Patience prenait son angle dans l’eau remontée, avec cette légèreté retrouvée qui suivait toujours les pluies du plateau, et le vieux câble chantait sa note d’automne un mois trop tôt.",
          "mentions": [
            "la-patience"
          ]
        },
        {
          "id": "c5-b39",
          "text": "— Aimé, dit Lucien.",
          "mentions": [
            "aime-roussel",
            "lucien-astier"
          ]
        },
        {
          "id": "c5-b40",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c5-b41",
          "text": "— Quand ce sera mon tour, tu me passes.",
          "mentions": []
        },
        {
          "id": "c5-b42",
          "text": "Aimé ne répondit pas.",
          "mentions": []
        },
        {
          "id": "c5-b43",
          "text": "— Je ne suis pas malade. Je ne suis pas pressé. Mais je n’irai pas là-bas en voiture par le pont, en trente secondes, comme un colis. Ma femme a passé l’eau. Mes parents ont passé l’eau. Tout le monde ici a passé l’eau. Je veux passer l’eau. Sur celle-là.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c5-b44",
          "text": "— Elle n’y sera plus.",
          "mentions": []
        },
        {
          "id": "c5-b45",
          "text": "— Alors tu la remets à l’eau une nuit, sans le dire au département. Ou tu me portes. Je ne pèse plus rien.",
          "mentions": []
        },
        {
          "id": "c5-b46",
          "text": "C’était dit sans emphase, avec le sourire d’un homme qui a passé sa vie à formuler des choses graves pour des enfants de huit ans et qui ne sait plus faire autrement. Aimé regarda le vieil instituteur, ses ongles bordés de terre, le crayon dans sa poche, les pivoines qui étaient maintenant des dahlias parce qu’on était en août, et il pensa à toutes les choses qu’il n’avait jamais dites à personne et qui étaient dans une boîte à chaussures, dans l’armoire de la chambre du haut, sous les chemises.",
          "mentions": [
            "la-patience"
          ]
        },
        {
          "id": "c5-b47",
          "text": "— Je te passerai, dit-il.",
          "mentions": []
        },
        {
          "id": "c5-b48",
          "text": "— Bon.",
          "mentions": []
        },
        {
          "id": "c5-b49",
          "text": "Le bac toucha la cale. Lucien descendit son vélo, remit sa casquette, et s’arrêta.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c5-b50",
          "text": "— Ce n’est pas une machine, dit-il. Ton père avait raison. Je l’ai écrit dans le cahier, en 1971, le soir même. J’ai mis quarante ans à comprendre ce qu’il voulait dire. Je crois que je viens de finir.",
          "mentions": [
            "la-monographie"
          ]
        },
        {
          "id": "c5-b51",
          "text": "Il monta vers le cimetière. Aimé retraversa à vide et passa le boulanger, puis la factrice, puis la Renault des Combes, avec la fille de Renée au volant qui lui fit un signe de la main sans s’arrêter.",
          "mentions": [
            "le-cimetiere"
          ]
        },
        {
          "id": "c5-b52",
          "text": "Le soir, quand il eut passé Inès Marchal, qui lui parla du temps et à qui il parla du temps, il monta dans la chambre du haut. Il ouvrit l’armoire. Il sortit la boîte à chaussures, une boîte de chez Bata, avec un élastique cassé remplacé par une ficelle, et il l’ouvrit sur le lit. Les doubles étaient là, dans l’ordre, sur ce papier pelure bleu qu’on n’achetait plus, et le premier était daté du 11 février 1985 et portait, dans le coin en haut à droite, une écriture qu’il ne reconnaissait plus tout à fait, celle d’un garçon de vingt-trois ans qui écrivait au président du conseil général sans savoir s’il fallait mettre une majuscule à président.",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c5-b53",
          "text": "Il ne relut pas. Il referma la boîte. Il la remit sous les chemises. Puis il redescendit, et il alla s’asseoir sur le banc de l’avant de la Patience, dans le soir qui tombait, et il resta là jusqu’à ce que le câble, au-dessus de lui, cesse d’être visible et ne soit plus qu’une note.",
          "mentions": [
            "la-traille"
          ]
        }
      ]
    },
    {
      "id": "chapitre-6",
      "number": 6,
      "title": "La monographie",
      "blocks": [
        {
          "id": "c6-b01",
          "text": "Lucien Astier habitait l’ancien logement de fonction de l’école, qu’il avait racheté à la commune en 2008, le jour de sa retraite, pour ne pas avoir à déménager ses livres. C’était une maison de pierre à un étage, collée au préau, avec une cour où poussait un figuier et une porte vitrée qui donnait directement dans la salle de classe désaffectée, devenue son bureau. Inès frappa un mardi soir de la fin août, après avoir hésité trois jours, et il ouvrit comme s’il l’attendait, ce qui, elle le comprit au couvert mis pour deux, était le cas.",
          "mentions": [
            "lucien-astier",
            "lecole"
          ]
        },
        {
          "id": "c6-b02",
          "text": "— Nadia m’a dit que vous posiez des questions, dit-il. On ne pose pas des questions à Nadia. On les pose à moi. Entrez.",
          "mentions": [
            "nadia-ferrand"
          ]
        },
        {
          "id": "c6-b03",
          "text": "La salle de classe avait gardé son estrade, son tableau noir et une carte de France en toile cirée où les départements portaient encore leurs anciens noms. Le reste était des livres, par terre, sur les tables d’écolier alignées le long des murs, dans des cageots de pommes. Et, sur le bureau du maître, en pile bien droite, quatorze cahiers d’écolier à couverture bleue, numérotés au crayon de I à XIV. La monographie.",
          "mentions": [
            "la-monographie"
          ]
        },
        {
          "id": "c6-b04",
          "text": "— Ce n’est pas un livre, dit Lucien en la voyant regarder. Ce ne sera jamais un livre. C’est une monographie de commune, comme on en a demandé aux instituteurs en 1899, pour l’Exposition universelle. Tous les maîtres d’école de France ont écrit celle de leur village. Celui de Ferréol s’appelait Abel Gauthier. Il a fait trente-six pages. Je l’ai continué. J’en suis à mille deux cents et je n’ai pas fini le dix-neuvième siècle.",
          "mentions": []
        },
        {
          "id": "c6-b05",
          "text": "Il servit une soupe, du pain, un fromage de la ferme d’à côté, un vin du plateau qu’il appela « honnête », et il parla. Il parlait comme il avait dû faire la classe : par ordre, avec des dates, en s’arrêtant pour vérifier qu’on suivait, et en laissant tomber de temps en temps une phrase qui n’avait rien à faire là et qui était la seule qu’on retiendrait.",
          "mentions": []
        },
        {
          "id": "c6-b06",
          "text": "— Il y a eu un gué, d’abord. Ferréol, c’est le gué. Les Romains passaient là, ou pas, ça se dispute. Puis un pont de bois, en 1743, construit par la communauté d’habitants sur adjudication, dix-sept mètres de portée au milieu, quatre travées, un péage. Il a tenu cent treize ans. Le 2 novembre 1856, il est parti en une nuit avec le bas du village, trente-deux maisons, l’auberge, le moulin, et deux personnes qu’on n’a jamais retrouvées. La crue de 1856 est la plus grande dont on ait la trace. Il y a une plaque sur la maison du passeur : 4,85 mètres à l’échelle. Vous l’avez vue ?",
          "mentions": [
            "la-crue-de-1856"
          ]
        },
        {
          "id": "c6-b07",
          "text": "— Non.",
          "mentions": []
        },
        {
          "id": "c6-b08",
          "text": "— Aimé la repeint tous les cinq ans. Il n’en parle pas. Il n’en parle jamais, mais il la repeint.",
          "mentions": [
            "le-pont-de-bois",
            "la-crue-de-1856",
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c6-b09",
          "text": "Il essuya sa cuiller, la posa.",
          "mentions": []
        },
        {
          "id": "c6-b10",
          "text": "— Après 1856, on a reconstruit le bourg en haut, rive gauche, là où l’eau ne monte pas. Le cimetière est resté. Et on n’a jamais rebâti le pont, parce qu’un pont coûte et que le département de l’époque avait d’autres rivières. On a mis un bac à rames, tenu par les Vialatte, père et fils, jusqu’en 1902. Et en 1902, une compagnie de Lyon a vendu au conseil général une traille sur câble, système breveté, qu’on installait un peu partout à l’époque sur les rivières trop larges pour un pont et trop étroites pour qu’on s’en occupe. Deux portiques en fer, un câble, un chariot, une barque. Les Vialatte ont refusé de s’en servir. On a pris un Roussel. Léon. Le grand-père d’Aimé. En 1921.",
          "mentions": [
            "la-traille",
            "fernand-roussel"
          ]
        },
        {
          "id": "c6-b11",
          "text": "— Et depuis, ce sont eux.",
          "mentions": []
        },
        {
          "id": "c6-b12",
          "text": "— Depuis, ce sont eux. Léon jusqu’en 1946, Fernand jusqu’en 1984, Aimé depuis. Trois passeurs en cent cinq ans. Sur les mêmes cinq mètres de câble, madame Marchal. Vous imaginez ce que c’est ?",
          "mentions": [
            "aime-roussel",
            "ines-marchal"
          ]
        },
        {
          "id": "c6-b13",
          "text": "Elle imaginait. Elle avait, elle, sept chantiers en huit ans, et une voiture grise avec un logo. Elle ne le dit pas.",
          "mentions": []
        },
        {
          "id": "c6-b14",
          "text": "— Le bac, ce n’est pas seulement passer, reprit Lucien. À Ferréol, c’est la seule chose qui ait tenu les deux rives ensemble. L’école est au bourg ; les enfants des Vergnes traversent. Le cimetière est aux Vergnes ; les morts du bourg traversent. Le café est aux Vergnes ; les hommes du bourg traversent pour le tiercé. Chaque jour, cent fois, quelqu’un s’est tenu sur cette barque à côté d’un Roussel et a regardé l’autre rive venir. Ce n’est pas rien, comme lien. Le pont fera pareil, mieux, plus vite. Mais personne ne se tiendra debout à côté de personne.",
          "mentions": [
            "ferreol",
            "les-vergnes",
            "le-pont"
          ]
        },
        {
          "id": "c6-b15",
