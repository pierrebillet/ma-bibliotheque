        {
          "id": "c1-b03",
          "text": "Il fit ce qu’il faisait chaque matin. Il vérifia la tension des deux bras qui montaient du bac vers le chariot, là-haut, où les poulies mordaient le câble porteur. Il graissa l’axe du guindeau, qui n’en avait pas besoin. Il posa la main sur le câble d’amarre, sentit le courant à travers le métal, et décrocha la chaîne. La rivière, aussitôt, prit la barque de biais et la tira vers le large : il la laissa aller d’un mètre, puis rendit du guindeau, et la Patience se plaça dans l’angle qu’il lui demandait, une hanche dans le courant, l’autre à l’abri. C’était tout. On ne poussait pas, on n’avironnait pas. On donnait à l’eau un angle et l’eau faisait le reste.",
          "mentions": [
            "le-guindeau",
            "la-traille"
          ]
        },
        {
          "id": "c1-b04",
          "text": "De la rive droite, un cri lui arriva par-dessus la brume, aigu et joyeux :",
          "mentions": []
        },
        {
          "id": "c1-b05",
          "text": "— Aimé ! Tu m’attends ?",
          "mentions": []
        },
        {
          "id": "c1-b06",
          "text": "Il ne répondit pas. Il n’avait jamais répondu à cette question en quarante ans ; le bac attendait, c’était son métier, et Tom Ferrand le savait très bien. Le garçon dévalait le chemin des Vergnes avec son cartable qui battait contre ses reins, dépassa le portique de la traille, s’arrêta net au bord de la cale, comme on lui avait appris, et attendit que le bac vienne à lui. Onze ans. La dernière semaine d’école avant l’été. Il montait à bord depuis le cours préparatoire, tous les matins de classe, et il avait le regard qu’ont les enfants qui savent qu’ils vont bientôt être trop grands pour quelque chose.",
          "mentions": [
            "tom-ferrand",
            "les-vergnes"
          ]
        },
        {
          "id": "c1-b07",
          "text": "— Il a baissé, dit Tom en sautant sur le platelage sans attendre la passerelle.",
          "mentions": []
        },
        {
          "id": "c1-b08",
          "text": "— De quatre doigts.",
          "mentions": []
        },
        {
          "id": "c1-b09",
          "text": "— Tu as regardé l’échelle ?",
          "mentions": []
        },
        {
          "id": "c1-b10",
          "text": "— Pas encore.",
          "mentions": []
        },
        {
          "id": "c1-b11",
          "text": "Tom alla se pencher par-dessus le bord, en amont, là où le courant se fendait sur l’étrave, et il compta les barreaux peints sur la pile en revenant vers la rive gauche. Quatre doigts, à peu près. Il n’y avait pas de quoi être fier, et Aimé ne le fut pas. Il regarda la brume se déchirer sur le bourg, la flèche de l’église neuve prendre le soleil la première, les toits descendre vers la cale comme des marches. La traversée durait quatre minutes quand la rivière était haute, sept quand elle était basse. Ce matin-là, cinq.",
          "mentions": [
            "ferreol"
          ]
        },
        {
          "id": "c1-b12",
          "text": "Ils étaient à mi-chemin lorsqu’ils entendirent la voiture.",
          "mentions": []
        },
        {
          "id": "c1-b13",
          "text": "Elle venait par la route de Vaubrun, sur la rive droite, et elle allait trop vite pour quelqu’un qui connaissait la descente. Aimé la vit apparaître entre les chênes : une berline grise, propre, avec un logo d’entreprise sur la portière, et elle freina au dernier moment devant la barrière de la cale, comme font ceux qui découvrent qu’une route peut finir dans l’eau. La conductrice descendit. Elle regarda le bac, qui s’éloignait d’elle, puis le câble au-dessus de sa tête, puis le bac encore, et elle leva une main, pas pour appeler, pour dire qu’elle avait compris qu’il faudrait attendre.",
          "mentions": [
            "vaubrun"
          ]
        },
        {
          "id": "c1-b14",
          "text": "— C’est qui ? dit Tom.",
          "mentions": []
        },
        {
          "id": "c1-b15",
          "text": "— Quelqu’un qui n’est jamais venu.",
          "mentions": []
        },
        {
          "id": "c1-b16",
          "text": "— Comment tu le sais ?",
          "mentions": []
        },
        {
          "id": "c1-b17",
          "text": "— Elle a freiné.",
          "mentions": []
        },
        {
          "id": "c1-b18",
          "text": "Sur la rive gauche, il redressa le bac dans le courant, accosta sans bruit, mit la passerelle. Tom sauta, courut trois pas, se retourna.",
          "mentions": []
        },
        {
          "id": "c1-b19",
          "text": "— Ce soir, tu me laisses le guindeau ?",
          "mentions": []
        },
        {
          "id": "c1-b20",
          "text": "— On verra.",
          "mentions": []
        },
        {
          "id": "c1-b21",
          "text": "Le garçon partit vers l’école en faisant claquer ses semelles sur les pavés. Aimé reprit l’angle, et la Patience, docile, retraversa toute seule. Il ne pensait à rien de particulier. Il pensait à la femme qui attendait, à la voiture grise, à l’heure qu’il était, au fait que le boulanger de Vaubrun passerait à sept heures et demie avec sa camionnette et qu’il faudrait qu’elle soit de l’autre côté avant, ou qu’elle attende. Il pensait à cela avec la partie de lui qui faisait le métier, et le reste de lui regardait l’eau.",
          "mentions": [
            "lecole"
          ]
        },
        {
          "id": "c1-b22",
          "text": "Elle avait garé sa voiture au bord de la cale, moteur coupé, et elle se tenait debout à côté, le téléphone à la main, sans le regarder. Une trentaine d’années. Un pantalon de chantier propre, des chaussures de sécurité neuves, une veste légère sur un tee-shirt, les cheveux attachés vite. Il accosta, mit la passerelle, et elle s’avança sans monter.",
          "mentions": []
        },
        {
          "id": "c1-b23",
          "text": "— Bonjour. Je peux passer avec la voiture ?",
          "mentions": []
        },
        {
          "id": "c1-b24",
          "text": "— Deux à la fois. Vous êtes toute seule.",
          "mentions": []
        },
        {
          "id": "c1-b25",
          "text": "— C’est combien ?",
          "mentions": []
        },
        {
          "id": "c1-b26",
          "text": "— Rien. C’est le département qui paie.",
          "mentions": []
        },
        {
          "id": "c1-b27",
          "text": "Elle hocha la tête comme si elle savait cela et l’avait oublié. Elle remonta en voiture, la fit avancer sur la passerelle avec une prudence d’ingénieur, s’arrêta là où il lui montrait, pile sur la marque, et il cala les roues sans qu’elle ait à le demander. Puis elle descendit et vint se placer près de lui, au guindeau, ce que les gens ne faisaient jamais : les gens restaient dans leur voiture ou allaient à l’avant regarder l’eau. Elle regardait le câble.",
          "mentions": []
        },
        {
          "id": "c1-b28",
          "text": "— Il n’y a pas de moteur.",
          "mentions": []
        },
        {
          "id": "c1-b29",
          "text": "— Il y en a un. Il ne sert pas.",
          "mentions": []
        },
        {
          "id": "c1-b30",
          "text": "— Alors qu’est-ce qui…",
          "mentions": []
        },
        {
          "id": "c1-b31",
          "text": "Il décrocha la chaîne. La rivière prit le bac, il rendit du guindeau, la Patience se coucha dans l’angle et se mit en route, et il la vit comprendre. Ce n’était pas la première fois qu’il voyait quelqu’un comprendre la traille, mais c’était rare, et cela le touchait toujours au même endroit, un endroit qu’il n’aurait pas su nommer. Elle suivit du regard les deux bras qui montaient vers le chariot, les poulies qui roulaient sur le câble avec leur petit bruit de train lointain, puis la ligne de l’eau contre le bordé, cette ligne oblique qui disait tout.",
          "mentions": []
        },
        {
          "id": "c1-b32",
          "text": "— C’est le courant, dit-elle.",
          "mentions": []
        },
        {
          "id": "c1-b33",
          "text": "— C’est l’eau qui porte.",
          "mentions": []
        },
        {
          "id": "c1-b34",
          "text": "Elle ne répondit pas tout de suite. Elle sortit un carnet de sa poche de veste, un vrai carnet, avec un élastique, et elle nota quelque chose, et Aimé, qui en quarante ans avait vu passer des gens qui photographiaient, ne se souvenait pas d’avoir vu quelqu’un noter.",
          "mentions": []
        },
        {
          "id": "c1-b35",
          "text": "— Inès Marchal, dit-elle sans lever les yeux. Je suis la conductrice de travaux du pont. J’arrive ce matin.",
          "mentions": []
        },
        {
          "id": "c1-b36",
          "text": "— Je sais.",
          "mentions": []
        },
        {
          "id": "c1-b37",
          "text": "Elle leva les yeux, cette fois.",
          "mentions": []
        },
        {
          "id": "c1-b38",
          "text": "— Vous savez ?",
          "mentions": []
        },
        {
          "id": "c1-b39",
          "text": "— Une voiture grise avec un logo. Le maire a dit que vous arriveriez fin juin. Il n’y a qu’un pont.",
          "mentions": []
        },
        {
          "id": "c1-b40",
          "text": "Elle eut un demi-sourire, bref, qui ne s’adressait pas à lui.",
          "mentions": []
        },
        {
          "id": "c1-b41",
          "text": "— Je voulais me présenter avant qu’on se croise en réunion. Parce qu’on va se croiser. Je vais faire ça deux fois par jour, dit-elle, avec un mouvement du menton vers l’eau. Je loge aux Vergnes, au café. La base vie est côté bourg.",
          "mentions": []
        },
        {
          "id": "c1-b42",
          "text": "— C’est ce qu’on fait ici. On traverse.",
          "mentions": []
        },
        {
          "id": "c1-b43",
          "text": "Le bac approchait de la rive gauche. Il commençait à redresser, et la Patience perdait son biais, s’alignait, ralentissait. Il vit qu’Inès Marchal cherchait ses mots, ce qui ne lui arrivait sans doute pas souvent, et il attendit, parce qu’attendre était la chose qu’il savait le mieux faire.",
          "mentions": []
        },
        {
          "id": "c1-b44",
          "text": "— Monsieur Roussel. Je préfère vous le dire moi-même. La livraison est fixée au vingt septembre. Inauguration le matin, ouverture à la circulation l’après-midi. Et le marché comprend un lot de dépose. Le câble, les portiques. Le bac s’arrête le vingt.",
          "mentions": []
        },
        {
          "id": "c1-b45",
          "text": "Le bac toucha la cale. Il n’y eut pas de choc ; il n’y en avait jamais. Aimé passa la chaîne dans l’anneau, sortit la passerelle, ôta les cales des roues. Puis il se redressa, et il la regarda, et il vit qu’elle attendait quelque chose de lui, une colère peut-être, ou une question, et que cette attente lui coûtait.",
          "mentions": []
        },
        {
          "id": "c1-b46",
          "text": "— Bien, dit-il.",
          "mentions": []
        },
        {
          "id": "c1-b47",
          "text": "Elle cligna des yeux.",
          "mentions": []
        },
        {
          "id": "c1-b48",
          "text": "— Bien ?",
          "mentions": []
        },
        {
          "id": "c1-b49",
          "text": "— Le vingt septembre. C’est un samedi. Il n’y a pas école. Les gens viendront.",
          "mentions": []
        },
        {
          "id": "c1-b50",
          "text": "Elle remonta en voiture. Elle avança lentement sur la passerelle, s’arrêta sur la terre ferme, baissa sa vitre.",
          "mentions": []
        },
        {
          "id": "c1-b51",
          "text": "— Merci pour la traversée.",
          "mentions": []
        },
        {
          "id": "c1-b52",
          "text": "— Ce soir, six heures et demie, dit-il. Après, je ne fais plus que sur demande. Il y a une cloche.",
          "mentions": []
        },
        {
          "id": "c1-b53",
          "text": "Elle regarda la cloche, en fonte, accrochée au portique, avec sa corde qui pendait à hauteur d’homme. Elle hocha la tête, et la voiture grise monta vers le bourg, et il l’entendit longtemps parce que le matin était sans vent.",
          "mentions": [
            "ines-marchal",
            "le-pont",
            "la-depose"
          ]
        },
        {
          "id": "c1-b54",
          "text": "Il resta un moment sur la cale. Puis il fit ce qu’il faisait toujours quand il n’y avait personne à passer : il alla regarder l’échelle. Quatre doigts. Tom avait raison. Il revint au bac, s’assit sur le banc de l’avant, celui que son père avait fixé là pour les vieux et les femmes enceintes, et il regarda en aval, à trois cents mètres, l’endroit où les deux piles du pont sortaient de l’eau, avec leurs échafaudages et leur tablier presque fini qui jetait sur la rivière une ombre neuve. Il y avait des hommes, déjà, sur le tablier, petits, en orange. Il entendait leurs voix par instants. Il se demanda si, de là-haut, ils voyaient le bac, et il se dit que oui, sans doute, mais qu’ils ne le regardaient pas, parce qu’on ne regarde pas ce qu’on remplace, et il n’y trouva rien à redire.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c1-b55",
          "text": "Le boulanger arriva à sept heures vingt-huit. Aimé le passa. Puis il passa la Renault des Combes, puis la factrice, puis personne pendant une heure, et le soleil monta au-dessus des chênes de la rive droite, et le câble, à mesure qu’il chauffait, changea de note.",
          "mentions": []
        }
      ]
    },
    {
      "id": "chapitre-2",
      "number": 2,
      "title": "L’eau qui porte",
      "blocks": [
        {
          "id": "c2-b01",
          "text": "Inès Marchal avait appris à arriver. C’était un savoir-faire, comme un autre, qu’on n’enseignait pas à l’école d’ingénieurs et qu’elle avait acquis chantier après chantier, sept en huit ans : on arrive un matin, on trouve la clé de la base vie sous le pot qu’on vous a indiqué, on branche la bouilloire, on ouvre le dossier, on apprend les prénoms des compagnons avant le déjeuner et on ne fait aucune promesse avant le vendredi. Elle savait aussi partir, ce qui était plus rare. Ce qu’elle ne savait pas, découvrit-elle la première semaine, c’était dépendre d’une cloche.",
          "mentions": [
            "ines-marchal",
            "la-base-vie"
          ]
        },
        {
          "id": "c2-b02",
          "text": "La base vie était un assemblage de trois bungalows posés sur le pré communal, à cent mètres de la cale, côté bourg. De la fenêtre du bureau, en se penchant, elle voyait le bac. Elle ne se pencha pas, les premiers jours. Elle lut. Le dossier du pont de Ferréol faisait quatre classeurs et deux disques durs, et elle le prit dans l’ordre, parce qu’elle avait appris cela aussi : un chantier qu’on reprend à quatre-vingt-dix pour cent est un chantier dont on hérite les silences. Elle chercha les silences. Elle trouva un ouvrage sobre, deux piles en rivière, trois travées, quatre-vingt-seize mètres de tablier, un béton bien mené par son prédécesseur, qui était parti diriger un viaduc en Savoie et lui avait laissé un mot de deux lignes. Elle trouva les finitions à conduire — garde-corps, joints de chaussée, enrobés, épreuves de charge — et, à la fin du quatrième classeur, le lot 4, dépose de la traille et de ses portiques, quinze pages, un planning de trois jours, la semaine du vingt-deux septembre.",
          "mentions": [
            "le-pont",
            "la-depose"
          ]
        },
        {
          "id": "c2-b03",
          "text": "Elle referma le classeur et resta la main dessus.",
          "mentions": []
        },
        {
          "id": "c2-b04",
          "text": "Puis elle traversa, à six heures et demie, comme il l’avait dit. Il l’attendait. Il attendait sans doute tout le monde de la même façon, assis sur le banc de l’avant, les avant-bras sur les cuisses, et il se levait quand la voiture apparaissait, pas avant. Elle avait décidé de laisser la voiture au bourg et de traverser à pied : le café des Vergnes était à deux cents mètres de la cale, elle n’avait besoin de rien d’autre, et il lui semblait, sans qu’elle se l’explique, qu’on ne pouvait pas faire monter une berline d’entreprise deux fois par jour sur un bateau qu’on allait démonter.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c2-b05",
          "text": "Le troisième soir, elle lui posa la question qu’elle retenait depuis le premier matin.",
          "mentions": []
        },
        {
          "id": "c2-b06",
          "text": "— Comment vous faites pour l’angle ?",
          "mentions": []
        },
        {
          "id": "c2-b07",
          "text": "Il la regarda comme on regarde une réponse et non une question. Puis il posa la main sur le tambour du guindeau, un cylindre de fonte gros comme un tronc, autour duquel les deux bras du bac venaient s’enrouler et se dérouler.",
          "mentions": []
        },
        {
          "id": "c2-b08",
          "text": "— Là. Je rends d’un côté, je reprends de l’autre. Ça déplace le point où le bac est pendu. Si le point est en amont, le bac se couche dans le courant et le courant le pousse. Si le point est au milieu, il s’arrête.",
          "mentions": []
        },
        {
          "id": "c2-b09",
          "text": "— Et pour revenir ?",
          "mentions": []
        },
        {
          "id": "c2-b10",
          "text": "— L’autre côté.",
          "mentions": []
        },
        {
          "id": "c2-b11",
          "text": "Elle regarda les deux bras monter en oblique vers le chariot, huit mètres au-dessus de l’eau, et le chariot rouler lentement sur le câble porteur avec ce bruit de train qu’elle commençait à attendre le soir comme d’autres attendent une voix. Elle fit le calcul sans le vouloir. Cent dix mètres de portée d’un portique à l’autre. Une flèche de trois mètres, peut-être un peu plus. Le poids du bac chargé, la composante du courant, le renvoi d’angle. C’était une machine simple, une machine de quatre pièces, et elle marchait depuis 1902 sur la seule force d’une rivière qui ne demandait rien.",
          "mentions": [
            "le-guindeau",
            "la-traille"
          ]
        },
        {
          "id": "c2-b12",
          "text": "— Et quand il n’y a pas de courant ?",
          "mentions": []
        },
        {
          "id": "c2-b13",
          "text": "— Il y a toujours du courant. Sauf en août.",
          "mentions": []
        },
        {
          "id": "c2-b14",
          "text": "— Alors ?",
          "mentions": []
        },
        {
          "id": "c2-b15",
          "text": "Il indiqua du menton, à l’arrière, sous une bâche verte, une forme qu’elle avait prise pour un coffre. Un moteur hors-bord, de taille modeste, dont le capot avait pâli.",
          "mentions": []
        },
        {
          "id": "c2-b16",
          "text": "— Ça. Mon père l’appelait le moteur de la honte. Il ne l’a jamais mis en marche. Moi, je m’en sers trois semaines par an.",
          "mentions": []
        },
        {
          "id": "c2-b17",
          "text": "— Vous n’avez pas honte ?",
          "mentions": []
        },
        {
          "id": "c2-b18",
          "text": "— Si. Mais je passe les gens.",
          "mentions": []
        },
        {
          "id": "c2-b19",
          "text": "Elle rit, brièvement, et il ne rit pas, mais quelque chose dans sa façon de tenir le guindeau se détendit, et elle comprit qu’il avait fait une plaisanterie et qu’il la faisait sans doute depuis vingt ans à qui posait la question.",
          "mentions": [
            "le-moteur-de-la-honte",
            "fernand-roussel"
          ]
        },
        {
          "id": "c2-b20",
          "text": "Le lendemain matin, en traversant dans l’autre sens, elle prit son carnet et nota : « Traille de Ferréol. 1902. Câble porteur, chariot à deux poulies, deux bras réglés au guindeau. Aucun moteur en service normal. À documenter avant dépose : photos, relevés, témoignage du passeur. » Elle souligna « témoignage » et se demanda ce qu’elle entendait par là.",
          "mentions": []
        },
        {
          "id": "c2-b21",
          "text": "C’était un jeudi. Il y avait quelqu’un d’autre sur le bac ce matin-là, un vieil homme très droit avec un vélo de dame noir, chargé sur le porte-bagages d’un seau, d’une brosse et d’un bouquet de pivoines fatiguées enveloppé dans du papier journal. Il s’était installé debout à l’avant, une main sur le guidon, l’autre sur le plat-bord, et il regardait la rive droite venir avec l’attention de quelqu’un qui compte les secondes sans en avoir l’air.",
          "mentions": []
        },
        {
          "id": "c2-b22",
          "text": "— Lucien Astier, dit-il quand elle le salua, en ôtant une casquette qui n’était pas une casquette d’agriculteur. J’ai été l’instituteur d’ici. Vous êtes la dame du pont.",
          "mentions": []
        },
        {
          "id": "c2-b23",
          "text": "— Inès Marchal.",
          "mentions": []
        },
        {
          "id": "c2-b24",
          "text": "— Je sais. Tout le monde sait. Vous logez chez Nadia, vous laissez votre voiture au bourg, vous notez des choses. Ici, on n’a pas besoin de journal.",
          "mentions": []
        },
        {
          "id": "c2-b25",
          "text": "Il souriait sans malice. Elle remarqua que ses ongles étaient bordés de terre et qu’il avait, dans la poche de poitrine de sa veste, un crayon de menuisier taillé au couteau.",
          "mentions": []
        },
        {
          "id": "c2-b26",
          "text": "— Vous allez au cimetière, dit-elle, à cause du seau.",
          "mentions": []
        },
        {
          "id": "c2-b27",
          "text": "— Tous les jeudis. Ma femme est là-bas depuis sept ans. Le cimetière est resté de l’autre côté quand le bourg a traversé. Vous devez savoir cela, c’est dans votre dossier, en principe. Ou alors ce n’est pas dans votre dossier et il faudra que je vous le raconte.",
          "mentions": []
        },
        {
          "id": "c2-b28",
          "text": "— Le bourg a traversé ?",
          "mentions": []
        },
        {
          "id": "c2-b29",
          "text": "— En 1856. Il y avait un pont, avant. En bois. La crue l’a emporté, avec le bas du village. On a rebâti en haut, de l’autre côté, sur la rive qui ne monte pas. Les morts sont restés où ils étaient. C’est comme ça que Ferréol s’est trouvé à devoir passer l’eau pour aller les voir. Depuis cent soixante-dix ans, madame, les vivants de cette commune traversent pour aller aux morts. Votre pont va changer ça aussi. Ce n’est pas un reproche.",
          "mentions": [
            "lucien-astier",
            "le-cimetiere",
            "le-pont-de-bois"
          ]
        },
        {
          "id": "c2-b30",
          "text": "Elle ne trouva rien à répondre. Le bac approchait. Aimé, au guindeau, n’avait pas l’air d’écouter et écoutait tout.",
          "mentions": []
        },
        {
          "id": "c2-b31",
          "text": "— J’écris la monographie de la commune, ajouta Lucien Astier en remettant sa casquette. Depuis ma retraite. Il y a des choses que je ne sais pas et que je n’aurai jamais le temps de savoir. Mais il y a des choses que je sais et qu’il faut que quelqu’un écrive avant la fin de l’été, parce que le vingt septembre, une partie de ce que je sais deviendra faux.",
          "mentions": []
        },
        {
          "id": "c2-b32",
          "text": "Il descendit avec son vélo, la remercia d’un signe de tête, et prit le chemin qui montait vers le vieux cimetière à travers les prés.",
          "mentions": [
            "la-monographie"
          ]
        },
        {
          "id": "c2-b33",
          "text": "Ce même jour, elle rencontra le maire. Bernard Quéré était éleveur, cinquante-huit ans, un homme large qui parlait vite et regardait sa montre en s’excusant de la regarder. Il la reçut dans la salle du conseil, sous une carte du cadastre où l’Aubrance était un ruban bleu pâle qui coupait la commune en deux parts inégales, et il ne perdit pas de temps.",
          "mentions": []
        },
        {
          "id": "c2-b34",
          "text": "— Le vingt septembre, ça tient ?",
          "mentions": []
        },
        {
          "id": "c2-b35",
          "text": "— Ça tient. Les enrobés la première semaine de septembre, les épreuves de charge le douze, la commission de sécurité le seize.",
          "mentions": []
        },
        {
          "id": "c2-b36",
          "text": "— Bien. Parce que j’ai le sous-préfet, le conseiller départemental, la fanfare de Vaubrun et trois cents personnes. Et il faut que le car de ramassage passe le vingt-deux au matin sur le pont, pas sur le bac. La rentrée du collège, madame Marchal. Il y a onze gamins des Vergnes qui prennent le car à Vaubrun. Depuis toujours, ils traversent d’abord. Depuis toujours, quand la rivière est trop haute, ils ne vont pas en classe. Ça, c’est fini.",
          "mentions": []
        },
        {
          "id": "c2-b37",
          "text": "— Je comprends.",
          "mentions": []
        },
        {
          "id": "c2-b38",
          "text": "— Non, dit-il, sans agressivité. Vous ne comprenez pas encore. Mais vous êtes ici pour ça.",
          "mentions": []
        },
        {
          "id": "c2-b39",
          "text": "Il lui serra la main et la raccompagna jusqu’au perron. En bas, entre les toits, on voyait la cale et le bac qui revenait à vide de la rive droite, tout seul, incliné dans le courant comme un oiseau qui se laisse porter par le vent.",
          "mentions": []
        },
        {
          "id": "c2-b40",
          "text": "— Il ne vous a rien dit ? demanda Quéré.",
          "mentions": []
        },
        {
          "id": "c2-b41",
          "text": "— Monsieur Roussel ? Il a dit : bien.",
          "mentions": []
        },
        {
          "id": "c2-b42",
          "text": "Le maire hocha la tête plusieurs fois.",
          "mentions": []
        },
        {
          "id": "c2-b43",
          "text": "— C’est ce qu’il dit.",
          "mentions": [
            "bernard-quere",
            "ferreol",
            "laubrance"
          ]
        },
        {
          "id": "c2-b44",
          "text": "Le soir, elle s’arrêta au milieu de la traversée pour regarder le pont. C’était la première fois qu’elle le voyait de l’eau, à hauteur de la rivière, et non du tablier ou de la rive. Il était beau. Elle n’avait pas de fausse pudeur là-dessus : elle aimait les ouvrages, c’était pour cela qu’elle faisait ce métier, et celui-là était bien proportionné, avec ses deux piles fuselées qui fendaient le courant et son tablier mince qui semblait tenir tout seul. Dans trois mois, des enfants le traverseraient en car sans le regarder, ce qui était le plus grand compliment qu’on puisse faire à un pont.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c2-b45",
          "text": "— Vous l’aimez, dit Aimé derrière elle. Ce n’était pas une question.",
          "mentions": []
        },
        {
          "id": "c2-b46",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c2-b47",
          "text": "— Il est bien fait ?",
          "mentions": []
        },
        {
          "id": "c2-b48",
          "text": "— Il est bien fait.",
          "mentions": []
        },
        {
          "id": "c2-b49",
          "text": "— Tant mieux.",
          "mentions": []
        },
        {
          "id": "c2-b50",
          "text": "Il redressa le bac. Elle sentit l’angle se défaire sous ses pieds, cette petite perte de portance qui annonçait la rive, et elle se rendit compte qu’elle l’avait sentie avant de la comprendre, comme on sent un ascenseur qui ralentit. Elle nota cela aussi, plus tard, dans sa chambre au-dessus du café, avec le bruit des verres en bas et celui de la rivière derrière : « Le corps apprend l’angle avant l’esprit. » Puis elle rangea le carnet et regarda longtemps, par la fenêtre ouverte, le câble qui luisait au-dessus de l’eau noire, tendu d’une rive à l’autre comme une phrase qu’on n’a pas finie.",
          "mentions": [

          ]
        }

    {
      "id": "chapitre-3",
      "number": 3,
      "title": "Les Vergnes",
      "blocks": [
        {
          "id": "c3-b01",
          "text": "Le café des Vergnes s’appelait Chez Ferrand depuis trois générations et ne s’était jamais appelé autrement, même quand une brasserie de Vaubrun avait offert une enseigne lumineuse en échange d’un contrat d’exclusivité. La mère de Nadia avait dit non, et Nadia avait gardé le non avec le reste : le comptoir en zinc, le rayon d’épicerie qui tenait sur deux étagères et un congélateur, le dépôt de pain, la Française des jeux, le tableau des matchs du dimanche, et l’habitude de savoir avant les gens ce dont ils avaient besoin.",
          "mentions": [
            "chez-ferrand",
            "nadia-ferrand",
            "les-vergnes"
          ]
        },
        {
          "id": "c3-b02",
          "text": "— Vous ne prenez jamais de sucre, dit-elle à Inès la deuxième semaine en posant le café sur le comptoir. Et vous lisez le journal en commençant par la fin.",
          "mentions": []
        },
        {
          "id": "c3-b03",
          "text": "— Je regarde la météo.",
          "mentions": []
        },
        {
          "id": "c3-b04",
          "text": "— C’est ce que je dis. Vous êtes du bâtiment.",
          "mentions": []
        },
        {
          "id": "c3-b05",
          "text": "Elle avait quarante-quatre ans, des bras solides et des yeux qui ne cillaient pas. Elle avait repris le café à la mort de sa mère, douze ans plus tôt, après avoir travaillé à Vaubrun dans une agence d’assurances dont elle ne parlait jamais, et elle élevait Tom seule depuis que le père du garçon était parti conduire des camions frigorifiques entre l’Espagne et la Belgique. Elle ne parlait pas de cela non plus. Elle parlait de la rivière, du prix du gasoil, des vaches de Quéré, et du pont, avec une neutralité de commerçante qui n’excluait rien.",
          "mentions": []
        },
        {
          "id": "c3-b06",
          "text": "— Ça va vous changer, dit Inès.",
          "mentions": []
        },
        {
          "id": "c3-b07",
          "text": "— Ça va tout changer. Les gens de Vaubrun viendront le dimanche voir le pont, ils s’arrêteront boire un verre, et puis ils passeront de l’autre côté sans s’arrêter. Les gens d’ici iront faire leurs courses au bourg en trois minutes au lieu de prendre le bac. Je perds le pain, je gagne les touristes. On verra le compte en décembre.",
          "mentions": []
        },
        {
          "id": "c3-b08",
          "text": "— Vous êtes pour ou contre ?",
          "mentions": []
        },
        {
          "id": "c3-b09",
          "text": "Nadia rinça un verre, le retourna sur l’égouttoir, la regarda.",
          "mentions": []
        },
        {
          "id": "c3-b10",
          "text": "— Ma fille, il y a un pont. On n’est plus au temps où on était pour ou contre.",
          "mentions": [
            "vaubrun"
          ]
        },
        {
          "id": "c3-b11",
          "text": "Tom entra à ce moment-là, en tenue de vacances, c’est-à-dire pieds nus dans des sandales et le visage déjà brun, et il annonça qu’Aimé lui avait laissé le guindeau sur la moitié de la traversée du matin, celle d’aller, où il n’y avait personne, et qu’il n’avait pas dérivé de plus d’un mètre à l’accostage.",
          "mentions": []
        },
        {
          "id": "c3-b12",
          "text": "— Un mètre, dit sa mère. Tu as pris la rive ?",
          "mentions": []
        },
        {
          "id": "c3-b13",
          "text": "— Non. Le bac.",
          "mentions": []
        },
        {
          "id": "c3-b14",
          "text": "— Alors c’est un mètre de trop.",
          "mentions": []
        },
        {
          "id": "c3-b15",
          "text": "Le garçon se tourna vers Inès pour trouver une alliée et n’en trouva pas ; elle avait déjà, elle aussi, appris à ne pas prendre parti dans les histoires d’angle. Il repartit en courant vers la cale, où Aimé, pensa-t-elle, l’attendait sans le lui dire, assis sur son banc, et elle se demanda ce qu’un enfant de onze ans faisait d’un savoir qui n’aurait plus d’usage le jour de sa rentrée en sixième.",
          "mentions": [
            "tom-ferrand",
            "aime-roussel"
          ]
        },
        {
          "id": "c3-b16",
          "text": "Les Vergnes se composaient de douze fermes, dont quatre encore en activité, d’une chapelle fermée, du café, d’une ancienne école transformée en gîte, et du vieux cimetière avec, à côté, les murs sans toit de l’église Saint-Ferréol d’avant 1856. Inès y monta un dimanche, seule, parce qu’il faisait beau et qu’elle voulait voir de là-haut la commune entière. Le chemin traversait des prés secs où des vaches la regardèrent passer sans intérêt. Le cimetière était petit, bien tenu, entouré d’un mur de pierre sèche que quelqu’un réparait par tronçons : on voyait la couleur plus claire des pierres remaniées. Elle trouva la tombe d’Odile Astier sans la chercher, parce que c’était la seule avec des pivoines fraîches. Institutrice, 1949-2019. Et dessous, gravé d’avance, Lucien Astier, 1947-, avec le tiret qui attendait.",
          "mentions": [
            "le-cimetiere",
            "odile-astier"
          ]
        },
        {
          "id": "c3-b17",
          "text": "De là, on voyait tout. L’Aubrance décrivait une courbe lente, vert sombre sous les frênes, plus claire au milieu où le courant portait. Le bourg s’étageait en face, avec l’église neuve, la mairie à fronton, les toits d’ardoise, et, tout en bas, la cale et la maison du passeur dont la cheminée fumait, en plein juillet, parce qu’Aimé Roussel cuisinait au bois. Le câble de la traille était un trait de crayon au-dessus de l’eau. Le pont, en aval, était un trait plus large, gris, avec ses grues, et de cette hauteur les deux traits se ressemblaient d’une façon qu’elle n’aurait pas su expliquer à quelqu’un qui n’aurait pas été du métier. Deux lignes tendues d’une rive à l’autre. L’une avait cent vingt-quatre ans. L’autre trois.",
          "mentions": [
            "laubrance",
            "ferreol",
            "la-maison-du-passeur",
            "le-pont",
            "la-traille"
          ]
        },
        {
          "id": "c3-b18",
          "text": "Le quatorze juillet, la fête se tenait aux Vergnes, comme toutes les années impaires : c’était une convention ancienne dont personne ne connaissait plus l’origine et que Lucien Astier, qu’elle interrogea, fit remonter à une querelle de conseil municipal de 1923. On dressait des tables sous les tilleuls devant le café, la fanfare de Vaubrun venait en camionnette par la route, et le feu d’artifice se tirait depuis la rive gauche, du pré communal, pour que les deux rives le voient de face. Le bac passait les gens du bourg à partir de six heures du soir, par douzaines, en robe et en chemise repassée, et Aimé faisait la traversée en huit minutes au lieu de cinq parce que l’eau était basse et le bac lourd.",
          "mentions": []
        },
        {
          "id": "c3-b19",
          "text": "Inès aida Nadia au comptoir, sans qu’on lui ait demandé, parce qu’il lui parut impossible de rester assise. Elle servit des bières et des sirops, coupa des tartes, apprit les prénoms. Elle vit Bernard Quéré en chemise blanche serrer des mains avec la conviction d’un homme qui a un pont à inaugurer dans deux mois. Elle vit Lucien Astier assis un peu à l’écart sous le dernier tilleul, un verre de vin devant lui, qui écrivait au crayon dans un cahier d’écolier, relevait la tête, regardait quelqu’un, écrivait de nouveau. Elle vit Tom et trois autres enfants courir vers la cale à chaque fois que le câble chantait, pour être les premiers à voir qui arrivait.",
          "mentions": [
            "bernard-quere",
            "lucien-astier"
          ]
        },
        {
          "id": "c3-b20",
          "text": "À la nuit, quand les fusées montèrent de l’autre rive et que leur reflet se cassa dans le courant, elle se trouva à côté d’un vieil agriculteur qui lui expliqua sans qu’elle le lui demande qu’en 1985, il avait fallu annuler la fête parce que le bac ne pouvait pas passer, à cause de la crue de février qui avait abîmé le portique, et qu’on l’avait réparé en août seulement.",
          "mentions": []
        },
        {
          "id": "c3-b21",
          "text": "— En février ? La fête est en juillet.",
          "mentions": []
        },
        {
          "id": "c3-b22",
          "text": "— Oui, mais on a eu peur. Et puis il y avait eu l’histoire de la petite. On n’avait pas le cœur.",
          "mentions": []
        },
        {
          "id": "c3-b23",
          "text": "— Quelle petite ?",
          "mentions": []
        },
        {
          "id": "c3-b24",
          "text": "Il fit un geste vague vers le café, vers la nuit, vers quarante ans plus tôt, et une fusée dorée éclata qui fit lever toutes les têtes, et il ne répondit pas, ou elle n’entendit pas.",
          "mentions": [
            "la-crue"
          ]
        },
        {
          "id": "c3-b25",
          "text": "Plus tard, alors qu’on rangeait les tréteaux et que le bac faisait ses dernières traversées pleines de gens qui chantaient faux, elle se retrouva près de Quéré, un plateau de verres dans les mains.",
          "mentions": []
        },
        {
          "id": "c3-b26",
          "text": "— Ça a été long, ce pont, dit-elle. Quarante ans de dossier. J’ai vu les dates dans le classeur.",
          "mentions": []
        },
        {
          "id": "c3-b27",
          "text": "— Quarante et un.",
          "mentions": []
        },
        {
          "id": "c3-b28",
          "text": "— Comment ça se passe, un dossier qui dure quarante et un ans ? Qui le porte ?",
          "mentions": []
        },
        {
          "id": "c3-b29",
          "text": "Le maire posa sur elle un regard qui hésita, une seconde, entre deux réponses.",
          "mentions": []
        },
        {
          "id": "c3-b30",
          "text": "— Le département, en fin de compte. La programmation routière. Le collège de Vaubrun, qui a menacé de ne plus prendre les gamins des Vergnes si on ne garantissait pas leur présence en classe l’hiver. Ça, c’est ce qui a fait basculer, en 2023.",
          "mentions": []
        },
        {
          "id": "c3-b31",
          "text": "— Et avant ?",
          "mentions": []
        },
        {
          "id": "c3-b32",
          "text": "— Avant, il y en a un qui a écrit. Pendant quarante ans. Tous les ans, une lettre au conseil général, puis au conseil départemental quand ça a changé de nom. Toujours la même demande. Ils l’ont mise dans le dossier quand ils ont enfin monté le projet, en préambule. Trente-neuf lettres. Vous ne les avez pas vues ?",
          "mentions": []
        },
        {
          "id": "c3-b33",
          "text": "— Elles doivent être dans les archives du maître d’ouvrage. Je n’ai que le dossier d’exécution.",
          "mentions": []
        },
        {
          "id": "c3-b34",
          "text": "— Elles y sont. Vous devriez les lire.",
          "mentions": []
        },
        {
          "id": "c3-b35",
          "text": "— Qui ?",
          "mentions": []
        },
        {
          "id": "c3-b36",
          "text": "Quéré regarda vers le tilleul du fond, où Lucien Astier rangeait son cahier dans une musette, et Inès suivit son regard, et le maire ne dit ni oui ni non. Il prit le plateau de ses mains.",
          "mentions": []
        },
        {
          "id": "c3-b37",
          "text": "— Il y a des choses, ici, qu’on laisse dire aux gens eux-mêmes. Bonne nuit, madame Marchal. Belle fête.",
          "mentions": [
            "les-trente-neuf-lettres",
            "bernard-quere"
          ]
        },
        {
          "id": "c3-b38",
          "text": "Elle traversa avec les derniers, à une heure du matin. L’eau était noire et lisse, la rive gauche encore piquée de lampes, et le bac allait sans bruit dans son angle, chargé de gens fatigués qui ne parlaient plus. Aimé Roussel tenait le guindeau sans le regarder. Elle s’approcha de lui, ce qu’elle n’avait pas fait de la soirée.",
          "mentions": []
        },
        {
          "id": "c3-b39",
          "text": "— Vous n’êtes pas venu à la fête.",
          "mentions": []
        },
        {
          "id": "c3-b40",
          "text": "— J’ai passé la fête. Quatre cent douze personnes, aller et retour. C’est ma façon d’y aller.",
          "mentions": []
        },
        {
          "id": "c3-b41",
          "text": "— Vous comptez ?",
          "mentions": []
        },
        {
          "id": "c3-b42",
          "text": "— Toujours.",
          "mentions": []
        },
        {
          "id": "c3-b43",
          "text": "Elle songea à l’instituteur qui écrivait sous le tilleul, à ses trente-neuf lettres, à cette obstination de quarante ans qu’elle croyait maintenant comprendre, et elle se dit que ce village avait au moins deux hommes qui comptaient tout, et qu’ils ne comptaient pas la même chose. Elle se trompait. Elle ne le saurait que plus tard, et elle penserait alors à ce moment précis, à l’eau noire, au câble qui chantait bas au-dessus d’eux, et à la façon dont Aimé avait dit « toujours », comme on referme une porte.",
          "mentions": [

        }

<script>
const book=JSON.parse(document.getElementById("book-data").textContent);
const SLUG=book.meta.slug;
const KEY=SLUG+"-state-v1";
const saved=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch{return {}}})();
const state={theme:saved.theme||((matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light"),scale:saved.scale||1,chapter:saved.chapter||book.chapters[0].id,seen:saved.seen||{},unlocked:new Set(saved.unlocked||[])};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>{const d=document.createElement("div");d.textContent=s??"";return d.innerHTML};
const escA=s=>esc(s).replace(/"/g,"&quot;");
const safeHttpUrl=u=>{try{const x=new URL(u);return(x.protocol==="http:"||x.protocol==="https:")?x.href:null}catch{return null}};
const localImagePath=p=>typeof p==="string"&&p&&!p.includes("://")&&!p.startsWith("/")&&!p.includes("..");
const num=v=>(typeof v==="number"&&isFinite(v))?v:null;
const svgViewBox=v=>(typeof v==="string"&&/^-?\d+(?:\.\d+)?(?:\s+-?\d+(?:\.\d+)?){3}$/.test(v.trim()))?v.trim():"0 0 100 72";
const SHAPE_KINDS=["eau","terre","route","limite"];
const pathD=v=>(typeof v==="string"&&v.length<=4000&&/^[-0-9.,\sMmLlHhVvCcSsQqTtAaZz]+$/.test(v))?v.trim():null;
const sourceHtml=s=>{if(!s||!s.label)return"";const u=safeHttpUrl(s.url);return "Source : "+(u?'<a href="'+escA(u)+'" target="_blank" rel="noopener noreferrer">'+esc(s.label)+"</a>":esc(s.label))};
const persist=()=>localStorage.setItem(KEY,JSON.stringify({theme:state.theme,scale:state.scale,chapter:state.chapter,seen:state.seen,unlocked:[...state.unlocked]}));
const entry=id=>book.codex.find(x=>x.id===id);
let lastFocus=null,observer=null;
function blockLocation(id){for(const c of book.chapters){const i=c.blocks.findIndex(b=>b.id===id);if(i>=0)return{chapter:c,position:i+1}}return null}
function blockReached(id){const loc=blockLocation(id);return !!loc&&((state.seen[loc.chapter.number]||0)>=loc.position)}
function reached(x){return blockReached(x.unlockBlock)}
const mapPlaces=()=>((book.map&&book.map.places)||[]).filter(p=>entry(p.codexId)&&num(p.x)!==null&&num(p.y)!==null);
const relNodes=()=>((book.relations&&book.relations.nodes)||[]).filter(n=>entry(n.codexId));
const hasMap=()=>mapPlaces().length>0,hasRelations=()=>relNodes().length>0;
const nodeTitle=(holder,id)=>holder&&holder.label?holder.label:(entry(id)?entry(id).title:id);
function wireOpeners(root){$$("[data-open-entry]",root).forEach(el=>{const id=el.dataset.openEntry;el.onclick=()=>openEntry(id);el.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openEntry(id)}}})}
function refreshRefs(){$$("[data-entry]").forEach(b=>{const x=entry(b.dataset.entry);if(!x){b.remove();return}const open=state.unlocked.has(x.id);b.disabled=!open;b.className=open?"ref":"ref locked-ref";b.textContent=open?x.title:"Notice à venir"})}
function syncUnlocks(announce=false){for(const x of book.codex){if(reached(x)&&!state.unlocked.has(x.id)){state.unlocked.add(x.id);if(announce){$("#announcer").textContent="Nouvelle notice débloquée : "+x.title;const t=$("#toast");t.textContent="Codex débloqué · "+x.title;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3000)}}}refreshRefs();persist()}
function applyPrefs(){document.documentElement.dataset.theme=state.theme;document.documentElement.style.setProperty("--scale",state.scale);$("#theme").setAttribute("aria-pressed",state.theme==="dark");$("#theme").textContent=state.theme==="dark"?"☀":"◐"}
function show(id){$$(".view").forEach(v=>v.hidden=v.id!==id);scrollTo(0,0)}
function go(hash){if(location.hash===hash)route();else location.hash=hash}
function route(){const raw=decodeURIComponent(location.hash.slice(1));if(!raw){show("home");return}const [kind,id,block]=raw.split("/");if(kind==="chapter"&&book.chapters.some(c=>c.id===id)){renderChapter(id,block);return}if(kind==="codex"){renderCodex($("#search").value);show("codex");if(id)requestAnimationFrame(()=>openEntry(id));return}if(kind==="map"&&hasMap()){renderMap();show("map");return}if(kind==="relations"&&hasRelations()){renderRelations();show("relations");return}show("home")}
function renderHome(){$("#brand").textContent=book.meta.title;$("#home-title").textContent=book.meta.title;$("#home-deck").textContent=book.meta.description;$("#home-eyebrow").textContent=(book.meta.edition?book.meta.edition+" · ":"")+book.chapters.length+" chapitres";$("#codex-eyebrow").textContent=book.meta.codexLabel||"Codex";$("#codex-intro").textContent=book.meta.codexVoice||"";const ci=$("#cover-img");if(book.cover?.image){ci.src=book.cover.image;ci.alt=book.cover.alt||"";ci.onerror=()=>{ci.hidden=true}}else{ci.hidden=true}}
function renderToc(){const n=$("#toc-list");n.innerHTML=book.chapters.map(c=>'<button data-go="'+c.id+'">Chapitre '+c.number+'<br><strong>'+esc(c.title)+'</strong></button>').join("");$$("[data-go]",n).forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.go))}
function setSeen(chapter,position){state.seen[chapter.number]=Math.max(state.seen[chapter.number]||0,position);state.chapter=chapter.id;syncUnlocks(true);updateProgress()}
function updateProgress(){const total=book.chapters.reduce((n,c)=>n+c.blocks.length,0);let done=0;for(const c of book.chapters)done+=Math.min(c.blocks.length,state.seen[c.number]||0);const pct=Math.round(done/total*100);$("#bar").style.width=pct+"%";$("#progress").setAttribute("aria-valuenow",pct)}
function refs(block){const ids=(block.mentions||[]).filter(id=>entry(id));if(!ids.length)return"";return '<div class="references" aria-label="Références contextuelles">'+ids.map(id=>{const open=state.unlocked.has(id);return '<button class="'+(open?'ref':'ref locked-ref')+'" data-entry="'+id+'"'+(open?'':' disabled')+'>'+(open?esc(entry(id).title):'Notice à venir')+'</button>'}).join("")+'</div>'}
function figureHtml(block){const f=block.figure;if(!f||!localImagePath(f.image)||!f.alt||!f.caption)return"";const dims=(f.imageWidth&&f.imageHeight)?' width="'+(+f.imageWidth)+'" height="'+(+f.imageHeight)+'"':"";const src=sourceHtml(f.source);return '<figure class="doc-figure"><button data-zoom="'+escA(f.image)+'" aria-label="Agrandir le document"><img src="'+escA(f.image)+'" alt="'+escA(f.alt)+'"'+dims+' loading="lazy"></button><figcaption><span class="doc-caption">'+esc(f.caption)+'</span>'+(src?'<span class="doc-source">'+src+'</span>':'')+'</figcaption></figure>'}
function renderChapter(id,deep){observer?.disconnect();const c=book.chapters.find(x=>x.id===id),idx=book.chapters.indexOf(c),last=book.chapters.length-1;state.chapter=id;persist();const art=$("#chapter-art");if(c.image){art.hidden=false;art.innerHTML='<button data-zoom="'+c.image+'" aria-label="Agrandir l’illustration"><img src="'+c.image+'" alt="'+esc(c.alt)+'" width="'+(c.imageWidth||1600)+'" height="'+(c.imageHeight||900)+'"'+(idx?' loading="lazy"':'')+'></button><figcaption>'+esc(c.alt)+'</figcaption>';$("img",art).onerror=()=>{art.hidden=true;art.innerHTML=""}}else{art.hidden=true;art.innerHTML=""}$("#chapter-body").innerHTML='<header class="chapter-head"><div class="chapter-num">Chapitre '+c.number+' sur '+book.chapters.length+'</div><h1>'+esc(c.title)+'</h1></header><div class="prose">'+c.blocks.map((b,i)=>'<p id="'+b.id+'" data-pos="'+(i+1)+'">'+esc(b.text)+'</p>'+refs(b)+figureHtml(b)).join("")+'</div><nav class="chapter-nav" aria-label="Navigation des chapitres">'+(idx?'<button class="pill" data-chapter="'+book.chapters[idx-1].id+'">← Précédent</button>':'<span></span>')+(idx<last?'<button class="pill" data-chapter="'+book.chapters[idx+1].id+'">Suivant →</button>':'<button class="pill" data-codex>Explorer le codex →</button>')+'</nav>';show("reader");$$("[data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===id?"page":"false"));$$("[data-entry]").forEach(b=>b.onclick=()=>openEntry(b.dataset.entry));$$("[data-chapter]").forEach(b=>b.onclick=()=>go("#chapter/"+b.dataset.chapter));$("[data-codex]")?.addEventListener("click",()=>go("#codex"));const zb=$("[data-zoom]",art);if(zb)zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,c.alt);$$(".doc-figure",$("#chapter-body")).forEach(fig=>{$("img",fig).onerror=()=>{fig.hidden=true};$("[data-zoom]",fig).onclick=e=>openImage(e.currentTarget.dataset.zoom,$("img",fig).alt)});observer=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)setSeen(c,+e.target.dataset.pos)}),{threshold:.55});$$(".prose p").forEach(p=>observer.observe(p));setSeen(c,Math.max(1,state.seen[c.number]||0));if(deep)setTimeout(()=>document.getElementById(deep)?.scrollIntoView(),50)}
function renderMap(){const m=book.map||{},places=mapPlaces();
$("#map-eyebrow").textContent=m.eyebrow||"Repères progressifs";$("#map-title").textContent=m.label||"Carte";$("#map-intro").textContent=m.intro||"Les lieux rencontrés dans le récit ouvrent leur notice ; les autres restent en pointillé.";
const svg=$("#map-svg");svg.setAttribute("viewBox",svgViewBox(m.viewBox));
const shapes=(m.shapes||[]).map(s=>{const d=pathD(s.d);return (d&&SHAPE_KINDS.includes(s.kind))?'<path class="shape-'+s.kind+'" d="'+escA(d)+'"/>':""}).join("");
const spots=places.map(p=>{const x=+p.x,y=+p.y,open=state.unlocked.has(p.codexId),label=nodeTitle(p,p.codexId),anchor=["start","middle","end"].includes(p.labelAnchor)?p.labelAnchor:(x>50?"end":"start"),dx=anchor==="end"?-2.5:anchor==="middle"?0:2.5,dy=anchor==="middle"?-2.8:.9;
return '<g class="spot'+(open?"":" locked")+'"'+(open?' data-open-entry="'+escA(p.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Lieu non découvert"')+'><circle cx="'+x+'" cy="'+y+'" r="1.7"/>'+(open?'<text x="'+(x+dx)+'" y="'+(y+dy)+'" text-anchor="'+anchor+'">'+esc(label)+'</text>':"")+'</g>'}).join("");
svg.innerHTML=shapes+spots;
const found=places.filter(p=>state.unlocked.has(p.codexId));
$("#map-count").textContent=found.length+" lieu"+(found.length>1?"x":"")+" découvert"+(found.length>1?"s":"")+" sur "+places.length;
$("#map-list").innerHTML=found.length?found.map(p=>'<li><button class="entry-link" data-open-entry="'+escA(p.codexId)+'">'+esc(nodeTitle(p,p.codexId))+'</button> <span class="viz-hook">'+esc(entry(p.codexId).hook||"")+'</span></li>').join(""):'<li class="empty">Aucun lieu n\u2019est encore découvert.</li>';
wireOpeners($("#map"))}
function renderRelations(){const r=book.relations||{},nodes=relNodes(),pos={};
$("#relations-eyebrow").textContent=r.eyebrow||"Liens révélés";$("#relations-title").textContent=r.label||"Relations";$("#relations-intro").textContent=r.intro||"Les entités du codex et leurs liens apparaissent au rythme de leur révélation dans le récit.";
nodes.forEach((n,i)=>{const a=-Math.PI/2+2*Math.PI*i/nodes.length;pos[n.codexId]=[num(n.x)??+(50+34*Math.cos(a)).toFixed(2),num(n.y)??+(36+26*Math.sin(a)).toFixed(2)]});
const open=id=>!!pos[id]&&state.unlocked.has(id);
const links=(r.links||[]).filter(l=>open(l.from)&&open(l.to)&&l.from!==l.to&&(!l.unlockBlock||blockReached(l.unlockBlock)));
const svg=$("#relations-svg");svg.setAttribute("viewBox",svgViewBox(r.viewBox));
svg.innerHTML=links.map(l=>{const a=pos[l.from],b=pos[l.to];return '<line class="edge" x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+'"><title>'+esc(l.nature||"")+'</title></line>'}).join("")
+nodes.map(n=>{const p=pos[n.codexId],shown=open(n.codexId),label=nodeTitle(n,n.codexId);
return '<g class="node'+(shown?"":" locked")+'"'+(shown?' data-open-entry="'+escA(n.codexId)+'" role="button" tabindex="0" aria-label="'+escA(label+" — ouvrir la notice")+'"':' role="img" aria-label="Entité non révélée"')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="2.4"/>'+(shown?'<text x="'+p[0]+'" y="'+(p[1]+6)+'" text-anchor="middle">'+esc(label)+'</text>':"")+'</g>'}).join("");
const revealed=nodes.filter(n=>open(n.codexId)).length;
$("#relations-count").textContent=revealed+" entité"+(revealed>1?"s":"")+" révélée"+(revealed>1?"s":"")+" sur "+nodes.length+" · "+links.length+" lien"+(links.length>1?"s":"");
$("#relations-list").innerHTML=links.length?links.map(l=>'<li><strong>'+esc(nodeTitle(nodes.find(n=>n.codexId===l.from),l.from))+' — '+esc(nodeTitle(nodes.find(n=>n.codexId===l.to),l.to))+'</strong><br><span class="viz-nature">'+esc(l.nature||"Lien non qualifié")+'</span></li>').join(""):'<li class="empty">Aucun lien n\u2019est encore révélé.</li>';
wireOpeners($("#relations"))}
function renderCodex(q=""){syncUnlocks();q=q.trim().toLowerCase();const list=book.codex.filter(x=>!q||!state.unlocked.has(x.id)||[x.title,x.category,x.hook,x.text].join(" ").toLowerCase().includes(q));$("#codex-grid").innerHTML=list.length?list.map(x=>state.unlocked.has(x.id)?'<article class="card"><span class="cat">'+esc(x.category)+'</span><h2>'+esc(x.title)+'</h2><p>'+esc(x.hook)+'</p><button class="entry-link" data-open="'+x.id+'">Consulter</button></article>':'<article class="card locked" aria-label="Notice verrouillée"><span class="cat">'+esc(x.category)+'</span><h2>Notice verrouillée</h2><p>Se révèle au fil du récit.</p></article>').join(""):'<p class="empty">Aucune notice débloquée ne correspond.</p>';$$("[data-open]").forEach(b=>b.onclick=()=>openEntry(b.dataset.open))}
function openEntry(id){const x=entry(id);if(!x||!state.unlocked.has(id))return;lastFocus=document.activeElement;const hasImg=localImagePath(x.image);const credit=hasImg?sourceHtml(x.source):"";$("#entry-content").innerHTML='<div class="entry'+(hasImg?'':' no-image')+'">'+(hasImg?'<figure class="entry-figure'+(credit?' doc':'')+'"><button class="entry-image" data-zoom="'+escA(x.image)+'" aria-label="Agrandir l’illustration"><img src="'+escA(x.image)+'" alt="'+escA(x.alt||"")+'" width="'+(x.imageWidth||1600)+'" height="'+(x.imageHeight||900)+'" loading="lazy"></button>'+(credit?'<figcaption class="doc-source">'+credit+'</figcaption>':'')+'</figure>':'')+'<div class="entry-copy"><div class="voice">'+esc(book.meta.codexLabel||"Codex")+' · '+esc(x.category)+'</div><h2 id="entry-title">'+esc(x.title)+'</h2><p class="hook">'+esc(x.hook)+'</p><div class="body">'+x.text.split(/\n\n+/).map(t=>'<p>'+esc(t)+'</p>').join("")+'</div><div class="related">'+x.links.filter(id=>state.unlocked.has(id)&&entry(id)).map(id=>'<button class="entry-link" data-related="'+id+'">'+esc(entry(id).title)+'</button>').join("")+'</div></div></div>';const d=$("#entry-dialog");d.showModal();const zb=$("[data-zoom]",d);if(zb){const im=$("img",zb);im.onerror=()=>{$(".entry-figure",d)?.remove();$(".entry",d)?.classList.add("no-image")};zb.onclick=e=>openImage(e.currentTarget.dataset.zoom,x.alt||"")}$$("[data-related]",d).forEach(b=>b.onclick=()=>{d.close();setTimeout(()=>openEntry(b.dataset.related),0)});if(!$("#codex").hidden)history.replaceState(null,"","#codex/"+id)}
function openImage(src,alt){lastFocus=document.activeElement;$("#large-image").src=src;$("#large-image").alt=alt;$("#image-dialog").showModal()}
function closeDialog(d){d.close();lastFocus?.focus()}
function trap(e,d){if(e.key!=="Tab")return;const f=$$("button,[href],input,[tabindex]:not([tabindex='-1'])",d).filter(x=>!x.disabled);if(!f.length)return;const a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
$("#start").onclick=()=>go("#chapter/"+(saved.chapter||book.chapters[0].id));$("#home-btn").onclick=()=>go("");$("#codex-btn").onclick=()=>go("#codex");$("#codex-nav").onclick=()=>go("#codex");$("#map-btn").onclick=$("#map-nav").onclick=()=>go("#map");$("#relations-btn").onclick=$("#relations-nav").onclick=()=>go("#relations");$("#theme").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";applyPrefs();persist()};$("#font-down").onclick=()=>{state.scale=Math.max(.85,+(state.scale-.1).toFixed(2));applyPrefs();persist()};$("#font-up").onclick=()=>{state.scale=Math.min(1.4,+(state.scale+.1).toFixed(2));applyPrefs();persist()};$("#search").oninput=e=>renderCodex(e.target.value);$("#entry-close").onclick=()=>closeDialog($("#entry-dialog"));$("#image-close").onclick=()=>closeDialog($("#image-dialog"));$$("dialog").forEach(d=>{d.addEventListener("keydown",e=>{if(e.key==="Escape"){e.preventDefault();closeDialog(d)}else trap(e,d)});d.addEventListener("click",e=>{if(e.target===d)closeDialog(d)})});document.addEventListener("keydown",e=>{if($("dialog[open]"))return;const i=book.chapters.findIndex(c=>c.id===state.chapter);if(e.key==="ArrowRight"&&!$("#reader").hidden&&i<book.chapters.length-1)go("#chapter/"+book.chapters[i+1].id);if(e.key==="ArrowLeft"&&!$("#reader").hidden&&i>0)go("#chapter/"+book.chapters[i-1].id)});function showModuleNav(){const m=hasMap(),r=hasRelations();$("#map-btn").hidden=$("#map-nav").hidden=!m;$("#relations-btn").hidden=$("#relations-nav").hidden=!r}
addEventListener("hashchange",route);applyPrefs();renderHome();renderToc();showModuleNav();syncUnlocks();updateProgress();route();
</script></body></html>
