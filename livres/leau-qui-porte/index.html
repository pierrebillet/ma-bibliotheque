          "text": "Elle attendit qu’il ait fini le fromage. Puis elle posa la question pour laquelle elle était venue, et il le savait, et il la laissa la poser.",
          "mentions": []
        },
        {
          "id": "c6-b16",
          "text": "— Les lettres. Les trente-neuf lettres au conseil général. Le maire m’a dit qu’il y en a un qui a écrit pendant quarante ans. Il a regardé vers vous.",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c6-b17",
          "text": "Lucien Astier eut un rire bref, qui n’était pas gai et n’était pas triste.",
          "mentions": [
            "lucien-astier"
          ]
        },
        {
          "id": "c6-b18",
          "text": "— Bernard regarde toujours vers moi quand il s’agit d’écrire. J’ai écrit les discours de trois maires, les vœux de la commune, et la lettre à l’évêque quand on a voulu fermer la chapelle. Alors oui, il regarde vers moi.",
          "mentions": []
        },
        {
          "id": "c6-b19",
          "text": "— Ce n’est pas vous.",
          "mentions": []
        },
        {
          "id": "c6-b20",
          "text": "— Madame Marchal, j’ai écrit quatorze cahiers sur ce village et pas une ligne au département. Je ne demande jamais rien à personne. C’est mon grand défaut, ma femme le disait, et elle avait raison. Non. Ce n’est pas moi.",
          "mentions": [
            "ines-marchal",
            "la-monographie"
          ]
        },
        {
          "id": "c6-b21",
          "text": "— Alors qui ?",
          "mentions": []
        },
        {
          "id": "c6-b22",
          "text": "Il se leva, débarrassa les assiettes, et elle comprit qu’il réfléchissait à ce qu’il avait le droit de dire, et qu’il pesait cela en instituteur, avec le sens exact de la limite entre ce qu’on apprend aux enfants et ce qu’on leur laisse découvrir.",
          "mentions": []
        },
        {
          "id": "c6-b23",
          "text": "— Ça, dit-il enfin, ce n’est pas à moi.",
          "mentions": []
        },
        {
          "id": "c6-b24",
          "text": "— Vous savez qui c’est.",
          "mentions": []
        },
        {
          "id": "c6-b25",
          "text": "— Je le sais depuis 2023. Le jour où le dossier est arrivé à la mairie avec les lettres en préambule. Bernard m’a appelé. Il ne comprenait pas. Il croyait que c’était moi aussi, et il était vexé que je ne le lui aie pas dit. Je lui ai lu la première page au téléphone. Il a compris. Il a demandé au conseil de ne pas dire le nom. Le conseil a dit oui. Ici, on sait faire ça.",
          "mentions": [
            "les-trente-neuf-lettres",
            "bernard-quere"
          ]
        },
        {
          "id": "c6-b26",
          "text": "Il se rassit. Il prit le cahier IX, l’ouvrit à une page marquée d’un bout de ficelle, et le tourna vers elle sans le lui donner.",
          "mentions": []
        },
        {
          "id": "c6-b27",
          "text": "— Je peux vous dire une chose. Une chose qui est dans la monographie et qui appartient donc à tout le monde. En février 1985, il y a eu une crue. Pas comme 1856, mais grosse : 4,20 mètres à l’échelle le 3 février à deux heures du matin. La route de Vaubrun était coupée au ruisseau de la Sègue, comme toujours quand la Sègue déborde, et les Vergnes étaient isolées. Fernand Roussel était malade ; il est mort en juin. Aimé avait vingt-trois ans et un an de bac. Cette nuit-là, il a passé quelqu’un. Un enfant. Le portique de la rive droite a été tordu par un tronc, on l’a réparé en août, on a annulé la fête. Voilà ce qui est écrit.",
          "mentions": [
            "aime-roussel",
            "fernand-roussel"
          ]
        },
        {
          "id": "c6-b28",
          "text": "— Quel enfant ?",
          "mentions": []
        },
        {
          "id": "c6-b29",
          "text": "Lucien referma le cahier.",
          "mentions": [
            "lucien-astier",
            "la-monographie"
          ]
        },
        {
          "id": "c6-b30",
          "text": "— La petite Ferrand. Nadia. Elle avait trois ans.",
          "mentions": [
            "la-crue",
            "la-nuit-de-fevrier-1985",
            "nadia-ferrand",
            "aime-roussel"
          ]
        },
        {
          "id": "c6-b31",
          "text": "Inès ne bougea pas. En bas, par la porte ouverte sur la cour, on entendait le figuier et, plus loin, la rivière.",
          "mentions": [
            "ines-marchal",
            "laubrance"
          ]
        },
        {
          "id": "c6-b32",
          "text": "— Elle le sait ?",
          "mentions": []
        },
        {
          "id": "c6-b33",
          "text": "— Elle sait qu’elle a été à l’hôpital à trois ans, une histoire de fièvre, et que c’était la nuit d’une crue. Sa mère ne lui a jamais raconté la traversée. Josette avait ses raisons. Elle est morte avec. Et lui, il n’est pas homme à raconter ce qui n’est pas à lui.",
          "mentions": [
            "la-crue"
          ]
        },
        {
          "id": "c6-b34",
          "text": "— Et le lien avec les lettres ?",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c6-b35",
          "text": "— Je vous ai dit ce qui est dans la monographie. Le reste, demandez à l’eau.",
          "mentions": []
        },
        {
          "id": "c6-b36",
          "text": "Il la raccompagna jusqu’à la grille. Il faisait nuit. Le bourg était silencieux, et en bas, à la cale, on voyait une petite lumière : la lampe de la maison du passeur, qui restait allumée tard.",
          "mentions": [
            "ferreol",
            "la-cale"
          ]
        },
        {
          "id": "c6-b37",
          "text": "— Madame Marchal. Vous allez demander les lettres au département.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c6-b38",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c6-b39",
          "text": "— Bien. Lisez-les dans l’ordre. Ne sautez pas. C’est un homme qui a appris à écrire en écrivant ça.",
          "mentions": [
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c6-b40",
          "text": "Elle ne rentra pas aux Vergnes. Elle traversa la place, ouvrit la base vie, alluma l’ordinateur, et elle écrivit au chargé d’opération du département, un homme qu’elle n’avait vu qu’en visioconférence et qui s’appelait Delorme, pour lui demander les pièces de préambule du dossier de programmation, le courrier d’origine et ses suites, en précisant qu’elle en avait besoin pour le lot 4, ce qui n’était pas faux. Il était vingt-deux heures. Elle pensa qu’il répondrait le lendemain, ou jamais. Elle resta là, devant l’écran, la fenêtre ouverte sur la nuit et sur le bruit du câble.",
          "mentions": [
            "la-base-vie"
          ]
        },
        {
          "id": "c6-b41",
          "text": "La réponse arriva à vingt-trois heures douze. Delorme travaillait tard aussi. « Ci-joint le scan du courrier d’origine et des trente-huit relances, dans l’ordre chronologique. Bonne lecture, c’est assez extraordinaire. Ne pas diffuser. »",
          "mentions": []
        },
        {
          "id": "c6-b42",
          "text": "Elle ouvrit le fichier. La première page était une lettre manuscrite, sur papier quadrillé, d’une écriture appliquée qui penchait un peu à droite et appuyait sur les majuscules.",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c6-b43",
          "text": "« Ferréol, le 11 février 1985.",
          "mentions": []
        },
        {
          "id": "c6-b44",
          "text": "Monsieur le Président du Conseil Général,",
          "mentions": []
        },
        {
          "id": "c6-b45",
          "text": "Je suis le passeur du bac de Ferréol. »",
          "mentions": []
        },
        {
          "id": "c6-b46",
          "text": "Elle lut la signature avant de lire la suite, parce qu’elle savait déjà, et qu’elle voulait le voir écrit. « A. Roussel, passeur. » Puis elle ferma l’ordinateur, sans lire davantage, parce que Lucien avait dit dans l’ordre et sans sauter, et qu’elle voulait le faire au jour, à une table, avec du temps, comme on lit une chose qui a mis quarante ans à venir.",
          "mentions": [
            "les-trente-neuf-lettres",
            "aime-roussel"
          ]
        },
        {
          "id": "c6-b47",
          "text": "Elle sonna la cloche à onze heures et demie du soir, ce qu’elle n’avait jamais fait. Il vint. Il ne posa pas de question ; il la passa. Au milieu de l’eau, elle regarda le portique de la rive droite, et elle vit, à la lumière de la lune, ce qu’elle n’avait jamais regardé : sur le montant amont, à trois mètres de haut, une réparation ancienne, une pièce de fer boulonnée sur une autre, un peu de travers, comme un os mal ressoudé.",
          "mentions": [
            "la-traille"
          ]
        }
      ]
    },
    {
      "id": "chapitre-7",
      "number": 7,
      "title": "Février 1985",
      "blocks": [
        {
          "id": "c7-b01",
          "text": "Elle lut les lettres le dimanche, à la table de sa chambre au-dessus du café, la fenêtre ouverte sur les tilleuls, avec le bruit des verres en bas et celui de la rivière derrière. Elle les lut dans l’ordre. Elle mit la matinée.",
          "mentions": [
            "ines-marchal",
            "les-trente-neuf-lettres",
            "chez-ferrand"
          ]
        },
        {
          "id": "c7-b02",
          "text": "La première tenait sur deux pages quadrillées et disait tout, mal. « Je suis le passeur du bac de Ferréol. Dans la nuit du 3 février, la rivière était à 4,20 mètres et il a fallu passer une enfant malade pour l’ambulance qui ne pouvait pas venir aux Vergnes à cause de la route coupée. Le bac est passé mais le portique a été touché par un arbre et je ne sais pas s’il aurait tenu une deuxième fois. Je vous demande qu’on fasse un pont. Je sais que ça coûte. Mais il y a des gens qui habitent de l’autre côté et ils ont le droit d’être secourus comme les autres. » Il avait écrit « Conseil Général » avec deux majuscules et « secourus » avec un s de trop, rayé. Il avait signé « A. Roussel, passeur », et ajouté, sous la signature, comme on ajoute une chose qu’on n’ose pas mettre dans le corps de la lettre : « Je ne demande pas pour moi. »",
          "mentions": [
            "la-nuit-de-fevrier-1985",
            "aime-roussel"
          ]
        },
        {
          "id": "c7-b03",
          "text": "La deuxième, un an plus tard, était plus courte et plus ferme. Elle rappelait la première, dont il n’avait pas eu de réponse, et donnait les hauteurs d’eau de l’hiver, jour par jour, pendant les vingt-trois jours où le bac n’avait pas pu passer. La troisième joignait une liste : les habitants des Vergnes, leur âge, leur distance à la cale, avec un astérisque pour ceux qui avaient plus de soixante-dix ans. La cinquième avait reçu une réponse, agrafée derrière, deux paragraphes du cabinet du président : la demande était notée, la programmation routière ne permettait pas, on ne manquerait pas. La sixième répondait à la réponse, poliment, en demandant ce que voulait dire « ne pas manquer ».",
          "mentions": [
            "les-vergnes",
            "la-cale"
          ]
        },
        {
          "id": "c7-b04",
          "text": "Vers la dixième, l’écriture avait changé. Elle penchait moins. Il y avait moins de majuscules et plus de chiffres. Il parlait des crues en mètres et en jours, du nombre de traversées par an, du nombre d’enfants scolarisés aux Vergnes, du nombre de fois où le médecin de Vaubrun avait été appelé de nuit rive droite. Il avait appris. Elle reconnut, avec un pincement qu’elle n’attendait pas, la langue que parlaient ses propres rapports, la langue des maîtres d’ouvrage, celle qu’on apprend pour être lu par des gens qui ne lisent que les chiffres. Il l’avait apprise seul, sur la table d’une cuisine, lettre après lettre, pour dire une chose qu’il aurait pu dire en une phrase. « Il y a des gens de l’autre côté. »",
          "mentions": [
            "vaubrun",
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c7-b05",
          "text": "La dix-septième, en 2001, annonçait qu’il avait accepté un moteur d’appoint, « contre l’avis de feu mon père », pour que les traversées d’août ne dépendent plus du vent, et demandait si cela changeait quelque chose au dossier. Cela n’avait rien changé. La vingt-troisième, en 2007, ne faisait que trois lignes : « Monsieur le Président, je vous écris pour la vingt-troisième fois. Le bac a passé cette année trois mille sept cent quarante personnes, deux cent onze véhicules, huit cercueils. Il a été arrêté dix-neuf jours pour crue. Je maintiens ma demande. » Il n’y avait plus de « je ne demande pas pour moi ». Il n’y en avait plus besoin.",
          "mentions": [
            "le-moteur-de-la-honte",
            "fernand-roussel"
          ]
        },
        {
          "id": "c7-b06",
          "text": "Les dernières étaient presque toutes pareilles, comme des relevés. Une par an, en février. La date de la crue, la hauteur d’eau, le nombre de jours d’arrêt, le nombre de passages, la demande maintenue. La trente-huitième, en 2022, mentionnait pour la première fois le collège de Vaubrun et le ramassage scolaire, et Inès comprit que c’était lui qui avait donné au maire l’argument qui ferait basculer le département l’année suivante. La trente-neuvième, en février 2023, tenait en une phrase. « Monsieur le Président, je vous écris pour la trente-neuvième fois et j’apprends que le pont est programmé. Je vous remercie. Je ne vous écrirai plus. A. Roussel, passeur. »",
          "mentions": [
            "aime-roussel",
            "ines-marchal"
          ]
        },
        {
          "id": "c7-b07",
          "text": "Elle resta longtemps devant cette page. En bas, Nadia servait le café du dimanche, et sa voix montait par la fenêtre, et Tom riait de quelque chose, et Inès pensa à cette enfant de trois ans enveloppée dans une couverture sur une barque, une nuit de février, dans quatre mètres vingt d’eau noire, et à l’homme de vingt-trois ans qui tenait le guindeau et qui, huit jours plus tard, n’ayant personne à qui le dire, l’avait écrit au président du conseil général.",
          "mentions": [
            "nadia-ferrand",
            "tom-ferrand"
          ]
        },
        {
          "id": "c7-b08",
          "text": "Elle descendit à la cale à la nuit. Elle n’avait pas besoin de traverser ; elle sonna quand même, un seul coup, et il vint, et quand le bac toucha la rive droite elle ne monta pas.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c7-b09",
          "text": "— Je voudrais vous parler, dit-elle. Pas en traversant.",
          "mentions": []
        },
        {
          "id": "c7-b10",
          "text": "Il amarra. Il s’assit sur le banc de l’avant, et elle vint s’asseoir à côté de lui, sur le banc des vieux et des femmes enceintes, et ils regardèrent l’eau. Il faisait doux. La rivière avait encore monté ; le câble chantait juste.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c7-b11",
          "text": "— J’ai lu les lettres.",
          "mentions": [
            "les-trente-neuf-lettres"
          ]
        },
        {
          "id": "c7-b12",
          "text": "— Je sais. Delorme a appelé Quéré, Quéré a appelé Lucien, Lucien est venu me le dire jeudi.",
          "mentions": [
            "lucien-astier",
            "bernard-quere"
          ]
        },
        {
          "id": "c7-b13",
          "text": "— Vous auriez pu me le dire.",
          "mentions": []
        },
        {
          "id": "c7-b14",
          "text": "— Ce n’était pas à moi.",
          "mentions": []
        },
        {
          "id": "c7-b15",
          "text": "— Comment ça, pas à vous ? C’est vous qui les avez écrites.",
          "mentions": []
        },
        {
          "id": "c7-b16",
          "text": "— Les lettres, oui. Les lettres, c’est à moi. Mais pas ce qu’il y a dedans.",
          "mentions": [
            "bernard-quere",
            "lucien-astier"
          ]
        },
        {
          "id": "c7-b17",
          "text": "Elle attendit. Elle avait appris, en deux mois, qu’avec lui il fallait attendre, et que ce qu’on obtenait en attendant valait ce qu’on aurait perdu en demandant.",
          "mentions": []
        },
        {
          "id": "c7-b18",
          "text": "— Elle s’appelait Josette, dit-il. La mère de Nadia. Elle tenait le café avec son mari. Le 3 février, il pleuvait depuis six jours sur le plateau. La rivière était à quatre mètres dans l’après-midi et elle montait de dix centimètres à l’heure. La Sègue avait coupé la route de Vaubrun à sept heures du soir. À deux heures du matin, le téléphone a sonné chez nous. Mon père était couché, il était déjà malade, il ne se levait plus. C’est moi qui ai décroché. C’était Josette. La petite avait quarante et un de fièvre et elle convulsait. Le médecin de Vaubrun ne pouvait pas venir. Le SAMU pouvait envoyer une ambulance jusqu’au bourg, rive gauche, et pas plus loin.",
          "mentions": [
            "nadia-ferrand",
            "ferreol"
          ]
        },
        {
          "id": "c7-b19",
          "text": "— Et vous avez traversé.",
          "mentions": []
        },
        {
          "id": "c7-b20",
          "text": "— J’ai traversé. À vide d’abord, pour aller la chercher. Le courant, à cette hauteur-là, vous ne le connaissez pas. On ne rend pas du guindeau, on le lâche. Le bac est parti comme une balle. J’ai cru que les bras allaient casser. Il y avait des arbres entiers qui descendaient, on ne les voyait pas, on les entendait. J’ai accosté aux Vergnes de travers, contre le portique. Josette est descendue avec la petite dans une couverture. Elle a dit : tu ne le diras à personne. J’ai dit oui. Je ne savais pas ce qu’elle voulait dire. Je l’ai su après : elle avait attendu trop longtemps avant d’appeler, elle avait cru que la fièvre passerait, elle avait honte. Je lui ai dit de s’asseoir là où vous êtes, avec la petite, et de ne pas regarder.",
          "mentions": [
            "la-nuit-de-fevrier-1985",
            "la-crue",
            "la-patience"
          ]
        },
        {
          "id": "c7-b21",
          "text": "Il se tut un moment. Une chauve-souris passa au ras de l’eau.",
          "mentions": []
        },
        {
          "id": "c7-b22",
          "text": "— Au retour, un tronc est arrivé sur nous. Je l’ai entendu avant de le voir. Il a tapé le portique, là, en haut, vous avez dû voir la réparation. Le montant s’est tordu, le chariot a sauté sur le câble, le bac a fait un tour sur lui-même, à moitié. Et puis il s’est remis. Je ne sais pas pourquoi. Le câble a tenu. Le câble de 1902. On a touché la cale du bourg et l’ambulance était là avec ses lumières, et ils ont pris la petite, et elle a vécu. Méningite. Trois semaines à Vaubrun. Josette est rentrée à pied par le pont de la Sègue quand la route a été rouverte, deux jours après, et elle n’a jamais reparlé de cette nuit-là, à moi ni à personne. Elle est morte il y a douze ans. Elle ne l’a pas dit à Nadia.",
          "mentions": [
            "nadia-ferrand",
            "la-traille"
          ]
        },
        {
          "id": "c7-b23",
          "text": "— Et vous non plus.",
          "mentions": []
        },
        {
          "id": "c7-b24",
          "text": "— Ce n’était pas à moi.",
          "mentions": []
        },
        {
          "id": "c7-b25",
          "text": "— Et le 11 février, vous avez écrit au conseil général.",
          "mentions": []
        },
        {
          "id": "c7-b26",
          "text": "— Le 11 février, mon père s’est levé pour la dernière fois. Il est descendu à la cale, il a regardé le portique tordu, il a dit : ça a tenu. Et il est remonté se coucher. Le soir, j’ai écrit.",
          "mentions": [
            "fernand-roussel",
            "la-traille"
          ]
        },
        {
          "id": "c7-b27",
          "text": "Inès regardait le portique de la rive droite, la pièce de fer boulonnée de travers, noire sur le ciel.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c7-b28",
          "text": "— Trente-neuf ans, dit-elle. Vous avez demandé pendant trente-neuf ans la chose qui vous supprime. Et vous n’avez jamais dit que c’était vous.",
          "mentions": []
        },
        {
          "id": "c7-b29",
          "text": "— Si j’avais dit que c’était le passeur qui demandait le pont, on aurait cru que je voulais arrêter. Je ne voulais pas arrêter. Je voulais qu’on puisse passer quand je ne pouvais pas. Ce n’est pas la même chose.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c7-b30",
          "text": "— Non, dit-elle. Ce n’est pas la même chose.",
          "mentions": []
        },
        {
          "id": "c7-b31",
          "text": "Elle se rendit compte qu’elle pleurait, pas beaucoup, et que cela ne la gênait pas, et qu’il ne faisait pas semblant de ne pas voir, ce qui était sa façon d’être délicat.",
          "mentions": []
        },
        {
          "id": "c7-b32",
          "text": "— Vous avez gagné, dit-elle.",
          "mentions": []
        },
        {
          "id": "c7-b33",
          "text": "— Je n’ai pas gagné. J’ai eu raison. Ce n’est pas pareil non plus.",
          "mentions": []
        },
        {
          "id": "c7-b34",
          "text": "Le câble chanta plus haut ; le vent tournait. Il se leva, vérifia la chaîne par habitude, se rassit.",
          "mentions": []
        },
        {
          "id": "c7-b35",
          "text": "— Vous allez le dire à Nadia ?",
          "mentions": [
            "nadia-ferrand"
          ]
        },
        {
          "id": "c7-b36",
          "text": "— Non.",
          "mentions": []
        },
        {
          "id": "c7-b37",
          "text": "— Pourquoi ?",
          "mentions": []
        },
        {
          "id": "c7-b38",
          "text": "— Parce que ce n’est pas à moi. Et parce que Lucien va l’écrire dans son cahier, en disant que ce n’est pas à lui non plus, et qu’un jour elle le lira. C’est comme ça qu’on fait, ici. On met les choses dans le cahier, et on attend que les gens y aillent.",
          "mentions": [
            "lucien-astier",
            "la-monographie"
          ]
        },
        {
          "id": "c7-b39",
          "text": "Elle rit, dans ses larmes, et il eut ce léger relâchement du guindeau qui était son rire à lui.",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c7-b40",
          "text": "— Monsieur Roussel. La barque. La phrase sur la déconstruction. Je vais écrire à Delorme.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c7-b41",
          "text": "— Vous n’avez pas le pouvoir.",
          "mentions": []
        },
        {
          "id": "c7-b42",
          "text": "— Non. Mais j’ai le procès-verbal de réception. C’est moi qui le rédige. Et un procès-verbal, ça se lit.",
          "mentions": []
        },
        {
          "id": "c7-b43",
          "text": "Il la regarda, pour la première fois de la soirée, et elle vit qu’il ne s’attendait pas à cela, et que cela le touchait à l’endroit qu’il n’aurait pas su nommer, celui où l’on est touché quand quelqu’un comprend la traille.",
          "mentions": []
        },
        {
          "id": "c7-b44",
          "text": "— Lucien avait raison, dit-il.",
          "mentions": []
        },
        {
          "id": "c7-b45",
          "text": "— Sur quoi ?",
          "mentions": []
        },
        {
          "id": "c7-b46",
          "text": "— Vous notez des choses.",
          "mentions": [
            "nadia-ferrand",
            "la-depose",
            "la-patience"
          ]
        },
        {
          "id": "c7-b47",
          "text": "Elle rentra au café à pied, par le chemin, dans la nuit chaude. En bas, la cale était éclairée par la lampe de la maison du passeur, et le bac, amarré, se soulevait doucement, et le câble tendu au-dessus de l’eau noire luisait comme la seule phrase de ce village que quelqu’un eût jamais finie.",
          "mentions": [
            "la-traille",
            "la-maison-du-passeur"
          ]
        }
      ]
    },
    {
      "id": "chapitre-8",
      "number": 8,
      "title": "L’eau haute",
      "blocks": [
        {
          "id": "c8-b01",
          "text": "Les enrobés furent posés la première semaine de septembre, en deux nuits, sous les projecteurs, et le pont eut pour la première fois une couleur de route. Inès marcha dessus à l’aube du deuxième jour, seule, d’une rive à l’autre, sur le bitume encore tiède qui sentait le goudron et la pluie à venir. Quatre-vingt-seize mètres. Cent vingt-huit pas. Elle s’arrêta au milieu, au-dessus du courant, et regarda vers l’amont, où le câble de la traille était un fil d’argent dans la brume, et le bac en dessous, minuscule, amarré, avec une silhouette assise à l’avant qu’elle n’avait pas besoin de distinguer.",
          "mentions": [
            "ines-marchal",
            "le-pont",
            "la-traille"
          ]
        },
        {
          "id": "c8-b02",
          "text": "La pluie vint le cinq, un samedi, par l’ouest, et elle ne s’arrêta plus. Elle tomba sur le plateau toute la journée et toute la nuit, et le dimanche matin, à la cale, l’échelle marquait deux mètres dix. Aimé la passa sans commentaire. Le câble chantait fort, une note tendue qu’elle ne lui avait jamais entendue, et le bac allait vite, trop vite, penché dans un courant brun qui charriait des branches et de l’écume.",
          "mentions": [
            "aime-roussel",
            "la-cale"
          ]
        },
        {
          "id": "c8-b03",
          "text": "— Jusqu’où ? demanda-t-elle.",
          "mentions": []
        },
        {
          "id": "c8-b04",
          "text": "— Trois mètres, je passe. Trois mètres cinquante, je passe si c’est nécessaire. Au-dessus, non.",
          "mentions": []
        },
        {
          "id": "c8-b05",
          "text": "— Et en 1985 ?",
          "mentions": []
        },
        {
          "id": "c8-b06",
          "text": "— Quatre vingt.",
          "mentions": []
        },
        {
          "id": "c8-b07",
          "text": "Il ne dit rien d’autre. Elle traversa le pré communal sous la pluie jusqu’à la base vie, alluma l’ordinateur, ouvrit le site de la préfecture. Vigilance orange sur le bassin. Le pic était annoncé pour la nuit de dimanche à lundi. Elle appela ses deux compagnons, qui habitaient Vaubrun, et leur demanda de venir vérifier les amarres du ponton de travaux. Ils rappelèrent une heure plus tard : la Sègue avait débordé, la route était coupée au pont de la Sègue, ils ne pouvaient pas venir. Elle dit que ce n’était pas grave, qu’elle s’en occuperait, et elle raccrocha, et elle regarda la pluie.",
          "mentions": [
            "la-crue",
            "la-base-vie",
            "vaubrun"
          ]
        },
        {
          "id": "c8-b08",
          "text": "Le ponton de travaux était une plate-forme flottante de douze mètres, amarrée à la pile P2 côté rive gauche, qui avait servi tout l’été aux finitions sous le tablier. Il aurait dû être replié la semaine précédente. On l’avait gardé pour les épreuves de charge, parce qu’il fallait encore poser des capteurs sous les poutres, et il portait deux pompes, un groupe électrogène, un compresseur, six cents kilos d’outillage, et il était tenu à la pile par quatre amarres qu’elle avait vérifiées elle-même le vendredi, dans une rivière à un mètre dix.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c8-b09",
          "text": "À dix-sept heures, l’échelle marquait deux mètres soixante. Elle descendit au ponton avec le gardien de nuit, un homme de soixante ans qui s’appelait Roger et ne parlait que pour dire des choses utiles, et ils doublèrent les amarres, montèrent les pompes sur le tablier avec le palan, coupèrent le groupe. Le ponton tirait sur ses bouts comme un animal. Le courant se fendait sur la pile en deux bourrelets bruns et passait sous eux avec un bruit de train.",
          "mentions": [
            "laubrance"
          ]
        },
        {
          "id": "c8-b10",
          "text": "— Ça tient, dit Roger.",
          "mentions": []
        },
        {
          "id": "c8-b11",
          "text": "— Jusqu’à combien ?",
          "mentions": []
        },
        {
          "id": "c8-b12",
          "text": "— Je ne sais pas. Personne ne sait. C’est la première crue du pont.",
          "mentions": []
        },
        {
          "id": "c8-b13",
          "text": "Elle retraversa à dix-huit heures trente. Aimé l’attendait. Il ne dit pas qu’il serait déraisonnable de revenir dans la nuit ; il dit :",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c8-b14",
          "text": "— La cloche marche aussi la nuit.",
          "mentions": []
        },
        {
          "id": "c8-b15",
          "text": "— Je sais.",
          "mentions": []
        },
        {
          "id": "c8-b16",
          "text": "— Trois coups, c’est pour passer. Un coup, c’est pour parler. Deux, c’est vous.",
          "mentions": []
        },
        {
          "id": "c8-b17",
          "text": "Elle ne comprit pas tout de suite qu’il venait d’inventer un code, et pour elle seule, et quand elle comprit, le bac avait déjà accosté aux Vergnes et il redressait, le visage fermé, les yeux sur le câble.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c8-b18",
          "text": "Elle ne dormit pas. Elle resta habillée sur le lit, dans la chambre au-dessus du café, la fenêtre ouverte sur la pluie, le téléphone à côté d’elle avec la page de la station de mesure de l’amont qu’elle rafraîchissait toutes les dix minutes. Deux mètres quatre-vingt-dix à vingt-deux heures. Trois mètres à vingt-trois. Nadia monta vers minuit, sans frapper, avec un thermos de café, le posa sur la table, regarda la fenêtre.",
          "mentions": [
            "nadia-ferrand",
            "chez-ferrand"
          ]
        },
        {
          "id": "c8-b19",
          "text": "— Vous allez y aller.",
          "mentions": []
        },
        {
          "id": "c8-b20",
          "text": "— Si ça monte encore, oui.",
          "mentions": []
        },
        {
          "id": "c8-b21",
          "text": "— Il vous passera.",
          "mentions": []
        },
        {
          "id": "c8-b22",
          "text": "— Il a dit jusqu’à trois mètres cinquante.",
          "mentions": []
        },
        {
          "id": "c8-b23",
          "text": "— Il a dit ça à vous. Il vous passera.",
          "mentions": []
        },
        {
          "id": "c8-b24",
          "text": "Nadia resta un moment sur le pas de la porte. Elle avait quelque chose à dire qu’elle ne dit pas, et Inès pensa au cahier IX de Lucien, et à ce qu’il y avait dedans, et à cette femme qui ne le savait pas et qui apportait du café à quelqu’un qui allait passer l’eau dans la nuit, comme sa mère, sans le savoir, quarante ans plus tôt, dans l’autre sens.",
          "mentions": [
            "nadia-ferrand",
            "la-nuit-de-fevrier-1985"
          ]
        },
        {
          "id": "c8-b25",
          "text": "À une heure dix, la station de l’amont indiqua trois mètres vingt, et son téléphone sonna. C’était Roger. Une des amarres neuves avait rompu. Le ponton avait tourné d’un quart et prenait le courant par le travers. Il ne pouvait pas tout seul.",
          "mentions": []
        },
        {
          "id": "c8-b26",
          "text": "Elle descendit. Il pleuvait moins ; le ciel s’était ouvert par places et la lune éclairait une rivière qu’elle ne reconnut pas, large, rapide, brune et lisse au milieu, hérissée sur les bords de branches qui tournaient. Le câble chantait comme une corde de contrebasse. Elle prit la corde de la cloche et sonna deux coups.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c8-b27",
          "text": "Il vint. Il était déjà habillé ; il avait dû attendre aussi. Le bac traversa vers elle à une vitesse qu’elle ne lui avait jamais vue, couché dans le courant, les deux bras tendus à se rompre, et il accosta de travers contre la cale, et le bordé racla le béton, et il ne s’excusa pas de ce bruit.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c8-b28",
          "text": "— Montez. Au guindeau. Pas à l’avant.",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c8-b29",
          "text": "Elle monta. Il décrocha la chaîne, et la Patience partit comme un cheval qu’on lâche.",
          "mentions": [
            "la-patience",
            "le-guindeau"
          ]
        },
        {
          "id": "c8-b30",
          "text": "Ce fut la traversée la plus courte de sa vie et la plus longue. Le bac n’avait pas d’angle ; il avait une inclinaison, une gîte, et l’eau montait le long du bordé amont jusqu’à un doigt du platelage. Aimé tenait le guindeau des deux mains et ne rendait rien ; il retenait. Elle vit passer un arbre entier, avec ses racines, à vingt mètres en amont, qui les manqua. Elle vit la rive gauche venir avec ses lumières et le pont plus bas, éclairé par les projecteurs de chantier que Roger avait allumés, et sous le pont le ponton qui bougeait comme une chose vivante.",
          "mentions": [
            "aime-roussel",
            "le-pont"
          ]
        },
        {
          "id": "c8-b31",
          "text": "Puis il y eut un choc, sourd, dans la structure même du bac, et la Patience tourna sur elle-même d’un huitième et s’arrêta.",
          "mentions": []
        },
        {
          "id": "c8-b32",
          "text": "— Le bras aval, dit Aimé. Quelque chose dedans.",
          "mentions": []
        },
        {
          "id": "c8-b33",
          "text": "Elle regarda. Une branche, non, un tronc mince, un aulne arraché, s’était pris dans le câble du bras aval, entre le bordé et le chariot, et le courant appuyait dessus comme sur une voile. Le bac, ainsi tenu, se mettait lentement en travers. Aimé lâcha le guindeau d’une main, prit la gaffe, et le bac fit un mouvement qu’elle sentit dans ses jambes avant de le comprendre.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c8-b34",
          "text": "— Prenez, dit-il.",
          "mentions": []
        },
        {
          "id": "c8-b35",
          "text": "— Quoi ?",
          "mentions": []
        },
        {
          "id": "c8-b36",
          "text": "— Le guindeau. Les deux mains. Vous ne rendez pas. Vous ne reprenez pas. Vous tenez. Si je dis reprenez, vous reprenez d’un demi-tour, pas plus. Si je dis rendez, vous ne rendez pas, parce que je ne le dirai pas.",
          "mentions": []
        },
        {
          "id": "c8-b37",
          "text": "Elle prit. Le tambour de fonte était froid et mouillé, la manivelle vibrait de tout le poids de la rivière, et elle comprit dans ses bras, dans ses épaules, dans ses reins, ce que c’était que l’angle, ce que c’était que tenir le point où le bac était pendu, ce que c’était que quarante-deux ans. Il alla à l’avant. Il se pencha par-dessus le bordé, dans le courant, la gaffe à deux mains, et il travailla le tronc, pas en forçant, en demandant, en cherchant l’endroit où le courant lui-même le dégagerait.",
          "mentions": [
            "laubrance"
          ]
        },
        {
          "id": "c8-b38",
          "text": "— Reprenez.",
          "mentions": []
        },
        {
          "id": "c8-b39",
          "text": "Elle reprit un demi-tour. Le bac se redressa d’un degré. Le tronc bougea.",
          "mentions": []
        },
        {
          "id": "c8-b40",
          "text": "— Tenez.",
          "mentions": []
        },
        {
          "id": "c8-b41",
          "text": "Elle tint. Il donna un dernier coup, et l’aulne se libéra d’un seul mouvement et fila vers l’aval, vers le pont, et disparut entre les piles, et le bac, libéré, reprit son angle tout seul, et elle sentit la portance revenir sous ses pieds comme une chose qu’on lui rendait.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c8-b42",
          "text": "Il revint au guindeau. Il ne le lui reprit pas. Il posa sa main sur la manivelle à côté des siennes et dit :",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c8-b43",
          "text": "— Rendez. Doucement. Vous savez.",
          "mentions": []
        },
        {
          "id": "c8-b44",
          "text": "Elle rendit. La Patience prit la rive gauche et la toucha, presque doucement, et il passa la chaîne dans l’anneau, et elle lâcha le guindeau et vit que ses mains tremblaient et n’en eut pas honte.",
          "mentions": [
            "la-patience"
          ]
        },
        {
          "id": "c8-b45",
          "text": "— Allez, dit-il. Roger attend. Je reste là.",
          "mentions": []
        },
        {
          "id": "c8-b46",
          "text": "— Vous n’allez pas dormir.",
          "mentions": []
        },
        {
          "id": "c8-b47",
          "text": "— Je n’ai jamais laissé quelqu’un sur une rive.",
          "mentions": []
        },
        {
          "id": "c8-b48",
          "text": "Elle courut.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c8-b49",
          "text": "Ils travaillèrent deux heures, elle et Roger, sur le ponton qui bougeait, avec des cordes et des mousquetons, dans la lumière crue des projecteurs et le bruit énorme de l’eau sur la pile. Ils le ramenèrent dans l’axe. Ils repassèrent trois amarres. Ils déchargèrent ce qui pouvait l’être sur le tablier avec le palan. Vers trois heures et demie, la station de l’amont indiqua trois mètres trente-cinq, puis trois mètres trente-cinq encore, et Roger dit : « C’est le pic », et il avait raison, et ils s’assirent tous les deux sur le tablier, les jambes dans le vide au-dessus de la rivière, sans parler.",
          "mentions": [
            "le-pont",
            "laubrance"
          ]
        },
        {
          "id": "c8-b50",
          "text": "Le pont tenait. C’était une chose qu’elle savait par le calcul, depuis toujours, et qu’elle sut cette nuit-là par le corps, comme elle avait su l’angle. Elle regarda le courant se fendre sur les piles, en deux bourrelets lisses, et passer, et elle pensa à la ligne oblique de l’eau contre le bordé du bac, et elle vit que c’était la même ligne. La rivière faisait au pont ce qu’elle faisait au bac : elle le prenait de biais et le laissait passer.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c8-b51",
          "text": "Elle redescendit à la cale à quatre heures. Il était assis sur le banc de l’avant, sous la pluie qui avait repris, fine, une couverture sur les épaules. Il se leva quand il la vit. Il ne demanda pas comment ça s’était passé ; il regarda le pont, éclairé, debout dans l’eau haute, et il le vit tenir.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c8-b52",
          "text": "— Il tient, dit-elle.",
          "mentions": []
        },
        {
          "id": "c8-b53",
          "text": "— C’est un bon pont.",
          "mentions": []
        },
        {
          "id": "c8-b54",
          "text": "Ils traversèrent. La rivière baissait déjà, de rien, d’un souffle, et le câble avait changé de note, et elle le sut avant lui, ou en même temps, et il la regarda de côté et ne dit rien, et c’était sa façon de dire qu’il l’avait vue le savoir.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c8-b55",
          "text": "Sur la cale des Vergnes, elle descendit. Puis elle se retourna et posa la main sur le tambour du guindeau, froid, mouillé, une seconde.",
          "mentions": [
            "le-guindeau",
            "les-vergnes"
          ]
        },
        {
          "id": "c8-b56",
          "text": "— Merci pour la traversée.",
          "mentions": []
        },
        {
          "id": "c8-b57",
          "text": "— Vous l’avez faite.",
          "mentions": []
        },
        {
          "id": "c8-b58",
          "text": "— Une moitié.",
          "mentions": []
        },
        {
          "id": "c8-b59",
          "text": "— C’est la moitié qui compte.",
          "mentions": []
        },
        {
          "id": "c8-b60",
          "text": "Il redressa, et le bac repartit vers l’autre rive, à vide, incliné, dans l’aube grise, et elle resta là jusqu’à ce qu’il ait touché la cale du bourg, parce qu’il lui semblait que c’était à son tour de ne pas laisser quelqu’un sur une rive.",
          "mentions": [
            "ines-marchal",
            "la-patience"
          ]
        }
      ]
    },
    {
      "id": "chapitre-9",
      "number": 9,
      "title": "Le dernier passage",
      "blocks": [
        {
          "id": "c9-b01",
          "text": "Le vingt septembre, le câble chanta juste. Aimé l’écouta de son lit, avant le jour, et il sut que la rivière était à un mètre trente, ce qui était la hauteur qu’il aurait choisie s’il avait eu à choisir. Il descendit à six heures. Il lava le platelage à grande eau. Il replia la bâche du moteur et la rangea dans la maison, pas sur le bac. Il graissa l’axe du guindeau, qui n’en avait pas besoin, et il repeignit, au pinceau fin, la dernière lettre du nom sur le bordé, le e de Patience, qui s’écaillait depuis le printemps et qu’il avait laissé s’écailler parce qu’il ne savait pas s’il valait la peine de le refaire. Il le refit.",
          "mentions": [
            "aime-roussel",
            "la-patience",
            "la-traille"
          ]
        },
        {
          "id": "c9-b02",
          "text": "Le premier fut Tom, à sept heures, sans cartable, en chemise blanche, envoyé par sa mère pour aider à la cale, ce qui voulait dire pour être là. Il monta sans sauter. Il alla à l’échelle, compta les barreaux, revint.",
          "mentions": [
            "tom-ferrand",
            "la-cale"
          ]
        },
        {
          "id": "c9-b03",
          "text": "— Un mètre trente.",
          "mentions": []
        },
        {
          "id": "c9-b04",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c9-b05",
          "text": "— Tu me laisses le guindeau ?",
          "mentions": [
            "le-guindeau"
          ]
        },
        {
          "id": "c9-b06",
          "text": "— Pas aujourd’hui.",
          "mentions": []
        },
        {
          "id": "c9-b07",
          "text": "Le garçon hocha la tête comme s’il s’y attendait. Il resta debout à côté d’Aimé pendant toute la traversée, la main posée sur le bordé, sans rien dire, et quand ils touchèrent la rive gauche il alla mettre la passerelle lui-même, ce qu’il n’avait jamais fait, et Aimé le laissa.",
          "mentions": [
            "tom-ferrand"
          ]
        },
        {
          "id": "c9-b08",
          "text": "Puis ils vinrent. Les Vergnes descendaient par le chemin en rangs lâches, en habits du dimanche, un vrai dimanche pour une fois, les fermes vidées, les vieux au bras des moins vieux, les enfants devant. Il les passa par douze, par quinze, comme pour la fête, mais en silence, ou presque ; les gens montaient, disaient bonjour, se plaçaient, regardaient l’eau. Beaucoup posaient la main sur le bordé en montant, sans y penser, comme on touche le chambranle d’une porte qu’on ne franchira plus. Il compta. Il ne pouvait pas ne pas compter. Cent quatre. Cent dix-neuf. Cent trente et un.",
          "mentions": [
            "les-vergnes"
          ]
        },
        {
          "id": "c9-b09",
          "text": "Lucien vint à neuf heures, sans son vélo, en costume, avec sa musette. Il monta le dernier de sa fournée et se plaça à l’avant, comme d’habitude, la casquette à la main, et il regarda la rive gauche venir. Au milieu de l’eau, il se tourna vers Aimé.",
          "mentions": [
            "aime-roussel",
            "lucien-astier"
          ]
        },
        {
          "id": "c9-b10",
          "text": "— J’ai fini le cahier IX cette nuit. La crue de 1985. J’ai tout mis.",
          "mentions": [
            "la-monographie",
            "la-crue"
          ]
        },
        {
          "id": "c9-b11",
          "text": "— Bien.",
          "mentions": []
        },
        {
          "id": "c9-b12",
          "text": "— J’ai écrit que ce n’était pas à moi de le dire, et que je le disais quand même parce qu’un jour il n’y aurait plus personne pour le savoir. J’ai écrit que tu m’excuserais.",
          "mentions": []
        },
        {
          "id": "c9-b13",
          "text": "— Je t’excuse.",
          "mentions": []
        },
        {
          "id": "c9-b14",
          "text": "— Je l’ai donné à Nadia hier soir. Pas prêté. Donné.",
          "mentions": [
            "nadia-ferrand"
          ]
        },
        {
          "id": "c9-b15",
          "text": "Aimé regarda le câble. Il ne dit rien. Lucien remit sa casquette.",
          "mentions": [
            "aime-roussel",
            "la-traille"
          ]
        },
        {
          "id": "c9-b16",
          "text": "— Elle a lu. Elle n’a rien dit. Elle m’a fait un café.",
          "mentions": []
        },
        {
          "id": "c9-b17",
          "text": "Le bac toucha la cale. Le vieil instituteur descendit, se retourna sur la passerelle, et fit ce qu’il n’avait jamais fait en cinquante-cinq ans de traversées : il tendit la main, et Aimé la prit, et ils se serrèrent la main au-dessus de l’eau, brièvement, comme deux hommes qui ont fini un travail.",
          "mentions": [
            "lucien-astier",
            "la-monographie",
            "la-nuit-de-fevrier-1985"
          ]
        },
        {
          "id": "c9-b18",
          "text": "Cent soixante-deux. Cent quatre-vingt-sept. Deux cent trois. Vers dix heures et demie, la fanfare de Vaubrun commença à jouer sur la rive gauche, près du pont, et les sons lui arrivaient par-dessus l’eau en morceaux, un cuivre, un roulement, le vent qui emportait le reste. Il vit la foule s’assembler à la tête du pont, côté bourg, les drapeaux, une estrade, des chaises pliantes. Il chercha Inès Marchal dans la foule et la trouva : il l’avait passée à huit heures, en tailleur, ce qu’il ne lui avait jamais vu, et elle s’était placée au guindeau sans rien dire. De là-bas, elle regardait vers la cale avant de regarder vers le pont.",
          "mentions": [
            "le-pont",
            "ines-marchal",
            "vaubrun"
          ]
        },
        {
          "id": "c9-b19",
          "text": "Nadia descendit à onze heures cinquante. Elle avait fermé le café. Elle était seule ; Tom était passé depuis longtemps avec les autres enfants. Elle portait une robe sombre, des chaussures qui n’étaient pas des chaussures de café, et elle monta sur le bac sans regarder l’échelle, sans regarder l’eau, et elle vint se placer à côté de lui, au guindeau, là où personne ne se plaçait sauf Inès Marchal et Tom.",
          "mentions": [
            "tom-ferrand",
            "nadia-ferrand"
          ]
        },
        {
          "id": "c9-b20",
          "text": "Il décrocha la chaîne. La Patience prit son angle, légère, dans une eau parfaite, et il rendit un peu de guindeau pour qu’elle aille lentement, ce qu’il ne faisait jamais.",
          "mentions": [
            "la-patience",
            "le-guindeau"
          ]
        },
        {
          "id": "c9-b21",
          "text": "Nadia regardait devant elle. Ils étaient au milieu de l’eau quand elle parla.",
          "mentions": []
        },
        {
          "id": "c9-b22",
          "text": "— Lucien m’a donné le cahier.",
          "mentions": [
            "lucien-astier",
            "la-monographie"
          ]
        },
        {
          "id": "c9-b23",
          "text": "— Il me l’a dit.",
          "mentions": []
        },
        {
          "id": "c9-b24",
          "text": "— Elle ne m’a jamais rien dit. Ma mère.",
          "mentions": []
        },
        {
          "id": "c9-b25",
          "text": "— Elle avait ses raisons.",
          "mentions": []
        },
        {
          "id": "c9-b26",
          "text": "— Je sais. Elles sont dans le cahier aussi. Il a tout mis.",
          "mentions": []
        },
        {
          "id": "c9-b27",
          "text": "Le câble chantait juste. Elle posa la main sur le bordé, à côté de la sienne.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c9-b28",
          "text": "— Merci pour la traversée, dit-elle.",
          "mentions": []
        },
        {
          "id": "c9-b29",
          "text": "— Laquelle ?",
          "mentions": []
        },
        {
          "id": "c9-b30",
          "text": "— Les deux.",
          "mentions": []
        },
        {
          "id": "c9-b31",
          "text": "Il ne répondit rien. Il sut qu’elle n’attendait rien. Il redressa le bac. Il accosta comme on pose quelque chose de fragile sur une table. Elle descendit, et sur la passerelle elle se retourna, et elle dit, du ton dont elle annonçait que le pain était arrivé :",
          "mentions": []
        },
        {
          "id": "c9-b32",
          "text": "— Deux cent quatre.",
          "mentions": []
        },
        {
          "id": "c9-b33",
          "text": "Il la regarda.",
          "mentions": []
        },
        {
          "id": "c9-b34",
          "text": "— Tom compte aussi, dit-elle. Il t’a regardé faire. Il me fait le total tous les soirs.",
          "mentions": [
            "tom-ferrand"
          ]
        },
        {
          "id": "c9-b35",
          "text": "Et elle monta vers le pont, où la fanfare jouait, et il resta sur le bac, la main sur le guindeau, et il eut, pour la première fois de sa vie, l’impression d’avoir été compté.",
          "mentions": [
            "nadia-ferrand",
            "tom-ferrand",
            "la-monographie"
          ]
        },
        {
          "id": "c9-b36",
          "text": "Le cortège officiel arriva à midi moins cinq, comme la lettre le disait. Le sous-préfet, un homme jeune en costume clair, le conseiller départemental, Bernard Quéré en écharpe, deux adjoints, Delorme, qu’Aimé n’avait jamais vu et reconnut à sa façon de regarder le câble, Inès Marchal, et Lucien, que le maire avait pris par le bras. Douze personnes. Ils montèrent avec la solennité un peu gauche des gens qui n’ont pas l’habitude d’un bateau, et Quéré vint se placer à côté d’Aimé et lui serra la main devant tout le monde et ne dit rien, ce qui était la meilleure chose qu’il pouvait faire.",
          "mentions": [
            "aime-roussel",
            "lucien-astier"
          ]
        },
        {
          "id": "c9-b37",
          "text": "— Monsieur Roussel, dit le sous-préfet. C’est un honneur.",
          "mentions": []
        },
        {
          "id": "c9-b38",
          "text": "— Placez-vous à l’avant, monsieur. Ne vous penchez pas.",
          "mentions": []
        },
        {
          "id": "c9-b39",
          "text": "Il décrocha la chaîne pour la dernière fois. Il rendit du guindeau. La Patience se coucha dans l’angle et s’en alla, et il sentit sous ses pieds la portance venir, cette chose qu’il avait sentie quatre-vingt mille fois et qu’il n’avait jamais nommée, et il pensa que c’était l’eau qui portait et que ça n’avait jamais été autre chose, et que c’était très bien ainsi. Les officiels regardaient la rive droite venir. Inès Marchal, elle, regardait le guindeau, et ses mains dessus, et il vit qu’elle notait quelque chose sans carnet.",
          "mentions": [
            "bernard-quere",
            "la-depose"
          ]
        },
        {
          "id": "c9-b40",
          "text": "Il accosta aux Vergnes à midi une. Il mit la passerelle. Ils descendirent l’un après l’autre, et chacun, en passant devant lui, lui dit quelque chose, merci, bravo, félicitations, une belle page, et il répondit à chacun d’un signe de tête, et le dernier fut Lucien, qui ne dit rien et lui toucha l’épaule. Puis ils remontèrent le chemin de la rive droite vers le pont, où l’on couperait le ruban au milieu du tablier, et il les regarda s’éloigner, petits, en cortège, avec la fanfare qui reprenait de l’autre côté.",
          "mentions": [
            "le-pont",
            "les-vergnes"
          ]
        },
        {
          "id": "c9-b41",
          "text": "Il retira la passerelle. Il décrocha la chaîne. Et il fit ce qu’il n’avait jamais fait en quarante-deux ans : il partit à vide, sans personne à passer, sans rive à atteindre, et au milieu de l’Aubrance, à l’endroit exact où le câble avait sa flèche la plus basse, il reprit du guindeau jusqu’à ce que le point où la Patience était pendue fût juste au milieu, et le bac s’arrêta.",
          "mentions": [
            "laubrance",
            "la-patience"
          ]
        },
        {
          "id": "c9-b42",
          "text": "Il s’arrêta dans le courant, sans angle, sans portance, tenu par le seul câble de 1902 à huit mètres au-dessus de lui, et l’eau passa de chaque côté sans le prendre, et il resta là.",
          "mentions": [
            "la-traille"
          ]
        },
        {
          "id": "c9-b43",
          "text": "De là, il entendait tout. La fanfare qui s’arrêtait. Une voix amplifiée, celle du sous-préfet, dont il ne saisit que des mots : désenclavement, sécurité, avenir, territoire. Puis celle de Quéré, plus lente, qui portait mieux sur l’eau parce que c’était une voix d’ici. Il l’entendit dire la crue de 1856 et le pont de bois. Il l’entendit dire les enfants du car. Il l’entendit dire : « Ce pont, la commune l’a attendu cent soixante-dix ans. Mais il y a quelqu’un qui l’a demandé. Un habitant de Ferréol a écrit au département tous les ans pendant trente-neuf ans. Trente-neuf lettres, toujours la même demande. Il ne veut pas qu’on dise son nom. Alors je ne le dirai pas. Mais je dirai ceci : il n’a jamais demandé pour lui. »",
          "mentions": [
            "le-pont-de-bois",
            "la-crue-de-1856"
          ]
        },
        {
          "id": "c9-b44",
          "text": "Il y eut un silence sur le pont. Puis des applaudissements, longs, et il baissa la tête, et il regarda l’eau passer le long du bordé, droite, sans angle, indifférente, et il pensa que c’était la seule fois de sa vie où l’eau ne le portait pas, et que c’était juste.",
          "mentions": [
            "les-trente-neuf-lettres",
            "bernard-quere"
          ]
        },
        {
          "id": "c9-b45",
          "text": "Il entendit couper le ruban. Il entendit la fanfare reprendre. Puis un autre bruit, qu’il connaissait sans l’avoir jamais entendu à cet endroit : des moteurs. Des voitures, une file, qui démarraient à la tête du pont, côté bourg, et roulaient sur le tablier, lentement, au pas, avec des klaxons, et passaient la rivière en trente secondes, et arrivaient aux Vergnes, et continuaient, comme si c’était une route.",
          "mentions": [
            "les-vergnes",
            "ferreol"
          ]
        },
        {
          "id": "c9-b46",
          "text": "Il rendit du guindeau. La Patience prit son angle, la dernière fois, et le porta vers la rive gauche, doucement, sans qu’il ait rien à faire que la laisser aller. Il toucha la cale. Il passa la chaîne dans l’anneau. Il mit la passerelle, par habitude, puis la retira, parce qu’il n’y avait personne.",
          "mentions": [
            "la-patience",
            "le-guindeau"
          ]
        },
        {
          "id": "c9-b47",
          "text": "Il ne compta pas. Une traversée à vide ne comptait pas ; il n’y avait personne à passer. Il s’assit sur le banc de l’avant, à l’endroit des vieux, et il regarda le pont, où les gens marchaient maintenant d’une rive à l’autre en se croisant, en riant, en s’arrêtant au milieu pour regarder en bas, et il regarda le câble au-dessus de lui, qui avait cessé de chanter parce que rien ne roulait plus dessus, et qui n’était plus qu’un trait dans le ciel de septembre.",
          "mentions": [
            "le-pont",
            "la-traille"
          ]
        }
      ]
    },
    {
      "id": "chapitre-10",
      "number": 10,
      "title": "L’autre rive",
      "blocks": [
        {
          "id": "c10-b01",
          "text": "La dépose prit trois jours, comme le planning le disait, et ce fut propre. Inès Marchal avait exigé qu’on ne coupe pas le câble ; on le détendit au treuil, sur la rive gauche, tour après tour, pendant une matinée entière, et il descendit vers l’eau en s’alourdissant, toucha la surface au milieu, s’y coucha, et on le ramena sur le pré communal où on l’enroula, cent dix mètres d’acier de 1902, en une couronne haute comme un homme. Puis les portiques. On les déboulonna au lieu de les découper. Le montant tordu de la rive droite, avec sa pièce de fer réparée en août 1985, fut descendu à part, et Aimé, qui regardait depuis la cale sans qu’on lui ait demandé de venir ni de partir, vit Inès Marchal le faire poser sur des cales, de côté, et non sur la remorque de ferraille.",
          "mentions": [
            "la-depose",
            "la-traille",
            "ines-marchal"
          ]
        },
        {
          "id": "c10-b02",
          "text": "Le chariot fut descendu le troisième jour. Deux poulies, un châssis en fonte, un axe, quatre cents kilos de mécanique simple. On le mit sur une palette. Il ne figurait pas dans le lot 4, qui disait câble et portiques ; il n’était nommé nulle part ; personne, en 1902, n’avait pensé qu’il faudrait un jour un mot pour ce qui roulait entre le ciel et la barque. Le soir du troisième jour, la voiture grise descendit à la cale avec le coffre ouvert, et la palette était dedans, et Inès Marchal en descendit avec sur le visage l’expression de quelqu’un qui a lu un marché très attentivement.",
          "mentions": [
            "la-cale"
          ]
        },
        {
          "id": "c10-b03",
          "text": "— Le lot dit dépose et évacuation du câble porteur et des portiques. Il ne dit rien du chariot.",
          "mentions": []
        },
        {
          "id": "c10-b04",
          "text": "— Il est au département.",
          "mentions": []
        },
        {
          "id": "c10-b05",
          "text": "— Le département a été informé qu’une pièce mécanique non inventoriée avait été remise à l’ancien exploitant à titre conservatoire. Delorme a répondu : bien noté. C’est un homme qui travaille tard.",
          "mentions": []
        },
        {
          "id": "c10-b06",
          "text": "Ils le posèrent sous l’appentis de la maison du passeur, à côté du bois. Aimé mit la main sur une des poulies et la fit tourner. Elle tournait encore. Elle n’avait plus rien sur quoi rouler et elle tournait encore, et il pensa que c’était la définition exacte de ce qu’il était maintenant, et qu’il n’en était pas malheureux.",
          "mentions": [
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c10-b07",
          "text": "Le procès-verbal de réception fut signé le trente septembre, dans le bungalow de la base vie, par Delorme pour le département, Inès pour l’entreprise, et Quéré, qui n’avait pas à le signer mais qu’on avait invité. Il faisait deux pages. À la fin, sous la rubrique « Observations de l’entreprise », Inès avait écrit six lignes, que Delorme lut deux fois et signa sans les faire retirer, ce qui, elle le savait, était la seule chose qu’elle pouvait demander à un homme comme lui : « L’entreprise signale que l’embarcation dite La Patience, en bon état, présente un intérêt patrimonial et mémoriel pour la commune. Le conseil municipal de Ferréol a délibéré le 25 septembre pour en demander la cession à titre gratuit. L’entreprise propose de la haler à sec sur le pré communal, à ses frais, dans le cadre du repli de chantier, ce qui répond aux réserves de sécurité exprimées par le maître d’ouvrage. »",
          "mentions": [
            "la-base-vie",
            "bernard-quere",
            "la-patience"
          ]
        },
        {
          "id": "c10-b08",
          "text": "Le département céda. Le premier octobre, on hala la Patience hors de l’eau, avec le treuil qui avait détendu le câble, sur des rails de bois graissés, et elle monta sur la berge en gémissant de toute sa coque comme une bête qu’on sort de son élément, et on la cala sur le pré, à vingt mètres de la cale, à côté de la couronne de câble, la proue vers la rivière. Aimé regarda faire. Quand ce fut fini, il monta à bord, ce qui ne se disait plus puisqu’elle était sur l’herbe, et il s’assit sur le banc de l’avant, et de là on voyait l’eau, et le pont, et l’autre rive.",
          "mentions": [
            "aime-roussel",
            "la-traille"
          ]
        },
        {
          "id": "c10-b09",
          "text": "— À sec, dit-il.",
          "mentions": []
        },
        {
          "id": "c10-b10",
          "text": "— Je sais, dit Inès, qui était en bas. C’est ce que j’ai pu.",
          "mentions": [
            "ines-marchal"
          ]
        },
        {
          "id": "c10-b11",
          "text": "— C’est un bateau. Il flotte.",
          "mentions": []
        },
        {
          "id": "c10-b12",
          "text": "— Il ne flotte plus.",
          "mentions": []
        },
        {
          "id": "c10-b13",
          "text": "— Il flotte dans la tête. C’est là qu’il faut qu’il flotte.",
          "mentions": []
        },
        {
          "id": "c10-b14",
          "text": "Elle ne sut pas s’il parlait de lui ou du bateau, et elle comprit que c’était la même chose.",
          "mentions": [
            "aime-roussel"
          ]
        },
        {
          "id": "c10-b15",
          "text": "Lucien franchit le pont pour la première fois le jeudi suivant. Il avait refusé de le faire le jour de l’inauguration, avec la foule ; il avait attendu son jour, son heure, sept heures du matin, et il partit du bourg à vélo, avec le seau, la brosse et les dahlias, par la nouvelle route qui descendait au pont. Aimé le vit de la cale. Le vieil homme pédala jusqu’au milieu du tablier, s’arrêta, descendit de vélo, et resta là, appuyé au garde-corps neuf, à regarder en bas. Il resta longtemps. Une voiture le dépassa, puis une autre. Il ne bougea pas. Puis il remit sa casquette, remonta en selle, et continua vers le cimetière, et Aimé pensa qu’il n’avait jamais vu quelqu’un traverser aussi lentement une chose faite pour aller vite.",
          "mentions": [
            "lucien-astier",
            "le-pont"
          ]
        },
        {
          "id": "c10-b16",
          "text": "Le soir, Lucien s’arrêta à la maison du passeur en revenant, ce qu’il n’avait jamais fait non plus.",
          "mentions": [
            "la-maison-du-passeur"
          ]
        },
        {
          "id": "c10-b17",
          "text": "— Trente secondes, dit-il. J’ai mis onze minutes.",
          "mentions": []
        },
        {
          "id": "c10-b18",
          "text": "— C’est bien.",
          "mentions": []
        },
        {
          "id": "c10-b19",
          "text": "— Ce n’est pas pareil. On regarde l’eau d’en haut. Elle passe sous vous. Elle ne vous porte plus. Vous n’êtes plus dedans.",
          "mentions": []
        },
        {
          "id": "c10-b20",
          "text": "— Non.",
          "mentions": []
        },
        {
          "id": "c10-b21",
          "text": "— Mais on la voit mieux.",
          "mentions": []
        },
        {
          "id": "c10-b22",
          "text": "Il but le verre qu’Aimé lui servit, honnête, du plateau, et il regarda par la fenêtre la Patience sur son pré, dans le soir.",
          "mentions": [
            "la-patience"
          ]
        },
        {
          "id": "c10-b23",
          "text": "— Tu me passeras quand même.",
          "mentions": []
        },
        {
          "id": "c10-b24",
          "text": "— Je te passerai.",
          "mentions": []
        },
        {
          "id": "c10-b25",
          "text": "— Sur celle-là.",
          "mentions": []
        },
        {
          "id": "c10-b26",
          "text": "— Je la remettrai à l’eau une nuit. J’ai un treuil et un pré en pente. Le département ne travaille pas la nuit. Sauf Delorme.",
          "mentions": []
        },
        {
          "id": "c10-b27",
          "text": "Lucien rit, ce qui lui arrivait rarement, et il repartit sur son vélo dans la nuit qui venait, par le pont, vers le bourg, et le bruit des pneus sur le tablier neuf dura un moment, puis plus rien.",
          "mentions": [
            "lucien-astier",
            "le-pont",
            "le-cimetiere"
          ]
        },
        {
          "id": "c10-b28",
          "text": "Inès partit le deux octobre. Elle avait rendu la clé de la base vie, replié les bungalows, rempli le coffre de la voiture grise de ses classeurs et de son sac. Elle traversa à pied, une dernière fois, non par le bac qui était sur l’herbe, mais par le pont, pour aller dire au revoir à Nadia, qui lui donna un pain et un fromage et l’embrassa comme on embrasse quelqu’un qu’on ne reverra pas et qu’on a aimé quand même. Tom n’était pas là ; il était au collège, il avait pris le car à Vaubrun, il avait traversé le pont à sept heures et quart dans un bus jaune, comme tous les matins depuis le lundi vingt et un, et Nadia dit qu’il regardait chaque fois par la vitre l’endroit où il n’y avait plus de câble.",
          "mentions": [
            "tom-ferrand",
            "nadia-ferrand"
          ]
        },
        {
          "id": "c10-b29",
          "text": "Puis Inès redescendit à la cale, où Aimé l’attendait sans le lui avoir dit, debout à côté de la Patience, sur le pré.",
          "mentions": [
            "aime-roussel",
            "ines-marchal"
          ]
        },
        {
          "id": "c10-b30",
          "text": "— Vous allez où ?",
          "mentions": []
        },
        {
          "id": "c10-b31",
          "text": "— Un échangeur, près de Dijon. Dix-huit mois.",
          "mentions": []
        },
        {
          "id": "c10-b32",
          "text": "— C’est loin de l’eau.",
          "mentions": []
        },
        {
          "id": "c10-b33",
          "text": "— Oui.",
          "mentions": []
        },
        {
          "id": "c10-b34",
          "text": "Ils restèrent un moment. Elle regardait le bac ; il regardait la rivière. Elle ne sortit pas son carnet.",
          "mentions": [
            "laubrance"
          ]
        },
        {
          "id": "c10-b35",
          "text": "— Je voulais vous dire, dit-elle. J’ai fait sept chantiers. J’ai su partir de tous. Celui-là, je ne sais pas.",
          "mentions": []
        },
        {
          "id": "c10-b36",
          "text": "— Vous savez. Vous montez dans la voiture, vous passez le pont, vous ralentissez au milieu, et vous continuez.",
          "mentions": [
            "le-pont"
          ]
        },
        {
          "id": "c10-b37",
          "text": "— Je ralentirai ?",
          "mentions": []
        },
        {
          "id": "c10-b38",
          "text": "— Tout le monde ralentit au milieu. Lucien a raison. On la voit mieux.",
          "mentions": [
            "lucien-astier"
          ]
        },
        {
          "id": "c10-b39",
          "text": "Elle lui tendit la main, et il la prit, et ils se serrèrent la main comme le vieil instituteur et lui l’avaient fait sur la passerelle, brièvement, entre gens qui ont fini un travail.",
          "mentions": []
        },
        {
          "id": "c10-b40",
          "text": "— Merci pour la traversée, dit-elle.",
          "mentions": []
        },
        {
          "id": "c10-b41",
          "text": "— Merci pour le procès-verbal.",
          "mentions": []
        },
        {
          "id": "c10-b42",
          "text": "La voiture grise monta au bourg, prit la nouvelle route, descendit au pont. Il la regarda rouler sur le tablier. Au milieu, elle ralentit, presque à s’arrêter, puis reprit, et passa aux Vergnes, et disparut entre les chênes de la route de Vaubrun, et il l’entendit longtemps.",
          "mentions": [
            "ines-marchal",
            "nadia-ferrand",
            "tom-ferrand",
            "chez-ferrand",
            "vaubrun"
          ]
        },
        {
          "id": "c10-b43",
          "text": "Le soir, Tom vint. Il posa son cartable sur l’herbe, à côté de la Patience, et il ne monta pas dessus, parce qu’il avait onze ans et savait déjà qu’un bateau sur l’herbe n’est plus tout à fait un bateau. Il dit qu’il avait un exposé à faire en histoire sur un monument de sa commune et qu’il voulait faire le bac, et Aimé dit que le bac n’était pas un monument, et Tom dit : « Si. Maintenant, si. » Et Aimé laissa dire.",
          "mentions": [
            "aime-roussel",
            "la-patience"
          ]
        },
        {
          "id": "c10-b44",
          "text": "— Tu viens ? dit le garçon. Sur le pont. Tu n’y es jamais allé.",
          "mentions": [
            "le-pont"
          ]
        },
        {
